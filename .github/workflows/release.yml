# 06 §5.2 release workflow — budget 35 min per OS
#
# a tag goes **only on a main commit that passed CI** (branch protection). this workflow
# only creates a draft release; a human runs the 3-OS install smoke test, then publishes it (§5.3).
#
# no signing, no notarization — per D13, held off until 500 downloads or 10 "it won't open" reports.
# auto-update is off too (§5.5): secrets of the `TAURI_SIGNING_PRIVATE_KEY` kind are not
# put here. even the name alone would read as "about to be turned on", so it stays out.
# the user-facing workaround copy is owned by the README (§5.4).
#
# every action is pinned to a commit SHA (06 §4.4).

name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the draft release · upload assets

env:
  # same combination as ci.yml. per 06 §5.2: "pnpm·node setup is identical to ci.yml".
  NODE_VERSION: '26'
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.args }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # 06 §5.2 writes x86_64 macOS as `macos-13`, but that runner has been retired.
          # the current Intel macOS runner is `macos-15-intel` (checked against the actionlint 1.7.12 label list).
          - { os: macos-14, target: aarch64-apple-darwin, args: '--target aarch64-apple-darwin' }
          - { os: macos-15-intel, target: x86_64-apple-darwin, args: '--target x86_64-apple-darwin' }
          - { os: windows-2022, target: '', args: '' }
          - { os: ubuntu-22.04, target: '', args: '' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux WebView deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          # macOS passes an explicit `--target`, so install that target up front.
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
          key: ${{ matrix.os }}-${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # no signing key — until 06 §5.5 is turned on.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Chickadee ${{ github.ref_name }}
          releaseBody: See the matching section of CHANGELOG.md
          releaseDraft: true
          prerelease: false
          # the updater is off, so neither latest.json nor .sig is uploaded (§5.5).
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}

  # 06 §5.3 item 4 — attach SHA256SUMS.txt to the draft. while there is no signing,
  # it is the only way a user can verify integrity (the §5.4 copy points at this).
  checksums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: download draft assets and hash them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          # a draft has no tag on a commit yet, but gh finds the draft by its "pending tag name"
          # (cli/cli pkg/cmd/release/shared/fetch.go FetchRelease).
          gh release download "$TAG" --clobber
          # remove it so a previous SHA256SUMS.txt is not mixed in on a re-run.
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
