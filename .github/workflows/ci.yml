# 06 §5.1 PR workflow — budget 12 min
#
# every job in 06 §5.1 now runs: lint-type-unit · audit · build-3os · integration ·
# design-gates · e2e-linux. The last two were comments until M5, on the principle that a
# skipped job counts as "success" for branch protection and makes coverage we do not have
# look like coverage we do. The one thing still held back for that reason is
# `pnpm test:visual` — see the note on design-gates.
#
# every action is pinned to a commit SHA (06 §4.4). the tag beside it is for humans.

name: ci

on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 06 §5.1 says Node 22, but the combination this repo actually runs on is Node 26
  # (dev machine: Node 26.7.0 · pnpm 10.33.2 · rustc 1.98.0).
  # the pnpm version is not written here — package.json's `packageManager` is the source of truth.
  NODE_VERSION: '26'
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 06 §5.1 budget ≤ 4 min
  # ───────────────────────────────────────────────────────────────────────────
  lint-type-unit:
    name: lint · type · unit
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # this job compiles the Tauri app crate too, via `cargo clippy --all-targets` —
      # the ubuntu runner has no GTK3/WebKitGTK headers, so gdk-sys dies in pkg-config.
      - name: Linux WebView deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # with no version it reads packageManager from package.json — one source of truth.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # pinned by SHA, so the toolchain cannot be read from the ref — state it explicitly.
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .

      - run: pnpm install --frozen-lockfile

      - name: lint (eslint + stylelint)
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      # `apps/desktop/src/data/blocks.test.ts` reads the fixture repository's real
      # source files (M3: the T1 candidates come out of it). Two seconds here beats
      # committing 12k generated lines, and the test skips itself if it is missing.
      - name: build the fixture repository the T1 tests read
        run: bash scripts/make-fixture-repo.sh projectox-like

      - name: TS unit tests
        run: pnpm test:unit
        # the coverage gate (06 §1.8, `--coverage` + cargo-llvm-cov) is turned on in M1,
        # once there is code to measure. turning it on now would drop to 0% on empty packages.

      - name: design token sync check
        run: pnpm design:check

      - name: contrast ratio check
        run: pnpm check:contrast

      # 06 §5.3-3 — the tag, the root package.json and the three version files are one value.
      # release.yml checks this too, but at tag time: a drift merged into main is then only
      # found when someone tries to cut a release.
      - name: version files agree
        run: pnpm version:check

      # 06 §7.1 — THIRD_PARTY_NOTICES.md is generated. A lockfile change that does not
      # regenerate it ships a notice naming the wrong versions. This needs node_modules,
      # which is why it is here and not in `audit`.
      - name: THIRD_PARTY_NOTICES.md is current
        run: pnpm licenses:check

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  # ───────────────────────────────────────────────────────────────────────────
  # 06 §4.4 · §5.1 budget ≤ 1 min
  # ───────────────────────────────────────────────────────────────────────────
  audit:
    name: audit
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: gitleaks detect --no-git
        # placed ahead of pnpm install — walking node_modules makes the scan 30x slower
        # and yields nothing but false positives. the binary is pinned by both version and sha256 (06 §4.4).
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --no-git --redact --config .gitleaks.toml
          rm -f gitleaks gitleaks.tar.gz

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # no `cache: pnpm` here — this job never runs `pnpm install`, so no store is created and
      # the post-step cache save fails the whole job with "path not found". there is nothing to cache either.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: pnpm audit
        run: pnpm audit --audit-level=high

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          # fetch the upstream release binaries instead of building from source — only that keeps the 1 min budget.
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2

      - name: cargo audit
        run: cargo audit

      - name: cargo deny check
        run: cargo deny check

      - name: package.json audit ignore expiry check (06 §4.4)
        # Same rule as deny.toml: an ignore records id · reason · expiry, and an expired
        # one fails CI. pnpm's ignoreGhsas has no reason or expiry field, so both live in
        # `pnpm.auditConfig._reasons` and are read here by machine rather than by trust.
        run: |
          python3 - <<'PY'
          import datetime, json, pathlib, re, sys

          cfg = json.loads(pathlib.Path("package.json").read_text(encoding="utf-8"))
          audit = cfg.get("pnpm", {}).get("auditConfig", {})
          ignored = audit.get("ignoreGhsas", [])
          reasons = audit.get("_reasons", {})
          today = datetime.date.today()
          problems = []

          for ident in ignored:
              reason = reasons.get(ident)
              if not reason:
                  problems.append(f"{ident}: no reason — add one to pnpm.auditConfig._reasons")
                  continue
              expiry = re.search(r"expires:\s*(\d{4}-\d{2}-\d{2})", reason)
              if not expiry:
                  problems.append(f"{ident}: no expiry date — write 'expires: YYYY-MM-DD' in the reason")
                  continue
              when = datetime.date.fromisoformat(expiry.group(1))
              if when < today:
                  problems.append(f"{ident}: expired on {when} — judge it again, then drop or extend it")

          for line in problems:
              print(f"FAIL {line}")
          if problems:
              sys.exit(1)
          print(f"ok   pnpm.auditConfig.ignoreGhsas {len(ignored)} entries, no expired exception")
          PY

      - name: deny.toml exception expiry check (06 §4.4)
        # cargo-deny has no expiry field. if the expiry date lives only as prose inside reason,
        # a "parked here for now" ignore stays forever — so we read it by machine here.
        run: |
          python3 - <<'PY'
          import datetime, pathlib, re, sys

          text = pathlib.Path("deny.toml").read_text(encoding="utf-8")
          block = re.search(r"^ignore\s*=\s*\[(.*?)^\]", text, re.S | re.M)
          entries = re.findall(r"\{[^}]*\}", block.group(1)) if block else []
          today = datetime.date.today()
          problems = []

          for entry in entries:
              ident = re.search(r'id\s*=\s*"([^"]+)"', entry)
              expiry = re.search(r"expires:\s*(\d{4}-\d{2}-\d{2})", entry)
              if not ident:
                  problems.append(f"exception with no id: {entry.strip()}")
                  continue
              if not expiry:
                  problems.append(f"{ident.group(1)}: no expiry date — write 'expires: YYYY-MM-DD' in reason")
                  continue
              when = datetime.date.fromisoformat(expiry.group(1))
              if when < today:
                  problems.append(f"{ident.group(1)}: expired on {when} — judge it again, then drop or extend it")

          for line in problems:
              print(f"FAIL {line}")
          if problems:
              sys.exit(1)
          print(f"ok   advisories.ignore {len(entries)} entries, no expired exception")
          PY

      - name: Rust budget · forbidden words (01 §1.1)
        run: bash scripts/check-rust-budget.sh

      # 06 §3.5 — "put a mock key in and grep every produced file". The full form of this
      # runs in E8, which needs a real app and a real keychain. This is the static half:
      # the canary the key tests store must never appear outside a test file. It catches the
      # cheap way a key leaks — a debug print, a fixture, a committed log.
      - name: mock key does not escape its tests (06 §3.5)
        run: |
          set -uo pipefail
          # assembled from two halves so this file is not itself a hit.
          canary="sk-test-CHICKADEE""-LEAK-CANARY"
          hits=$(grep -rIl --exclude-dir=node_modules --exclude-dir=target \
                   --exclude-dir=.git --exclude='*.test.ts' --exclude='*.test.tsx' \
                   "$canary" . || true)
          if [ -n "$hits" ]; then
            echo "FAIL the mock key appears outside a test file:" >&2
            echo "$hits" >&2
            exit 1
          fi
          echo "ok   mock key grep 0"


  # ───────────────────────────────────────────────────────────────────────────
  # M0 exit condition — "the empty window opens on 3 OSes".
  # this job is not in §5.1 of the doc. waiting for the release (§5.2) would mean learning
  # at tag time that 3-OS is broken, so we break it earlier, on the PR, with a debug build.
  # ───────────────────────────────────────────────────────────────────────────
  build-3os:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 40 was enough until M3 added three grammar crates (python · go · rust). The
    # ubuntu build then finished the compile and the artifact upload but was cut
    # while *saving* the Rust cache — a bigger `target/` costs minutes to pack, and
    # 29 min of compile plus that save crossed the cap. The 12-min budget in
    # 06 §5.1 is the fast lane (lint · type · unit), not this matrix.
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux WebView deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
          key: ${{ matrix.os }}

      - run: pnpm install --frozen-lockfile

      # macOS bundles the .app but not the .dmg. This job answers "does the app
      # build and bundle on three OSes" (D53); a dmg is a release artifact, and
      # bundle_dmg.sh drives hdiutil, which fails intermittently on a shared
      # runner for reasons that have nothing to do with this code. release.yml
      # makes the dmg, where a retry is cheap and a flake is visible.
      - name: tauri build --debug
        run: pnpm tauri build --debug ${{ matrix.os == 'macos-14' && '--bundles app' || '' }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chickadee-debug-${{ matrix.os }}
          # unsigned (06 §5.4), so this is not a distributable — it is here to check "does it open".
          path: |
            target/debug/bundle/**
            target/debug/chickadee-app
            target/debug/chickadee-app.exe
          if-no-files-found: warn
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # 06 §5.1 budget ≤ 3 min. A change to fixtures/ipc means the Rust contract moved.
  # ───────────────────────────────────────────────────────────────────────────
  integration:
    name: integration
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the pipeline test lives in the tauri app crate, so this job links tauri
      # too — without the GTK3/WebKitGTK headers gdk-sys dies in pkg-config.
      - name: Linux WebView deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .

      - name: build the fixture repositories
        run: |
          bash scripts/make-fixture-repo.sh tiny
          bash scripts/make-fixture-repo.sh projectox-like

      # -p is needed: `--test pipeline` alone does not say which package owns it.
      # chickadee-parse carries the goldens, the insta snapshots, the dictionary
      # queries, the hostile input and the grammar quality measurement.
      - name: pipeline + parser tests
        run: |
          cargo test --locked -p chickadee-app --test pipeline
          cargo test --locked -p chickadee-parse

      - name: the IPC dump matches what is committed
        run: git diff --exit-code fixtures/ipc

# ═══════════════════════════════════════════════════════════════════════════════
# below are the jobs turned on in M1/M2. the steps from 06 §5.1 are preserved verbatim.
# the reason each one cannot be turned on yet is on the block's first line — an empty job
# that passes over artifacts that do not exist is less honest than not appearing in the
# check list at all.
# ═══════════════════════════════════════════════════════════════════════════════
#
  # ───────────────────────────────────────────────────────────────────────────
  # 06 §5.1 budget ≤ 3 min, rules in 06 §2. Seven gates on the real screens, driven
  # through the Node IPC bridge (D108). `pnpm test:gates` bakes the seed first.
  #
  # `pnpm test:visual` is NOT here yet: the 40 baseline screenshots must be generated
  # on a Linux runner first (06 §1.7 keeps one OS only), and a job with no baseline
  # fails every run. The procedure is in tests/visual/README.md.
  # ───────────────────────────────────────────────────────────────────────────
  design-gates:
    name: design-gates
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # both engines — the config has a `webkit` project (WKWebView's stand-in, 05 §11)
      # and chromium alone cannot run it.
      - name: playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      # 06 §2 — the static half of the motion ceiling. The runtime half is in test:gates.
      - name: motion ceiling (static)
        run: pnpm check:motion

      - run: pnpm test:gates

      # the 15 mockIPC scenarios of 05 §11 — same harness, same two engines, retries 0.
      - run: pnpm test:e2e-ui

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # 06 §5.1 · §1.5 — E1~E8 on the real binary. Blocks on **Linux only** (06 §1.1):
  # macOS WKWebView has no WebDriver and Windows is covered by the release smoke test (D13).
  #
  # This job is where E1~E8 run for the first time — they cannot run on a developer's
  # macOS machine at all, because `tauri-driver` supports Linux and Windows only.
  # ───────────────────────────────────────────────────────────────────────────
  e2e-linux:
    name: e2e-linux
    runs-on: ubuntu-22.04
    # 20 in the doc, 30 here: a cold Rust build of the app is inside this job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # beyond the WebView deps: `webkit2gtk-driver` for tauri-driver, `xvfb` for a display,
      # `strace` for E1's socket count, and dbus + gnome-keyring + secret-tool for E8's
      # mock keychain (a bare runner has no Secret Service).
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev \
            webkit2gtk-driver xvfb strace gnome-keyring libsecret-tools dbus-x11

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .

      - run: cargo install tauri-driver --locked

      - run: pnpm install --frozen-lockfile

      # E4~E8 boot on a DB that already has a repo registered; the seed's repo row is
      # rewritten to point at this fixture. E2's native GTK folder dialog is not drivable
      # by WebDriver, which is why E2 and E3 are not written at all (see tests/e2e/specs).
      - run: bash scripts/make-fixture-repo.sh tiny

      - run: pnpm tauri build --debug

      - run: xvfb-run -a bash tests/e2e/scripts/with-keyring.sh pnpm test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-linux
          # E1's socket census — the file the "zero sockets on first run" claim rests on.
          path: test-results/e1-sockets.json
          if-no-files-found: warn

# ── the nightly bench lives in `.github/workflows/bench.yml` (06 §1.6 · §5.1),
#    cron '0 18 * * *' (03:00 KST). It is a separate workflow, not this file.
