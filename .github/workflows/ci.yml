#
# ── M2: tauri-driver + WebdriverIO 시나리오 E1~E8 이 생기면 켠다 ────────────────
#   필요한 것: tests/e2e/, package.json 의 test:e2e 스크립트, 그리고 창이 실제로
#              뜨는 앱. 06 §1.1 대로 **Linux 만** 차단한다.
#
#   e2e-linux:                         # 06 §5.1 예산 ≤ 8분, 시나리오는 06 §1.5
