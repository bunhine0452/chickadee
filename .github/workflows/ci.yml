#
# ── M2: 화면 골격 + tests/gates + 시각 기준선이 생기면 켠다 ─────────────────────
#   필요한 것: apps/desktop/src/devtools/audit.ts, tests/gates/, tests/visual/,
#              package.json 의 test:gates · test:visual 스크립트, playwright 의존성
#
