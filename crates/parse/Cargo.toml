[package]
name = "chickadee-parse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "tree-sitter shell: parse, run queries, flatten a tree"
publish = false

[dependencies]
# All grammar crates ride the same ABI and move together — bumping one alone is
# how a query silently starts matching nothing (03 §2.2).
tree-sitter = "0.25"
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-sequel = { version = "0.3", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-xml = { version = "0.7", optional = true }
serde = { workspace = true }
thiserror = { workspace = true }
streaming-iterator = "0.1"

[dev-dependencies]
# Test-only (D40): the app never reads YAML. These are outside the line budget.
serde_yaml = "0.9"
regex-lite = "0.1"
insta = "1.48.0"
serde_json.workspace = true

[features]
default = [
  "lang-typescript", "lang-javascript", "lang-sql", "lang-python", "lang-go", "lang-rust",
  "lang-java", "lang-xml",
]
lang-typescript = ["dep:tree-sitter-typescript"]
lang-javascript = ["dep:tree-sitter-javascript"]
# A community grammar that breaks the build can be dropped from a release
# without touching any other language (01 §9).
lang-sql = ["dep:tree-sitter-sequel"]
lang-python = ["dep:tree-sitter-python"]
lang-go = ["dep:tree-sitter-go"]
lang-rust = ["dep:tree-sitter-rust"]
# D159 — Spring 리포의 심장이 Java 다. 라우트 애너테이션에서 HTTP 간선이 나온다.
lang-java = ["dep:tree-sitter-java"]
# MyBatis 매퍼가 XML 이고 그 안에 SQL 과 **자바 클래스 이름**이 산다 (D159).
lang-xml = ["dep:tree-sitter-xml"]

[lints]
workspace = true
