# gitleaks — 06 §4.4 「PR 스캔」
#
#   gitleaks detect --no-git --redact
#
# 기본 룰셋을 그대로 쓰고(useDefault) 「사람이 쓴 적 없는 파일」만 뺀다.
# 빼는 기준: 생성물·바이너리·락파일. **실제 소스와 설정은 절대 빼지 않는다.**
title = "Chickadee gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "빌드 산출물·의존성 캐시 — 사람이 쓰지 않는 파일이고, 여기서 나온 고엔트로피 문자열은 전부 오탐이다."
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)target/''',
  '''(^|/)dist/''',
  '''(^|/)\.venv/''',
  '''(^|/)fixtures/repos/[^/]+/''',
]

[[allowlists]]
description = "락파일 — 무결성 해시가 generic-api-key 로 잡힌다. 비밀은 락파일에 들어갈 수 없다."
paths = [
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)Cargo\.lock$''',
  '''(^|/)package-lock\.json$''',
]

[[allowlists]]
description = "바이너리 자산 — 폰트·아이콘·스크린샷."
paths = [
  '''\.(png|jpg|jpeg|gif|webp|ico|icns|woff2?|ttf|otf|pdf|zip|gz|db)$''',
]
