# gitleaks — 06 §4.4 "PR scan"
#
#   gitleaks detect --no-git --redact
#
# use the default ruleset as-is (useDefault) and exclude only "files no human ever wrote".
# the exclusion criteria: generated output · binaries · lockfiles.
# **real source and configuration are never excluded.**
title = "Chickadee gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "build output · dependency caches — files no human writes, and every high-entropy string from here is a false positive."
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)target/''',
  '''(^|/)dist/''',
  '''(^|/)\.venv/''',
  '''(^|/)fixtures/repos/[^/]+/''',
]

[[allowlists]]
description = "lockfiles — integrity hashes get flagged as generic-api-key. a secret cannot end up in a lockfile."
paths = [
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)Cargo\.lock$''',
  '''(^|/)package-lock\.json$''',
]

[[allowlists]]
description = "binary assets — fonts · icons · screenshots."
paths = [
  '''\.(png|jpg|jpeg|gif|webp|ico|icns|woff2?|ttf|otf|pdf|zip|gz|db)$''',
]
