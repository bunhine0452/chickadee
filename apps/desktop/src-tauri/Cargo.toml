[package]
name = "chickadee-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Chickadee desktop shell"
publish = false        # 배포하지 않는다 — cargo-deny 가 private 로 보고 wildcard·license 검사를 건너뛴다

[lib]
name = "chickadee_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# `cargo bench` 는 라이브러리 타깃 자체도 벤치 대상으로 잡는다. 그러면 이 라이브러리가
# 두 번 빌드되고(release 는 panic="abort", 벤치 하네스는 unwind) 두 rlib 이 같은
# 파일명을 노려 cargo issue #6313 의 「output filename collision」이 난다 — 어느 쪽이
# 이기느냐에 따라 벤치 링크가 깨진다. 이 라이브러리에 #[bench] 는 없으므로 끈다.
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chickadee-git = { workspace = true }
chickadee-parse = { workspace = true }
chickadee-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
thiserror = { workspace = true }
tracing = { workspace = true }
ignore = "0.4"
# Test-only: the app never reads YAML (D40). The pipeline test builds the real
# LangSpec from the shipped dictionary so the measurement is of the real thing.
serde_yaml = "0.9"

[dev-dependencies]
# `test` gives the mock runtime the pipeline test drives the job through.
tauri = { version = "2", features = ["test"] }
git2 = { version = "0.21", default-features = false }
ignore = "0.4"
# Test-only: the app never reads YAML (D40). The pipeline test builds the real
# LangSpec from the shipped dictionary so the measurement is of the real thing.
serde_yaml = "0.9"
# Bench-only. `default-features = false` drops plotters/rayon/html_reports — the
# bench writes its own JSON (bench/baseline.json) and scripts/bench.sh reads that,
# so the HTML report and its dependency tree buy nothing.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

# The ingest bench (03 §7 · 06 §1.6). `harness = false` because criterion brings its
# own main. Benches are outside the Rust line budget (01 §1.1 · D40).
[[bench]]
name = "ingest"
harness = false

[lints]
workspace = true
