[package]
name = "chickadee-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Chickadee desktop shell"
publish = false        # 배포하지 않는다 — cargo-deny 가 private 로 보고 wildcard·license 검사를 건너뛴다

[lib]
name = "chickadee_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chickadee-git = { workspace = true }
chickadee-parse = { workspace = true }
chickadee-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
thiserror = { workspace = true }
tracing = { workspace = true }
ignore = "0.4"

[dev-dependencies]
# `test` gives the mock runtime the pipeline test drives the job through.
tauri = { version = "2", features = ["test"] }
git2 = { version = "0.21", default-features = false }
ignore = "0.4"

[lints]
workspace = true
