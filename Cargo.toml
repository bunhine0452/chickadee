[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/chickadee-app/chickadee"

[workspace.dependencies]

chickadee-git = { path = "crates/git" }
chickadee-parse = { path = "crates/parse" }
chickadee-store = { path = "crates/store" }

anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# 러스트 예산(01 §1.1)은 얇은 껍데기를 강제한다 — 아래는 껍데기 코드에서 소음만 내는 린트다.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# #[tauri::command] 는 AppHandle·State 를 값으로 받도록 매크로가 시그니처를 정한다.
needless_pass_by_value = "allow"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
