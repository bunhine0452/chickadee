# cargo-deny — 06 §4.4 "dependency supply chain · secrets"
#
#   cargo deny check   → advisories · licenses · bans · sources
#
# every exception records a CVE/RUSTSEC id · a reason · an expiry date. an exception past
# its expiry is dropped and judged again — the rule that stops a "parked here for now"
# ignore from staying forever.

# ── graph ────────────────────────────────────────────────────────────────────
# only the same 4 targets as the release matrix (06 §5.2). without pinned targets the
# licenses of platform crates we never use get dragged in and blur the list.
[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ── vulnerabilities ──────────────────────────────────────────────────────────
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]

# 06 §4.4 — an exception records all three: **id · reason · expiry date**. cargo-deny has
# no expiry field, so the expiry is written inside reason in the form `expires: YYYY-MM-DD`,
# and the audit job in ci.yml finds past dates and fails CI. do not change the format.
#
# every exception below is `unmaintained` and not a known vulnerability (CVE).
# vulnerabilities and unsound advisories do not go here — those are solved by bumping the version.
ignore = [
    # ── 10 GTK3 bindings — tauri 2 → wry → webkit2gtk requires them on Linux.
    # not ours to choose (they all disappear at once when wry moves to GTK4).
    # on Linux the app already links against the system WebKitGTK, and these crates are its FFI shell.
    { id = "RUSTSEC-2024-0411", reason = "gdkwayland-sys — GTK3 binding, unmaintained. forced by tauri/wry. expires: 2027-03-31" },
    { id = "RUSTSEC-2024-0412", reason = "gdk — GTK3 binding, unmaintained. forced by tauri/wry. expires: 2027-03-31" },
    { id = "RUSTSEC-2024-0413", reason = "atk — GTK3 binding, unmaintained. forced by tauri/wry. expires: 2027-03-31" },
    { id = "RUSTSEC-2024-0414", reason = "gdkx11-sys — GTK3 binding, unmaintained. forced by tauri/wry. expires: 2027-03-31" },
    { id = "RUSTSEC-2024-0415", reason = "gtk — GTK3 binding, unmaintained. forced by tauri/wry. expires: 2027-03-31" },
    { id = "RUSTSEC-2024-0416", reason = "atk-sys — GTK3 binding, unmaintained. forced by tauri/wry. expires: 2027-03-31" },
    { id = "RUSTSEC-2024-0417", reason = "gdkx11 — GTK3 binding, unmaintained. forced by tauri/wry. expires: 2027-03-31" },
    { id = "RUSTSEC-2024-0418", reason = "gdk-sys — GTK3 binding, unmaintained. forced by tauri/wry. expires: 2027-03-31" },
    { id = "RUSTSEC-2024-0419", reason = "gtk3-macros — GTK3 binding, unmaintained. forced by tauri/wry. expires: 2027-03-31" },
    { id = "RUSTSEC-2024-0420", reason = "gtk-sys — GTK3 binding, unmaintained. forced by tauri/wry. expires: 2027-03-31" },

    # ── a proc-macro that runs at build time only. none of its code lands in the final binary.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error — unmaintained, build-only macro so absent from the artifact. expires: 2027-03-31" },

    # ── 5 unic-* crates — unicode tables. unmaintained, and no vulnerability.
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range — unmaintained, not a vulnerability. expires: 2027-03-31" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common — unmaintained, not a vulnerability. expires: 2027-03-31" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property — unmaintained, not a vulnerability. expires: 2027-03-31" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version — unmaintained, not a vulnerability. expires: 2027-03-31" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident — unmaintained, not a vulnerability. expires: 2027-03-31" },
]

# ── licenses ─────────────────────────────────────────────────────────────────
# the app is MIT. the list below holds only permissive licenses that "may be statically
# linked into an MIT app".
#
# the list was fitted by actually running the tauri 2 + 4 plugins + rusqlite (bundled) tree.
# unused entries only leave a `license-not-encountered` warning (they do not block CI).
[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    # the icu_* / unicode-ident family. always enters the tauri tree through url → idna.
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.93

# copyleft is **never allowed wholesale**. it is opened per crate, as an exception.
#
# MPL-2.0 is **file-level** weak copyleft: as long as we link the crate as-is without
# editing its source files, it does not infect our MIT code (MPL-2.0 §3.3 "Larger Work").
# if one ever needs editing, we look for a replacement crate rather than forking it.
# if an MPL/LGPL/GPL crate that is not listed here shows up, CI blocks it — that is the intent.
#
#   cssparser · cssparser-macros · dtoa-short · selectors
#       Servo's CSS selector engine. enters through the path where tauri-utils parses and
#       rewrites HTML in order to inject the CSP. our code never calls them directly.
#   option-ext
#       dirs → dirs-sys → option-ext. used to compute the app data directory path.
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[licenses.private]
# workspace crates are publish = false, so they are left out of the license check.
ignore = true

# ── bans · duplicates ────────────────────────────────────────────────────────
[bans]
# the tauri tree always has duplicate versions. set to deny, a PR would be blocked by
# someone else's tree that we cannot fix — keep it a warning and look at it in review.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

deny = [
    # 06 §4.4 — the app does not read .env. keys live in the OS keychain (§3.5).
    { crate = "dotenv", reason = "the app does not read .env (06 §4.4). keys live in the keychain." },
    { crate = "dotenvy", reason = "the app does not read .env (06 §4.4). keys live in the keychain." },
    # 06 §5.5 — the early 0.x releases do not ship the updater in the build.
    # an unsigned update channel is itself a supply chain vulnerability.
    { crate = "tauri-plugin-updater", reason = "auto-update stays off until the 06 §5.5 conditions are met." },
]
skip = []
skip-tree = []

# ── sources ──────────────────────────────────────────────────────────────────
# a git dependency is not audited and cannot be yanked. crates.io only.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
