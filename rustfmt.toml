# rustfmt — only options that work on the stable channel.
# putting in nightly-only ones (imports_granularity, group_imports, wrap_comments …) makes
# CI's `cargo fmt --check` either silently ignore them or spew warnings.
edition = "2021"
max_width = 100
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
