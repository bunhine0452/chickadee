schema: 1
id: sql/index
universal: null
name: { ko: "찾는 시간만 줄이는 곁표", en: "Index" }
token: "CREATE INDEX"
grammars: [sql, mybatis_sql]
framework: null
essential: true
difficulty: 3
prereq: [sql/where-filter, sql/order-by, cs/complexity]
confusions: []

dict:
  one_liner:
    ko: "답은 그대로 두고 찾는 시간만 바꾼다. 지워도 결과가 같다."
    en: "Changes lookup time and nothing about the answer. Delete it and results match."
  why:
    ko: >-
      {{site.line}}행이 만드는 것은 {{pick.3|code}} 의 {{pick.4|code}} 값을 <b>미리 줄 세워 둔 곁표</b>입니다.
      본표는 그대로예요. 여기서 중요한 것은 <b>답이 안 바뀐다</b>는 것입니다 — 이 줄을 지워도 같은 결과가
      나오고 앱만 느려집니다. 그래서 시험이 통과해도 이것이 빠진 것을 못 잡아요.
      대가도 값입니다: 행을 넣고 고칠 때마다 곁표도 같이 고쳐야 하고 자리도 더 씁니다.
      그리고 조건이 열 값을 <b>가공해서</b> 견주면 미리 세워 둔 차례가 안 맞아 곁표가 안 쓰입니다.
    en: >-
      What line {{site.line}} builds is a <b>side table with {{pick.4|code}} of {{pick.3|code}} lined
      up in advance</b>. The main table is untouched. The point is that <b>the answer does not
      change</b> — delete this line and the same results come back, only slower. That is why a passing
      test suite cannot tell you it is missing. It has a price: every write has to update the side
      table too, and it takes space. And a test that <b>transforms</b> the column before comparing does
      not match the arrangement, so the side table goes unused.
  trace:
    - ko: "{{site.line}}행이 {{pick.3|code}} 의 {{pick.4|code}} 값을 미리 줄 세운다."
      en: "Line {{site.line}} lines up {{pick.4|code}} of {{pick.3|code}} in advance."
    - ko: "그 열로 찾는 조회가 그 차례를 타고 좁혀 들어간다."
      en: "A query filtering on that column rides the arrangement to narrow down."
    - ko: "이 줄을 지워도 결과는 같고 시간만 늘어난다."
      en: "Delete this line and the results match; only the time grows."

rule:
  ko: "<b>답은 그대로, 시간만 바뀐다.</b> 그래서 없어도 시험이 통과한다."
  en: "<b>Same answer, different time.</b> That is why tests pass without it."
result:
  label: { ko: "미리 세워 두는 열", en: "the column lined up in advance" }
  value: "{{pick.4}}"
  note: { ko: "답은 안 바뀐다", en: "the answer is unchanged" }
ok:
  ko: >-
    {{pick.3|code}}{{pick.3|josa:을,를}} 찾는 조회가 빨라지고, 나오는 행은 이 줄이 있든 없든 같습니다.
  en: >-
    Lookups into {{pick.3|code}} get faster, and the rows returned are the same either way.
payoff:
  ko: >-
    이걸 알면 「느려졌다」는 문제를 코드가 아니라 스키마에서 찾는 눈이 생깁니다.
  en: >-
    Knowing this, a “it got slow” report sends you to the schema, not the code.
bridge:
  ko: >-
    다른 언어에서 목록 대신 해시표를 두는 일과 같습니다. 다른 것은 <b>본표를 안 바꾼다</b>는 것이에요.
  en: >-
    It is keeping a hash table beside a list, as elsewhere. What differs is that <b>the main table is
    untouched</b>.
misconceptions:
  - ko: "이걸 만들면 결과가 달라진다 — 답은 그대로고 시간만 바뀝니다."
    en: "Adding one changes the result — the answer is the same; only the time differs."
  - ko: "많이 만들수록 좋다 — 넣고 고칠 때마다 값을 치릅니다."
    en: "The more the better — every write pays for each of them."
  - ko: "조건에 그 열이 있으면 언제나 쓰인다 — 열을 가공해 견주면 안 쓰입니다."
    en: "Naming the column in a test always uses it — transforming the column does not."

meaning:
  - q:
      ko: "{{site.line}}행을 지우면 그 표를 쓰는 시험은 어떻게 될까요?"
      en: "If line {{site.line}} is deleted, what happens to the tests that use that table?"
    hint:
      ko: "바뀌는 것이 <b>답</b>인지 <b>시간</b>인지 정하세요."
      en: "Settle whether what changes is the <b>answer</b> or the <b>time</b>."
    options:
      - t:
          ko: "그대로 통과한다 — 답이 안 바뀌어서 시험이 못 잡는다"
          en: "They still pass — the answer is unchanged, so tests cannot catch it"
      - t:
          ko: "결과가 달라져서 걸린다"
          en: "The results change and the tests catch it"
        diag:
          t:
            ko: >-
              곁표는 <b>찾는 길</b>일 뿐 답을 만들지 않습니다. 답을 바꾸는 것은 제약 쪽이에요.
            en: >-
              A side table is a <b>path</b>, not a source of answers. Constraints are what change answers.
          edge:
            h: { ko: "가장 날카로운 자리 — 길이냐 답이냐", en: "The sharpest spot — the path or the answer" }
            code:
              - "CREATE INDEX ...   -- 길"
              - "UNIQUE (...)       -- 답"
      - t:
          ko: "그 표를 못 읽게 된다"
          en: "The table becomes unreadable"
        diag:
          t:
            ko: >-
              본표는 <b>따로</b> 있습니다. 곁표가 없어도 처음부터 훑어 읽으면 돼요.
            en: >-
              The main table stands <b>on its own</b>. Without the side table it is read from the start.
          edge:
            h: { ko: "가장 날카로운 자리 — 본표냐 곁표냐", en: "The sharpest spot — the main table or the side one" }
            code:
              - "-- 곁표는 없어도 된다"
      - t:
          ko: "차례가 사라져 순서가 뒤집힌다"
          en: "The arrangement goes and the order flips"
        diag:
          t:
            ko: >-
              결과의 차례를 약속하는 것은 <b>줄 세우는 절</b>입니다. 곁표는 약속하지 않아요 —
              다만 없던 약속을 우연히 지켜 주고 있었을 수는 있습니다.
            en: >-
              The <b>lining-up clause</b> is what promises an arrangement. A side table promises nothing,
              though it may have been keeping an unpromised one by accident.
          edge:
            h: { ko: "가장 날카로운 자리 — 약속이냐 우연이냐", en: "The sharpest spot — promised or accidental" }
            code:
              - "ORDER BY qty   -- 약속"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 {{pick.3|code}}{{pick.3|josa:을,를}} 찾는 <b>곁표</b>를 만듭니다."
      en: "Choose what goes in the blank. Line {{site.line}} builds a <b>side table</b> for {{pick.3|code}}."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "INDEX", mono: true }
      - t: "VIEW"
        mono: true
        diag:
          t:
            ko: >-
              <code>VIEW</code> 는 <b>조회에 이름</b>을 붙여 저장합니다 — 찾는 시간을 줄이는 물건이 아니에요.
            en: >-
              <code>VIEW</code> stores <b>a name for a query</b>; it is not a thing that cuts lookup time.
          edge:
            h: { ko: "가장 날카로운 자리 — 이름이냐 길이냐", en: "The sharpest spot — a name or a path" }
            code:
              - "CREATE VIEW recent AS SELECT ..."
              - "CREATE INDEX idx ON cart (qty)"
      - t: "TABLE"
        mono: true
        diag:
          t:
            ko: >-
              <code>TABLE</code> 을 만들면 <b>새 데이터</b>가 생깁니다. 곁표는 있는 데이터를 가리킬 뿐이에요.
            en: >-
              <code>TABLE</code> creates <b>new data</b>. A side table only points at data already there.
          edge:
            h: { ko: "가장 날카로운 자리 — 새 데이터냐 가리킴이냐", en: "The sharpest spot — new data or a pointer" }
            code:
              - "CREATE TABLE cart_copy AS SELECT ..."
              - "CREATE INDEX idx ON cart (qty)"
      - t: "TRIGGER"
        mono: true
        diag:
          t:
            ko: >-
              <code>TRIGGER</code> 는 행이 바뀔 때 <b>다른 문장을 돌립니다</b> — 찾기와 상관이 없어요.
            en: >-
              <code>TRIGGER</code> <b>runs other statements</b> when rows change; lookups are not its concern.
          edge:
            h: { ko: "가장 날카로운 자리 — 찾기냐 반응이냐", en: "The sharpest spot — lookup or reaction" }
            code:
              - "CREATE TRIGGER ... AFTER INSERT ..."

why_gate:
  q:
    ko: "{{site.line}}행은 왜 <b>{{pick.4|code}} 열</b>에 곁표를 걸었을까요?"
    en: "Why does line {{site.line}} build the side table on <b>{{pick.4|code}}</b>?"
  choices:
    - t:
        ko: "그 열로 찾거나 줄 세우는 조회가 있어서 — 안 쓰는 열에 걸면 값만 든다"
        en: "Because queries filter or line up by it — on an unused column it is pure cost"
      ok: true
      fb:
        ko: "그 방향입니다. 열 둘을 함께 거는 곁표가 언제 나은지도 적어 보세요."
        en: "That is the direction. Say when a side table over two columns is the better trade."
    - t:
        ko: "값이 다양한 열이라서"
        en: "Because the column has many distinct values"
      ok: false
      fb:
        ko: "다양함은 <b>얼마나 도움이 되나</b>를 정할 뿐입니다. 먼저 그 열로 찾아야 해요."
        en: "Distinctness only sets <b>how much it helps</b>. Something must query it first."
    - t:
        ko: "기본키라서"
        en: "Because it is the primary key"
      ok: false
      fb:
        ko: "기본키에는 대개 이미 걸려 있습니다. 따로 만든 것은 <b>다른 이유</b>예요."
        en: "A primary key usually has one already. Building another has <b>another reason</b>."

queries:
  - { grammars: [sql, mybatis_sql], file: ./index.scm }

examples:
  - code: "CREATE INDEX idx_cart_kind ON cart (kind)"
    expect: { sites: 1, form: index, hole: "INDEX", picks: { 1: "INDEX", 2: "idx_cart_kind", 3: "cart", 4: "kind" } }
  - code: "CREATE UNIQUE INDEX idx_cart_id ON cart (id)"
    expect: { sites: 1, form: index, hole: "INDEX", picks: { 1: "INDEX", 2: "idx_cart_id", 3: "cart", 4: "id" } }
  - code: "CREATE TABLE cart (id INTEGER)"
    expect: none
