schema: 1
id: sql/three-valued-comparison
universal: null
name: { ko: 견주기가 내는 답이 셋, en: Three-valued comparison }
token: "AND"
grammars: [sql, mybatis_sql]
framework: null
essential: true
difficulty: 2
prereq: [sql/null-unknown]
confusions: []

dict:
  one_liner:
    ko: "조건 둘을 한 조건으로 접는 자리. 접히는 답이 참·거짓 둘이 아니라 셋이다."
    en: "Folds two conditions into one. What is folded is three answers, not two."
  why:
    ko: >-
      견주기의 답이 참·거짓·<b>모름</b> 셋이라, {{site.line}}행처럼 조건을 이어 붙이면
      셋짜리 표로 접힙니다. {{pick.1|code}} 라는 낱말은 <b>둘 다 참일 때만</b> 참이고, 한쪽이 모름이면
      결과도 모름이에요 — 그리고 조건은 모름인 행을 참이 아닌 것으로 보고 버립니다.
      그래서 한쪽 조건에 모르는 값이 섞이면 <b>다른 쪽이 참이어도</b> 그 행이 사라집니다.
    en: >-
      A comparison answers true, false or <b>unknown</b>, so joining conditions as line
      {{site.line}} does folds a three-by-three table. {{pick.1|code}} is true <b>only when both
      are</b>, and if one side is unknown the result is unknown — and a filter treats unknown as
      not-true and drops the row. So when one condition meets an unknown value, the row vanishes
      <b>even though the other side holds</b>.
  trace:
    - ko: "이 행에서 {{pick.2|code}} 조건을 따져 본다 — 참·거짓·모름 중 하나다."
      en: "{{pick.2|code}} is worked out for this row — true, false or unknown."
    - ko: "{{pick.3|code}} 도 같은 셋 중 하나가 된다."
      en: "{{pick.3|code}} becomes one of the same three."
    - ko: "둘을 접어 하나로 만들고, 참인 행만 남는다."
      en: "The two are folded into one, and only the true rows remain."

rule:
  ko: "<b>답이 셋이라 접는 표도 3×3 이다.</b> 한쪽이 모름이면 결과는 참이 될 수 없다."
  en: "<b>Three answers make a three-by-three table.</b> With one side unknown the result cannot be true."
result:
  label:
    ko: "{{site.line}}행의 조건"
    en: "the condition on line {{site.line}}"
  value: "{{pick.2}} {{pick.1}} {{pick.3}}"
  note:
    ko: "참·거짓·모름 셋 중 하나"
    en: "one of true, false, unknown"
ok:
  ko: >-
    두 조건이 <b>모두 참</b>인 행만 남습니다. 한쪽이 모름인 행은 다른 쪽이 참이어도 빠져요.
  en: >-
    Only rows where <b>both</b> conditions hold remain. A row with one side unknown drops even if the other holds.
payoff:
  ko: >-
    이걸 알면 「조건을 하나 더 붙였더니 왜 행이 확 줄었지」가 풀립니다 — 모름이 섞였기 때문이에요.
  en: >-
    This untangles “I added one condition and the rows collapsed” — an unknown got mixed in.
bridge:
  ko: >-
    다른 언어의 <code>&amp;&amp;</code> 는 참·거짓 둘만 접습니다. 여기서는 <b>셋째 답</b>이 섞여 들어와요.
  en: >-
    <code>&amp;&amp;</code> in other languages folds two answers. Here a <b>third</b> answer joins in.
misconceptions:
  - ko: "조건을 더 붙여도 앞의 조건에 맞던 행은 그대로 남는다 — 모름이 섞이면 빠집니다."
    en: "Rows that matched the first condition stay when another is added — not if an unknown joins."
  - ko: "참이 아니면 거짓이다 — 참도 거짓도 아닌 셋째 답이 있습니다."
    en: "Not true means false — there is a third answer that is neither."
  - ko: "괄호가 없으면 적힌 순서대로 묶인다 — 이 낱말이 <code>OR</code> 보다 <b>먼저</b> 묶여요."
    en: "With no brackets they group left to right — this word binds <b>tighter</b> than <code>OR</code>."

meaning:
  - q:
      ko: "{{pick.3|code}} 쪽이 <b>모름</b>인 행은 어떻게 될까요?"
      en: "What happens to a row where {{pick.3|code}} is <b>unknown</b>?"
    hint:
      ko: "이 낱말은 <b>둘 다 참일 때만</b> 참입니다."
      en: "This word is true <b>only when both sides are</b>."
    options:
      - t:
          ko: "다른 쪽이 참이어도 빠진다"
          en: "It drops even if the other side holds"
      - t:
          ko: "다른 쪽이 참이면 남는다"
          en: "It stays if the other side holds"
        diag:
          t:
            ko: >-
              그것은 <b>둘 중 하나</b>로 접는 낱말의 규칙입니다. 이 낱말은 둘 다를 요구해요.
            en: >-
              That is the rule of the word that folds with <b>either</b>. This one demands both.
          edge:
            h: { ko: "가장 날카로운 자리 — 둘 다냐 둘 중 하나냐", en: "The sharpest spot — both or either" }
            code:
              - "a AND b   -- 둘 다"
              - "a OR b    -- 둘 중 하나"
      - t:
          ko: "모름인 쪽을 건너뛰고 나머지만 본다"
          en: "The unknown side is skipped and only the rest is looked at"
        diag:
          t:
            ko: "건너뛰지 않습니다. 모름은 <b>결과로 번져</b> 전체를 모름으로 만들어요."
            en: "Nothing is skipped. The unknown <b>spreads into</b> the result and makes the whole thing unknown."
          edge:
            h: { ko: "가장 날카로운 자리 — 건너뛰냐 번지냐", en: "The sharpest spot — skipped or spreading" }
            code:
              - "-- 모름은 무시되지 않는다"
              - "-- 결과까지 모름이 된다"
      - t:
          ko: "오류가 나서 문장이 멈춘다"
          en: "It errors and the statement stops"
        diag:
          t:
            ko: "멈추지 않습니다. 그 행이 <b>조용히</b> 결과에서 빠질 뿐이에요."
            en: "Nothing stops. The row simply falls out of the result, <b>quietly</b>."
          edge:
            h: { ko: "가장 날카로운 자리 — 멈추냐 조용히 빠지냐", en: "The sharpest spot — stopping or quietly dropping" }
            code:
              - "-- 오류 없음"
              - "-- 행 수만 줄어든다"

point:
  - q:
      ko: "{{site.line}}행에서 <b>두 조건을 잇는 낱말</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the word that joins the two conditions</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>첫째 조건</b>입니다. 그 자체로 참·거짓·모름 중 하나예요."
          en: "{{pick.2|code}} is the <b>first condition</b>. On its own it is true, false or unknown."
        edge:
          h: { ko: "가장 날카로운 자리 — 조건이냐 잇는 낱말이냐", en: "The sharpest spot — a condition or the joining word" }
          code:
            - "qty > 0"
            - "qty > 0 AND ok = 1"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>둘째 조건</b>입니다. 잇는 것은 그 사이의 낱말이에요."
          en: "{{pick.3|code}} is the <b>second condition</b>. What joins them is the word between."
        edge:
          h: { ko: "가장 날카로운 자리 — 뒤쪽 조건이냐 이음이냐", en: "The sharpest spot — the second condition or the join" }
          code:
            - "ok = 1"
            - "qty > 0 AND ok = 1"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 두 조건이 <b>모두</b> 맞는 행을 남깁니다."
      en: "Choose what goes in the blank. Line {{site.line}} keeps rows where <b>both</b> conditions hold."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "AND", mono: true }
      - t: "OR"
        mono: true
        diag:
          t:
            ko: >-
              <code>OR</code> 는 <b>둘 중 하나</b>만 맞아도 남깁니다. 남는 행이 훨씬 늘어나요.
            en: >-
              <code>OR</code> keeps a row when <b>either</b> holds. Far more rows remain.
          edge:
            h: { ko: "가장 날카로운 자리 — 둘 다냐 둘 중 하나냐", en: "The sharpest spot — both or either" }
            code:
              - "a AND b   -- 둘 다"
              - "a OR b    -- 둘 중 하나"
      - t: "NOT"
        mono: true
        diag:
          t:
            ko: >-
              <code>NOT</code> 은 조건 <b>하나</b>를 뒤집는 낱말이라 둘을 잇지 못합니다.
            en: >-
              <code>NOT</code> flips <b>one</b> condition, so it cannot join two.
          edge:
            h: { ko: "가장 날카로운 자리 — 잇기냐 뒤집기냐", en: "The sharpest spot — joining or flipping" }
            code:
              - "NOT a     -- 하나를 뒤집기"
              - "a AND b   -- 둘을 잇기"
      - t: "IS"
        mono: true
        diag:
          t:
            ko: >-
              <code>IS</code> 는 <b>모르는지</b>를 묻는 자리라 조건 둘 사이에 오지 않습니다.
            en: >-
              <code>IS</code> asks whether something is <b>not known</b>, so it never sits between two conditions.
          edge:
            h: { ko: "가장 날카로운 자리 — 잇기냐 묻기냐", en: "The sharpest spot — joining or asking" }
            code:
              - "x IS NULL      -- 묻기"
              - "a AND b        -- 잇기"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 조건을 <b>둘</b> 걸었을까요?"
    en: "Why does line {{site.line}} put <b>two</b> conditions on it?"
  choices:
    - t:
        ko: "하나만으로는 원하는 행이 안 좁혀져서 — 둘이 함께 맞아야 그 뜻이 된다"
        en: "Because one alone does not narrow it — the meaning needs both to hold together"
      ok: true
      fb:
        ko: "그 방향입니다. 둘 중 하나만 맞아도 되게 하면 무엇이 늘어나는지도 적어 보세요."
        en: "That is the direction. Now say what grows if either condition may hold alone."
    - t:
        ko: "조건이 많을수록 빠르니까"
        en: "Because more conditions run faster"
      ok: false
      fb:
        ko: "속도는 색인이 정합니다. 조건 수는 <b>어떤 행이 맞는가</b>를 정할 뿐이에요."
        en: "Speed is settled by indexes. The number of conditions only settles <b>which rows match</b>."
    - t:
        ko: "SQL 이 조건을 둘 이상 요구해서"
        en: "Because SQL requires two or more conditions"
      ok: false
      fb:
        ko: "요구하지 않습니다. 하나여도 되고 아예 없어도 돼요."
        en: "It requires none. One is fine, and none is fine too."

queries:
  - { grammars: [sql, mybatis_sql], file: ./three-valued-comparison.scm }

examples:
  - code: "SELECT * FROM cart WHERE qty > 0 AND closed_at IS NULL"
    expect: { sites: 1, form: connective, hole: "AND", picks: { 1: "AND", 2: "qty > 0", 3: "closed_at IS NULL" } }
  - code: "SELECT * FROM cart WHERE qty > 0 AND ok = 1"
    expect: { sites: 1, form: connective, hole: "AND" }
  - code: "SELECT * FROM cart WHERE qty > 0"
    expect: none
