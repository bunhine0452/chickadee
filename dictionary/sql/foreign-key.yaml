schema: 1
id: sql/foreign-key
universal: null
name: { ko: "다른 표의 행을 가리키기", en: "Foreign key" }
token: "REFERENCES"
grammars: [sql, mybatis_sql]
framework: null
essential: true
difficulty: 3
prereq: [sql/insert-row, sql/join-inner, cs/invariant]
confusions: []

dict:
  one_liner:
    ko: "이 열의 값이 다른 표에 있어야 한다고 적어 둔다. 켜져 있어야 지켜진다."
    en: "Declares this column's value must exist elsewhere — if switched on."
  why:
    ko: >-
      {{site.line}}행은 {{pick.2|code}} 열의 값이 {{pick.3|code}} 에 <b>실제로 있어야 한다</b>고 적어 둡니다.
      짝짓는 절이 <b>이번 한 번</b> 두 표를 잇는 것과 달리, 이것은 <b>언제나 참이어야 하는 것</b>을 표에
      새겨 둔 것이에요 — 그래서 없는 값을 넣으려 하면 넣기가 거절됩니다.
      함정은 sqlite 입니다: 이 제약을 <b>기본으로 안 켭니다</b>. 켜는 한 줄이 없으면 적혀 있어도 아무 일도
      안 하고, 가리키는 곳이 없는 값이 조용히 쌓입니다.
    en: >-
      Line {{site.line}} declares that the value in {{pick.2|code}} <b>must actually exist</b> in
      {{pick.3|code}}. Where a pairing clause links two tables <b>this once</b>, this carves into the
      table something that must be <b>true at all times</b> — so writing a value that is not there is
      refused. The trap is sqlite: it leaves this guard <b>off by default</b>. Without the line that
      switches it on, a written constraint does nothing and values pointing nowhere pile up quietly.
  trace:
    - ko: "{{site.line}}행이 {{pick.2|code}} 열에 조건을 새긴다."
      en: "Line {{site.line}} carves a condition onto {{pick.2|code}}."
    - ko: "행을 넣을 때마다 그 값이 {{pick.3|code}} 에 있는지 본다."
      en: "Every write checks that the value exists in {{pick.3|code}}."
    - ko: "제약이 꺼져 있으면 이 확인이 한 번도 안 돈다."
      en: "With the guard off, that check never runs."

rule:
  ko: "<b>언제나 참이어야 하는 것을 표에 새긴다.</b> 켜져 있어야 지켜진다."
  en: "<b>It carves an always-true condition into the table.</b> It guards only when switched on."
result:
  label: { ko: "가리키는 표", en: "the table pointed at" }
  value: "{{pick.3}}"
  note: { ko: "그 표에 값이 있어야 한다", en: "the value must exist there" }
ok:
  ko: >-
    {{pick.3|code}} 에 없는 값을 {{pick.2|code}} 에 넣으려 하면 거절되고, 있으면 그대로 들어갑니다.
  en: >-
    A value absent from {{pick.3|code}} is refused in {{pick.2|code}}; a present one goes in.
payoff:
  ko: >-
    이걸 알면 짝짓는 절이 조용히 행을 잃는 사고의 원인이 스키마에 있다는 것을 압니다.
  en: >-
    Knowing this, a join quietly losing rows points at the schema, not the query.
bridge:
  ko: >-
    다른 언어에서 참조가 살아 있는지 지키는 일과 같습니다. 다른 것은 <b>기계가 대신 지켜 준다</b>는 것이에요.
  en: >-
    It is keeping a reference alive, as elsewhere. What differs is that <b>the machine does the
    keeping</b>.
misconceptions:
  - ko: "적어 두면 언제나 지켜진다 — sqlite 는 켜는 한 줄이 있어야 지킵니다."
    en: "Written means enforced — sqlite needs the line that switches it on."
  - ko: "이걸 적으면 짝짓는 절이 저절로 생긴다 — 조회는 따로 적어야 합니다."
    en: "Declaring it makes joins automatic — the query still has to be written."
  - ko: "가리키는 행을 지우면 같이 지워진다 — 그렇게 적어 뒀을 때만 그렇습니다."
    en: "Deleting the pointed row cascades — only when it was declared to."

meaning:
  - q:
      ko: "sqlite 에서 이 제약을 켜는 한 줄 없이 없는 값을 넣으면 어떻게 될까요?"
      en: "In sqlite, without the line that switches this guard on, what happens to an absent value?"
    hint:
      ko: "제약이 <b>적혀 있는 것</b>과 <b>켜져 있는 것</b>을 갈라 보세요."
      en: "Separate a constraint being <b>written</b> from being <b>switched on</b>."
    options:
      - t:
          ko: "그냥 들어간다 — 가리키는 곳이 없는 값이 쌓인다"
          en: "It simply goes in — values pointing nowhere accumulate"
      - t:
          ko: "거절된다 — 적혀 있으니까"
          en: "It is refused — it is written, after all"
        diag:
          t:
            ko: >-
              sqlite 는 이 제약을 <b>기본으로 끕니다</b>. 옛 파일과의 호환 때문이고, 연결마다 켜야 해요.
            en: >-
              sqlite keeps this guard <b>off by default</b>, for compatibility with older files, and it
              must be switched on per connection.
          edge:
            h: { ko: "가장 날카로운 자리 — 적힘이냐 켜짐이냐", en: "The sharpest spot — written or switched on" }
            code:
              - "PRAGMA foreign_keys = ON"
              - "-- 연결마다 다시 켠다"
      - t:
          ko: "가리키는 표에 행이 새로 만들어진다"
          en: "A row is created in the pointed table"
        diag:
          t:
            ko: "제약은 <b>막는 일</b>만 합니다. 없는 행을 만들어 주지 않아요."
            en: "A constraint only <b>refuses</b>. It never creates the missing row."
          edge:
            h: { ko: "가장 날카로운 자리 — 막기냐 만들기냐", en: "The sharpest spot — refusing or creating" }
            code:
              - "-- 제약은 만들지 않는다"
      - t:
          ko: "값이 모름으로 바뀐다"
          en: "The value becomes unknown"
        diag:
          t:
            ko: >-
              값을 <b>고치지 않습니다</b>. 모름을 넣는 것은 따로 허용되는 다른 이야기예요.
            en: >-
              It <b>never edits</b> the value. Storing an unknown is a separate, separately allowed thing.
          edge:
            h: { ko: "가장 날카로운 자리 — 고치기냐 막기냐", en: "The sharpest spot — editing or refusing" }
            code:
              - "-- 모름은 대개 허용된다"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 {{pick.2|code}} 값이 {{pick.3|code}} 에 <b>있어야 한다</b>고 적습니다."
      en: "Choose what goes in the blank. Line {{site.line}} declares {{pick.2|code}} <b>must exist</b> in {{pick.3|code}}."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "REFERENCES", mono: true }
      - t: "JOIN"
        mono: true
        diag:
          t:
            ko: >-
              <code>JOIN</code> 은 <b>이번 한 번</b> 두 표를 잇는 조회의 낱말이고, 표에 새기는 조건이 아닙니다.
            en: >-
              <code>JOIN</code> links two tables <b>for one query</b>; it carves nothing into the table.
          edge:
            h: { ko: "가장 날카로운 자리 — 한 번이냐 언제나냐", en: "The sharpest spot — once or always" }
            code:
              - "JOIN cart ON ...        -- 조회 한 번"
              - "REFERENCES cart (id)    -- 언제나"
      - t: "INHERITS"
        mono: true
        diag:
          t:
            ko: >-
              <code>INHERITS</code> 는 표의 <b>모양</b>을 물려받는 방언 낱말이라 값이 있는지와 상관없습니다.
            en: >-
              <code>INHERITS</code> is a dialect word for taking a table's <b>shape</b>; it says nothing
              about values.
          edge:
            h: { ko: "가장 날카로운 자리 — 모양이냐 값이냐", en: "The sharpest spot — shape or values" }
            code:
              - "REFERENCES cart (id)"
      - t: "LINKS"
        mono: true
        diag:
          t:
            ko: >-
              <code>LINKS</code> 는 이 언어의 낱말이 아닙니다 — 가리킴을 새기는 낱말은 하나로 정해져 있어요.
            en: >-
              <code>LINKS</code> is not a word here — one fixed word carves a reference.
          edge:
            h: { ko: "가장 날카로운 자리 — 이 언어의 낱말이냐 아니냐", en: "The sharpest spot — a word of this language or not" }
            code:
              - "-- 낱말은 표준이 정한 것뿐이다"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 가리킴을 <b>표에 새겼을까요</b>? 코드에서 확인해도 되는데요."
    en: "Why does line {{site.line}} <b>carve</b> the reference into the table instead of checking in code?"
  choices:
    - t:
        ko: "표를 고치는 길이 코드 하나가 아니라서 — 새겨 두면 어느 길로 들어와도 지켜진다"
        en: "Because more than one path writes to the table — carved in, every path is held to it"
      ok: true
      fb:
        ko: "그 방향입니다. 그럼에도 코드에서 한 번 더 확인하는 이유가 있다면 무엇인지도 적어 보세요."
        en: "That is the direction. If code should still check, say why."
    - t:
        ko: "코드보다 빨라서"
        en: "Because it is faster than code"
      ok: false
      fb:
        ko: "확인은 값이 듭니다. 새기는 이유는 속도가 아니라 <b>빠져나갈 길이 없다</b>는 것이에요."
        en: "Checking costs. The reason is not speed but that <b>there is no way around it</b>."
    - t:
        ko: "코드에서는 다른 표를 못 봐서"
        en: "Because code cannot see the other table"
      ok: false
      fb:
        ko: "볼 수 있습니다 — 다만 <b>모든 코드</b>가 그렇게 하리라는 보장이 없어요."
        en: "It can — there is just no guarantee that <b>all</b> code does."

queries:
  - { grammars: [sql, mybatis_sql], file: ./foreign-key.scm }

examples:
  - code: "CREATE TABLE item (id INTEGER, cart_id INTEGER REFERENCES cart (id))"
    expect: { sites: 1, form: fk-inline, hole: "REFERENCES", picks: { 1: "REFERENCES", 2: "cart_id", 3: "cart" } }
  - code: "CREATE TABLE item (id INTEGER, cart_id INTEGER, FOREIGN KEY (cart_id) REFERENCES cart (id))"
    expect: { sites: 1, form: fk-table, hole: "REFERENCES", picks: { 1: "REFERENCES", 2: "cart_id", 3: "cart", 4: "FOREIGN" } }
  - code: "CREATE TABLE item (id INTEGER, cart_id INTEGER)"
    expect: none
