schema: 1
id: sql/update-set
universal: common/reassignment
name: { ko: "있는 행의 값 바꾸기", en: "Updating rows" }
token: "SET"
grammars: [sql, mybatis_sql]
framework: null
essential: true
difficulty: 2
prereq: [sql/comparison, sql/where-filter, cs/state]
confusions: []

dict:
  one_liner:
    ko: "있는 행의 값을 덮어쓴다. 조건을 빼면 표 전체가 바뀐다."
    en: "Overwrites values in existing rows. No test written means the whole table."
  why:
    ko: >-
      {{site.line}}행은 {{pick.3|code}} 의 행에서 {{pick.2|code}} 의 값을 <b>덮어씁니다</b>.
      새 행을 만드는 것도, 사본을 두는 것도 아니라 <b>있던 값이 사라집니다</b> — 되돌리는 낱말이 없어요.
      그리고 대상은 하나가 아니라 <b>조건에 맞는 전부</b>입니다. 조건을 안 적으면 조건에 맞는 전부가
      표 전체가 되고, 그때 데이터베이스는 막지 않고 <b>성공</b>을 돌려줍니다.
    en: >-
      Line {{site.line}} <b>overwrites</b> the value of {{pick.2|code}} in rows of {{pick.3|code}}.
      No new row, no copy — the old value <b>is gone</b>, and there is no word to bring it back.
      The target is not one row but <b>every row that matches</b>. With no test written, every row
      that matches is the whole table, and the database does not stop it — it reports <b>success</b>.
  trace:
    - ko: "{{pick.3|code}} 에서 조건에 맞는 행을 모은다."
      en: "The matching rows of {{pick.3|code}} are gathered."
    - ko: "그 행마다 {{pick.2|code}}{{pick.2|josa:을,를}} 새 값으로 덮는다."
      en: "In each of them {{pick.2|code}} is overwritten."
    - ko: "{{site.line}}행이 끝나면 옛 값은 남지 않는다."
      en: "When line {{site.line}} is done the old value is not kept anywhere."

rule:
  ko: "<b>덮어쓰기이고 대상은 여럿이다.</b> 조건이 없으면 표 전체가 대상이다."
  en: "<b>It overwrites, and it hits many.</b> With no test, the target is the whole table."
result:
  label: { ko: "덮어쓰는 열", en: "the column overwritten" }
  value: "{{pick.2}}"
  note: { ko: "조건에 맞는 행 전부에서", en: "in every matching row" }
ok:
  ko: >-
    {{pick.3|code}} 의 맞는 행에서 {{pick.2|code}}{{pick.2|josa:이,가}} 새 값이 되고 옛 값은 없어집니다.
  en: >-
    In matching rows of {{pick.3|code}}, {{pick.2|code}} takes the new value and the old one is gone.
payoff:
  ko: >-
    이걸 알면 조건 한 줄을 빠뜨린 문장이 왜 조용히 「성공」인지 압니다 — 막는 장치가 없어요.
  en: >-
    Knowing this, a statement missing its test reads as “success” for a reason — nothing guards it.
bridge:
  ko: >-
    다른 언어의 다시 대입과 같은 일입니다. 다른 것은 <b>개수</b>예요 — 하나가 아니라 맞는 행 전부입니다.
  en: >-
    It is reassignment as elsewhere. The difference is <b>how many</b> — not one, but every matching row.
misconceptions:
  - ko: "조건을 빼면 데이터베이스가 막아 준다 — 안 막고 표 전체를 바꿉니다."
    en: "Without a test the database stops it — it does not; it changes the whole table."
  - ko: "없는 행이면 새로 만들어 준다 — 안 만들고 0행을 바꿉니다."
    en: "A missing row is created — it is not; zero rows change."
  - ko: "옛 값이 어딘가 남는다 — 안 남습니다. 되돌리는 낱말이 없어요."
    en: "The old value is kept somewhere — it is not, and no word undoes it."

meaning:
  - q:
      ko: "{{site.line}}행에서 조건 절을 통째로 빼면 어떻게 될까요?"
      en: "What happens if the test clause is removed from line {{site.line}} entirely?"
    hint:
      ko: "「조건에 맞는 행」이 몇 개가 되는지 세어 보세요."
      en: "Count how many rows “matching rows” means then."
    options:
      - t:
          ko: "표의 모든 행이 바뀌고 성공으로 끝난다"
          en: "Every row in the table changes, and it reports success"
      - t:
          ko: "안전장치가 걸려 멈춘다"
          en: "A safety catch stops it"
        diag:
          t:
            ko: >-
              그런 장치가 <b>기본으로는 없습니다</b>. 몇몇 도구가 경고를 켤 수 있지만 언어가 막지는 않아요.
            en: >-
              There is <b>no such catch by default</b>. Some tools can warn, but the language does not
              refuse.
          edge:
            h: { ko: "가장 날카로운 자리 — 언어냐 도구냐", en: "The sharpest spot — the language or the tool" }
            code:
              - "UPDATE cart SET qty = 0   -- 전부"
              - "-- 도구가 물어볼 수는 있다"
      - t:
          ko: "첫 행 하나만 바뀐다"
          en: "Only the first row changes"
        diag:
          t:
            ko: >-
              「첫 행」이라는 것이 <b>없습니다</b>. 순서를 정하는 절이 없으면 첫 행도 없어요.
            en: >-
              There is <b>no “first row”</b>. Without a clause that settles the sequence, there is no first.
          edge:
            h: { ko: "가장 날카로운 자리 — 첫 행이냐 모든 행이냐", en: "The sharpest spot — a first row or all rows" }
            code:
              - "-- 순서가 없으니 첫 행도 없다"
      - t:
          ko: "아무 행도 안 바뀐다"
          en: "No row changes"
        diag:
          t:
            ko: >-
              조건이 없다는 것은 <b>거르지 않는다</b>는 뜻입니다 — 0행이 아니라 전부예요.
            en: >-
              No test means <b>no filtering</b> — that is all rows, not zero.
          edge:
            h: { ko: "가장 날카로운 자리 — 전부냐 0행이냐", en: "The sharpest spot — all or none" }
            code:
              - "WHERE 1 = 0   -- 0행"
              - "-- 조건 없음  -- 전부"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 있는 행의 값을 <b>덮어씁니다</b>."
      en: "Choose what goes in the blank. Line {{site.line}} <b>overwrites</b> values in existing rows."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "SET", mono: true }
      - t: "VALUES"
        mono: true
        diag:
          t:
            ko: >-
              <code>VALUES</code> 는 <b>새 행</b>을 넣을 때 값을 늘어놓는 자리입니다. 여기는 있는 행을 고쳐요.
            en: >-
              <code>VALUES</code> lists values for a <b>new row</b>. This statement changes rows that
              already exist.
          edge:
            h: { ko: "가장 날카로운 자리 — 새 행이냐 있는 행이냐", en: "The sharpest spot — a new row or an existing one" }
            code:
              - "INSERT INTO cart (qty) VALUES (2)"
              - "UPDATE cart SET qty = 2"
      - t: "WITH"
        mono: true
        diag:
          t:
            ko: >-
              <code>WITH</code> 는 조회에 <b>이름을 붙여 두는</b> 자리라 값을 넣는 낱말이 아닙니다.
            en: >-
              <code>WITH</code> <b>names a query</b> for reuse; it does not put a value anywhere.
          edge:
            h: { ko: "가장 날카로운 자리 — 이름 붙이기냐 값 넣기냐", en: "The sharpest spot — naming or assigning" }
            code:
              - "WITH recent AS (SELECT ...)"
              - "UPDATE cart SET qty = 2"
      - t: "ASSIGN"
        mono: true
        diag:
          t:
            ko: >-
              <code>ASSIGN</code> 은 이 언어의 낱말이 아닙니다 — 대입을 여는 낱말이 따로 있어요.
            en: >-
              <code>ASSIGN</code> is not a word in this language — another word opens the assignment.
          edge:
            h: { ko: "가장 날카로운 자리 — 이 언어의 낱말이냐 아니냐", en: "The sharpest spot — a word of this language or not" }
            code:
              - "UPDATE cart SET qty = 2"
              - "-- 대입은 낱말 하나로 열린다"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 <b>새 행을 넣지 않고</b> 있는 행을 고칠까요?"
    en: "Why does line {{site.line}} <b>change an existing row</b> instead of adding one?"
  choices:
    - t:
        ko: "같은 사실이 한 곳에만 있어야 해서 — 새로 넣으면 같은 것이 둘이 된다"
        en: "Because one fact belongs in one place — adding a row makes two of the same"
      ok: true
      fb:
        ko: "그 방향입니다. 그러면 대상이 없을 때 무엇이 일어나는지도 한 줄로 적어 보세요."
        en: "That is the direction. In one line, say what happens when nothing matches."
    - t:
        ko: "넣기보다 빨라서"
        en: "Because it is faster than inserting"
      ok: false
      fb:
        ko: "빠르기가 아니라 <b>같은 사실을 두 번 두지 않기</b>입니다."
        en: "It is not speed — it is <b>not storing the same fact twice</b>."
    - t:
        ko: "표에 자리가 없어서"
        en: "Because the table has no room"
      ok: false
      fb:
        ko: "자리는 얼마든지 늘어납니다. 고르는 이유는 <b>뜻</b>이에요."
        en: "There is always room. The reason is <b>meaning</b>."

queries:
  - { grammars: [sql, mybatis_sql], file: ./update-set.scm }

examples:
  - code: "UPDATE cart SET note = 'sent' WHERE id = 1"
    expect: { sites: 1, form: update-set, hole: "SET", picks: { 1: "SET", 2: "note", 3: "cart", 4: "UPDATE" } }
  - code: "UPDATE cart SET qty = 2"
    expect: { sites: 1, form: update-set, hole: "SET", picks: { 1: "SET", 2: "qty", 3: "cart", 4: "UPDATE" } }
  - code: "INSERT INTO cart (id) VALUES (1)"
    expect: none
