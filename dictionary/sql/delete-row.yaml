schema: 1
id: sql/delete-row
universal: null
name: { ko: "행 지우기", en: "Deleting rows" }
token: "DELETE FROM"
grammars: [sql, mybatis_sql]
framework: null
essential: true
difficulty: 2
prereq: [sql/where-filter, cs/state]
confusions: []

dict:
  one_liner:
    ko: "조건에 맞는 행을 없앤다. 조건이 없으면 표를 비우고 성공을 돌려준다."
    en: "Removes matching rows. With no test it empties the table and reports success."
  why:
    ko: >-
      {{site.line}}행은 {{pick.2|code}} 에서 조건에 맞는 행을 <b>없앱니다</b>. 되돌리는 낱말이 없어요 —
      덩어리로 묶어 두지 않았다면 그 행들은 그대로 사라집니다. 그리고 대상은 하나가 아니라
      <b>맞는 전부</b>이고, 조건을 안 적으면 「맞는 전부」가 표 전체가 됩니다. 그때 데이터베이스는
      되묻지 않고 <b>성공</b>을 돌려줍니다 — 그래서 이 문장은 조용히 큽니다.
    en: >-
      Line {{site.line}} <b>removes</b> matching rows from {{pick.2|code}}. There is no word to undo
      it — outside a grouped block those rows are simply gone. The target is not one row but
      <b>every match</b>, and with no test written “every match” is the whole table. The database
      does not ask back; it reports <b>success</b>. That is why this statement is quietly large.
  trace:
    - ko: "{{pick.3|code}} 뒤의 {{pick.2|code}}{{pick.2|josa:이,가}} 대상 표다."
      en: "{{pick.2|code}} after {{pick.3|code}} is the target table."
    - ko: "조건이 있으면 맞는 행만, 없으면 모든 행이 대상이 된다."
      en: "With a test only matches are targeted; with none, every row is."
    - ko: "{{site.line}}행이 끝나면 그 행들은 표에 없다."
      en: "When line {{site.line}} is done those rows are not in the table."

rule:
  ko: "<b>지우기는 되돌릴 낱말이 없다.</b> 조건이 없으면 표 전체가 대상이다."
  en: "<b>Removal has no undo word.</b> With no test, the whole table is the target."
result:
  label: { ko: "행이 빠지는 표", en: "the table that loses rows" }
  value: "{{pick.2}}"
  note: { ko: "맞는 행 전부만큼", en: "by every matching row" }
ok:
  ko: >-
    {{pick.2|code}} 에서 맞는 행이 빠지고, 표의 모양과 다른 표는 그대로입니다.
  en: >-
    Matching rows leave {{pick.2|code}}; the table's shape and the other tables are untouched.
payoff:
  ko: >-
    이걸 알면 「지웠는데 왜 다른 표까지 깨졌지」가 풀립니다 — 가리키던 행이 사라졌기 때문이에요.
  en: >-
    This untangles “why did another table break” — a row something pointed at is gone.
bridge:
  ko: >-
    다른 언어의 목록에서 원소를 빼는 일과 닮았지만, 여기서는 <b>몇 개인지 안 적습니다</b> — 조건이 셉니다.
  en: >-
    It is like removing items from a list elsewhere, except <b>the count is never written</b> — the
    test decides how many.
misconceptions:
  - ko: "조건을 빼면 막아 준다 — 안 막고 표를 비웁니다."
    en: "Without a test it is refused — it is not; the table is emptied."
  - ko: "표까지 없어진다 — 행만 없어지고 표는 남습니다."
    en: "The table goes too — only rows go; the table stays."
  - ko: "지운 뒤에도 되돌릴 수 있다 — 덩어리로 묶지 않았으면 못 되돌립니다."
    en: "It can be undone afterwards — not unless it was inside a grouped block."

meaning:
  - q:
      ko: "{{site.line}}행의 표를 다른 표가 가리키고 있다면, 지운 뒤 그 가리킴은 어떻게 될까요?"
      en: "If another table points at {{site.line}}'s table, what happens to that pointer after the delete?"
    hint:
      ko: "가리킴을 지키는 장치가 <b>켜져 있는지</b>가 갈림길입니다."
      en: "Whether the guard on that pointer is <b>switched on</b> is the fork."
    options:
      - t:
          ko: "지키는 장치가 켜져 있으면 막히고, 꺼져 있으면 갈 곳 없는 가리킴이 남는다"
          en: "With the guard on it is refused; with it off a pointer to nothing is left behind"
      - t:
          ko: "가리키던 행도 같이 지워진다"
          en: "The pointing rows are removed as well"
        diag:
          t:
            ko: >-
              같이 지우는 것은 <b>그렇게 적어 둔 표</b>에서만 일어납니다. 기본 동작이 아니에요.
            en: >-
              Cascading happens only where the table <b>says so</b>. It is not the default.
          edge:
            h: { ko: "가장 날카로운 자리 — 기본이냐 적어 둔 것이냐", en: "The sharpest spot — a default or a declaration" }
            code:
              - "REFERENCES cart (id)"
              - "REFERENCES cart (id) ON DELETE CASCADE"
      - t:
          ko: "가리킴이 자동으로 비워진다"
          en: "The pointer is blanked automatically"
        diag:
          t:
            ko: >-
              비우는 것도 <b>적어 둬야</b> 일어납니다. 안 적었으면 옛 값이 그대로 남아요.
            en: >-
              Blanking also has to be <b>declared</b>. Undeclared, the old value stays as it was.
          edge:
            h: { ko: "가장 날카로운 자리 — 자동이냐 선언이냐", en: "The sharpest spot — automatic or declared" }
            code:
              - "ON DELETE SET NULL   -- 적어야 한다"
      - t:
          ko: "언제나 막힌다"
          en: "It is always refused"
        diag:
          t:
            ko: >-
              sqlite 는 지키는 장치를 <b>기본으로 안 켭니다</b>. 켜는 한 줄이 없으면 제약이 적혀 있어도 안 돕니다.
            en: >-
              sqlite leaves that guard <b>off by default</b>. Without the line that switches it on, a
              written constraint does nothing.
          edge:
            h: { ko: "가장 날카로운 자리 — 적혀 있느냐 켜져 있느냐", en: "The sharpest spot — written or switched on" }
            code:
              - "PRAGMA foreign_keys = ON"
              - "-- 이것이 없으면 제약이 잠자고 있다"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 {{pick.2|code}} 의 행을 <b>없앱니다</b>."
      en: "Choose what goes in the blank. Line {{site.line}} <b>removes</b> rows from {{pick.2|code}}."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "DELETE", mono: true }
      - t: "DROP"
        mono: true
        diag:
          t:
            ko: >-
              <code>DROP</code> 은 <b>표 자체</b>를 없앱니다. 행을 비우는 것과 그릇을 없애는 것은 다른 일이에요.
            en: >-
              <code>DROP</code> removes the <b>table itself</b>. Emptying rows and removing the
              container are different acts.
          edge:
            h: { ko: "가장 날카로운 자리 — 행이냐 표냐", en: "The sharpest spot — rows or the table" }
            code:
              - "DELETE FROM cart   -- 표는 남는다"
              - "DROP TABLE cart    -- 표가 없어진다"
      - t: "REMOVE"
        mono: true
        diag:
          t:
            ko: >-
              <code>REMOVE</code> 는 이 언어의 낱말이 아닙니다 — 행을 없애는 낱말은 따로 정해져 있어요.
            en: >-
              <code>REMOVE</code> is not a word here — another word is fixed for taking rows out.
          edge:
            h: { ko: "가장 날카로운 자리 — 이 언어의 낱말이냐 아니냐", en: "The sharpest spot — a word of this language or not" }
            code:
              - "-- 낱말은 표준이 정한 것뿐이다"
      - t: "TRUNCATE"
        mono: true
        diag:
          t:
            ko: >-
              <code>TRUNCATE</code> 는 <b>조건 없이</b> 표를 비우는 방언 낱말이라 조건을 붙일 수 없습니다.
            en: >-
              <code>TRUNCATE</code> is a dialect word that empties a table <b>without a test</b>, so no
              test can be attached.
          edge:
            h: { ko: "가장 날카로운 자리 — 고를 수 있냐 없냐", en: "The sharpest spot — selective or not" }
            code:
              - "DELETE FROM cart WHERE id = 1"
              - "TRUNCATE TABLE cart   -- 조건이 없다"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 <b>지우기</b>를 골랐을까요? 값을 비우는 길도 있는데요."
    en: "Why does line {{site.line}} choose <b>removal</b> when blanking a value is also possible?"
  choices:
    - t:
        ko: "그 행이 있었다는 사실 자체를 남길 필요가 없어서 — 남겨야 하면 표시만 바꾼다"
        en: "Because the row need not survive as a fact — if it must, a flag is changed instead"
      ok: true
      fb:
        ko: "그 방향입니다. 표시만 바꾸는 길을 골랐다면 읽는 문장이 무엇을 더 적어야 하는지도 적어 보세요."
        en: "That is the direction. Say what every reading statement must then add."
    - t:
        ko: "지우는 편이 자리를 아껴서"
        en: "Because removing saves space"
      ok: false
      fb:
        ko: "자리는 대개 바로 안 줄어듭니다. 고르는 이유는 <b>그 사실이 필요한가</b>예요."
        en: "Space rarely shrinks right away. The reason is <b>whether the fact is needed</b>."
    - t:
        ko: "지우는 문장이 더 짧아서"
        en: "Because the statement is shorter"
      ok: false
      fb:
        ko: "길이가 아니라 <b>되돌릴 수 있느냐</b>가 갈림길입니다."
        en: "Not length — <b>whether it can be undone</b> is the fork."

queries:
  - { grammars: [sql, mybatis_sql], file: ./delete-row.scm }

examples:
  - code: "DELETE FROM cart WHERE id = 1"
    expect: { sites: 1, form: delete, hole: "DELETE", picks: { 1: "DELETE", 2: "cart", 3: "FROM" } }
  - code: "DELETE FROM cart"
    expect: { sites: 1, form: delete, hole: "DELETE", picks: { 1: "DELETE", 2: "cart", 3: "FROM" } }
  - code: "SELECT id FROM cart"
    expect: none
