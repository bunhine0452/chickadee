lang: sql
version: 0.1.0
grammars: [sql]
# tree-sitter-sequel 의 `parser.c` 가 14 다. 대조는 시험이 한다.
grammar_abi: { sql: 14 }

extensions:
  sql: [.sql]

# 바닥 여덟 중 둘부터 (`docs/curriculum/sql.md` §2). 남은 여섯은 다음 판이다.
#
# **`sql/comparison` 은 일부러 미뤘다.** 자리표가 오른쪽에 오면 문법이 조용히 다른 것을 준다 —
# `:name` 은 `field`(열 이름!), `#{name}` 은 `unary_expression` 에 닫는 중괄호가 잘린 채로
# 잡히고 둘 다 `quality: ok` 이며 `in_error` 도 0 이다. 값 자리를 「열 이름」이라 가르치게 된다.
# 오른쪽 노드 종류로 거르는 규칙을 먼저 세워야 한다 (`docs/curriculum/sql.md` §8).
essential:
  - sql/from-table
  - sql/null-check

alternatives: []

thin_threshold: { min_files: 2, min_sites: 3, small_repo_files: 20 }

diag_default:
  point:
    ko: "«{{pick}}»{{pick|josa:은,는}} {{role}} 자리입니다. {{concept}}{{concept|josa:은,는}} «{{answer}}» 입니다. {{rule}}"
    en: "«{{pick}}» is the {{role}} slot. The {{concept}} is «{{answer}}». {{rule}}"
  blank:
    ko: "«{{pick}}»{{pick|josa:은,는}} 이 자리에 오지 않습니다. {{rule}}"
    en: "«{{pick}}» does not go in this slot. {{rule}}"
