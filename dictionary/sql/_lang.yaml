lang: sql
version: 0.1.0
grammars: [sql]
# tree-sitter-sequel 의 `parser.c` 가 14 다. 대조는 시험이 한다.
grammar_abi: { sql: 14 }

extensions:
  sql: [.sql]

# 바닥 여덟 중 셋 (`docs/curriculum/sql.md` §2). 남은 다섯은 다음 판이다.
#
# `sql/comparison` 은 **자리표가 있는 사용처를 빼고** 연다 — 노드 종류로는 못 거른다(진짜 조인도
# 오른쪽이 `field` 다). 사용처의 글자에 `:`·`#` 이 남아 있으면 빼는 것이 실측으로 리터럴·조인·
# 숫자를 살리고 자리표 둘만 뺀다 (`comparison.scm` 의 주석).
essential:
  - sql/from-table
  - sql/comparison
  - sql/null-check

alternatives: []

thin_threshold: { min_files: 2, min_sites: 3, small_repo_files: 20 }

diag_default:
  point:
    ko: "«{{pick}}»{{pick|josa:은,는}} {{role}} 자리입니다. {{concept}}{{concept|josa:은,는}} «{{answer}}» 입니다. {{rule}}"
    en: "«{{pick}}» is the {{role}} slot. The {{concept}} is «{{answer}}». {{rule}}"
  blank:
    ko: "«{{pick}}»{{pick|josa:은,는}} 이 자리에 오지 않습니다. {{rule}}"
    en: "«{{pick}}» does not go in this slot. {{rule}}"
