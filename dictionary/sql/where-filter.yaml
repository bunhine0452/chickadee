schema: 1
id: sql/where-filter
universal: common/filter-select
name: { ko: "조건에 맞는 행만 남기기", en: "Filtering rows" }
token: "WHERE"
grammars: [sql, mybatis_sql]
framework: null
essential: true
difficulty: 1
prereq: [sql/select-list, sql/comparison, sql/expression-per-row]
confusions: []

dict:
  one_liner:
    ko: "행을 하나씩 따로 보고, 조건이 참인 행만 남긴다."
    en: "Looks at each row on its own and keeps the ones whose test is true."
  why:
    ko: >-
      {{site.line}}행의 이 절은 {{pick.2|code}} 의 행을 <b>하나씩 따로</b> 봅니다. 각 행에서
      {{pick.4|code}}{{pick.4|josa:을,를}} 계산해 참인 것만 남기고 나머지를 버려요. 여기서 중요한 것은 <b>따로</b>입니다 —
      한 행을 볼 때 다른 행이 안 보이므로, 「몇 개인지」처럼 여러 행을 한꺼번에 봐야 아는 조건은
      이 자리에 못 씁니다. 그리고 참이 아닌 것에는 거짓만 있는 게 아니라 <b>모름</b>도 있고,
      모름도 같이 버려집니다.
    en: >-
      This clause on line {{site.line}} looks at the rows of {{pick.2|code}} <b>one at a time</b>.
      For each row it computes {{pick.4|code}} and keeps only the true ones. <b>One at a time</b> is
      the point — while looking at one row the others are invisible, so a test that needs several
      rows at once (“how many are there”) cannot stand here. And “not true” covers more than false:
      it also covers <b>unknown</b>, and unknown is dropped as well.
  trace:
    - ko: "{{pick.2|code}} 의 첫 행에서 {{pick.4|code}}{{pick.4|josa:을,를}} 계산한다."
      en: "{{pick.4|code}} is computed on the first row of {{pick.2|code}}."
    - ko: "참이면 남고, 거짓이나 모름이면 버려진다."
      en: "True stays; false or unknown is dropped."
    - ko: "남은 행에서 {{pick.3|code}}{{pick.3|josa:을,를}} 고른다."
      en: "{{pick.3|code}} is then chosen from the rows that stayed."

rule:
  ko: "<b>행마다 따로 판정한다.</b> 참인 행만 남고 거짓과 모름은 버려진다."
  en: "<b>Each row is judged alone.</b> True stays; false and unknown are dropped."
result:
  label: { ko: "남는 행", en: "the rows that stay" }
  value: "{{pick.4}}"
  note: { ko: "참인 것만", en: "only where true" }
ok:
  ko: >-
    {{pick.4|code}}{{pick.4|josa:이,가}} 참인 행만 남고, 그 행들에서 {{pick.3|code}}{{pick.3|josa:이,가}} 나옵니다.
  en: >-
    Only rows where {{pick.4|code}} is true remain, and {{pick.3|code}} comes from those.
payoff:
  ko: >-
    이걸 알면 값이 없는 행이 왜 조건에서 조용히 빠지는지 보입니다 — 거짓이 아니라 모름이라서예요.
  en: >-
    This shows why rows with no value quietly vanish from a test — not false, but unknown.
bridge:
  ko: >-
    다른 언어에서 목록을 조건으로 걸러내는 일과 같습니다. 다른 것은 <b>답이 셋</b>이라는 것이에요.
  en: >-
    It is the same as sieving a list by a test elsewhere. The difference is that <b>there are three
    answers</b>, not two.
misconceptions:
  - ko: "여기에 개수 조건을 쓸 수 있다 — 이 시점에는 다른 행이 안 보입니다."
    en: "A count test can go here — at this point the other rows are invisible."
  - ko: "조건이 거짓인 행만 빠진다 — 모름인 행도 같이 빠집니다."
    en: "Only false rows drop — unknown rows drop too."
  - ko: "이 절을 빼면 아무 행도 안 나온다 — 전부 나옵니다."
    en: "Without this clause nothing comes back — everything does."

meaning:
  - q:
      ko: "{{pick.4|code}} 자리에 「행이 세 개보다 많은가」 같은 개수 조건을 쓰면 어떻게 될까요?"
      en: "What if a count test like “more than three rows” is written at {{pick.4|code}}?"
    hint:
      ko: "이 절이 도는 시점에 <b>다른 행</b>이 보이는지 생각해 보세요."
      en: "Think about whether <b>other rows</b> are visible when this clause runs."
    options:
      - t:
          ko: "문장이 서지 않는다 — 이 시점에는 묶음이 아직 없다"
          en: "The statement does not stand — there are no groups yet at this point"
      - t:
          ko: "전체 행 수와 견줘 준다"
          en: "It compares against the total row count"
        diag:
          t:
            ko: >-
              전체를 세려면 행을 <b>다 모아야</b> 하는데, 이 절은 한 행씩 봅니다. 세는 일은 뒤 절의 몫이에요.
            en: >-
              Counting the whole needs <b>all the rows gathered</b>, and this clause sees one at a
              time. Counting belongs to a later clause.
          edge:
            h: { ko: "가장 날카로운 자리 — 한 행이냐 전체냐", en: "The sharpest spot — one row or all of them" }
            code:
              - "WHERE qty > 3          -- 한 행"
              - "HAVING COUNT(*) > 3    -- 묶음"
      - t:
          ko: "행마다 1 로 세어 준다"
          en: "It counts one per row"
        diag:
          t:
            ko: "행마다 1 이면 조건이 늘 같아져서 <b>거르는 일을 안 합니다</b>. 셈이 아니에요."
            en: >-
              One per row makes the test constant, so it <b>filters nothing</b>. That is not counting.
          edge:
            h: { ko: "가장 날카로운 자리 — 세기냐 상수냐", en: "The sharpest spot — counting or a constant" }
            code:
              - "-- 한 행에서 셀 수 있는 것은"
              - "-- 그 행 하나뿐이다"
      - t:
          ko: "조용히 무시된다"
          en: "It is quietly ignored"
        diag:
          t:
            ko: "조용히 넘어가지 않습니다 — 이 자리에 올 수 없는 식이라 <b>문장이 서기 전</b>에 걸려요."
            en: >-
              Nothing passes quietly — the expression cannot stand here, so it is caught <b>before the
              statement stands</b>.
          edge:
            h: { ko: "가장 날카로운 자리 — 무시냐 거절이냐", en: "The sharpest spot — ignored or refused" }
            code:
              - "-- 결과가 이상한 것이 아니라"
              - "-- 결과가 아예 안 나온다"

point:
  - q:
      ko: "{{site.line}}행에서 <b>행을 줄이는</b> 자리를 짚어 보세요."
      en: "On line {{site.line}}, point at what <b>reduces the rows</b>."
    hint:
      ko: "폭을 바꾸는 자리와 행 수를 바꾸는 자리는 다릅니다."
      en: "The place that changes the width and the one that changes the row count differ."
    answer: pick.1
    diag:
      pick.3:
        t:
          ko: >-
            {{pick.3|code}}{{pick.3|josa:은,는}} <b>폭</b>을 정합니다 — 열을 고를 뿐 행 수는 그대로예요.
          en: >-
            {{pick.3|code}} settles the <b>width</b> — it chooses columns and leaves the row count alone.
        edge:
          h: { ko: "가장 날카로운 자리 — 폭이냐 행 수냐", en: "The sharpest spot — width or row count" }
          code:
            - "SELECT id       -- 폭"
            - "WHERE qty > 0   -- 행 수"
      pick.2:
        t:
          ko: >-
            {{pick.2|code}}{{pick.2|josa:은,는}} <b>어디서</b> 가져오나이지 무엇을 버리나가 아닙니다.
          en: >-
            {{pick.2|code}} says <b>where from</b>, not what to drop.
        edge:
          h: { ko: "가장 날카로운 자리 — 출처냐 거르기냐", en: "The sharpest spot — the source or the filter" }
          code:
            - "FROM cart       -- 출처"
            - "WHERE qty > 0   -- 거르기"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 <b>조건에 맞는 행만</b> 남깁니다."
      en: "Choose what goes in the blank. Line {{site.line}} keeps <b>only the rows that match</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "WHERE", mono: true }
      - t: "HAVING"
        mono: true
        diag:
          t:
            ko: >-
              <code>HAVING</code> 은 <b>묶은 뒤</b> 묶음을 거릅니다. 여기에는 아직 묶음이 없어요.
            en: >-
              <code>HAVING</code> filters groups <b>after grouping</b>. There are no groups here yet.
          edge:
            h: { ko: "가장 날카로운 자리 — 행이냐 묶음이냐", en: "The sharpest spot — rows or groups" }
            code:
              - "WHERE qty > 0        -- 행"
              - "HAVING COUNT(*) > 1  -- 묶음"
      - t: "IF"
        mono: true
        diag:
          t:
            ko: >-
              이 언어에는 갈래를 여는 <code>IF</code> <b>문</b>이 없습니다. 갈래는 문이 아니라 값이에요.
            en: >-
              There is no <code>IF</code> <b>statement</b> in this language. A branch here is a value,
              not a statement.
          edge:
            h: { ko: "가장 날카로운 자리 — 문이냐 값이냐", en: "The sharpest spot — a statement or a value" }
            code:
              - "WHERE qty > 0"
              - "CASE WHEN qty > 0 THEN 1 END"
      - t: "FILTER"
        mono: true
        diag:
          t:
            ko: >-
              <code>FILTER</code> 는 <b>접는 함수에만</b> 붙는 곁절이고, 문장의 행을 거르는 자리가 아닙니다.
            en: >-
              <code>FILTER</code> is a side clause that attaches <b>to folding functions only</b>, not
              the place a statement drops rows.
          edge:
            h: { ko: "가장 날카로운 자리 — 문장이냐 함수냐", en: "The sharpest spot — the statement or one function" }
            code:
              - "WHERE qty > 0                        -- 문장"
              - "COUNT(*) FILTER (WHERE qty > 0)      -- 함수 하나"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 조건을 <b>여기</b>에 적었을까요?"
    en: "Why is the test written <b>here</b> on line {{site.line}}?"
  choices:
    - t:
        ko: "행 하나만 보고 판정할 수 있는 조건이라서 — 여러 행을 봐야 하면 여기 못 쓴다"
        en: "Because it can be judged from one row — a test needing several rows cannot stand here"
      ok: true
      fb:
        ko: "그 방향입니다. 여러 행을 봐야 하는 조건은 어느 절이 받는지도 적어 보세요."
        en: "That is the direction. Say which clause takes a test that needs several rows."
    - t:
        ko: "조건은 원래 이 자리에 적는 것이라서"
        en: "Because tests always go in this slot"
      ok: false
      fb:
        ko: "조건이 갈 자리는 둘 이상입니다. <b>무엇을 보고 판정하나</b>가 자리를 정해요."
        en: "There is more than one slot for a test. <b>What it looks at</b> decides which."
    - t:
        ko: "여기 적어야 빠르게 걸러져서"
        en: "Because filtering here is faster"
      ok: false
      fb:
        ko: "빠르기는 데이터베이스가 정합니다. 여기 적는 이유는 <b>판정에 필요한 것</b>이에요."
        en: "Speed is the database's call. The reason it goes here is <b>what the test needs</b>."

queries:
  - { grammars: [sql, mybatis_sql], file: ./where-filter.scm }

examples:
  - code: "SELECT id FROM cart WHERE qty > 0"
    expect: { sites: 1, form: where, hole: "WHERE", picks: { 1: "WHERE", 2: "cart", 3: "id", 4: "qty > 0" } }
  - code: "SELECT id, note FROM cart WHERE ok = 1 AND qty > 2"
    expect: { sites: 1, form: where, hole: "WHERE", picks: { 1: "WHERE", 2: "cart", 3: "id, note", 4: "ok = 1 AND qty > 2" } }
  - code: "SELECT id FROM cart"
    expect: none
