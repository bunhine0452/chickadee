lang: csharp
version: 0.1.0
grammars: [c_sharp]
# 문법 키는 `c_sharp` 이고 사전 네임스페이스는 `csharp` 이다 — `cs/` 를 기초 CS 사전이
# 가져갔다(D157). 확장자는 `.cs` 라 이 언어만 셋이 다 다르다(`csharp.md` §8).
#
# `tree-sitter-c-sharp` 0.23.5 의 `parser.c` 가 15 다. **같은 마이너 안에서 14 → 15 로
# 올라간 언어**라(0.23.1 = 14) 버전 문자열로 짐작하면 어긋난다. 대조는 시험이 한다
# (`declared_grammar_abi_matches_the_linked_grammar`).
grammar_abi: { c_sharp: 15 }

# `.csx` 는 뺀다 — `#r` 지시자에서 파싱이 깨진다(tree-sitter-c-sharp 이슈 #241).
# `.cshtml`·`.razor` 는 이 문법이 아예 못 읽는다(HTML + C# 혼합).
extensions:
  c_sharp: [.cs]

# 「필수 문법」 — 구멍 지도가 세는 대상이자 위상 정렬 동률 시의 순서다 (03 §6).
#
# **순서는 0부 → 1부 → 2부다** (`docs/curriculum/csharp.md` §0.5). 부마다 교재가 다르다 —
# 0·1부는 합성 예제, 2부는 합성 + 내 코드.
#
# 배열 규칙이 하나 더 있다(`py/_lang.yaml`·`ts/_lang.yaml` 과 같다):
# **사용처가 얇은 판을 셋 이상 잇대지 않는다.** 얇음의 선은 표본 리포에서 **20곳 미만**이다.
# 표본이 하나뿐이라(사용자 리포에 `.cs` 가 0장 — `csharp.md` §0.7) 공개 리포
# `dotnet-architecture/eShopOnWeb`(`.cs` 254장, 2026-09-06 실측)를 썼다.
#
# 얇은 열둘: type-conversion 7 · while-loop 1 · record 1 · conditional-ternary 4 ·
# try-catch 6 · foreach-loop 16 · interface 16 · linq-where 12 · linq-select 13 ·
# deferred-execution 8 · using-disposable 4 · switch-expression **0**.
# 아래에서 이 열둘은 두꺼운 판 사이에 **둘씩** 놓인다 — 셋이 붙는 자리가 한 곳도 없다.
essential:
  # ── 0부 「이 언어의 값과 식」 여덟 (csharp.md §0.1) ─────────────────────────
  - csharp/integer-literal      # 축 1
  - csharp/float-literal        # 축 2
  - csharp/text-literal         # 축 3
  - csharp/boolean-literal      # 축 4
  - csharp/operator-precedence  # 축 5
  - csharp/type-conversion      # 축 6 · 얇다 (7곳)
  - csharp/assignment           # 축 7
  - csharp/equality             # 축 8
  # ── 1부 「흐름과 묶기」 셋 (csharp.md §2) ──────────────────────────────────
  # 셋인 것이 이 언어의 사실이다 — 자유 함수가 없어 「문」의 바닥이 그만큼뿐이고
  # 나머지 다섯은 값 쪽이라 0부가 가져갔다.
  - csharp/if-statement
  - csharp/method-declaration
  - csharp/return-statement
  # ── 2부 「C# 의 타입과 흐름」 스물넷 (csharp.md §3 열넷 + §4 열) ────────────
  - csharp/class-declaration
  - csharp/member-access
  - csharp/method-call
  - csharp/property
  - csharp/interpolated-string
  - csharp/value-vs-reference
  - csharp/record               # 얇다 (1곳)
  - csharp/while-loop           # 얇다 (1곳 — 반복의 자리를 foreach 와 LINQ 가 가져갔다)
  - csharp/nullable-reference
  - csharp/null-coalescing
  - csharp/null-conditional
  - csharp/conditional-ternary  # 얇다 (4곳)
  - csharp/try-catch            # 얇다 (6곳)
  - csharp/list
  - csharp/foreach-loop         # 얇다 (16곳)
  - csharp/interface            # 얇다 (16곳)
  - csharp/lambda
  - csharp/linq-where           # 얇다 (12곳)
  - csharp/linq-select          # 얇다 (13곳)
  - csharp/generics
  - csharp/deferred-execution   # 얇다 (8곳)
  - csharp/using-disposable     # 얇다 (4곳)
  - csharp/async-await
  - csharp/switch-expression    # 사용처 0곳 — 아래 주석

# 「AI 가 대신 쓴 것」 — 구멍 개념 ↔ 같은 일을 하는 다른 표기.
#
# **비워 둔다.** `csharp.md` §1 이 넷을 제안했는데(`async-await` ↔ `coroutine-yield` ·
# `property` ↔ `public-field` · `linq-select` ↔ `foreach-accumulate` · `list` ↔ `array`)
# **present 쪽 개념이 넷 다 사전에 없다.** 없는 id 를 적으면 린트의 `alternatives-exists` 가
# 잡는다. 그 넷은 Unity 모양의 C# 을 위한 것이고, 이 판은 ASP.NET Core 모양을 기준으로
# 잡았으므로(§1) 짝의 present 쪽을 저작할 근거가 아직 없다 — Unity 표본을 재고 나서 올린다.
alternatives: []

thin_threshold: { min_files: 2, min_sites: 3, small_repo_files: 20 }

# 「네 코드엔 없다」 — 표본에서 사용처가 **0곳**인 판 하나 (D177 규칙 ① · D186 ④).
#
# `csharp/switch-expression` 은 표본 254파일에서 0곳이다. 없어서 0곳이 아니라 **그 자리를
# 다른 문법이 가져가서** 0곳이다: 같은 리포에 `switch` 가 딱 한 번 나오는데 그것도 식이 아니라
# **문**이고(`BlazorAdmin/Helpers/ToastComponent.cs:58`), 나머지 갈래는 전부 `if` 와
# 삼항(4곳)이 쓴다. 사유는 `idiom` 이다 — `scale` 이 아니다.
# `packages/cards/src/t0-synthetic.ts` 의 `ABSENCE` 표에
# `'csharp/switch-expression': 'idiom'` 한 줄이 서야 합성 판이 그 사유를 화면에 말할 수 있다
# (그 파일은 이 사전의 소유가 아니라 오케스트레이터가 넣는다).
#
# 얇은 셋(`record` 1곳/1파일 · `while-loop` 1/1 · `using-disposable` 4/3)은 **부재가 아니다** —
# 다만 `record` 와 `while-loop` 은 `thin_threshold`(min_files 2 · min_sites 3)를 못 넘어
# 그 리포에서는 합성이 정본이 된다.

diag_default:
  point:
    ko: "«{{pick}}»{{pick|josa:은,는}} {{role}} 자리입니다. {{concept}}{{concept|josa:은,는}} «{{answer}}» 입니다. {{rule}}"
    en: "«{{pick}}» is the {{role}} slot. The {{concept}} is «{{answer}}». {{rule}}"
  blank:
    ko: "«{{pick}}»{{pick|josa:은,는}} 이 자리에 오지 않습니다. {{rule}}"
    en: "«{{pick}}» does not go in this slot. {{rule}}"
