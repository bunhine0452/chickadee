schema: 1
id: csharp/boolean-literal
# 0부 축 4. 보편형은 `common/boolean-value` 다. 축의 다른 한쪽인 `common/truthiness` 는
# **안 건다** — C# 에는 「참 같은 값」이 아예 없어서 전이할 것이 반대되는 사실뿐이다.
# 자바와는 이 축이 완전히 일치한다(`csharp.md` §6).
universal: common/boolean-value
name: { ko: 참·거짓 값, en: Boolean literal }
token: "true"
grammars: [c_sharp]
framework: null
essential: true
difficulty: 1
prereq: [cs/type]
confusions: []
dict:
  one_liner:
    ko: "조건 자리에 오는 값은 참·거짓 둘뿐이고, 「참처럼 쳐지는 값」이 없다."
    en: "A condition takes only the two truth values; nothing else counts as true."
  why:
    ko: >-
      {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:은,는}} 값이 <b>참이거나 거짓</b>일 수만
      있다고 못 박습니다. 다른 언어에서는 <code>0</code>이나 빈 글자 묶음이 거짓처럼 쳐지지만
      C# 에는 그 규칙이 <b>없어요</b>. <code>if (count)</code>도 <code>if (obj)</code>도
      컴파일이 막습니다(CS0029). 그래서 「무엇이 참으로 쳐지나」를 외울 것이 없고, 대신
      <b>견주기를 눈에 보이게 적어야</b> 합니다 — <code>count > 0</code>, <code>obj != null</code>.
    en: >-
      On line {{site.line}}, {{pick.1|code}} pins the value to <b>true or false</b> and nothing
      else. Other languages let <code>0</code> or an empty run count as false; C# has
      <b>no</b> such rule. Both <code>if (count)</code> and <code>if (obj)</code> stop at
      compile time (CS0029). So there is no table of "what counts as true" to memorise —
      instead the comparison has to be <b>written out</b>: <code>count > 0</code>,
      <code>obj != null</code>.
  trace:
    - ko: "{{site.line}}행이 {{pick.2|code}}{{pick.2|josa:을,를}} 참·거짓만 담는 이름으로 세운다."
      en: "Line {{site.line}} sets {{pick.2|code}} up to hold only truth values."
    - ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 그 제한을 거는 자리다."
      en: "{{pick.1|code}} is where that restriction is placed."
    - ko: "그래서 이 이름은 조건 자리에 그대로 설 수 있다."
      en: "That is why this name can stand in a condition as it is."
rule:
  ko: "<b>조건 자리는 참·거짓만 받는다.</b> 수도 객체도 안 되고, 견주기를 적어야 한다."
  en: "<b>A condition takes only truth values.</b> Not numbers, not objects — write the comparison."
result:
  label: { ko: "{{site.line}}행의 이름", en: "the name on line {{site.line}}" }
  value: "{{pick.1}} {{pick.2}}"
  note: { ko: "참·거짓만 담는다", en: "holds only truth values" }
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 이제 조건 자리에 그대로 설 수 있는 이름입니다."
  en: "{{pick.2|code}} can now stand in a condition as it is."
payoff:
  ko: "이걸 알면 「왜 여기서 컴파일이 막히지」가 풀립니다 — 견주기를 안 적어서예요."
  en: "This untangles “why does it stop compiling here” — the comparison was left unwritten."
bridge:
  ko: >-
    파이썬·자바스크립트는 빈 목록·<code>0</code>·빈 글자를 거짓으로 셉니다. C# 은 안 셉니다 —
    자바와 이 자리가 <b>정확히 같습니다</b>.
  en: >-
    Python and JavaScript count an empty list, <code>0</code> and empty text as false.
    C# does not — and here it matches Java <b>exactly</b>.
misconceptions:
  # 출처 — `csharp.md` §9 ③ · §0.1 0-4.
  - ko: "조건 자리에 아무 값이나 온다 — 참·거짓만 옵니다. <code>if (count)</code>는 CS0029 로 막힙니다."
    en: "Any value can stand in a condition — only truth values can. <code>if (count)</code> stops with CS0029."
  - ko: "<code>0</code>은 거짓이다 — C# 에서 수와 참·거짓은 서로 오가지 않습니다."
    en: "<code>0</code> is false — in C# numbers and truth values never convert into each other."
  - ko: "<code>null</code>은 거짓이다 — 없음도 참·거짓이 아닙니다. <code>!= null</code>을 적어야 합니다."
    en: "<code>null</code> is false — absence is not a truth value either. Write <code>!= null</code>."
point:
  - q:
      ko: "{{site.line}}행에서 <b>이 이름이 참·거짓만 담는다고 못 박는 낱말</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the word that pins this name to truth values</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>이름</b>입니다. <code>Is</code>로 시작하는 이름을 지어도 타입은 안 바뀌어요."
          en: "{{pick.2|code}} is the <b>name</b>. Starting a name with <code>Is</code> does not change the type."
        edge:
          h: { ko: "가장 날카로운 자리 — 이름이냐 타입이냐", en: "The sharpest spot — the name or the type" }
          code:
            - "bool isReady = true;   // 참·거짓"
            - "int isReady = 1;       // 이름만 그럴듯"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 처음 들어가는 <b>값</b>입니다. 값이 참이어도 타입을 정하는 자리는 앞이에요."
          en: "{{pick.3|code}} is the starting <b>value</b>. Even a true value does not set the type — the word in front does."
        edge:
          h: { ko: "가장 날카로운 자리 — 값이냐 타입이냐", en: "The sharpest spot — the value or the type" }
          code:
            - "bool ok = true;"
            - "var ok = true;    // 타입은 여전히 참·거짓"
meaning:
  - q:
      ko: "{{site.line}}행의 이름 대신 <code>if (count)</code>처럼 수를 놓으면 어떻게 될까요?"
      en: "What happens if a number stands in the condition instead, as in <code>if (count)</code>?"
    hint:
      ko: "C# 에는 「참처럼 쳐지는 값」이 없습니다."
      en: "C# has no notion of a value that counts as true."
    options:
      - t:
          ko: "컴파일이 막힌다 — 수는 참·거짓으로 안 바뀐다"
          en: "It stops at compile time — a number does not become a truth value"
      - t:
          ko: "<code>0</code>이면 거짓, 아니면 참으로 돈다"
          en: "It runs: <code>0</code> is false, anything else true"
        diag:
          t:
            ko: "C 와 자바스크립트라면 맞습니다. C# 은 그 변환을 아예 안 두어서 그 줄이 안 돕니다."
            en: "In C and JavaScript that holds. C# defines no such conversion, so the line never runs."
          edge:
            h: { ko: "가장 날카로운 자리 — 변환이 있나", en: "The sharpest spot — is there a conversion" }
            code:
              - "// C: if (count) 는 돈다"
              - "// C#: CS0029 로 막힌다"
      - t:
          ko: "경고만 뜨고 돈다"
          en: "It warns and still runs"
        diag:
          t:
            ko: "경고가 아니라 <b>오류</b>입니다. 경고는 돌게 두지만 이건 안 돌아요."
            en: "It is an <b>error</b>, not a warning. A warning would still run; this does not."
          edge:
            h: { ko: "가장 날카로운 자리 — 경고냐 오류냐", en: "The sharpest spot — warning or error" }
            code:
              - "string? s = null;   // 경고, 돈다"
              - "if (count) { }      // 오류, 안 돈다"
      - t:
          ko: "<code>count</code>가 <code>null</code>일 때만 거짓이 된다"
          en: "It is false only when <code>count</code> is <code>null</code>"
        diag:
          t:
            ko: "없음도 참·거짓이 아닙니다. <code>null</code>을 견주려면 <code>!= null</code>을 적어야 해요."
            en: "Absence is not a truth value either. To test it, write <code>!= null</code>."
          edge:
            h: { ko: "가장 날카로운 자리 — 없음이 거짓인가", en: "The sharpest spot — is absence false" }
            code:
              - "if (obj) { }           // 오류"
              - "if (obj != null) { }   // 된다"
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 <b>참·거짓</b>만 담는 이름을 세웁니다."
      en: "Choose what goes in the blank. Line {{site.line}} sets up a name for a <b>truth value</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "bool", mono: true }
      - t: "int"
        mono: true
        diag:
          t:
            ko: "이건 <b>정수</b> 타입이라 조건 자리에 그대로 못 섭니다. 조건에 쓰려면 견주기를 적어야 해요."
            en: "That is the <b>whole number</b> type and cannot stand in a condition. Using it there needs a comparison."
          edge:
            h: { ko: "가장 날카로운 자리 — 조건에 설 수 있나", en: "The sharpest spot — can it stand in a condition" }
            code:
              - "bool ok = true;  if (ok) { }"
              - "int n = 1;       if (n) { }   // CS0029"
      - t: "string"
        mono: true
        diag:
          t:
            ko: "이건 <b>글자 묶음</b>이라 조건 자리에 못 섭니다. 빈 묶음도 거짓이 아니에요."
            en: "That is a <b>run of characters</b> and cannot stand in a condition. An empty run is not false."
          edge:
            h: { ko: "가장 날카로운 자리 — 빈 값이 거짓인가", en: "The sharpest spot — is empty false" }
            code:
              - "string s = \"\";"
              - "if (s) { }        // CS0029"
      - t: "double"
        mono: true
        diag:
          t:
            ko: "이건 <b>실수</b> 타입이라 조건 자리에 못 섭니다. <code>0.0</code>도 거짓이 아니에요."
            en: "That is the <b>fraction</b> type and cannot stand in a condition. <code>0.0</code> is not false."
          edge:
            h: { ko: "가장 날카로운 자리 — 0 이 거짓인가", en: "The sharpest spot — is zero false" }
            code:
              - "double d = 0.0;"
              - "if (d) { }        // CS0029"
why_gate:
  q:
    ko: "이 언어는 왜 조건 자리에 <b>참·거짓만</b> 받게 했을까요?"
    en: "Why does this language let <b>only truth values</b> stand in a condition?"
  choices:
    - t:
        ko: "무엇이 참으로 쳐지는지를 언어마다 외우는 대신, 견주기를 코드에 적게 하려고"
        en: "So the comparison is written in the code instead of memorised per language"
      ok: true
      fb:
        ko: "그 방향입니다. 그러면 읽는 사람이 무엇을 덜 외워도 되는지도 적어 보세요."
        en: "That is the direction. Add what the reader no longer has to memorise."
    - t:
        ko: "빠르게 돌리려고"
        en: "To make it run faster"
      ok: false
      fb:
        ko: "속도 문제가 아닙니다. 같은 코드가 어느 쪽이든 한 번 견주는 것은 같아요."
        en: "Speed is not it — either way the comparison happens once."
    - t:
        ko: "옛 언어와의 호환 때문에"
        en: "For compatibility with older languages"
      ok: false
      fb:
        ko: "오히려 반대입니다. C 계열의 관습을 <b>버린</b> 자리예요."
        en: "The opposite: this is where the C-family habit was <b>dropped</b>."
queries:
  - { grammars: [c_sharp], file: ./boolean-literal.scm }
examples:
  - code: "bool ok = true;                                 // ok -> true (bool)"
    expect: { sites: 1, form: booldecl, hole: "bool", picks: { 1: "bool", 2: "ok", 3: "true" } }
  - code: "class A { public bool IsActive { get; set; } }  // IsActive -> false (bool)"
    expect: { sites: 1, form: boolprop, picks: { 1: "bool", 2: "IsActive" } }
  - code: "class A { void F(bool force) { } }              // force -> 참·거짓 (bool)"
    expect: { sites: 1, form: boolparam, picks: { 1: "bool", 2: "force" } }
  - code: "int n = 1;                                      // n -> 1 (int)"
    expect: none
