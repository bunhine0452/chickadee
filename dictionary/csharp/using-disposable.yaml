schema: 1
id: csharp/using-disposable
# `csharp.md` §6 이 `common/scoped-cleanup` 을 신규로 제안했는데 아직 `common/` 에 없다.
# 없는 id 를 걸면 린트가 잡으므로 `null` 로 두고 후보로만 보고한다 — 다른 언어 근거는
# 파이썬 `with` · Go `defer` · Rust `Drop` 셋이다.
universal: null
name: { ko: 블록을 벗어나면 정리하기, en: Using }
token: "using"
grammars: [c_sharp]
framework: null
essential: true
difficulty: 3
prereq: [cs/garbage-collection, csharp/interface, csharp/method-call]
confusions: []
dict:
  one_liner:
    ko: "블록을 벗어나는 순간 정리 코드가 반드시 돈다 — 터져서 나가도 돈다."
    en: "Leaving the block always runs the cleanup, failures on the way out included."
  why:
    ko: >-
      메모리는 저절로 돌아오지만 <b>파일·소켓·잠금</b>은 안 돌아옵니다 — 그것들은 자동 회수기가
      모르는 자원이에요. {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:은,는}} 블록을 벗어날 때
      정리 코드를 반드시 돌리는 약속이고, 안에서 예외가 나 <b>튕겨 나가도</b> 돕니다.
      헷갈리는 것은 <b>낱말 하나가 두 가지</b>라는 것 — 파일 맨 위의 같은 낱말은 이름
      가져오기이고 아무것도 안 정리합니다.
    en: >-
      Memory comes back on its own; <b>files, sockets and locks</b> do not — the collector does
      not know about them. {{pick.1|code}} on line {{site.line}} promises the cleanup runs on
      the way out of the block, <b>including</b> when an exception throws you out. The confusing
      part is that <b>one word does two jobs</b>: at the top of the file the same word imports
      names and cleans up nothing.
  trace:
    - ko: "{{site.line}}행이 {{pick.3|code}}{{pick.3|josa:을,를}} 만들고 블록을 연다."
      en: "Line {{site.line}} makes {{pick.3|code}} and opens the block."
    - ko: "{{pick.4|code}} 안이 다 돌거나 중간에 터진다."
      en: "{{pick.4|code}} either finishes or throws partway."
    - ko: "어느 쪽이든 나가는 길에 정리 코드가 한 번 돈다."
      en: "Either way the cleanup runs once on the way out."
rule:
  ko: "<b>나가는 길에 반드시 정리한다.</b> 정리되는 것은 메모리가 아니라 밖의 자원이다."
  en: "<b>Cleanup always runs on the way out.</b> What is released is a resource, not memory."
ok:
  ko: "{{pick.3|code}}{{pick.3|josa:이,가}} 블록을 벗어나는 순간 정리됩니다."
  en: "{{pick.3|code}} is cleaned up the moment the block is left."
payoff:
  ko: "이걸 알면 「파일이 잠긴 채로 남는다」가 풀립니다 — 정리 약속이 없었습니다."
  en: "This untangles “the file stayed locked” — there was no cleanup promise."
bridge:
  ko: >-
    파이썬의 <code>with</code>와 같은 기계입니다. 고는 <code>defer</code>로 <b>함수 끝</b>에
    붙이고, C# 은 <b>블록 끝</b>에 붙어요.
  en: >-
    Same machine as Python's <code>with</code>. Go's <code>defer</code> attaches to the
    <b>end of the function</b>; this attaches to the <b>end of the block</b>.
misconceptions:
  # 출처 — `csharp.md` §9 ⑪ · §4 ㉝.
  - ko: "메모리를 돌려준다 — 메모리는 회수기가 맡습니다. 여기서 놓는 것은 파일·소켓·잠금이에요."
    en: "It returns memory — memory is the collector's job; this releases files, sockets and locks."
  - ko: "예외가 나면 정리가 안 된다 — 터져서 나가도 정리는 돕니다."
    en: "An exception skips the cleanup — it runs on the way out of a failure too."
  - ko: "파일 맨 위의 같은 낱말도 정리한다 — 그쪽은 이름 가져오기이고 아무것도 안 정리합니다."
    en: "The same word at the top of the file also cleans up — that one imports names and cleans nothing."
point:
  - q:
      ko: "{{site.line}}행에서 <b>나갈 때 정리한다는 약속</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the promise to clean up on the way out</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 정리될 <b>대상</b>입니다. 정리를 약속하는 것은 앞의 낱말이에요."
          en: "{{pick.3|code}} is <b>what gets cleaned up</b>. The promise is the word in front."
        edge:
          h: { ko: "가장 날카로운 자리 — 대상이냐 약속이냐", en: "The sharpest spot — the target or the promise" }
          code:
            - "var fs = Open();          // 안 닫힌다"
            - "using (var fs = Open())   // 닫힌다"
      pick.4:
        t:
          ko: "{{pick.4|code}}{{pick.4|josa:은,는}} <b>몸통</b>입니다. 몸통이 끝나는 것과 정리되는 것은 다른 일이에요."
          en: "{{pick.4|code}} is the <b>body</b>. Finishing the body and cleaning up are different things."
        edge:
          h: { ko: "가장 날카로운 자리 — 몸통이냐 약속이냐", en: "The sharpest spot — the body or the promise" }
          code:
            - "{ Read(fs); }             // 몸통만"
            - "using (…) { Read(fs); }   // 정리까지"
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 블록을 <b>벗어날 때 반드시</b> 정리합니다."
      en: "Choose what goes in the blank. Line {{site.line}} <b>always</b> cleans up on leaving the block."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "using", mono: true }
      - t: "lock"
        mono: true
        diag:
          t:
            ko: "이건 <b>한 번에 하나만</b> 들어오게 막는 자리입니다. 자원을 놓는 일과는 다른 일이에요."
            en: "That keeps <b>one at a time</b> inside. Releasing a resource is a different job."
          edge:
            h: { ko: "가장 날카로운 자리 — 정리냐 잠금이냐", en: "The sharpest spot — cleanup or exclusion" }
            code:
              - "using (var fs = Open()) { }"
              - "lock (gate) { }"
      - t: "try"
        mono: true
        diag:
          t:
            ko: "이건 <b>지켜보는</b> 자리라 뒤에 받는 절이나 정리 절이 더 필요합니다. 혼자서는 아무것도 안 놓아요."
            en: "That <b>watches</b> and needs a catch or finally after it. Alone it releases nothing."
          edge:
            h: { ko: "가장 날카로운 자리 — 정리냐 지켜보기냐", en: "The sharpest spot — cleanup or watching" }
            code:
              - "using (var fs = Open()) { }"
              - "try { } finally { fs.Dispose(); }"
      - t: "fixed"
        mono: true
        diag:
          t:
            ko: "이건 값이 <b>안 움직이게</b> 붙들어 두는 자리라 안전하지 않은 코드에서만 씁니다."
            en: "That <b>pins</b> a value so it cannot move, and appears only in unsafe code."
          edge:
            h: { ko: "가장 날카로운 자리 — 정리냐 붙들기냐", en: "The sharpest spot — cleanup or pinning" }
            code:
              - "using (var fs = Open()) { }"
              - "fixed (byte* p = buf) { }"
why_gate:
  q:
    ko: "회수기가 메모리를 돌려주는데 왜 <b>따로</b> 정리를 적을까요?"
    en: "The collector returns memory — why write cleanup <b>separately</b>?"
  choices:
    - t:
        ko: "파일 손잡이나 잠금은 회수기가 모르는 자원이고, 언제 놓이는지가 중요하기 때문"
        en: "Because a file handle or a lock is not the collector's to know, and the timing matters"
      ok: true
      fb:
        ko: "그 방향입니다. 안 놓았을 때 무엇이 일어나는지도 한 줄로 적어 보세요."
        en: "That is the direction. Add a line on what happens when it is not released."
    - t:
        ko: "회수기가 느려서"
        en: "Because the collector is slow"
      ok: false
      fb:
        ko: "속도가 아니라 <b>시점</b>입니다. 언제 도는지 모르는 것이 문제예요."
        en: "Not speed but <b>timing</b>: the problem is not knowing when it runs."
    - t:
        ko: "메모리를 더 빨리 돌려주려고"
        en: "To return memory sooner"
      ok: false
      fb:
        ko: "메모리는 여기서 안 돌려줍니다. 놓는 것은 밖의 자원이에요."
        en: "Memory is not returned here — what is released is an outside resource."
queries:
  - { grammars: [c_sharp], file: ./using-disposable.scm }
examples:
  - code: "class A { void F() { using (var fs = Open()) { } } }"
    expect: { sites: 1, form: block, hole: "using", picks: { 1: "using", 2: "var", 3: "fs", 4: "{ }" } }
  - code: "class A { void F(IDisposable conn) { using (conn) { G(); } } }"
    expect: { sites: 1, form: expression, hole: "using", picks: { 1: "using", 2: "conn", 4: "{ G(); }" } }
  - code: "using System.Text;"
    expect: none
