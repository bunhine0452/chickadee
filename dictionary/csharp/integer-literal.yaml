schema: 1
id: csharp/integer-literal
# 0부 축 1 (`docs/curriculum/README.md` §8). 보편형은 `common/integer-literal` 이다 —
# 고정 폭 정수라는 기계가 자바·C·Go·Rust 와 같다. C# 에서 다시 배울 것은 **넘칠 때
# 무엇이 일어날지를 코드가 고른다**는 것 하나다.
universal: common/integer-literal
name: { ko: 정수 값과 그 폭, en: Integer literal }
token: "01"
grammars: [c_sharp]
framework: null
essential: true
difficulty: 1
prereq: [cs/binary-representation, cs/bit-and-byte, cs/integer-overflow]
confusions: []
dict:
  one_liner:
    ko: "정수는 켜짐·꺼짐 칸의 묶음이고, 앞에 적은 타입 이름이 그 칸 수를 못 박는다."
    en: "A whole number is a run of on/off slots; the type name in front fixes how many."
  why:
    ko: >-
      {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:은,는}} 값이 아니라 <b>칸 수</b>를 정합니다.
      <code>int</code>는 32칸, <code>long</code>은 64칸, <code>short</code>는 16칸,
      <code>byte</code>는 8칸이고 이 값은 기계가 32비트든 64비트든 <b>안 바뀝니다</b>.
      칸이 정해져 있으니 가장 큰 값 다음이 가장 작은 값입니다 — 실측
      <code>int.MaxValue + 1</code>은 <b>−2147483648</b>입니다. 예외가 아니라 조용히 감기는 것이
      C# 의 <b>기본값</b>이고, <code>checked</code>를 적었을 때만 터집니다.
    en: >-
      On line {{site.line}}, {{pick.1|code}} fixes the <b>slot count</b>, not the value.
      <code>int</code> is 32 slots, <code>long</code> 64, <code>short</code> 16,
      <code>byte</code> 8, and none of that <b>changes</b> on a 32-bit or a 64-bit machine.
      With the slots fixed, the largest value is followed by the smallest — measured,
      <code>int.MaxValue + 1</code> is <b>-2147483648</b>. Wrapping quietly is C#'s
      <b>default</b>; it throws only where <code>checked</code> is written.
  trace:
    - ko: "{{site.line}}행이 이름 {{pick.2|code}}{{pick.2|josa:을,를}} 세운다."
      en: "Line {{site.line}} sets up the name {{pick.2|code}}."
    - ko: "앞에 붙은 {{pick.1|code}}{{pick.1|josa:이,가}} 칸 수를 정한다."
      en: "The {{pick.1|code}} in front fixes how many slots it gets."
    - ko: "칸이 모자라면 값이 넘어가는 것이 아니라 반대쪽 끝으로 감긴다."
      en: "When the slots run short the value does not grow — it wraps to the other end."
rule:
  ko: "<b>타입이 칸 수를 정한다.</b> 넘치면 기본은 조용히 감기고, <code>checked</code>를 적으면 터진다."
  en: "<b>The type fixes the slot count.</b> Overflow wraps by default and throws under <code>checked</code>."
result:
  label: { ko: "{{site.line}}행의 이름", en: "the name on line {{site.line}}" }
  value: "{{pick.1}} {{pick.2}}"
  note: { ko: "칸 수가 여기서 정해진다", en: "the slot count is fixed here" }
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 이제 칸 수가 정해진 이름입니다."
  en: "{{pick.2|code}} is now a name with a fixed number of slots."
payoff:
  ko: "이걸 알면 「큰 수를 더했더니 음수가 나온다」가 풀립니다 — 칸이 모자란 겁니다."
  en: "This untangles “I added and got a negative” — the slots ran out."
bridge:
  ko: >-
    같은 자리에서 언어가 갈립니다. 스위프트는 <b>죽고</b>, 고는 언제나 감기고, C# 만
    <code>checked</code>로 <b>고르게</b> 합니다.
  en: >-
    Languages part ways right here. Swift <b>dies</b>, Go always wraps, and only C# lets you
    <b>choose</b> with <code>checked</code>.
misconceptions:
  # 출처 — `csharp.md` §0.1 0-1 · §0.4 실측(.NET SDK 10.0.302, 2026-09-05).
  - ko: "넘치면 예외가 난다 — 기본은 조용히 감깁니다. 실측 <code>int.MaxValue + 1</code>은 −2147483648 입니다."
    en: "Overflow throws — by default it wraps quietly. Measured, <code>int.MaxValue + 1</code> is -2147483648."
  - ko: "큰 값을 넣으면 칸이 늘어난다 — 안 늘어납니다. 칸 수는 이 줄에서 이미 정해졌습니다."
    en: "A big value gets more slots — it does not. The count was settled on this line."
  - ko: "칸 수가 컴퓨터마다 다르다 — C 에서는 참이지만 C# 은 명세가 못 박습니다."
    en: "The slot count varies by machine — true in C, but C#'s specification pins it."
point:
  - q:
      ko: "{{site.line}}행에서 <b>칸 수를 정하는 낱말</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the word that fixes the slot count</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>이름</b>입니다. 이름을 길게 지어도 칸은 그대로예요."
          en: "{{pick.2|code}} is the <b>name</b>. A longer name gets no more slots."
        edge:
          h: { ko: "가장 날카로운 자리 — 이름이냐 타입이냐", en: "The sharpest spot — the name or the type" }
          code:
            - "int n;      // 32칸"
            - "long n;     // 같은 이름, 64칸"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 처음 들어가는 <b>값</b>입니다. 값이 작아도 칸은 타입이 정한 만큼 잡혀요."
          en: "{{pick.3|code}} is the starting <b>value</b>. Small values still take all the slots the type asks for."
        edge:
          h: { ko: "가장 날카로운 자리 — 값이냐 칸이냐", en: "The sharpest spot — the value or the slots" }
          code:
            - "int n = 0;      // 32칸을 쓴다"
            - "byte b = 0;     // 8칸을 쓴다"
meaning:
  - q:
      ko: "{{site.line}}행의 이름에 담을 수 있는 가장 큰 값 <b>다음</b>은 무엇일까요?"
      en: "What comes <b>after</b> the largest value this name can hold on line {{site.line}}?"
    hint:
      ko: "칸이 정해져 있다는 것에서 답이 나옵니다."
      en: "The answer follows from the slots being fixed."
    options:
      - t:
          ko: "가장 작은 값 — 반대쪽 끝으로 감긴다"
          en: "The smallest value — it wraps to the other end"
      - t:
          ko: "예외가 나면서 멈춘다"
          en: "It stops with an exception"
        diag:
          t:
            ko: "<code>checked</code>를 적었다면 그 말이 맞습니다. 안 적은 자리에서는 조용히 감겨요 — 실측 −2147483648 입니다."
            en: "That holds where <code>checked</code> is written. Without it the value wraps quietly — measured, -2147483648."
          edge:
            h: { ko: "가장 날카로운 자리 — 적었나 안 적었나", en: "The sharpest spot — written or not" }
            code:
              - "int.MaxValue + 1            // -2147483648"
              - "checked(int.MaxValue + 1)   // OverflowException"
      - t:
          ko: "칸이 하나 늘어나 그대로 담긴다"
          en: "One more slot appears and it fits"
        diag:
          t:
            ko: "파이썬이라면 그 말이 맞습니다. C# 은 칸 수를 이 줄에서 이미 정했고 뒤에 안 바꿔요."
            en: "In Python that would hold. C# settled the slot count on this line and does not revise it."
          edge:
            h: { ko: "가장 날카로운 자리 — 칸이 느나 안 느나", en: "The sharpest spot — do the slots grow" }
            code:
              - "# Python: 2**100 도 담긴다"
              - "// C#: int 는 언제나 32칸"
      - t:
          ko: "값이 그 자리에 그대로 멈춰 더 안 올라간다"
          en: "The value sticks at the top and stops climbing"
        diag:
          t:
            ko: "그렇게 동작하는 언어도 있지만 C# 은 아닙니다. 감기는 쪽이라 <b>부호까지 뒤집힙니다</b>."
            en: "Some systems saturate like that; C# does not. It wraps, so <b>even the sign flips</b>."
          edge:
            h: { ko: "가장 날카로운 자리 — 멈추나 감기나", en: "The sharpest spot — saturate or wrap" }
            code:
              - "2147483647 + 1   // -2147483648"
              - "// 멈췄다면 2147483647 이어야 한다"
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 <b>32칸짜리 정수</b> 이름을 세웁니다."
      en: "Choose what goes in the blank. Line {{site.line}} sets up a <b>32-slot whole number</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "int", mono: true }
      - t: "double"
        mono: true
        diag:
          t:
            ko: "이건 <b>실수</b> 타입이라 64칸을 쓰고 소수를 담습니다. 소수를 안 담는 자리에 쓰면 값이 <code>3</code>이 아니라 <code>3.5</code>로 나와요."
            en: "That is the <b>decimal</b> type — 64 slots that hold a fraction. Where no fraction is wanted the value prints <code>3.5</code>, not <code>3</code>."
          edge:
            h: { ko: "가장 날카로운 자리 — 정수냐 실수냐", en: "The sharpest spot — whole or fractional" }
            code:
              - "int n = 7 / 2;        // 3"
              - "double d = 7 / 2.0;   // 3.5"
      - t: "string"
        mono: true
        diag:
          t:
            ko: "이건 <b>글자 묶음</b>이라 칸 수가 고정이 아닙니다. 셈에 쓰면 더하기가 아니라 이어붙이기가 돼요."
            en: "That is a <b>run of characters</b> and its size is not fixed. In arithmetic it joins instead of adding."
          edge:
            h: { ko: "가장 날카로운 자리 — 수냐 글자냐", en: "The sharpest spot — a number or text" }
            code:
              - "int n = 1 + 2;           // 3"
              - "string s = 1 + \"2\";      // 12"
      - t: "bool"
        mono: true
        diag:
          t:
            ko: "이건 <b>참·거짓</b> 타입이라 수를 못 담습니다. C# 에서 참·거짓과 숫자는 서로 오가지 않아요."
            en: "That is the <b>true/false</b> type and holds no number. In C# the two never convert into each other."
          edge:
            h: { ko: "가장 날카로운 자리 — 수냐 참·거짓이냐", en: "The sharpest spot — a number or a truth value" }
            code:
              - "int n = 1;"
              - "bool b = true;"
why_gate:
  q:
    ko: "{{site.line}}행은 왜 <b>칸 수를 먼저 적고</b> 이름을 적을까요?"
    en: "Why does line {{site.line}} write <b>the slot count first</b> and the name after?"
  choices:
    - t:
        ko: "컴파일러가 이 이름에 자리를 얼마나 잡을지 그 줄에서 정해야 하기 때문"
        en: "Because the compiler has to decide how much room this name gets, right on that line"
      ok: true
      fb:
        ko: "그 방향입니다. 자리를 나중에 정하면 못 정하는 것이 무엇인지도 적어 보세요."
        en: "That is the direction. Say what could not be decided if the room were settled later."
    - t:
        ko: "C# 이 읽기 좋게 하려고 고른 순서라서"
        en: "Because C# picked that order to read nicely"
      ok: false
      fb:
        ko: "읽기 문제가 아닙니다. 값이 놓이기 전에 자리가 정해져야 해서 생기는 순서입니다."
        en: "It is not about reading. The order exists because the room is settled before any value lands."
    - t:
        ko: "값을 보면 칸 수를 알 수 있어서"
        en: "Because the value tells you the slot count"
      ok: false
      fb:
        ko: "값으로는 못 압니다. <code>0</code> 하나만 봐도 8칸일 수도 64칸일 수도 있어요."
        en: "The value cannot tell you. A bare <code>0</code> may sit in 8 slots or in 64."
queries:
  - { grammars: [c_sharp], file: ./integer-literal.scm }
examples:
  # 값을 든 예 — 식 · 값 · 타입 (`docs/program/fundamentals.md` §8 이 카탈로그로 걷어 갈 재료).
  - code: "int n = 7 / 2;                    // n -> 3 (int, 32칸)"
    expect: { sites: 1, form: intdecl, hole: "int", picks: { 1: "int", 2: "n", 3: "7 / 2" } }
  - code: "class A { private long _ms; }     // _ms -> 0 (long, 64칸)"
    expect: { sites: 1, form: intfield, picks: { 1: "long", 2: "_ms" } }
  - code: "class A { void F(byte flag) { } } // flag -> 8칸 (byte)"
    expect: { sites: 1, form: intparam, picks: { 1: "byte", 2: "flag" } }
  - code: "double d = 1.5;                   // d -> 1.5 (double)"
    expect: none
