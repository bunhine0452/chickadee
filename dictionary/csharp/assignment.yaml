schema: 1
id: csharp/assignment
# 0부 축 7. 축의 보편형이 `common/variable-binding` 과 `common/reassignment` **둘**인데
# 스키마는 하나만 받는다. C# 은 그 둘을 한 판으로 묶으므로(csharp.md §0.5) 「세우는 쪽」을
# 건다 — 세우는 줄에 낱말이 하나 더 붙는 것이 이 언어의 어긋남이기 때문이다.
universal: common/variable-binding
name: { ko: 이름을 세우기와 옮기기, en: Binding and assignment }
token: "var"
grammars: [c_sharp]
framework: null
essential: true
difficulty: 1
prereq: [cs/state, cs/value-vs-reference, cs/stack-and-heap]
confusions: []
dict:
  one_liner:
    ko: "이름을 세우는 줄에는 낱말이 하나 더 있고, 옮기는 줄에는 없다."
    en: "Setting a name up carries one extra word; moving it carries none."
  why:
    ko: >-
      파이썬은 세우는 줄과 옮기는 줄이 <b>똑같이 생겨서</b> 위를 훑어야 구별합니다. C# 은
      그럴 필요가 없어요 — {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:이,가}} 그 표시입니다.
      그리고 이 줄이 무엇을 복사하는지는 <b>타입이 값형인지 참조형인지</b>가 정합니다.
      <code>struct</code>면 값 전체가, <code>class</code>면 가리키는 화살표만 복사돼요.
      실측 — 같은 대입 뒤에 원본을 보면 값형은 <b>1</b>, 참조형은 <b>9</b>입니다.
      같은 <code>=</code> 하나가 두 일을 합니다.
    en: >-
      In Python the line that sets a name up and the line that moves it <b>look the same</b>,
      so you scan upward to tell them apart. C# does not need that — {{pick.1|code}} on line
      {{site.line}} is the marker. What this line copies is settled by whether the type is a
      <b>value type or a reference type</b>: a <code>struct</code> copies the whole value, a
      <code>class</code> copies only the arrow. Measured, after the same assignment the
      original reads <b>1</b> for the value type and <b>9</b> for the reference type.
      One <code>=</code> doing two jobs.
  trace:
    - ko: "{{site.line}}행에서 {{pick.3|code}}{{pick.3|josa:이,가}} 먼저 값이 된다."
      en: "On line {{site.line}}, {{pick.3|code}} becomes a value first."
    - ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 그 값을 받는다."
      en: "{{pick.2|code}} takes that value."
    - ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 세우는 줄인지 옮기는 줄인지 말한다."
      en: "{{pick.1|code}} says whether this line sets the name up or moves it."
rule:
  ko: "<b>세우는 줄에는 낱말이 하나 더 있다.</b> 그리고 복사되는 것은 타입이 값형인지가 정한다."
  en: "<b>Setting up carries one extra word.</b> What gets copied depends on whether the type is a value type."
result:
  label: { ko: "{{site.line}}행 아래의 {{pick.2}}", en: "{{pick.2}} below line {{site.line}}" }
  value: "{{pick.3}}"
  note: { ko: "값형이면 통째로, 참조형이면 화살표만", en: "whole value if a value type, arrow only if not" }
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 이제 {{pick.3|code}} 쪽을 봅니다."
  en: "{{pick.2|code}} now looks at {{pick.3|code}}."
payoff:
  ko: "이걸 알면 「복사했는데 원본이 같이 바뀐다」가 풀립니다 — 화살표만 복사된 겁니다."
  en: "This untangles “I copied it and the original changed too” — only the arrow was copied."
bridge:
  ko: >-
    파이썬에는 세우는 낱말이 <b>없어서</b> 읽는 사람이 위를 봐야 합니다. C# 은 그 줄만 보고
    압니다. 대신 <b>무엇이 복사되나</b>는 C# 쪽이 더 어렵습니다.
  en: >-
    Python has <b>no</b> word for setting a name up, so the reader has to look upward. C# tells
    you from the line alone — but <b>what gets copied</b> is the harder question here.
misconceptions:
  # 출처 — `csharp.md` §9 ①·⑥·⑦ · §0.4 실측(struct 1 / class 9).
  - ko: "<code>var</code>는 동적 타입이다 — 컴파일 시각에 타입이 정해지고 그 뒤 안 바뀝니다(CS0029)."
    en: "<code>var</code> means dynamic — the type is fixed at compile time and does not move (CS0029)."
  - ko: "객체를 넘기면 복사된다 — <code>class</code>는 화살표만 갑니다. 실측 원본이 9 로 바뀝니다."
    en: "Passing an object copies it — a <code>class</code> passes only the arrow. Measured, the original reads 9."
  - ko: "목록을 메서드에 넘기면 원본이 안 바뀐다 — 화살표가 가므로 <code>Add</code>는 원본을 늘립니다."
    en: "Passing a list leaves the original alone — the arrow travels, so <code>Add</code> grows the original."
point:
  - q:
      ko: "{{site.line}}행이 <b>이름을 세우는 줄인지 옮기는 줄인지 정하는 자리</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>what decides whether the name is being set up or moved</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>이름</b>입니다. 같은 이름이 세우는 줄에도 옮기는 줄에도 나오므로 이름만으로는 못 가릅니다."
          en: "{{pick.2|code}} is the <b>name</b>. The same name appears on both kinds of line, so it cannot tell them apart."
        edge:
          h: { ko: "가장 날카로운 자리 — 이름이냐 앞 낱말이냐", en: "The sharpest spot — the name or the word before" }
          code:
            - "var n = 0;   // 세운다"
            - "n = 1;       // 옮긴다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 담길 <b>값</b>입니다. 값은 어느 쪽 줄에나 올 수 있어요."
          en: "{{pick.3|code}} is the <b>value</b>. A value can appear on either kind of line."
        edge:
          h: { ko: "가장 날카로운 자리 — 값이냐 앞 낱말이냐", en: "The sharpest spot — the value or the word before" }
          code:
            - "int total = 0;"
            - "total = 0;"
meaning:
  - q:
      ko: "{{site.line}}행의 타입이 <code>class</code>라면, 이 대입으로 무엇이 복사될까요?"
      en: "If the type on line {{site.line}} is a <code>class</code>, what does this assignment copy?"
    hint:
      ko: "값형과 참조형에서 답이 갈립니다."
      en: "The answer splits between value types and reference types."
    options:
      - t:
          ko: "가리키는 화살표만 — 두 이름이 같은 것을 본다"
          en: "Only the arrow — both names look at the same thing"
      - t:
          ko: "값 전체 — 두 이름이 서로 다른 것을 본다"
          en: "The whole value — the two names look at different things"
        diag:
          t:
            ko: "<code>struct</code>라면 맞습니다. 실측 그때 원본은 1 로 남고, <code>class</code>면 9 로 바뀝니다."
            en: "For a <code>struct</code> that holds — measured, the original stays 1 there and becomes 9 for a <code>class</code>."
          edge:
            h: { ko: "가장 날카로운 자리 — struct 냐 class 냐", en: "The sharpest spot — struct or class" }
            code:
              - "struct P { public int X; }   // 원본 1"
              - "class  P { public int X; }   // 원본 9"
      - t:
          ko: "아무것도 — 이름 둘이 완전히 따로 논다"
          en: "Nothing — the two names are unrelated"
        diag:
          t:
            ko: "대입은 언제나 무언가를 복사합니다. 갈리는 것은 <b>무엇을</b> 복사하나예요."
            en: "An assignment always copies something. What splits is <b>what</b> it copies."
          edge:
            h: { ko: "가장 날카로운 자리 — 무엇을 복사하나", en: "The sharpest spot — what gets copied" }
            code:
              - "b = a;   // 값 전체 또는 화살표"
              - "// 둘 중 하나는 반드시 복사된다"
      - t:
          ko: "이름에 따라 다르다"
          en: "It depends on the name"
        diag:
          t:
            ko: "이름은 관여하지 않습니다. 정하는 것은 <b>타입 선언</b>이고, 그것이 이 언어의 축이에요."
            en: "The name takes no part. The <b>type declaration</b> decides, and that is this language's axis."
          edge:
            h: { ko: "가장 날카로운 자리 — 이름이냐 타입이냐", en: "The sharpest spot — the name or the type" }
            code:
              - "// 같은 이름, 다른 선언"
              - "struct P {} / class P {}"
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 이름을 <b>새로 세우고</b> 타입은 오른쪽에서 정합니다."
      en: "Choose what goes in the blank. Line {{site.line}} <b>sets a new name up</b> and takes its type from the right."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "var", mono: true }
      - t: "int"
        mono: true
        diag:
          t:
            ko: "이것도 이름을 세우지만 타입을 <b>손으로 못 박습니다</b>. 오른쪽이 다른 타입이면 그 자리에서 막혀요."
            en: "That also sets a name up but <b>pins the type by hand</b>. If the right side is another type it stops right there."
          edge:
            h: { ko: "가장 날카로운 자리 — 못 박나 맡기나", en: "The sharpest spot — pin it or infer it" }
            code:
              - "var s = \"hi\";     // string"
              - "int s = \"hi\";     // CS0029"
      - t: "new"
        mono: true
        diag:
          t:
            ko: "이건 <b>값을 만드는</b> 낱말이라 오른쪽에 옵니다. 이름을 세우는 자리는 왼쪽이에요."
            en: "That <b>makes a value</b> and belongs on the right. Setting a name up happens on the left."
          edge:
            h: { ko: "가장 날카로운 자리 — 왼쪽이냐 오른쪽이냐", en: "The sharpest spot — left or right" }
            code:
              - "var a = new Cart();"
              - "new a = Cart();      // 문법이 아니다"
      - t: "static"
        mono: true
        diag:
          t:
            ko: "이건 <b>타입에 붙는</b> 표시라 지역 이름에는 못 씁니다. 클래스 안 멤버 앞에 오는 낱말이에요."
            en: "That marks something as belonging to the <b>type</b> and cannot precede a local name."
          edge:
            h: { ko: "가장 날카로운 자리 — 지역이냐 멤버냐", en: "The sharpest spot — local or member" }
            code:
              - "var n = 0;                   // 지역"
              - "class A { static int N; }    // 멤버"
why_gate:
  q:
    ko: "이 언어는 왜 이름을 세우는 줄에 <b>낱말을 하나 더</b> 요구할까요?"
    en: "Why does this language want <b>one extra word</b> on the line that sets a name up?"
  choices:
    - t:
        ko: "읽는 사람이 위를 훑지 않아도 그 줄만 보고 새 이름인지 알 수 있게 하려고"
        en: "So the reader can tell a new name from that line alone, without scanning upward"
      ok: true
      fb:
        ko: "그 방향입니다. 낱말이 없으면 읽는 사람이 무엇을 더 해야 하는지도 적어 보세요."
        en: "That is the direction. Add what the reader would have to do without it."
    - t:
        ko: "컴파일러가 그 낱말 없이는 타입을 못 알아서"
        en: "Because the compiler cannot work out the type without it"
      ok: false
      fb:
        ko: "타입은 오른쪽에서 알 수 있습니다 — <code>var</code>가 바로 그 증거예요. 낱말은 <b>사람</b>을 위한 것입니다."
        en: "The type comes from the right — <code>var</code> proves it. The word is for the <b>reader</b>."
    - t:
        ko: "타입을 못 바꾸게 막으려고"
        en: "To keep the type from changing"
      ok: false
      fb:
        ko: "막는 것은 낱말이 아니라 정적 타입 자체입니다. <code>var</code>로 세워도 타입은 안 바뀝니다."
        en: "What blocks it is static typing itself, not the word. A name set up with <code>var</code> keeps its type too."
queries:
  - { grammars: [c_sharp], file: ./assignment.scm }
examples:
  - code: "var count = 0;                        // count -> 0 (int, 오른쪽에서 추론)"
    expect: { sites: 1, form: declare, hole: "var", picks: { 1: "var", 2: "count", 3: "0" } }
  - code: "int total = 1;                        // total -> 1 (int, 손으로 못 박음)"
    expect: { sites: 1, form: declare, hole: "int", picks: { 1: "int", 2: "total", 3: "1" } }
  - code: "class A { void F() { count = 1; } }   // count -> 1 — 세우는 줄이 아니다"
    expect: { sites: 1, form: reassign, picks: { 1: "=", 2: "count", 3: "1" } }
  - code: "class A { int Count { get; set; } }   // 프로퍼티 선언은 이 판이 아니다"
    expect: none
