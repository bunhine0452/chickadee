schema: 1
id: csharp/method-declaration
universal: common/function-definition
name: { ko: 타입 안에 메서드 만들기, en: Method declaration }
token: "int F()"
grammars: [c_sharp]
framework: null
essential: true
difficulty: 1
# 문서(`csharp.md` §2 ⑦)는 선행을 `csharp/class-declaration` 으로 적었는데 그 개념은 2부다.
# 1부에서 배우는 것은 **문의 모양**이고, 클래스 껍데기는 `csharp-learning.md` §11.2 가
# 「보여 주되 안 가르친다」로 정리한 자리라 선행을 안 건다 — 어긋남은 `csharp.md` §11 에 적었다.
prereq: [cs/call-stack]
confusions: []
dict:
  one_liner:
    ko: "돌려줄 것의 종류를 이름보다 먼저 적고, 그 전부가 타입 안에 산다."
    en: "What comes back is written before the name, and the whole thing lives in a type."
  why:
    ko: >-
      C# 에는 <b>자유 함수가 없습니다</b>. {{site.line}}행의 {{pick.2|code}}{{pick.2|josa:은,는}}
      반드시 어떤 타입 안에 있고, 그래서 이 언어를 처음 여는 사람은 클래스 껍데기를
      <b>피할 수 없어요</b>. 그리고 {{pick.1|code}}{{pick.1|josa:이,가}} 이름보다 <b>앞</b>에
      옵니다 — 그 자리가 「이 메서드를 부르면 무엇이 손에 남나」의 답이고,
      값을 돌려주기로 적어 놓고 안 돌려주면 컴파일이 막습니다(CS0161).
    en: >-
      C# has <b>no free functions</b>. {{pick.2|code}} on line {{site.line}} always sits inside
      some type, so anyone opening this language <b>cannot avoid</b> the class shell. And
      {{pick.1|code}} comes <b>before</b> the name — that slot answers "what is in my hand
      after I call this," and promising a value without returning one stops at compile
      time (CS0161).
  trace:
    - ko: "{{site.line}}행이 {{pick.2|code}}{{pick.2|josa:을,를}} 부를 수 있는 이름으로 세운다."
      en: "Line {{site.line}} sets {{pick.2|code}} up as a name that can be called."
    - ko: "{{pick.3|code}}{{pick.3|josa:이,가}} 부르는 쪽이 넣어 줄 것을 받는다."
      en: "{{pick.3|code}} takes what the caller passes in."
    - ko: "{{pick.4|code}} 안이 다 돌고 나면 {{pick.1|code}} 하나가 손에 남는다."
      en: "When {{pick.4|code}} finishes, one {{pick.1|code}} is left in the caller's hand."
rule:
  ko: "<b>돌려줄 것의 종류가 이름보다 먼저 온다.</b> 그리고 메서드는 타입 밖에 못 산다."
  en: "<b>The kind of thing returned comes before the name.</b> And a method cannot live outside a type."
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:을,를}} 부르면 {{pick.1|code}} 하나가 손에 남습니다."
  en: "Calling {{pick.2|code}} leaves one {{pick.1|code}} in your hand."
payoff:
  ko: "이걸 알면 「이 메서드를 부르면 무엇이 나오나」를 몸통 안 읽고 압니다."
  en: "This lets you tell what a call yields without reading the body."
bridge:
  ko: >-
    파이썬·자바스크립트는 파일에 함수를 그냥 둘 수 있습니다. C# 은 <b>못 둡니다</b> —
    최상위 문이 있는 <code>Program.cs</code>도 컴파일러가 클래스로 감싸 줍니다.
  en: >-
    Python and JavaScript let a function sit in a file. C# <b>does not</b> — even a
    <code>Program.cs</code> of top-level statements gets wrapped in a class by the compiler.
misconceptions:
  # 출처 — `csharp.md` §2 ⑦·⑧.
  - ko: "타입 밖에도 함수를 둘 수 있다 — 없습니다. 최상위 문도 컴파일러가 클래스로 감쌉니다."
    en: "A function can sit outside a type — it cannot. Even top-level statements get wrapped in a class."
  - ko: "값을 안 돌려줘도 조용히 없음이 간다 — 컴파일이 막습니다(CS0161)."
    en: "Skipping the return quietly yields nothing — it stops at compile time (CS0161)."
  - ko: "이름이 같으면 같은 메서드다 — 이름이 같아도 인자 타입이 다르면 다른 메서드입니다."
    en: "Same name means same method — with different parameter types they are different methods."
point:
  - q:
      ko: "{{site.line}}행에서 <b>부른 쪽 손에 남는 것의 종류</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the kind of thing left in the caller's hand</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>이름</b>입니다. 이름이 무엇을 뜻하든 돌려주는 종류는 앞에 적힌 것이에요."
          en: "{{pick.2|code}} is the <b>name</b>. Whatever it suggests, the kind returned is the word in front."
        edge:
          h: { ko: "가장 날카로운 자리 — 이름이냐 돌려줄 종류냐", en: "The sharpest spot — the name or the return kind" }
          code:
            - "int GetName();     // 이름과 종류가 어긋날 수 있다"
            - "string GetName();"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>받는 것</b>입니다. 들어오는 쪽이지 나가는 쪽이 아니에요."
          en: "{{pick.3|code}} is what <b>comes in</b>, not what goes out."
        edge:
          h: { ko: "가장 날카로운 자리 — 들어오나 나가나", en: "The sharpest spot — in or out" }
          code:
            - "int F(string s)    // string 이 들어온다"
            - "int F(string s)    // int 가 나간다"
      pick.4:
        t:
          ko: "{{pick.4|code}}{{pick.4|josa:은,는}} <b>몸통</b>입니다. 몸통을 안 읽고도 무엇이 나오는지 알게 해 주는 것이 앞의 낱말이에요."
          en: "{{pick.4|code}} is the <b>body</b>. The word in front is what lets you skip reading it."
        edge:
          h: { ko: "가장 날카로운 자리 — 몸통이냐 시그니처냐", en: "The sharpest spot — the body or the signature" }
          code:
            - "int F() { ... }    // 몸통을 안 봐도"
            - "int                // int 가 나온다"
no_hole_reason: >-
  구멍을 못 뚫는다. 돌려줄 타입이 사용처마다 다르고(`void`·`int`·`Task<ActionResult<T>>`)
  보기 넷을 한 벌로 못 고정한다 — 첫 보기가 구멍 원문이어야 하는데 원문이 매번 달라
  카드가 생성 단계에서 떨어진다. 대신 지목형이 같은 자리를 묻는다.
why_gate:
  q:
    ko: "C# 은 왜 <b>타입 밖에</b> 함수를 못 두게 했을까요?"
    en: "Why does C# forbid a function <b>outside</b> a type?"
  choices:
    - t:
        ko: "이름이 어디에 속하는지를 언제나 한 곳으로 정해 두려고 — 모든 이름에 주소가 생긴다"
        en: "So every name has exactly one home, which gives every name an address"
      ok: true
      fb:
        ko: "그 방향입니다. 그러면 이름이 겹칠 때 무엇이 갈라 주는지도 적어 보세요."
        en: "That is the direction. Add what separates two names that collide."
    - t:
        ko: "함수보다 클래스가 빨라서"
        en: "Because classes are faster than functions"
      ok: false
      fb:
        ko: "속도 문제가 아닙니다. 같은 코드가 어디에 있든 같은 기계어가 나옵니다."
        en: "Speed is not it — the same code compiles the same wherever it sits."
    - t:
        ko: "객체 지향 언어라서 모든 것이 객체여야 해서"
        en: "Because it is object-oriented and everything must be an object"
      ok: false
      fb:
        ko: "메서드 자체는 객체가 아닙니다. 담기는 자리가 타입일 뿐이에요."
        en: "A method is not itself an object; only its home is a type."
queries:
  - { grammars: [c_sharp], file: ./method-declaration.scm }
examples:
  - code: "class A { int Add(int a, int b) { return a + b; } }"
    expect: { sites: 1, form: method, picks: { 1: "int", 2: "Add", 3: "(int a, int b)", 4: "{ return a + b; }" } }
  - code: "class A { void Run() { } }"
    expect: { sites: 1, form: method, picks: { 1: "void", 2: "Run", 3: "()", 4: "{ }" } }
  - code: "int n = 1;"
    expect: none
