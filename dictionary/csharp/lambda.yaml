schema: 1
id: csharp/lambda
universal: common/function-value
name: { ko: 값으로서의 함수, en: Lambda }
token: "=>"
grammars: [c_sharp]
framework: null
essential: true
difficulty: 2
prereq: [cs/closure-capture, csharp/method-declaration]
confusions: []
dict:
  one_liner:
    ko: "왼쪽이 받는 것, 오른쪽이 하는 일 — 그 둘이 묶여 값 하나가 된다."
    en: "Left is what it takes, right is what it does, and the pair becomes one value."
  why:
    ko: >-
      {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:은,는}} 함수를 <b>값으로</b> 만듭니다.
      이름이 없어도 되고, 변수에 넣거나 인자로 넘길 수 있어요 — ASP.NET Core 의 라우트
      핸들러와 LINQ 인자가 전부 이 모양이라 첫 화면에 널려 있습니다. C# 에서 한 가지 헷갈리는
      것은 <b>같은 화살표가 두 가지 일</b>을 한다는 것 — 여기서는 함수 값이고,
      멤버 선언 뒤에 붙으면 「몸통을 식 하나로 적는다」는 뜻입니다.
    en: >-
      {{pick.1|code}} on line {{site.line}} turns a function into a <b>value</b>. It needs no
      name and can be stored or passed — ASP.NET Core route handlers and LINQ arguments are all
      this shape, so it fills the first screen. One confusing part in C#: <b>the same arrow does
      two jobs</b>. Here it makes a function value; after a member declaration it means "this
      body is one expression."
  trace:
    - ko: "{{site.line}}행의 {{pick.2|code}}{{pick.2|josa:이,가}} 받을 것을 적는다."
      en: "{{pick.2|code}} on line {{site.line}} writes what it takes."
    - ko: "{{pick.3|code}}{{pick.3|josa:이,가}} 할 일을 적는다."
      en: "{{pick.3|code}} writes what it does."
    - ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 그 둘을 묶어 값 하나로 만든다."
      en: "{{pick.1|code}} binds the two into one value."
rule:
  ko: "<b>함수가 값이 된다.</b> 같은 화살표가 식 본문 멤버에도 쓰이므로 자리를 봐야 한다."
  en: "<b>A function becomes a value.</b> The same arrow also writes expression-bodied members."
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:을,를}} 받아 {{pick.3|code}}{{pick.3|josa:을,를}} 하는 값이 하나 생겼습니다."
  en: "One value now exists that takes {{pick.2|code}} and does {{pick.3|code}}."
payoff:
  ko: "이걸 알면 「이 코드는 언제 도나」가 풀립니다 — 적힌 자리가 아니라 불릴 때입니다."
  en: "This untangles “when does this code run” — not where it is written, but when it is called."
bridge:
  ko: >-
    자바는 화살표가 <code>-&gt;</code> 하나뿐이고, C# 은 같은 <code>=&gt;</code>가
    <b>식 본문 멤버</b>에도 쓰입니다. 모양이 같아 자리를 봐야 갈립니다.
  en: >-
    Java has only <code>-&gt;</code>; in C# the same <code>=&gt;</code> also writes
    <b>expression-bodied members</b>, so position is what tells them apart.
misconceptions:
  # 출처 — `csharp.md` §3 ㉓.
  - ko: "적힌 자리에서 바로 돈다 — 값일 뿐이고, 불릴 때 돕니다."
    en: "It runs where it is written — it is a value and runs when called."
  - ko: "화살표는 언제나 함수 값이다 — 멤버 선언 뒤의 화살표는 식 본문 표기입니다."
    en: "The arrow always makes a function value — after a member declaration it writes an expression body."
  - ko: "바깥 이름을 복사해 들고 간다 — <b>이름 자체</b>를 붙들어서, 뒤에 값이 바뀌면 그것을 봅니다."
    en: "It copies the outer name — it captures <b>the name itself</b>, so a later change is seen."
point:
  - q:
      ko: "{{site.line}}행에서 <b>받는 것과 하는 일을 묶는 기호</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the symbol binding what it takes to what it does</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>받는 것</b>입니다. 값 하나로 묶는 일은 가운데 기호가 해요."
          en: "{{pick.2|code}} is <b>what it takes</b>. Binding it into one value is done by the symbol between."
        edge:
          h: { ko: "가장 날카로운 자리 — 받는 것이냐 묶는 기호냐", en: "The sharpest spot — the input or the binder" }
          code:
            - "x;             // 이름 하나"
            - "x => x + 1;    // 값 하나"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>하는 일</b>입니다. 이것만으로는 값이 안 되고 앞의 기호가 있어야 해요."
          en: "{{pick.3|code}} is <b>what it does</b>. On its own it is not a value; the symbol in front makes it one."
        edge:
          h: { ko: "가장 날카로운 자리 — 하는 일이냐 묶는 기호냐", en: "The sharpest spot — the work or the binder" }
          code:
            - "x + 1;         // 지금 계산된다"
            - "x => x + 1;    // 나중에 계산된다"
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 받는 것과 하는 일을 묶어 <b>값 하나</b>로 만듭니다."
      en: "Choose what goes in the blank. Line {{site.line}} binds input and work into <b>one value</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "=>", mono: true }
      - t: "->"
        mono: true
        diag:
          t:
            ko: "이건 <b>자바</b>의 화살표입니다. C# 에서 이 기호는 포인터 멤버 접근이라 여기서는 컴파일이 막아요."
            en: "That is <b>Java's</b> arrow. In C# the symbol means pointer member access, so it stops here."
          edge:
            h: { ko: "가장 날카로운 자리 — 어느 언어의 화살표냐", en: "The sharpest spot — whose arrow" }
            code:
              - "x -> x + 1     // Java"
              - "x => x + 1     // C#"
      - t: "="
        mono: true
        diag:
          t:
            ko: "이건 <b>넣기</b>라 함수를 만들지 않습니다. 왼쪽 이름에 오른쪽 값을 넣을 뿐이에요."
            en: "That <b>puts</b> and makes no function: it only sends the right value into the left name."
          edge:
            h: { ko: "가장 날카로운 자리 — 넣기냐 묶기냐", en: "The sharpest spot — putting or binding" }
            code:
              - "x = x + 1;      // 값을 넣는다"
              - "x => x + 1      // 값을 만든다"
      - t: "::"
        mono: true
        diag:
          t:
            ko: "C# 에서 이 기호는 <b>이름 공간 이름</b>을 가르는 자리라 함수 값과 무관합니다."
            en: "In C# that symbol separates a <b>namespace alias</b> and has nothing to do with function values."
          edge:
            h: { ko: "가장 날카로운 자리 — 이름 공간이냐 함수 값이냐", en: "The sharpest spot — a namespace or a function value" }
            code:
              - "global::System.Int32"
              - "x => x + 1"
why_gate:
  q:
    ko: "이름 붙인 메서드도 있는데 왜 <b>이름 없는</b> 함수를 값으로 만들까요?"
    en: "Named methods exist — why make a function value with <b>no name</b>?"
  choices:
    - t:
        ko: "한 번만 쓸 짧은 동작에 이름을 지어 다른 곳에 두면, 읽는 사람이 그 자리를 떠나야 하기 때문"
        en: "Because naming a one-off step and parking it elsewhere makes the reader leave the spot"
      ok: true
      fb:
        ko: "그 방향입니다. 반대로 이름을 붙이는 편이 나은 자리도 하나 적어 보세요."
        en: "That is the direction. Add one place where naming it is the better call."
    - t:
        ko: "이름 없는 함수가 빨라서"
        en: "Because an unnamed function is faster"
      ok: false
      fb:
        ko: "빠르지 않습니다. 바깥 이름을 붙들면 상자가 하나 더 생겨 오히려 비쌉니다."
        en: "It is not — capturing an outer name allocates a box and costs more."
    - t:
        ko: "메서드를 못 넘겨서"
        en: "Because methods cannot be passed"
      ok: false
      fb:
        ko: "넘길 수 있습니다. 메서드 그룹을 그대로 넘기는 표기가 따로 있어요."
        en: "They can be — there is a separate form for passing a method group."
queries:
  - { grammars: [c_sharp], file: ./lambda.scm }
examples:
  - code: "class A { void F() { Func<int, int> g = x => x + 1; } }"
    expect: { sites: 1, form: lambda, hole: "=>", picks: { 1: "=>", 2: "x", 3: "x + 1" } }
  - code: "class A { void F(List<int> xs) { xs.Where(x => x > 0); } }"
    expect: { sites: 1, form: lambda, picks: { 1: "=>", 2: "x", 3: "x > 0" } }
  - code: "class A { public int Age => 3; }"
    expect: none
