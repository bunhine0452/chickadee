schema: 1
id: py/text-length
# 0부 축 C. `universal: null` — 「길이」의 단위가 세 언어에서 다 다르다. 파이썬은 코드 포인트로
# 세고(`len("가") == 1`), 자바스크립트·자바는 UTF-16 코드 단위로 센다(`'👍'.length === 2`).
# 같은 이름으로 묶으면 이모지가 든 자리에서 틀린 것을 물려준다 (`py.md` §1.5.2 문자열 길이 행).
universal: null
name: { ko: 글자와 바이트, en: Characters and bytes }
token: "encode"
grammars: [python]
framework: null
essential: true
difficulty: 2
prereq: [cs/text-encoding, cs/bit-and-byte]
confusions: []

dict:
  one_liner:
    ko: "글자 묶음과 바이트 묶음은 다른 종류다. 사이를 건너는 함수가 따로 있다."
    en: "A run of characters and a run of bytes are different kinds, bridged by a call."
  why:
    ko: >-
      파이썬에는 글자를 담는 종류와 바이트를 담는 종류가 <b>따로</b> 있습니다.
      길이를 세면 앞쪽은 <b>글자 수</b>를, 뒤쪽은 <b>바이트 수</b>를 내요 —
      한글 한 글자는 글자로 1 이고 바이트로 3 입니다.
      {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:이,가}} 그 사이를 건너는 자리입니다. 파일·소켓·해시는
      전부 바이트만 받으므로, 글자를 그쪽에 넘기려면 여기를 반드시 지나야 해요.
      건널 때 <b>어느 규칙으로</b> 옮길지를 함께 적지 않으면 실행하는 컴퓨터가 대신 정합니다 —
      같은 코드가 기계마다 다르게 도는 자리가 그것이에요.
    en: >-
      Python keeps characters and bytes in <b>separate</b> kinds. Measuring length gives the
      <b>character count</b> on one side and the <b>byte count</b> on the other: one Korean syllable
      is 1 as a character and 3 as bytes. {{pick.1|code}} on line {{site.line}} is where the two
      meet. Files, sockets and hashes accept bytes only, so text bound for them must pass here.
      When the crossing does not say <b>which rule</b> to use, the running machine decides — and
      that is where the same code behaves differently on different machines.
  trace:
    - ko: "{{site.line}}행의 {{pick.2|code}}{{pick.2|josa:을,를}} 한쪽 종류의 값으로 둔다."
      en: "{{pick.2|code}} on line {{site.line}} stands as a value of one kind."
    - ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 정해진 규칙으로 다른 종류를 <b>새로</b> 만든다."
      en: "{{pick.1|code}} builds a <b>new</b> value of the other kind by a fixed rule."
    - ko: "원래 값은 그대로 남는다. 길이를 세면 두 값의 답이 다를 수 있다."
      en: "The original stays as it was, and the two can report different lengths."

rule:
  ko: >-
    <b>글자 수와 바이트 수는 다른 수다.</b> 건널 때 규칙을 안 적으면 실행하는 쪽이 정한다.
  en: >-
    <b>A character count and a byte count are different numbers.</b> Name the rule at the crossing,
    or the running machine picks one.
result:
  label:
    ko: "{{site.line}}행이 만드는 값"
    en: "the value line {{site.line}} builds"
  value: "{{pick.2}}.{{pick.1}}()"
  note:
    ko: "종류가 바뀐 새 값"
    en: "a new value of the other kind"
ok:
  ko: >-
    {{pick.1|code}}{{pick.1|josa:이,가}} 새 값을 만듭니다. {{pick.2|code}}{{pick.2|josa:은,는}} 그대로이고,
    두 값의 <b>길이가 다를 수 있다</b>는 것이 이 자리의 요점이에요.
  en: >-
    {{pick.1|code}} makes a new value. {{pick.2|code}} is untouched, and the point here is that the
    two <b>can report different lengths</b>.
payoff:
  ko: >-
    「글자 수 제한을 걸었는데 서버가 거부한다」가 여기서 풀립니다 — 서버가 센 것은
    바이트였어요.
  en: >-
    “I capped the character count and the server still refused” answers itself here: the server was
    counting bytes.
bridge:
  ko: >-
    자바스크립트·자바는 이 둘을 안 가르고 길이를 <b>16비트 칸</b>으로 셉니다. 그쪽에서는
    이모지 하나가 2 예요.
  en: >-
    JavaScript and Java do not split the two and count length in <b>16-bit units</b>. There one
    emoji counts as 2.
misconceptions:
  - ko: >-
      글자 하나는 바이트 하나다 — 영문자만 그렇습니다. 한글은 셋, 이모지는 넷이 흔해요.
    en: >-
      One character is one byte — only for plain English letters. Korean often takes three and an
      emoji four.
  - ko: >-
      규칙을 안 적어도 어디서나 같다 — 실행하는 컴퓨터가 정합니다. 윈도우에서 열면
      다른 규칙이 걸려 글자가 깨지는 자리가 그것이에요.
    en: >-
      Leaving the rule out is the same everywhere — the running machine decides. Open the same file
      on Windows and another rule applies, and the text breaks.

point:
  - q:
      ko: "{{site.line}}행에서 <b>종류를 건너는 이름</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the name that crosses between the kinds</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: >-
            {{pick.2|code}}{{pick.2|josa:은,는}} 건너가는 <b>값</b>입니다. 값은 스스로 종류를
            못 바꾸고, 바꾸는 일은 이름이 붙은 쪽이 해요.
          en: >-
            {{pick.2|code}} is the <b>value</b> making the crossing. A value cannot change its own
            kind; the named call does that.
        edge:
          h:
            ko: "가장 날카로운 자리 — 값과 하는 일"
            en: "The sharpest spot — the value and the doing"
          code:
            - 'len("가")            # 1 — 글자로 센다'
            - 'len("가".encode())   # 3 — 바이트로 센다'
      pick.3:
        t:
          ko: >-
            {{pick.3|code}}{{pick.3|josa:은,는}} 넘기는 <b>인자 자리</b>입니다. 비어 있어도
            건너기는 일어나고, 그때는 기본 규칙이 걸려요.
          en: >-
            {{pick.3|code}} is the <b>argument slot</b>. The crossing happens even when it is empty;
            then the default rule applies.
        edge:
          h:
            ko: "가장 날카로운 자리 — 인자냐 하는 일이냐"
            en: "The sharpest spot — the argument or the doing"
          code:
            - 's.encode()           # 기본 규칙'
            - 's.encode("utf-8")    # 적어 둔 규칙'

meaning:
  - q:
      ko: "<code>len(\"가\")</code> 와 <code>len(\"가\".encode())</code> 는 각각 얼마일까요?"
      en: "What do <code>len(\"가\")</code> and <code>len(\"가\".encode())</code> give?"
    hint:
      ko: "같은 함수가 서로 다른 것을 세고 있습니다."
      en: "The same function is counting two different things."
    options:
      - t:
          ko: "1 과 3 — 앞은 글자를, 뒤는 바이트를 센다"
          en: "1 and 3 — one counts characters, the other bytes"
      - t:
          ko: "둘 다 1 — 같은 글자니까"
          en: "Both 1 — it is the same character"
        diag:
          t:
            ko: >-
              같은 글자가 맞습니다. 그런데 뒤쪽은 그 글자를 <b>바이트 묶음</b>으로 바꾼 값이고,
              세는 단위가 바뀌었어요.
            en: >-
              The same character, yes. The second value is that character turned into a <b>run of
              bytes</b>, and the unit of counting changed with it.
          edge:
            h:
              ko: "가장 날카로운 자리 — 같은 글자, 다른 단위"
              en: "The sharpest spot — same character, different unit"
            code:
              - '"가"            # 글자 하나'
              - '"가".encode()   # 바이트 셋이 담긴 값'
      - t:
          ko: "둘 다 3 — 저장은 언제나 바이트니까"
          en: "Both 3 — storage is always bytes"
        diag:
          t:
            ko: >-
              저장이 바이트인 것은 맞지만, 글자 종류의 길이는 <b>글자 수</b>로 셉니다.
              그것이 이 두 종류를 가른 이유예요.
            en: >-
              Storage is bytes, true, but the text kind reports its length in <b>characters</b>.
              That is exactly why the two kinds exist.
          edge:
            h:
              ko: "가장 날카로운 자리 — 담기는 법과 세는 법"
              en: "The sharpest spot — how it is stored, how it is counted"
            code:
              - 'len("ab")             # 2'
              - 'len("ab".encode())    # 2 — 여기서는 같다'
      - t:
          ko: "뒤쪽은 규칙을 안 적어서 그 자리에서 멈춘다"
          en: "The second stops because no rule was written"
        diag:
          t:
            ko: >-
              멈추지 않습니다. 규칙을 안 적으면 <b>기본 규칙</b>이 걸리고, 파이썬에서 그 기본은
              거의 언제나 같은 것이에요.
            en: >-
              Nothing stops. With no rule written the <b>default</b> applies, and in Python that
              default is nearly always the same one.
          edge:
            h:
              ko: "가장 날카로운 자리 — 기본이 있느냐"
              en: "The sharpest spot — is there a default"
            code:
              - '"가".encode()          # 기본이 걸린다'
              - 'open(p)                # 여기는 OS 가 정한다'

no_hole_reason: >-
  구멍을 못 뚫는다. 이 개념의 사용처는 이름 셋(`encode`·`decode`·`encoding`)에 걸치고 정답이
  사용처마다 갈려서, 빈칸형의 첫 보기를 사전에 고정할 수 없다 (`t0-blank` 가 첫 보기와 구멍
  원문을 견준다). 건너는 자리를 묻는 일은 지목형이, 단위가 둘인 것은 뜻 고르기가 한다.

why_gate:
  q:
    ko: "{{site.line}}행은 왜 종류를 건너야 했을까요?"
    en: "Why did line {{site.line}} have to cross between the kinds?"
  choices:
    - t:
        ko: "받는 쪽이 바이트만 받아서 — 파일·소켓·해시가 그렇다"
        en: "Because the far side takes bytes only — files, sockets and hashes do"
      ok: true
      fb:
        ko: "그 방향입니다. 규칙을 안 적었다면 어디서 갈릴지도 한 줄로 적어 보세요."
        en: "That is the direction. Add in one line where things part if the rule is left out."
    - t:
        ko: "글자 수를 세려고"
        en: "To count the characters"
      ok: false
      fb:
        ko: >-
          글자 수는 건너지 않고도 셉니다. 건너면 오히려 <b>다른 수</b>가 나와요.
        en: >-
          The character count needs no crossing. Crossing in fact gives <b>a different number</b>.
    - t:
        ko: "값을 복사해 두려고"
        en: "To keep a copy of the value"
      ok: false
      fb:
        ko: >-
          새 값이 생기는 것은 맞지만 <b>종류가 다른</b> 값입니다. 복사가 목적이면 같은 종류로
          두는 길이 따로 있어요.
        en: >-
          A new value does appear, but of <b>a different kind</b>. Copying within one kind has its
          own way.

queries:
  - { grammars: [python], file: ./text-length.scm }

examples:
  - code: 'raw = text.encode("utf-8")     # "가".encode() -> 바이트 셋 (bytes)'
    expect: { sites: 1, form: bridge, picks: { 1: "encode", 2: "text" } }
  - code: 'body = data.decode("utf-8")    # b"ab".decode() -> "ab" (str)'
    expect: { sites: 1, form: bridge, picks: { 1: "decode", 2: "data" } }
  - code: 'open(path, encoding="utf-8")   # encoding -> "utf-8" (str)'
    expect: { sites: 1, form: encoding, picks: { 1: "encoding", 2: '"utf-8"', 3: "=" } }
  - code: 'n = len("가")                  # len("가") -> 1 (int)'
    expect: { sites: 1, form: count, picks: { 1: "len", 2: '"가"' } }
  - code: "n = len(rows)                  # len(rows) -> 목록의 개수 (int)"
    expect: none
  - code: 'name = "kim"                   # name -> "kim" (str)'
    expect: none
