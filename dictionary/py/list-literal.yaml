schema: 1
id: py/list-literal
universal: common/list
name: { ko: 순서 있는 목록, en: Ordered list }
token: "["
grammars: [python]
framework: null
essential: true
difficulty: 1
prereq: [cs/contiguous-vs-linked, cs/set-vs-sequence]
confusions: []

dict:
  one_liner:
    ko: "값 여럿을 순서대로 묶는다. 무엇으로 묶었는지가 고칠 수 있는지를 정한다."
    en: "Several values, kept in order. What wraps them decides whether they can change."
  why:
    ko: >-
      {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:이,가}} 목록의 시작입니다.
      안에 든 값들은 <b>넣은 순서를 지키고</b>, 나중에 더하거나 빼거나 바꿀 수 있어요.
      묶는 방법이 하나가 아닙니다. 대괄호로 묶으면 <b>고칠 수 있는</b> 목록이고,
      콤마만으로 묶으면 <b>고칠 수 없는</b> 묶음이에요. 값도 순서도 같은데 그 한 가지가 다릅니다.
      괄호는 묶는 표시가 아닙니다 — <code>(1)</code> 은 묶음이 아니라 그냥 숫자 1 이고,
      묶음이 되게 하는 것은 <b>콤마</b>예요. <code>(1,)</code> 이라야 항목 하나짜리 묶음입니다.
      빈 목록은 갈림길에서 <b>거짓</b> 쪽으로 접힙니다. 「있으면 처리한다」가 한 줄로 적히는
      이유가 그것이에요.
    en: >-
      {{pick.1|code}} on line {{site.line}} opens a list. The values inside <b>keep the order they
      went in</b>, and later they can be added to, removed from or replaced. There is more than one
      way to wrap them: square brackets make a list that <b>can change</b>, while a bare comma makes
      a bundle that <b>cannot</b>. Same values, same order, one difference. Parentheses are not the
      wrapper — <code>(1)</code> is not a bundle but the number 1, and what makes a bundle is the
      <b>comma</b>: <code>(1,)</code> is a one-item bundle. An empty list folds to the <b>false</b>
      side at a fork, which is why "handle it if there is any" fits on one line.
  trace:
    - ko: "{{site.line}}행의 {{pick.1|code}}{{pick.1|josa:이,가}} 묶음의 시작을 알린다."
      en: "{{pick.1|code}} on line {{site.line}} marks where the bundle begins."
    - ko: "{{pick.2|code}} 부터 콤마로 나뉜 값들이 순서대로 담긴다."
      en: "From {{pick.2|code}} on, the comma-separated values go in, in order."
    - ko: "{{pick.3|code}}{{pick.3|josa:이,가}} 닫으면 그 자리에 값 하나가 있다 — 목록도 값이다."
      en: "{{pick.3|code}} closes it and one value stands there — a list is a value too."

rule:
  ko: >-
    <b>순서를 지키고 나중에 고칠 수 있다.</b> 콤마로만 묶은 것은 같은 순서인데 못 고친다.
  en: >-
    <b>Order is kept and the contents can change.</b> A comma-only bundle keeps order but cannot.
result:
  label:
    ko: "{{site.line}}행의 묶음"
    en: "the bundle on line {{site.line}}"
  value: "{{pick.1}}…{{pick.3}}"
  note:
    ko: "값 하나로 다닌다"
    en: "it travels as one value"
ok:
  ko: >-
    {{pick.1|code}}{{pick.1|josa:과,와}} {{pick.3|code}} 사이가 한 값입니다. 이름 하나에
    담기고, 함수에 통째로 넘어가요.
  en: >-
    Everything between {{pick.1|code}} and {{pick.3|code}} is one value. It fits one name and passes
    to a function whole.
payoff:
  ko: >-
    「값이 몇 개인지 모를 때」를 다루는 첫 도구입니다. 하나씩 훑기·걸러 내기가 전부
    이 값 위에서 돌아요.
  en: >-
    This is the first tool for "however many there are." Walking through and filtering all run on
    top of this value.
bridge:
  ko: >-
    목록이 값이라는 것이 다음 판의 재료입니다 — 이름 둘이 <b>같은 목록</b>을 가리킬 수
    있고, 그때 한쪽에서 고친 것이 다른 쪽에서 보여요.
  en: >-
    That a list is a value feeds the next plate: two names can point at <b>the same list</b>, and a
    change through one shows through the other.
misconceptions:
  - ko: >-
      괄호로 묶어도 같은 목록이다 — 괄호로 묶은 것은 <b>못 고칩니다.</b> 그리고 항목이 하나면
      콤마를 붙여야 묶음이 돼요.
    en: >-
      Parentheses make the same thing — a parenthesised bundle <b>cannot change</b>, and with one
      item it needs a trailing comma to be a bundle at all.
  - ko: >-
      빈 목록은 없음과 같다 — <b>있는 값</b>입니다. 갈림길에서 거짓 쪽으로 접힐 뿐이고,
      「없음인가」를 물으면 답이 갈려요.
    en: >-
      An empty list is the same as absent — it is a <b>value that is there</b>. It merely folds
      false at a fork; ask whether it is absent and the answers part.

point:
  - q:
      ko: "{{site.line}}행에서 <b>묶음이 시작되는 자리</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>where the bundle begins</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: >-
            {{pick.2|code}}{{pick.2|josa:은,는}} 안에 든 <b>첫 값</b>입니다. 묶음이 시작된다는
            표시는 그 앞에 있어요.
          en: >-
            {{pick.2|code}} is the <b>first value</b> inside. The mark that opens the bundle stands
            before it.
        edge:
          h:
            ko: "가장 날카로운 자리 — 담긴 것과 담는 표시"
            en: "The sharpest spot — the content and the wrapper"
          code:
            - "1              # 값 하나다"
            - "[1]            # 값 하나가 든 묶음이다"
      pick.3:
        t:
          ko: >-
            {{pick.3|code}}{{pick.3|josa:은,는}} <b>끝</b>을 알립니다. 시작을 알리는 것은
            같은 모양의 앞쪽이에요.
          en: >-
            {{pick.3|code}} marks the <b>end</b>. The matching shape at the front marks the start.
        edge:
          h:
            ko: "가장 날카로운 자리 — 여는 쪽과 닫는 쪽"
            en: "The sharpest spot — opening or closing"
          code:
            - "[1, 2]         # 앞이 열고 뒤가 닫는다"
            - "xs[1]          # 같은 모양인데 꺼내는 일이다"

meaning:
  - q:
      ko: "<code>xs = (1)</code> 다음 <code>len(xs)</code> 는 어떻게 될까요?"
      en: "After <code>xs = (1)</code>, what does <code>len(xs)</code> give?"
    hint:
      ko: "무엇이 묶음을 만드는지 다시 보세요."
      en: "Look again at what actually makes a bundle."
    options:
      - t:
          ko: "그 자리에서 멈춘다 — <code>xs</code> 는 묶음이 아니라 숫자 1 이다"
          en: "It stops there — <code>xs</code> is the number 1, not a bundle"
      - t:
          ko: "1 — 항목 하나짜리 묶음이니까"
          en: "1 — it is a one-item bundle"
        diag:
          t:
            ko: >-
              묶음을 만드는 것은 괄호가 아니라 <b>콤마</b>입니다. 항목 하나짜리 묶음은
              콤마를 붙여야 해요.
            en: >-
              What makes a bundle is the <b>comma</b>, not the parentheses. A one-item bundle needs
              that comma.
          edge:
            h:
              ko: "가장 날카로운 자리 — 괄호냐 콤마냐"
              en: "The sharpest spot — parentheses or comma"
            code:
              - "len((1,))      # 1"
              - "len((1))       # TypeError"
      - t:
          ko: "0 — 안이 비어 있다"
          en: "0 — it is empty"
        diag:
          t:
            ko: >-
              비어 있지 않습니다. 값 하나가 그대로 <b>숫자</b>로 담겼고, 숫자에는 길이라는
              것이 없어요.
            en: >-
              It is not empty. One value went in as a plain <b>number</b>, and a number has no
              length to report.
          edge:
            h:
              ko: "가장 날카로운 자리 — 비었느냐 길이가 없느냐"
              en: "The sharpest spot — empty or lengthless"
            code:
              - "len([])        # 0"
              - "len(1)         # TypeError"
      - t:
          ko: "1 — 대괄호와 괄호는 같은 일을 한다"
          en: "1 — brackets and parentheses do the same job"
        diag:
          t:
            ko: >-
              둘은 다릅니다. 대괄호는 <b>고칠 수 있는</b> 목록을 만들고, 괄호는 값을 감싸는
              표시일 뿐이에요 — 묶음은 콤마가 만듭니다.
            en: >-
              They differ. Square brackets make a list that <b>can change</b>, while parentheses
              merely group a value — the bundle comes from the comma.
          edge:
            h:
              ko: "가장 날카로운 자리 — 대괄호와 괄호"
              en: "The sharpest spot — brackets and parentheses"
            code:
              - "[1]            # 고칠 수 있는 목록"
              - "(1,)           # 못 고치는 묶음"

no_hole_reason: >-
  구멍을 못 뚫는다. 이 개념의 표시는 대괄호 한 글자라 빈칸형이 생성 단계에서 떨어지고
  (`MIN_HOLE`), 안에 든 값을 구멍으로 삼으면 정답이 사용처마다 달라 첫 보기를 사전에
  고정할 수 없다. 여는 자리는 지목형이, 괄호와의 갈림은 뜻 고르기가 묻는다.

why_gate:
  q:
    ko: "{{site.line}}행은 왜 값을 하나씩 두지 않고 묶었을까요?"
    en: "Why does line {{site.line}} bundle the values instead of keeping them apart?"
  choices:
    - t:
        ko: "몇 개인지 미리 모르는 값이어서 — 이름 하나로 다 다룬다"
        en: "Because the count is not known ahead — one name handles them all"
      ok: true
      fb:
        ko: "그 방향입니다. 개수가 늘 셋으로 정해져 있었다면 무엇이 달라질지도 적어 보세요."
        en: "That is the direction. Add what would change if the count were always three."
    - t:
        ko: "값 여러 개를 이름 하나에 넣는 유일한 방법이라서"
        en: "Because it is the only way to put several values under one name"
      ok: false
      fb:
        ko: >-
          유일하지는 않습니다. 콤마로만 묶는 길, 키로 담는 길이 따로 있고, 갈리는 것은
          <b>나중에 고칠 수 있는가</b>예요.
        en: >-
          Not the only way. There is the comma-only bundle and the key-value store, and what parts
          them is <b>whether the contents can change</b>.
    - t:
        ko: "순서를 지키려고"
        en: "To keep them in order"
      ok: false
      fb:
        ko: >-
          순서는 다른 묶음도 지킵니다. 이 표시가 고르는 것은 <b>고칠 수 있는가</b>예요.
        en: >-
          Other bundles keep order too. What this wrapper chooses is <b>whether it can change</b>.

queries:
  - { grammars: [python], file: ./list-literal.scm }

examples:
  - code: "rows = [1, 2, 3]        # rows -> [1, 2, 3] (list)"
    expect: { sites: 1, form: items, picks: { 1: "[", 2: "1", 3: "]" } }
  - code: "acc = []                # acc -> [] (list)"
    expect: { sites: 1, form: empty, picks: { 1: "[", 3: "]" } }
  - code: "pair = (1, 2)           # pair -> (1, 2) (tuple)"
    expect: { sites: 1, form: tuple, picks: { 1: ",", 2: "1" } }
  - code: "a, b = b, a             # 괄호 없이 콤마만으로도 묶인다 (tuple)"
    expect: { sites: 1, form: bare-tuple, picks: { 1: ",", 2: "b" } }
  - code: "first = rows[0]         # rows[0] -> 1 (int)"
    expect: none
  - code: "names: list[str] = []   # 힌트 안의 대괄호는 꺼내기가 아니다"
    expect: { sites: 1, form: empty, picks: { 1: "[", 3: "]" } }
