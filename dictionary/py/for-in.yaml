schema: 1
id: py/for-in
universal: common/iterate
name: { ko: 하나씩 훑기, en: Iterating item by item }
token: "for"
grammars: [python]
framework: null
essential: true
difficulty: 1
prereq: [py/list-literal, py/assignment]
confusions: []

dict:
  one_liner:
    ko: "묶음에서 항목을 하나씩 직접 받는다. 세는 변수가 없다."
    en: "Takes each item straight out of a group. There is no counter."
  why:
    ko: >-
      {{site.line}}행은 자리 번호를 안 씁니다. {{pick.2|code}}{{pick.2|josa:은,는}} 몇 번째인지가 아니라
      <b>항목 그 자체</b>이고, {{pick.3|code}}{{pick.3|josa:이,가}} 다 떨어지면 그대로 끝납니다.
    en: >-
      Line {{site.line}} uses no position number. {{pick.2|code}} is <b>the item itself</b>, not
      which one it is, and the loop ends when {{pick.3|code}} runs out.
  trace:
    - ko: "{{pick.3|code}}에서 항목을 하나 꺼낸다."
      en: "One item comes out of {{pick.3|code}}."
    - ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 그 항목을 가리킨다."
      en: "{{pick.2|code}} is made to point at it."
    - ko: "{{site.line}}행 아래의 몸통이 그 항목으로 한 번 돈다. 그리고 처음으로 돌아간다."
      en: "The body below line {{site.line}} runs once with that item, then goes back to the top."

rule:
  ko: "<b>받는 것은 자리가 아니라 항목이다.</b> 길이를 안 구해도 되고, 다 떨어지면 그대로 끝난다."
  en: "<b>What you get is the item, not its position.</b> No length is needed; it ends when the group runs out."
result:
  label:
    ko: "{{site.line}}행 몸통 안의 {{pick.2}}"
    en: "{{pick.2}} inside the body of line {{site.line}}"
  value: "{{pick.3}} 의 항목 하나"
  note:
    ko: "한 바퀴마다 다른 항목"
    en: "a different item each turn"
ok:
  ko: >-
    {{pick.2|code}}{{pick.2|josa:은,는}} 한 바퀴마다 {{pick.3|code}}의 다음 항목입니다. 몸통이 끝나면
    다시 위로 올라가 다음 항목을 받아요.
  en: >-
    Each turn, {{pick.2|code}} is the next item of {{pick.3|code}}. When the body ends, control goes
    back up and takes the one after.
payoff:
  ko: >-
    이걸 알면 「길이를 어디서 구하지」가 사라집니다 — 안 구합니다. 자리 번호가 필요할 때만
    <code>enumerate</code> 로 번호를 <b>따로</b> 달아 받습니다.
  en: >-
    This makes “where do I get the length” disappear — you do not. When you actually need the
    position, <code>enumerate</code> hands it to you <b>alongside</b> the item.
bridge:
  ko: >-
    C·자바의 세는 반복문은 시작·조건·증가를 사람이 셋 다 적습니다. 여기서는 셋이 다 없고,
    그래서 하나 어긋나 마지막 항목을 놓치는 실수가 아예 안 생깁니다.
  en: >-
    A counting loop in C or Java asks you to write start, test and step. All three are gone here,
    so the off-by-one that drops the last item cannot happen.
misconceptions:
  # py.md §3 #17 — 「세는 변수가 없다」. 다른 언어에서 온 습관이 그대로 나오는 자리.
  - ko: >-
      자리 번호를 만들어 훑어야 한다 — <code>range(len(xs))</code> 는 다른 언어에서 온 습관입니다.
      항목이 필요하면 항목을 바로 받습니다.
    en: >-
      You must build positions to walk a group — <code>range(len(xs))</code> is a habit from other
      languages. If you want items, take items.
  - ko: >-
      <code>range(3)</code> 은 셋까지 센다 — 0·1·2 셋을 냅니다. 끝 수는 <b>포함하지 않아요</b>.
    en: >-
      <code>range(3)</code> counts up to three — it yields 0, 1 and 2. The end number is
      <b>not included</b>.
  - ko: >-
      훑는 도중에 그 묶음에서 항목을 빼도 된다 — 훑는 자리가 밀려서 <b>건너뛰는 항목</b>이 생깁니다.
      뺄 것을 모았다가 나중에 빼거나 새 묶음을 만듭니다.
    en: >-
      You may remove items while walking the group — the walking position shifts and items get
      <b>skipped</b>. Collect what to drop, or build a new group.

point:
  - q:
      ko: "{{site.line}}행에서 <b>한 바퀴를 시작하는 낱말</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the word that starts one turn</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: >-
            {{pick.2|code}}{{pick.2|josa:은,는}} 한 바퀴마다 <b>새로 담기는 이름</b>입니다. 담기는 일은
            일어나지만, 되풀이를 시작하는 것은 그 앞의 낱말이에요.
          en: >-
            {{pick.2|code}} is <b>the name that gets refilled</b> each turn. The filling happens, but
            the word before it is what starts the repeating.
        edge:
          h:
            ko: "가장 날카로운 자리 — 받는 이름과 되풀이"
            en: "The sharpest spot — the receiving name and the repeating"
          code:
            - "row = rows[0]     # 한 번만"
            - "for row in rows:  # 항목 수만큼"
      pick.3:
        t:
          ko: >-
            {{pick.3|code}}{{pick.3|josa:은,는}} <b>훑을 대상</b>입니다. 대상만으로는 아무 일도 안 나고,
            그것을 하나씩 꺼내라고 말하는 낱말이 따로 있어요.
          en: >-
            {{pick.3|code}} is <b>what gets walked</b>. A group on its own does nothing; a separate
            word says to take it one item at a time.
        edge:
          h:
            ko: "가장 날카로운 자리 — 대상과 훑는 일"
            en: "The sharpest spot — the group and the walking"
          code:
            - "rows              # 값 하나"
            - "for r in rows:    # 항목 수만큼"
      pick.4:
        t:
          ko: >-
            그 낱말은 <b>어디서</b> 꺼낼지를 잇는 자리입니다. 견주기의 「들어 있나」와 같은 글자인데
            여기서는 묻지 않고 꺼내요.
          en: >-
            That word joins the name to <b>where</b> items come from. It is the same word as the
            membership test, but here it takes rather than asks.
        edge:
          h:
            ko: "가장 날카로운 자리 — 묻는 in 과 꺼내는 in"
            en: "The sharpest spot — asking and taking"
          code:
            - "if row in rows:   # 묻는다"
            - "for row in rows:  # 꺼낸다"

meaning:
  - q:
      ko: "{{pick.3|code}}{{pick.3|josa:이,가}} 빈 묶음이면 몸통은 몇 번 돌까요?"
      en: "If {{pick.3|code}} is an empty group, how many times does the body run?"
    hint:
      ko: "꺼낼 항목이 하나도 없을 때를 생각해 봅니다."
      en: "Think about there being no item to take at all."
    options:
      - t:
          ko: "한 번도 안 돈다 — 곧바로 다음 줄로 간다"
          en: "Not once — control goes straight to the next line"
      - t:
          ko: "한 번은 돈다"
          en: "It runs once"
        diag:
          t:
            ko: >-
              한 번은 도는 것은 <b>몸통을 먼저 돌리고 나중에 묻는</b> 문법입니다. 파이썬의 이 문법은
              꺼내는 것이 먼저라, 꺼낼 것이 없으면 몸통에 들어가지도 않아요.
            en: >-
              Running once belongs to a form that <b>runs the body first and asks after</b>. Here
              taking comes first, so with nothing to take the body is never entered.
          edge:
            h:
              ko: "가장 날카로운 자리 — 먼저 묻나 먼저 도나"
              en: "The sharpest spot — ask first or run first"
            code:
              - "for x in []:    # 0번"
              - "while True:     # 최소 1번"
      - t:
          ko: "빈 묶음이라며 멈춘다"
          en: "It stops, saying the group is empty"
        diag:
          t:
            ko: >-
              빈 묶음은 <b>정상</b>입니다. 항목이 0개인 것과 묶음이 없는 것은 다른 일이고, 멈추는 것은
              뒤쪽이에요.
            en: >-
              An empty group is <b>fine</b>. Having zero items is not the same as having no group at
              all; only the latter stops.
          edge:
            h:
              ko: "가장 날카로운 자리 — 비어 있음과 없음"
              en: "The sharpest spot — empty and absent"
            code:
              - "for x in []:      # 0번, 정상"
              - "for x in None:    # TypeError"
      - t:
          ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 없음을 가리킨 채 한 번 돈다"
          en: "It runs once with {{pick.2|code}} pointing at absence"
        diag:
          t:
            ko: >-
              항목이 없으면 담을 것도 없어서 {{pick.2|code}}{{pick.2|josa:은,는}} <b>아예 안 만들어집니다.</b>
              몸통 앞에서 끝나기 때문이에요.
            en: >-
              With no items there is nothing to fill, so {{pick.2|code}} is <b>never made</b> — the
              loop ends before the body.
          edge:
            h:
              ko: "가장 날카로운 자리 — 안 만들어진다"
              en: "The sharpest spot — the name is never made"
            code:
              - "for x in []: pass"
              - "print(x)        # NameError"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 {{pick.3|code}}의 항목을 <b>하나씩</b> 받습니다."
      en: >-
        Choose what goes in the blank. Line {{site.line}} takes the items of {{pick.3|code}}
        <b>one at a time</b>.
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "for", mono: true }
      - t: "while"
        mono: true
        diag:
          t:
            ko: >-
              그 낱말 뒤에는 <b>참·거짓을 내는 식</b>이 와야 합니다. 묶음을 그대로 두면 비기 전까지
              참이라 같은 첫 항목을 영원히 봐요.
            en: >-
              That word wants an <b>expression that yields true or false</b>. Left with a group it
              stays true until the group empties, so it sees the same first item forever.
          edge:
            h:
              ko: "가장 날카로운 자리 — 조건이냐 꺼내기냐"
              en: "The sharpest spot — a condition or a taking"
            code:
              - "for r in rows:    # 항목이 바뀐다"
              - "while rows:       # 조건만 본다"
      - t: "each"
        mono: true
        diag:
          t:
            ko: >-
              파이썬에 그런 낱말은 <b>없습니다.</b> 다른 언어의 이름을 그대로 쓴 것이고, 여기서는
              「그런 이름 없다」로 멈춰요.
            en: >-
              Python has no such word — that name comes from another language, and here it stops
              with “no such name.”
          edge:
            h:
              ko: "가장 날카로운 자리 — 있는 낱말과 없는 낱말"
              en: "The sharpest spot — a word that exists and one that does not"
            code:
              - "for r in rows:    # 파이썬"
              - "rows.forEach(...) # 다른 언어"
      - t: "if"
        mono: true
        diag:
          t:
            ko: >-
              그 낱말은 <b>한 번</b> 판단하고 끝입니다. 뒤에 이어지는 낱말도 「들어 있나」를 묻는
              쪽으로 읽혀서, 되풀이가 아예 안 생겨요.
            en: >-
              That word judges <b>once</b> and is done. The word after it would then read as a
              membership test, so no repeating happens at all.
          edge:
            h:
              ko: "가장 날카로운 자리 — 한 번과 항목 수만큼"
              en: "The sharpest spot — once, or as many times as there are items"
            code:
              - "if r in rows:     # 참·거짓 하나"
              - "for r in rows:    # 항목 수만큼"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 자리 번호 대신 항목을 바로 받을까요?"
    en: "Why does line {{site.line}} take the item directly instead of a position number?"
  choices:
    - t:
        ko: "몸통이 쓰는 것이 항목이라, 번호를 만들어 다시 꺼내는 두 걸음이 필요 없어서"
        en: "Because the body uses the item, so building a number and looking it back up is two needless steps"
      ok: true
      fb:
        ko: "그 방향입니다. 몸통에서 그 항목을 실제로 쓰는 줄이 어디인지도 짚어 보세요."
        en: "That is the direction. Point also at the line in the body that actually uses the item."
    - t:
        ko: "파이썬에 세는 반복문이 없어서"
        en: "Because Python has no counting loop"
      ok: false
      fb:
        ko: >-
          있습니다 — <code>range</code> 로 번호를 만들면 됩니다. 안 쓴 것은 없어서가 아니라
          몸통이 번호를 안 쓰기 때문이에요.
        en: >-
          It has one — <code>range</code> makes the numbers. It is unused here because the body does
          not need them, not because it is missing.
    - t:
        ko: "그렇게 써야 더 빨라서"
        en: "Because it runs faster that way"
      ok: false
      fb:
        ko: >-
          속도 차이는 이 줄의 이유가 아닙니다. 재 보지 않고 「빠르다」를 이유로 대면 다음 줄에서
          같은 근거가 안 서요.
        en: >-
          Speed is not what this line is about. Calling it faster without measuring leaves you with
          no reason at the next line.

queries:
  - { grammars: [python], file: ./for-in.scm }

examples:
  - code: "for row in rows:\n    send(row)"
    expect: { sites: 1, form: for, hole: "for", picks: { 1: "for", 2: "row", 3: "rows", 4: "in" } }
  - code: "for key, value in data.items():\n    send(key)"
    expect: { sites: 1, form: for, hole: "for", picks: { 2: "key, value", 3: "data.items()" } }
  # 컴프리헨션의 `for` 는 `for_in_clause` 라 노드가 다르다 — `py/list-comprehension` 의 자리다.
  - code: "names = [r.name for r in rows]"
    expect: none
  - code: "while n > 0:\n    n -= 1"
    expect: none
