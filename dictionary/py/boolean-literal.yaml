schema: 1
id: py/boolean-literal
universal: common/boolean-value
name: { ko: 참·거짓 값, en: Boolean literal }
token: "True"
grammars: [python]
framework: null
essential: true
difficulty: 1
prereq: []
confusions: []

dict:
  one_liner:
    ko: "값이 둘뿐인 종류. 첫 글자가 대문자인 낱말 둘로 적는다."
    en: "A kind with two values, written as two capitalised words."
  why:
    ko: >-
      숫자는 값이 무한히 많지만 이 종류는 <b>둘뿐</b>입니다. 그래서 갈림길이 이 값을 답으로
      씁니다. 파이썬은 이 둘을 <b>대문자로 시작</b>해 적어요 — 소문자로 적으면 그런 이름이
      없다며 그 자리에서 멈춥니다.
    en: >-
      Numbers have endless values; this kind has <b>two</b>. That is why a fork takes it as an
      answer. Python writes both <b>starting with a capital</b> — lower-case and it stops there,
      saying no such name exists.
  trace:
    - ko: "{{pick.1|code}}{{pick.1|josa:은,는}} 견줄 것이 없는 값이다."
      en: "{{pick.1|code}} is a value with nothing left to weigh."
    - ko: "따옴표가 없으니 글자가 아니다."
      en: "There are no quotes, so it is not text."
    - ko: "조건 자리에 그대로 설 수 있다."
      en: "It can stand in a condition just as it is."

rule:
  ko: "<b>첫 글자가 대문자다.</b> 소문자로 적으면 이름이 없다며 멈춘다."
  en: "<b>Both start with a capital.</b> Lower-case and it stops, saying the name is unknown."
result:
  label:
    ko: "{{site.line}}행의 판단"
    en: "the judgement on line {{site.line}}"
  value: "{{pick.1}}"
  note:
    ko: "값이 둘뿐이다"
    en: "only two values exist"
ok:
  ko: >-
    {{pick.1|code}}{{pick.1|josa:은,는}} 두 값 중 하나입니다. 조건 자리에 오면 견주기 없이
    그대로 갈림을 정합니다.
  en: >-
    {{pick.1|code}} is one of the two values. In a condition it decides the fork with nothing weighed.
payoff:
  ko: >-
    이 종류를 알면 조건 자리에 무엇이 오는지가 풀립니다 — 무엇이 오든 결국 이 둘 중 하나로
    좁혀진 것이니까요.
  en: >-
    Know this kind and what belongs in a condition stops being a puzzle — whatever goes there has
    narrowed to one of these two.
bridge:
  ko: >-
    {{pick.1|code}}{{pick.1|josa:은,는}} 견주기가 내놓는 것과 같은 종류입니다 — 한쪽은 적어 둔
    것이고 한쪽은 셈해서 얻은 것뿐이에요.
  en: >-
    {{pick.1|code}} is the same kind a comparison yields — one is written down, the other worked out.
misconceptions:
  - ko: "소문자로 적어도 된다 — 아니요. 그런 이름이 없다며 멈춥니다."
    en: "Lower-case is fine — no. It stops, saying there is no such name."
  - ko: "따옴표를 씌운 것도 같다 — 글자가 되고, 비어 있지 않은 글자는 조건에서 늘 참입니다."
    en: "Quoting it is the same — it becomes text, and non-empty text always holds in a condition."

meaning:
  - q:
      ko: "{{site.line}}행의 {{pick.1|code}}{{pick.1|josa:을,를}} 첫 글자만 소문자로 바꾸면 어떻게 될까요?"
      en: "On line {{site.line}}, what if {{pick.1|code}} had a lower-case first letter?"
    hint:
      ko: "파이썬은 이 둘을 <b>이름처럼</b> 찾습니다."
      en: "Python looks these up <b>like names</b>."
    options:
      - t:
          ko: "그런 이름이 없다며 그 자리에서 멈춘다"
          en: "It stops there, saying there is no such name"
      - t:
          ko: "같은 값으로 읽힌다"
          en: "It reads as the same value"
        diag:
          t:
            ko: "다른 언어에서는 그 말이 맞습니다. 파이썬은 이 둘을 이름으로 찾으므로 소문자 쪽은 정의된 적이 없어요."
            en: >-
              That holds in other languages. Python looks these up as names, and the lower-case one
              was never defined.
          edge:
            h:
              ko: "가장 날카로운 자리 — 첫 글자 하나"
              en: "The sharpest spot — one letter"
            code:
              - "ok = True    # 값이다"
              - "ok = true    # NameError"
      - t:
          ko: "글자로 읽혀 늘 참이 된다"
          en: "It reads as text and always holds"
        diag:
          t:
            ko: "따옴표를 씌웠다면 그 말이 맞습니다. 따옴표가 없으면 글자가 아니라 <b>이름</b>으로 찾아요."
            en: >-
              That would hold with quotes round it. Without quotes it is looked up as a <b>name</b>,
              not read as text.
          edge:
            h:
              ko: "가장 날카로운 자리 — 따옴표가 있나"
              en: "The sharpest spot — are there quotes"
            code:
              - '"true"   # 글자다'
              - "true     # 이름을 찾다가 멈춘다"
      - t:
          ko: "경고만 남고 값은 그대로다"
          en: "Only a warning is left and the value stays"
        diag:
          t:
            ko: "파이썬은 이름을 못 찾으면 경고가 아니라 그 자리에서 멈춥니다. 실행 전에 미리 걸러 주지도 않아요."
            en: >-
              When Python cannot find a name it stops there rather than warning, and nothing catches
              it before the line runs.
          edge:
            h:
              ko: "가장 날카로운 자리 — 실행해 봐야 안다"
              en: "The sharpest spot — you find out at run time"
            code:
              - "if False: true   # 이 줄은 안 돌아 멈추지도 않는다"
              - "true             # 여기서 멈춘다"

no_hole_reason: >-
  참·거짓은 값 자체라 다른 쪽을 넣어도 어느 것이 맞는지 코드에 근거가 없다. 「참이냐 거짓이냐」는 문법 문제가 아니다.

why_gate:
  q:
    ko: "{{site.line}}행은 왜 이 값을 이름 없이 그대로 적었을까요?"
    en: "Why does line {{site.line}} write this value out with no name?"
  choices:
    - t:
        ko: "이 자리에서 답이 이미 정해져 있어서 — 견줄 것이 없다"
        en: "Because the answer is already settled here — there is nothing to weigh"
      ok: true
      fb:
        ko: "그 방향입니다. 답이 정해지지 않은 자리라면 무엇이 대신 왔을지도 적어 보세요."
        en: "That is the direction. Say what would stand here if the answer were not settled."
    - t:
        ko: "이 종류에는 이름을 못 붙여서"
        en: "Because this kind cannot be named"
      ok: false
      fb:
        ko: "붙일 수 있습니다. 안 붙인 것은 그 자리에서 한 번 쓰고 끝나기 때문입니다."
        en: "It can be named. It was not, because it is used once here and done."
    - t:
        ko: "이름을 붙이면 값이 바뀔 수 있어서"
        en: "Because naming it could change the value"
      ok: false
      fb:
        ko: "이름은 값을 바꾸지 않습니다. 가리킬 뿐이에요."
        en: "A name does not change a value. It only points at one."

queries:
  - { grammars: [python], file: ./boolean-literal.scm }

examples:
  - code: "done = True"
    expect: { sites: 1, form: "true", picks: { 1: "True" } }
  - code: "off = False"
    expect: { sites: 1, form: "false", picks: { 1: "False" } }
  - code: "s = \"True\""
    expect: none
