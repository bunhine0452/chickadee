schema: 1
id: py/assignment
universal: common/variable-binding
name: { ko: 이름에 값 넣기, en: Assignment }
token: "="
grammars: [python]
framework: null
essential: true
difficulty: 1
prereq: []
# 빈칸 오답(== · += · :=)이 개념으로 존재하지 않는 낱말이라 혼동 쌍으로 못 묶는다.
confusions: []

dict:
  one_liner:
    ko: "이름 하나가 값을 가리키게 한다. 처음이든 다시든 같은 모양이다."
    en: "Points one name at a value. First time or later, the form is the same."
  why:
    ko: >-
      파이썬에는 「만들기」와 「다시 넣기」를 가르는 낱말이 <b>없습니다</b>. {{site.line}}행이
      {{pick.2|code}}{{pick.2|josa:을,를}} 처음 만드는 줄일 수도, 이미 있는 이름을 옮기는 줄일 수도 있어요 —
      어느 쪽인지는 <b>위에 같은 이름이 있었는지</b>로만 압니다.
    en: >-
      Python has <b>no word</b> that separates making a name from re-pointing one. Line
      {{site.line}} may be where {{pick.2|code}} first appears, or where an existing name moves —
      which one it is depends only on <b>whether the name appeared above</b>.
  trace:
    - ko: "{{pick.3|code}}{{pick.3|josa:을,를}} 먼저 값으로 만든다."
      en: "{{pick.3|code}} becomes a value first."
    - ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 그 값을 가리키게 한다."
      en: "{{pick.2|code}} is made to point at it."
    - ko: "{{site.line}}행 아래로 {{pick.2|code}}{{pick.2|josa:은,는}} 그 값이다."
      en: "Below line {{site.line}}, {{pick.2|code}} is that value."

rule:
  ko: "<b>만드는 줄과 옮기는 줄이 같은 모양이다.</b> 구별은 위에 같은 이름이 있었는지로만 난다."
  en: "<b>Making and moving look the same.</b> Only what came above tells them apart."
result:
  label:
    ko: "{{site.line}}행 아래의 {{pick.2}}"
    en: "{{pick.2}} below line {{site.line}}"
  value: "{{pick.3}}"
  note:
    ko: "위를 봐야 처음인지 안다"
    en: "look above to see if it is the first"
ok:
  ko: >-
    {{pick.2|code}}{{pick.2|josa:이,가}} 이제 {{pick.3|code}}{{pick.3|josa:을,를}} 가리킵니다. 위에 같은 이름이 없었다면 이 줄이
    그 이름을 만든 자리이기도 합니다.
  en: >-
    {{pick.2|code}} now points at {{pick.3|code}}. If the name did not appear above, this line is
    also where it came into being.
payoff:
  ko: >-
    이걸 알면 「같은 이름인데 값이 왜 다르지」가 풀립니다 — 위로 훑어 같은 이름이 나오는
    줄을 찾으면 됩니다.
  en: >-
    This untangles “same name, different value” — scan upward for the line where the name appears.
bridge:
  ko: >-
    다른 언어는 만드는 줄에 낱말을 하나 더 붙입니다. 파이썬은 안 붙이므로 <b>읽는 사람이
    위를 봐야</b> 합니다.
  en: >-
    Other languages put an extra word on the line that makes a name. Python does not, so <b>the
    reader has to look up</b>.
misconceptions:
  - ko: "선언한 적 없는 이름에 넣으면 멈춘다 — 파이썬에서는 그 줄이 곧 만드는 줄입니다."
    en: "Assigning to an undeclared name stops — in Python that line is what makes the name."
  - ko: "함수 안에서 넣으면 바깥 이름이 바뀐다 — 안에서 넣으면 그 함수 안의 새 이름이 됩니다."
    en: "Assigning inside a function changes the outer name — it makes a new name inside instead."

point:
  - q:
      ko: "{{site.line}}행에서 <b>이름이 값을 가리키게 하는 기호</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the symbol that makes the name point at the value</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>이름</b>입니다. 이름은 스스로 무엇을 가리킬지 못 정하고, 정하는 일은 가운데 기호가 합니다."
          en: >-
            {{pick.2|code}} is <b>the name</b>. A name cannot choose what it points at; the symbol
            between does that.
        edge:
          h:
            ko: "가장 날카로운 자리 — 이름만으로는 아무 일도 안 난다"
            en: "The sharpest spot — a name alone does nothing"
          code:
            - "count        # 없는 이름이면 NameError"
            - "count = 0    # 이 줄이 이름을 만든다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 가리킬 <b>값</b>입니다. 값은 어디로 갈지 모르고, 그것을 정하는 것이 가운데 기호예요."
          en: >-
            {{pick.3|code}} is the <b>value</b> to point at. A value does not know where it goes;
            the symbol between decides.
        edge:
          h:
            ko: "가장 날카로운 자리 — 값이냐 넣는 일이냐"
            en: "The sharpest spot — the value or the putting"
          code:
            - "0            # 계산되고 사라진다"
            - "count = 0    # 이름이 남는다"

meaning:
  - q:
      ko: "{{site.line}}행 위에 {{pick.2|code}} 라는 이름이 한 번도 안 나왔다면 어떻게 될까요?"
      en: "What if the name {{pick.2|code}} never appeared above line {{site.line}}?"
    hint:
      ko: "파이썬에는 만드는 낱말이 따로 <b>없습니다</b>."
      en: "Python has <b>no separate word</b> for making a name."
    options:
      - t:
          ko: "이 줄이 그 이름을 만든다 — 따로 선언할 필요가 없다"
          en: "This line makes the name — nothing needs declaring first"
      - t:
          ko: "선언하지 않았다며 멈춘다"
          en: "It stops, saying the name was never declared"
        diag:
          t:
            ko: "이름을 <b>읽으려</b> 했다면 그 말이 맞습니다. 넣는 줄은 반대로 그 자리에서 이름을 만들어요."
            en: >-
              That would hold if you had tried to <b>read</b> the name. A line that puts a value in
              makes the name right there instead.
          edge:
            h:
              ko: "가장 날카로운 자리 — 읽기냐 넣기냐"
              en: "The sharpest spot — reading or putting"
            code:
              - "print(n)   # NameError"
              - "n = 1      # 만들어진다"
      - t:
          ko: "값이 없는 이름이 만들어진다"
          en: "A name with no value is made"
        diag:
          t:
            ko: "값 없는 이름은 파이썬에 없습니다. 이름은 언제나 무언가를 가리켜요 — 「비어 있음」도 <code>None</code> 이라는 값입니다."
            en: >-
              A name without a value does not exist in Python. A name always points at something —
              even “empty” is a value called <code>None</code>.
          edge:
            h:
              ko: "가장 날카로운 자리 — 비어 있음도 값이다"
              en: "The sharpest spot — empty is a value too"
            code:
              - "n = None   # None 을 가리킨다"
              - "n          # 이름만으로는 못 만든다"
      - t:
          ko: "바깥에 같은 이름이 있으면 그것을 고친다"
          en: "If an outer name exists it edits that one"
        diag:
          t:
            ko: "함수 안이라면 오히려 반대입니다 — 안에서 넣으면 <b>그 함수 안의 새 이름</b>이 되고 바깥은 그대로예요."
            en: >-
              Inside a function it is the other way round — putting a value in makes <b>a new name
              inside</b> and the outer one is untouched.
          edge:
            h:
              ko: "가장 날카로운 자리 — 안과 밖"
              en: "The sharpest spot — inside and outside"
            code:
              - "n = 1"
              - "def f(): n = 2   # 바깥 n 은 1 그대로"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 이름 하나가 값을 <b>가리키게</b> 합니다."
      en: >-
        Choose what goes in the blank. Line {{site.line}} makes one name <b>point at</b> a value.
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "=", mono: true }
      - t: "=="
        mono: true
        diag:
          t:
            ko: "기호 둘짜리는 <b>견주기</b>라 묻기만 하고 넣지 않습니다. 이 줄은 답 하나를 만들어 놓고 아무 데도 안 담은 채 끝나요."
            en: >-
              The two-symbol form <b>weighs</b>: it asks, it does not put. The line would make one
              answer and end without keeping it.
          edge:
            h:
              ko: "가장 날카로운 자리 — 넣는가 묻는가"
              en: "The sharpest spot — putting or asking"
            code:
              - "count = 0    # count 가 0 이 된다"
              - "count == 0   # count 는 그대로"
      - t: "+="
        mono: true
        diag:
          t:
            ko: "이 모양은 <b>지금 값에 더한</b> 결과를 넣습니다. 옛 값을 재료로 쓰므로 이름이 아직 없으면 그 자리에서 멈춰요."
            en: >-
              That form puts back the result of <b>adding to what is there</b>. It uses the old
              value, so if the name does not exist yet it stops right there.
          edge:
            h:
              ko: "가장 날카로운 자리 — 옛 값이 필요한가"
              en: "The sharpest spot — is the old value needed"
            code:
              - "n = 1     # 없어도 된다"
              - "n += 1    # 없으면 NameError"
      - t: ":="
        mono: true
        diag:
          t:
            ko: "이 모양은 <b>식 안에서</b> 이름을 만드는 자리라 <code>if</code>·<code>while</code> 의 조건 안에서만 쓰입니다. 줄 하나로 서 있는 자리에는 오지 않아요."
            en: >-
              That form names a value <b>inside an expression</b>, so it lives in an
              <code>if</code> or <code>while</code> condition. It does not stand as a line of its own.
          edge:
            h:
              ko: "가장 날카로운 자리 — 줄이냐 식 안이냐"
              en: "The sharpest spot — a line or inside an expression"
            code:
              - "n = f()            # 줄 하나"
              - "if (n := f()): ... # 조건 안"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 이 값에 이름을 붙였을까요?"
    en: "Why does line {{site.line}} put a name on this value?"
  choices:
    - t:
        ko: "아래에서 같은 값을 다시 쓰고, 이 줄이 무엇을 만드는 중인지 이름으로 남기려고"
        en: "Because the value is used again below, and the name records what this line builds"
      ok: true
      fb:
        ko: "그 방향입니다. 이름이 없었다면 이 줄이 무엇을 만드는 중인지 어디에 적히는지도 함께 적어 보세요."
        en: "That is the direction. Say also where it would be written down without the name."
    - t:
        ko: "파이썬이 이름을 요구해서"
        en: "Because Python demands a name"
      ok: false
      fb:
        ko: "요구하지 않습니다. 값만 계산하고 버려도 됩니다 — 이름은 읽는 사람을 위한 선택입니다."
        en: "It does not. A value may be computed and dropped — the name is a choice for the reader."
    - t:
        ko: "값을 못 바꾸게 하려고"
        en: "To keep the value from changing"
      ok: false
      fb:
        ko: "파이썬에는 다시 못 넣게 막는 낱말이 없습니다. 같은 이름에 다시 넣으면 그대로 바뀝니다."
        en: "Python has no word that blocks re-binding. Put another value in and the name moves."

queries:
  - { grammars: [python], file: ./assignment.scm }

examples:
  - code: "count = 0"
    expect: { sites: 1, form: assign, hole: "=", picks: { 1: "=", 2: "count", 3: "0" } }
  - code: "cursor = next(items)"
    expect: { sites: 1, form: assign, hole: "=", picks: { 1: "=", 2: "cursor", 3: "next(items)" } }
  - code: "obj.attr = 1"
    expect: none
