schema: 1
id: py/implicit-conversion
# 0부 축 F. `universal: null` — 세 언어의 답이 다 다르다. 파이썬은 수끼리만 자동으로 올리고
# 글자와 수는 **안 섞는다**, JS 는 다 섞고(`1 + '1' === '11'`), 자바는 글자만 `+` 로 자동이다
# (`py.md` §1.5.2 형 변환 행). 묶으면 그 셋 중 하나를 틀린 것으로 물려준다.
universal: null
name: { ko: 저절로 올라가는 것, en: Widening on its own }
token: "+"
grammars: [python]
framework: null
essential: true
difficulty: 2
prereq: [cs/type-conversion, cs/type]
confusions: [py/explicit-conversion]

dict:
  one_liner:
    ko: "수끼리 섞으면 넓은 쪽으로 올라간다. 글자와 수는 안 섞인다."
    en: "Numbers meet and rise to the wider kind. Text and numbers do not mix."
  why:
    ko: >-
      파이썬에는 좁은 것에서 넓은 것으로 가는 사다리가 있습니다 —
      참·거짓 ⊂ 정수 ⊂ 소수. 사다리 위쪽 값이 하나라도 섞이면 결과가 그쪽으로 올라가요.
      {{site.line}}행의 {{pick.1|code}} 자리에서 {{pick.2|code}} 값이 올라갑니다.
      <b>여기까지가 자동입니다.</b> 글자와 수는 사다리에 같이 없어서 섞으면 그 자리에서
      멈춰요 — <code>"1" + 1</code> 이 <code>"11"</code> 도 <code>2</code> 도 아닌 <b>오류</b>인
      것이 파이썬입니다. 자바스크립트는 같은 식에서 <code>"11"</code> 을 냅니다.
      참·거짓이 사다리 안에 있다는 것이 놀라운 자리예요 — <code>True + True</code> 가 2 입니다.
    en: >-
      Python has a ladder from narrow to wide: true-or-false ⊂ whole number ⊂ decimal. One value from
      higher up pulls the result with it. At {{pick.1|code}} on line {{site.line}} the value
      {{pick.2|code}} rises. <b>That is where automatic ends.</b> Text is not on the ladder, so
      mixing it stops on the spot: <code>"1" + 1</code> is neither <code>"11"</code> nor
      <code>2</code> but an <b>error</b> in Python, while JavaScript answers <code>"11"</code>. The
      surprise is that true-or-false sits on the ladder at all — <code>True + True</code> is 2.
  trace:
    - ko: "{{site.line}}행의 {{pick.2|code}}{{pick.2|josa:과,와}} {{pick.3|code}} 값을 각각 만든다."
      en: "{{pick.2|code}} and {{pick.3|code}} on line {{site.line}} each become a value."
    - ko: "종류가 다르면 좁은 쪽을 넓은 쪽으로 올린다 — 코드에는 안 적힌다."
      en: "If the kinds differ the narrower rises to the wider, unwritten in the code."
    - ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 올라간 값 둘로 새 값 하나를 만든다."
      en: "{{pick.1|code}} makes one new value from the two, now on the same rung."

rule:
  ko: >-
    <b>수 사이는 저절로 올라가고 글자와는 안 섞인다.</b> 올라가는 일은 코드에 안 적힌다.
  en: >-
    <b>Numbers rise on their own; text does not join them.</b> The rise is never written down.
result:
  label:
    ko: "{{site.line}}행의 셈"
    en: "the arithmetic on line {{site.line}}"
  value: "{{pick.2}} {{pick.1}} {{pick.3}}"
  note:
    ko: "넓은 쪽 종류로 나온다"
    en: "it comes out in the wider kind"
ok:
  ko: >-
    {{pick.1|code}}{{pick.1|josa:이,가}} 종류가 다른 둘을 받아 넓은 쪽으로 맞춥니다.
    맞추는 줄이 따로 없어서 <b>코드만 보면 안 보여요.</b>
  en: >-
    {{pick.1|code}} takes two kinds and settles on the wider one. No line does the settling, so
    <b>reading the code alone will not show it</b>.
payoff:
  ko: >-
    「정수만 넣었는데 소수가 나온다」와 「글자를 더했더니 멈춘다」가 같은 규칙의 앞뒤라는
    것을 알게 됩니다.
  en: >-
    “I only put whole numbers in and got a decimal” and “adding text stopped it” turn out to be two
    faces of one rule.
bridge:
  ko: >-
    사다리를 <b>내려가는</b> 쪽은 자동이 아닙니다 — 그때는 사람이 적어야 하고,
    적는 순간 다음 판의 이야기가 돼요.
  en: >-
    Going <b>down</b> the ladder is not automatic: it has to be written by hand, and the moment it
    is, the next plate takes over.
misconceptions:
  - ko: >-
      글자와 수를 더하면 이어 붙는다 — 자바스크립트가 그렇습니다. 파이썬은 그 자리에서
      멈추고, 이어 붙이려면 종류를 먼저 맞춰야 해요.
    en: >-
      Adding text to a number joins them — that is JavaScript. Python stops there; joining means
      settling the kinds first.
  - ko: >-
      참·거짓은 셈에 못 쓴다 — 정수의 부분집합이라 그대로 셈에 들어갑니다.
      참을 셋 더하면 3 이에요.
    en: >-
      A true-or-false cannot enter arithmetic — it is a subset of whole numbers and goes straight in.
      Three trues add up to 3.

point:
  - q:
      ko: "{{site.line}}행에서 <b>종류를 맞추게 만드는 기호</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the symbol that forces the kinds to meet</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: >-
            {{pick.2|code}}{{pick.2|josa:은,는}} <b>올라가는 쪽</b>입니다. 올라가라고 시키는
            것은 두 값을 만나게 한 기호예요.
          en: >-
            {{pick.2|code}} is the side that <b>rises</b>. What makes it rise is the symbol that
            brought the two together.
        edge:
          h:
            ko: "가장 날카로운 자리 — 올라가는 값과 만나게 한 기호"
            en: "The sharpest spot — the value that rises and the symbol that met them"
          code:
            - "1                # 그대로 정수다"
            - "1 + 2.0          # 여기서 올라간다"
      pick.3:
        t:
          ko: >-
            {{pick.3|code}}{{pick.3|josa:은,는}} <b>넓은 쪽</b>입니다. 이쪽은 안 움직이고
            반대쪽이 여기로 맞춰져요.
          en: >-
            {{pick.3|code}} is the <b>wider</b> side. It does not move; the other side comes up to
            meet it.
        edge:
          h:
            ko: "가장 날카로운 자리 — 움직이는 쪽과 안 움직이는 쪽"
            en: "The sharpest spot — the side that moves and the side that stays"
          code:
            - "1 + 2.0          # 왼쪽이 올라간다"
            - "1.0 + 2          # 오른쪽이 올라간다"

meaning:
  - q:
      ko: "<code>\"1\" + 1</code> 은 어떻게 될까요?"
      en: "What does <code>\"1\" + 1</code> give?"
    hint:
      ko: "글자와 수가 같은 사다리에 있는지 먼저 보세요."
      en: "Start by asking whether text and numbers share a ladder."
    options:
      - t:
          ko: "그 자리에서 멈춘다 — 종류가 안 맞는다"
          en: "It stops there — the kinds do not meet"
      - t:
          ko: "<code>\"11\"</code> — 수가 글자로 바뀐다"
          en: "<code>\"11\"</code> — the number turns into text"
        diag:
          t:
            ko: >-
              그렇게 하는 언어는 <b>자바스크립트</b>입니다. 파이썬은 글자와 수를 한 사다리에
              안 두어서 맞출 방법이 없어요.
            en: >-
              The language that does that is <b>JavaScript</b>. Python keeps text off the number
              ladder, so there is no rung to meet on.
          edge:
            h:
              ko: "가장 날카로운 자리 — 섞는 언어와 안 섞는 언어"
              en: "The sharpest spot — languages that mix and languages that do not"
            code:
              - '파이썬:      "1" + 1   # 멈춘다'
              - '자바스크립트: "1" + 1   # "11"'
      - t:
          ko: "<code>2</code> — 글자가 수로 바뀐다"
          en: "<code>2</code> — the text turns into a number"
        diag:
          t:
            ko: >-
              그 방향으로 바꾸는 언어도 있지만 파이썬은 아닙니다. 바꾸려면 <b>사람이 적어야</b>
              하고, 적는 순간 다른 개념이 돼요.
            en: >-
              Some languages convert that way; Python does not. Converting has to be
              <b>written by hand</b>, and the moment it is, another concept takes over.
          edge:
            h:
              ko: "가장 날카로운 자리 — 저절로냐 적어서냐"
              en: "The sharpest spot — on its own or written"
            code:
              - '"1" + 1         # 멈춘다'
              - 'int("1") + 1    # 2'
      - t:
          ko: "<code>1</code> — 뒤쪽이 버려진다"
          en: "<code>1</code> — the second is dropped"
        diag:
          t:
            ko: >-
              버리는 규칙은 없습니다. 종류가 안 맞으면 <b>멈추는</b> 쪽이 파이썬의 선택이고,
              조용히 값을 버리는 것보다 찾기 쉬워요.
            en: >-
              Nothing is ever dropped. Stopping on mismatched kinds is Python's choice, and it is
              easier to find than a value quietly discarded.
          edge:
            h:
              ko: "가장 날카로운 자리 — 멈추느냐 조용하냐"
              en: "The sharpest spot — stopping or staying quiet"
            code:
              - '"1" + 1         # TypeError'
              - 'True + True     # 2 — 이쪽은 조용히 올라간다'

no_hole_reason: >-
  구멍을 못 뚫는다. 이 개념의 요점은 종류를 맞추는 일이 **코드에 안 적힌다**는 것이라 지울
  글자가 없다. 적히는 순간 그것은 다음 판(`py/explicit-conversion`)이 되고, 여기서 빈칸을
  만들면 가르치려는 것과 반대되는 판이 나온다.

why_gate:
  q:
    ko: "{{site.line}}행의 결과가 왜 넓은 쪽 종류로 나올까요?"
    en: "Why does line {{site.line}} come out in the wider kind?"
  choices:
    - t:
        ko: "좁은 쪽을 넓은 쪽에 맞춰야 값을 안 잃어서"
        en: "Because meeting on the wider rung is what keeps the value whole"
      ok: true
      fb:
        ko: "그 방향입니다. 반대 방향으로 맞췄다면 무엇을 잃는지도 적어 보세요."
        en: "That is the direction. Add what would be lost if they met on the narrower rung."
    - t:
        ko: "왼쪽 값의 종류를 따라가서"
        en: "Because it follows the kind of the left value"
      ok: false
      fb:
        ko: "자리는 상관없습니다. <b>넓은 쪽</b>이 이기고, 오른쪽에 있어도 마찬가지예요."
        en: "Position plays no part. The <b>wider</b> side wins, right or left."
    - t:
        ko: "파이썬이 모든 수를 소수로 다뤄서"
        en: "Because Python handles every number as a decimal"
      ok: false
      fb:
        ko: >-
          그렇게 하는 언어는 자바스크립트입니다. 파이썬은 정수와 소수를 끝까지 갈라 두고,
          섞일 때만 올려요.
        en: >-
          The language that does that is JavaScript. Python keeps the two apart and raises only
          where they meet.

queries:
  - { grammars: [python], file: ./implicit-conversion.scm }

examples:
  - code: "total = 1 + 2.0          # 1 + 2.0 -> 3.0 (float)"
    expect: { sites: 1, form: widen, picks: { 1: "+", 2: "1", 3: "2.0" } }
  - code: "total = 1.5 * 3          # 1.5 * 3 -> 4.5 (float)"
    expect: { sites: 1, form: widen, picks: { 1: "*", 2: "3", 3: "1.5" } }
  - code: "score = True + True      # True + True -> 2 (int)"
    expect: { sites: 1, form: boolnum, picks: { 1: "+", 2: "True", 3: "True" } }
  - code: "shift = base + True      # 1 + True -> 2 (int)"
    expect: { sites: 1, form: boolnum, picks: { 1: "+", 2: "True", 3: "base" } }
  - code: "total = 1 + 2            # 1 + 2 -> 3 (int)"
    expect: none
  - code: 'joined = "a" + "b"       # "a" + "b" -> "ab" (str)'
    expect: none
