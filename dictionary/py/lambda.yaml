schema: 1
id: py/lambda
universal: common/function-value
name: { ko: 이름 없는 함수, en: A function without a name }
token: "lambda"
grammars: [python]
framework: null
essential: true
difficulty: 3
prereq: [py/function-definition, py/call-expression, cs/closure-capture]
confusions: []

dict:
  one_liner:
    ko: "이름을 안 붙이고 식 하나짜리 함수를 그 자리에서 만든다."
    en: "Makes a nameless function holding one expression, right where it is written."
  why:
    ko: >-
      {{site.line}}행은 함수를 <b>값으로</b> 만듭니다. 담을 수 있는 것이 {{pick.3|code}} 하나뿐이고
      돌려주는 낱말도 없어요 — 콜론 뒤의 그 식이 곧 돌려주는 값입니다.
    en: >-
      Line {{site.line}} makes a function <b>as a value</b>. It can hold only {{pick.3|code}} and has
      no word for handing back — the expression after the colon is what comes back.
  trace:
    - ko: "{{site.line}}행이 도는 순간 함수 하나가 값으로 만들어진다."
      en: "As line {{site.line}} runs, one function is made as a value."
    - ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 그 함수가 받을 자리다 — 지금은 아직 안 채워진다."
      en: "{{pick.2|code}} is the slot that function will take — nothing fills it yet."
    - ko: "나중에 그 함수가 불릴 때 {{pick.3|code}}{{pick.3|josa:이,가}} 계산되어 돌아간다."
      en: "Later, when it is called, {{pick.3|code}} is computed and handed back."

rule:
  ko: "<b>식 하나만 담고 돌려주는 낱말이 없다.</b> 콜론 뒤의 식이 곧 돌아가는 값이다."
  en: "<b>One expression, and no word for handing back.</b> The expression after the colon is the result."
result:
  label:
    ko: "{{site.line}}행이 만든 값"
    en: "the value made on line {{site.line}}"
  value: "{{pick.3}} 하나를 내는 함수"
  note:
    ko: "이 줄에서는 아직 안 돈다"
    en: "nothing runs yet on this line"
ok:
  ko: >-
    함수 하나가 <b>값으로</b> 만들어졌습니다. 이 줄에서 몸통은 한 번도 안 돌고, {{pick.3|code}}{{pick.3|josa:은,는}}
    누군가 이 값을 부를 때 계산돼요.
  en: >-
    One function now exists <b>as a value</b>. Its body has not run on this line; {{pick.3|code}} is
    computed when someone calls the value.
payoff:
  ko: >-
    이걸 알면 정렬 기준이 왜 그 자리에 적히는지가 풀립니다 — 정렬 함수는 <b>비교할 값을 꺼내는 법</b>을
    받아야 하고, 그것을 위해 함수 하나를 따로 정의할 만큼 길지 않아요.
  en: >-
    This explains why a sort key is written inline — a sorting function needs <b>a way to pull the
    value to compare</b>, and that is too short to deserve a definition of its own.
bridge:
  ko: >-
    <code>py/function-definition</code> 과 다른 것은 셋입니다 — 이름이 없다 · 몸통이 식 하나다 ·
    <b>그 자리에서 값이 된다.</b> 세 번째가 이 문법이 존재하는 이유예요.
  en: >-
    Three things differ from <code>py/function-definition</code> — no name, a body of one expression,
    and <b>becoming a value on the spot</b>. The third is why this form exists.
misconceptions:
  - ko: >-
      이 줄에서 몸통이 돈다 — <b>안 돕니다.</b> 함수 하나가 만들어질 뿐이고, 몸통은 그 값이 불릴
      때 돌아요.
    en: >-
      The body runs on this line — it <b>does not</b>. Only a function is made; the body runs when the
      value is called.
  - ko: >-
      여러 줄을 담을 수 있다 — <b>식 하나</b>만 담습니다. 갈림길이나 되풀이가 필요하면 이름 붙은
      함수를 따로 정의해야 해요.
    en: >-
      It can hold several lines — only <b>one expression</b>. Anything with a branch or a loop needs a
      named function of its own.
  - ko: >-
      되풀이 안에서 만들면 그때그때의 값이 들어간다 — 바깥 이름을 <b>가리키기만</b> 해서, 되풀이가
      끝난 뒤 부르면 마지막 값이 나옵니다.
    en: >-
      Made inside a loop it captures the value of that turn — it only <b>points at</b> the outer name,
      so calling it after the loop yields the last value.

point:
  - q:
      ko: "{{site.line}}행에서 <b>이름 없는 함수를 여는 낱말</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the word that opens a nameless function</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: >-
            {{pick.2|code}}{{pick.2|josa:은,는}} <b>받을 자리</b>입니다. 자리만 적혀 있으면 함수가 아니라
            그냥 이름이고, 함수로 만드는 것은 그 앞의 낱말이에요.
          en: >-
            {{pick.2|code}} is <b>the receiving slot</b>. A slot alone is just a name; the word before
            it is what makes a function.
        edge:
          h:
            ko: "가장 날카로운 자리 — 이름과 함수"
            en: "The sharpest spot — a name and a function"
          code:
            - "r                  # 이름 하나"
            - "lambda r: r.name   # 함수 하나"
      pick.3:
        t:
          ko: >-
            {{pick.3|code}}{{pick.3|josa:은,는}} <b>돌려줄 식</b>입니다. 이 줄에서는 아직 계산되지 않고,
            그것을 나중으로 미루는 것이 그 앞의 낱말이에요.
          en: >-
            {{pick.3|code}} is <b>the expression to hand back</b>. It is not computed on this line;
            the word before it is what defers it.
        edge:
          h:
            ko: "가장 날카로운 자리 — 지금과 나중"
            en: "The sharpest spot — now and later"
          code:
            - "r.name             # 지금 계산된다"
            - "lambda r: r.name   # 나중에"

meaning:
  - q:
      ko: "{{site.line}}행이 돌고 난 직후에 {{pick.3|code}}{{pick.3|josa:은,는}} 계산되어 있을까요?"
      en: "Right after line {{site.line}} runs, has {{pick.3|code}} been computed?"
    hint:
      ko: "만들어진 것이 <b>값인지 결과인지</b> 봅니다."
      en: "Ask whether what was made is <b>a value or a result</b>."
    options:
      - t:
          ko: "아니다 — 함수 하나가 값으로 남았을 뿐이다"
          en: "No — only a function now exists as a value"
      - t:
          ko: "그렇다 — 만들면서 한 번 계산된다"
          en: "Yes — it is computed once while being made"
        diag:
          t:
            ko: >-
              만들 때 계산되면 <b>받을 값이 아직 없어서</b> 계산할 수가 없습니다. 받을 자리가 비어
              있다는 것이 그 증거예요.
            en: >-
              Computing at creation is impossible because <b>the value it takes has not arrived</b>.
              The empty receiving slot is the proof.
          edge:
            h:
              ko: "가장 날카로운 자리 — 받을 값이 아직 없다"
              en: "The sharpest spot — no value has arrived yet"
            code:
              - "f = lambda r: r.name    # 안 돈다"
              - "f(row)                  # 여기서 돈다"
      - t:
          ko: "부르는 자리에 넘겨질 때 계산된다"
          en: "It is computed when handed to the place that calls it"
        diag:
          t:
            ko: >-
              넘기는 일과 부르는 일은 <b>다릅니다.</b> 넘겨도 안 돌고, 받은 쪽이 실제로 부를 때 돌아요.
            en: >-
              Handing over and calling are <b>different</b>. Handing it over runs nothing; it runs when
              the receiver actually calls it.
          edge:
            h:
              ko: "가장 날카로운 자리 — 넘기기와 부르기"
              en: "The sharpest spot — handing over and calling"
            code:
              - "sorted(rows, key=f)     # f 를 넘긴다"
              - "# sorted 가 항목마다 부른다"
      - t:
          ko: "그 자리에서 문법 오류가 난다"
          en: "It is a syntax error there"
        diag:
          t:
            ko: >-
              문법에 맞습니다. 함수가 <b>값</b>이라는 것이 파이썬의 전제이고, 그래서 이런 값을
              이름에 담거나 인자로 넘길 수 있어요.
            en: >-
              It is valid. Functions being <b>values</b> is a premise of Python, which is why such a
              value can be kept in a name or handed to another call.
          edge:
            h:
              ko: "가장 날카로운 자리 — 함수도 값이다"
              en: "The sharpest spot — a function is a value"
            code:
              - "f = lambda r: r.name"
              - "type(f)                 # function"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 <b>이름 없는 함수</b> 하나를 값으로 만듭니다."
      en: >-
        Choose what goes in the blank. Line {{site.line}} makes one <b>nameless function</b> as a
        value.
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "lambda", mono: true }
      - t: "def"
        mono: true
        diag:
          t:
            ko: >-
              그 낱말은 <b>이름을 요구합니다.</b> 그리고 그것은 문이라 식이 오는 자리에 못 놓여서,
              인자로 바로 넘길 수가 없어요.
            en: >-
              That word <b>demands a name</b>. It is also a statement, so it cannot stand where an
              expression goes and cannot be handed straight to a call.
          edge:
            h:
              ko: "가장 날카로운 자리 — 문과 식"
              en: "The sharpest spot — a statement and an expression"
            code:
              - "sorted(rows, key=lambda r: r.name)"
              - "sorted(rows, key=def f(r): ...)   # SyntaxError"
      - t: "func"
        mono: true
        diag:
          t:
            ko: >-
              파이썬에 그런 낱말은 <b>없습니다.</b> 다른 언어의 낱말이라 그 자리에서 이름 하나로
              읽히고 문법이 안 맞아요.
            en: >-
              Python has no such word. It comes from another language, so it reads as a bare name and
              the line does not hold together.
          edge:
            h:
              ko: "가장 날카로운 자리 — 있는 낱말과 없는 낱말"
              en: "The sharpest spot — a word that exists and one that does not"
            code:
              - "lambda r: r.name       # 파이썬"
              - "func(r int) string     # 고"
      - t: "=>"
        mono: true
        diag:
          t:
            ko: >-
              그 기호는 <b>다른 언어</b>에서 같은 일을 합니다. 파이썬에는 그 기호가 없고, 낱말 하나로
              같은 자리를 채워요.
            en: >-
              That symbol does the same job in <b>other languages</b>. Python does not have it and
              fills the same slot with a word.
          edge:
            h:
              ko: "가장 날카로운 자리 — 기호와 낱말"
              en: "The sharpest spot — a symbol and a word"
            code:
              - "lambda r: r.name       # 파이썬"
              - "r => r.name            # 다른 언어"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 함수를 따로 정의하지 않고 그 자리에서 만들었을까요?"
    en: "Why does line {{site.line}} make the function inline instead of defining one?"
  choices:
    - t:
        ko: "여기서 한 번만 쓰이고 식이 짧아서 — 이름을 붙이면 읽는 사람이 그 이름을 찾으러 간다"
        en: "Because it is used once and is short — a name would send the reader off to find it"
      ok: true
      fb:
        ko: "그 방향입니다. 이 값을 실제로 부르는 쪽이 어디인지도 짚어 보세요."
        en: "That is the direction. Point also at what actually calls this value."
    - t:
        ko: "파이썬에서 함수를 인자로 넘기려면 이 문법이어야 해서"
        en: "Because passing a function as an argument requires this form"
      ok: false
      fb:
        ko: >-
          이름 붙은 함수도 그대로 넘길 수 있습니다. 함수가 값이라 이름만 적으면 넘어가요 —
          갈리는 것은 길이와 재사용입니다.
        en: >-
          A named function can be handed over too — functions are values, so the bare name suffices.
          What differs is length and reuse.
    - t:
        ko: "이렇게 쓰면 더 빨라서"
        en: "Because it runs faster this way"
      ok: false
      fb:
        ko: >-
          함수 하나가 만들어지는 것은 같습니다. 재 보지 않고 빠르다고 하면 근거가 안 서요.
        en: >-
          One function is made either way. Calling it faster without measuring leaves no ground.

queries:
  - { grammars: [python], file: ./lambda.scm }

examples:
  - code: "key = lambda r: r.name"
    expect: { sites: 1, form: lambda, hole: "lambda", picks: { 1: "lambda", 2: "r", 3: "r.name" } }
  - code: "rows.sort(key=lambda r: r.price)"
    expect: { sites: 1, form: lambda, hole: "lambda", picks: { 1: "lambda", 2: "r", 3: "r.price" } }
  - code: "make = lambda: Item()"
    expect: { sites: 1, form: lambda, hole: "lambda", picks: { 1: "lambda", 3: "Item()" } }
  # 이름 붙은 함수는 노드가 다르다 — `py/function-definition` 의 자리다.
  - code: "def key(r):\n    return r.name"
    expect: none
