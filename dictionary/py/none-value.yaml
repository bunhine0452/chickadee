schema: 1
id: py/none-value
universal: common/absent-value
name: { ko: 없음이라는 값, en: The absent value }
token: "None"
grammars: [python]
framework: null
essential: true
difficulty: 1
prereq: [py/assignment, cs/null-reference]
confusions: []

dict:
  one_liner:
    ko: "「아무것도 없음」도 값 하나다. 그 값을 가리키는 이름은 비어 있지 않다."
    en: "“Nothing here” is itself a value. A name pointing at it is not empty."
  why:
    ko: >-
      파이썬의 「없음」은 <b>하나</b>입니다. {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:은,는}}
      자바스크립트처럼 둘로 갈리지 않아서, 「값을 아직 안 넣었다」와 「값이 없다」를 구별하는 일이
      아예 없어요.
    en: >-
      Python has <b>one</b> absent value. {{pick.1|code}} on line {{site.line}} does not split in
      two the way JavaScript's does, so there is never a question of “not set yet” versus
      “set to nothing.”
  trace:
    - ko: "{{site.line}}행에서 {{pick.1|code}}{{pick.1|josa:이,가}} 값 하나로 놓인다."
      en: "On line {{site.line}}, {{pick.1|code}} is placed as one value."
    - ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 그 값을 가리킨다 — 아무것도 안 가리키는 것이 아니다."
      en: "{{pick.2|code}} points at it — it is not pointing at nothing."
    - ko: "그래서 {{pick.2|code}}{{pick.2|josa:을,를}} 읽어도 멈추지 않는다."
      en: "So reading {{pick.2|code}} does not stop the program."

rule:
  ko: "<b>없음도 값이다.</b> 이름은 언제나 무언가를 가리키고, 「없음」은 그 무언가 중 하나다."
  en: "<b>Absence is a value.</b> A name always points at something, and absence is one of those things."
result:
  label:
    ko: "{{site.line}}행의 {{pick.2}}"
    en: "{{pick.2}} on line {{site.line}}"
  value: "{{pick.1}}"
  note:
    ko: "빈 이름이 아니라 없음을 가리키는 이름"
    en: "not an empty name — a name pointing at absence"
ok:
  ko: >-
    {{pick.2|code}}{{pick.2|josa:이,가}} 이제 「없음」을 가리킵니다. 나중에 다른 값으로 옮겨 담을
    자리를 미리 만들어 둔 줄입니다.
  en: >-
    {{pick.2|code}} now points at absence. The line reserves a place that a real value can move
    into later.
payoff:
  ko: >-
    이걸 알면 「값이 없다는데 왜 안 멈추지」가 풀립니다 — 읽을 것이 있고, 그 읽을 것의 이름이
    「없음」입니다. 멈추는 것은 그 값에서 무언가를 <b>꺼내려 할 때</b>입니다.
  en: >-
    This untangles “it says there is no value, so why does it keep running” — there is something to
    read, and that something is named absence. It stops when you try to <b>take a part out of it</b>.
bridge:
  ko: >-
    자바스크립트는 없음이 <b>둘</b>이라(<code>null</code> 과 <code>undefined</code>) 어느 쪽인지 묻는 코드가 생깁니다.
    파이썬은 하나라 그 물음이 없어요.
  en: >-
    JavaScript has <b>two</b> absent values, so code appears that asks which one it is. Python has
    one, so that question never comes up.
misconceptions:
  - ko: "값이 없으니 이름도 비어 있다 — 이름은 없음이라는 값을 <b>가리키고</b> 있습니다."
    en: "No value means an empty name — the name <b>points at</b> the absent value."
  - ko: >-
      없음은 거짓과 같다 — 조건 자리에서는 둘 다 거짓 쪽으로 가지만 <b>같은 값이 아닙니다.</b>
      <code>0</code> 도 거짓이라 「없음인가」와 「거짓인가」는 다른 물음이에요.
    en: >-
      Absence is the same as false — both take the false branch, but they are <b>not the same
      value</b>. Zero is false too, so “is it absent” and “is it false” are different questions.
  # `py.md` §9 #9 — 「`return` 이 없으면 함수가 실패한다」. 여기가 그 오개념의 값 쪽이다.
  - ko: >-
      아무것도 안 돌려주는 함수는 값을 안 준다 — 조용히 <b>없음</b>을 줍니다. 그래서 그 결과를
      이름에 담아도 그 줄은 멈추지 않아요.
    en: >-
      A function that returns nothing hands back no value — it quietly hands back <b>absence</b>.
      That is why keeping its result in a name does not stop the line.

point:
  - q:
      ko: "{{site.line}}행에서 <b>「없음」이라는 값</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the value that means absence</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>이름</b>입니다. 이름은 가리키는 쪽이고, 가리켜지는 값이 이 줄의 오른쪽에 있어요."
          en: >-
            {{pick.2|code}} is <b>the name</b>. A name is the pointing side; the value being pointed
            at sits on the right of this line.
        edge:
          h:
            ko: "가장 날카로운 자리 — 가리키는 쪽과 가리켜지는 쪽"
            en: "The sharpest spot — the pointer and the pointed-at"
          code:
            - "cursor           # 이름"
            - "cursor = None    # 오른쪽이 값이다"

meaning:
  - q:
      ko: "{{site.line}}행 뒤에 {{pick.2|code}}{{pick.2|josa:을,를}} 그냥 읽으면 어떻게 될까요?"
      en: "After line {{site.line}}, what happens if you simply read {{pick.2|code}}?"
    hint:
      ko: "이름이 <b>무언가</b>를 가리키고 있는지부터 봅니다."
      en: "Start from whether the name is pointing at <b>something</b>."
    options:
      - t:
          ko: "값 하나가 읽힌다 — 그 값의 이름이 「없음」이다"
          en: "One value is read — and that value is named absence"
      - t:
          ko: "이름이 비어 있다며 멈춘다"
          en: "It stops, saying the name is empty"
        diag:
          t:
            ko: >-
              그 말이 맞는 자리는 <b>한 번도 안 만든 이름</b>입니다. 이 줄은 이름을 만들었고, 만든
              이름은 언제나 무언가를 가리켜요.
            en: >-
              That holds for a name that was <b>never made</b>. This line made one, and a made name
              always points at something.
          edge:
            h:
              ko: "가장 날카로운 자리 — 안 만든 이름과 없음을 가리키는 이름"
              en: "The sharpest spot — a name never made, and a name pointing at absence"
            code:
              - "print(cursor)          # NameError"
              - "cursor = None; print(cursor)   # None 이 찍힌다"
      - t:
          ko: "0 이 읽힌다"
          en: "Zero is read"
        diag:
          t:
            ko: >-
              「없음」과 <code>0</code> 은 <b>다른 값</b>입니다. 조건 자리에서 둘 다 거짓 쪽으로 가서 같아
              보이지만, 종류도 다르고 셈에 넣으면 갈려요.
            en: >-
              Absence and zero are <b>different values</b>. Both take the false branch, which makes
              them look alike, but their kinds differ and arithmetic tells them apart.
          edge:
            h:
              ko: "가장 날카로운 자리 — 없음과 영"
              en: "The sharpest spot — absence and zero"
            code:
              - "0 + 1      # 1"
              - "None + 1   # TypeError"
      - t:
          ko: "그 자리에서 값이 하나 새로 만들어진다"
          en: "A fresh value is made on the spot"
        diag:
          t:
            ko: >-
              「없음」은 프로그램 전체에 <b>하나뿐</b>입니다. 새로 만들어지지 않고 어디서 적어도 같은
              하나를 가리켜요 — 그래서 자리를 견주는 물음에 쓸 수 있습니다.
            en: >-
              There is <b>exactly one</b> absent value in a program. It is never freshly made; every
              mention points at the same one — which is why it can be compared by place.
          edge:
            h:
              ko: "가장 날카로운 자리 — 하나뿐이라는 것"
              en: "The sharpest spot — there is only one"
            code:
              - "a = None; b = None"
              - "a is b     # True"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 「아직 아무것도 없다」를 <b>값으로</b> 적습니다."
      en: >-
        Choose what goes in the blank. Line {{site.line}} writes “nothing here yet” <b>as a
        value</b>.
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "None", mono: true }
      - t: "null"
        mono: true
        diag:
          t:
            ko: >-
              소문자로 시작하는 그 낱말은 파이썬에 <b>없습니다.</b> 값이 아니라 「그런 이름 없다」로
              읽혀서 그 자리에서 멈춰요.
            en: >-
              That lowercase word does not <b>exist</b> in Python. It reads as “no such name” rather
              than as a value, and stops right there.
          edge:
            h:
              ko: "가장 날카로운 자리 — 있는 낱말과 없는 낱말"
              en: "The sharpest spot — a word that exists and one that does not"
            code:
              - "x = None    # 값"
              - "x = null    # NameError"
      - t: "undefined"
        mono: true
        diag:
          t:
            ko: >-
              없음이 <b>둘</b>인 언어의 낱말입니다. 파이썬은 하나라 「안 넣었다」와 「없다」를 갈라
              적을 낱말 자체가 없어요.
            en: >-
              That word belongs to a language with <b>two</b> absent values. Python has one, so it
              has no word that separates “never set” from “set to nothing.”
          edge:
            h:
              ko: "가장 날카로운 자리 — 하나냐 둘이냐"
              en: "The sharpest spot — one absent value or two"
            code:
              - "x = None    # 파이썬은 이 하나"
              - "let x;      # JS 는 여기서 둘로 갈린다"
      - t: "0"
        mono: true
        diag:
          t:
            ko: >-
              숫자 영은 <b>값이 있는</b> 상태입니다. 조건 자리에서 거짓 쪽으로 가는 것이 같아 헷갈리지만,
              셈에 넣어 보면 갈려요.
            en: >-
              Zero is a state where a value <b>is</b> present. It takes the false branch like absence
              does, which confuses the two, but arithmetic separates them.
          edge:
            h:
              ko: "가장 날카로운 자리 — 없는 것과 영"
              en: "The sharpest spot — absent and zero"
            code:
              - "0 + 1      # 1"
              - "None + 1   # TypeError"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 값을 안 넣고 「없음」을 넣었을까요?"
    en: "Why does line {{site.line}} put absence in rather than a real value?"
  choices:
    - t:
        ko: "아래에서 진짜 값이 정해지고, 그때까지 이 이름이 있다는 것만 먼저 적어 두려고"
        en: "Because the real value is decided below, and the name has to exist until then"
      ok: true
      fb:
        ko: "그 방향입니다. 이 이름을 나중에 어느 줄이 바꿔 놓는지도 함께 짚어 보세요."
        en: "That is the direction. Point also at the line that later moves this name."
    - t:
        ko: "파이썬이 이름을 만들 때 값을 요구해서"
        en: "Because Python demands a value when a name is made"
      ok: false
      fb:
        ko: >-
          요구는 맞지만 그 답으로는 왜 <b>하필 없음</b>인지가 안 풀립니다. 0 이나 빈 글자를 넣어도
          이름은 만들어져요.
        en: >-
          It does demand one, but that does not explain why <b>absence</b> in particular. Zero or an
          empty text would make the name just as well.
    - t:
        ko: "값을 못 바꾸게 잠그려고"
        en: "To lock the value so it cannot change"
      ok: false
      fb:
        ko: "잠그는 낱말이 파이썬에 없습니다. 같은 이름에 다시 넣으면 그대로 옮겨 갑니다."
        en: "Python has no word that locks a name. Put another value in and it moves."

queries:
  - { grammars: [python], file: ./none-value.scm }

examples:
  - code: "cursor = None"
    expect: { sites: 1, form: bound, hole: "None", picks: { 1: "None", 2: "cursor", 3: "=" } }
  - code: "def load(path=None):\n    return path"
    expect: { sites: 1, form: default, hole: "None", picks: { 1: "None", 2: "path", 3: "=" } }
  - code: "def load():\n    return None"
    expect: { sites: 1, form: returned, hole: "None", picks: { 1: "None", 2: "return" } }
  - code: "cursor = 0"
    expect: none
  # `x is None` 은 `py/is-identity` 의 자리다 — 두 개념이 같은 줄을 잡으면 첫 노출이 겹친다.
  - code: "if cursor is None:\n    cursor = []"
    expect: none
