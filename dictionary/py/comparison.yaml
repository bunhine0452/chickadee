schema: 1
id: py/comparison
universal: common/comparison
name: { ko: 견주기, en: Comparison }
token: "=="
grammars: [python]
framework: null
essential: true
difficulty: 1
prereq: [py/boolean-literal, cs/identity-vs-equality]
confusions: []

dict:
  one_liner:
    ko: "값 둘을 견주어 참·거짓 하나를 내놓는다. 양쪽 값은 바뀌지 않는다."
    en: "Weighs two values and yields one true-or-false. Neither value is changed."
  why:
    ko: >-
      갈림길에 필요한 것은 참·거짓 하나인데 손에 있는 것은 숫자나 글자입니다. {{site.line}}행이
      그 사이를 잇습니다 — {{pick.2|code}}{{pick.2|josa:과,와}} {{pick.3|code}}{{pick.3|josa:이,가}} 들어가고 답 하나가 나와요.
      파이썬은 <code>0 &lt; n &lt; 10</code> 처럼 <b>이어 붙여</b> 쓸 수도 있는데, 그건 「둘 다 참인가」를
      한 줄로 적은 것입니다.
    en: >-
      A fork needs one true-or-false, but what you hold is a number or some text. Line
      {{site.line}} bridges that. Python also lets you <b>chain</b> them, as in
      <code>0 &lt; n &lt; 10</code>, which is one line asking whether both hold.
  trace:
    - ko: "{{pick.2|code}}{{pick.2|josa:과,와}} {{pick.3|code}}{{pick.3|josa:을,를}} 각각 값으로 만든다."
      en: "{{pick.2|code}} and {{pick.3|code}} each become a value."
    - ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 그 둘을 견준다."
      en: "{{pick.1|code}} weighs the two."
    - ko: "참·거짓 하나가 남고, 양쪽 값은 그대로다."
      en: "One true-or-false is left, and both values stay."

rule:
  ko: "<b>견주기는 값을 바꾸지 않는다.</b> 새 값 하나가 생길 뿐이다."
  en: "<b>Weighing changes nothing.</b> It only makes one new value."
result:
  label:
    ko: "{{site.line}}행의 견줌"
    en: "the weighing on line {{site.line}}"
  value: "{{pick.1}}"
  note:
    ko: "양쪽은 그대로 남는다"
    en: "both sides are left alone"
ok:
  ko: >-
    {{pick.1|code}}{{pick.1|josa:이,가}} {{pick.2|code}}{{pick.2|josa:과,와}} {{pick.3|code}}{{pick.3|josa:을,를}} 견주어 참·거짓 하나를 내놓습니다.
    {{pick.2|code}} 에 담긴 값은 그대로예요.
  en: >-
    {{pick.1|code}} weighs {{pick.2|code}} against {{pick.3|code}} and yields one true-or-false.
    Whatever {{pick.2|code}} holds, it still holds it.
payoff:
  ko: >-
    이 줄이 있어서 조건 자리에 숫자·글자를 그대로 넣지 않아도 됩니다.
  en: >-
    This line is why numbers and text need not be dropped into a condition raw.
bridge:
  ko: >-
    {{pick.1|code}}{{pick.1|josa:이,가}} 내놓는 것은 참·거짓 값입니다 — 코드에 적어 둔 것과 같은 종류이고,
    이쪽은 셈해서 얻었을 뿐이에요.
  en: >-
    What {{pick.1|code}} yields is a boolean — the same kind as a written-out one, only worked out.
misconceptions:
  - ko: "견주면 왼쪽 값이 결과로 바뀐다 — 아니요. 새 값이 따로 생깁니다."
    en: "The left value turns into the result — no. A separate new value appears."
  - ko: "넣는 기호와 같다 — 하나는 넣는 일, 하나는 견주는 일입니다."
    en: "It is the same as assignment — one puts a value in, the other weighs two."

point:
  - q:
      ko: "{{site.line}}행에서 <b>두 값을 견주는 일을 맡은 기호</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the symbol whose job is weighing the two</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 견줌을 <b>당하는</b> 쪽입니다. 값은 스스로 견주지 못해요."
          en: "{{pick.2|code}} is one of the values <b>being</b> weighed. A value cannot weigh itself."
        edge:
          h:
            ko: "가장 날카로운 자리 — 값만으로는 답이 안 나온다"
            en: "The sharpest spot — a value alone yields no answer"
          code:
            - "n            # 숫자 하나일 뿐이다"
            - "n == 0       # 참·거짓이 나온다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 견줄 <b>상대</b>입니다. 어느 쪽에 두어도 견주는 일은 가운데 기호가 합니다."
          en: >-
            {{pick.3|code}} is the <b>other side</b>. Put it on either side; the weighing is done by
            the symbol between.
        edge:
          h:
            ko: "가장 날카로운 자리 — 자리가 아니라 기호가 정한다"
            en: "The sharpest spot — the symbol decides, not the side"
          code:
            - "0 == n       # 같은 답이 나온다"
            - "n == 0       # 자리를 바꿔도 같다"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 두 값을 <b>견주기만</b> 하고 어느 쪽도 바꾸지 않습니다."
      en: >-
        Choose what goes in the blank. Line {{site.line}} only <b>weighs</b> the two and changes neither.
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "==", mono: true }
      - t: "="
        mono: true
        diag:
          t:
            ko: "기호 하나짜리는 <b>넣는</b> 일입니다. 게다가 파이썬은 조건 안에 이 기호를 못 쓰게 막아 그 자리에서 멈춰요 — 다른 언어에서 조용히 넘어가던 실수를 여기서는 잡아 줍니다."
            en: >-
              The single-symbol form <b>puts</b> a value in. Python also refuses it inside a
              condition and stops there — a slip that passes quietly elsewhere is caught here.
          edge:
            h:
              ko: "가장 날카로운 자리 — 파이썬은 조건 안에서 막는다"
              en: "The sharpest spot — Python refuses it in a condition"
            code:
              - "if n == 0:   # 견준다"
              - "if n = 0:    # SyntaxError"
      - t: "!="
        mono: true
        diag:
          t:
            ko: "이 기호도 견주기이지만 <b>답이 뒤집힙니다</b>. 같을 때 참이어야 하는 자리에 쓰면 갈래가 통째로 반대로 갑니다."
            en: >-
              That also weighs, but it <b>flips the answer</b>. Used where “same” should hold, the
              branch goes the other way entirely.
          edge:
            h:
              ko: "가장 날카로운 자리 — 답이 뒤집힌다"
              en: "The sharpest spot — the answer flips"
            code:
              - "0 == 0       # True"
              - "0 != 0       # False"
      - t: "is"
        mono: true
        diag:
          t:
            ko: "이 낱말은 「값이 같은가」가 아니라 <b>같은 것 자체인가</b>를 묻습니다. 작은 수·짧은 글자에서는 우연히 같은 답이 나와 더 헷갈려요."
            en: >-
              That word asks whether the two are <b>the same object</b>, not whether their values
              match. On small numbers and short text it happens to agree, which makes it worse.
          edge:
            h:
              ko: "가장 날카로운 자리 — 값이냐 그 자체냐"
              en: "The sharpest spot — the value or the object"
            code:
              - "[1] == [1]   # True"
              - "[1] is [1]   # False"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 두 값을 견주어 두었을까요?"
    en: "Why does line {{site.line}} weigh these two values?"
  choices:
    - t:
        ko: "갈림길이 읽을 수 있는 참·거짓이 필요해서 — 숫자나 글자는 그대로 쓸 수 없다"
        en: "Because a fork needs a true-or-false — a number or some text cannot serve as one"
      ok: true
      fb:
        ko: "그 방향입니다. 견주지 않고 값을 그대로 조건에 넣었다면 무엇을 기준으로 갈렸을지도 적어 보세요."
        en: "That is the direction. Say what the fork would go on if the raw value were used."
    - t:
        ko: "값을 같게 만들려고"
        en: "To make the two values equal"
      ok: false
      fb:
        ko: "견주기는 묻기만 합니다. 같게 만드는 것은 넣는 일이고 기호가 다릅니다."
        en: "Weighing only asks. Making them equal is putting a value in, and that is another symbol."
    - t:
        ko: "속도를 빠르게 하려고"
        en: "To make it faster"
      ok: false
      fb:
        ko: "견주기는 속도를 위한 것이 아닙니다. 답을 얻기 위한 것입니다."
        en: "Weighing is not about speed. It is about getting an answer."

queries:
  - { grammars: [python], file: ./comparison.scm }

examples:
  - code: "same = a == b"
    expect: { sites: 1, form: compare, hole: "==", picks: { 1: "==", 2: "a", 3: "b" } }
  - code: "if n > 0:\n    go()"
    expect: { sites: 1, form: compare, hole: ">", picks: { 1: ">", 2: "n", 3: "0" } }
  - code: "total = a + b"
    expect: none
