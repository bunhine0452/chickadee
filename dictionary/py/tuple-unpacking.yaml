schema: 1
id: py/tuple-unpacking
universal: common/destructuring
name: { ko: 한 번에 풀어 담기, en: Unpacking }
token: ","
grammars: [python]
framework: null
essential: true
difficulty: 2
prereq: [py/assignment, py/list-literal]
confusions: []

dict:
  one_liner:
    ko: "묶여 온 값을 한 줄에서 이름 여럿에 나눠 담는다. 개수가 맞아야 한다."
    en: "Splits a grouped value across several names in one line. The counts must match."
  why:
    ko: >-
      {{site.line}}행에서 푸는 일을 하는 것은 괄호가 아니라 <b>왼쪽의 {{pick.1|code}}</b> 입니다.
      {{pick.3|code}}{{pick.3|josa:이,가}} 내놓은 값의 개수와 왼쪽 이름의 개수가 <b>정확히 같아야</b> 하고,
      다르면 그 자리에서 멈춰요.
    en: >-
      What does the splitting on line {{site.line}} is not any bracket but <b>the {{pick.1|code}} on
      the left</b>. The number of values {{pick.3|code}} yields must <b>match exactly</b>, and a
      mismatch stops the line.
  trace:
    - ko: "{{site.line}}행에서 {{pick.3|code}}{{pick.3|josa:이,가}} 먼저 묶음 하나가 된다."
      en: "On line {{site.line}}, {{pick.3|code}} first becomes one group."
    - ko: "그 묶음의 항목을 왼쪽 이름에 앞에서부터 하나씩 준다."
      en: "Its items are handed to the names on the left, front first."
    - ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 첫 항목을 가리킨다. 개수가 어긋나면 여기서 멈춘다."
      en: "{{pick.2|code}} points at the first item. If the counts differ, it stops here."

rule:
  ko: "<b>푸는 것은 괄호가 아니라 왼쪽의 쉼표다.</b> 개수가 어긋나면 그 자리에서 멈춘다."
  en: "<b>The comma on the left does the splitting, not any bracket.</b> A count mismatch stops the line."
result:
  label:
    ko: "{{site.line}}행 아래의 {{pick.2}}"
    en: "{{pick.2}} below line {{site.line}}"
  value: "{{pick.3}} 의 첫 항목"
  note:
    ko: "개수가 맞을 때만"
    en: "only when the counts match"
ok:
  ko: >-
    {{pick.3|code}}의 항목이 왼쪽 이름들에 앞에서부터 하나씩 들어갔습니다. 이 문법 덕에 임시 이름
    없이 <b>두 값의 자리를 한 줄에서 바꿀</b> 수도 있어요.
  en: >-
    The items of {{pick.3|code}} went into the names on the left, front first. This is also what lets
    <b>two values swap places in one line</b> with no temporary name.
payoff:
  ko: >-
    이걸 알면 「값 두 개를 어떻게 돌려주지」가 풀립니다 — 돌려주는 쪽은 쉼표로 묶고 받는 쪽은
    쉼표로 풉니다. 파이썬에 값 여럿을 돌려주는 문법이 따로 없는 이유예요.
  en: >-
    This answers “how do I hand back two values” — the sending side joins with a comma and the
    receiving side splits with one. That is why Python needs no separate multi-value return.
bridge:
  ko: >-
    오른쪽의 쉼표는 <b>묶는</b> 일이고 왼쪽의 쉼표는 <b>푸는</b> 일입니다. 같은 글자가 자리에 따라
    반대로 굴러서, <code>a, b = b, a</code> 한 줄에 둘이 다 들어 있어요.
  en: >-
    A comma on the right <b>joins</b>; a comma on the left <b>splits</b>. The same character runs
    opposite ways by position, and <code>a, b = b, a</code> holds both in one line.
misconceptions:
  - ko: >-
      괄호가 있어야 풀린다 — 푸는 것은 <b>쉼표</b>입니다. 괄호는 읽기 좋으라고 붙이는 것이고
      없어도 똑같이 풀려요.
    en: >-
      Brackets are needed for splitting — the <b>comma</b> does it. Brackets are for the reader; the
      split works the same without them.
  - ko: >-
      개수가 남으면 그냥 버린다 — <b>그 자리에서 멈춥니다.</b> 남는 것을 받으려면 별을 붙인 이름을
      하나 두어야 해요.
    en: >-
      Extra items are simply dropped — it <b>stops there</b>. To take the leftovers you must put a
      starred name in the list.
  - ko: >-
      별을 붙인 이름은 마지막 하나를 받는다 — <b>남은 것 전부</b>를 목록으로 받습니다. 남은 것이
      없으면 빈 목록이 오고, 그래도 멈추지 않아요.
    en: >-
      A starred name takes the last item — it takes <b>all the leftovers</b> as a list. With nothing
      left it takes an empty list, and still does not stop.

point:
  - q:
      ko: "{{site.line}}행에서 <b>묶여 온 값을 여럿으로 푸는 기호</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the symbol that splits one grouped value into several</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: >-
            {{pick.2|code}}{{pick.2|josa:은,는}} <b>받는 이름 하나</b>입니다. 이름 하나만 있으면 묶음이
            통째로 들어가고, 여럿으로 갈라 주는 것은 그 뒤의 기호예요.
          en: >-
            {{pick.2|code}} is <b>one receiving name</b>. With a single name the whole group goes in;
            what splits it into several is the symbol after it.
        edge:
          h:
            ko: "가장 날카로운 자리 — 통째로와 나눠서"
            en: "The sharpest spot — whole and split"
          code:
            - "pair = (1, 2)      # 통째로"
            - "a, b = (1, 2)      # 나눠서"
      pick.3:
        t:
          ko: >-
            {{pick.3|code}}{{pick.3|josa:은,는}} <b>풀려 나올 값</b>입니다. 오른쪽만으로는 이름이 하나든
            여럿이든 같은 묶음이고, 몇으로 나눌지는 왼쪽이 정해요.
          en: >-
            {{pick.3|code}} is <b>what gets split</b>. The right side is the same group either way;
            how many parts it becomes is decided on the left.
        edge:
          h:
            ko: "가장 날카로운 자리 — 오른쪽과 왼쪽"
            en: "The sharpest spot — the right and the left"
          code:
            - "pair = get()       # 이름 하나"
            - "a, b = get()       # 이름 둘"

meaning:
  - q:
      ko: "{{pick.3|code}}{{pick.3|josa:이,가}} 항목 셋을 내놓는데 왼쪽 이름이 둘이면 어떻게 될까요?"
      en: "If {{pick.3|code}} yields three items but there are two names on the left, what happens?"
    hint:
      ko: "파이썬은 남는 것을 <b>조용히 버리지</b> 않습니다."
      en: "Python does not <b>quietly drop</b> leftovers."
    options:
      - t:
          ko: "그 자리에서 멈추고 개수가 몇 대 몇인지 말해 준다"
          en: "It stops there and says how many were expected against how many arrived"
      - t:
          ko: "앞의 둘만 담기고 셋째는 버려진다"
          en: "The first two are kept and the third is dropped"
        diag:
          t:
            ko: >-
              버리는 것은 <b>사람이 적어야</b> 합니다. 셋째를 안 쓸 생각이면 밑줄 이름으로 받아
              「안 쓴다」를 코드에 남겨요.
            en: >-
              Dropping has to be <b>written out</b>. If the third is unwanted you take it into an
              underscore name so the code says so.
          edge:
            h:
              ko: "가장 날카로운 자리 — 조용한 버림과 적어 둔 버림"
              en: "The sharpest spot — a silent drop and a written one"
            code:
              - "a, b = 1, 2, 3       # 멈춘다"
              - "a, b, _ = 1, 2, 3    # 셋째를 안 쓴다"
      - t:
          ko: "둘째 이름에 남은 둘이 목록으로 들어간다"
          en: "The second name takes the remaining two as a list"
        diag:
          t:
            ko: >-
              남은 것을 모아 받으려면 그 이름 앞에 <b>별</b>을 붙여야 합니다. 별이 없으면 이름 하나가
              항목 하나만 받아요.
            en: >-
              To gather leftovers the name needs a <b>star</b> in front. Without it, one name takes
              exactly one item.
          edge:
            h:
              ko: "가장 날카로운 자리 — 별이 있느냐"
              en: "The sharpest spot — whether the star is there"
            code:
              - "a, b = 1, 2, 3        # 멈춘다"
              - "a, *b = 1, 2, 3       # b 는 [2, 3]"
      - t:
          ko: "셋째 이름이 자동으로 만들어진다"
          en: "A third name is created automatically"
        diag:
          t:
            ko: >-
              이름은 <b>사람이 적은 만큼</b>만 생깁니다. 적지 않은 이름을 파이썬이 지어 내면 그 이름을
              아무도 못 읽어요.
            en: >-
              Names appear only <b>as many as you wrote</b>. A name invented by Python would be one no
              reader could refer to.
          edge:
            h:
              ko: "가장 날카로운 자리 — 적은 만큼만"
              en: "The sharpest spot — only as many as written"
            code:
              - "a, b = 1, 2, 3"
              - "ValueError: too many values to unpack"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 {{pick.3|code}}{{pick.3|josa:을,를}} <b>여럿으로 풀어</b> 담습니다."
      en: >-
        Choose what goes in the blank. Line {{site.line}} <b>splits</b> {{pick.3|code}} across
        several names.
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: ",", mono: true }
      - t: ";"
        mono: true
        diag:
          t:
            ko: >-
              그 기호는 <b>한 줄에 문장 둘</b>을 놓는 자리입니다. 이름을 나열하는 데 쓰이지 않아서
              그 줄은 문법이 안 맞아요.
            en: >-
              That symbol puts <b>two statements on one line</b>. It does not list names, so the line
              does not hold together.
          edge:
            h:
              ko: "가장 날카로운 자리 — 나열과 줄 나누기"
              en: "The sharpest spot — listing and separating statements"
            code:
              - "a, b = pair       # 나열"
              - "a = 1; b = 2      # 문장 둘"
      - t: "="
        mono: true
        diag:
          t:
            ko: >-
              그 기호는 <b>이미 이 줄에</b> 있고, 이름 둘 사이에 하나 더 놓으면 「연달아 같은 값을
              넣는다」가 되어 푸는 일이 안 일어나요.
            en: >-
              That symbol is <b>already on this line</b>. One more between the names would mean
              “put the same value in both,” and no splitting happens.
          edge:
            h:
              ko: "가장 날카로운 자리 — 나누기와 같은 값 넣기"
              en: "The sharpest spot — splitting and putting the same value in"
            code:
              - "a, b = pair       # 나눠 담는다"
              - "a = b = pair      # 둘 다 통째로"
      - t: "&"
        mono: true
        diag:
          t:
            ko: >-
              그 기호는 <b>비트를 겹치는</b> 셈입니다. 왼쪽에 오면 이름이 아니라 계산식이 되어
              담을 자리가 사라져요.
            en: >-
              That symbol <b>overlays bits</b>. On the left it turns the names into a computation, so
              there is no place left to put anything.
          edge:
            h:
              ko: "가장 날카로운 자리 — 이름 자리와 계산식"
              en: "The sharpest spot — a name slot and a computation"
            code:
              - "a, b = pair       # 이름 둘"
              - "a & b = pair      # SyntaxError"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 묶음을 통째로 안 담고 풀어서 담을까요?"
    en: "Why does line {{site.line}} split the group instead of keeping it whole?"
  choices:
    - t:
        ko: "아래에서 각 조각을 따로 쓰기 때문에 — 이름이 붙으면 그 조각이 무엇인지가 코드에 남는다"
        en: "Because the parts are used separately below — naming them records what each part is"
      ok: true
      fb:
        ko: "그 방향입니다. 풀어 담은 이름 중 하나를 아래에서 쓰는 줄을 짚어 보세요."
        en: "That is the direction. Point at a line below that uses one of the split names."
    - t:
        ko: "묶음째로는 못 쓰기 때문에"
        en: "Because a whole group cannot be used"
      ok: false
      fb:
        ko: >-
          묶음째로도 씁니다 — 넘기거나 훑을 수 있어요. 푼 것은 조각마다 <b>다른 뜻</b>이 있어서입니다.
        en: >-
          A whole group can be passed or walked. It was split because each part <b>means something
          different</b>.
    - t:
        ko: "파이썬이 묶음을 오래 들고 있으면 느려져서"
        en: "Because holding a group for long makes Python slow"
      ok: false
      fb:
        ko: >-
          푼다고 묶음이 사라지지 않습니다. 속도를 이유로 대려면 재 봐야 하고, 이 줄은 그 이야기가
          아니에요.
        en: >-
          Splitting does not make the group go away. A speed claim needs a measurement, and this line
          is not about that.

queries:
  - { grammars: [python], file: ./tuple-unpacking.scm }

examples:
  - code: "first, second = pair"
    expect: { sites: 1, form: assign, hole: ",", picks: { 1: ",", 2: "first", 3: "pair" } }
  - code: "for key, value in payload.items():\n    send(key)"
    expect: { sites: 1, form: loop, hole: ",", picks: { 1: ",", 2: "key", 3: "payload.items()" } }
  - code: "head, rest = parts"
    expect: { sites: 1, form: assign, hole: ",", picks: { 1: ",", 2: "head", 3: "parts" } }
  # 오른쪽의 쉼표는 **묶는** 일이라 노드가 다르다 — `py/list-literal` 의 `bare-tuple` 이다.
  - code: "pair = first, second"
    expect: none
  - code: "send(first, second)"
    expect: none
