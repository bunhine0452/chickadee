lang: py
version: 0.1.0
grammars: [python]
# 문법마다 다르다 — tree-sitter-python 0.23.6 의 `parser.c` 가 14 다.
# (예전 주석이 「ts 는 15」라고 적어 뒀는데 그 15 자체가 틀렸다 — typescript·tsx 는 14 다.)
# 대조는 시험이 한다 (`declared_grammar_abi_matches_the_linked_grammar`).
grammar_abi: { python: 14 }

# 확장자 → 문법. 인제스트가 이 표로 파일을 고른다 (03 §2.1).
extensions:
  python: [.py, .pyi]

# 「필수 문법」 — 구멍 지도가 세는 대상이자 위상 정렬 동률 시의 순서다 (03 §6).
#
# **순서는 0부 → 1부다** (`docs/curriculum/py.md` §1.5.4). 앞의 18줄이 0부 「이 언어의 값과 식」
# 이고, 그 안의 배열 규칙이 하나 더 있다 (S5 가 `ts/_lang.yaml` 에 세운 것과 같다):
#
#   **사용처가 얇은 판을 셋 이상 잇대지 않는다.** 얇음의 선은 두 표본 리포(`adelie` py 139 ·
#   `ECC` py 63) 중 **한쪽에서라도 사용처 100곳 미만**이다. 안 그러면 「네 코드엔 없다」만
#   사흘 내리 나오고 D177 규칙 ①(개념마다 내 코드의 자리를 짚는다)이 그동안 한 번도 안 걸린다.
#
# 얇은 열둘(2026-09-05 tree-sitter 실측, adelie / ECC): value-bits 3/4 · integer-limit 2/1 ·
# text-length 311/49 · arithmetic 193/72 · integer-division 10/5 · float-inexact 19/12 ·
# operator-precedence 15/9 · explicit-conversion 213/72 · bool-op-value 59/23 ·
# implicit-conversion 0/0 · is-identity 283/79 · while-loop 15/4. 아래에서 이 열둘은
# 두꺼운 판 사이에 **둘씩** 놓인다 — 셋이 붙는 자리가 한 곳도 없다.
#
# 0부가 축 A~H 를 그대로 따르지 않는 이유가 그 규칙이다. 축은 `py.md` §1.5.1 이 정본이고
# 여기 주석에 축 이름을 남겨 둔다.
essential:
  # ── 0부 「이 언어의 값과 식」 18판 (py.md §1.5.4 — 19판 중 `reference-binding` 은 1부다) ──
  - py/assignment            # 축 G
  - py/number-literal        # 축 A
  - py/value-bits            # 축 A · 얇다
  - py/integer-limit         # 축 A · 얇다 (사용처 3곳 — 합성이 정본이다)
  - py/string-literal        # 축 C
  - py/text-length           # 축 C · 얇다
  - py/arithmetic            # 축 E · 얇다
  - py/f-string              # 축 C
  - py/integer-division      # 축 B · 얇다
  - py/float-inexact         # 축 B · 얇다
  - py/boolean-literal       # 축 D
  - py/operator-precedence   # 축 E · 얇다
  - py/explicit-conversion   # 축 F · 얇다
  - py/truthiness            # 축 D
  - py/bool-op-value         # 축 E · 얇다
  - py/implicit-conversion   # 축 F · 사용처 0곳 — 아래 주석
  - py/comparison            # 축 H
  - py/is-identity           # 축 H · 얇다 (ECC 79곳)
  # ── 1부 「흐름과 묶기」 ──────────────────────────────────────────────────────
  # `py.md` §1.5.4 의 1부는 아홉인데 그중 넷(`none-value`·`for-in`·`call-expression`·`import`)은
  # 아직 저작 전이라 여기 없다. `essential` 은 **있는 개념만** 든다 — 없는 id 를 적으면
  # 린트의 `essential-exists` 가 잡는다.
  #
  # `reference-binding` 이 `list-literal` **뒤**인 것이 D187 ⑰(= `py-learning.md` §11.6 ①)이
  # 시킨 자리다. 별칭은 가변 객체가 있어야 관찰되므로 0부 축 G 에 두면 「관찰할 수 없는 사실을
  # 말로만」 전하게 된다.
  - py/if-statement
  - py/list-literal
  - py/reference-binding
  - py/while-loop            # 얇다 (15/4 — 파이썬에서 반복의 자리는 for-in 이 가져갔다)
  - py/function-definition
  - py/return-statement

# 「AI 가 대신 쓴 것」 — 구멍 개념 ↔ 같은 일을 하는 다른 표기.
#
# **비워 둔다.** 파이썬에서 가장 그럴듯한 짝(`x == True` ↔ `if x:`)이 표본에 **한쪽만** 있다 —
# 두 리포 202파일에서 `== True`·`== False` 가 **0곳**이고 값을 그대로 놓은 자리가 688곳이다
# (`py-learning.md` §11.5). 짝이 부기할 것이 없으면 패널이 빈 줄을 낸다.
# 나머지 후보(`x == None` ↔ `x is None` · 이어 붙이기 ↔ f-문자열)는 present 쪽이
# `py/comparison`·`py/string-literal` 처럼 **너무 넓은 개념**이라, 부기가 「견주기 1,804곳」이
# 되어 짝이 가리키는 것을 못 짚는다. 좁은 개념이 서면 그때 행을 올린다.
alternatives: []

thin_threshold: { min_files: 2, min_sites: 3, small_repo_files: 20 }

# 「네 코드엔 없다」 — 0부에서 사용처가 **0곳**인 판 하나 (D177 규칙 ① · D186 ④).
#
# `py/implicit-conversion` 은 두 표본 202파일에서 캡처가 0곳이다. 없어서 0곳이 아니라
# **정적으로 볼 수 있는 자리가 0곳**이다: 이 개념이 성립하려면 두 피연산자의 타입을 알아야
# 하는데 tree-sitter 도 정규식도 모르므로, 쿼리는 **양쪽이 리터럴로 적힌 식**(`1 + 2.0` ·
# `True + True`)만 잡는다. 실제 코드에서 넓히기는 `total / count` 처럼 양쪽이 이름인 꼴로
# 일어나고 그 이름의 타입은 소스에 없다. `py.md` §1.5.3 이 「실행 없이는 못 재는 개념」으로
# 적어 둔 자리이고, 그러면 사용처 대신 합성이 정본이다.
#
# 사유는 `idiom` 이다 — `scale` 이 아니다. 그 자리를 명시 변환이 가져갔다:
# `py/explicit-conversion` 이 adelie 213곳/59파일 · ECC 72곳/21파일이다.
# `packages/cards/src/t0-synthetic.ts` 의 `ABSENCE` 표에
# `'py/implicit-conversion': 'idiom'` 한 줄이 서야 합성 판이 그 사유를 화면에 말할 수 있다
# (그 파일은 이 사전의 소유가 아니라 오케스트레이터가 넣는다).
#
# 얇은 셋(`value-bits` 7곳/3파일 · `integer-limit` 3/2 · `integer-division` 15/6)은 **부재가
# 아니다** — `thin_threshold`(min_files 2 · min_sites 3)를 셋 다 넘는다. 카드는 서고, 다만
# 위의 배열 규칙이 그 셋을 잇대지 않게 떼어 놓는다.

diag_default:
  point:
    ko: "«{{pick}}»{{pick|josa:은,는}} {{role}} 자리입니다. {{concept}}{{concept|josa:은,는}} «{{answer}}» 입니다. {{rule}}"
    en: "«{{pick}}» is the {{role}} slot. The {{concept}} is «{{answer}}». {{rule}}"
  blank:
    ko: "«{{pick}}»{{pick|josa:은,는}} 이 자리에 오지 않습니다. {{rule}}"
    en: "«{{pick}}» does not go in this slot. {{rule}}"
