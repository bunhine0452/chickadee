schema: 1
id: py/attribute-access
universal: common/member-access
name: { ko: 안의 이름 꺼내기, en: Attribute access }
token: "."
grammars: [python]
framework: null
essential: true
difficulty: 1
prereq: [py/assignment, cs/memory-address]
confusions: []

dict:
  one_liner:
    ko: "값 안에 든 이름 하나를 꺼낸다. 없는 이름이면 그 자리에서 멈춘다."
    en: "Takes one name out of a value. If the name is missing it stops right there."
  why:
    ko: >-
      {{site.line}}행은 {{pick.2|code}} 안에서 {{pick.3|code}}{{pick.3|josa:을,를}} 찾습니다. 없으면
      조용히 「없음」이 되는 것이 아니라 <b>그 자리에서 멈춰요</b> — 그래서 파이썬에는 안전하게
      건너뛰는 기호가 없습니다.
    en: >-
      Line {{site.line}} looks inside {{pick.2|code}} for {{pick.3|code}}. A missing name does not
      quietly become absence; it <b>stops right there</b> — which is why Python has no symbol for
      skipping over safely.
  trace:
    - ko: "{{site.line}}행에서 {{pick.2|code}}{{pick.2|josa:이,가}} 먼저 값이 된다."
      en: "On line {{site.line}}, {{pick.2|code}} becomes a value first."
    - ko: "그 값 안에서 {{pick.3|code}}{{pick.3|josa:을,를}} 찾는다."
      en: "Inside that value, {{pick.3|code}} is looked up."
    - ko: "찾은 것이 {{site.line}}행의 이 자리에 놓인다. 못 찾으면 여기서 멈춘다."
      en: "What is found lands in this spot on line {{site.line}}. If nothing is found, it stops here."

rule:
  ko: "<b>없는 이름은 조용히 넘어가지 않는다.</b> 그 자리에서 멈추고, 어느 이름이 없었는지 말한다."
  en: "<b>A missing name is never skipped quietly.</b> It stops there and says which name was missing."
result:
  label:
    ko: "{{site.line}}행의 {{pick.2}} 안"
    en: "inside {{pick.2}} on line {{site.line}}"
  value: "{{pick.3}}"
  note:
    ko: "없으면 값이 아니라 멈춤"
    en: "if absent, not a value but a stop"
ok:
  ko: >-
    {{pick.2|code}} 안의 {{pick.3|code}}{{pick.3|josa:이,가}} 여기에 놓입니다. 같은 기호가
    <b>읽기와 만들기</b>를 둘 다 하는데, 왼쪽에 오면 그 자리에서 새로 만들어져요.
  en: >-
    The {{pick.3|code}} inside {{pick.2|code}} lands in this spot. The same symbol does <b>reading
    and making</b>; on the left of a putting line it makes the name right there.
payoff:
  ko: >-
    이걸 알면 「어디서 멈춘 건지」가 빨라집니다 — 멈춤이 말하는 이름은 <b>점 오른쪽</b>이고,
    없는 것은 점 왼쪽 값의 종류예요.
  en: >-
    This makes “where did it stop” faster to answer — the name in the message is the one <b>on the
    right of the dot</b>, and what is really missing is the kind of value on the left.
bridge:
  ko: >-
    자바스크립트는 없는 이름을 조용히 「없음」으로 돌려주고, 그래서 뒤늦게 엉뚱한 데서 터집니다.
    파이썬은 그 자리에서 멈추므로 <b>터진 줄과 원인 줄이 같아요.</b>
  en: >-
    JavaScript hands back absence for a missing name, so the failure shows up later somewhere else.
    Python stops on the spot, so <b>the failing line and the causing line are the same</b>.
misconceptions:
  - ko: >-
      없는 이름을 꺼내면 「없음」이 나온다 — 그 자리에서 <b>멈춥니다</b>. 없어도 되는 자리라면
      기본값을 주는 함수를 따로 씁니다.
    en: >-
      Taking a missing name yields absence — it <b>stops</b>. Where absence is acceptable you call a
      function that supplies a default instead.
  # py-learning.md §11.4 — `RightToLeftChaining`.
  - ko: >-
      점이 이어지면 오른쪽부터 읽는다 — <b>왼쪽부터</b>입니다. 왼쪽이 값이 되어야 그 안을 볼 수
      있어서, 이어진 점은 언제나 앞에서 뒤로 풀려요.
    en: >-
      A chain of dots reads right to left — it reads <b>left to right</b>. The left has to become a
      value before anything can be looked up inside it.
  - ko: >-
      왼쪽에 적어도 읽기만 한다 — 넣는 줄의 왼쪽에 오면 그 이름을 <b>그 자리에서 만듭니다</b>.
      파이썬 클래스에 속성을 미리 적어 두는 자리가 없는 이유예요.
    en: >-
      On the left it still only reads — on the left of a putting line it <b>makes</b> the name right
      there. That is why a Python class has no place to declare attributes ahead of time.

point:
  - q:
      ko: "{{site.line}}행에서 <b>{{pick.2|code}} 안을 들여다보게 하는 기호</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the symbol that looks inside {{pick.2|code}}</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: >-
            {{pick.2|code}}{{pick.2|josa:은,는}} <b>들여다볼 대상</b>입니다. 대상만으로는 안을 못 보고,
            그 안으로 들어가라고 말하는 기호가 뒤에 붙어요.
          en: >-
            {{pick.2|code}} is <b>what gets looked into</b>. On its own it shows nothing inside; a
            symbol after it says to go in.
        edge:
          h:
            ko: "가장 날카로운 자리 — 대상과 들여다보기"
            en: "The sharpest spot — the thing and the looking in"
          code:
            - "res                # 값 하나"
            - "res.status_code    # 안의 이름"
      pick.3:
        t:
          ko: >-
            {{pick.3|code}}{{pick.3|josa:은,는}} <b>찾을 이름</b>입니다. 이름만 따로 적으면 바깥에서
            그 이름을 찾게 되고, 안을 보라고 말하는 것은 그 앞의 기호예요.
          en: >-
            {{pick.3|code}} is <b>the name to look for</b>. Written alone it would be looked up
            outside; the symbol before it is what says to look inside.
        edge:
          h:
            ko: "가장 날카로운 자리 — 바깥 이름과 안의 이름"
            en: "The sharpest spot — an outer name and an inner one"
          code:
            - "status_code        # 바깥에서 찾는다"
            - "res.status_code    # res 안에서 찾는다"

meaning:
  - q:
      ko: "{{pick.2|code}} 안에 {{pick.3|code}} 라는 이름이 없으면 {{site.line}}행은 어떻게 될까요?"
      en: "If {{pick.2|code}} has no name called {{pick.3|code}}, what happens on line {{site.line}}?"
    hint:
      ko: "파이썬에는 안전하게 건너뛰는 기호가 <b>없습니다</b>."
      en: "Python has <b>no</b> symbol for skipping over safely."
    options:
      - t:
          ko: "그 자리에서 멈추고 없는 이름을 말해 준다"
          en: "It stops right there and names the missing name"
      - t:
          ko: "「없음」이 되어 다음 줄로 넘어간다"
          en: "It becomes absence and moves to the next line"
        diag:
          t:
            ko: >-
              그것은 없음이 <b>둘</b>인 언어의 행동입니다. 파이썬이 그렇게 안 하는 덕에 멈춘 줄이 곧
              원인 줄이 되고, 대신 없어도 되는 자리는 사람이 적어야 해요.
            en: >-
              That is how a language with <b>two</b> absent values behaves. Python does not, so the
              stopping line is the causing line — and you must write out where absence is allowed.
          edge:
            h:
              ko: "가장 날카로운 자리 — 멈춤과 조용한 없음"
              en: "The sharpest spot — a stop and a quiet absence"
            code:
              - "res.missing            # 멈춘다"
              - "getattr(res, 'missing', None)   # 없음이 온다"
      - t:
          ko: "그 이름이 새로 만들어지고 「없음」이 담긴다"
          en: "The name is made and absence is put into it"
        diag:
          t:
            ko: >-
              새로 만드는 것은 <b>넣는 줄의 왼쪽</b>에 왔을 때뿐입니다. 읽는 자리에서는 찾기만 하고,
              못 찾으면 거기서 끝나요.
            en: >-
              Making happens only on <b>the left of a putting line</b>. In a reading spot it only
              looks, and a look that finds nothing ends there.
          edge:
            h:
              ko: "가장 날카로운 자리 — 읽는 자리와 넣는 자리"
              en: "The sharpest spot — reading and putting"
            code:
              - "res.tag = 1     # 여기서 만들어진다"
              - "res.tag         # 없으면 멈춘다"
      - t:
          ko: "이름이 비슷한 다른 것을 대신 준다"
          en: "It hands back something with a similar name"
        diag:
          t:
            ko: >-
              대신 주는 일은 <b>없습니다.</b> 멈추면서 비슷한 이름을 <b>제안</b>하는 문구가 붙을 수는
              있지만, 값으로 오는 것은 없어요.
            en: >-
              Nothing is handed back <b>in its place</b>. The stop message may <b>suggest</b> a
              similar name, but no value arrives.
          edge:
            h:
              ko: "가장 날카로운 자리 — 제안과 값"
              en: "The sharpest spot — a suggestion and a value"
            code:
              - "res.stat_code"
              - "AttributeError: … Did you mean: 'status_code'?"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 {{pick.2|code}} <b>안의</b> {{pick.3|code}}{{pick.3|josa:을,를}} 꺼냅니다."
      en: >-
        Choose what goes in the blank. Line {{site.line}} takes {{pick.3|code}} from
        <b>inside</b> {{pick.2|code}}.
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: ".", mono: true }
      - t: "->"
        mono: true
        diag:
          t:
            ko: >-
              그 기호는 <b>주소를 따라 들어가는</b> 언어의 것입니다. 파이썬에는 주소를 직접 다루는
              문법이 없어서, 안을 보는 기호도 하나뿐이에요.
            en: >-
              That symbol belongs to languages where you <b>follow an address</b>. Python has no
              syntax for addresses, so it has just one symbol for looking inside.
          edge:
            h:
              ko: "가장 날카로운 자리 — 기호가 하나냐 둘이냐"
              en: "The sharpest spot — one symbol or two"
            code:
              - "res.status_code    # 파이썬은 이 하나"
              - "p->field           # C 는 둘로 갈린다"
      - t: "::"
        mono: true
        diag:
          t:
            ko: >-
              그 기호는 <b>이름 공간</b>을 가르는 자리입니다. 값 안을 보는 것이 아니라 어느 묶음에
              속한 이름인지를 적는 것이라, 여기서는 문법이 안 맞아요.
            en: >-
              That symbol separates <b>name spaces</b>. It says which group a name belongs to rather
              than looking inside a value, so the line does not hold together here.
          edge:
            h:
              ko: "가장 날카로운 자리 — 값 안과 이름 공간"
              en: "The sharpest spot — inside a value and inside a namespace"
            code:
              - "res.status_code    # 값 안"
              - "std::string        # 이름 공간"
      - t: "?."
        mono: true
        diag:
          t:
            ko: >-
              그 기호는 <b>없으면 건너뛰라</b>는 뜻인데 파이썬에 없습니다. 없어도 되는 자리는 조건을
              사람이 적어야 하고, 그것이 이 언어가 고른 쪽이에요.
            en: >-
              That symbol means <b>skip if absent</b>, and Python does not have it. Where absence is
              allowed you write the check yourself — that is the choice this language made.
          edge:
            h:
              ko: "가장 날카로운 자리 — 건너뛰기와 적어 두기"
              en: "The sharpest spot — skipping and writing it out"
            code:
              - "res?.status_code       # 파이썬에 없다"
              - "res.status_code if res else None"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 {{pick.3|code}}{{pick.3|josa:을,를}} 바깥이 아니라 {{pick.2|code}} 안에서 찾을까요?"
    en: "Why does line {{site.line}} look for {{pick.3|code}} inside {{pick.2|code}} rather than outside?"
  choices:
    - t:
        ko: "그 값에 딸린 것이라서 — 같은 이름이 다른 값 안에도 따로 있을 수 있다"
        en: "Because it belongs to that value — the same name can live inside other values too"
      ok: true
      fb:
        ko: "그 방향입니다. 같은 이름이 다른 값에도 붙는 자리가 이 파일에 있는지 찾아보세요."
        en: "That is the direction. Look for another value in this file carrying the same name."
    - t:
        ko: "바깥에 그 이름이 없어서"
        en: "Because the name does not exist outside"
      ok: false
      fb:
        ko: >-
          바깥에 같은 이름이 있어도 이 줄은 안을 봅니다. 어디를 볼지는 있고 없고가 아니라
          <b>적힌 모양</b>이 정해요.
        en: >-
          Even with the same name outside, this line looks inside. Where to look is decided by
          <b>how the line is written</b>, not by what exists.
    - t:
        ko: "안에서 찾는 것이 더 빨라서"
        en: "Because looking inside is faster"
      ok: false
      fb:
        ko: >-
          속도는 이 줄의 이유가 아닙니다. 재 보지 않고 「빠르다」를 이유로 대면 다음 줄에서 같은
          근거가 안 서요.
        en: >-
          Speed is not what this line is about. Calling it faster without measuring leaves you with
          no reason at the next line.

queries:
  - { grammars: [python], file: ./attribute-access.scm }

examples:
  - code: "code = res.status_code"
    expect: { sites: 1, form: read, hole: ".", picks: { 1: ".", 2: "res", 3: "status_code" } }
  - code: "self.name = name"
    expect: { sites: 1, form: read, hole: ".", picks: { 1: ".", 2: "self", 3: "name" } }
  # 이어진 점은 **안쪽 하나**만 사용처다 — `object:` 에서 `(attribute)` 를 뺀 자리가 여기서 보인다.
  - code: "raw = res.body.text"
    expect: { sites: 1, form: read, hole: ".", picks: { 1: ".", 2: "res", 3: "body" } }
  - code: "code = status_code"
    expect: none
  - code: "value = data[\"name\"]"
    expect: none
