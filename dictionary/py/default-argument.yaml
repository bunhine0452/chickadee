schema: 1
id: py/default-argument
universal: null
name: { ko: 안 넘기면 쓸 값, en: Default argument }
token: "="
grammars: [python]
framework: null
essential: true
difficulty: 3
prereq: [py/function-definition, py/none-value, cs/immutability]
confusions: []

dict:
  one_liner:
    ko: "안 넘겼을 때 쓸 값을 정의하는 줄에 적어 둔다. 그 값은 정의할 때 딱 한 번 만들어진다."
    en: "Records what to use when nothing is passed. It is built once, at definition."
  why:
    ko: >-
      {{site.line}}행의 {{pick.3|code}}{{pick.3|josa:은,는}} 부를 때마다 새로 만들어지지 <b>않습니다.</b>
      정의할 때 한 번 만들어져 함수에 매달려 있고, 그래서 {{pick.2|code}} 자리에 고칠 수 있는 값을
      두면 호출 사이에 <b>그 고침이 남아요</b>.
    en: >-
      {{pick.3|code}} on line {{site.line}} is <b>not</b> rebuilt on every call. It is built once at
      definition and hangs off the function, so putting a changeable value in the {{pick.2|code}}
      slot means <b>edits survive between calls</b>.
  trace:
    - ko: "{{site.line}}행이 도는 순간 {{pick.3|code}}{{pick.3|josa:이,가}} 한 번 만들어진다."
      en: "As line {{site.line}} runs, {{pick.3|code}} is built once."
    - ko: "그 값이 함수에 매달린다 — 함수보다 오래 산다."
      en: "That value hangs off the function — it outlives any single call."
    - ko: "{{pick.2|code}}{{pick.2|josa:을,를}} 안 넘긴 호출은 <b>그때 만든 그 값</b>을 그대로 받는다."
      en: "A call that omits {{pick.2|code}} receives <b>that very value</b>, unchanged."

rule:
  ko: "<b>정의할 때 한 번 만들어지고 함수에 매달린다.</b> 부를 때마다 새로 만들어지지 않는다."
  en: "<b>Built once at definition and kept on the function.</b> It is not rebuilt per call."
result:
  label:
    ko: "{{site.line}}행의 {{pick.2}}"
    en: "{{pick.2}} on line {{site.line}}"
  value: "{{pick.3}}"
  note:
    ko: "호출 사이에 살아남는다"
    en: "it survives between calls"
ok:
  ko: >-
    {{pick.2|code}}{{pick.2|josa:을,를}} 안 넘겨도 함수가 돕니다. 다만 그 자리의 값은 <b>모든 호출이
    같은 하나</b>를 쓰므로, 고칠 수 있는 값을 두면 자국이 쌓여요.
  en: >-
    The function runs even without {{pick.2|code}}. But <b>every call shares one</b> value in that
    slot, so a changeable value there accumulates marks.
payoff:
  ko: >-
    이걸 알면 파이썬 코드에 <code>= None</code> 이 왜 그렇게 많은지가 풀립니다 — 빈 목록·빈 사전을
    그 자리에 못 두니까, 없음을 두고 <b>몸통 첫 줄에서 새로 만드는</b> 관용구가 굳었어요.
  en: >-
    This explains why <code>= None</code> is everywhere in Python — an empty list or mapping cannot
    sit in that slot, so the habit is to put absence there and <b>build a fresh one on the body's
    first line</b>.
bridge:
  ko: >-
    자바스크립트는 같은 자리를 <b>부를 때마다</b> 계산합니다. 같은 모양의 코드가 두 언어에서
    다르게 굴고, 그래서 여기서는 그 자리에 고칠 수 있는 값을 안 둡니다.
  en: >-
    JavaScript evaluates the same slot <b>on every call</b>. The same-looking code behaves
    differently in the two languages, which is why changeable values stay out of that slot here.
misconceptions:
  # py.md §9 #2 — 공식 튜토리얼 「Default Argument Values」.
  - ko: >-
      빈 목록을 그 자리에 두면 부를 때마다 새로 생긴다 — <b>한 번만</b> 생겨서 호출 사이에 남습니다.
      쌓이는 것이 그 증거예요.
    en: >-
      An empty list in that slot is fresh on every call — it is made <b>once</b> and survives between
      calls. The piling up is the proof.
  - ko: >-
      순서를 아무렇게나 적어도 된다 — 값이 적힌 매개변수 뒤에 안 적힌 것이 오면 <b>정의하는 줄에서</b>
      멈춥니다. 부르기 전에 걸려요.
    en: >-
      The order is free — a parameter without a value after one with a value stops <b>at the defining
      line</b>. It is caught before any call.
  - ko: >-
      그 값은 부르는 쪽이 정한다 — <b>정의하는 쪽</b>이 정합니다. 부르는 쪽이 하는 일은 그 값을
      쓸지 말지뿐이에요.
    en: >-
      The caller decides that value — the <b>definition</b> decides it. All a caller does is choose
      whether to use it.

point:
  - q:
      ko: "{{site.line}}행에서 <b>안 넘겼을 때 쓸 값을 붙이는 기호</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the symbol that attaches the value used when nothing is passed</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: >-
            {{pick.2|code}}{{pick.2|josa:은,는}} <b>매개변수 이름</b>입니다. 이름만 있으면 반드시 넘겨야
            하는 자리이고, 안 넘겨도 되게 만드는 것은 그 뒤의 기호예요.
          en: >-
            {{pick.2|code}} is <b>the parameter's name</b>. A bare name must be supplied on every
            call; what makes it optional is the symbol after it.
        edge:
          h:
            ko: "가장 날카로운 자리 — 반드시와 안 넘겨도"
            en: "The sharpest spot — required and optional"
          code:
            - "def f(limit): ...       # 반드시"
            - "def f(limit=10): ...    # 안 넘겨도"
      pick.3:
        t:
          ko: >-
            {{pick.3|code}}{{pick.3|josa:은,는}} <b>쓸 값</b>입니다. 값만 따로 두면 그냥 값 하나이고,
            그것을 매개변수에 매다는 일은 그 앞의 기호가 해요.
          en: >-
            {{pick.3|code}} is <b>the value to use</b>. Alone it is just a value; the symbol before it
            is what hangs it on the parameter.
        edge:
          h:
            ko: "가장 날카로운 자리 — 값과 매다는 일"
            en: "The sharpest spot — the value and the attaching"
          code:
            - "10                      # 값 하나"
            - "def f(limit=10): ...    # 매달렸다"

meaning:
  - q:
      ko: "{{pick.3|code}} 자리에 빈 목록을 두고 그 함수를 두 번 부르면 어떻게 될까요?"
      en: "If an empty list sits in the {{pick.3|code}} slot and the function is called twice, what happens?"
    hint:
      ko: "그 값이 <b>언제</b> 만들어지는지가 답을 정합니다."
      en: "The answer turns on <b>when</b> that value is built."
    options:
      - t:
          ko: "두 번째 호출에 첫 번째의 자국이 남아 있다"
          en: "The second call sees what the first one left behind"
      - t:
          ko: "부를 때마다 빈 목록이 새로 생긴다"
          en: "A fresh empty list appears on every call"
        diag:
          t:
            ko: >-
              그것은 <b>자바스크립트</b>의 행동입니다. 파이썬은 정의할 때 한 번 만들어 함수에
              매달아 두므로, 같은 목록이 계속 옵니다.
            en: >-
              That is <b>JavaScript's</b> behaviour. Python builds it once at definition and hangs it
              on the function, so the same list keeps arriving.
          edge:
            h:
              ko: "가장 날카로운 자리 — 정의할 때와 부를 때"
              en: "The sharpest spot — at definition and at call"
            code:
              - "def f(xs=[]): xs.append(1); return xs"
              - "f(); f()      # [1, 1]"
      - t:
          ko: "두 번째 호출에서 멈춘다"
          en: "The second call stops"
        diag:
          t:
            ko: >-
              멈추지 <b>않습니다.</b> 목록에 값이 쌓이는 것은 멀쩡한 일이라, 아무 신호 없이 결과만
              달라져요 — 그래서 찾기 어려운 함정입니다.
            en: >-
              It does <b>not</b> stop. A list growing is perfectly normal, so the result changes with
              no signal at all — which is what makes this hard to find.
          edge:
            h:
              ko: "가장 날카로운 자리 — 조용히 달라지는 결과"
              en: "The sharpest spot — a silently different result"
            code:
              - "f()      # [1]"
              - "f()      # [1, 1]"
      - t:
          ko: "정의하는 줄에서 멈춘다"
          en: "The defining line stops"
        diag:
          t:
            ko: >-
              정의는 <b>통과합니다.</b> 파이썬은 그 자리에 무엇을 두든 막지 않고, 그래서 이 함정을
              막아 주는 것은 문법이 아니라 사람의 습관이에요.
            en: >-
              The definition <b>passes</b>. Python does not block anything in that slot, so what
              prevents this trap is habit rather than grammar.
          edge:
            h:
              ko: "가장 날카로운 자리 — 막아 주는 것이 없다"
              en: "The sharpest spot — nothing blocks it"
            code:
              - "def f(xs=[]): ...     # 통과한다"
              - "def f(xs=None): ...   # 관용구"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 {{pick.2|code}}{{pick.2|josa:을,를}} <b>안 넘겨도</b> 되게 합니다."
      en: >-
        Choose what goes in the blank. Line {{site.line}} makes {{pick.2|code}} <b>optional</b> at
        the call.
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "=", mono: true }
      - t: ":"
        mono: true
        diag:
          t:
            ko: >-
              그 기호는 <b>종류</b>를 적는 자리입니다. 종류를 적어도 안 넘겨도 되는 것은 아니고,
              그 매개변수는 여전히 반드시 넘겨야 해요.
            en: >-
              That symbol writes a <b>kind</b>. Writing a kind does not make the parameter optional;
              it must still be supplied.
          edge:
            h:
              ko: "가장 날카로운 자리 — 종류 적기와 값 매달기"
              en: "The sharpest spot — noting a kind and attaching a value"
            code:
              - "def f(limit: int): ...     # 반드시"
              - "def f(limit=10): ...       # 안 넘겨도"
      - t: "=="
        mono: true
        diag:
          t:
            ko: >-
              기호 둘짜리는 <b>견주기</b>라 값을 매달지 않습니다. 매개변수 자리에 견주기가 오면
              문법이 안 맞아 정의하는 줄에서 멈춰요.
            en: >-
              The two-symbol form <b>weighs</b> rather than attaches. A comparison in a parameter slot
              does not hold together, and the defining line stops.
          edge:
            h:
              ko: "가장 날카로운 자리 — 매달기와 견주기"
              en: "The sharpest spot — attaching and weighing"
            code:
              - "def f(limit=10): ..."
              - "def f(limit==10): ...      # SyntaxError"
      - t: "?"
        mono: true
        diag:
          t:
            ko: >-
              그 기호는 <b>다른 언어</b>에서 「없어도 된다」를 적는 자리입니다. 파이썬에는 그 문법이
              없고, 안 넘겨도 되게 하려면 쓸 값을 실제로 적어야 해요.
            en: >-
              That symbol marks “may be absent” in <b>other languages</b>. Python has no such form; to
              make a parameter optional you write the value it should use.
          edge:
            h:
              ko: "가장 날카로운 자리 — 없어도 됨과 쓸 값"
              en: "The sharpest spot — may-be-absent and a value to use"
            code:
              - "def f(limit=None): ...     # 파이썬"
              - "function f(limit?) { }     # 다른 언어"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 {{pick.2|code}}{{pick.2|josa:을,를}} 반드시 받지 않고 값을 적어 두었을까요?"
    en: "Why does line {{site.line}} record a value instead of requiring {{pick.2|code}}?"
  choices:
    - t:
        ko: "부르는 쪽 대부분이 같은 값을 넘길 것이라 — 그 값을 한자리에 적어 두면 부르는 줄이 짧아진다"
        en: "Because most callers would pass the same value — recording it once shortens every call"
      ok: true
      fb:
        ko: "그 방향입니다. 이 함수를 그 값 없이 부르는 줄이 어디인지도 짚어 보세요."
        en: "That is the direction. Point also at a line that calls this function without that value."
    - t:
        ko: "그 매개변수가 없어도 되는 것이라서"
        en: "Because that parameter is not needed"
      ok: false
      fb:
        ko: >-
          안 넘겨도 몸통은 그 자리를 <b>씁니다.</b> 없어도 되는 것이 아니라 <b>기본으로 쓸 값이
          정해져 있는</b> 것이에요.
        en: >-
          The body still <b>uses</b> that slot when nothing is passed. It is not unneeded; it has a
          <b>value settled in advance</b>.
    - t:
        ko: "파이썬이 매개변수 개수를 안 세서"
        en: "Because Python does not count parameters"
      ok: false
      fb:
        ko: >-
          셉니다 — 개수가 안 맞으면 부르는 줄에서 멈춰요. 이 줄은 그 셈에서 한 자리를
          <b>안 세도 되게</b> 만든 것입니다.
        en: >-
          It does count — a mismatch stops the calling line. This line makes one slot
          <b>excusable</b> from that count.

queries:
  - { grammars: [python], file: ./default-argument.scm }

examples:
  - code: "def fetch(limit=10):\n    return limit"
    expect: { sites: 1, form: default, hole: "=", picks: { 1: "=", 2: "limit", 3: "10" } }
  - code: "def fetch(limit: int = 10):\n    return limit"
    expect: { sites: 1, form: typed, hole: "=", picks: { 1: "=", 2: "limit", 3: "10" } }
  - code: "def fetch(rows=None):\n    return rows"
    expect: { sites: 1, form: default, hole: "=", picks: { 1: "=", 2: "rows", 3: "None" } }
  # 부르는 쪽의 이름 인자는 노드가 다르다(`keyword_argument`) — 정의하는 줄만 잡는다.
  - code: "fetch(limit=10)"
    expect: none
  - code: "def fetch(limit):\n    return limit"
    expect: none
