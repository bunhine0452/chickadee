# 개념 이름 ko→en 용어집 (D118 · 플랜 i18n-dict-review).
#
# 이 표를 먼저 확정하고, 57 YAML 의 나머지 산문을 여기에 고정해 번역한다. 사람이 보는
# 지점을 표 하나로 줄이면서, 같은 개념이 파일마다 다른 영단어로 나가는 것을 막는다.
#
# **확정본이다**(사용자 2026-09-04). 초안의 `en` 값은 55개 개념 YAML 의 `name.en` 을 모은
# 것이었고, 아래 `rules` 세 줄이 그중 다섯 개를 고쳤다 — 고친 것은 해당 YAML 의 `name.en`
# 에도 반영해 두었다. 이 파일 자체는 사전 로더가 읽지 않는다 (개념 파일은
# `dictionary/<lang>/` 아래에만 있다).
#
# 산문 번역은 `en` 열의 낱말을 그대로 쓴다. 예를 들어 `ts/optional-chaining` 의 본문에서
# 그 개념을 가리킬 때는 "optional chaining" 이지 "safe navigation" 이 아니다.

version: 1
status: confirmed   # 사용자 확정 2026-09-04

# ── 확정된 규칙 셋 ────────────────────────────────────────────────────────
# 번역은 이 셋을 어기지 않는다. 새 개념을 더할 때도 같다.
rules:
  - id: universal-plain
    rule: |
      보편 개념(`common/**`)의 en 이름은 **평이한 설명**이고, 언어 개념의 en 이름은
      **그 언어의 기술 용어**다. 둘이 같은 낱말이 되면 화면에서 두 개념이 한 이름으로
      보이고 개념 전이(03 §3.1)의 근거가 흐려진다.
    applied:
      # ko 가 이미 이렇게 갈라 두었으므로 en 을 거기에 맞췄다.
      - common/function-call:  "Function call"  → "Calling a function"
      - common/generics:       "Generics"       → "Type placeholders"
      - common/number-literal: "Number literal" → "Number value"
      # 겹치지는 않았지만 같은 규칙에서 혼자 벗어나 있었다.
      - common/text-literal:   "Text literal"   → "Text value"
  - id: keyword-case
    rule: |
      이름이 코드 키워드로 시작하면 **그 키워드의 대소문자를 따른다**
      (`const declaration` · `for…of loop` · `try and catch` · `async and await` ·
      `undefined and null`). 보편 개념 이름에는 키워드를 쓰지 않는다 — 보편 쪽은
      언어를 가리키지 않아야 하기 때문이다.
    applied:
      - common/try-catch: "Try and catch" → "Catching failures"
  - id: universal-pairs
    rule: |
      보편/언어 짝이 **일부러 다른 이름**을 쓰는 24쌍은 의도된 것이다
      (`Safe navigation` ↔ `Optional chaining`, `Callback chain` ↔
      `Promise chain with .then` …). 짝은 아래 표의 `universal` 열이 보여 준다.
      짝끼리 이름을 맞추지 않는다 — 맞추면 첫 규칙의 충돌이 24건이 된다.

