# 개념 이름 ko→en 용어집 (D118 · 플랜 i18n-dict-review).
#
# 이 표를 먼저 확정하고, 57 YAML 의 나머지 산문을 여기에 고정해 번역한다. 사람이 보는
# 지점을 표 하나로 줄이면서, 같은 개념이 파일마다 다른 영단어로 나가는 것을 막는다.
#
# **초안이다.** `en` 값은 이미 55개 개념 YAML 의 `name.en` 에 들어 있던 것을 그대로 모은
# 것이지 새로 지은 것이 아니다. 사용자가 확정하면 `status: confirmed` 로 바꾸고, 고친
# 항목은 해당 YAML 의 `name.en` 에도 같이 반영한다 — 이 파일은 사전 로더가 읽지 않는다
# (개념 파일은 `dictionary/<lang>/` 아래에만 있다).
#
# 정하고 나서: 산문 번역은 `en` 열의 낱말을 그대로 쓴다. 예를 들어 `ts/optional-chaining`
# 의 본문에서 그 개념을 가리킬 때는 "optional chaining" 이지 "safe navigation" 이 아니다.

version: 0
status: draft

# ── 사용자가 정할 것 ───────────────────────────────────────────────────────
decide:
  - what: 보편 개념과 언어 개념이 en 에서 같은 이름이 된 셋
    why: |
      ko 는 둘을 구분한다 — 「함수 부르기」(보편)와 「함수 호출」(TS) 처럼. en 이 같으면
      화면에서 두 개념이 한 이름으로 보이고, 개념 전이(03 §3.1)의 근거가 흐려진다.
    rows:
      - en: "Function call"
        ids: [common/function-call, ts/call-expression]
        # common/function-call 의 ko 는 "함수 부르기"
        # ts/call-expression 의 ko 는 "함수 호출"
      - en: "Generics"
        ids: [common/generics, ts/generics]
        # common/generics 의 ko 는 "타입 자리 비워 두기"
        # ts/generics 의 ko 는 "제네릭"
      - en: "Number literal"
        ids: [common/number-literal, ts/number-literal]
        # common/number-literal 의 ko 는 "숫자 값"
        # ts/number-literal 의 ko 는 "숫자 리터럴"
  - what: 키워드로 시작하는 이름의 대소문자
    why: |
      `const declaration` · `for…of loop` · `try and catch` · `async and await` ·
      `undefined and null` 다섯은 소문자로 시작한다 — 코드 키워드라서다. 그런데 보편 쪽
      `common/try-catch` 는 `Try and catch` 로 대문자다. 둘 중 하나로 맞출지, 「키워드로
      시작하면 소문자」를 규칙으로 둘지 정한다.
  - what: 보편 개념과 언어 개념이 일부러 다른 이름을 쓰는 자리
    why: |
      `common/optional-chaining` 은 `Safe navigation`, `ts/optional-chaining` 은
      `Optional chaining` 이다. 보편 이름은 언어를 안 가리키고 언어 이름은 그 언어의
      문법을 가리키므로 다른 것이 맞다 — 다만 이것이 의도인지 확인한다. 아래 표의
      `universal` 열이 짝을 보여 준다.

