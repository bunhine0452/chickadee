schema: 1
id: spring/transaction-propagation
universal: null
name: { ko: "이미 열린 트랜잭션을 만났을 때", en: "Transaction propagation" }
token: null
grammars: []
framework: spring
# 짚을 노드가 없다 — 전파는 실행 중에 정해진다 (D176). 창은 자바 개념에서 빌린다 (D157 ②).
track_default: t0
essential: false
difficulty: 5
prereq: [spring/proxy-and-aop, cs/transaction-isolation]
confusions: [spring/connection-and-tx-boundary]
queries: []
dict:
  one_liner:
    ko: "트랜잭션이 이미 열려 있을 때 어떻게 할지를 정하는 값이다."
    en: "It decides what to do when a transaction is already open."
  why:
    ko: >-
      트랜잭션이 걸린 메서드가 또 다른 트랜잭션 메서드를 부르면 트랜잭션이 두 개가 되는 걸까요.
      기본값은 <b>아니오</b>입니다 — 이미 열린 것에 그냥 참여하고, 안쪽에서 되돌려도 바깥까지 같이
      되돌아갑니다. <code>REQUIRES_NEW</code> 는 그 기본값을 바꿔 <b>따로 하나를 더 여는</b> 설정이고,
      안쪽이 실패해도 바깥은 남습니다. 여기에 함정이 하나 있어요. 이 설정을 읽는 것은
      <b>프록시</b>인데, 같은 클래스 안에서 <code>this</code> 로 부르면 프록시를 안 지납니다.
      그러면 이 값은 <b>아무 일도 하지 않고</b> 바깥 트랜잭션에 그대로 참여합니다.
    en: >-
      When a transactional method calls another transactional method, are there two transactions?
      By default <b>no</b> — the inner one joins what is already open, and a rollback inside rolls
      back the outside too. <code>REQUIRES_NEW</code> changes that default and <b>opens a separate
      one</b>, so a failure inside leaves the outside standing. There is a trap. The setting is read
      by the <b>proxy</b>, and a call on <code>this</code> inside the same class never reaches the
      proxy. Then the setting <b>does nothing</b> and the call joins the outer transaction.
  trace: []
rule:
  ko: "<b>전파는 부르는 자리가 정한다.</b> 같은 클래스에서 부르면 적어 둔 값이 안 읽힌다."
  en: "<b>Propagation depends on the call site.</b> A call inside the same class never reads the setting."
ok:
  ko: >-
    다른 빈이 이 메서드를 부르면 프록시를 지나므로 적어 둔 전파 값이 읽힙니다.
    <code>REQUIRES_NEW</code> 면 바깥과 별개인 트랜잭션이 하나 더 열립니다.
  en: >-
    When another bean calls this method the call passes the proxy, so the propagation setting is
    read. With <code>REQUIRES_NEW</code> a second transaction opens, separate from the outer one.
misconceptions:
  - ko: "애너테이션은 명령이다 — 표시일 뿐이라 프록시를 안 지나면 아무 일도 안 합니다."
    en: "An annotation is a command — it is a mark, and does nothing when the proxy is skipped."
  - ko: "적어 두었으니 언제나 새 트랜잭션이 열린다 — 부르는 자리가 같은 클래스면 안 열립니다."
    en: "It is written down, so a new transaction always opens — not when the caller is the same class."
  - ko: "안쪽에서 되돌리면 안쪽만 되돌아간다 — 기본값에서는 바깥까지 함께 되돌아갑니다."
    en: "A rollback inside rolls back only the inside — by default it takes the outside with it."
  - ko: "메서드마다 트랜잭션이 하나씩 생긴다 — 기본값은 이미 열린 것에 참여하는 쪽입니다."
    en: "Each method gets its own transaction — the default is to join the one already open."
evidence: ["Propagation.", "REQUIRES_NEW", "propagation =", "PROPAGATION_", "NESTED"]
meaning:
  - q:
      ko: "<code>REQUIRES_NEW</code> 를 적은 메서드를 <b>같은 클래스 안에서</b> 불렀습니다. 무슨 일이 일어나나요?"
      en: "A method marked <code>REQUIRES_NEW</code> is called <b>from inside the same class</b>. What happens?"
    hint:
      ko: "그 값을 읽는 쪽이 그 호출을 볼 수 있는지 먼저 보세요."
      en: "First ask whether the thing that reads the setting can see that call."
    options:
      - t: { ko: "프록시를 안 지나 값이 안 읽히고 바깥 트랜잭션에 그대로 참여한다", en: "The proxy is skipped, the setting is unread, and it joins the outer transaction" }
      - t: { ko: "적혀 있으므로 새 트랜잭션이 열린다", en: "It is written down, so a new transaction opens" }
        diag:
          t:
            ko: "적어 둔 값이 읽히려면 <b>프록시를 지나야</b> 합니다. 같은 클래스 안의 호출은 자기 자신을 직접 부르는 것이라 프록시가 그 호출을 못 봅니다."
            en: "For the setting to be read the call must <b>pass the proxy</b>. A call inside the same class goes straight to itself, and the proxy never sees it."
          edge:
            h: { ko: "가장 날카로운 자리 — 누가 부르나", en: "The sharpest spot — who calls" }
            code:
              - "다른 빈이 부른다: 프록시를 지난다"
              - "this 로 부른다: 프록시를 안 지난다"
      - t: { ko: "트랜잭션이 통째로 없어진다", en: "The transaction disappears entirely" }
        diag:
          t:
            ko: "바깥 메서드의 트랜잭션은 그대로 있습니다. 안 생기는 것은 <b>새로 열리는 하나</b>뿐이에요."
            en: "The outer method's transaction is still there. What does not happen is only <b>the extra one</b>."
          edge:
            h: { ko: "가장 날카로운 자리 — 없어지나 합쳐지나", en: "The sharpest spot — gone or merged" }
            code:
              - "바깥: 열려 있다"
              - "안쪽: 그 하나에 참여한다"
      - t: { ko: "실행할 때 예외가 난다", en: "It raises an exception at run time" }
        diag:
          t:
            ko: "조용히 지나갑니다 — 그래서 찾기 어려운 자리예요. 로그도 예외도 없고 트랜잭션 하나로 돌아갑니다."
            en: "It passes silently — that is what makes it hard to find. No log, no exception, and one transaction runs."
          edge:
            h: { ko: "가장 날카로운 자리 — 알려 주나 조용하나", en: "The sharpest spot — reported or silent" }
            code:
              - "예외: 없다"
              - "결과: 트랜잭션 하나로 돈다"
