schema: 1
id: spring/filter-vs-interceptor
universal: null
name: { ko: "컨트롤러 앞에 서는 두 자리", en: "Filter and interceptor" }
token: null
grammars: []
framework: spring
# 짚을 노드가 없다 — 순서는 어느 파일에도 안 적혀 있다 (D176 · `chapter-login.md` §3-c).
# 창은 근거 낱말이 보이는 블록과 자바 개념의 사용처에서 빌린다 (D157 ②).
track_default: t0
essential: false
difficulty: 4
prereq: [spring/request-dispatch, proto/servlet-filter-chain]
confusions: [proto/unauthorized-vs-forbidden]
queries: []
dict:
  one_liner:
    ko: "요청을 고르는 자리보다 앞에 서는 것과 그 뒤에 서는 것이 있다."
    en: "One stands before the picker, the other stands after it."
  why:
    ko: >-
      요청이 컨트롤러에 닿기 전에 두 자리를 지납니다. <b>앞의 것</b>은 어느 메서드로 갈지 정해지기도
      전에 돕니다 — 그래서 어느 컨트롤러가 부를지 모르고, 대신 모든 요청을 봅니다. <b>뒤의 것</b>은
      메서드가 정해진 다음에 돌아서 어느 메서드로 가는지 알고 있습니다. 로그인 토큰을 읽어
      「누구인지」를 세우는 일은 앞의 자리가 맡습니다.<br>여기서 가장 자주 어긋나는 것이 하나 있어요.
      <b><code>permitAll</code> 은 인가를 면제하는 것이지 앞의 자리를 건너뛰는 것이 아닙니다.</b>
      로그인 요청에도 그 자리는 돕니다 — 다만 헤더가 없어 아무것도 안 하고 다음으로 넘길 뿐이에요.
    en: >-
      A request passes two places before the controller. <b>The first</b> runs before the method is
      even chosen — it does not know which controller will run, and in exchange it sees every
      request. <b>The second</b> runs after the method is chosen, so it knows which one. Reading a
      login token to establish 「who this is」 belongs to the first place.<br>One thing trips people
      here more than anything else. <b><code>permitAll</code> waives authorization; it does not skip
      the first place.</b> That place runs for a login request too — it simply finds no header, does
      nothing, and passes the request on.
  trace: []
rule:
  ko: "<b><code>permitAll</code> 은 인가를 면제하지 앞의 자리를 건너뛰지 않는다.</b> 그 자리는 언제나 돈다."
  en: "<b><code>permitAll</code> waives authorization, not the first place.</b> That place always runs."
ok:
  ko: >-
    앞의 자리는 모든 요청에 돌고, 볼 것이 없으면 아무것도 안 한 채 넘깁니다.
    그다음 인가 규칙이 이 요청을 통과시킬지 정합니다.
  en: >-
    The first place runs on every request and passes it on untouched when there is nothing to read.
    Then the authorization rules decide whether this request goes through.
misconceptions:
  - ko: "<code>permitAll</code> 이면 앞의 자리가 안 돈다 — 돕니다. 면제되는 것은 인가입니다."
    en: "<code>permitAll</code> skips the first place — it runs. What is waived is authorization."
  - ko: "앞의 자리가 어느 컨트롤러로 갈지 안다 — 아직 안 정해졌습니다."
    en: "The first place knows the controller — it is not chosen yet."
  - ko: "둘 중 하나만 쓰면 된다 — 볼 수 있는 것이 달라서 쓰임이 갈립니다."
    en: "Only one of the two is needed — they see different things, so they are used differently."
  - ko: "앞의 자리에서 던진 예외는 예외 처리기가 받는다 — 그 자리는 아직 그 바깥입니다."
    en: "An exception thrown there reaches the handler — that place is still outside it."
evidence: ["OncePerRequestFilter", "addFilterBefore", "HandlerInterceptor", "addInterceptors", "preHandle", "WebMvcConfigurer"]
meaning:
  - q:
      ko: "로그인 주소가 <code>permitAll</code> 입니다. 토큰을 읽는 <b>앞의 자리는 도나요?</b>"
      en: "The login path is <code>permitAll</code>. <b>Does the token-reading place run?</b>"
    hint:
      ko: "면제되는 것이 무엇인지 이름을 그대로 읽어 보세요."
      en: "Read the name literally — what exactly is waived?"
    options:
      - t: { ko: "돈다 — 헤더가 없어 아무것도 안 한 채 넘긴다", en: "Yes — with no header it does nothing and passes on" }
      - t: { ko: "안 돈다 — 통과 목록에 있으므로 건너뛴다", en: "No — being on the allow list skips it" }
        diag:
          t:
            ko: "통과 목록이 정하는 것은 <b>이 요청을 들여보낼까</b>입니다. 그 판단은 앞의 자리보다 <b>뒤</b>에 있어서 앞의 것을 못 건너뜁니다."
            en: "The allow list decides <b>whether to let this request in</b>. That decision sits <b>after</b> the first place, so it cannot skip it."
          edge:
            h: { ko: "가장 날카로운 자리 — 순서", en: "The sharpest spot — the order" }
            code:
              - "앞: 토큰을 읽는 자리"
              - "뒤: 들여보낼지 정하는 자리"
      - t: { ko: "돈다 — 그리고 토큰이 없어 요청을 막는다", en: "Yes — and it blocks the request for having no token" }
        diag:
          t:
            ko: "그 자리는 <b>막는 일을 하지 않습니다</b>. 읽을 것이 있으면 「누구인지」를 세우고, 없으면 그냥 넘깁니다. 막는 것은 인가 규칙이에요."
            en: "That place <b>does not block</b>. With something to read it establishes 「who」; with nothing it passes on. Blocking is the authorization rules."
          edge:
            h: { ko: "가장 날카로운 자리 — 세우기냐 막기냐", en: "The sharpest spot — establishing or blocking" }
            code:
              - "앞: 누구인지 세운다"
              - "뒤: 들여보낼지 정한다"
      - t: { ko: "주소마다 다르다 — 설정 순서가 정한다", en: "It depends on the path — the config order decides" }
        diag:
          t:
            ko: "체인에 한 번 넣으면 <b>모든 요청</b>에 돕니다. 주소별로 갈리는 것은 인가 규칙 쪽이에요."
            en: "Once added to the chain it runs on <b>every request</b>. Per-path differences live in the authorization rules."
          edge:
            h: { ko: "가장 날카로운 자리 — 전부냐 주소별이냐", en: "The sharpest spot — all or per path" }
            code:
              - "체인: 모든 요청"
              - "인가 규칙: 주소별"
