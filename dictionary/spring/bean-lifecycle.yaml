schema: 1
id: spring/bean-lifecycle
universal: null
name: { ko: "빈이 태어나고 죽는 순서", en: "Bean lifecycle" }
token: null
grammars: []
framework: spring
# 짚을 노드가 없다 — 생애는 실행 중에만 있다 (D176). 창은 자바 개념에서 빌린다 (D157 ②).
track_default: t0
essential: false
difficulty: 3
prereq: [spring/bean-and-container]
confusions: [cs/scope-and-lifetime]
queries: []
dict:
  one_liner:
    ko: "만들고, 필요한 것을 넣고, 준비 신호를 준 뒤에 쓴다."
    en: "Build it, fill it, signal that it is ready, then use it."
  why:
    ko: >-
      빈은 <code>new</code> 한 번으로 끝나지 않습니다. 순서가 있어요. 먼저 <b>생성자가 돕니다</b> —
      이때 주입받을 것들이 함께 들어옵니다. 그다음 스프링이 <b>준비가 끝났다는 신호</b>를 주고,
      그 신호에 반응하는 메서드가 있으면 그때 돕니다. 마지막에 프로그램이 내려갈 때
      <b>정리 신호</b>가 갑니다. 이 순서가 중요한 이유는 하나입니다 — <b>생성자 안에서는
      아직 준비가 안 끝난 것이 있을 수 있습니다</b>. 프록시로 감싸는 것도 생성자 뒤에 일어나므로,
      생성자 안에서 자기 메서드를 부르면 그 감싼 일이 안 일어납니다.
    en: >-
      A bean is not done with one <code>new</code>. There is an order. First <b>the constructor
      runs</b>, and what it is injected with arrives with it. Then Spring <b>signals that setup is
      finished</b>, and a method listening for that signal runs. Last, on shutdown, a <b>cleanup
      signal</b> goes out. The order matters for one reason: <b>inside the constructor some things
      are not ready yet</b>. Wrapping in a proxy also happens after the constructor, so a call to
      your own method from the constructor gets none of the wrapped work.
  trace: []
rule:
  ko: "<b>생성자는 가장 먼저 돈다.</b> 그 안에서는 아직 준비가 안 끝난 것이 있다."
  en: "<b>The constructor runs first.</b> Inside it, some setup has not happened yet."
ok:
  ko: >-
    생성자로 받을 것을 받고, 준비 신호를 받은 뒤부터 온전히 쓸 수 있습니다.
    프로그램이 내려갈 때 정리 신호가 한 번 더 갑니다.
  en: >-
    It takes what the constructor receives, and is fully usable after the ready signal. On shutdown
    one more signal goes out.
misconceptions:
  - ko: "생성자가 끝나면 준비가 다 된 것이다 — 감싸기와 준비 신호가 그 뒤에 있습니다."
    en: "After the constructor everything is ready — wrapping and the ready signal come after."
  - ko: "빈은 쓸 때 만들어진다 — 기본은 시작할 때 미리 만듭니다."
    en: "A bean is built when used — by default it is built at startup."
  - ko: "정리 신호는 언제나 온다 — 프로세스가 갑자기 죽으면 안 옵니다."
    en: "The cleanup signal always arrives — a hard kill skips it."
  - ko: "애너테이션은 명령이다 — 표시일 뿐이고 컨테이너가 그 순서에 읽습니다."
    en: "An annotation is a command — it is a mark the container reads in this order."
# 이 개념에서만 나오는 낱말이다. 표본 리포(`MonggleMonggle`)에서는 여덟 다 **0곳** —
# 빈이 전부 생성자 주입만 쓰는 무상태 서비스라 여닫을 자원이 없다. 그래서 이 개념은
# 근거 낱말이 아니라 아래 `examples` 로 선다 (D177 의 「네 코드엔 없다」 문).
evidence: ["@PostConstruct", "@PreDestroy", "InitializingBean", "DisposableBean", "afterPropertiesSet", "@Scope", "@Lazy", "initMethod"]
meaning:
  - q:
      ko: "생성자 안에서 자기 클래스의 다른 메서드를 불렀습니다. <b>그 메서드의 애너테이션은 도나요?</b>"
      en: "The constructor calls another method of the same class. <b>Does that method's annotation run?</b>"
    hint:
      ko: "감싸는 일이 생성자보다 먼저인지 나중인지 보세요."
      en: "Ask whether wrapping happens before or after the constructor."
    options:
      - t: { ko: "안 돈다 — 감싸는 일은 생성자가 끝난 뒤에 일어난다", en: "No — wrapping happens after the constructor finishes" }
      - t: { ko: "돈다 — 애너테이션은 붙은 순간부터 듣는다", en: "Yes — an annotation works from the moment it is attached" }
        diag:
          t:
            ko: "애너테이션은 <b>읽는 쪽이 있을 때</b>만 일합니다. 생성자가 도는 시점에는 감싸는 일이 아직 안 일어났어요."
            en: "An annotation works only when <b>something reads it</b>. While the constructor runs, the wrapping has not happened."
          edge:
            h: { ko: "가장 날카로운 자리 — 붙은 때냐 읽히는 때냐", en: "The sharpest spot — attached or read" }
            code:
              - "생성자: 감싸기 전"
              - "준비 신호 뒤: 감싼 다음"
      - t: { ko: "돈다 — 같은 클래스 안이라 더 확실하게 돈다", en: "Yes — being in the same class makes it surer" }
        diag:
          t:
            ko: "같은 클래스 안의 호출은 오히려 <b>감싼 쪽을 안 지납니다</b>. 그래서 밖에서 부를 때와 다르게 돕니다."
            en: "A call inside the same class actually <b>skips the wrapper</b>. So it behaves differently from an outside call."
          edge:
            h: { ko: "가장 날카로운 자리 — 안에서냐 밖에서냐", en: "The sharpest spot — from inside or outside" }
            code:
              - "밖에서: 감싼 쪽을 지난다"
              - "안에서: 바로 부른다"
      - t: { ko: "예외가 나서 프로그램이 안 뜬다", en: "It throws and the program does not start" }
        diag:
          t:
            ko: "조용히 지나갑니다. 메서드는 그냥 돌고 애너테이션이 시킬 일만 안 일어나요."
            en: "It passes silently. The method runs; only the annotated work is missing."
          edge:
            h: { ko: "가장 날카로운 자리 — 멈추나 조용하나", en: "The sharpest spot — halted or silent" }
            code:
              - "예외: 없다"
              - "결과: 그 일만 빠진다"

# 합성 예제 (D177). 사용처가 아예 없는 개념은 `makeAbsentCard` 가 이 코드를 창으로 삼아
# 판을 세운다 — 「네 코드엔 없다」와 그 사유를 옆에 붙여서다. 쿼리가 없는 네임스페이스라
# `expect.sites` 는 잴 것이 없고(대조할 캡처가 없다) 음성 예시도 뜻이 없다 —
# `picks` 는 `siteFromExample` 이 요구하는 자리이고 뜻 고르기에서는 쓰이지 않는다.
examples:
  - code: |
      @Component
      class Cache {
          Cache() { }
          @PostConstruct void warm() { }
          @PreDestroy void flush() { }
      }
    expect:
      form: class
      picks: { 1: "Cache", 2: "@PostConstruct", 3: "@PreDestroy" }
  - code: |
      @Service
      class Report {
          Report() { warm(); }
          @PostConstruct void warm() { }
      }
    expect:
      form: class
      picks: { 1: "Report", 2: "warm", 3: "@PostConstruct" }
