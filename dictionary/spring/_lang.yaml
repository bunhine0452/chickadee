lang: spring
version: 0.1.0

# 이 사전에는 쿼리가 없다 — `spring/` 은 `COMPUTED_NAMESPACES` 다 (D176). 여기 적는 문법은
# 「내 개념이 어느 파일에서 보이나」이고, 근거 낱말(`evidence`)이 그 파일의 줄에서 걸린다.
# 시스템 쿼리(`_imports`·`_blocks`)는 `java/` 가 이미 대므로 여기서는 안 낸다.
grammars: [java]
# `java/_lang.yaml` 과 같은 값이다 — tree-sitter-java 0.23.5 의 `parser.c` 가 14 다.
grammar_abi: { java: 14 }

extensions:
  java: [.java]

# 문법이 아니라 프레임워크가 런타임에 하는 일이라 네임스페이스를 나눈다 (D59 의 `react/` 선례).
# 자바에는 `package.json` 이 없어서 감지 신호가 의존성 이름 목록이 아니다 — 빌드 매니페스트
# 원문에 `spring-boot` 이 보이는가로 잡고, 안 보이는 리포에서는 이 사전을 **아예 로드하지 않는다**.
framework: spring
detect:
  manifest: [build.gradle, build.gradle.kts, pom.xml]
  contains: spring-boot

# 비어 있다. `essential` 은 문법 구멍 지도의 「필수 문법」이고(03 §6) 이 네임스페이스에는
# 짚을 문법이 없다 — 여기 개념을 넣으면 빈칸(`@hole`)을 영영 못 내는 자리가 부채 표에 선다.
essential: []
alternatives: []

thin_threshold: { min_files: 2, min_sites: 3, small_repo_files: 20 }

diag_default:
  point:
    ko: "«{{pick}}»{{pick|josa:은,는}} {{role}} 자리입니다. {{concept}}{{concept|josa:은,는}} «{{answer}}» 입니다. {{rule}}"
    en: "«{{pick}}» is the {{role}} slot. The {{concept}} is «{{answer}}». {{rule}}"
  blank:
    ko: "«{{pick}}»{{pick|josa:은,는}} 이 자리에 오지 않습니다. {{rule}}"
    en: "«{{pick}}» does not go in this slot. {{rule}}"
