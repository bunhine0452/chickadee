schema: 1
id: swift/optional-chaining
universal: common/optional-chaining
name: { ko: 없으면 건너뛰기, en: Optional chaining }
token: "?."
grammars: [swift]
framework: null
essential: true
difficulty: 2
prereq: [swift/optional-type]
confusions: []
dict:
  one_liner:
    ko: "앞이 비었으면 뒤를 아예 안 보고, 사슬 전체의 결과에 물음표가 붙는다."
    en: "An empty left side skips the rest, and the whole chain becomes absent."
  why:
    ko: >-
      점 앞에 물음표를 하나 붙이면 「앞이 비었으면 <b>뒤는 아예 보지 않는다</b>」가 됩니다.
      비었을 때 죽는 대신 결과가 「없음」이 되는 거예요.
      대가가 하나 있습니다: <b>사슬 전체의 결과에 물음표가 붙습니다.</b> 사슬 안에서 한 번만
      써도 그렇고, 뒤에 점을 더 이어도 물음표는 <b>한 겹으로 평평해집니다</b>(실측).
      그래서 사슬 끝에서 값을 쓰려면 다시 벗겨야 하고, 그 자리에 채우는 기호가 자주 붙습니다.
      트리에서는 이 기호가 보통 점과 <b>같은 노드</b>라 물음표가 붙었는지로만 갈립니다.
    en: >-
      One question mark before the dot means "if the left is empty, <b>the rest is not looked at
      all</b>." Instead of dying on emptiness the result becomes absence.
      There is a cost: <b>the whole chain's result carries the mark.</b> One use anywhere in the
      chain is enough, and adding more dots keeps the mark <b>flat at one layer</b> (measured).
      So using the value at the end of a chain means unwrapping again, which is why a fallback
      symbol often follows.
      In the parse tree this symbol is <b>the same node</b> as a plain dot; only the mark tells
      them apart.
  trace:
    - ko: "{{site.line}}행이 {{pick.2|code}}에 값이 있는지 본다."
      en: "Line {{site.line}} checks whether {{pick.2|code}} holds a value."
    - ko: "없으면 {{pick.3|code}}{{pick.3|josa:을,를}} 아예 안 보고 결과가 「없음」이 된다."
      en: "If not, {{pick.3|code}} is never looked at and the result is absence."
    - ko: "있으면 이어서 보고, 결과에는 물음표가 붙는다."
      en: "If so, it goes on, and the result carries the mark."
rule:
  ko: "<b>한 번이라도 건너뛰면 사슬 전체가 없을 수 있는 값이 된다.</b> 겹치지는 않는다."
  en: "<b>One skip makes the whole chain possibly absent.</b> The layers do not stack."
result:
  label: { ko: "{{site.line}}행의 사슬", en: "the chain on line {{site.line}}" }
  value: "{{pick.2}}{{pick.1}}.{{pick.3}}"
  note: { ko: "결과에 물음표가 붙는다", en: "the result carries the mark" }
ok:
  ko: "{{pick.2|code}}에 값이 있어야 {{pick.3|code}}{{pick.3|josa:을,를}} 봅니다."
  en: "{{pick.3|code}} is looked at only if {{pick.2|code}} holds a value."
payoff:
  ko: "이걸 알면 「끝까지 갔는데 왜 아직 물음표가 붙지」가 풀립니다 — 사슬 전체가 옮은 겁니다."
  en: "This untangles “I reached the end and the mark is still there” — the whole chain carries it."
bridge:
  ko: >-
    TS·C# 의 같은 기호와 동작이 같습니다. 다른 것은 <b>결과 타입에 물음표가 눈에 보인다</b>는 점이에요.
  en: >-
    It behaves like the same symbol in TS and C#. What differs is that <b>the mark is visible in
    the result type</b>.
misconceptions:
  - ko: "앞이 비어도 뒤는 계산된다 — 아예 안 봅니다."
    en: "The right side still runs when the left is empty — it is not looked at at all."
  - ko: "사슬 끝에서는 물음표가 사라진다 — 사슬 전체에 붙어 남습니다."
    en: "The mark disappears at the end of a chain — it stays on the whole chain."
  - ko: "점마다 물음표가 겹친다 — 평평해져서 한 겹입니다."
    en: "Each dot adds a layer — the chain flattens to one."
point:
  - q:
      ko: "{{site.line}}행에서 <b>앞이 비었을 때 건너뛰라는 표시</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the mark that says skip when the left is empty</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>앞쪽</b>입니다. 비었는지 보는 대상이지 건너뛰라는 표시는 아니에요."
          en: "{{pick.2|code}} is the <b>left side</b> — what gets checked, not the mark that says skip."
        edge:
          h: { ko: "가장 날카로운 자리 — 대상이냐 표시냐", en: "The sharpest spot — the source or the mark" }
          code:
            - "u?.name    // 비면 건너뛴다"
            - "u.name     // 비면 빌드가 멈춘다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>뒤쪽</b>입니다. 앞이 비면 여기는 아예 안 봐요."
          en: "{{pick.3|code}} is the <b>right side</b>. An empty left means it is never looked at."
        edge:
          h: { ko: "가장 날카로운 자리 — 앞이냐 뒤냐", en: "The sharpest spot — left or right" }
          code:
            - "u?.name"
            - "u?.reload()   // 비면 안 불린다"
meaning:
  - q:
      ko: "사슬에서 이 기호를 한 번만 쓰고 뒤로 점을 더 이으면 결과 타입은 어떻게 될까요?"
      en: "Using this symbol once and adding more dots — what is the result's type?"
    options:
      - t:
          ko: "물음표 한 겹이 붙은 채로 평평하다"
          en: "Flat, with one layer of the mark"
      - t:
          ko: "점 수만큼 물음표가 겹친다"
          en: "One layer per dot"
        diag:
          t:
            ko: "겹치지 않습니다 — 사슬은 평평해져요. 겹치는 자리는 대괄호로 꺼낸 값이 이미 없을 수 있을 때입니다."
            en: "They do not stack — chains flatten. Stacking happens when a bracket lookup already yields an optional."
          edge:
            h: { ko: "가장 날카로운 자리 — 평평하냐 겹치냐", en: "The sharpest spot — flat or stacked" }
            code:
              - "d[\"a\"]?.first   // 한 겹"
              - "y[\"k\"]          // 값이 이미 없을 수 있으면 두 겹"
      - t:
          ko: "물음표가 사라진다"
          en: "The mark disappears"
        diag:
          t:
            ko: "사라지지 않습니다. 앞이 빌 수 있는 이상 결과도 빌 수 있어요."
            en: "It does not. As long as the left can be empty, so can the result."
      - t:
          ko: "빌드가 멈춘다"
          en: "The build stops"
        diag:
          t:
            ko: "멈추지 않습니다. 이 기호가 있는 한 사슬은 올바른 코드예요."
            en: "It does not. With this symbol the chain is valid code."
no_hole_reason: >-
  구멍을 못 뚫는다. 이 개념의 정답은 점 앞에 물음표가 **있나 없나** 하나이고, 그 글자가 한 글자라
  빈칸형이 생성 단계에서 떨어진다(`MIN_HOLE`). 두 글자로 넓히면 점까지 함께 지워져 「무엇을 꺼내나」가
  같이 사라진다. 있고 없고를 묻는 판은 뜻 고르기가 진다.
why_gate:
  q:
    ko: "이 기호를 쓰면 왜 <b>사슬 전체</b>에 물음표가 붙을까요?"
    en: "Why does this symbol put the mark on <b>the whole chain</b>?"
  choices:
    - t:
        ko: "앞이 비면 뒤가 아예 안 도는데 그때도 식은 값 하나를 내야 하고, 그 값이 「없음」이기 때문"
        en: "Because an empty left skips the rest, yet the expression must still yield a value — and that value is absence"
      ok: true
      fb:
        ko: "그 방향입니다. 그러면 사슬 끝에서 값을 쓰려면 무엇이 더 필요한지도 적어 보세요."
        en: "That is the direction. Say what is still needed to use the value at the end, too."
    - t:
        ko: "점이 여러 개라서"
        en: "Because there are several dots"
      ok: false
      fb:
        ko: "점 수와 무관합니다 — 한 번만 써도 붙고, 여러 번 써도 한 겹이에요."
        en: "The dot count is irrelevant — one use is enough, and many stay one layer."
    - t:
        ko: "Swift 가 사슬을 한 덩어리로 보기 때문"
        en: "Because Swift treats a chain as one lump"
      ok: false
      fb:
        ko: "덩어리라서가 아닙니다. 안 도는 경우에도 값을 내야 한다는 것이 이유예요."
        en: "Not because it is a lump. Because a skipped chain still has to yield something."
queries:
  - { grammars: [swift], file: ./optional-chaining.scm }
examples:
  - code: "func f() { let a = u?.name }"
    expect: { sites: 1, form: chain, picks: { 1: "?", 2: "u", 3: "name" } }
  - code: "func f() { let b = self.model?.title }"
    expect: { sites: 1, form: chain, picks: { 1: "?", 3: "title" } }
  - code: "func f() { let c = u.name }"
    expect: none
