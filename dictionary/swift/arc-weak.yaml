schema: 1
id: swift/arc-weak
universal: null
name: { ko: 세지 않는 참조, en: weak and unowned }
token: "weak"
grammars: [swift]
framework: null
essential: true
difficulty: 4
prereq: [swift/struct-declaration, swift/closure-trailing, cs/garbage-collection]
confusions: []
dict:
  one_liner:
    ko: "가리키면서 수를 세지 않겠다는 표시이고, 가리키던 것이 사라지면 그 이름이 비워진다."
    en: "It points without counting, so when the target goes the name is emptied for you."
  why:
    ko: >-
      상자로 도는 값은 <b>가리키는 수를 세어</b> 0이 되면 지워집니다. 여기서 문제가 하나
      생겨요 — 둘이 <b>서로를 가리키면</b> 수가 영영 0이 안 되고, 둘 다 안 지워집니다.
      그 고리를 끊는 것이 이 표시입니다. 뜻은 「메모리를 아낀다」가 아니라
      <b>「세는 것을 그만둔다」</b>예요. 세지 않으니 상대가 사라질 수 있고, 사라지면 그 이름이
      <b>비워집니다</b> — 그래서 이 표시가 붙은 이름은 반드시 「없을 수 있는 값」입니다.
      비워 주지 않는 쪽 낱말도 있는데, 그쪽은 사라진 뒤에 읽으면 앱이 끝납니다.
      <b>표본에서 0곳입니다</b> — 428파일에 저장된 이런 이름이 하나도 없어요. 화면 코드가
      값으로 도는 묶음과 관찰 가능한 상자로 짜여서 서로를 가리키는 저장 자리가 안 생깁니다.
      대신 클로저가 붙잡는 자리에는 10곳 있고, 그것이 다음 장입니다.
    en: >-
      A value that travels as a box is <b>counted</b>, and at zero it is erased. That creates one
      problem: two boxes <b>pointing at each other</b> never reach zero, so neither is erased.
      This marker cuts the loop. It does not mean "save memory"; it means <b>"stop counting".</b>
      Uncounted, the target may disappear — and when it does, the name is <b>emptied</b>, which is
      why such a name is always a possibly-absent one. A sibling word skips the emptying, and
      reading it after the target is gone ends the app.
      <b>The sample has none</b> — not one stored name like this across 428 files. Screen code is
      built from value bundles and observable boxes, so mutually pointing stored fields never
      arise. Capture lists have 10, and that is the next plate.
  trace:
    - ko: "{{site.line}}행의 {{pick.2|code}}{{pick.2|josa:은,는}} {{pick.3|code}}{{pick.3|josa:을,를}} 가리킨다."
      en: "{{pick.2|code}} on line {{site.line}} points at {{pick.3|code}}."
    - ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 그 가리킴을 세지 않겠다고 적는다."
      en: "{{pick.1|code}} records that this pointing is not counted."
    - ko: "가리키던 것이 사라지면 이 이름이 비워진다."
      en: "When the target goes, this name is emptied."
rule:
  ko: "<b>세는 것을 그만두는 표시다.</b> 메모리를 아끼는 것이 아니라 고리를 끊는 것이다."
  en: "<b>It is a marker that stops counting.</b> It cuts a loop; it does not save memory."
result:
  label: { ko: "{{site.line}}행의 가리킴", en: "the reference on line {{site.line}}" }
  value: "{{pick.1}} {{pick.2}}"
  note: { ko: "세지 않으므로 비워질 수 있다", en: "uncounted, so it can empty" }
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 세지 않는 가리킴이라 비워질 수 있습니다."
  en: "{{pick.2|code}} points without counting, so it can be emptied."
payoff:
  ko: "이걸 알면 「화면을 닫았는데 왜 안 지워지지」가 풀립니다 — 서로 가리키는 고리입니다."
  en: "This untangles “I closed the screen and nothing was freed” — a loop of references."
bridge:
  ko: >-
    자바·C# 은 고리를 <b>알아서 지웁니다</b>. Swift 는 세기만 하므로 고리를 사람이 끊어야 해요.
  en: >-
    Java and C# <b>collect cycles for you</b>. Swift only counts, so a person has to cut the loop.
misconceptions:
  # swift.md §9 ⑦.
  - ko: "이 표시를 붙이면 메모리를 아낀다 — 아끼는 게 아니라 세는 것을 그만두는 겁니다."
    en: "The marker saves memory — it stops the counting, it saves nothing."
  - ko: "붙여도 언제나 값이 있다 — 사라지면 비워지므로 없을 수 있는 값입니다."
    en: "It always holds a value — it empties when the target goes, so it is possibly absent."
  - ko: "값으로 도는 묶음에도 필요하다 — 세는 것은 상자 쪽뿐입니다."
    en: "Value bundles need it too — only the box side is counted."
point:
  - q:
      ko: "{{site.line}}행에서 <b>세지 않겠다는 표시</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the marker that stops the counting</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>이름</b>입니다. 세는지 안 세는지는 앞에 붙은 표시가 정해요."
          en: "{{pick.2|code}} is the <b>name</b>. Whether it counts is settled by the marker in front."
        edge:
          h: { ko: "가장 날카로운 자리 — 이름이냐 표시냐", en: "The sharpest spot — the name or the marker" }
          code:
            - "weak var owner: Node?"
            - "var owner: Node?        // 센다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 가리키는 <b>타입</b>입니다. 세는지 안 세는지와는 다른 축이에요."
          en: "{{pick.3|code}} is the <b>type</b> pointed at — a different axis from counting."
        edge:
          h: { ko: "가장 날카로운 자리 — 타입이냐 표시냐", en: "The sharpest spot — the type or the marker" }
          code:
            - "weak var a: Node?"
            - "weak var b: Tree?   // 표시는 같다"
meaning:
  - q:
      ko: "이 표시가 붙은 이름이 가리키던 것이 사라지면 어떻게 될까요?"
      en: "What happens to such a name when the thing it points at goes away?"
    options:
      - t:
          ko: "그 이름이 비워진다 — 그래서 없을 수 있는 값이다"
          en: "The name is emptied — which is why it is possibly absent"
      - t:
          ko: "사라진 자리를 그대로 가리킨 채로 남는다"
          en: "It keeps pointing at the vacated place"
        diag:
          t:
            ko: "그건 비워 주지 않는 <b>다른 낱말</b>의 이야기입니다. 그쪽은 사라진 뒤 읽으면 앱이 끝나요."
            en: "That is the <b>sibling word</b> that skips the emptying. Reading it afterwards ends the app."
          edge:
            h: { ko: "가장 날카로운 자리 — 비우나 안 비우나", en: "The sharpest spot — emptied or not" }
            code:
              - "weak var a: Node?      // 비워진다"
              - "unowned let b: Node    // 안 비워진다"
      - t:
          ko: "사라지지 않게 붙잡아 둔다"
          en: "It holds the target and stops it going"
        diag:
          t:
            ko: "붙잡는 것은 <b>세는</b> 가리킴입니다. 이 표시는 세지 않기로 한 것이라 못 붙잡아요."
            en: "Holding is what a <b>counted</b> reference does. This marker gave that up."
      - t:
          ko: "앱이 끝난다"
          en: "The app ends"
        diag:
          t:
            ko: "비워 주는 쪽에서는 안 끝납니다. 끝나는 것은 비워 주지 않는 낱말을 쓰고 나중에 읽었을 때예요."
            en: "Not on the emptying side. Ending happens with the non-emptying word, read after the fact."
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 가리키되 <b>세지 않고, 사라지면 비워집니다</b>."
      en: "Choose what goes in the blank. Line {{site.line}} points <b>without counting and empties when the target goes</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "weak", mono: true }
      - t: "unowned"
        mono: true
        diag:
          t:
            ko: "이것도 안 세지만 <b>비워 주지 않습니다</b>. 사라진 뒤에 읽으면 앱이 끝나요 — 대신 없을 수 있는 값이 아니라 쓰기 편합니다."
            en: "That one also skips counting but <b>does not empty</b>. Read after the target goes, the app ends — in exchange it is not optional."
          edge:
            h: { ko: "가장 날카로운 자리 — 비우나 안 비우나", en: "The sharpest spot — emptied or not" }
            code:
              - "weak var a: Node?"
              - "unowned let b: Node"
      - t: "lazy"
        mono: true
        diag:
          t:
            ko: "이건 <b>처음 읽을 때 만든다</b>는 표시입니다. 세는 것과는 상관이 없어요."
            en: "That marks <b>made on first read</b>. It has nothing to do with counting."
      - t: "private"
        mono: true
        diag:
          t:
            ko: "이건 <b>누가 볼 수 있나</b>를 정합니다. 세는 것과는 다른 축이에요."
            en: "That settles <b>who can see it</b> — a different axis from counting."
why_gate:
  q:
    ko: "Swift 는 왜 서로 가리키는 고리를 <b>사람이 끊게</b> 할까요?"
    en: "Why does Swift make a person <b>cut the reference loop</b>?"
  choices:
    - t:
        ko: "고리를 찾아 지우려면 프로그램을 멈추고 훑는 절차가 필요한데, 세기만 하면 그 멈춤이 없기 때문"
        en: "Because finding loops means pausing and sweeping the program, while plain counting needs no pause"
      ok: true
      fb:
        ko: "그 방향입니다. 그 대신 사람이 치르는 값이 무엇인지도 적어 보세요."
        en: "That is the direction. Say what a person pays for it, too."
    - t:
        ko: "고리가 실제로는 안 생겨서"
        en: "Because loops do not really happen"
      ok: false
      fb:
        ko: "생깁니다 — 클로저가 자기를 붙잡는 자리가 가장 흔해요."
        en: "They do — a closure capturing its own owner is the commonest case."
    - t:
        ko: "세는 쪽이 언제나 빨라서"
        en: "Because counting is always faster"
      ok: false
      fb:
        ko: "언제나는 아닙니다. 다른 것은 속도가 아니라 <b>멈춤이 있느냐</b>예요."
        en: "Not always. The difference is not speed but whether there is a pause."
queries:
  - { grammars: [swift], file: ./arc-weak.scm }
examples:
  - code: "class Box { weak var owner: Node? }"
    expect: { sites: 1, form: weakprop, hole: "weak", picks: { 1: "weak", 2: "owner", 3: "Node?" } }
  - code: "class Tree { unowned let parent: Node }"
    expect: { sites: 1, form: weakprop, hole: "unowned", picks: { 1: "unowned", 2: "parent", 3: "Node" } }
  - code: "class Box { var owner: Node? }"
    expect: none
