schema: 1
id: swift/operator-precedence
# 0부 축 5. 보편형은 `common/arithmetic` (README §8).
# `swift.md` §0.1 0-5 — 애플 *TSPL* 은 이 절을 **마지막 장**(`AdvancedOperators`)에 두고 우리는
# 0부에 둔다. 그쪽은 우선순위를 **선언하는 사람**의 지식이고 여기서 묻는 것은 **읽는 사람**의
# 지식이다. 순서를 비교한 연구는 못 찾았다 — 판단이다 (`swift-learning.md` §11.2 갈림 ①).
universal: common/arithmetic
name: { ko: 무엇이 먼저 묶이나, en: Operator precedence }
token: "<<"
grammars: [swift]
framework: null
essential: true
difficulty: 2
prereq: [cs/operator-precedence]
confusions: []
dict:
  one_liner:
    ko: "괄호를 안 쓰면 세기가 센 기호부터 묶이고, 그 세기표가 언어마다 다르다."
    en: "Without brackets the tighter operator binds first, and that table varies."
  why:
    ko: >-
      한 줄에 기호가 둘 이상이면 어느 쪽이 먼저 묶이는지가 답을 정합니다. Swift 에서 이 세기는
      <b>언어가 아니라 표준 라이브러리의 선언</b>에 적혀 있어요 — 그래서 라이브러리가 새 기호를
      더하면서 세기까지 정할 수 있습니다. 그 유연함의 대가가 하나 있습니다:
      <b>자리 옮김 기호가 더하기보다 세게 묶입니다.</b> C·자바·C# 은 반대로 두었고, 그래서
      같은 한 줄이 언어에 따라 다른 값을 냅니다 — 이 기계에서 재 보면 Swift 는 7 이고
      C 계열은 32 입니다. 그리고 논리 기호에서는 세기 말고 하나가 더 있습니다:
      왼쪽만 보고 답이 정해지면 <b>오른쪽은 아예 안 돕니다.</b>
    en: >-
      When one line holds two operators, which binds first settles the answer. In Swift that
      tightness lives <b>in the standard library, not in the language</b> — a library can add an
      operator and set its tightness with it. That flexibility costs one thing: <b>the shift
      operator binds tighter than addition.</b> C, Java and C# put it the other way, so the same
      line gives different answers per language — measured on this machine, Swift says 7 and the
      C family says 32. Logical operators add one more rule: when the left side settles the
      answer, <b>the right side never runs.</b>
  trace:
    - ko: "{{site.line}}행에서 {{pick.3|code}}{{pick.3|josa:이,가}} 먼저 한 값으로 접힌다."
      en: "On line {{site.line}}, {{pick.3|code}} folds to one value first."
    - ko: "그다음 {{pick.1|code}}{{pick.1|josa:이,가}} 왼쪽과 그 값을 묶는다."
      en: "Then {{pick.1|code}} joins the left side with that value."
    - ko: "괄호를 적으면 이 순서를 손으로 바꿀 수 있다."
      en: "Brackets are how the order gets changed by hand."
rule:
  ko: "<b>세기가 센 기호가 먼저 묶인다.</b> Swift 의 자리 옮김은 더하기보다 위다."
  en: "<b>The tighter operator binds first.</b> In Swift the shift sits above addition."
result:
  label: { ko: "{{site.line}}행의 식", en: "the expression on line {{site.line}}" }
  value: "{{pick.2}} {{pick.1}} {{pick.3}}"
  note: { ko: "오른쪽이 먼저 접힌다", en: "the right side folds first" }
ok:
  ko: "{{pick.3|code}}{{pick.3|josa:이,가}} 먼저 접히고 그 값이 {{pick.1|code}} 의 오른쪽이 됩니다."
  en: "{{pick.3|code}} folds first and becomes the right side of {{pick.1|code}}."
payoff:
  ko: "이걸 알면 「괄호를 안 썼는데 값이 다르다」가 풀립니다 — 묶이는 순서가 다른 겁니다."
  en: "This untangles “no brackets and the value differs” — the binding order is not what you assumed."
bridge:
  ko: >-
    C·자바·C# 은 자리 옮김을 더하기 <b>아래</b>에 두었습니다. 같은 한 줄이 Swift 에서 7,
    그쪽에서 32 입니다.
  en: >-
    C, Java and C# put the shift <b>below</b> addition. The same line is 7 in Swift and 32 there.
misconceptions:
  # swift.md §0.1 0-5 · §0.4 실측 (`1 << 2 + 3` = 7).
  - ko: "자리 옮김은 더하기보다 나중에 묶인다 — C 계열에서는 참입니다. Swift 는 반대예요."
    en: "The shift binds after addition — true in the C family. Swift is the other way."
  - ko: "세기는 언어가 못 박은 것이다 — 표준 라이브러리의 선언입니다. 라이브러리가 더 넣을 수 있어요."
    en: "Tightness is fixed by the language — it is declared in the standard library, which can add more."
  - ko: "논리 기호는 양쪽을 다 본다 — 왼쪽으로 답이 정해지면 오른쪽은 안 돕니다."
    en: "A logical operator reads both sides — when the left settles it, the right never runs."
point:
  - q:
      ko: "{{site.line}}행에서 <b>나중에 묶이는 기호</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the operator that binds last</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>왼쪽 재료</b>입니다. 재료는 순서를 안 정해요 — 정하는 것은 기호의 세기입니다."
          en: "{{pick.2|code}} is the <b>left input</b>. Inputs do not set the order; the operators' tightness does."
        edge:
          h: { ko: "가장 날카로운 자리 — 재료냐 기호냐", en: "The sharpest spot — an input or an operator" }
          code:
            - "1 + 2 * 3     // 7"
            - "(1 + 2) * 3   // 9"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>먼저 접히는 쪽</b>입니다. 먼저 접히므로 나중에 묶이는 기호는 그 바깥에 있어요."
          en: "{{pick.3|code}} is the part that <b>folds first</b>. The operator that binds last sits outside it."
        edge:
          h: { ko: "가장 날카로운 자리 — 안이냐 바깥이냐", en: "The sharpest spot — inside or outside" }
          code:
            - "1 + 2 * 3     // 2 * 3 이 안"
            - "1 << 2 + 3    // Swift 는 1 << 2 가 안"
meaning:
  - q:
      ko: "괄호 없이 자리 옮김과 더하기를 한 줄에 적으면 Swift 는 무엇을 먼저 묶을까요?"
      en: "With no brackets, which does Swift bind first — the shift or the addition?"
    options:
      - t:
          ko: "자리 옮김을 먼저 묶는다 — 세기가 더하기보다 위다"
          en: "The shift binds first — it sits above addition"
      - t:
          ko: "더하기를 먼저 묶는다"
          en: "The addition binds first"
        diag:
          t:
            ko: "C·자바·C# 에서는 그렇습니다. Swift 는 자리 옮김을 위에 두어 같은 줄이 다른 값을 내요 — 실측으로 7 과 32 입니다."
            en: "That holds in C, Java and C#. Swift puts the shift above, so the same line differs — measured, 7 against 32."
          edge:
            h: { ko: "가장 날카로운 자리 — 어느 쪽이 위냐", en: "The sharpest spot — which sits above" }
            code:
              - "1 << 2 + 3   // Swift: 7"
              - "1 << 2 + 3   // C·자바: 32"
      - t:
          ko: "왼쪽부터 차례로 묶는다"
          en: "It binds left to right"
        diag:
          t:
            ko: "차례로 묶는 것은 <b>세기가 같을 때</b>입니다. 세기가 다르면 센 쪽이 먼저예요."
            en: "Left to right applies <b>only when tightness is equal</b>. Different tightness means the tighter one goes first."
      - t:
          ko: "괄호가 없으면 빌드가 멈춘다"
          en: "Without brackets the build stops"
        diag:
          t:
            ko: "멈추지 않습니다. 세기표가 있어 순서가 이미 정해져 있고, 그 표가 언어마다 다른 것이 문제예요."
            en: "It does not stop. The tightness table already settles the order — the trouble is that the table differs per language."
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 <b>왼쪽이 참일 때만 오른쪽을 보는</b> 기호를 씁니다."
      en: "Choose what goes in the blank. Line {{site.line}} uses the operator that <b>reads the right side only if the left holds</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "&&", mono: true }
      - t: "||"
        mono: true
        diag:
          t:
            ko: "이건 반대입니다 — 왼쪽이 <b>참이면</b> 오른쪽을 안 봐요. 세기도 이쪽이 더 약해서 나중에 묶입니다."
            en: "That is the other way round — it skips the right side when the left <b>holds</b>. It also binds looser."
          edge:
            h: { ko: "가장 날카로운 자리 — 어느 쪽에서 멈추나", en: "The sharpest spot — which side stops it" }
            code:
              - "a && b   // a 가 거짓이면 b 를 안 본다"
              - "a || b   // a 가 참이면 b 를 안 본다"
      - t: "&"
        mono: true
        diag:
          t:
            ko: "이건 <b>비트를 겹치는</b> 기호라 참·거짓이 아니라 수를 다룹니다. 오른쪽을 건너뛰지도 않아요."
            en: "That one <b>overlays bits</b> and works on numbers, not truth values. It never skips the right side."
      - t: "=="
        mono: true
        diag:
          t:
            ko: "이건 <b>견주는</b> 기호입니다. 두 값이 같은지 묻는 것이지 두 조건을 잇는 것이 아니에요."
            en: "That one <b>compares</b>. It asks whether two values are the same; it does not join two conditions."
why_gate:
  q:
    ko: "Swift 는 왜 세기표를 <b>표준 라이브러리에</b> 두었을까요?"
    en: "Why does Swift keep the tightness table <b>in the standard library</b>?"
  choices:
    - t:
        ko: "새 기호를 라이브러리가 더할 수 있게 하려면 그 기호의 세기도 같은 자리에서 정해져야 하기 때문"
        en: "Because a library that can add an operator has to be able to set its tightness in the same place"
      ok: true
      fb:
        ko: "그 방향입니다. 그 대신 읽는 사람이 치르는 값이 무엇인지도 적어 보세요."
        en: "That is the direction. Say what the reader pays for it, too."
    - t:
        ko: "언어 문법을 짧게 하려고"
        en: "To keep the grammar short"
      ok: false
      fb:
        ko: "길이 문제가 아닙니다. 라이브러리가 기호를 더할 수 있다는 것이 이유예요."
        en: "Length is not it. The reason is that a library can add operators."
    - t:
        ko: "C 와 다르게 보이려고"
        en: "To look different from C"
      ok: false
      fb:
        ko: "닮고 안 닮고의 문제가 아닙니다. 세기를 선언으로 다룰 수 있어야 새 기호가 서요."
        en: "Resemblance is not it. Tightness has to be declarable for a new operator to stand."
queries:
  - { grammars: [swift], file: ./operator-precedence.scm }
examples:
  - code: "let r = 1 + 2 * 3"
    expect: { sites: 1, form: mixed, hole: "+", picks: { 1: "+", 2: "1", 3: "2 * 3" } }
  - code: "let s = 1 << 2"
    expect: { sites: 1, form: shift, hole: "<<", picks: { 1: "<<", 2: "1", 3: "2" } }
  - code: "let ok = a && b"
    expect: { sites: 1, form: shortcircuit, hole: "&&", picks: { 1: "&&", 2: "a", 3: "b" } }
  - code: "let n = 42"
    expect: none
