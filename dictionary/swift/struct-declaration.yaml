schema: 1
id: swift/struct-declaration
universal: null
name: { ko: 값으로 도는 묶음 만들기, en: Struct declaration }
token: "struct"
grammars: [swift]
framework: null
essential: true
difficulty: 2
prereq: [swift/assignment, swift/function-declaration, cs/value-vs-reference]
confusions: []
dict:
  one_liner:
    ko: "묶음을 만드는 낱말이 둘이고, 어느 쪽을 골랐느냐가 넘길 때 복사되는지를 정한다."
    en: "Two words make a bundle, and the chosen one settles whether passing copies."
  why:
    ko: >-
      이 언어의 기계 한 문장이 여기 있습니다 — <b>이름에 붙는 것이 값인지 상자인지를 이 낱말이
      정합니다.</b>
      값으로 도는 쪽은 다른 이름에 넣거나 함수에 넘길 때 <b>복사</b>됩니다. 한쪽을 고쳐도
      저쪽은 그대로예요. 상자를 가리키는 쪽은 <b>같은 상자</b>를 가리키게 되어, 한쪽을 고치면
      저쪽에서도 보입니다.
      같은 다섯 줄이 낱말 하나만 바꿔도 답이 1 과 9 로 갈립니다(실측). 그리고 안 바꾸기로 한
      이름의 뜻도 여기서 갈려요 — 값 쪽은 안까지 못 바꾸고 상자 쪽은 안이 바뀝니다.
      화면을 그리는 코드가 값 쪽으로 짜이는 것은 매번 새로 만들어 견주기 때문입니다.
    en: >-
      The language's one-sentence machine sits here: <b>this word settles whether a name holds a
      value or points at a box.</b>
      The value side is <b>copied</b> when put into another name or passed to a function; edit one
      and the other is untouched. The box side makes both names point at <b>the same box</b>, so
      an edit shows on both.
      The same five lines give 1 or 9 depending on that one word (measured). It also settles what a
      fixed name means — on the value side the inside is fixed too; on the box side it is not.
      Screen-drawing code is built out of the value side because it is remade and compared each time.
  trace:
    - ko: "{{site.line}}행이 {{pick.2|code}} 라는 묶음을 세운다."
      en: "Line {{site.line}} sets up a bundle called {{pick.2|code}}."
    - ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 값으로 돌지 상자로 돌지를 정한다."
      en: "{{pick.1|code}} settles whether it travels as a value or as a box."
    - ko: "{{pick.3|code}} 안의 것이 그 묶음이 든 것이다."
      en: "What is inside {{pick.3|code}} is what the bundle holds."
rule:
  ko: "<b>낱말 하나가 복사냐 공유냐를 정한다.</b> 값 쪽은 복사되고 상자 쪽은 같은 것을 가리킨다."
  en: "<b>One word settles copy against share.</b> The value side copies; the box side points."
result:
  label: { ko: "{{site.line}}행의 묶음", en: "the bundle on line {{site.line}}" }
  value: "{{pick.1}} {{pick.2}}"
  note: { ko: "넘길 때의 행동이 여기서 정해진다", en: "how it behaves when passed is settled here" }
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:은,는}} {{pick.1|code}} 이라고 선언돼 넘길 때의 행동이 정해졌습니다."
  en: "{{pick.2|code}} was declared with {{pick.1|code}}, settling how it behaves when passed."
payoff:
  ko: "이걸 알면 「고쳤는데 저쪽이 왜 안 바뀌지」가 풀립니다 — 복사본을 고친 겁니다."
  en: "This untangles “I edited it and the other side did not change” — a copy was edited."
bridge:
  ko: >-
    자바는 이 갈림이 <b>없습니다</b> — 만든 것은 전부 상자예요. C# 은 Swift 와 같이 낱말로
    갈립니다.
  en: >-
    Java has <b>no such split</b> — everything made is a box. C# splits by the word, like Swift.
misconceptions:
  # swift.md §9 ⑤ · §11.3.1 실측 (같은 다섯 줄에서 1 대 9).
  - ko: "다른 이름에 넣으면 같은 것을 가리킨다 — 값 쪽은 복사됩니다."
    en: "Putting it in another name shares it — the value side copies."
  - ko: "안 바꾸기로 하면 안까지 잠긴다 — 상자 쪽은 안이 바뀝니다."
    en: "A fixed name freezes the inside — on the box side it does not."
  - ko: "값 쪽은 작은 것에만 쓴다 — 화면 코드 전체가 값 쪽으로 짜여 있습니다."
    en: "The value side is only for small things — whole screens are built out of it."
point:
  - q:
      ko: "{{site.line}}행에서 <b>복사되는지 공유되는지를 정하는 낱말</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the word that settles copy against share</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 묶음의 <b>이름</b>입니다. 이름은 복사냐 공유냐를 안 정해요."
          en: "{{pick.2|code}} is the bundle's <b>name</b>. A name settles nothing about copying."
        edge:
          h: { ko: "가장 날카로운 자리 — 이름이냐 낱말이냐", en: "The sharpest spot — the name or the word" }
          code:
            - "struct P { var n = 1 }   // 복사된다"
            - "class P { var n = 1 }    // 공유된다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 묶음이 <b>담은 것</b>입니다. 담은 것이 같아도 앞 낱말이 다르면 행동이 달라요."
          en: "{{pick.3|code}} is <b>what the bundle holds</b>. Identical contents still behave differently under a different word."
        edge:
          h: { ko: "가장 날카로운 자리 — 담은 것이냐 낱말이냐", en: "The sharpest spot — the contents or the word" }
          code:
            - "struct A { var n = 1 }"
            - "class B { var n = 1 }"
meaning:
  - q:
      ko: "값으로 도는 묶음을 다른 이름에 넣고 그 이름 쪽을 고치면 원래 이름은 어떻게 될까요?"
      en: "Put a value bundle into another name and edit that one — what happens to the first?"
    options:
      - t:
          ko: "그대로다 — 복사본을 고친 것이다"
          en: "Unchanged — a copy was edited"
      - t:
          ko: "같이 바뀐다"
          en: "It changes too"
        diag:
          t:
            ko: "그건 <b>상자를 가리키는</b> 쪽의 답입니다. 같은 다섯 줄에서 낱말만 바꾸면 답이 1 과 9 로 갈려요(실측)."
            en: "That is the <b>box side's</b> answer. In the same five lines, changing only the word gives 1 against 9 (measured)."
          edge:
            h: { ko: "가장 날카로운 자리 — 값이냐 상자냐", en: "The sharpest spot — value or box" }
            code:
              - "var a = P(); var b = a; b.n = 9   // a.n 은 1"
              - "let c = C(); let d = c; d.n = 9   // c.n 은 9"
      - t:
          ko: "빌드가 멈춘다"
          en: "The build stops"
        diag:
          t:
            ko: "복사는 올바른 코드입니다. 멈추는 자리는 <b>안 바꾸기로 한</b> 값 쪽 이름의 안을 고칠 때예요."
            en: "Copying is valid code. The build stops when the inside of a <b>fixed</b> value name is edited."
      - t:
          ko: "복사되지만 안쪽 값은 공유된다"
          en: "It copies but the inner values are shared"
        diag:
          t:
            ko: "안쪽도 값이면 함께 복사됩니다. 안쪽에 상자를 가리키는 것이 들어 있을 때만 그쪽이 공유돼요."
            en: "Inner values copy along. Sharing shows only where an inner field points at a box."
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행의 묶음은 넘길 때 <b>복사됩니다</b>."
      en: "Choose what goes in the blank. The bundle on line {{site.line}} <b>copies</b> when passed."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "struct", mono: true }
      - t: "class"
        mono: true
        diag:
          t:
            ko: "이 낱말은 <b>상자</b>를 만듭니다. 넘겨도 복사되지 않고 같은 상자를 가리켜서, 한쪽을 고치면 저쪽에서도 보여요."
            en: "That word makes a <b>box</b>. Passing shares it, so an edit on one side shows on the other."
          edge:
            h: { ko: "가장 날카로운 자리 — 복사냐 공유냐", en: "The sharpest spot — copy or share" }
            code:
              - "struct P { var n = 1 }"
              - "class C { var n = 1 }"
      - t: "enum"
        mono: true
        diag:
          t:
            ko: "이 낱말은 <b>갈래의 목록</b>을 만듭니다. 값으로 돌기는 하지만 속성을 늘어놓는 자리가 아니에요."
            en: "That word makes a <b>list of cases</b>. It travels as a value but is not where stored fields go."
      - t: "protocol"
        mono: true
        diag:
          t:
            ko: "이 낱말은 <b>지켜야 할 규약</b>을 적습니다. 값을 담지 않고, 담는 쪽이 그것을 지킨다고 선언해요."
            en: "That word writes a <b>contract</b>. It stores nothing; the storing type declares that it keeps it."
why_gate:
  q:
    ko: "화면을 그리는 코드는 왜 <b>값으로 도는 쪽</b>으로 짜일까요?"
    en: "Why is screen-drawing code built out of the <b>value side</b>?"
  choices:
    - t:
        ko: "화면은 매번 새로 만들어져 이전 것과 견주어지는데, 값으로 돌면 복사본끼리 견주는 것이 안전하기 때문"
        en: "Because a screen is remade and compared each time, and comparing copies is safe"
      ok: true
      fb:
        ko: "그 방향입니다. 상자 쪽으로 짰다면 무엇이 어려워지는지도 적어 보세요."
        en: "That is the direction. Say what gets harder on the box side, too."
    - t:
        ko: "값으로 도는 쪽이 메모리를 덜 써서"
        en: "Because the value side uses less memory"
      ok: false
      fb:
        ko: "덜 쓴다고 단정할 수 없습니다. 복사가 늘 수도 있어요 — 이유는 견주기입니다."
        en: "That is not given; copies can pile up. The reason is comparison."
    - t:
        ko: "상자 쪽에는 속성을 못 넣어서"
        en: "Because the box side cannot hold fields"
      ok: false
      fb:
        ko: "넣을 수 있습니다. 갈리는 것은 담는 능력이 아니라 넘길 때의 행동이에요."
        en: "It can. What differs is not what they hold but how they travel."
queries:
  - { grammars: [swift], file: ./struct-declaration.scm }
examples:
  - code: "struct Point { var x = 0 }"
    expect: { sites: 1, form: struct, hole: "struct", picks: { 1: "struct", 2: "Point" } }
  - code: "final class Box { var n = 0 }"
    expect: { sites: 1, form: class, hole: "class", picks: { 1: "class", 2: "Box" } }
  - code: "enum Kind { case one }"
    expect: none
