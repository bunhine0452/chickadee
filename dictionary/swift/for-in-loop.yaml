schema: 1
id: swift/for-in-loop
universal: common/iterate
name: { ko: 하나씩 훑기, en: For-in loop }
token: "for"
grammars: [swift]
framework: null
essential: true
difficulty: 2
prereq: [swift/assignment]
confusions: []
dict:
  one_liner:
    ko: "모아 둔 것을 앞에서부터 하나씩 꺼내고, 꺼낸 것마다 새 이름이 생긴다."
    en: "It pulls one thing at a time from a collection, giving each a fresh name."
  why:
    ko: >-
      Swift 에는 <b>세 칸짜리 되풀이가 없습니다.</b> 3.0 에서 삭제됐고, 그 자리를 이 모양이
      전부 가져갔어요. 그래서 「몇 번 도나」를 세는 방법이 하나입니다 — 훑는 대상이 몇 개인가.
      번호가 필요하면 범위를 만들어 훑고, 번호와 값이 둘 다 필요하면 짝을 만들어 훑습니다.
      한 가지가 중요합니다: 꺼낸 것에 붙는 이름은 <b>한 바퀴마다 새로 생기고</b> 바퀴가 끝나면
      사라집니다. 그 이름은 바꿀 수 없고, 바깥에서는 쓸 수 없어요.
    en: >-
      Swift has <b>no three-slot loop.</b> It was removed in 3.0 and this shape took the whole
      job. So counting laps has one method: how many items are being walked. Need an index and
      you walk a range; need both index and value and you walk pairs.
      One thing matters: the name bound to each item is <b>made fresh every lap</b> and is gone
      when the lap ends. It cannot be moved, and outside the loop it does not exist.
  trace:
    - ko: "{{site.line}}행이 {{pick.3|code}}에서 항목을 하나 꺼낸다."
      en: "Line {{site.line}} pulls one item out of {{pick.3|code}}."
    - ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 그 항목의 이름이 되고 몸통이 한 바퀴 돈다."
      en: "{{pick.2|code}} names that item and the body runs one lap."
    - ko: "더 꺼낼 것이 없으면 끝난다."
      en: "When nothing is left to pull, it ends."
rule:
  ko: "<b>바퀴 수는 훑는 대상이 정한다.</b> 항목마다 새 이름이 생기고 바퀴가 끝나면 사라진다."
  en: "<b>The collection sets the lap count.</b> Each item gets a fresh name that ends with the lap."
result:
  label: { ko: "{{site.line}}행의 되풀이", en: "the loop on line {{site.line}}" }
  value: "{{pick.2}} in {{pick.3}}"
  note: { ko: "항목 수만큼 돈다", en: "as many laps as there are items" }
ok:
  ko: "{{pick.3|code}}의 항목마다 {{pick.2|code}}{{pick.2|josa:이,가}} 새로 붙습니다."
  en: "For each item of {{pick.3|code}}, {{pick.2|code}} is bound afresh."
payoff:
  ko: "이걸 알면 「바깥에서 그 이름을 못 쓴다」가 풀립니다 — 바퀴와 함께 사라지는 이름입니다."
  en: "This untangles “that name does not exist outside” — it ends with the lap."
bridge:
  ko: >-
    C·자바에는 시작·조건·증가를 한 줄에 모은 모양이 따로 있습니다. Swift 는 그것을 <b>지웠고</b>
    번호가 필요하면 범위를 훑어요.
  en: >-
    C and Java keep a shape that gathers start, test and step on one line. Swift <b>removed</b> it;
    an index means walking a range.
misconceptions:
  - ko: "꺼낸 이름을 바꿀 수 있다 — 못 바꿉니다. 바꾸려면 새 이름을 안에서 만들어야 해요."
    en: "The bound name can be moved — it cannot. Make a new name inside instead."
  - ko: "훑는 도중에 원본을 고칠 수 있다 — 값으로 도는 모음은 훑는 쪽이 복사본이라 안 비칩니다."
    en: "The source can be edited mid-walk — for value collections the walk holds a copy, so it does not show."
  - ko: "이름이 바깥에도 남는다 — 바퀴가 끝나면 사라집니다."
    en: "The name survives outside — it ends with the lap."
point:
  - q:
      ko: "{{site.line}}행에서 <b>훑을 대상</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the thing being walked</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.3
    diag:
      pick.1:
        t:
          ko: "{{pick.1|code}}{{pick.1|josa:은,는}} <b>낱말</b>입니다. 되풀이라는 것만 알리고 몇 바퀴 돌지는 안 정해요."
          en: "{{pick.1|code}} is the <b>word</b>. It announces a loop; it does not set the lap count."
        edge:
          h: { ko: "가장 날카로운 자리 — 낱말이냐 대상이냐", en: "The sharpest spot — the word or the collection" }
          code:
            - "for x in items { }    // items 의 개수만큼"
            - "for x in 0..<3 { }    // 세 바퀴"
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 꺼낸 항목에 붙는 <b>이름</b>입니다. 이름은 바퀴 수를 안 정해요."
          en: "{{pick.2|code}} is the <b>name</b> bound to each item. A name does not set the lap count."
        edge:
          h: { ko: "가장 날카로운 자리 — 이름이냐 대상이냐", en: "The sharpest spot — the name or the collection" }
          code:
            - "for x in items { }"
            - "for anything in items { }   // 바퀴 수는 같다"
meaning:
  - q:
      ko: "{{site.line}}행에서 꺼낸 항목의 이름은 어디까지 살까요?"
      en: "How long does the name bound to each item live?"
    options:
      - t:
          ko: "한 바퀴 안에서만 살고 바퀴가 끝나면 사라진다"
          en: "Only within one lap; it is gone when the lap ends"
      - t:
          ko: "되풀이가 끝난 뒤에도 마지막 값으로 남는다"
          en: "It survives with the last value after the loop"
        diag:
          t:
            ko: "그 규칙을 쓰는 언어가 있어 헷갈리는 자리입니다. Swift 에서는 바깥에서 그 이름을 적으면 빌드가 멈춰요."
            en: "Some languages do keep it, which is why this trips people. In Swift, naming it outside stops the build."
          edge:
            h: { ko: "가장 날카로운 자리 — 안이냐 밖이냐", en: "The sharpest spot — inside or outside" }
            code:
              - "for x in items { use(x) }"
              - "use(x)   // 빌드가 멈춘다"
      - t:
          ko: "바깥에 같은 이름이 있으면 그것을 옮긴다"
          en: "If an outer name matches, it moves that one"
        diag:
          t:
            ko: "바깥 이름은 그대로입니다. 안쪽 이름이 <b>새로</b> 생겨 바깥을 가리는 것뿐이에요."
            en: "The outer name is untouched. A <b>new</b> inner name is made and it shadows the outer one."
      - t:
          ko: "모든 바퀴가 같은 이름 하나를 나눠 쓴다"
          en: "Every lap shares one name"
        diag:
          t:
            ko: "바퀴마다 새로 생깁니다. 그래서 클로저가 그 이름을 붙잡아도 바퀴마다 다른 값을 붙잡아요."
            en: "It is made fresh each lap, which is why a closure that captures it captures a different value each time."
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 모아 둔 것을 <b>하나씩 꺼내</b> 돕니다."
      en: "Choose what goes in the blank. Line {{site.line}} walks a collection <b>one item at a time</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "for", mono: true }
      - t: "while"
        mono: true
        diag:
          t:
            ko: "이건 <b>조건</b>이 참인 동안 돕니다. 항목을 꺼내 주지 않아서 번호를 손으로 올려야 하고, 안 올리면 안 끝나요."
            en: "That runs while a <b>test</b> holds. It pulls nothing, so the index has to be raised by hand — and if it is not, it never ends."
          edge:
            h: { ko: "가장 날카로운 자리 — 꺼내 주나 안 주나", en: "The sharpest spot — does it pull for you" }
            code:
              - "for x in items { }"
              - "var i = 0; while i < n { i += 1 }"
      - t: "repeat"
        mono: true
        diag:
          t:
            ko: "이건 조건을 <b>뒤에서</b> 보는 되풀이라 몸통이 적어도 한 번은 돕니다. 빈 모음에서도 한 번 돌아요."
            en: "That reads its test <b>at the end</b>, so the body always runs at least once — even on an empty collection."
      - t: "if"
        mono: true
        diag:
          t:
            ko: "이건 <b>갈림</b>이라 한 번만 봅니다. 참이면 안이 한 번 돌고 끝이에요."
            en: "That is a <b>branch</b> and reads once. Holding runs the inside once and it is done."
why_gate:
  q:
    ko: "Swift 는 왜 세 칸짜리 되풀이를 <b>지웠을까요</b>?"
    en: "Why did Swift <b>remove</b> the three-slot loop?"
  choices:
    - t:
        ko: "번호를 손으로 굴리는 자리가 없어지면 범위를 벗어나는 실수와 끝나지 않는 실수가 함께 사라지기 때문"
        en: "Because taking the hand-rolled index away removes both out-of-range and never-ending mistakes at once"
      ok: true
      fb:
        ko: "그 방향입니다. 그 대신 번호가 정말 필요할 때 무엇을 훑는지도 적어 보세요."
        en: "That is the direction. Say what gets walked when an index really is needed, too."
    - t:
        ko: "세 칸짜리가 느려서"
        en: "Because the three-slot form was slow"
      ok: false
      fb:
        ko: "속도 문제가 아닙니다. 손으로 굴리는 번호가 실수의 자리라는 것이 이유예요."
        en: "Speed is not it. The hand-rolled index was the place mistakes lived."
    - t:
        ko: "중괄호를 줄이려고"
        en: "To cut down on braces"
      ok: false
      fb:
        ko: "중괄호는 그대로입니다. 사라진 것은 괄호 안의 세 칸이에요."
        en: "The braces are unchanged. What went is the three slots in the brackets."
queries:
  - { grammars: [swift], file: ./for-in-loop.scm }
examples:
  - code: "func f() { for item in items { g(item) } }"
    expect: { sites: 1, form: forin, hole: "for", picks: { 1: "for", 2: "item", 3: "items" } }
  - code: "func f() { for i in 0..<n { g(i) } }"
    expect: { sites: 1, form: forin, hole: "for", picks: { 1: "for", 2: "i", 3: "0..<n" } }
  - code: "func f() { while n > 0 { n -= 1 } }"
    expect: none
