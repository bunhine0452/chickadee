lang: swift
version: 0.1.0
grammars: [swift]
# tree-sitter-swift 0.7.3 (alex-pinkus · MIT) 의 `parser.c` 가 **15** 다 — 이 리포의 다른
# 문법 대부분은 14 이고 `javascript` 만 15 다. 대조는 시험이 한다
# (`declared_grammar_abi_matches_the_linked_grammar`). 실측으로도 확인했다: `languages()` 가
# `swift → abi 15 · node kinds 563` 을 보고한다.
grammar_abi: { swift: 15 }

extensions:
  swift: [.swift]

# 정식 코스 0~3부 (D177 · D190). 정본은 `docs/curriculum/swift.md` §0.5 의 부 표다.
# **0부와 1부는 합성 예제**, **2부는 합성 + 내 코드**, 3부는 프레임워크 사전인데
# `swiftui/` 는 아직 한 장도 없다 — 그래서 `parts/swift.ts` 의 3부가 빈 목록이다.
#
# 0부는 여덟이다(축 여덟이 전부 서고 어긋남 판을 따로 안 세웠다 — swift.md §0). 신규
# `essential` 여덟은 README §12 규약 8 의 상한 열둘 안이다.
#
# **배열 규칙 — 사용처가 얇은 판을 셋 이상 잇대지 않는다** (`ts`·`py` 가 세운 것과 같다).
# 얇음의 선은 표본에서 사용처 **100곳 미만**이다. 표본은 공개 리포 하나
# (`Dimillian/IceCubesApp` · SwiftUI · 428파일)와 사용자 리포의 `.swift` 한 장(`ECC` 의
# 아이콘 생성 스크립트)뿐이다 — 사용자 리포에 Swift 앱이 없다는 것 자체가 swift.md §11.5.3 이
# 적어 둔 사실이고, 그래서 여기 수치는 **내 코드가 아니라 남의 코드**에서 잰 것이다.
#
# 얇은 여덟(2026-09-06 tree-sitter 실측, IceCubesApp 428파일 기준 곳/파일):
# float-literal 37/15 · for-in-loop 64/31 · force-unwrap 65/35 · generics 25/9 ·
# capture-list 10/5 · while-repeat 9/9 · mutating-method 2/1 · **arc-weak 0/0**.
# 아래 순서에서 이 여덟은 두꺼운 판 사이에 하나씩(끝의 arc-weak·capture-list 만 둘) 놓인다.
essential:
  # ── 0부 「이 언어의 값과 식」 여덟 (swift.md §0.1) ───────────────────────────
  - swift/integer-literal      # 축 1 정수
  - swift/float-literal        # 축 2 실수 · 얇다 (37곳)
  - swift/text-literal         # 축 3 문자
  - swift/boolean-literal      # 축 4 참거짓
  - swift/operator-precedence  # 축 5 연산자
  - swift/type-conversion      # 축 6 형 변환
  - swift/assignment           # 축 7 대입 — §2 ① let-var 와 §3 ① assignment 를 한 장으로 (§0.5)
  - swift/equality             # 축 8 비교
  # ── 1부 「흐름과 묶기」 넷 (swift.md §2 — 값 층위 넷은 0부가 가져갔다) ────────
  - swift/if-statement
  - swift/for-in-loop          # 얇다 (64곳 — SwiftUI 는 ForEach 가 그 자리를 가져갔다)
  - swift/function-declaration
  - swift/return-statement
  # ── 2부 「Swift 의 타입」 스물다섯 (swift.md §3 열다섯 + §4 열) ──────────────
  - swift/string-interpolation
  - swift/array-subscript
  - swift/while-repeat         # 얇다 (9곳 · repeat-while 은 0곳)
  - swift/optional-type
  - swift/if-let
  - swift/guard-let
  - swift/nil-coalescing
  - swift/optional-chaining
  - swift/force-unwrap         # 얇다 (65곳)
  - swift/closure-trailing
  - swift/map-filter
  - swift/struct-declaration
  - swift/mutating-method      # 얇다 (2곳/1파일)
  - swift/protocol-conformance
  - swift/enum-associated-value
  - swift/switch-exhaustive
  - swift/extension
  - swift/throws-try
  - swift/async-await
  - swift/generics             # 얇다 (25곳)
  - swift/some-any
  - swift/arc-weak             # **0곳** — 「네 코드엔 없다」 판이다 (아래 주석)
  - swift/capture-list         # 얇다 (10곳)
  - swift/property-wrapper
  - swift/result-builder

# 「AI 가 대신 쓴 것」 — 구멍 개념 ↔ 같은 일을 하는 다른 표기.
#
# **비워 둔다.** 가장 그럴듯한 짝(`swift/force-unwrap` ↔ `swift/guard-let`)이 표본에서
# 한쪽으로 크게 기울지 않는다 — 강제 해제 65곳/35파일 대 `guard let` 255곳/77파일이라
# 「없는 쪽을 다른 표기가 대신 썼다」가 아니라 둘 다 흔한 것이다. 짝이 부기할 것이 없으면
# 패널이 빈 줄을 낸다. 사용자 리포에 Swift 앱이 서면 그때 다시 잰다.
alternatives: []

thin_threshold: { min_files: 2, min_sites: 3, small_repo_files: 20 }

# 「네 코드엔 없다」 — 표본에서 사용처가 **0곳**인 판 하나 (D177 규칙 ① · D186 ④).
#
# `swift/arc-weak` 은 `IceCubesApp` 428파일에서 `weak var`·`unowned` 가 **0곳**이다
# (tree-sitter 실측과 grep 이 같은 값을 낸다). 없어서 0곳이 아니라 **그 자리를 다른 표기가
# 가져갔다**: 같은 리포에서 `[weak self]` 캡처 목록이 10곳/5파일이고, 상태는 `@Observable`
# 클래스와 값 타입이 들고 있어 서로를 가리키는 저장 속성이 안 생긴다. 사유는 `idiom` 이다 —
# `scale`(규모가 작아서)이 아니다. 428파일은 작지 않다.
#
# `packages/cards/src/t0-synthetic.ts` 의 `ABSENCE` 표에
# `'swift/arc-weak': 'idiom'` 한 줄이 서야 합성 판이 그 사유를 화면에 말할 수 있다
# (그 파일은 이 사전의 소유가 아니라 오케스트레이터가 넣는다).
#
# 얇은 둘(`mutating-method` 2곳/1파일 · `while-repeat` 9곳/9파일)은 **부재가 아니다** —
# `thin_threshold`(min_files 2 · min_sites 3)를 `while-repeat` 은 넘고 `mutating-method` 는
# 파일 하나라 못 넘는다. 후자는 리포에 따라 「얇음」으로 떨어질 수 있고 그것이 맞다.

diag_default:
  point:
    ko: "«{{pick}}»{{pick|josa:은,는}} {{role}} 자리입니다. {{concept}}{{concept|josa:은,는}} «{{answer}}» 입니다. {{rule}}"
    en: "«{{pick}}» is the {{role}} slot. The {{concept}} is «{{answer}}». {{rule}}"
  blank:
    ko: "«{{pick}}»{{pick|josa:은,는}} 이 자리에 오지 않습니다. {{rule}}"
    en: "«{{pick}}» does not go in this slot. {{rule}}"
