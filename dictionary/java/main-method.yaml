schema: 1
id: java/main-method
# 2부 (`docs/curriculum/java.md` §4 #10). `common/entry-point` 을 걸 자리인데 `common/` 34장에
# 그 개념이 없다 — 새 `common/` 은 이 세션이 만들지 않는다(README §12 규약 4). 후보로만 낸다.
universal: null
name: { ko: 프로그램이 시작하는 자리, en: Entry point }
token: "main"
grammars: [java]
framework: null
essential: true
difficulty: 2
prereq: [java/method-declaration, java/static, java/array, cs/compile-and-run]
confusions: []

dict:
  one_liner:
    ko: "실행을 시작하는 메서드의 이름은 내가 고르는 것이 아니라 JVM 이 찾는 글자다."
    en: "The method that starts a run is found by name, and that name is not yours."
  why:
    ko: >-
      자바 파일에는 <b>맨 위에서부터 실행되는 코드가 없습니다</b>. 모든 것이 클래스 안에 있고,
      클래스는 그냥 놓여 있을 뿐이에요. 그래서 「어디서부터 도나」를 누군가 정해야 하는데,
      그 답이 {{site.line}}행의 이름 하나입니다 — JVM 이 시작할 때 <b>그 글자를 가진 메서드</b>를
      찾습니다. 한 글자만 달라도 못 찾고, 그때 나오는 말이
      <code>main method not found</code> 예요.
      나머지 셋은 왜 붙어 있나. {{pick.4|code}}{{pick.4|josa:은,는}} <b>상자를 안 만들고도 부를 수 있게</b> 하고
      (아직 아무 상자도 없으니까), 밖에서 보이게 합니다. {{pick.1|code}}{{pick.1|josa:은,는}} 돌려줄 것이
      없다는 표시이고, {{pick.3|code}}{{pick.3|josa:은,는}} 명령줄에서 준 낱말들이 들어오는 자리입니다.
      <b>지금 알 것은 이 다섯이 각각 다른 개념이라는 것 하나</b>이고, 넷은 이미 배웠거나 곧 배웁니다.
    en: >-
      A Java file has <b>no code that runs from the top</b>. Everything sits inside a class, and a
      class just sits there. So someone has to settle where the running begins, and the answer is the
      one name on line {{site.line}} — at start-up the JVM looks for <b>the method carrying that
      word</b>. One letter off and it is not found, which is what
      <code>main method not found</code> means.
      Why the other three are there: {{pick.4|code}} makes it callable <b>without making a box</b>
      (there is no box yet) and visible from outside, {{pick.1|code}} says nothing comes back, and
      {{pick.3|code}} is where words from the command line arrive.
      <b>What matters today is only that these five are five different ideas</b>; four of them are
      already learned or are coming.
  trace:
    - ko: "{{site.line}}행의 {{pick.2|code}}{{pick.2|josa:이,가}} JVM 이 찾는 글자다."
      en: "The {{pick.2|code}} on line {{site.line}} is the word the JVM looks for."
    - ko: "{{pick.4|code}} 덕분에 상자를 안 만들고도 부를 수 있다."
      en: "{{pick.4|code}} makes it callable without a box."
    - ko: "{{pick.3|code}} 자리로 명령줄의 낱말이 들어온다."
      en: "Words from the command line arrive at {{pick.3|code}}."

rule:
  ko: "<b>시작점은 이름으로 정해진다.</b> 앞뒤에 붙은 것들은 그 이름을 부를 수 있게 하는 조건이다."
  en: "<b>The start is fixed by a name.</b> Everything around it is what makes that name callable."
result:
  label: { ko: "{{site.line}}행이 여는 것", en: "what line {{site.line}} opens" }
  value: "{{pick.1}} {{pick.2}}{{pick.3}}"
  note: { ko: "여기서부터 돈다", en: "running starts here" }
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:을,를}} 짚었습니다. JVM 이 이 글자를 찾아 첫 줄을 시작합니다."
  en: "You pointed at {{pick.2|code}}. The JVM finds this word and starts the first line there."
payoff:
  ko: >-
    이걸 알면 낯선 리포에서 <b>어느 파일부터 읽을지</b>가 정해집니다 — 이 이름이 있는 파일이
    하나뿐이고, 그 파일이 이야기의 첫 줄이에요.
  en: >-
    Knowing this settles <b>which file to read first</b> in an unfamiliar repo — only one file carries
    this name, and that file is the first line of the story.
bridge:
  ko: >-
    파이썬은 파일이 그냥 위에서부터 돌고, 시작점 표시는 <b>관습</b>입니다(<code>if __name__ ==</code> …).
    자바는 관습이 아니라 <b>규격</b>이라 없으면 실행 자체가 안 시작돼요.
  en: >-
    In Python a file simply runs from the top and the entry marker is a <b>convention</b>
    (<code>if __name__ ==</code> …). Here it is a <b>rule</b>, so without it nothing starts at all.
misconceptions:
  - ko: "이름은 아무거나 지어도 된다 — JVM 이 찾는 글자가 정해져 있어 한 글자만 달라도 못 찾습니다."
    en: "Any name works — the JVM looks for one fixed word, and one letter off means not found."
  - ko: "파일이 위에서부터 돈다 — 자바 파일에는 클래스 밖에서 도는 줄이 없습니다."
    en: "The file runs from the top — a Java file has no line that runs outside a class."
  - ko: "이 줄 앞의 낱말들은 장식이다 — 상자 없이 부르려면 그 표시가 있어야 합니다."
    en: "The words before it are decoration — without them it cannot be called with no box."
  - ko: "스프링 앱에는 이 줄이 없다 — 있습니다. 그 한 줄이 프레임워크를 띄우는 호출을 합니다."
    en: "A Spring app has no such line — it does; that one line makes the call that boots the framework."

point:
  - q:
      ko: "{{site.line}}행에서 <b>JVM 이 찾는 글자</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the word the JVM looks for</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.2
    diag:
      pick.4:
        t:
          ko: >-
            {{pick.4|code}}{{pick.4|josa:은,는}} <b>부를 수 있게 하는 조건</b>입니다. 이 표시를 빼면
            부르지 못하지만, 시작점을 <b>고르는</b> 것은 이 표시가 아니라 이름이에요.
          en: >-
            {{pick.4|code}} is <b>what makes it callable</b>. Remove it and it cannot be called, but
            what <b>picks</b> the start is the name, not this.
        edge:
          h: { ko: "가장 날카로운 자리 — 부를 수 있냐 고르냐", en: "The sharpest spot — callable or chosen" }
          code:
            - "public static void main(...)  // 시작한다"
            - "public static void run(...)   // 부를 수는 있다"
      pick.1:
        t:
          ko: >-
            {{pick.1|code}}{{pick.1|josa:은,는}} <b>돌려줄 것이 없다</b>는 표시입니다. 돌려주는 값을
            바꿔도 시작점은 그대로예요 — 이름이 바뀌어야 시작점이 바뀝니다.
          en: >-
            {{pick.1|code}} says <b>nothing comes back</b>. Change what comes back and the start is
            unchanged — only the name moves it.
        edge:
          h: { ko: "가장 날카로운 자리 — 돌려주기냐 이름이냐", en: "The sharpest spot — the return or the name" }
          code:
            - "돌려줄 타입: 무엇이 나오나"
            - "이름:        어디서 시작하나"
      pick.3:
        t:
          ko: >-
            {{pick.3|code}}{{pick.3|josa:은,는}} 명령줄의 낱말이 <b>들어오는 자리</b>입니다.
            아무것도 안 주고 실행해도 시작은 됩니다 — 빈 배열이 들어올 뿐이에요.
          en: >-
            {{pick.3|code}} is <b>where</b> command-line words arrive. Run it with nothing and it still
            starts — an empty array arrives instead.
        edge:
          h: { ko: "가장 날카로운 자리 — 받는 것이냐 시작이냐", en: "The sharpest spot — what arrives or where it starts" }
          code:
            - "java A          // 빈 배열"
            - "java A one two  // 두 낱말"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 <b>JVM 이 실행을 시작하는 자리</b>입니다."
      en: "Choose what goes in the blank. Line {{site.line}} is <b>where the JVM starts a run</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "main", mono: true }
      - t: "start"
        mono: true
        diag:
          t:
            ko: >-
              뜻으로는 맞아 보이지만 JVM 은 이 글자를 <b>안 찾습니다</b>. 컴파일은 되고 실행할 때
              <code>main method not found</code> 가 나와요 — 문법이 아니라 <b>약속</b>이 걸리는 자리입니다.
            en: >-
              It reads right, but the JVM <b>does not look for it</b>. It compiles and then says
              <code>main method not found</code> — this is an <b>agreement</b>, not grammar.
          edge:
            h: { ko: "가장 날카로운 자리 — 컴파일이냐 실행이냐", en: "The sharpest spot — compiling or running" }
            code:
              - "javac: 통과한다"
              - "java : 시작점을 못 찾는다"
      - t: "run"
        mono: true
        diag:
          t:
            ko: >-
              이 글자는 스레드를 돌릴 때 쓰는 이름이라 자바 안에 실제로 있습니다. 다만 <b>프로그램의
              시작점</b>은 아니에요 — 이미 도는 프로그램 안에서 갈래 하나를 여는 이름입니다.
            en: >-
              This word does exist in Java — it is the one a thread runs. It is not <b>the program's
              start</b>, though; it opens a branch inside a program already running.
          edge:
            h: { ko: "가장 날카로운 자리 — 프로그램이냐 갈래냐", en: "The sharpest spot — the program or a branch" }
            code:
              - "시작점:   프로그램이 여기서 열린다"
              - "갈래 시작: 이미 도는 중에 하나 더"
      - t: "init"
        mono: true
        diag:
          t:
            ko: >-
              준비하는 이름처럼 보이지만 JVM 이 찾는 글자가 아닙니다. 준비는 상자를 만들 때 도는
              것이고, <b>상자를 만드는 일 자체가 아직 안 일어났습니다</b>.
            en: >-
              It sounds like setting up, but it is not the word the JVM looks for. Setting up runs when
              a box is made, and <b>no box has been made yet</b>."
          edge:
            h: { ko: "가장 날카로운 자리 — 상자 준비냐 프로그램 시작이냐", en: "The sharpest spot — preparing a box or starting a program" }
            code:
              - "상자 준비: 상자가 있어야 돈다"
              - "시작점:   상자가 하나도 없을 때 돈다"

why_gate:
  q:
    ko: "{{site.line}}행이 <b>상자 없이도 불릴 수 있어야</b> 하는 이유는 무엇일까요?"
    en: "Why must line {{site.line}} be callable <b>with no box</b>?"
  choices:
    - t:
        ko: "실행이 막 시작한 순간이라 아직 아무 상자도 만들어지지 않았기 때문"
        en: "Because the run has just begun and no box has been made yet"
      ok: true
      fb:
        ko: "그 방향입니다. 그러면 누가 첫 상자를 만드는지도 적어 보세요."
        en: "That is the direction. Now say who makes the first box."
    - t:
        ko: "상자를 만드는 것이 느려서"
        en: "Because making a box is slow"
      ok: false
      fb:
        ko: "속도가 아닙니다. 만들 수 있느냐 없느냐의 문제예요 — 만들 코드를 부를 자리가 아직 없습니다."
        en: "Not speed. It is possible-or-not — there is no place yet from which to call the code that makes one."
    - t:
        ko: "자바가 클래스마다 상자를 하나씩 미리 만들어 두기 때문"
        en: "Because Java pre-makes one box per class"
      ok: false
      fb:
        ko: "미리 만들어 두지 않습니다. 상자는 <code>new</code> 가 있을 때만 생겨요."
        en: "Nothing is pre-made. A box appears only where <code>new</code> is written."

queries:
  - { grammars: [java], file: ./main-method.scm }

examples:
  - code: "class A { public static void main(String[] args) { run(args); }}"
    expect:
      sites: 1
      form: main
      hole: "main"
      picks: { 1: "void", 2: "main", 3: "(String[] args)", 4: "public static" }
  - code: "class A { public static void main(String... args) { }}"
    expect: { sites: 1, form: main, picks: { 2: "main", 3: "(String... args)" }}
  - code: "class A { public static void run(String[] args) { }}"
    expect: none
