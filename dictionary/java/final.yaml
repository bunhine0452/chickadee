schema: 1
id: java/final
# 2부 (`docs/curriculum/java.md` §5 #32). 그 표가 `common/immutable-binding` **(신규)** 를 적어
# 뒀는데 `common/` 34장에 없다 — 새 `common/` 은 이 세션이 만들지 않는다(README §12 규약 4).
# 후보로만 내고 여기서는 `null` 이다.
universal: null
name: { ko: 다시 못 넣는 이름, en: final }
token: "final"
grammars: [java]
framework: null
essential: true
difficulty: 3
prereq: [java/field-declaration, java/reference-binding, cs/immutability]
confusions: []

dict:
  one_liner:
    ko: "한 번 넣으면 그 이름에는 다시 못 넣는다. 안에 든 것이 잠기는 것은 아니다."
    en: "Once set, the name cannot be set again. What is inside is not locked."
  why:
    ko: >-
      {{site.line}}행의 표시는 <b>이름에</b> 걸립니다. 이름이 한 번 가리키고 나면 다른 것을
      가리키게 못 바꾼다는 뜻이고, 다시 넣으려 하면 <b>컴파일이 멈춥니다</b>.
      여기가 미끄러운 자리예요 — 잠기는 것은 <b>가리키는 것</b>이지 <b>가리켜진 것</b>이
      아닙니다. <code>final List&lt;String&gt; xs</code> 여도 <code>xs.add("a")</code> 는
      됩니다. 목록은 그대로 그 목록이고 안이 바뀔 뿐이니까요. 못 하는 것은
      <code>xs = new ArrayList&lt;&gt;()</code> 하나입니다.
      원시 타입에서는 이 구별이 안 보입니다 — 이름 안에 값이 통째로 있어서, 이름을 잠그면
      값도 같이 잠긴 것처럼 보여요. 참조 타입에서 비로소 둘이 갈립니다.
    en: >-
      The word on line {{site.line}} binds <b>the name</b>. Once the name points at something it
      cannot be made to point elsewhere, and trying to set it again <b>stops the compiler</b>.
      This is the slippery part: what is locked is <b>the pointing</b>, not <b>what is pointed at</b>.
      Even with <code>final List&lt;String&gt; xs</code>, <code>xs.add("a")</code> works — it is still
      the same list, only its contents moved. The one thing barred is
      <code>xs = new ArrayList&lt;&gt;()</code>.
      With primitive types the distinction is invisible, because the value sits inside the name; lock
      the name and the value looks locked too. Only with references do the two come apart.
  trace:
    - ko: "{{site.line}}행의 {{pick.1|code}}{{pick.1|josa:은,는}} 이름 {{pick.3|code}} 에 걸린다."
      en: "The {{pick.1|code}} on line {{site.line}} binds the name {{pick.3|code}}."
    - ko: "그래서 {{pick.3|code}} 에 다시 넣는 줄은 컴파일이 멈춘다."
      en: "So a line that sets {{pick.3|code}} again stops the compiler."
    - ko: "{{pick.2|code}} 안의 내용은 여전히 바뀔 수 있다."
      en: "What is inside {{pick.2|code}} can still change."

rule:
  ko: "<b>잠기는 것은 이름이다.</b> 다시 가리키지 못할 뿐, 가리켜진 것의 안은 그대로 바뀐다."
  en: "<b>The name is what locks.</b> It cannot re-point; what it points at still changes inside."
result:
  label: { ko: "{{site.line}}행의 이름", en: "the name on line {{site.line}}" }
  value: "{{pick.1}} {{pick.2}} {{pick.3}}"
  note: { ko: "다시 넣기만 막힌다", en: "only re-setting is barred" }
ok:
  ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 이제 다시 못 넣는 이름입니다. 안의 내용은 그대로 열려 있어요."
  en: "{{pick.3|code}} is now a name that cannot be set again. Its contents stay open."
payoff:
  ko: >-
    이걸 알면 「<code>final</code> 을 붙였는데 왜 값이 바뀌지」가 풀립니다 — 바뀐 것은 값이 아니라
    <b>그 안</b>이에요.
  en: >-
    Knowing this untangles “I wrote <code>final</code>, so why did it change” — what changed was not
    the value but <b>what is inside it</b>.
bridge:
  ko: >-
    파이썬에는 이 표시가 없고 대문자 이름이 <b>약속</b>일 뿐입니다. 자바스크립트의
    <code>const</code> 는 이것과 <b>같은 규칙</b>이에요 — 다시 넣기만 막고 안은 안 잠급니다.
  en: >-
    Python has no such word; an upper-case name is only a <b>convention</b>. JavaScript's
    <code>const</code> follows <b>the same rule</b> — it bars re-setting and leaves the inside open.
misconceptions:
  # §10 오개념 4 (`docs/curriculum/java.md`). progmiscon.org Java 목록의 이름만 참고.
  - ko: "붙이면 안의 값도 못 바꾼다 — 다시 가리키지 못할 뿐입니다. <code>xs.add(…)</code> 는 됩니다."
    en: "It also freezes the contents — it only bars re-pointing. <code>xs.add(…)</code> still works."
  - ko: "실행 속도를 위한 표시다 — 규칙을 적는 표시입니다. 빠르기는 이 낱말의 목적이 아닙니다."
    en: "It is written for speed — it is written for a rule. Speed is not its purpose."
  - ko: "붙은 필드는 값을 안 적어도 된다 — 만들 때 한 번은 반드시 넣어야 컴파일이 됩니다."
    en: "A field with it needs no value — it must be set exactly once during construction to compile."
  - ko: "딸리는 곳을 바꾸는 표시다 — 그건 <code>static</code> 입니다. 두 낱말은 다른 축이에요."
    en: "It changes what the member belongs to — that is <code>static</code>. Different axes."

point:
  - q:
      ko: "{{site.line}}행에서 <b>이 이름에 다시 못 넣게 하는 낱말</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the word that bars setting this name again</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: >-
            {{pick.2|code}}{{pick.2|josa:은,는}} <b>무엇을 담나</b>입니다. 담는 것이 무엇이든 다시 넣기는
            따로 막혀야 해요 — 두 낱말이 서로 다른 것을 정합니다.
          en: >-
            {{pick.2|code}} says <b>what it holds</b>. Whatever it holds, re-setting has to be barred
            separately — the two words settle different things.
        edge:
          h: { ko: "가장 날카로운 자리 — 무엇을 담냐 다시 넣냐", en: "The sharpest spot — what it holds or whether it re-sets" }
          code:
            - "List<String> xs;        // 다시 넣을 수 있다"
            - "final List<String> xs;  // 못 넣는다"
      pick.3:
        t:
          ko: >-
            {{pick.3|code}}{{pick.3|josa:은,는}} <b>이름</b> 그 자체입니다. 이름은 규칙을 안 정해요 —
            규칙은 앞에 붙은 낱말이 정합니다.
          en: >-
            {{pick.3|code}} is <b>the name</b> itself. A name settles no rule — the word in front does.
        edge:
          h: { ko: "가장 날카로운 자리 — 이름이냐 규칙이냐", en: "The sharpest spot — the name or the rule" }
          code:
            - "이름:     무엇이라 부르나"
            - "앞 낱말:  다시 넣을 수 있나"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 이 이름에 <b>다시 못 넣게</b> 합니다."
      en: "Choose what goes in the blank. Line {{site.line}} bars <b>setting this name again</b>."
    hint:
      ko: "보기 넷은 전부 같은 자리에 설 수 있는 낱말입니다."
      en: "All four can stand in the same slot."
    options:
      - { t: "final", mono: true }
      - t: "static"
        mono: true
        diag:
          t:
            ko: >-
              <code>static</code> 은 <b>딸리는 곳</b>을 상자에서 틀로 옮깁니다. 다시 넣기는 그대로
              됩니다 — 오히려 프로그램 전체가 함께 보는 값이 되어 고쳐지면 더 넓게 퍼져요.
            en: >-
              <code>static</code> moves <b>what it belongs to</b> from the box to the mould. Re-setting
              still works — and now one change is seen by the whole program.
          edge:
            h: { ko: "가장 날카로운 자리 — 소속이냐 다시 넣기냐", en: "The sharpest spot — belonging or re-setting" }
            code:
              - "static: 상자냐 틀이냐"
              - "이 낱말: 다시 넣을 수 있나"
      - t: "private"
        mono: true
        diag:
          t:
            ko: >-
              <code>private</code> 은 <b>누가 볼 수 있나</b>를 정합니다. 같은 클래스 안에서는 그대로
              다시 넣을 수 있어요 — 보이는 범위와 바꿀 수 있는지는 다른 축입니다.
            en: >-
              <code>private</code> settles <b>who can see it</b>. Inside the same class it can still be
              re-set — visibility and changeability are different axes.
          edge:
            h: { ko: "가장 날카로운 자리 — 보이냐 바뀌냐", en: "The sharpest spot — visible or changeable" }
            code:
              - "private: 밖에서 안 보인다"
              - "이 낱말: 안에서도 못 바꾼다"
      - t: "abstract"
        mono: true
        diag:
          t:
            ko: >-
              <code>abstract</code> 는 <b>몸통을 안 적는다</b>는 표시라 필드에는 아예 못 붙습니다.
              그리고 이 낱말과는 정반대 방향이에요 — 하나는 채우라고 하고 하나는 못 바꾼다고 합니다.
            en: >-
              <code>abstract</code> means <b>no body is written</b> and cannot go on a field at all.
              It also points the other way — one says “fill this in”, this one says “no changing”.
          edge:
            h: { ko: "가장 날카로운 자리 — 채우라냐 못 바꾼다냐", en: "The sharpest spot — fill it in or leave it" }
            code:
              - "abstract: 물려받은 쪽이 채운다"
              - "이 낱말:  한 번 넣으면 끝이다"

why_gate:
  q:
    ko: "{{site.line}}행에 이 표시를 붙여 얻는 것은 무엇일까요?"
    en: "What is gained by putting this word on line {{site.line}}?"
  choices:
    - t:
        ko: "이 이름이 가리키는 것이 도중에 바뀌지 않는다는 것을 컴파일러가 지켜 준다"
        en: "The compiler guarantees this name never re-points midway"
      ok: true
      fb:
        ko: "그 방향입니다. 그 보장이 있으면 무엇을 안 의심해도 되는지도 적어 보세요."
        en: "That is the direction. Now say what you no longer have to suspect."
    - t:
        ko: "그 안에 든 값이 통째로 얼어붙는다"
        en: "The value inside is frozen whole"
      ok: false
      fb:
        ko: "안은 안 얼어붙습니다. <code>xs.add(…)</code> 가 되는 것이 그 증거예요."
        en: "The inside is not frozen. That <code>xs.add(…)</code> works is the proof."
    - t:
        ko: "메모리를 덜 쓴다"
        en: "It uses less memory"
      ok: false
      fb:
        ko: "메모리 이야기가 아닙니다. 이 낱말이 정하는 것은 <b>다시 넣을 수 있나</b> 하나입니다."
        en: "Memory is not the subject. This word settles one thing: whether it can be set again."

queries:
  - { grammars: [java], file: ./final.scm }

examples:
  - code: "class A { private final JwtUtil jwtUtil; }"
    expect:
      sites: 1
      form: field
      hole: "final"
      picks: { 1: "final", 2: "JwtUtil", 3: "jwtUtil" }
  - code: "class A { private final List<String> xs = new ArrayList<>(); }"
    expect: { sites: 1, form: field, picks: { 1: "final", 2: "List<String>", 3: "xs" } }
  - code: "class A { void f() { final int n = 1; } }"
    expect: { sites: 1, form: local, picks: { 1: "final", 2: "int", 3: "n" } }
  - code: "class A { private JwtUtil jwtUtil; }"
    expect: none
