lang: java
version: 0.1.0
grammars: [java]
# tree-sitter-java 0.23.5 의 `parser.c` 가 14 다. 대조는 시험이 한다
# (`declared_grammar_abi_matches_the_linked_grammar`).
grammar_abi: { java: 14 }

extensions:
  java: [.java]

# 정식 자바 코스 3부 (D177 · `docs/curriculum/java.md` §2). 부마다 교재가 다르다 —
# **1부는 합성 예제**, **2부는 합성 + 내 코드**, **3부는 내 코드 중심**(`spring/` · D176).
# 여기 적힌 순서가 부 순서이고, 부 안의 순서는 `prereq` 깊이가 정한다.
#
# 1부 바닥 열셋 — 변수·타입·조건·반복·메서드·배열. 이 부의 개념은 리포에 사용처가 없어도
# 가르친다. 표본 `MonggleMonggle`(자바 99장)에서 `for (;;)` 는 **0곳**, for-each 는 **1곳**,
# 배열은 **1곳**(`String[] args`)이다 — 내 코드만으로는 반복도 배열도 못 가르친다.
#
# 2부 객체 열여섯 — 클래스와 객체·생성·상속과 오버라이드·인터페이스·다형성·캡슐화·
# 컬렉션과 제네릭·예외. `abstract-class`·`generic-bound`·`equals-hashcode` 셋은 그 리포에
# **0곳**이라 합성으로 가르치고 「네 코드엔 없다」를 명시한다(D158 ②).
# `annotation` 이 2부의 끝이고 3부의 문턱이다 — 표시는 자바 문법이지만 그 표시가 런타임에
# 하는 일은 자바에 안 적혀 있다.
essential:
  # 1부 바닥
  - java/class-declaration
  - java/variable-declaration
  - java/assignment
  - java/arithmetic
  - java/boolean-literal
  - java/comparison
  - java/if-statement
  - java/method-declaration
  - java/return-statement
  - java/array
  - java/for-loop
  - java/for-each
  - java/import
  # 2부 객체
  - java/access-modifier
  - java/field-declaration
  - java/new-expression
  - java/constructor
  - java/static
  - java/null
  - java/collection-generic
  - java/interface
  - java/inheritance-override
  - java/abstract-class
  - java/generic-bound
  - java/equals-hashcode
  - java/lambda
  - java/stream-pipeline
  - java/try-catch
  - java/annotation

alternatives: []

thin_threshold: { min_files: 2, min_sites: 3, small_repo_files: 20 }

diag_default:
  point:
    ko: "«{{pick}}»{{pick|josa:은,는}} {{role}} 자리입니다. {{concept}}{{concept|josa:은,는}} «{{answer}}» 입니다. {{rule}}"
    en: "«{{pick}}» is the {{role}} slot. The {{concept}} is «{{answer}}». {{rule}}"
  blank:
    ko: "«{{pick}}»{{pick|josa:은,는}} 이 자리에 오지 않습니다. {{rule}}"
    en: "«{{pick}}» does not go in this slot. {{rule}}"
