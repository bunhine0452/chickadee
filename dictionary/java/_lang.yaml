lang: java
version: 0.1.0
grammars: [java]
# tree-sitter-java 0.23.5 의 `parser.c` 가 14 다. 대조는 시험이 한다
# (`declared_grammar_abi_matches_the_linked_grammar`).
grammar_abi: { java: 14 }

extensions:
  java: [.java]

# 정식 자바 코스 **0~3부** (D177 · 0부는 `docs/curriculum/java.md` §1.5). 부마다 교재가 다르다 —
# **0부와 1부는 합성 예제**, **2부는 합성 + 내 코드**, **3부는 내 코드 중심**(`spring/` · D176).
# 여기 적힌 순서가 부 순서이고, 부 안의 순서는 §1.5.1 의 **축 A~H** 다.
#
# 0부 「이 언어의 값과 식」 **열아홉 판 전부**가 여기 있다 (§1.5.1 축 A~H · §1.5.4 표).
# 전에는 열일곱이었고 `java/string-concat`(표본 16곳/9파일)과 `java/autoboxing`
# (246곳/64파일)이 「0부가 `essential` 에 새로 올리는 것 열둘」 상한 때문에 빠져 있었다.
# 둘을 되돌린 근거 셋 —
#   ① 축 H(`java/reference-equality`)의 대표 예가 `Integer` 캐시다(D187 ⑰). §1.5.1 이 그것을
#      고른 넷째 근거가 「선행이 0부 안에서 닫힌다 — 축 F 의 `java/autoboxing` 에 기댄다」인데,
#      그 개념이 부 배치에 없으면 0부가 **코스에 없는 문법**에 기댄다. `new` 를 뺀 이유와 같다.
#   ② 빠지는 것이 「구멍 지도의 분모와 0장 후보뿐」이 아니었다. `essential` 밖은 T1 블록 카드의
#      대표가 못 된다(`packages/cards/src/t1-block.ts` `pickConcept`) — 표본 99파일 중 64파일에
#      있는 `autoboxing` 이 2단에서 한 번도 안 뜬다.
#   ③ 상한 12 의 원래 근거(0장 상한 24)는 D184 로 폐지됐고, 남은 것은 저작 규모의 상한이다
#      (README §12 규약 8). 그 규약이 스스로 적은 읽는 법 — 「0부가 열둘을 넘으면 값과 식이
#      아니라 기초를 삼키고 있는 것」 — 으로 보면 둘 다 값과 식이다(`1 + 2 + "a"` · `int` ↔ `Integer`).
# 대가: 0부 신규 `essential` 이 14 가 되어 12 를 넘는다. 축은 여덟 그대로다(README §5 가 적은
# 두 읽는 법 중 「축 여덟」쪽을 고른 것이고, 그 결정은 아직 등록부에 없다).
#
# 1부 흐름과 묶기 여덟 — 0부가 값 축을 가져가서 「흐름과 묶기」만 남았다(§1.5.4).
# 표본 `MonggleMonggle`(자바 99장)에서 `for (;;)` 는 **0곳**, for-each 는 **1곳**,
# 배열은 **1곳**(`String[] args`)이다 — 내 코드만으로는 반복도 배열도 못 가르친다.
#
# 2부 객체 **스무 판**. 열여섯은 D177 의 것이고 넷이 2026-09-06 에 붙었다 —
# `main-method`(§4 #10) · `final`(§5 #32) · `checked-exception`(§5 #26) ·
# `generics-erasure`(§5 #28). 넷 다 설계표에는 있는데 사전에 없던 것이다.
# `abstract-class`·`generic-bound`·`equals-hashcode`·`generics-erasure` 넷은 그 리포에 **0곳**
# 이라 합성으로 가르치고 「네 코드엔 없다」를 명시한다(D158 <2>).
# `annotation` 이 2부의 끝이고 3부의 문턱이다 — 새 넷은 그 앞에 선다.
essential:
  # 0부 축 A — 정수형과 그 한계
  - java/value-bits
  - java/variable-declaration
  - java/integer-limit
  # 0부 축 B — 실수형과 왜 안 떨어지나
  - java/floating-type
  - java/float-inexact
  # 0부 축 C — 문자열과 인코딩
  - java/string-literal
  - java/text-length
  # 0부 축 D — 참·거짓
  - java/boolean-literal
  - java/boolean-only-condition
  # 0부 축 E — 연산자와 우선순위
  - java/arithmetic
  - java/operator-precedence
  - java/string-concat
  # 0부 축 F — 형 변환
  - java/implicit-conversion
  - java/explicit-conversion
  - java/autoboxing
  # 0부 축 G — 대입과 이름
  - java/assignment
  - java/reference-binding
  # 0부 축 H — 비교와 같음
  - java/comparison
  - java/reference-equality
  # 1부 흐름과 묶기
  - java/class-declaration
  - java/if-statement
  - java/method-declaration
  - java/return-statement
  - java/array
  - java/for-loop
  - java/for-each
  - java/import
  # 2부 객체
  - java/access-modifier
  - java/field-declaration
  - java/new-expression
  - java/constructor
  - java/static
  - java/null
  - java/collection-generic
  - java/interface
  - java/inheritance-override
  - java/abstract-class
  - java/generic-bound
  - java/equals-hashcode
  - java/lambda
  - java/stream-pipeline
  - java/try-catch
  # 2부 — 2026-09-06 에 붙은 넷 (§4 #10 · §5 #32·#26·#28)
  - java/main-method
  - java/final
  - java/checked-exception
  - java/generics-erasure
  - java/annotation
alternatives: []

thin_threshold: { min_files: 2, min_sites: 3, small_repo_files: 20 }

diag_default:
  point:
    ko: "«{{pick}}»{{pick|josa:은,는}} {{role}} 자리입니다. {{concept}}{{concept|josa:은,는}} «{{answer}}» 입니다. {{rule}}"
    en: "«{{pick}}» is the {{role}} slot. The {{concept}} is «{{answer}}». {{rule}}"
  blank:
    ko: "«{{pick}}»{{pick|josa:은,는}} 이 자리에 오지 않습니다. {{rule}}"
    en: "«{{pick}}» does not go in this slot. {{rule}}"
