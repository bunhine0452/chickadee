schema: 1
id: java/reference-equality
# 0부 축 H. `universal: null` — 파이썬은 `is`/`==` 로, JS 는 `===`/`==` 로 갈리는데 자바는
# **기호 하나와 메서드 하나**로 갈린다. 축은 같아도 표기가 달라 전이가 거짓이 된다 (§1.5.6).
universal: null
name: { ko: 같은 상자냐 같은 내용이냐, en: Same box or same contents }
token: "equals"
grammars: [java]
framework: null
essential: true
difficulty: 2
prereq: [cs/identity-vs-equality, cs/value-vs-reference]
confusions: []
dict:
  one_liner:
    ko: "같음 기호는 같은 상자냐를 묻고, 내용이 같냐는 따로 묻는다."
    en: "The sign asks about the same box; contents are a separate call."
  why:
    ko: >-
      참조 타입에서 <code>==</code> 는 <b>같은 상자인가</b>를 묻습니다. 내용이 같아도 상자가
      둘이면 거짓이에요 — <code>new String("a") == "a"</code> 가 거짓인 이유입니다.
      내용을 묻는 것은 따로 있는 메서드고, 그것이 이 판입니다.
      <b>상자 타입에서는 이 자리가 더 미끄럽습니다.</b> 자바는 작은 정수를 상자로 만들 때
      미리 만들어 둔 것을 돌려주도록 <b>−128~127 범위만</b> 규격이 요구합니다(JLS 5.1.7).
      그 범위 안이면 <code>==</code> 가 참이 되고, <b>범위 밖은 정해져 있지 않습니다</b> —
      거짓이라고 외우면 안 되고, <b>답이 없다</b>가 답입니다. 그래서 상자끼리는 처음부터
      내용으로 견줍니다.
    en: >-
      For reference types <code>==</code> asks <b>whether it is the same box</b>. Same contents
      in two boxes is false — that is why <code>new String("a") == "a"</code> is false. Asking
      about contents is a separate method, and that is this plate.
      <b>With box types the spot gets slipperier.</b> The specification requires cached boxes
      <b>only for −128 through 127</b> (JLS 5.1.7). Inside that range <code>==</code> comes out
      true; <b>outside it, the result is unspecified</b> — do not memorise it as false, because
      <b>there is no answer</b>. Which is why boxes are compared by contents from the start.
  trace:
    - ko: "{{site.line}}행은 {{pick.2|code}} 의 <b>내용</b>을 견준다."
      en: "Line {{site.line}} weighs the <b>contents</b> of {{pick.2|code}}."
    - ko: "{{pick.1|code}} 라는 이름이 그 일을 한다."
      en: "The name {{pick.1|code}} does that work."
    - ko: "같음 기호였다면 같은 상자인지를 물었을 것이다."
      en: "The equality sign would have asked about the box instead."
rule:
  ko: "<b>같음 기호는 상자를, 이 메서드는 내용을 본다.</b> 참조 타입에서 둘은 다른 물음이다."
  en: "<b>The sign weighs the box; this method weighs the contents.</b> For references they differ."
result:
  label: { ko: "{{site.line}}행의 견주기", en: "the comparison on line {{site.line}}" }
  value: "{{pick.2}}.{{pick.1}}({{pick.3}})"
  note: { ko: "내용을 본다", en: "it weighs the contents" }
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:과,와}} {{pick.3|code}} 의 내용을 견주었습니다."
  en: "You weighed the contents of {{pick.2|code}} and {{pick.3|code}}."
payoff:
  ko: "이걸 알면 「글자가 같은데 조건이 안 맞는다」가 풀립니다 — 상자를 견주고 있었어요."
  en: "This untangles “the text matches but the condition fails” — boxes were being weighed."
bridge:
  ko: "파이썬은 <code>==</code> 가 값이고 <code>is</code> 가 자리입니다. 자바는 반대예요."
  en: "In Python <code>==</code> is value and <code>is</code> is place. Java is the other way round."
misconceptions:
  - ko: "같음 기호가 내용을 본다 — 참조 타입에서는 상자를 봅니다. 원시 타입에서만 값을 봐요."
    en: "The sign weighs contents — for references it weighs the box. Only for primitives is it the value."
  - ko: "상자 정수 1000 둘을 같음 기호로 견주면 거짓이다 — <b>정해져 있지 않습니다</b>(JLS 5.1.7). 규격이 요구하는 것은 −128~127 뿐이고, 그 밖은 답이 없습니다."
    en: "Two boxed 1000s under the sign are false — it is <b>unspecified</b> (JLS 5.1.7). Only −128 to 127 is required; beyond that there is no answer."
  - ko: "내용 견주기를 쓰면 없음도 안전하다 — 왼쪽이 없음이면 그 자리에서 터집니다."
    en: "Contents comparison is safe against absence — an absent left side blows up right there."
point:
  - q:
      ko: "{{site.line}}행에서 <b>내용을 견주는 이름</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the name that weighs the contents</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 견주는 <b>한쪽</b>입니다. 이것이 없음이면 견주기 전에 터지고, 견주는 일 자체는 뒤에 붙은 이름이 해요."
          en: "{{pick.2|code}} is <b>one side</b>. If it is absent it blows up before weighing; the weighing is the name after it."
        edge:
          h: { ko: "가장 날카로운 자리 — 한쪽이냐 견주는 이름이냐", en: "The sharpest spot — a side or the weighing name" }
          code:
            - "a;"
            - "a.equals(b);"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 견주는 <b>다른 쪽</b>입니다. 이쪽이 없음이면 터지지 않고 그냥 안 같다고 나와요."
          en: "{{pick.3|code}} is the <b>other side</b>. Absent here it does not blow up — it simply comes out unequal."
        edge:
          h: { ko: "가장 날카로운 자리 — 어느 쪽이 없음일 때 터지나", en: "The sharpest spot — which absent side blows up" }
          code:
            - "a.equals(null);   // 안 같다"
            - "null.equals(a);   // 터진다"
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 <b>내용이 같은지</b>를 묻습니다."
      en: "Choose what goes in the blank. Line {{site.line}} asks <b>whether the contents match</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "equals", mono: true }
      - t: "compareTo"
        mono: true
        diag:
          t:
            ko: "이건 <b>순서</b>를 묻습니다. 참·거짓이 아니라 수가 나와서, 조건 자리에 그대로 두면 그 줄에서 멈춰요."
            en: "That asks about <b>order</b>. It yields a number, not a truth value, so a condition stops on that line."
          edge:
            h: { ko: "가장 날카로운 자리 — 같음이냐 순서냐", en: "The sharpest spot — sameness or order" }
            code:
              - "a.equals(b);       // 참·거짓"
              - "a.compareTo(b);    // 수"
      - t: "contains"
        mono: true
        diag:
          t:
            ko: "이건 <b>안에 들었는지</b>를 묻습니다. 내용이 같지 않아도 참이 될 수 있어요."
            en: "That asks <b>whether it is inside</b>. It can be true when the contents are not the same."
          edge:
            h: { ko: "가장 날카로운 자리 — 같음이냐 포함이냐", en: "The sharpest spot — sameness or containment" }
            code:
              - "\"ab\".equals(\"a\");     // 거짓"
              - "\"ab\".contains(\"a\");   // 참"
      - t: "hashCode"
        mono: true
        diag:
          t:
            ko: "이건 견주는 것이 아니라 <b>수를 하나 만들어</b> 냅니다. 내용이 같으면 이 수도 같아야 하지만, 이 수가 같다고 내용이 같지는 않아요."
            en: "That does not weigh anything — it <b>makes a number</b>. Equal contents must give the same number, but the same number does not mean equal contents."
          edge:
            h: { ko: "가장 날카로운 자리 — 견주기냐 수 만들기냐", en: "The sharpest spot — weighing or making a number" }
            code:
              - "a.equals(b);     // 참·거짓"
              - "a.hashCode();    // 수"
why_gate:
  q:
    ko: "{{site.line}}행은 왜 같음 기호 대신 <b>이 이름</b>을 썼을까요?"
    en: "Why does line {{site.line}} use <b>this name</b> instead of the equality sign?"
  choices:
    - t:
        ko: "견주는 것이 참조 타입이라 기호로는 상자만 견주게 되고, 내용이 같아도 상자가 둘이면 안 맞기 때문"
        en: "Because these are reference types, so the sign would weigh boxes, and equal contents in two boxes do not match"
      ok: true
      fb:
        ko: "그 방향입니다. 상자가 둘이 되는 경우를 하나 적어 보세요."
        en: "That is the direction. Name one way two boxes come about."
    - t:
        ko: "같음 기호가 자바에서 글자에는 안 쓰이기 때문"
        en: "Because the equality sign is not allowed on text in Java"
      ok: false
      fb:
        ko: "쓸 수 있습니다. 컴파일도 되고 돌아요 — 다만 다른 것을 묻습니다."
        en: "It is allowed. It compiles and runs — it just asks something else."
    - t:
        ko: "이 이름이 더 빠르기 때문"
        en: "Because this name is faster"
      ok: false
      fb:
        ko: "느립니다. 내용을 다 훑어야 하니까요 — 그래도 쓰는 이유는 묻는 것이 달라서예요."
        en: "It is slower — it walks the contents. It is used because it asks a different question."
queries:
  - { grammars: [java], file: ./reference-equality.scm }
examples:
  - code: "class A { void f(String a, String b) { boolean s = a.equals(b); } }  // \"a\".equals(\"a\") -> true (boolean)"
    expect: { sites: 1, form: equals, hole: "equals", picks: { 1: "equals", 2: "a", 3: "b" } }
  - code: "class A { void f(String a) { boolean s = a.equals(\"kim\"); } }       // \"kim\".equals(\"kim\") -> true (boolean)"
    expect: { sites: 1, form: equals, hole: "equals", picks: { 1: "equals", 2: "a", 3: "\"kim\"" } }
  - code: "class A { void f(Integer a, Integer b) { boolean s = a.equals(b); } }  // Integer 1000 둘 -> true (boolean)"
    expect: { sites: 1, form: equals, hole: "equals", picks: { 1: "equals", 2: "a", 3: "b" } }
  - code: "class A { void f(String a, String b) { boolean s = a == b; } }      // 같은 상자냐를 묻는다 (boolean)"
    expect: none
