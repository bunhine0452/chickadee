schema: 1
id: java/floating-type
# 0부 축 B. `universal: null` — 파이썬·JS 는 실수 타입이 하나뿐이라 「둘 중 고른다」가 없다.
# `common/float-literal` 은 근사값 축이라 `java/float-inexact` 가 가져갔다.
universal: null
name: { ko: 실수 타입 둘, en: Two decimal types }
token: "double"
grammars: [java]
framework: null
essential: true
difficulty: 1
prereq: [cs/floating-point, cs/bit-and-byte]
confusions: []
dict:
  one_liner:
    ko: "실수 타입이 둘이고, 소수를 그냥 적으면 넓은 쪽이 된다."
    en: "There are two decimal types, and a bare fraction takes the wider one."
  why:
    ko: >-
      자바의 실수는 32칸짜리와 64칸짜리 <b>둘</b>입니다. 그런데 코드에 <code>1.5</code> 라고
      적으면 그것은 <b>언제나 64칸짜리</b>예요. 그래서 <code>float f = 1.5;</code> 가
      컴파일되지 않습니다 — 64칸 값을 32칸 자리에 넣는 것이고, 좁히기는 자바에서 늘 사람이
      적어야 하기 때문입니다. 고치는 법은 두 가지고 뜻이 다릅니다:
      <code>1.5f</code> 라고 적어 값을 32칸으로 만들거나, 자리를 64칸으로 넓히거나.
      돈처럼 정확해야 하는 값은 둘 다 안 쓰고 <code>BigDecimal</code> 을 씁니다.
    en: >-
      Java has <b>two</b> decimal types, one of 32 slots and one of 64. But a literal like
      <code>1.5</code> written in code is <b>always the 64-slot one</b>. That is why
      <code>float f = 1.5;</code> does not compile — a 64-slot value into a 32-slot spot, and
      narrowing in Java is always written by hand. There are two fixes and they mean different
      things: write <code>1.5f</code> to make the value 32 slots, or widen the spot to 64.
      Money uses neither and reaches for <code>BigDecimal</code>.
  trace:
    - ko: "{{site.line}}행은 소수를 담을 이름 {{pick.2|code}}{{pick.2|josa:을,를}} 세운다."
      en: "Line {{site.line}} sets up {{pick.2|code}} to hold a fraction."
    - ko: "앞의 {{pick.1|code}}{{pick.1|josa:이,가}} 칸 수를 32 과 64 중에서 고른다."
      en: "The {{pick.1|code}} in front picks 32 slots or 64."
    - ko: "코드에 그냥 적은 소수는 64칸이므로, 32칸 자리에는 표시가 더 필요하다."
      en: "A bare fraction is 64 slots, so a 32-slot spot needs an extra mark."
rule:
  ko: "<b>실수는 둘이고 리터럴의 기본은 넓은 쪽이다.</b> 좁은 쪽에 넣으려면 사람이 적는다."
  en: "<b>Two decimal types; a literal defaults to the wider.</b> The narrow one is written by hand."
result:
  label: { ko: "{{site.line}}행이 고른 실수 칸", en: "the decimal slots chosen on line {{site.line}}" }
  value: "{{pick.1}} {{pick.2}}"
  note: { ko: "32칸이냐 64칸이냐가 여기서 갈린다", en: "32 or 64 slots is settled here" }
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 이제 소수를 담을 자리를 받았습니다."
  en: "{{pick.2|code}} now has room for a fraction."
payoff:
  ko: "이걸 알면 「소수를 적었을 뿐인데 왜 컴파일이 멈추나」가 풀립니다."
  en: "This untangles “I only wrote a fraction, why did the compiler stop”."
bridge:
  ko: "파이썬·JS 는 실수가 하나뿐이라 고를 일이 없습니다. 자바는 그 줄에서 고릅니다."
  en: "Python and JS have one decimal type, so nothing is chosen. Java chooses on the line."
misconceptions:
  - ko: "소수를 적으면 좁은 쪽이 된다 — 넓은 쪽입니다. 그래서 좁은 자리에 그냥 못 넣습니다."
    en: "A fraction literal is the narrow type — it is the wide one, so it will not go into a narrow spot."
  - ko: "둘은 정확도만 다르다 — 칸 수가 다르고, 그래서 담을 수 있는 범위와 자릿수가 다릅니다."
    en: "They differ only in precision — they differ in slots, so range and digits both differ."
point:
  - q:
      ko: "{{site.line}}행에서 <b>소수의 칸 수를 정하는 글자</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the word that picks the decimal slot count</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>이름</b>입니다. 같은 이름이라도 앞의 타입이 바뀌면 담기는 자릿수가 바뀝니다."
          en: "{{pick.2|code}} is the <b>name</b>. With the same name but a different type in front, the digits it holds change."
        edge:
          h: { ko: "가장 날카로운 자리 — 이름이냐 타입이냐", en: "The sharpest spot — the name or the type" }
          code:
            - "float r = 0.1f;    // 32칸"
            - "double r = 0.1;    // 64칸"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 들어가는 <b>값</b>입니다. 그냥 적은 소수는 늘 64칸이라 자리가 32칸이면 그 줄에서 멈춰요."
          en: "{{pick.3|code}} is the <b>value</b>. A bare fraction is always 64 slots, so a 32-slot spot stops the line."
        edge:
          h: { ko: "가장 날카로운 자리 — 값의 칸이냐 자리의 칸이냐", en: "The sharpest spot — the value's slots or the spot's" }
          code:
            - "float f = 1.5;     // 그 줄에서 멈춘다"
            - "float f = 1.5f;    // 값을 32칸으로 적었다"
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 <b>64칸짜리 소수</b>를 담습니다."
      en: "Choose what goes in the blank. Line {{site.line}} holds a <b>64-slot fraction</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "double", mono: true }
      - t: "float"
        mono: true
        diag:
          t:
            ko: "32칸이라 <code>1.5</code> 같이 그냥 적은 소수를 못 받습니다. 받으려면 값에 <code>f</code> 를 붙여야 해요."
            en: "Thirty-two slots will not take a bare fraction like <code>1.5</code>. The value needs an <code>f</code> to fit."
          edge:
            h: { ko: "가장 날카로운 자리 — 32칸이냐 64칸이냐", en: "The sharpest spot — 32 slots or 64" }
            code:
              - "float r = 1.5;    // 멈춘다"
              - "double r = 1.5;   // 그대로 들어간다"
      - t: "int"
        mono: true
        diag:
          t:
            ko: "정수 타입이라 소수를 못 담습니다. <code>1.5</code> 를 넣으려 하면 그 줄에서 멈춰요 — 자바는 소수를 조용히 버리지 않습니다."
            en: "A whole-number type holds no fraction. Putting <code>1.5</code> there stops the line — Java never drops a fraction quietly."
          edge:
            h: { ko: "가장 날카로운 자리 — 정수냐 실수냐", en: "The sharpest spot — whole or decimal" }
            code:
              - "int n = 1.5;      // 멈춘다"
              - "double d = 1.5;   // 들어간다"
      - t: "long"
        mono: true
        diag:
          t:
            ko: "칸은 64개지만 <b>정수</b> 타입이라 소수 자리가 없습니다. 칸 수가 같아도 담는 모양이 달라요."
            en: "It has 64 slots but it is a <b>whole-number</b> type with no room for a fraction. Same slot count, different shape."
          edge:
            h: { ko: "가장 날카로운 자리 — 같은 64칸의 두 모양", en: "The sharpest spot — two shapes of the same 64 slots" }
            code:
              - "long n = 1;       // 소수 자리가 없다"
              - "double d = 1;     // 1.0 이 된다"
why_gate:
  q:
    ko: "{{site.line}}행은 왜 <b>넓은 쪽 실수</b>를 골랐을까요?"
    en: "Why does line {{site.line}} choose <b>the wider decimal type</b>?"
  choices:
    - t:
        ko: "코드에 그냥 적은 소수가 이미 넓은 쪽이라, 좁은 쪽을 쓰면 값마다 표시를 붙여야 하기 때문"
        en: "Because a bare fraction is already the wide one, so the narrow type needs a mark on every value"
      ok: true
      fb:
        ko: "그 방향입니다. 좁은 쪽을 골랐을 때 이 줄이 어떻게 바뀌는지도 적어 보세요."
        en: "That is the direction. Say how this line would change with the narrow type."
    - t:
        ko: "넓은 쪽이 반올림을 안 하기 때문"
        en: "Because the wider type does not round"
      ok: false
      fb:
        ko: "넓어도 반올림합니다. 자릿수가 더 많을 뿐이고 <code>0.1</code> 은 여전히 안 떨어져요."
        en: "It still rounds. It has more digits, and <code>0.1</code> still does not land exactly."
    - t:
        ko: "돈 계산에 넓은 쪽이 안전해서"
        en: "Because money is safe in the wider type"
      ok: false
      fb:
        ko: "돈에는 둘 다 안 씁니다. 그 자리에는 <code>BigDecimal</code> 이 있어요."
        en: "Money uses neither. <code>BigDecimal</code> is the tool for that spot."
queries:
  - { grammars: [java], file: ./floating-type.scm }
examples:
  - code: "class A { void f() { double avg = 7 / 2.0; } }   // avg -> 3.5 (double)"
    expect: { sites: 1, form: floatdecl, hole: "double", picks: { 1: "double", 2: "avg", 3: "7 / 2.0" } }
  - code: "class A { private float ratio; }                 // ratio -> 0.0 (float)"
    expect: { sites: 1, form: floatfield, hole: "float", picks: { 1: "float", 2: "ratio" } }
  - code: "class A { void f(double rate) { } }              // rate -> 64칸 (double)"
    expect: { sites: 1, form: floatparam, hole: "double", picks: { 1: "double", 2: "rate" } }
  - code: "class A { void f() { int n = 7 / 2; } }          // n -> 3 (int)"
    expect: none
