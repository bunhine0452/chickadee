schema: 1
id: java/for-each
universal: common/iterate
name: { ko: 하나씩 훑기, en: for-each }
token: ":"
grammars: [java]
framework: null
essential: true
difficulty: 2
prereq: [java/variable-declaration, java/array]
confusions: []
no_hole_reason: >-
  되풀이를 여는 낱말이 세 칸짜리와 똑같은 `for` 라, 빈칸을 뚫으면 정답이 `java/for-loop` 와
  글자까지 같아진다. 둘을 가르는 것은 낱말이 아니라 괄호 안의 `:` 인데 한 글자라 빈칸으로 못
  낸다. 이 개념은 지목형과 의미형이 가른다.

dict:
  one_liner:
    ko: "담긴 것을 처음부터 끝까지 하나씩 꺼내 준다. 몇 번 도는지는 안 적는다."
    en: "It hands over what is inside, one at a time. No lap count is written here."
  why:
    ko: >-
      세 칸짜리 되풀이는 「어디서 시작해 언제까지 어떻게 나아가나」를 적어야 합니다.
      {{site.line}}행은 그 셋을 통째로 안 적어요 — 세는 일은 이 줄이 하지 않고,
      {{pick.4|code}}{{pick.4|josa:이,가}} 알아서 다음 것을 내줍니다. 그래서 읽는 사람이
      「번호를 하나 잘못 셌나」를 의심할 자리 자체가 없어집니다. 대신 잃는 것도 분명합니다 —
      지금 <b>몇 번째</b>인지를 이 줄에서는 알 수 없고, 도는 중에 담긴 것을 건드리면 그 자리에서
      멈춥니다.
    en: >-
      A three-slot loop must write where it starts, how long it goes, and how it steps. Line
      {{site.line}} writes none of that — counting is not this line's job; {{pick.4|code}} hands over
      the next one by itself. So there is no place left to suspect an off-by-one. What is lost is just
      as clear: this line cannot say <b>which one</b> it is on, and touching what is inside mid-lap
      stops it right there.
  trace:
    - ko: "{{pick.4|code}}{{pick.4|josa:이,가}} 담고 있는 것을 앞에서부터 하나씩 낸다."
      en: "{{pick.4|code}} hands over what it holds, one at a time, from the front."
    - ko: "낸 것이 {{pick.3|code}}{{pick.3|josa:이,가}} 되고, 한 바퀴 동안만 그 이름으로 산다."
      en: "What is handed over becomes {{pick.3|code}} and lives under that name for one lap only."
    - ko: "{{site.line}}행은 몇 번째인지를 안 센다 — 셀 것이 필요하면 다른 모양을 써야 한다."
      en: "Line {{site.line}} counts nothing — needing a count means using a different shape."

rule:
  ko: "<b>이름은 복사된 것이다.</b> 그 이름에 다시 넣어도 담긴 것은 안 바뀐다."
  en: "<b>The name is a copy.</b> Assigning to it changes nothing inside."
ok:
  ko: >-
    {{pick.4|code}}{{pick.4|josa:이,가}} 낸 것이 한 바퀴 동안 {{pick.3|code}}{{pick.3|josa:이,가}}
    됩니다. 몇 번째인지는 이 줄이 안 셉니다.
  en: >-
    What {{pick.4|code}} hands over becomes {{pick.3|code}} for one lap. This line counts no index.
payoff:
  ko: >-
    이걸 알면 「목록을 돌면서 지웠는데 왜 터지나」의 답이 보입니다 — 내주는 쪽과 건드리는 쪽이
    같은 것이라서예요.
  en: >-
    Knowing this answers “why does removing while looping blow up” — the hand-over and the change are
    on the same thing.
bridge:
  ko: >-
    파이썬의 <code>for x in xs</code> 와 같은 일을 합니다. 다른 것은 하나예요 — 자바는
    {{pick.2|code}} 자리에 <b>종류를 적어야</b> 합니다.
  en: >-
    It does the same job as Python's <code>for x in xs</code>. One thing differs: Java writes
    <b>the kind</b> in the {{pick.2|code}} slot.
misconceptions:
  - ko: "이름에 다시 넣으면 담긴 것도 바뀐다 — 이름은 <b>복사</b>라 원본은 그대로입니다."
    en: "Assigning to the name changes what is inside — the name is a <b>copy</b>; the original stays."
  - ko: "도는 중에 하나 지워도 된다 — 그 자리에서 <b>멈춥니다</b>. 내주는 쪽이 같은 것이라서예요."
    en: "Removing one mid-lap is fine — it <b>stops right there</b>, because the hand-over is on the same thing."
  - ko: "몇 번째인지 알 수 있다 — 이 모양에는 <b>번호가 없습니다</b>. 필요하면 다른 모양이에요."
    en: "The index is available — this shape has <b>no index</b>. Needing one means another shape."
  - ko: "거꾸로도 돌 수 있다 — <b>앞에서 뒤로</b> 한 방향뿐입니다."
    en: "It can run backwards — it goes <b>front to back</b> only."

point:
  - q:
      ko: "{{site.line}}행에서 <b>하나씩 내주는 쪽</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the side that hands them over</b>."
    hint:
      ko: "괄호 안에서 <code>:</code> <b>오른쪽</b>에 있습니다."
      en: "It sits <b>to the right</b> of the <code>:</code> inside the parentheses."
    answer: pick.4
    diag:
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>받는 쪽</b>입니다. 한 바퀴 동안만 그 이름으로 살아요."
          en: "{{pick.3|code}} is <b>the receiving side</b>. It lives under that name for one lap only."
        edge:
          h:
            ko: "가장 날카로운 자리 — 받는 쪽이냐 내주는 쪽이냐"
            en: "The sharpest spot — receiving or handing over"
          code:
            - "for (String s : names)"
            - "//          ^받는다 ^내준다"
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>받는 것의 종류</b>입니다. 내주는 쪽은 <code>:</code> 뒤예요."
          en: "{{pick.2|code}} is <b>the kind of what is received</b>. The hand-over side is after the <code>:</code>."
        edge:
          h:
            ko: "가장 날카로운 자리 — 종류냐 담긴 것이냐"
            en: "The sharpest spot — the kind or the container"
          code:
            - "String : 종류"
            - "names  : 담긴 것"
      pick.5:
        t:
          ko: "{{pick.5|code}}{{pick.5|josa:은,는}} <b>몸통</b>입니다. 괄호 밖이에요."
          en: "{{pick.5|code}} is the <b>body</b>, outside the parentheses."
        edge:
          h:
            ko: "가장 날카로운 자리 — 괄호 안이냐 밖이냐"
            en: "The sharpest spot — inside or outside the parentheses"
          code:
            - "괄호 안: 무엇을 어디서"
            - "괄호 밖: 무엇을 한다"

meaning:
  - q:
      ko: "{{site.line}}행이 도는 동안 {{pick.3|code}}{{pick.3|josa:에,에}} 다른 값을 넣으면 담긴 것은 어떻게 될까요?"
      en: "While line {{site.line}} runs, what happens to the container if {{pick.3|code}} is assigned a new value?"
    hint:
      ko: "그 이름이 원본인지 사본인지 보세요."
      en: "Ask whether that name is the original or a copy."
    options:
      - t:
          ko: "안 바뀐다 — 이름은 복사된 것이다"
          en: "Nothing changes — the name is a copy"
      - t:
          ko: "그 자리의 값이 바뀐다"
          en: "The value at that position changes"
        diag:
          t:
            ko: "이름과 담긴 자리는 <b>다른 것</b>입니다. 자리를 바꾸려면 담긴 쪽에 직접 넣어야 해요."
            en: "The name and the slot are <b>different things</b>. Changing the slot means writing into the container."
          edge:
            h:
              ko: "가장 날카로운 자리 — 이름이냐 자리냐"
              en: "The sharpest spot — the name or the slot"
            code:
              - "s = \"x\";        // 이름만"
              - "names.set(0,\"x\"); // 자리"
      - t:
          ko: "그 자리에서 멈춘다"
          en: "It stops right there"
        diag:
          t:
            ko: "멈추는 것은 <b>담긴 것을 늘리거나 줄일 때</b>입니다. 이름에 넣는 것은 조용히 지나가요."
            en: "Stopping happens when the container <b>grows or shrinks</b>. Assigning to the name passes quietly."
          edge:
            h:
              ko: "가장 날카로운 자리 — 이름이냐 담긴 것이냐"
              en: "The sharpest spot — the name or the container"
            code:
              - "s = \"x\";       // 조용하다"
              - "names.add(\"x\"); // 멈춘다"
      - t:
          ko: "컴파일이 멈춘다"
          en: "Compiling stops"
        diag:
          t:
            ko: "다시 넣지 못하게 <b>적어 두지 않았으면</b> 통과합니다. 통과하는데 아무 일도 안 일어나는 것이 이 자리의 함정이에요."
            en: "Unless it was written as not-reassignable, it compiles. Compiling while doing nothing is the trap here."
          edge:
            h:
              ko: "가장 날카로운 자리 — 막히나 조용하나"
              en: "The sharpest spot — blocked or silent"
            code:
              - "for (String s : names) { s = \"x\"; }"
              - "// 통과한다. 그리고 아무 일도 안 난다"

why_gate:
  q:
    ko: "번호를 안 쓰는 이 모양을 <b>왜</b> 따로 두었을까요 — 세 칸짜리로도 같은 일을 할 텐데."
    en: "<b>Why</b> keep this index-free shape, when the three-slot loop does the same job?"
  choices:
    - t:
        ko: "번호를 안 쓰면 <b>번호를 잘못 셀 자리</b>가 없어져서"
        en: "Without an index there is <b>no place to miscount</b>"
      ok: true
      fb:
        ko: "그 방향입니다. 대신 무엇을 못 하게 됐는지도 적어 보세요."
        en: "That is the direction. Add what became impossible in exchange."
    - t:
        ko: "더 빨리 돌아서"
        en: "Because it runs faster"
      ok: false
      fb:
        ko: "속도는 거의 같습니다. 달라지는 것은 <b>틀릴 수 있는 자리</b>의 수예요."
        en: "The speed is nearly the same. What changes is the number of <b>places to slip</b>."
    - t:
        ko: "세 칸짜리로는 목록을 못 돌아서"
        en: "Because the three-slot loop cannot walk a list"
      ok: false
      fb:
        ko: "돌 수 있습니다. 번호를 손으로 셀 뿐이에요."
        en: "It can. It just counts the index by hand."

queries:
  - { grammars: [java], file: ./for-each.scm }

examples:
  - code: "for (String name : names) { print(name); }"
    expect:
      sites: 1
      form: for-each
      picks: { 1: "for", 2: "String", 3: "name", 4: "names" }
  - code: "for (int i = 0; i < 3; i++) { print(i); }"
    expect: none
