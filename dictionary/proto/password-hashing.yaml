universal: null
name: { ko: 되돌릴 수 없게 줄인 비밀번호, en: Password hashing }
token: null
grammars: []
framework: null
track_default: t0
essential: false
difficulty: 3
prereq: []
confusions: []
dict:
  one_liner:
    ko: "저장된 것은 비밀번호가 아니라 되돌릴 수 없게 줄인 값이다. 견줄 수만 있다."
    en: "Stored is not the password but a one-way value. It can only be compared."
  why:
    ko: >-
      비밀번호를 <b>그대로</b> 두면 저장소가 새는 날 전부 새어 나갑니다. 그래서 한 방향으로만
      가는 셈을 걸어 줄인 값을 두고, 다음 로그인 때 들어온 글자에 <b>같은 셈</b>을 걸어 견줍니다.
      서버조차 원래 글자를 모르고, 그래서 「비밀번호 알려 주기」가 불가능해요. 여기에 한 가지가
      더 붙습니다 — 사람마다 <b>다른 소금</b>을 섞습니다. 같은 비밀번호를 쓴 두 사람이 저장소에서
      서로 달라 보이게 하려고요. 그래서 같은 글자를 두 번 넣어도 저장된 값이 다릅니다.
    en: >-
      Store passwords <b>as they are</b> and the day the store leaks, all of them leak. So a one-way
      computation shrinks each one, and at the next login the same computation runs on what arrived
      and the two are compared. Not even the server knows the original letters, which is why
      “send me my password” cannot work. One more thing is added — a <b>different salt</b> per person,
      so two people with the same password do not look alike in the store. That is why the same
      letters entered twice produce two different stored values.
  trace: []
rule:
  ko: "<b>저장된 값은 되돌릴 수 없다.</b> 사람마다 다른 소금이 섞여 같은 글자도 다르게 남는다."
  en: "<b>The stored value cannot be reversed.</b> A per-person salt makes the same letters land differently."
ok:
  ko: >-
    들어온 글자에 저장된 소금을 섞어 같은 셈을 걸고, 나온 값이 저장된 값과 같은지만 봅니다.
  en: >-
    The salt in the store is mixed into what arrived, the same computation runs, and only the result
    is compared with what was stored.
misconceptions:
  - ko: "저장된 값을 되돌리면 비밀번호가 나온다 — 한 방향뿐이라 되돌리는 길이 없습니다."
    en: "Reversing the stored value gives the password back — the computation runs one way only."
  - ko: "같은 비밀번호면 저장된 값도 같다 — 소금이 사람마다 달라 서로 다르게 남습니다."
    en: "The same password stores the same value — a per-person salt keeps them apart."
  - ko: "소금은 비밀이라 따로 숨겨야 한다 — 소금은 저장된 값 옆에 같이 적힙니다. 감추는 것이 아니라 <b>겹치지 않게</b> 하는 장치예요."
    en: "The salt is a secret to hide — it is written right beside the stored value. It is not for hiding but for keeping values distinct."
  - ko: "빠른 셈일수록 좋다 — 여기서는 <b>느린 것이 목적</b>입니다. 빠르면 남이 마구 시도해 보기도 쉬워집니다."
    en: "Faster is better — here <b>slowness is the point</b>. Fast also means cheap to guess at scale."
evidence: ["BCryptPasswordEncoder", "PasswordEncoder", "passwordEncoder", "BCrypt", "bcrypt"]
meaning:
  - q:
      ko: "{{site.line}}행이 쓰는 방식으로 저장하면, 같은 비밀번호를 쓴 두 사람의 저장 값은 어떻게 될까요?"
      en: "Stored the way line {{site.line}} does it, what do two people with the same password look like?"
    hint:
      ko: "사람마다 <b>다른</b> 것이 하나 섞입니다."
      en: "One thing mixed in is <b>different</b> for each person."
    options:
      - t: { ko: "서로 다르다 — 사람마다 섞이는 것이 다르다", en: "They differ — what is mixed in differs per person" }
      - t: { ko: "똑같다 — 같은 글자에 같은 셈을 걸었으니까", en: "Identical — same letters through the same computation" }
        diag:
          t:
            ko: "셈은 같지만 <b>재료가 하나 더</b> 있습니다. 사람마다 다른 소금이 섞여 결과가 갈려요 — 그래서 저장소만 보고 「이 둘은 같은 비밀번호」를 못 압니다."
            en: "The computation is the same, but there is <b>one more ingredient</b>. A per-person salt splits the results — so the store alone cannot say “these two match”."
          edge:
            h: { ko: "가장 날카로운 자리 — 재료가 하나냐 둘이냐", en: "The sharpest spot — one ingredient or two" }
            code:
              - "글자만 → 같은 값"
              - "글자 + 소금 → 다른 값"
      - t: { ko: "먼저 가입한 쪽만 저장되고 뒤는 거절된다", en: "Only the first to sign up is stored; the second is refused" }
        diag:
          t:
            ko: "겹치는지조차 알 수 없습니다. 저장된 값이 서로 달라서요 — 비밀번호가 같은지를 <b>서버도 모릅니다</b>."
            en: "Nothing even reveals the overlap, because the stored values differ — <b>the server cannot tell</b> whether two passwords match."
          edge:
            h: { ko: "가장 날카로운 자리 — 알 수 있냐 없냐", en: "The sharpest spot — knowable or not" }
            code:
              - "아이디: 겹치면 안다"
              - "비밀번호: 겹쳐도 모른다"
      - t: { ko: "저장 값은 다르지만 되돌리면 같은 글자가 나온다", en: "The values differ, but reversing gives the same letters" }
        diag:
          t:
            ko: "되돌리는 길이 <b>없습니다</b>. 이 셈은 한 방향뿐이라 확인은 「다시 걸어 견주기」로만 합니다."
            en: "There is <b>no</b> way back. The computation runs one way, so checking means computing again and comparing."
          edge:
            h: { ko: "가장 날카로운 자리 — 되돌리기냐 다시 걸기냐", en: "The sharpest spot — reversing or recomputing" }
            code:
              - "확인: 들어온 글자를 다시 건다"
              - "복원: 길이 없다"
