schema: 1
id: proto/status-code
universal: null
name: { ko: 어떻게 됐는지 알리는 숫자, en: HTTP status code }
token: null
grammars: []
framework: null
track_default: t0
essential: false
difficulty: 2
prereq: []
confusions: []
dict:
  one_liner:
    ko: "요청이 어떻게 끝났는지 숫자로 답한다. 앞자리가 종류를 말한다."
    en: "A number says how the request ended. The first digit says what kind."
  why:
    ko: >-
      본문을 읽기 전에 <b>숫자 하나로</b> 어떻게 됐는지 압니다. 앞자리가 종류예요 —
      2로 시작하면 됐고, 4는 <b>보낸 쪽</b> 잘못, 5는 <b>받은 쪽</b> 잘못입니다. 이 구분이
      중요한 이유는 고칠 곳이 갈리기 때문이에요: 4는 요청을 고치고 5는 서버를 고칩니다.
      그리고 「없음」과 「권한 없음」을 가르는 것도 이 숫자입니다 — 본문에 한국어로 적어 두면
      기계는 못 읽어요.
    en: >-
      Before reading the body you know how it went from <b>one number</b>. The first digit is the
      kind — 2 means it worked, 4 means <b>the sender</b> was at fault, 5 means <b>the receiver</b>
      was. The split matters because it says where to fix: 4 fixes the request, 5 fixes the server.
      The same number also separates “not there” from “not allowed” — write that only in the body
      and no machine can read it.
  trace: []
rule:
  ko: "<b>앞자리가 종류다.</b> 4는 보낸 쪽, 5는 받은 쪽을 고쳐야 한다는 뜻이다."
  en: "<b>The first digit is the kind.</b> 4 means fix the request; 5 means fix the server."
ok:
  ko: "숫자 하나로 어느 쪽을 고쳐야 하는지가 정해집니다. 본문은 그다음 이야기예요."
  en: "One number settles which side to fix. The body is a later story."
misconceptions:
  - ko: "실패는 전부 500 이다 — 보낸 쪽 잘못이면 4로 시작하는 숫자를 줘야 합니다."
    en: "Every failure is a 500 — when the sender is at fault the number must start with 4."
  - ko: "본문에 오류라고 적으면 된다 — 기계는 숫자를 봅니다. 200 에 오류를 담으면 성공으로 셉니다."
    en: "Saying “error” in the body is enough — machines read the number. An error inside a 200 counts as success."
  - ko: "권한이 없으면 없다고 하면 된다 — 두 경우의 숫자가 다르고, 그 차이가 정보를 흘리기도 합니다."
    en: "Absent and forbidden can share a number — they differ, and the difference can leak information."
evidence: ["HttpStatus", "ResponseEntity", "status(", "404", "500", "401", "403", "response.status"]
meaning:
  - q:
      ko: "{{site.line}}행이 4로 시작하는 숫자를 돌려준다면 <b>어디를 고쳐야</b> 할까요?"
      en: "If line {{site.line}} answers with a number starting in 4, <b>where is the fix</b>?"
    hint:
      ko: "앞자리가 종류를 말합니다."
      en: "The first digit says the kind."
    options:
      - t: { ko: "보낸 쪽 — 요청을 고쳐야 한다", en: "The sender — the request must change" }
      - t: { ko: "받은 쪽 — 서버를 고쳐야 한다", en: "The receiver — the server must change" }
        diag:
          t:
            ko: "서버를 고쳐야 하는 것은 <b>5로 시작</b>할 때입니다. 4는 온 요청이 어긋났다는 뜻이에요."
            en: "The server is at fault when the number starts with <b>5</b>. A 4 says the request that arrived was off."
          edge:
            h: { ko: "가장 날카로운 자리 — 4냐 5냐", en: "The sharpest spot — 4 or 5" }
            code:
              - "404 · 401  → 요청을 고친다"
              - "500 · 503  → 서버를 고친다"
      - t: { ko: "둘 다 — 숫자만으로는 모른다", en: "Both — the number alone cannot say" }
        diag:
          t:
            ko: "앞자리가 바로 그것을 말하려고 있는 표시입니다. 모르면 그 숫자를 잘못 고른 것이에요."
            en: "The first digit exists to say exactly that. If it is unclear, the number was chosen wrongly."
          edge:
            h: { ko: "가장 날카로운 자리 — 표시가 있느냐", en: "The sharpest spot — is there a marker" }
            code:
              - "4xx: 보낸 쪽"
              - "5xx: 받은 쪽"
      - t: { ko: "중간의 장치 — 네트워크를 고쳐야 한다", en: "Something in between — the network must change" }
        diag:
          t:
            ko: "중간 장치가 내는 숫자도 있지만 그것도 <b>앞자리로</b> 어느 쪽 잘못인지 말합니다. 4는 여전히 보낸 쪽이에요."
            en: "Middleboxes answer too, and they also say whose fault it is <b>by the first digit</b>. A 4 is still the sender."
          edge:
            h: { ko: "가장 날카로운 자리 — 누가 냈나 누구 잘못인가", en: "The sharpest spot — who answered or whose fault" }
            code:
              - "502 는 중간이 냈어도 5xx"
              - "→ 받는 쪽 문제"
