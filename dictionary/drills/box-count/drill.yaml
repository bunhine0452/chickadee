# 작은 문제 하나 (D186 ⑧). 지문은 우리가 썼고 케이스의 답은 reference.py 가 낸다.
schema: 1
id: box-count
topic: arithmetic
statement:
  ko: "물건 n 개를 한 상자에 k 개씩 담습니다. 남기지 않고 다 담으려면 상자가 몇 개 필요한지 출력하세요. 입력은 한 줄에 n 과 k(k > 0)입니다."
  en: "You pack n items, k to a box. Print how many boxes it takes to pack every item. The input is one line holding n and k (k > 0)."
needs: [common/arithmetic, cs/type-conversion]
langs: [py, ts, java]
cases:
  - stdin: "7 3\n"
    stdout: "3\n"
  - stdin: "6 3\n"
    stdout: "2\n"
  - stdin: "0 4\n"
    stdout: "0\n"
  - stdin: "1 1000000\n"
    stdout: "1\n"
