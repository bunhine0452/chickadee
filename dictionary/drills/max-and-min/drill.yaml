# 작은 문제 하나 (D186 ⑧). 지문은 우리가 썼고 케이스의 답은 reference.py 가 낸다.
schema: 1
id: max-and-min
topic: list
statement:
  ko: "첫 줄에 개수 n, 둘째 줄에 정수 n 개가 공백으로 주어집니다. 가장 큰 수와 가장 작은 수를 한 줄에 공백으로 띄워 출력하세요."
  en: "The first line holds a count n, the second holds n integers separated by spaces. Print the largest and the smallest on one line, separated by a space."
needs: [common/list, common/iterate, common/comparison]
langs: [py, ts, java]
cases:
  - stdin: "3\n1 2 3\n"
    stdout: "3 1\n"
  - stdin: "1\n-7\n"
    stdout: "-7 -7\n"
  - stdin: "5\n-2 -9 -1 -3 -4\n"
    stdout: "-1 -9\n"
  - stdin: "4\n0 0 0 0\n"
    stdout: "0 0\n"
