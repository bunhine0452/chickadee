# 작은 문제 하나 (D186 ⑧). 지문은 우리가 썼고 케이스의 답은 reference.py 가 낸다.
schema: 1
id: floor-divide
topic: arithmetic
statement:
  ko: "한 줄에 정수 a 와 b(b > 0)가 주어집니다. a 를 b 로 나눈 몫을 **작은 쪽으로 내림**해 첫 줄에 출력하고, a − 몫 × b 를 둘째 줄에 출력하세요."
  en: "One line holds integers a and b (b > 0). Print the quotient of a divided by b rounded **down** on the first line, then a − quotient × b on the second."
needs: [common/arithmetic, common/integer-literal, cs/type-conversion]
langs: [py, ts, java]
cases:
  - stdin: "7 2\n"
    stdout: "3\n1\n"
  - stdin: "-7 2\n"
    stdout: "-4\n1\n"
  - stdin: "10 5\n"
    stdout: "2\n0\n"
  - stdin: "-1 3\n"
    stdout: "-1\n2\n"
