# 작은 문제 하나 (D186 ⑧). 지문은 우리가 썼고 케이스의 답은 reference.py 가 낸다.
schema: 1
id: median-of-odd
topic: list
statement:
  ko: "첫 줄에 홀수 n, 둘째 줄에 정수 n 개가 주어집니다. 정렬했을 때 한가운데 오는 수를 출력하세요."
  en: "The first line holds an odd count n, the second holds n integers. Print the one that sits in the middle once they are sorted."
needs: [common/list, common/arithmetic, cs/type-conversion, cs/bounds]
langs: [py, ts, java]
cases:
  - stdin: "3\n3 1 2\n"
    stdout: "2\n"
  - stdin: "1\n7\n"
    stdout: "7\n"
  - stdin: "5\n-5 -1 -3 -2 -4\n"
    stdout: "-3\n"
  - stdin: "5\n10 10 10 1 1\n"
    stdout: "10\n"
