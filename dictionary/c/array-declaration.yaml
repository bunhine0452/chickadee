schema: 1
id: c/array-declaration
# 1부 「문과 흐름」 (`docs/curriculum/c.md` §3 #15 · §0.6). 보편형은 `common/list`.
# C 라서 다른 것 — 칸 수가 타입의 일부이고 아무도 범위를 안 본다.
universal: common/list
name: { ko: 칸이 정해진 목록, en: Array declaration }
token: "a[3]"
grammars: [c]
framework: null
essential: true
difficulty: 1
prereq: [c/declaration, c/number-literal, cs/bounds, cs/memory-layout]
confusions: []

dict:
  one_liner:
    ko: "같은 타입의 칸을 나란히 잡는다. 칸 수는 만들 때 정해지고, 밖을 읽어도 아무도 안 막는다."
    en: "Side-by-side slots of one type; the count is fixed and the edges are unguarded."
  why:
    ko: >-
      {{site.line}}행은 {{pick.1|code}} 칸을 {{pick.3|code}} 개 <b>나란히</b> 잡고 {{pick.2|code}}{{pick.2|josa:이,가}}
      그 첫 칸을 가리키게 합니다. 칸 수는 <b>타입의 일부</b>라 나중에 늘릴 수 없어요. 칸 번호는 0 부터
      시작합니다 — 규칙이 아니라 <b>첫 칸에서 떨어진 거리</b>가 번호라서, 마지막 칸은 칸 수보다 하나
      작은 번호예요. 그리고 C 는 범위를 <b>안 봅니다</b>. 칸 수보다 큰 번호를 적어도 컴파일되고
      돌아가며, 옆 기억의 무언가가 나오거나 나중에 엉뚱한 데서 터집니다.
    en: >-
      Line {{site.line}} reserves {{pick.3|code}} slots of {{pick.1|code}} <b>side by side</b> and makes
      {{pick.2|code}} refer to the first one. The count is <b>part of the type</b> and cannot grow
      later. Slot numbers start at 0 — not by rule but because a number is <b>the distance from the
      first slot</b>, so the last slot's number is one less than the count. And C does <b>not</b> check
      the range: a number larger than the count compiles and runs, and something from neighbouring
      memory comes out, or something blows up later somewhere else.
  trace:
    - ko: "{{pick.1|code}} 크기의 칸이 {{pick.3|code}} 개 나란히 잡힌다."
      en: "{{pick.3|code}} slots the size of {{pick.1|code}} are reserved side by side."
    - ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 그 첫 칸의 자리다 — 번호는 거기서 떨어진 거리다."
      en: "{{pick.2|code}} is the place of the first slot — a number is the distance from it."
    - ko: "{{site.line}}행 아래에서 번호가 칸 수를 넘어도 아무도 안 막는다."
      en: "Below line {{site.line}}, a number past the count is stopped by nobody."

rule:
  ko: "<b>칸 수는 타입의 일부이고 번호는 거리다.</b> 마지막 번호는 칸 수 − 1 이고, 밖은 아무도 안 막는다."
  en: "<b>The count is part of the type and a number is a distance.</b> The last number is count − 1; the edges are unguarded."
result:
  label:
    ko: "{{site.line}}행의 목록"
    en: "the array on line {{site.line}}"
  value: "{{pick.1}} {{pick.2}}[{{pick.3}}]"
  note:
    ko: "번호 0 부터 칸 수 − 1 까지"
    en: "numbers 0 to count − 1"
ok:
  ko: >-
    {{pick.2|code}}{{pick.2|josa:은,는}} {{pick.1|code}} 칸 {{pick.3|code}} 개의 첫 자리입니다.
  en: >-
    {{pick.2|code}} is the first of {{pick.3|code}} slots of {{pick.1|code}}.
payoff:
  ko: >-
    이걸 알면 「배열이 왜 0 부터인가」가 규칙이 아니라 거리로 읽힙니다 — 그리고 마지막 번호가 하나 작은
    이유도 같이 풀려요.
  en: >-
    This makes “why arrays start at 0” read as a distance rather than a rule — and explains why the
    last number is one less.
bridge:
  ko: >-
    파이썬의 목록은 늘어나고 밖을 읽으면 오류로 막습니다. C 의 배열은 칸 수가 굳어 있고 밖을 읽어도
    조용해요 — 정확히 반대입니다.
  en: >-
    A Python list grows and blocks out-of-range reads with an error. A C array has a fixed count and
    stays quiet when read past its edge — the exact opposite.
misconceptions:
  # c.md §3 #15 · §9 #8 — 규격에서 나온 사실이고 빈도 자료는 없다.
  - ko: "칸 수보다 큰 번호를 읽으면 오류가 난다 — <b>아무 일도 안 나거나</b> 옆 값이 나오거나 나중에 터집니다. 검사는 없어요."
    en: "Reading a number past the count raises an error — <b>nothing happens</b>, a neighbour's value appears, or it blows up later. There is no check."
  - ko: "배열은 늘릴 수 있다 — 칸 수가 <b>타입의 일부</b>라 못 늘립니다. 늘리려면 새 자리를 빌려야 해요."
    en: "An array can grow — the count is <b>part of the type</b> and cannot change. Growing means borrowing a new place."
  - ko: "배열 이름은 포인터다 — 이름은 <b>배열</b>이고, 값으로 쓰일 때 첫 칸의 주소로 <b>바뀝니다</b>. <code>sizeof</code> 가 그 증거예요."
    en: "The array name is a pointer — the name is <b>an array</b> that <b>turns into</b> the first slot's address when used as a value. <code>sizeof</code> is the proof."
no_hole_reason: >-
  구멍을 못 뚫는다. 이 개념이 짚는 것은 대괄호 안의 칸 수인데 그 수는 사용처마다 다르고, 대괄호
  자체는 낱말이 아니라 구두점이다. 빈칸형은 첫 옵션이 `@hole` 원문이어야 하는데 원문이 하나로
  안 정해진다.

point:
  - q:
      ko: "{{site.line}}행에서 <b>칸 수를 정하는 값</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the value that fixes the slot count</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.3
    diag:
      pick.1:
        t:
          ko: "{{pick.1|code}}{{pick.1|josa:은,는}} 칸 <b>하나</b>의 타입입니다. 한 칸이 얼마나 큰지를 말하지 몇 칸인지는 안 말해요."
          en: "{{pick.1|code}} is the type of <b>one</b> slot. It says how big one slot is, not how many there are."
        edge:
          h:
            ko: "가장 날카로운 자리 — 한 칸의 크기냐 칸 수냐"
            en: "The sharpest spot — one slot's size or the count"
          code:
            - "int a[3];   /* int 는 한 칸, 3 이 칸 수 */"
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 첫 칸의 <b>이름</b>입니다. 이름에는 수가 없어요 — 칸 수는 대괄호 안이 정합니다."
          en: "{{pick.2|code}} is <b>the name</b> of the first slot. A name carries no number — the brackets fix the count."
        edge:
          h:
            ko: "가장 날카로운 자리 — 이름과 대괄호"
            en: "The sharpest spot — the name and the brackets"
          code:
            - "int a[3];   /* a 는 이름, [3] 이 칸 수 */"

why_gate:
  q:
    ko: "C 는 왜 배열의 범위를 <b>검사하지 않을까요</b>?"
    en: "Why does C <b>not check</b> array bounds?"
  choices:
    - t:
        ko: "번호가 거리라 읽기가 덧셈 한 번인데, 검사를 넣으면 읽기마다 견주기가 하나 더 붙고 C 는 그 비용을 사람의 책임으로 남겼기 때문"
        en: "Because a number is a distance so a read is one addition, a check would add a comparison to every read, and C left that cost as the programmer's responsibility"
      ok: true
      fb:
        ko: "그 방향입니다. 그 책임을 사람이 어떻게 지는지(길이를 따로 들고 다닌다)도 적어 보세요."
        en: "That is the direction. Say how the programmer carries that responsibility (carrying the length separately)."
    - t:
        ko: "검사할 방법이 없어서"
        en: "Because there was no way to check"
      ok: false
      fb:
        ko: "방법은 있습니다. 칸 수를 알면 견주면 돼요. 안 한 것은 선택이었어요."
        en: "There is a way. Knowing the count, compare. Not doing it was a choice."
    - t:
        ko: "밖을 읽는 일이 안 생겨서"
        en: "Because reads past the edge never happen"
      ok: false
      fb:
        ko: "생깁니다. 조건 칸의 등호 하나로 생겨요. 안 막을 뿐입니다."
        en: "They happen — one equals sign in a loop test does it. It is simply not blocked."

queries:
  - { grammars: [c], file: ./array-declaration.scm }

examples:
  - code: "int a[3];                       /* a -> int 칸 셋, 안은 정해지지 않음 */"
    expect: { sites: 1, form: array, picks: { 1: "int", 2: "a", 3: "3" } }
  - code: "int a[3] = {1, 2, 3};           /* a -> 1 2 3 */"
    expect: { sites: 1, form: array-init, picks: { 1: "int", 2: "a", 3: "3" } }
  - code: "char buf[64];                   /* buf -> char 칸 64 */"
    expect: { sites: 1, form: array, picks: { 1: "char", 2: "buf", 3: "64" } }
  - code: "int *p;                         /* 포인터 — 다른 판이다 */"
    expect: none
  - code: "char s[] = \"hi\";               /* 문자열 초기화 — 다른 판이다 */"
    expect: none
