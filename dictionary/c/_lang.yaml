lang: c
version: 0.1.0
grammars: [c]
# tree-sitter-c 0.24.2 의 `parser.c` 가 15 다 (`docs/curriculum/c.md` §8 — 파이썬·자바 14 와 다르다).
# 대조는 시험이 한다 (`declared_grammar_abi_matches_the_linked_grammar`).
grammar_abi: { c: 15 }

# 확장자 → 문법. `.h` 는 **c 의 것**이다 — cpp 사전은 `.hpp .hh .hxx` 만 든다 (D190).
extensions:
  c: [.c, .h]

# 「필수 문법」 — 구멍 지도가 세는 대상이자 위상 정렬 동률 시의 순서다 (03 §6).
#
# **순서는 0부 → 1부 → 2부다** (`docs/curriculum/c.md` §0.6). 부 이름은 교재가 아니라
# 「무엇을 읽게 되나」다 — 0부 한 줄 안의 값 · 1부 한 함수 · 2부 한 파일(중심 9 + 심화 9).
# 3부 「빌드와 규격」은 `parts/c.ts` 에서 2부 뒤에 잇는다 — 프레임워크 사전이 없는 언어의
# 3부 자리는 비어 있어야 한다는 것이 등록부 시험의 규약이다.
#
# **「얇은 판을 셋 이상 잇대지 않는다」(py/_lang.yaml) 는 여기서 성립하지 않는다.** 사용자 리포
# 열에 사람이 쓴 `.c` 가 0장이라(§0.7) 모든 판이 얇다. 배열은 §0.1·§0.6 의 표 순서 그대로다.
essential:
  # ── 0부 「이 언어의 값과 식」 12판 (c.md §0.1) ──────────────────────────────
  - c/declaration            # 축 G · 타입 이름이 만드는 낱말이다
  - c/assignment             # 축 G · 조건 안의 `=` 를 막지 않는다
  - c/number-literal         # 축 A · 적는 모양이 타입을 정한다
  - c/integer-type           # 축 A · 폭은 규격이 최소만 약속한다
  - c/overflow               # 축 A · 부호 있는 넘침은 답이 없다
  - c/float-type             # 축 B · 실수 리터럴은 double 이라 두 번 잘린다
  - c/char-literal           # 축 C · 'a' 는 int 다
  - c/truthiness             # 축 D · 참·거짓 타입이 없다
  - c/arithmetic             # 축 E · 정수끼리는 나누기도 정수다
  - c/comparison             # 축 H · 견준 결과가 int 0 또는 1 이다
  - c/operator-precedence    # 축 E · `*p++` 는 `*(p++)` 다
  - c/conversion             # 축 F · `-1 < 1u` 가 거짓이다
  # ── 1부 「문과 흐름」 8판 (c.md §0.6 · §2) ─────────────────────────────────
  - c/if-statement
  - c/while-loop
  - c/for-loop
  - c/function-definition
  - c/function-call
  - c/return-statement
  - c/string-literal
  - c/array-declaration
  # ── 2부 「포인터와 메모리」 중심 9 (c.md §0.6 · §3) ────────────────────────
  - c/pointer-declaration
  - c/address-of
  - c/dereference
  - c/null-check
  - c/sizeof
  - c/struct-definition
  - c/member-access
  - c/array-decay
  - c/malloc-free
  # ── 2부 뒤 「빌드와 규격」 심화 9 (c.md §0.6 · §4) ─────────────────────────
  - c/header-include
  - c/function-prototype
  - c/const
  - c/typedef
  - c/macro-define
  - c/conditional-compilation
  - c/function-pointer
  - c/static-storage
  - c/undefined-behavior

# 「AI 가 대신 쓴 것」 — 구멍 개념 ↔ 같은 일을 하는 다른 표기.
#
# **비워 둔다.** C 에서 그럴듯한 짝(`while (1)` ↔ `for (;;)` · `p == NULL` ↔ `!p`)은 둘 다
# 같은 개념(`c/while-loop` · `c/null-check`)의 다른 모양이라 짝이 가리킬 개념이 따로 없다.
# 표본 `jq`(src 21파일)에서 `for (;;)` 0곳 · `while (1)` 2곳이라 부기할 수도 없다.
alternatives: []

thin_threshold: { min_files: 2, min_sites: 3, small_repo_files: 20 }

# 「네 코드엔 없다」(D177 규칙 ① · D186 ④) — 사용자 리포에 C 가 한 장도 없다(c.md §0.7).
# 그래서 이 사전의 판은 리포 없이 열리면 **전부 합성**이고 사유는 `no-files`(D190 ④) 다.
# 개념별 사유(`framework`·`library`·`scale`·`idiom`)는 C 파일이 있는 리포에서만 뜻이 있고,
# 그 표는 `packages/cards/src/t0-synthetic.ts` 의 `ABSENCE` 가 든다 — 이 사전의 소유가 아니다.

diag_default:
  point:
    ko: "«{{pick}}»{{pick|josa:은,는}} {{role}} 자리입니다. {{concept}}{{concept|josa:은,는}} «{{answer}}» 입니다. {{rule}}"
    en: "«{{pick}}» is the {{role}} slot. The {{concept}} is «{{answer}}». {{rule}}"
  blank:
    ko: "«{{pick}}»{{pick|josa:은,는}} 이 자리에 오지 않습니다. {{rule}}"
    en: "«{{pick}}» does not go in this slot. {{rule}}"
