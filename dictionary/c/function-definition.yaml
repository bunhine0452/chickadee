schema: 1
id: c/function-definition
# 1부 「문과 흐름」 (`docs/curriculum/c.md` §2 #7 · §0.6). 보편형은 `common/function-definition`.
# C 라서 다른 것 — 돌려줄 것의 타입을 이름 앞에 먼저 적고, 안 돌려주면 `void` 라고 적어야 한다.
universal: common/function-definition
name: { ko: 함수 정의, en: Function definition }
token: "void"
grammars: [c]
framework: null
essential: true
difficulty: 1
prereq: [cs/call-stack, c/declaration]
confusions: []

dict:
  one_liner:
    ko: "이름 앞에 돌려줄 값의 타입을 먼저 적는다. 돌려줄 것이 없어도 「없음」이라고 적는다."
    en: "The return type comes before the name; even “nothing” has to be written."
  why:
    ko: >-
      {{site.line}}행은 {{pick.2|code}}{{pick.2|josa:을,를}} 정의합니다 — 이름 앞의 {{pick.1|code}}{{pick.1|josa:이,가}}
      <b>돌려줄 값의 타입</b>이고, {{pick.3|code}}{{pick.3|josa:이,가}} 받을 것, {{pick.4|code}}{{pick.4|josa:이,가}}
      부르면 도는 몸통이에요. 돌려줄 것이 없으면 비워 두는 게 아니라 <code>void</code> 라고 <b>적어야</b>
      합니다 — 「없음」에 이름이 있어요. 부를 때마다 몸통의 지역 이름들은 새 자리에 쌓였다가
      돌아갈 때 통째로 사라집니다. 그래서 몸통 안 배열의 주소를 돌려주면 이미 사라진 자리를
      가리키게 돼요.
    en: >-
      Line {{site.line}} defines {{pick.2|code}} — the {{pick.1|code}} before the name is <b>the type of
      the returned value</b>, {{pick.3|code}} is what it takes, and {{pick.4|code}} is the body that runs
      when called. If nothing is returned you do not leave it blank; you <b>write</b> <code>void</code>
      — “nothing” has a name. On every call the body's local names are stacked in a fresh place and
      vanish as a whole on return. That is why returning the address of an array inside the body points
      at a place that is already gone.
  trace:
    - ko: "누군가 {{pick.2|code}}{{pick.2|josa:을,를}} 부르면 {{pick.3|code}}{{pick.3|josa:이,가}} 새 자리에 놓인다."
      en: "When someone calls {{pick.2|code}}, {{pick.3|code}} is laid out in a fresh place."
    - ko: "{{pick.4|code}}{{pick.4|josa:이,가}} 돈다 — 안에서 만든 이름은 그 자리에 쌓인다."
      en: "{{pick.4|code}} runs — names made inside are stacked in that place."
    - ko: "돌아갈 때 {{pick.1|code}} 값 하나만 남고 그 자리는 통째로 사라진다."
      en: "On return only one {{pick.1|code}} value survives; the place vanishes whole."

rule:
  ko: "<b>돌려줄 타입이 이름 앞이다.</b> 없음도 적어야 하고, 몸통의 자리는 돌아가면 사라진다."
  en: "<b>The return type comes before the name.</b> Nothing must be written too, and the body's place vanishes on return."
result:
  label:
    ko: "{{site.line}}행이 정의한 함수"
    en: "the function defined on line {{site.line}}"
  value: "{{pick.1}} {{pick.2}}{{pick.3}}"
  note:
    ko: "타입 · 이름 · 받는 것"
    en: "type, name, parameters"
ok:
  ko: >-
    {{pick.2|code}}{{pick.2|josa:은,는}} {{pick.3|code}}{{pick.3|josa:을,를}} 받아 {{pick.1|code}}{{pick.1|josa:을,를}}
    돌려주는 함수입니다.
  en: >-
    {{pick.2|code}} is a function that takes {{pick.3|code}} and returns {{pick.1|code}}.
payoff:
  ko: >-
    이걸 알면 「함수가 돌려준 배열이 쓰레기다」가 풀립니다 — 돌아가는 순간 그 자리가 사라진 거예요.
  en: >-
    This untangles “the array my function returned is garbage” — its place vanished the moment it
    returned.
bridge:
  ko: >-
    파이썬은 돌려줄 타입을 안 적고 안 적으면 <code>None</code> 이 갑니다. C 는 타입을 먼저 적고, 안
    돌려주면 쓰레기가 가요 — 「없음」을 적는 이유가 그것입니다.
  en: >-
    Python writes no return type, and a missing return sends <code>None</code>. C writes the type first,
    and a missing return sends garbage — that is why “nothing” has to be written.
misconceptions:
  # c.md §2 #7 · §9 — 규격에서 나온 사실이고 빈도 자료는 없다.
  - ko: "타입을 안 적으면 알아서 정한다 — 안 적으면 옛 규칙으로 int 로 읽히거나 오류입니다. <b>void</b> 도 적어야 해요."
    en: "Leave the type out and it is inferred — left out, it is read as int by an old rule or is an error. Even <b>void</b> must be written."
  - ko: "몸통의 지역 배열은 함수가 끝나도 남는다 — 돌아가는 순간 <b>자리가 통째로 사라집니다</b>. 그 주소를 돌려주면 쓰레기예요."
    en: "A local array in the body survives the function — its place <b>vanishes whole</b> on return. Returning its address gives garbage."
  - ko: "함수는 어디서든 부를 수 있다 — 컴파일러가 <b>먼저 알아야</b> 부릅니다. 정의가 뒤에 있으면 앞에 알려야 해요."
    en: "A function can be called from anywhere — the compiler has to <b>know it first</b>. If the definition comes later, it must be announced earlier."
no_hole_reason: >-
  구멍을 못 뚫는다. 이 개념이 짚는 자리는 돌려줄 타입인데 그 글자는 사용처마다 다르다
  (`int`·`void`·`char *`·`struct node *`). 빈칸형은 첫 옵션이 `@hole` 원문이어야 하는데 원문이
  하나로 안 정해져서, 낱말을 고르는 문항은 `c/return-statement` 가 맡는다.

point:
  - q:
      ko: "{{site.line}}행에서 <b>돌려줄 값의 타입</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the type of the returned value</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 함수의 <b>이름</b>입니다. 부를 때 쓰는 글자이지 무엇을 돌려주는지는 그 앞에 적혀 있어요."
          en: "{{pick.2|code}} is the function's <b>name</b>. It is what you write to call it; what comes back is written before it."
        edge:
          h:
            ko: "가장 날카로운 자리 — 이름 앞이 타입"
            en: "The sharpest spot — the type is before the name"
          code:
            - "int add(int a, int b)   /* int 가 돌려줄 타입 */"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>받는 것</b>입니다. 부르는 쪽이 넣어 주는 값들이고, 돌려주는 쪽은 이름 앞이에요."
          en: "{{pick.3|code}} is <b>what it takes</b>. Those are values the caller puts in; what comes back is before the name."
        edge:
          h:
            ko: "가장 날카로운 자리 — 받는 것과 주는 것"
            en: "The sharpest spot — what it takes and what it gives"
          code:
            - "int add(int a, int b)   /* (int a, int b) 는 받는 것 */"
      pick.4:
        t:
          ko: "{{pick.4|code}}{{pick.4|josa:은,는}} <b>몸통</b>입니다. 부르면 도는 곳이고, 돌려줄 타입은 몸통이 아니라 머리에 적혀 있어요."
          en: "{{pick.4|code}} is <b>the body</b>. It is what runs when called; the return type is written in the head, not the body."
        edge:
          h:
            ko: "가장 날카로운 자리 — 머리냐 몸통이냐"
            en: "The sharpest spot — the head or the body"
          code:
            - "int add(int a, int b) { return a + b; }"

meaning:
  - q:
      ko: "{{site.line}}행의 몸통 안에서 만든 배열의 <b>주소를 돌려주면</b> 부른 쪽은 무엇을 받을까요?"
      en: "If the body on line {{site.line}} <b>returns the address</b> of an array made inside it, what does the caller receive?"
    hint:
      ko: "몸통의 자리는 돌아갈 때 어떻게 되나요."
      en: "What happens to the body's place on return."
    options:
      - t:
          ko: "이미 사라진 자리의 번호 — 읽으면 답이 없다"
          en: "The number of a place already gone — reading it has no answer"
      - t:
          ko: "배열 그대로"
          en: "The array itself"
        diag:
          t:
            ko: "배열은 <b>몸통의 자리</b>에 있었고 그 자리는 돌아가며 사라집니다. 남는 것은 번호뿐이에요."
            en: "The array lived in <b>the body's place</b>, and that place vanishes on return. Only the number survives."
          edge:
            h:
              ko: "가장 날카로운 자리 — 자리가 사라진다"
              en: "The sharpest spot — the place is gone"
            code:
              - "char *f(void) { char s[8]; return s; }   /* 사라진 자리 */"
      - t:
          ko: "컴파일 오류"
          en: "A compile error"
        diag:
          t:
            ko: "오류가 <b>안 납니다</b>. 좋은 컴파일러가 경고를 낼 뿐이고, 코드는 돌아요 — 그래서 위험합니다."
            en: "There is <b>no</b> error. A good compiler warns, and the code runs — which is what makes it dangerous."
          edge:
            h:
              ko: "가장 날카로운 자리 — 경고뿐"
              en: "The sharpest spot — only a warning"
            code:
              - "return s;   /* 경고: 지역 변수의 주소 */"
      - t:
          ko: "복사본"
          en: "A copy"
        diag:
          t:
            ko: "복사되는 것은 <b>주소 한 칸</b>뿐입니다. 배열의 칸들은 복사되지 않고 사라져요."
            en: "Only <b>the one address slot</b> is copied. The array's slots are not copied; they vanish."
          edge:
            h:
              ko: "가장 날카로운 자리 — 번호만 간다"
              en: "The sharpest spot — only the number travels"
            code:
              - "return s;   /* s 의 번호 하나 */"

why_gate:
  q:
    ko: "C 는 왜 함수의 머리에 <b>돌려줄 타입을 먼저</b> 적게 할까요?"
    en: "Why does C put <b>the return type first</b> in a function's head?"
  choices:
    - t:
        ko: "부르는 쪽이 그 값을 담을 자리의 크기를 정의를 보기 전에 알아야 하고, C 의 모든 선언이 「타입 다음 이름」이라 함수도 같은 모양이기 때문"
        en: "Because the caller must know how much room the value needs before seeing the definition, and every C declaration is “type then name”, so a function has the same shape"
      ok: true
      fb:
        ko: "그 방향입니다. 그래서 정의가 뒤에 있을 때 앞에 무엇을 적는지도 적어 보세요."
        en: "That is the direction. Say what is written up front when the definition comes later."
    - t:
        ko: "읽기 좋으라고"
        en: "To read nicely"
      ok: false
      fb:
        ko: "읽기 문제가 아닙니다. 부르는 쪽이 값을 받을 자리를 잡아야 해서예요."
        en: "It is not about reading. The caller has to reserve room for the value."
    - t:
        ko: "이름을 먼저 적으면 컴파일러가 헷갈려서"
        en: "Because the compiler gets confused if the name comes first"
      ok: false
      fb:
        ko: "헷갈림이 아니라 규칙입니다. 다른 언어는 이름을 먼저 적고도 잘 컴파일해요."
        en: "It is a rule, not confusion. Other languages put the name first and compile fine."

queries:
  - { grammars: [c], file: ./function-definition.scm }

examples:
  - code: "int add(int a, int b) { return a + b; }"
    expect: { sites: 1, form: fn, picks: { 1: "int", 2: "add", 3: "(int a, int b)", 4: "{ return a + b; }" } }
  - code: "void tick(void) { count++; }"
    expect: { sites: 1, form: fn, picks: { 1: "void", 2: "tick", 3: "(void)" } }
  - code: "char *dup(const char *s) { return s; }"
    expect: { sites: 1, form: fn-ptr, picks: { 1: "char", 2: "dup", 3: "(const char *s)" } }
  - code: "int add(int a, int b);            /* 알리기만 — 다른 판이다 */"
    expect: none
