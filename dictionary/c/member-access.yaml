schema: 1
id: c/member-access
# 2부 「포인터와 메모리」 (`docs/curriculum/c.md` §3 #21 · §0.6). 보편형은 `common/member-access`.
# C 라서 다른 것 — 기호가 둘이고, 어느 쪽인지는 왼쪽이 값이냐 자리냐로만 정해진다.
universal: common/member-access
name: { ko: 안의 이름 꺼내기, en: Member access }
token: "->"
grammars: [c]
framework: null
essential: true
difficulty: 2
prereq: [c/struct-definition, c/dereference]
confusions: []

dict:
  one_liner:
    ko: "덩이 안의 칸 하나를 이름으로 꺼낸다. 왼쪽이 덩이면 점, 덩이의 자리(포인터)면 화살표다."
    en: "Takes a slot by name: dot when the left is the block, arrow when a pointer."
  why:
    ko: >-
      {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:은,는}} {{pick.2|code}} 안에서 {{pick.3|code}} 칸을 꺼냅니다.
      기호가 둘인 이유는 왼쪽이 <b>둘 중 하나</b>이기 때문이에요 — 덩이 자체면 점, 덩이가 놓인
      자리의 번호(포인터)면 화살표. 화살표는 <code>(*p).x</code> 의 줄임이라 「번호를 따라가 열고
      그 안의 x」를 한 번에 적은 것입니다. 우선순위 때문에 <code>*p.x</code> 라고 쓰면 <code>*(p.x)</code>
      가 되어 뜻이 달라져요. 컴파일러는 왼쪽의 타입을 알므로 틀린 기호를 쓰면 막아 줍니다 —
      조용히 틀리는 자리가 아니라 드문 자리예요.
    en: >-
      {{pick.1|code}} on line {{site.line}} takes the {{pick.3|code}} slot out of {{pick.2|code}}.
      There are two symbols because the left side is <b>one of two things</b> — the block itself takes
      a dot; the number of the block's place (a pointer) takes an arrow. The arrow abbreviates
      <code>(*p).x</code>: “follow the number, open it, take x inside” in one stroke. Because of
      precedence, <code>*p.x</code> means <code>*(p.x)</code>, something else. The compiler knows the
      left side's type, so a mismatched symbol is blocked — a rare spot that does not slip through quietly.
  trace:
    - ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 덩이인지 덩이의 자리인지를 컴파일러가 안다."
      en: "The compiler knows whether {{pick.2|code}} is the block or the block's place."
    - ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 그에 맞게 덩이에 닿는다 — 화살표면 번호를 먼저 따라간다."
      en: "{{pick.1|code}} reaches the block accordingly — an arrow follows the number first."
    - ko: "{{site.line}}행은 그 안의 {{pick.3|code}} 칸을 읽거나 쓴다."
      en: "Line {{site.line}} reads or writes the {{pick.3|code}} slot inside."

rule:
  ko: "<b>점은 덩이에, 화살표는 덩이의 자리에.</b> 화살표는 열고 꺼내기를 한 번에 적은 것이다."
  en: "<b>Dot on the block, arrow on the block's place.</b> The arrow writes open-and-take in one stroke."
result:
  label:
    ko: "{{site.line}}행이 꺼낸 칸"
    en: "the slot taken on line {{site.line}}"
  value: "{{pick.2}}{{pick.1}}{{pick.3}}"
  note:
    ko: "덩이 안의 한 칸"
    en: "one slot inside the block"
ok:
  ko: >-
    {{pick.2|code}} 안의 {{pick.3|code}} 칸이 {{site.line}}행에 열렸습니다.
  en: >-
    The {{pick.3|code}} slot inside {{pick.2|code}} is open on line {{site.line}}.
payoff:
  ko: >-
    이걸 알면 「점이냐 화살표냐」를 외우지 않아도 됩니다 — 왼쪽이 무엇인지만 보면 정해져요.
  en: >-
    This spares you memorising “dot or arrow” — look at what the left side is and it is decided.
bridge:
  ko: >-
    파이썬·자바는 점 하나뿐입니다. 이름이 늘 참조라 갈릴 것이 없어요. C 는 값과 자리가 갈라져
    있어 기호도 둘입니다.
  en: >-
    Python and Java have one dot. Names are always references, so there is nothing to split. C keeps
    value and place apart, so the symbols are two.
misconceptions:
  # c.md §3 #21 · §0.1 #11 — 규격에서 나온 사실이고 빈도 자료는 없다.
  - ko: "화살표는 점보다 「깊이」 들어간다 — 깊이가 아니라 <b>왼쪽의 종류</b>가 정합니다. 덩이면 점, 자리면 화살표예요."
    en: "The arrow goes “deeper” than the dot — it is <b>the left side's kind</b>, not depth. Block means dot, place means arrow."
  - ko: "<code>*p.x</code> 는 화살표와 같다 — 점이 먼저 묶여 <code>*(p.x)</code> 입니다. 같게 하려면 <code>(*p).x</code> 예요."
    en: "<code>*p.x</code> equals the arrow — the dot binds first, giving <code>*(p.x)</code>. Match it with <code>(*p).x</code>."
  - ko: "틀린 기호를 써도 돌아간다 — 컴파일러가 <b>막습니다</b>. 왼쪽 타입을 알기 때문이에요."
    en: "A mismatched symbol still runs — the compiler <b>blocks</b> it, because it knows the left side's type."

point:
  - q:
      ko: "{{site.line}}행에서 <b>덩이 안의 칸으로 들어가는 기호</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the symbol that goes into a slot of the block</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>덩이 쪽</b>입니다 — 덩이 자체거나 덩이의 자리. 안으로 들어가는 것은 그 뒤의 기호예요."
          en: "{{pick.2|code}} is <b>the block side</b> — the block itself or its place. Going inside is done by the symbol after it."
        edge:
          h:
            ko: "가장 날카로운 자리 — 덩이와 들어가기"
            en: "The sharpest spot — the block and the entering"
          code:
            - "pt.x    /* pt 가 덩이, . 이 들어간다 */"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 꺼내지는 <b>칸의 이름</b>입니다. 기호 뒤에 오고, 스스로는 어디로도 못 들어가요."
          en: "{{pick.3|code}} is <b>the name of the slot</b> being taken. It follows the symbol and cannot enter anything by itself."
        edge:
          h:
            ko: "가장 날카로운 자리 — 칸의 이름"
            en: "The sharpest spot — the slot's name"
          code:
            - "nd->v   /* v 는 칸 이름 */"

meaning:
  - q:
      ko: "{{site.line}}행의 {{pick.2|code}}{{pick.2|josa:이,가}} <b>덩이의 포인터</b>라면 어떤 기호로 {{pick.3|code}}{{pick.3|josa:을,를}} 꺼낼까요?"
      en: "If {{pick.2|code}} on line {{site.line}} were <b>a pointer to the block</b>, which symbol takes {{pick.3|code}}?"
    hint:
      ko: "왼쪽이 무엇인지가 기호를 정합니다."
      en: "What the left side is decides the symbol."
    options:
      - t:
          ko: "화살표 — 번호를 따라가 열고 꺼내기를 한 번에"
          en: "The arrow — follow the number, open it and take, in one stroke"
      - t:
          ko: "점 — 기호는 하나뿐이니까"
          en: "The dot — there is only one symbol"
        diag:
          t:
            ko: "포인터에 점을 쓰면 컴파일러가 <b>막습니다</b>. 자리에는 화살표, 덩이에는 점이에요."
            en: "A dot on a pointer is <b>blocked</b> by the compiler. Arrow on a place, dot on a block."
          edge:
            h:
              ko: "가장 날카로운 자리 — 막힌다"
              en: "The sharpest spot — it is blocked"
            code:
              - "p.x     /* 오류 */"
              - "p->x    /* 된다 */"
      - t:
          ko: "별표를 앞에 붙인 점 — <code>*p.x</code>"
          en: "A star before the dot — <code>*p.x</code>"
        diag:
          t:
            ko: "점이 별표보다 <b>먼저 묶여</b> <code>*(p.x)</code> 가 됩니다. 괄호를 쳐 <code>(*p).x</code> 라고 해야 화살표와 같아요."
            en: "The dot binds <b>before</b> the star, giving <code>*(p.x)</code>. Parenthesise as <code>(*p).x</code> to match the arrow."
          edge:
            h:
              ko: "가장 날카로운 자리 — 우선순위"
              en: "The sharpest spot — precedence"
            code:
              - "(*p).x   /* == p->x */"
      - t:
          ko: "대괄호 — <code>p[x]</code>"
          en: "Brackets — <code>p[x]</code>"
        diag:
          t:
            ko: "대괄호는 <b>번호로 칸을 고르는</b> 배열의 기호입니다. 이름으로 고르는 덩이의 칸에는 안 맞아요."
            en: "Brackets pick <b>a slot by number</b>, the array's symbol. They do not fit a block slot picked by name."
          edge:
            h:
              ko: "가장 날카로운 자리 — 번호냐 이름이냐"
              en: "The sharpest spot — by number or by name"
            code:
              - "a[0]    /* 번호 */"
              - "p->x    /* 이름 */"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 <b>덩이 자체</b>에서 칸을 꺼냅니다."
      en: "Choose what goes in the blank. Line {{site.line}} takes a slot from <b>the block itself</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: ".", mono: true }
      - t: "->"
        mono: true
        diag:
          t:
            ko: "화살표는 왼쪽이 <b>덩이의 자리</b>(포인터)일 때의 기호입니다. 덩이 자체에 쓰면 컴파일러가 막아요."
            en: "The arrow is for when the left is <b>the block's place</b> (a pointer). On the block itself the compiler blocks it."
          edge:
            h:
              ko: "가장 날카로운 자리 — 덩이냐 자리냐"
              en: "The sharpest spot — the block or its place"
            code:
              - "pt.x    /* 덩이 */"
              - "p->x    /* 자리 */"
      - t: "::"
        mono: true
        diag:
          t:
            ko: "이건 <b>C++ 의 기호</b>입니다. C 에는 없어서 컴파일러가 못 읽어요."
            en: "That is <b>a C++ symbol</b>. C does not have it and the compiler cannot read it."
          edge:
            h:
              ko: "가장 날카로운 자리 — 다른 언어의 기호"
              en: "The sharpest spot — another language's symbol"
            code:
              - "pt::x   /* 오류 */"
      - t: ":"
        mono: true
        diag:
          t:
            ko: "쌍점은 <b>조건식과 라벨</b>의 기호입니다. 덩이 안으로 들어가는 뜻이 없어요."
            en: "The colon belongs to <b>the conditional and labels</b>. It has no meaning of entering a block."
          edge:
            h:
              ko: "가장 날카로운 자리 — 다른 자리의 기호"
              en: "The sharpest spot — a symbol from elsewhere"
            code:
              - "a ? b : c"

why_gate:
  q:
    ko: "C 는 왜 덩이 안을 꺼내는 기호를 <b>둘</b>로 둘까요?"
    en: "Why does C keep <b>two</b> symbols for taking from a block?"
  choices:
    - t:
        ko: "값과 자리가 갈라진 언어라 왼쪽이 둘 중 무엇인지가 읽는 사람에게 보여야 하고, 자리라면 번호를 따라가는 한 걸음이 더 있기 때문"
        en: "Because in a language that splits value and place the reader must see which the left side is, and a place needs one more step of following the number"
      ok: true
      fb:
        ko: "그 방향입니다. 화살표가 없다면 같은 일을 어떻게 적는지도 적어 보세요."
        en: "That is the direction. Say how the same thing is written without the arrow."
    - t:
        ko: "점 하나로는 파서가 못 읽어서"
        en: "Because the parser could not read a single dot"
      ok: false
      fb:
        ko: "읽을 수 있습니다. 왼쪽 타입을 알아 갈릴 수 있으니까요. 둘로 둔 것은 읽는 사람을 위한 표시예요."
        en: "It could — the left type is known. Two symbols are a mark for the reader."
    - t:
        ko: "화살표가 더 빨라서"
        en: "Because the arrow is faster"
      ok: false
      fb:
        ko: "속도는 같습니다. 화살표는 열기와 꺼내기를 한 글자로 적은 것뿐이에요."
        en: "Same speed. The arrow only writes open-and-take in one stroke."

queries:
  - { grammars: [c], file: ./member-access.scm }

examples:
  - code: "pt.x = 1;                       /* 덩이 안의 x */"
    expect: { sites: 1, form: dot, hole: ".", picks: { 1: ".", 2: "pt", 3: "x" } }
  - code: "nd->v = 2;                      /* 자리를 따라가 안의 v */"
    expect: { sites: 1, form: arrow, hole: "->", picks: { 1: "->", 2: "nd", 3: "v" } }
  - code: "int y = p->y;                   /* 읽기도 같다 */"
    expect: { sites: 1, form: arrow, hole: "->", picks: { 2: "p", 3: "y" } }
  - code: "int first = xs[0];              /* 번호로 고르기 — 다른 것이다 */"
    expect: none
