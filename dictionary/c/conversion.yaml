schema: 1
id: c/conversion
# 0부 축 F 신규 (`docs/curriculum/c.md` §0.1 #12). 심화의 `integer-promotion` 을 흡수했다(§0.4) —
# 규격에서 정수 승격은 usual arithmetic conversions 의 첫 단계라 한 절차다. `universal: null` —
# README §8 이 `common/type-cast` 를 후보로 두었으나 아직 없다. `cs/type-conversion` 이 「왜」를 댄다.
universal: null
name: { ko: 암묵·명시·잘림, en: Conversion }
token: "(char)"
grammars: [c]
framework: null
essential: true
difficulty: 3
prereq: [cs/type-conversion, cs/integer-overflow, c/integer-type, c/comparison]
confusions: []

dict:
  one_liner:
    ko: "타입이 다른 둘이 만나면 조용히 맞춘다. 넓히면 안 잃고, 좁히면 잘리고, 부호가 갈리면 뒤집힌다."
    en: "Types match quietly: widening keeps, narrowing cuts, a sign mismatch flips."
  why:
    ko: >-
      C 는 타입이 다른 둘이 만나면 오류를 내지 않고 <b>한쪽을 다른 쪽에 맞춥니다</b>. 좁은 쪽이 넓은
      쪽으로 올라가고(<code>int</code> → <code>long</code> → <code>double</code>), 부호 있는 쪽이
      부호 없는 쪽으로 <b>올라갑니다</b>. 그래서 <code>-1 &lt; 1u</code> 가 거짓이에요 — <code>-1</code> 이
      <code>unsigned</code> 로 올라가 4294967295 가 됩니다. 사람이 적는 캐스트 {{pick.1|code}}{{pick.1|josa:은,는}}
      반대로 <b>좁히는</b> 자리에 쓰이고, 그때 잘리는 것을 아무도 안 막아요 — <code>(char)300</code> 은
      44 입니다. 사다리를 그리면 됩니다: 아래 칸에서 위 칸으로는 조용히, 위에서 아래로는 잘리며.
    en: >-
      When two different types meet, C raises no error and <b>matches one to the other</b>. The narrow
      side climbs to the wide one (<code>int</code> → <code>long</code> → <code>double</code>), and the
      signed side <b>climbs</b> to the unsigned one. That is why <code>-1 &lt; 1u</code> is false —
      <code>-1</code> climbs to <code>unsigned</code> and becomes 4294967295. A written cast like
      {{pick.1|code}} goes the other way, to <b>narrow</b>, and nothing stops the cut —
      <code>(char)300</code> is 44. Draw a ladder: up a rung is quiet, down a rung cuts.
  trace:
    - ko: "{{pick.3|code}}{{pick.3|josa:이,가}} 먼저 값이 된다 — 제 타입으로."
      en: "{{pick.3|code}} becomes a value first — in its own type."
    - ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 그 값을 다른 칸으로 옮긴다 — 위로면 그대로, 아래로면 잘린다."
      en: "{{pick.1|code}} moves that value to another rung — up keeps it, down cuts it."
    - ko: "{{site.line}}행의 결과는 옮겨 간 칸의 값이다. 잘렸어도 아무 표시가 없다."
      en: "The result on line {{site.line}} is the value on the new rung. Even a cut leaves no mark."

rule:
  ko: "<b>넓히기는 조용하고 좁히기는 잘린다.</b> 부호 있는 값은 부호 없는 쪽으로 올라가 뒤집힌다."
  en: "<b>Widening is quiet; narrowing cuts.</b> A signed value climbs to unsigned and flips."
result:
  label:
    ko: "{{site.line}}행의 변환"
    en: "the conversion on line {{site.line}}"
  value: "{{pick.1}} {{pick.3}}"
  note:
    ko: "사다리의 어느 방향인지가 답을 정한다"
    en: "which way on the ladder decides the answer"
ok:
  ko: >-
    {{pick.3|code}}{{pick.3|josa:은,는}} {{pick.1|code}}{{pick.1|josa:을,를}} 지나며 다른 칸의 값이 됐습니다.
  en: >-
    {{pick.3|code}} passed through {{pick.1|code}} and became a value on another rung.
payoff:
  ko: >-
    이걸 알면 「음수가 큰 양수보다 크다고 나온다」가 풀립니다 — 부호 없는 상대를 만나 사다리를
    올라간 거예요.
  en: >-
    This untangles “a negative comes out greater than a large positive” — it met an unsigned partner
    and climbed the ladder.
bridge:
  ko: >-
    Rust 는 타입이 다르면 아예 안 만나게 막고, Go 도 막습니다. C 는 조용히 맞추고, 사람이 적는
    캐스트는 잘려도 말이 없어요.
  en: >-
    Rust refuses to let different types meet, and so does Go. C matches quietly, and a written cast
    says nothing even when it cuts.
misconceptions:
  # c.md §9 #11 · §4 #33 — 규격에서 나온 사실이고 빈도 자료는 없다.
  - ko: "<code>-1 &lt; 1u</code> 는 참이다 — <b>거짓</b>입니다. <code>-1</code> 이 부호 없는 쪽으로 올라가 아주 큰 수가 돼요."
    en: "<code>-1 &lt; 1u</code> is true — it is <b>false</b>. <code>-1</code> climbs to unsigned and becomes a very large number."
  - ko: "캐스트는 타입을 맞춰 주는 낱말이다 — <b>말없이 자릅니다</b>. <code>(char)300</code> 은 44 예요."
    en: "A cast is a word that fits the type — it <b>cuts silently</b>. <code>(char)300</code> is 44."
  - ko: "정수 승격은 변환과 다른 일이다 — 같은 절차의 <b>첫 단계</b>입니다. 작은 타입이 int 로 먼저 올라가고 그다음이 넓히기예요."
    en: "Integer promotion is a different thing from conversion — it is <b>the first step</b> of the same procedure. Small types climb to int first, then widening."

point:
  - q:
      ko: "{{site.line}}행에서 <b>값을 다른 칸으로 옮기는 자리</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the spot that moves the value to another rung</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 변환의 <b>한쪽 재료나 여는 괄호</b>입니다. 옮기는 일은 타입 이름이나 견주는 기호가 해요."
          en: "{{pick.2|code}} is <b>one input or the opening parenthesis</b>. The moving is done by the type name or the comparing symbol."
        edge:
          h:
            ko: "가장 날카로운 자리 — 재료냐 옮기기냐"
            en: "The sharpest spot — the input or the moving"
          code:
            - "(char)300   /* char 가 옮긴다 */"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 옮겨지는 <b>값</b>입니다. 값은 제 타입을 갖고 있고, 다른 칸으로 가는 것은 그 앞의 자리가 시켜요."
          en: "{{pick.3|code}} is <b>the value</b> being moved. It has its own type; what sends it to another rung is the spot before it."
        edge:
          h:
            ko: "가장 날카로운 자리 — 값이냐 사다리냐"
            en: "The sharpest spot — the value or the ladder"
          code:
            - "300         /* int */"
            - "(char)300   /* 44 */"

meaning:
  - q:
      ko: "<code>-1 &lt; 1u</code> 의 값은 무엇일까요?"
      en: "What is the value of <code>-1 &lt; 1u</code>?"
    hint:
      ko: "부호 있는 쪽이 부호 없는 쪽으로 올라갑니다."
      en: "The signed side climbs to the unsigned side."
    options:
      - t:
          ko: "0 — -1 이 부호 없는 쪽으로 올라가 4294967295 가 되어 1 보다 크다"
          en: "0 — -1 climbs to unsigned, becomes 4294967295, and is greater than 1"
      - t:
          ko: "1 — 음수는 양수보다 작으니까"
          en: "1 — a negative is less than a positive"
        diag:
          t:
            ko: "사람의 산수에서는 그렇지만, 견주기 전에 <b>타입을 먼저 맞춥니다</b>. 부호 없는 쪽으로 올라간 -1 은 음수가 아니에요."
            en: "In hand arithmetic yes, but <b>the types are matched first</b>. A -1 that climbed to unsigned is not negative."
          edge:
            h:
              ko: "가장 날카로운 자리 — 견주기 전에 올라간다"
              en: "The sharpest spot — it climbs before comparing"
            code:
              - "-1 < 1     /* 1 */"
              - "-1 < 1u    /* 0 */"
      - t:
          ko: "컴파일 오류 — 부호가 다르니까"
          en: "A compile error — the signs differ"
        diag:
          t:
            ko: "C 는 <b>막지 않습니다</b>. 조용히 맞추고, 좋은 컴파일러가 경고를 낼 뿐이에요. 막는 것은 Rust 입니다."
            en: "C does <b>not</b> block it. It matches quietly; a good compiler only warns. Rust is what blocks it."
          edge:
            h:
              ko: "가장 날카로운 자리 — 경고뿐"
              en: "The sharpest spot — only a warning"
            code:
              - "-1 < 1u   /* 경고: 부호 비교 */"
      - t:
          ko: "1u 가 부호 있는 쪽으로 내려와 1 이 된다"
          en: "1u climbs down to signed and becomes 1"
        diag:
          t:
            ko: "방향이 반대입니다. 사다리는 <b>부호 없는 쪽이 위</b>라 부호 있는 값이 올라가요 — 내려오는 일은 없습니다."
            en: "The direction is reversed. On the ladder <b>unsigned is above</b>, so the signed value climbs — nothing climbs down."
          edge:
            h:
              ko: "가장 날카로운 자리 — 위로만 간다"
              en: "The sharpest spot — only upward"
            code:
              - "int 와 unsigned 가 만나면 → unsigned"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 값을 <b>한 바이트로 좁혀</b> 넣습니다."
      en: "Choose what goes in the blank. Line {{site.line}} <b>narrows the value to one byte</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "char", mono: true }
      - t: "int"
        mono: true
        diag:
          t:
            ko: "이건 <b>같은 칸</b>입니다. 옮기는 것이 없어 300 이 그대로예요 — 컴파일은 되지만 이 줄이 보이려던 잘림이 사라집니다."
            en: "That is <b>the same rung</b>. Nothing moves and 300 stays 300 — it compiles, but the cut this line meant to show disappears."
          edge:
            h:
              ko: "가장 날카로운 자리 — 같은 칸이면 안 잘린다"
              en: "The sharpest spot — same rung, no cut"
            code:
              - "(int)300    /* 300 */"
              - "(char)300   /* 44 */"
      - t: "unsigned"
        mono: true
        diag:
          t:
            ko: "이건 <b>부호를 떼는</b> 칸이라 300 은 그대로 300 입니다. 잘리는 것은 칸이 <b>좁아질</b> 때예요."
            en: "That rung <b>drops the sign</b>, so 300 stays 300. Cutting happens when the rung gets <b>narrower</b>."
          edge:
            h:
              ko: "가장 날카로운 자리 — 부호냐 폭이냐"
              en: "The sharpest spot — sign or width"
            code:
              - "(unsigned)300   /* 300 */"
              - "(char)300       /* 44 */"
      - t: "double"
        mono: true
        diag:
          t:
            ko: "이건 <b>위 칸</b>입니다. 300 이 300.0 이 되어 아무것도 안 잃어요 — 좁히기가 아니라 넓히기입니다."
            en: "That is <b>an upper rung</b>. 300 becomes 300.0 and nothing is lost — widening, not narrowing."
          edge:
            h:
              ko: "가장 날카로운 자리 — 위로는 안 잘린다"
              en: "The sharpest spot — no cut going up"
            code:
              - "(double)300   /* 300.0 */"

why_gate:
  q:
    ko: "C 는 왜 타입이 다른 둘을 <b>막지 않고 조용히</b> 맞출까요?"
    en: "Why does C <b>quietly match</b> two different types instead of blocking them?"
  choices:
    - t:
        ko: "C 가 생길 때 타입은 「이 바이트를 어떻게 읽나」였고, 읽는 법을 바꾸는 일은 기계에서 공짜라 규칙을 사다리 하나로 정하면 코드가 짧아지기 때문"
        en: "Because when C was made a type meant “how to read these bytes”, changing the reading is free on the machine, and one ladder of rules kept code short"
      ok: true
      fb:
        ko: "그 방향입니다. 그 대가로 읽는 사람이 외워야 하는 규칙 하나(부호 없는 쪽이 위)도 적어 보세요."
        en: "That is the direction. Name the one rule the reader has to memorise in return (unsigned is above)."
    - t:
        ko: "컴파일러가 타입을 검사할 줄 몰라서"
        en: "Because the compiler could not check types"
      ok: false
      fb:
        ko: "검사합니다. 검사한 뒤 막지 않고 맞추는 쪽을 고른 거예요."
        en: "It checks. After checking it chooses to match rather than block."
    - t:
        ko: "막으면 느려져서"
        en: "Because blocking would be slow"
      ok: false
      fb:
        ko: "컴파일 때의 일이라 속도와 무관합니다. 편의와 안전 사이의 선택이에요."
        en: "It happens at compile time, so speed is irrelevant. It is a choice between convenience and safety."

queries:
  - { grammars: [c], file: ./conversion.scm }

examples:
  - code: "int t = (char)300;         /* t -> 44 (int) */"
    expect: { sites: 1, form: explicit, hole: "char", picks: { 1: "char", 2: "(", 3: "300" } }
  - code: "int neg = -1 < 1u;         /* neg -> 0 (int) */"
    expect: { sites: 1, form: implicit-unsigned, picks: { 1: "<", 2: "-1", 3: "1u" } }
  - code: "double h = 7 / 2.0;        /* h -> 3.5 (double) — 7 이 올라갔다 */"
    expect: { sites: 1, form: promote, picks: { 1: "/", 2: "7", 3: "2.0" } }
  - code: "int n = 7 / 2;             /* 같은 타입 — 다른 판이다 */"
    expect: none
  - code: "int ok = a < b;            /* 견주기 — 다른 판이다 */"
    expect: none
