schema: 1
id: c/pointer-declaration
# 2부 「포인터와 메모리」 (`docs/curriculum/c.md` §3 #16 · §0.6). `universal: null` — c.md §6 이
# `common/reference-type` 을 후보로 냈으나(Go `*T` · Rust `&T`) 아직 없다. 후보로 보고.
universal: null
name: { ko: 자리를 담는 이름, en: Pointer declaration }
token: "int *p"
grammars: [c]
framework: null
essential: true
difficulty: 2
prereq: [c/declaration, cs/memory-address, cs/pointer-indirection]
confusions: []

dict:
  one_liner:
    ko: "값이 아니라 값이 있는 자리의 번호를 담는 이름이다. 별표는 타입이 아니라 이름 하나에 붙는다."
    en: "A name that holds not a value but the number of the place where a value lives."
  why:
    ko: >-
      {{site.line}}행의 {{pick.2|code}}{{pick.2|josa:은,는}} {{pick.1|code}} 값을 담지 <b>않습니다</b>. 담는 것은
      그런 값이 놓인 <b>자리의 번호</b>예요 — 모든 값은 기억 어딘가의 바이트이고 그 자리에는 번호가
      붙어 있으니, 그 번호를 값으로 든 이름이 포인터입니다. {{pick.3|code}}{{pick.3|josa:은,는}} 타입에
      붙는 것이 아니라 <b>이름 하나에</b> 붙어요. 그래서 <code>int *p, q;</code> 에서 <code>q</code> 는
      포인터가 아니라 그냥 <code>int</code> 입니다. 포인터 안에는 번호가 있을 뿐 값이 없고, 값은 그
      번호를 따라가야 나와요.
    en: >-
      {{pick.2|code}} on line {{site.line}} does <b>not</b> hold a {{pick.1|code}} value. It holds
      <b>the number of a place</b> where such a value lives — every value is bytes somewhere in
      memory, every place has a number, and a name whose value is that number is a pointer.
      {{pick.3|code}} attaches not to the type but to <b>one name</b>. So in <code>int *p, q;</code>,
      <code>q</code> is not a pointer but a plain <code>int</code>. Inside a pointer there is only a
      number, no value; the value appears only by following that number.
  trace:
    - ko: "{{pick.3|code}}{{pick.3|josa:이,가}} {{pick.2|code}} 에 붙어 「자리의 번호를 담는 이름」으로 만든다."
      en: "{{pick.3|code}} attaches to {{pick.2|code}} and makes it a name that holds a place's number."
    - ko: "{{pick.1|code}}{{pick.1|josa:은,는}} 그 번호를 따라갔을 때 무엇이 있는지를 말한다."
      en: "{{pick.1|code}} says what is found when that number is followed."
    - ko: "{{site.line}}행 아래에서 {{pick.2|code}} 안에는 번호만 있다 — 값은 따라가야 나온다."
      en: "Below line {{site.line}}, {{pick.2|code}} holds only a number — the value appears by following it."

rule:
  ko: "<b>포인터는 번호를 담고, 별표는 이름 하나에 붙는다.</b> 값은 번호를 따라가야 나온다."
  en: "<b>A pointer holds a number, and the star attaches to one name.</b> The value appears by following the number."
result:
  label:
    ko: "{{site.line}}행의 포인터"
    en: "the pointer on line {{site.line}}"
  value: "{{pick.1}} {{pick.3}}{{pick.2}}"
  note:
    ko: "번호 하나가 든다"
    en: "one number goes in"
ok:
  ko: >-
    {{pick.2|code}}{{pick.2|josa:은,는}} {{pick.1|code}}{{pick.1|josa:이,가}} 놓인 자리의 번호를 담는 이름입니다.
  en: >-
    {{pick.2|code}} is a name that holds the number of a place where a {{pick.1|code}} lives.
payoff:
  ko: >-
    이걸 알면 「포인터를 찍었더니 이상한 큰 수가 나온다」가 풀립니다 — 그것이 번호예요. 값을 보려면
    따라가야 합니다.
  en: >-
    This untangles “I printed the pointer and got a strange large number” — that is the number.
    Follow it to see the value.
bridge:
  ko: >-
    파이썬의 이름은 전부 무언가를 가리키지만 그 번호가 안 보입니다. C 는 번호를 값으로 드러내고,
    그것을 담는 이름을 따로 선언해요.
  en: >-
    Every Python name points at something, but the number is hidden. C exposes the number as a value
    and declares a separate name to hold it.
misconceptions:
  # c.md §9 #1 · #3 — #3 은 Kaczmarczyk 외 SIGCSE '10 의 주제 1(메모리 모형 오해)에 근거가 있다.
  - ko: "<code>int *p, q;</code> 는 포인터 둘을 만든다 — <code>q</code> 는 <b>그냥 int</b> 입니다. 별표는 이름 하나에 붙어요."
    en: "<code>int *p, q;</code> makes two pointers — <code>q</code> is <b>a plain int</b>. The star attaches to one name."
  - ko: "포인터에는 값이 들어 있다 — 들어 있는 것은 <b>번호</b>입니다. 값은 그 번호가 가리키는 자리에 있어요."
    en: "A pointer holds the value — it holds <b>a number</b>. The value lives at the place that number names."
  - ko: "값 없이 만든 포인터는 아무 데도 안 가리킨다 — <b>아무 데나</b> 가리킵니다. 그 번호를 따라가면 답이 없어요."
    en: "A pointer made without a value points nowhere — it points <b>anywhere</b>. Following that number has no answer."

point:
  - q:
      ko: "{{site.line}}행에서 <b>이름을 포인터로 만드는 기호</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the symbol that makes the name a pointer</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.3
    diag:
      pick.1:
        t:
          ko: "{{pick.1|code}}{{pick.1|josa:은,는}} 번호를 <b>따라갔을 때</b> 나오는 것의 타입입니다. 이것만으로는 값을 담는 이름이 돼요 — 포인터로 만드는 것은 별표입니다."
          en: "{{pick.1|code}} is the type of what appears <b>after following</b> the number. Alone it makes a value-holding name — the star makes the pointer."
        edge:
          h:
            ko: "가장 날카로운 자리 — 타입이냐 별표냐"
            en: "The sharpest spot — the type or the star"
          code:
            - "int p;    /* 값을 담는다 */"
            - "int *p;   /* 번호를 담는다 */"
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>이름</b>입니다. 이름이 포인터가 되는 것은 바로 앞에 별표가 붙어서예요 — 옆의 이름에는 안 붙습니다."
          en: "{{pick.2|code}} is <b>the name</b>. It becomes a pointer because a star sits right before it — the next name gets none."
        edge:
          h:
            ko: "가장 날카로운 자리 — 이름 하나에만"
            en: "The sharpest spot — one name only"
          code:
            - "int *p, q;   /* p 만 포인터 */"

meaning:
  - q:
      ko: "<code>int *p, q;</code> 에서 <code>q</code> 는 무엇일까요?"
      en: "In <code>int *p, q;</code>, what is <code>q</code>?"
    hint:
      ko: "별표가 어디에 붙는지가 답입니다."
      en: "Where the star attaches is the answer."
    options:
      - t:
          ko: "그냥 int — 별표는 p 에만 붙었다"
          en: "A plain int — the star attached only to p"
      - t:
          ko: "포인터 — 타입이 int * 니까"
          en: "A pointer — the type is int *"
        diag:
          t:
            ko: "타입은 <code>int</code> 이고 별표는 <b>선언자</b>의 일부입니다. 그래서 이름마다 따로 붙여야 해요."
            en: "The type is <code>int</code>, and the star is part of <b>the declarator</b>. So it has to be written per name."
          edge:
            h:
              ko: "가장 날카로운 자리 — 타입이 아니라 선언자"
              en: "The sharpest spot — the declarator, not the type"
            code:
              - "int *p, *q;   /* 둘 다 포인터 */"
      - t:
          ko: "컴파일 오류"
          en: "A compile error"
        diag:
          t:
            ko: "완전히 합법입니다. 한 줄에 다른 모양의 이름 둘을 만든 것뿐이라 오류가 없어요 — 그래서 함정입니다."
            en: "Fully legal. It just makes two names of different shapes on one line, so there is no error — which is why it is a trap."
          edge:
            h:
              ko: "가장 날카로운 자리 — 조용히 통과한다"
              en: "The sharpest spot — it passes quietly"
            code:
              - "int *p, q;   /* 경고도 없다 */"
      - t:
          ko: "p 와 같은 자리를 가리키는 포인터"
          en: "A pointer to the same place as p"
        diag:
          t:
            ko: "<code>q</code> 는 포인터가 아니고, 무엇을 가리키게 하는 값도 없습니다. <b>정해지지 않은 int</b> 예요."
            en: "<code>q</code> is not a pointer, and no value makes it point anywhere. It is <b>an undecided int</b>."
          edge:
            h:
              ko: "가장 날카로운 자리 — 값도 번호도 없다"
              en: "The sharpest spot — neither value nor number"
            code:
              - "int *p, q;   /* q 안은 쓰레기 */"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 <b>자리의 번호를 담는 이름</b>을 만듭니다."
      en: "Choose what goes in the blank. Line {{site.line}} makes <b>a name that holds a place's number</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "*", mono: true }
      - t: "&"
        mono: true
        diag:
          t:
            ko: "이건 <b>식에서 자리를 얻는</b> 기호입니다. 선언자 자리에는 못 와요 — 이름을 만드는 줄에 오면 컴파일러가 못 읽습니다."
            en: "That symbol <b>takes a place in an expression</b>. It cannot stand in a declarator — on a name-making line the compiler cannot read it."
          edge:
            h:
              ko: "가장 날카로운 자리 — 선언이냐 식이냐"
              en: "The sharpest spot — declaration or expression"
            code:
              - "int *p = &n;   /* * 는 선언, & 는 식 */"
      - t: "[]"
        mono: true
        diag:
          t:
            ko: "대괄호는 <b>칸 여러 개</b>를 나란히 잡는 배열입니다. 번호 하나를 담는 이름이 아니에요."
            en: "Brackets make <b>an array</b> of side-by-side slots. Not a name that holds one number."
          edge:
            h:
              ko: "가장 날카로운 자리 — 칸이냐 번호냐"
              en: "The sharpest spot — slots or a number"
            code:
              - "int a[3];   /* 칸 셋 */"
              - "int *p;     /* 번호 하나 */"
      - t: "^"
        mono: true
        diag:
          t:
            ko: "이건 파스칼·Go 의 포인터 기호이지만 C 에서는 <b>비트 XOR</b> 입니다. 선언자 자리에는 못 와요."
            en: "That is the pointer symbol in Pascal and Go, but in C it is <b>bitwise XOR</b>. It cannot stand in a declarator."
          edge:
            h:
              ko: "가장 날카로운 자리 — 다른 언어의 기호"
              en: "The sharpest spot — another language's symbol"
            code:
              - "int ^p;   /* 오류 */"
              - "int *p;"

why_gate:
  q:
    ko: "C 는 왜 별표를 타입이 아니라 <b>이름에</b> 붙일까요?"
    en: "Why does C attach the star to <b>the name</b> rather than the type?"
  choices:
    - t:
        ko: "선언이 「이 이름을 이렇게 쓰면 이 타입이 나온다」는 모양을 흉내 내기 때문 — <code>*p</code> 가 int 라는 뜻이라 별표가 이름 옆에 선다"
        en: "Because a declaration mirrors “using the name this way yields this type” — <code>*p</code> is an int, so the star stands beside the name"
      ok: true
      fb:
        ko: "그 방향입니다. 그 규칙이 배열과 함수 포인터 선언에서 어떻게 보이는지도 적어 보세요."
        en: "That is the direction. Say how that rule shows in array and function-pointer declarations."
    - t:
        ko: "타입 옆에 두면 읽기 어려워서"
        en: "Because it reads badly next to the type"
      ok: false
      fb:
        ko: "읽기 문제가 아닙니다. 「쓰는 모양이 곧 선언」이라는 규칙이에요."
        en: "It is not about reading. The rule is “the way you use it is the declaration”."
    - t:
        ko: "한 줄에 포인터를 여럿 만들지 못하게 하려고"
        en: "To prevent several pointers on one line"
      ok: false
      fb:
        ko: "여럿 만들 수 있습니다 — 이름마다 별표를 붙이면 돼요. 막으려는 것이 아니라 모양의 규칙입니다."
        en: "Several are possible — one star per name. It is a rule of shape, not a prohibition."

queries:
  - { grammars: [c], file: ./pointer-declaration.scm }

examples:
  - code: "int *p;                         /* p -> 정해지지 않은 번호 */"
    expect: { sites: 1, form: ptr, hole: "*", picks: { 1: "int", 2: "p", 3: "*" } }
  - code: "int *p = &n, q;                 /* p 만 포인터, q 는 int */"
    expect: { sites: 1, form: ptr-init, hole: "*", picks: { 1: "int", 2: "p", 3: "*" } }
  - code: "void fill(int *xs, int n) { }   /* xs 는 자리를 받는다 */"
    expect: { sites: 1, form: ptr-param, hole: "*", picks: { 1: "int", 2: "xs", 3: "*" } }
  - code: "int x;                          /* 값을 담는 이름 — 다른 판이다 */"
    expect: none
  - code: "int a[3];                       /* 배열 — 다른 판이다 */"
    expect: none
