schema: 1
id: c/typedef
# 2부 뒤 「빌드와 규격」 (`docs/curriculum/c.md` §4 #28 · §0.6). `universal: null` — 별명이 새 타입이
# 아니라는 점과 「이름이 생기면 파싱이 바뀐다」는 C 의 것이다.
universal: null
name: { ko: 타입에 별명 붙이기, en: typedef }
token: "typedef"
grammars: [c]
framework: null
essential: true
difficulty: 3
prereq: [c/struct-definition, c/declaration]
confusions: [c/macro-define]

dict:
  one_liner:
    ko: "있는 타입에 이름 하나를 더 붙인다. 새 타입이 아니라 같은 타입의 다른 이름이다."
    en: "Adds another name to an existing type; not a new type, the same one renamed."
  why:
    ko: >-
      {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:은,는}} {{pick.2|code}} 에 {{pick.3|code}} 라는 <b>별명</b>을 붙입니다.
      새 타입이 <b>아니에요</b> — 둘은 같은 타입이라 서로 넣을 수 있고 컴파일러가 구별하지 않습니다.
      쓰는 이유는 둘 — <code>struct node</code> 를 매번 적지 않으려고, 그리고 <code>uint32_t</code> 처럼
      폭을 이름에 적어 기계마다 바뀌는 타입을 한 자리에서 갈아 끼우려고. 한 가지 조심할 것 — 이
      이름이 생기는 순간부터 컴파일러는 그것을 <b>타입</b>으로 읽어서, 같은 글자를 변수 이름으로
      쓴 뒤 문장의 뜻이 바뀝니다.
    en: >-
      {{pick.1|code}} on line {{site.line}} gives {{pick.2|code}} the <b>alias</b> {{pick.3|code}}. It is
      <b>not</b> a new type — the two are the same type, freely assignable, and the compiler does not
      tell them apart. Two reasons to use it — to stop writing <code>struct node</code> every time, and
      to spell a width in a name like <code>uint32_t</code> so a machine-dependent type is swapped in
      one place. One caution — from the moment this name exists the compiler reads it as <b>a
      type</b>, so a later statement that uses the same word as a variable name changes meaning.
  trace:
    - ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 먼저 있어야 한다 — 별명은 있는 것에만 붙는다."
      en: "{{pick.2|code}} has to exist first — an alias attaches only to something that exists."
    - ko: "{{pick.1|code}}{{pick.1|josa:이,가}} {{pick.3|code}}{{pick.3|josa:을,를}} 그 타입의 다른 이름으로 등록한다."
      en: "{{pick.1|code}} registers {{pick.3|code}} as another name for that type."
    - ko: "{{site.line}}행 아래에서 두 이름은 같은 타입이다 — 컴파일러가 안 가른다."
      en: "Below line {{site.line}} the two names are one type — the compiler does not separate them."

rule:
  ko: "<b>별명은 새 타입이 아니다.</b> 같은 타입의 다른 이름이고, 그 이름은 그때부터 타입으로 읽힌다."
  en: "<b>An alias is not a new type.</b> It is another name for the same type, read as a type from then on."
result:
  label:
    ko: "{{site.line}}행의 별명"
    en: "the alias on line {{site.line}}"
  value: "{{pick.3}} = {{pick.2}}"
  note:
    ko: "같은 타입, 다른 이름"
    en: "same type, another name"
ok:
  ko: >-
    {{pick.3|code}}{{pick.3|josa:은,는}} 이제 {{pick.2|code}}{{pick.2|josa:과,와}} 같은 타입의 이름입니다.
  en: >-
    {{pick.3|code}} is now a name for the same type as {{pick.2|code}}.
payoff:
  ko: >-
    이걸 알면 <code>size_t</code>·<code>uint8_t</code> 가 마술이 아니게 됩니다 — 어느 헤더가 붙여 둔 별명이에요.
  en: >-
    This makes <code>size_t</code> and <code>uint8_t</code> stop looking like magic — aliases some header
    attached.
bridge:
  ko: >-
    파이썬의 <code>Point = tuple[int, int]</code> 도 별명입니다. C 가 다른 점은 별명이 생기면 파서가
    그 낱말을 타입으로 읽는다는 것 — 파이썬은 그런 일이 없어요.
  en: >-
    Python's <code>Point = tuple[int, int]</code> is an alias too. What differs in C is that once the
    alias exists the parser reads that word as a type — Python has no such effect.
misconceptions:
  # c.md §4 #28 · §8 ① — 규격에서 나온 사실이고 빈도 자료는 없다.
  - ko: "새 타입이 생긴다 — <b>이름 하나</b>가 생깁니다. 원래 타입과 서로 넣을 수 있어요."
    en: "A new type is made — <b>one name</b> is made. It and the original type are interchangeable."
  - ko: "<code>#define</code> 과 같다 — 저쪽은 <b>글자 치환</b>이라 <code>char *</code> 를 바꾸면 이름 둘 중 하나만 포인터가 됩니다. 별명은 타입 전체를 붙여요."
    en: "It equals <code>#define</code> — that one is <b>text substitution</b>, so aliasing <code>char *</code> makes only one of two names a pointer. An alias attaches the whole type."
  - ko: "별명 이름을 변수 이름으로 다시 써도 된다 — 컴파일러가 <b>타입</b>으로 읽어 뒤 문장의 뜻이 바뀝니다."
    en: "The alias can be reused as a variable name — the compiler reads it as <b>a type</b>, and later statements change meaning."
no_hole_reason: >-
  구멍은 뚫린다 — 첫 낱말이 늘 같아서. 다만 빈칸형을 여기서 내지 않는 이유는 오답 셋이 전부
  「같은 자리에 설 수 있는 낱말」이어야 하는데 이 낱말과 같은 자리에 서는 C 낱말이 없기
  때문이다. 낱말을 고르는 문항은 `c/struct-definition` 과 `c/macro-define` 이 맡는다.

point:
  - q:
      ko: "{{site.line}}행에서 <b>새로 붙는 이름</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the name being added</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.3
    diag:
      pick.1:
        t:
          ko: "{{pick.1|code}}{{pick.1|josa:은,는}} 별명을 <b>붙이라는 낱말</b>입니다. 붙는 이름은 줄의 끝에 있어요."
          en: "{{pick.1|code}} is <b>the word that says alias</b>. The name being added is at the end of the line."
        edge:
          h:
            ko: "가장 날카로운 자리 — 낱말과 이름"
            en: "The sharpest spot — the word and the name"
          code:
            - "typedef unsigned char byte;   /* byte 가 새 이름 */"
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>이미 있는 타입</b>입니다. 별명이 붙는 대상이지 새 이름이 아니에요."
          en: "{{pick.2|code}} is <b>the type that already exists</b>. It is what the alias attaches to, not the new name."
        edge:
          h:
            ko: "가장 날카로운 자리 — 대상과 이름"
            en: "The sharpest spot — the target and the name"
          code:
            - "typedef struct node Node;   /* struct node 가 대상 */"

meaning:
  - q:
      ko: "{{site.line}}행 뒤에서 {{pick.3|code}} 타입의 값을 {{pick.2|code}} 이름에 넣으면 어떻게 될까요?"
      en: "After line {{site.line}}, put a value of type {{pick.3|code}} into a name of type {{pick.2|code}} — what happens?"
    hint:
      ko: "별명은 새 타입이 아닙니다."
      en: "An alias is not a new type."
    options:
      - t:
          ko: "그냥 들어간다 — 같은 타입이라 컴파일러가 구별하지 않는다"
          en: "It just goes in — same type, the compiler does not tell them apart"
      - t:
          ko: "타입이 달라 컴파일 오류"
          en: "A compile error — different types"
        diag:
          t:
            ko: "별명은 <b>같은 타입</b>입니다. 오류를 내는 것은 새 타입을 만드는 언어(하스켈의 <code>newtype</code>)이고 C 는 아니에요."
            en: "An alias is <b>the same type</b>. Errors come from languages that make a new type (Haskell's <code>newtype</code>); C is not one."
          edge:
            h:
              ko: "가장 날카로운 자리 — 별명이냐 새 타입이냐"
              en: "The sharpest spot — alias or new type"
            code:
              - "typedef int meters; int n = (meters)3;   /* 된다 */"
      - t:
          ko: "변환이 일어난다"
          en: "A conversion happens"
        diag:
          t:
            ko: "변환할 것이 <b>없습니다</b>. 같은 비트, 같은 타입이에요."
            en: "There is <b>nothing</b> to convert. Same bits, same type."
          edge:
            h:
              ko: "가장 날카로운 자리 — 같은 것"
              en: "The sharpest spot — the same thing"
            code:
              - "meters m = 3; int n = m;   /* 변환 없음 */"
      - t:
          ko: "경고가 난다"
          en: "A warning"
        diag:
          t:
            ko: "경고도 <b>없습니다</b>. 컴파일러에게는 완전히 같은 타입이에요 — 그래서 별명으로는 단위 실수를 못 잡습니다."
            en: "<b>No</b> warning either. To the compiler they are exactly one type — which is why aliases cannot catch unit mistakes."
          edge:
            h:
              ko: "가장 날카로운 자리 — 못 잡는다"
              en: "The sharpest spot — it cannot catch"
            code:
              - "meters m = seconds_value;   /* 조용히 된다 */"

why_gate:
  q:
    ko: "C 는 왜 별명을 <b>새 타입이 아니라 같은 타입</b>으로 둘까요?"
    en: "Why does C make an alias <b>the same type rather than a new one</b>?"
  choices:
    - t:
        ko: "별명의 쓸모가 긴 이름을 줄이고 기계마다 다른 타입을 한 자리에서 갈아 끼우는 것이라, 원래 타입과 자유롭게 오가야 그 쓸모가 서기 때문"
        en: "Because an alias exists to shorten long names and swap machine-dependent types in one place, and that only works if it converts freely with the original"
      ok: true
      fb:
        ko: "그 방향입니다. 새 타입이 필요할 때 C 에서 무엇으로 만드는지도 적어 보세요."
        en: "That is the direction. Say what C uses when a genuinely new type is wanted."
    - t:
        ko: "새 타입을 만들 줄 몰라서"
        en: "Because new types could not be made"
      ok: false
      fb:
        ko: "덩이가 새 타입입니다. 별명은 일부러 같은 타입으로 둔 거예요."
        en: "A struct is a new type. The alias is kept the same type on purpose."
    - t:
        ko: "같은 타입이 더 빨라서"
        en: "Because the same type is faster"
      ok: false
      fb:
        ko: "속도와 무관합니다. 쓸모의 문제예요."
        en: "Speed is irrelevant. It is about usefulness."

queries:
  - { grammars: [c], file: ./typedef.scm }

examples:
  - code: "typedef unsigned char byte;       /* byte == unsigned char */"
    expect: { sites: 1, form: alias, hole: "typedef", picks: { 1: "typedef", 2: "unsigned char", 3: "byte" } }
  - code: "typedef struct node Node;         /* struct node 를 짧게 */"
    expect: { sites: 1, form: alias, hole: "typedef", picks: { 1: "typedef", 2: "struct node", 3: "Node" } }
  - code: "#define byte unsigned char        /* 글자 치환 — 다른 판이다 */"
    expect: none
