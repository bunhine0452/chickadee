schema: 1
id: c/null-check
# 2부 「포인터와 메모리」 (`docs/curriculum/c.md` §3 #19 · §0.6). 보편형은 `common/absent-value`.
# C 라서 다른 것 — `NULL` 은 낱말이 아니라 매크로이고, 「없음」이 아니라 0번지다.
universal: common/absent-value
name: { ko: 없는 자리인지 보기, en: Null check }
token: "NULL"
grammars: [c]
framework: null
essential: true
difficulty: 2
prereq: [c/pointer-declaration, c/if-statement, cs/null-reference]
confusions: []

dict:
  one_liner:
    ko: "가리키는 자리가 없다는 것을 0번지로 적는다. 여는 자리마다 먼저 견주어야 하고, 돌려준 뒤에는 손으로 되돌린다."
    en: "“No place” is address 0: compare before opening, reset by hand after freeing."
  why:
    ko: >-
      {{site.line}}행의 {{pick.3|code}}{{pick.3|josa:은,는}} 「가리키는 자리가 없다」를 적는 값이고, 실체는
      <b>0번지</b>입니다. 언어의 낱말이 아니라 헤더가 주는 매크로라 <code>stddef.h</code> 나
      <code>stdio.h</code> 없이는 컴파일러가 몰라요. {{pick.2|code}}{{pick.2|josa:을,를}} 열기 전에 이렇게
      견주는 이유는 0번지를 열면 답이 없기 때문이고, 대개 거기서 프로그램이 죽습니다. 그리고 C 는
      돌려준 자리를 <b>스스로 지우지 않아요</b> — <code>free(p)</code> 뒤에도 <code>p</code> 는 옛 번호를
      그대로 들고 있어서, <code>p = NULL;</code> 을 손으로 적어야 다음 검사가 참을 말합니다.
    en: >-
      {{pick.3|code}} on line {{site.line}} is the value that writes “no place to point at”, and in
      substance it is <b>address 0</b>. It is not a language word but a macro from a header, so without
      <code>stddef.h</code> or <code>stdio.h</code> the compiler does not know it. The reason to compare
      before opening {{pick.2|code}} is that opening address 0 has no answer, and the program usually
      dies there. And C does <b>not clear</b> a freed place by itself — after <code>free(p)</code>,
      <code>p</code> still holds the old number, so <code>p = NULL;</code> has to be written by hand for
      the next check to tell the truth.
  trace:
    - ko: "{{pick.2|code}} 안의 번호를 읽는다."
      en: "The number inside {{pick.2|code}} is read."
    - ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 그 번호를 {{pick.3|code}}, 곧 0 과 견주거나 그것으로 되돌린다."
      en: "{{pick.1|code}} compares that number with {{pick.3|code}}, that is 0, or resets it to that."
    - ko: "{{site.line}}행 뒤에서 0 이면 열지 않는다 — 0번지를 열면 답이 없다."
      en: "After line {{site.line}}, a 0 is not opened — opening address 0 has no answer."

rule:
  ko: "<b>없음은 0번지다.</b> 열기 전에 견주고, 돌려준 뒤에는 손으로 0 으로 되돌린다."
  en: "<b>Absence is address 0.</b> Compare before opening, and reset to 0 by hand after freeing."
result:
  label:
    ko: "{{site.line}}행의 검사"
    en: "the check on line {{site.line}}"
  value: "{{pick.2}} {{pick.1}} {{pick.3}}"
  note:
    ko: "0번지인가"
    en: "is it address 0"
ok:
  ko: >-
    {{pick.2|code}}{{pick.2|josa:이,가}} 0번지인지를 {{site.line}}행이 봅니다 — 열기 전의 문지기예요.
  en: >-
    Line {{site.line}} checks whether {{pick.2|code}} is address 0 — the gatekeeper before opening.
payoff:
  ko: >-
    이걸 알면 <code>free</code> 뒤의 검사가 왜 통과하는지가 풀립니다 — 포인터가 옛 번호를 그대로
    들고 있었던 거예요.
  en: >-
    This untangles why a check after <code>free</code> passes — the pointer still held the old number.
bridge:
  ko: >-
    파이썬의 <code>None</code> 은 값이고 타입도 있습니다. C 의 없음은 그냥 0 이라 수와 섞이고,
    `if (p)` 로도 같은 검사가 돼요.
  en: >-
    Python's <code>None</code> is a value with a type. C's absence is just 0, so it mixes with numbers,
    and <code>if (p)</code> is the same check.
misconceptions:
  # c.md §3 #19 · §9 #9 — 규격에서 나온 사실이고 빈도 자료는 없다.
  - ko: "<code>free(p)</code> 하면 <code>p</code> 가 0 이 된다 — <b>옛 번호 그대로</b>입니다. 그래서 되돌리는 줄을 손으로 적어요."
    en: "<code>free(p)</code> makes <code>p</code> 0 — it keeps <b>the old number</b>. That is why the reset line is written by hand."
  - ko: "이 낱말은 언어의 것이다 — <b>헤더의 매크로</b>입니다. 헤더 없이 쓰면 모르는 이름이라고 멈춰요."
    en: "This word belongs to the language — it is <b>a header macro</b>. Without the header the compiler stops on an unknown name."
  - ko: "0번지를 열면 오류가 나서 알려 준다 — 답이 <b>없습니다</b>. 대개 죽지만 규격은 아무것도 약속 안 해요."
    en: "Opening address 0 raises an error that tells you — there is <b>no answer</b>. It usually dies, but the standard promises nothing."

point:
  - q:
      ko: "{{site.line}}행에서 <b>「없는 자리」를 적은 값</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the value that writes “no place”</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.3
    diag:
      pick.1:
        t:
          ko: "{{pick.1|code}}{{pick.1|josa:은,는}} 견주거나 넣는 <b>기호</b>입니다. 없음 자체는 그 옆의 값이에요."
          en: "{{pick.1|code}} is the <b>symbol</b> that compares or puts. Absence itself is the value beside it."
        edge:
          h:
            ko: "가장 날카로운 자리 — 기호와 값"
            en: "The sharpest spot — the symbol and the value"
          code:
            - "p == NULL   /* == 가 견주고 NULL 이 없음 */"
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 검사받는 <b>포인터</b>입니다. 없음일 수도 있는 쪽이지 없음 자체는 아니에요."
          en: "{{pick.2|code}} is <b>the pointer</b> being checked. It may be absent; it is not absence itself."
        edge:
          h:
            ko: "가장 날카로운 자리 — 검사받는 쪽"
            en: "The sharpest spot — the one being checked"
          code:
            - "if (p == NULL)   /* p 를 본다 */"

meaning:
  - q:
      ko: "<code>free(p);</code> 바로 뒤에 <code>if ({{pick.2}} == {{pick.3}})</code> 을 두면 어느 쪽으로 갈까요?"
      en: "Right after <code>free(p);</code>, write <code>if ({{pick.2}} == {{pick.3}})</code> — which way does it go?"
    hint:
      ko: "돌려주기는 자리를 돌려주지 번호를 지우지 않습니다."
      en: "Freeing returns the place; it does not erase the number."
    options:
      - t:
          ko: "거짓 — 포인터는 옛 번호를 그대로 들고 있다"
          en: "False — the pointer still holds the old number"
      - t:
          ko: "참 — 돌려줬으니 없음이다"
          en: "True — it was freed, so it is absent"
        diag:
          t:
            ko: "<code>free</code> 는 <b>자리</b>를 돌려줄 뿐 포인터 안의 번호는 안 건드립니다. 없음으로 만들려면 손으로 넣어야 해요."
            en: "<code>free</code> returns <b>the place</b> and leaves the number inside the pointer alone. Making it absent takes a putting by hand."
          edge:
            h:
              ko: "가장 날카로운 자리 — 자리와 번호"
              en: "The sharpest spot — the place and the number"
            code:
              - "free(p);      /* 자리 돌려줌 */"
              - "p = NULL;     /* 번호 지움 — 손으로 */"
      - t:
          ko: "답이 없다"
          en: "No answer"
        diag:
          t:
            ko: "견주기 자체는 <b>답이 있습니다</b> — 번호끼리 견주는 것뿐이에요. 답이 없어지는 것은 그 번호를 <b>열 때</b>입니다."
            en: "The comparison itself <b>has an answer</b> — it only compares numbers. The answer is lost when that number is <b>opened</b>."
          edge:
            h:
              ko: "가장 날카로운 자리 — 견주기와 열기"
              en: "The sharpest spot — comparing and opening"
            code:
              - "p == NULL   /* 된다 */"
              - "*p          /* 답 없음 */"
      - t:
          ko: "컴파일 오류"
          en: "A compile error"
        diag:
          t:
            ko: "완전히 합법입니다. 그래서 <b>조용히 틀리는</b> 자리예요 — 검사가 거짓을 말합니다."
            en: "Fully legal. That is what makes it a <b>quiet failure</b> — the check tells a lie."
          edge:
            h:
              ko: "가장 날카로운 자리 — 조용히 틀린다"
              en: "The sharpest spot — quiet failure"
            code:
              - "free(p); if (p == NULL) …   /* 안 들어간다 */"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 <b>「없는 자리」</b>를 적습니다."
      en: "Choose what goes in the blank. Line {{site.line}} writes <b>“no place”</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "NULL", mono: true }
      - t: "nil"
        mono: true
        diag:
          t:
            ko: "이건 <b>Go·루비의 낱말</b>입니다. C 에는 없어서 모르는 이름이라고 멈춰요."
            en: "That is <b>Go's and Ruby's word</b>. C does not have it and stops on an unknown name."
          edge:
            h:
              ko: "가장 날카로운 자리 — 다른 언어의 낱말"
              en: "The sharpest spot — another language's word"
            code:
              - "p = nil;    /* 오류 */"
              - "p = NULL;"
      - t: "null"
        mono: true
        diag:
          t:
            ko: "소문자는 <b>자바·JS 의 낱말</b>입니다. C 의 매크로는 대문자 넷이에요."
            en: "Lowercase is <b>Java's and JS's word</b>. C's macro is four capitals."
          edge:
            h:
              ko: "가장 날카로운 자리 — 대소문자"
              en: "The sharpest spot — the case"
            code:
              - "p = null;   /* 오류 */"
              - "p = NULL;"
      - t: "None"
        mono: true
        diag:
          t:
            ko: "이건 <b>파이썬의 값</b>입니다. C 에는 없음이라는 값이 따로 없고 0번지를 쓸 뿐이에요."
            en: "That is <b>Python's value</b>. C has no separate absence value; it uses address 0."
          edge:
            h:
              ko: "가장 날카로운 자리 — 값이 아니라 0번지"
              en: "The sharpest spot — address 0, not a value"
            code:
              - "p = None;   /* 오류 */"

why_gate:
  q:
    ko: "C 는 왜 없음을 따로 된 값이 아니라 <b>0번지</b>로 둘까요?"
    en: "Why does C write absence as <b>address 0</b> rather than a value of its own?"
  choices:
    - t:
        ko: "포인터가 그냥 번호라 없음도 번호여야 하고, 0번지는 어떤 값도 놓이지 않게 비워 둔 자리라 「없음」으로 쓰기에 안전하기 때문"
        en: "Because a pointer is just a number so absence must be a number too, and address 0 is kept empty of any value, making it safe to mean “none”"
      ok: true
      fb:
        ko: "그 방향입니다. 그 선택 때문에 <code>if (p)</code> 가 무엇을 뜻하게 되는지도 적어 보세요."
        en: "That is the direction. Say what <code>if (p)</code> comes to mean because of that choice."
    - t:
        ko: "없음이라는 값을 만들 줄 몰라서"
        en: "Because nobody knew how to make an absence value"
      ok: false
      fb:
        ko: "만들 줄 몰라서가 아니라 번호 하나로 두기로 한 것입니다. 타입을 하나 더 안 얹는 C 의 습관이에요."
        en: "Not inability but a choice to keep it one number. Adding no extra type is C's habit."
    - t:
        ko: "0 이 가장 빠른 수라서"
        en: "Because 0 is the fastest number"
      ok: false
      fb:
        ko: "속도가 아닙니다. 0번지가 비어 있다는 것이 이유예요."
        en: "Not speed. The reason is that address 0 is kept empty."

queries:
  - { grammars: [c], file: ./null-check.scm }

examples:
  - code: "if (p == NULL) return 1;        /* 열기 전의 문지기 */"
    expect: { sites: 1, form: compare, hole: "NULL", picks: { 1: "==", 2: "p", 3: "NULL" } }
  - code: "p = NULL;                       /* free 뒤 손으로 되돌린다 */"
    expect: { sites: 1, form: reset, hole: "NULL", picks: { 1: "=", 2: "p", 3: "NULL" } }
  - code: "int *p = NULL;                  /* 아무 데도 안 가리키게 만든다 */"
    expect: { sites: 1, form: init, hole: "NULL", picks: { 2: "p", 3: "NULL" } }
  - code: "if (!p) return 2;               /* 0 이냐 — 다른 판이다 */"
    expect: none
  - code: "if (p == 0) return 3;           /* 낱말 없이 0 — 이 판은 낱말을 짚는다 */"
    expect: none
