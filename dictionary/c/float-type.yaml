schema: 1
id: c/float-type
# 0부 축 B 신규 (`docs/curriculum/c.md` §0.1 #6). 보편형은 `common/float-literal` 이다 — 근사값이
# 되는 기계는 IEEE-754 하나라 열 언어가 같은 값을 낸다. C 에서 더 배울 것은 하나뿐이다:
# 실수 리터럴은 `double` 이라 `float` 상자에 넣으면 **두 번** 잘린다.
universal: common/float-literal
name: { ko: 실수는 왜 안 떨어지나, en: Floating point }
token: "0.1"
grammars: [c]
framework: null
essential: true
difficulty: 2
prereq: [cs/floating-point, cs/binary-representation, c/number-literal]
confusions: [c/comparison]

dict:
  one_liner:
    ko: "2진수로 못 적는 소수가 있어 0.1 과 0.2 를 더해도 0.3 이 아니다. 점이 있는 값은 이미 넓은 쪽이다."
    en: "Some fractions have no exact base-two form; a dotted literal is the wide kind."
  why:
    ko: >-
      실수는 <b>2진 분수의 합</b>으로 저장됩니다. <code>0.1</code> 은 그 합으로 정확히 못 적어요 —
      10진수로 <code>1/3</code> 을 못 적는 것과 같은 일입니다. 저장되는 것은 가장 가까운 값이고,
      {{site.line}}행처럼 그런 값 둘로 셈하면 <code>0.30000000000000004</code> 같은 값이 나옵니다.
      C 에서 하나 더 — 점이 있는 리터럴은 <b><code>double</code></b> 이라, <code>float f = 0.1;</code> 은
      먼저 <code>double</code> 로 근사되고 <code>float</code> 에 넣으며 <b>한 번 더</b> 잘립니다.
      끝에 <code>f</code> 를 붙이면 한 번만 잘려요.
    en: >-
      A decimal is stored as a <b>sum of binary fractions</b>. <code>0.1</code> has no exact form
      there — the same way base ten cannot write <code>1/3</code>. What is stored is the nearest value,
      and arithmetic on two such values, as on line {{site.line}}, gives something like
      <code>0.30000000000000004</code>. One more thing in C — a literal with a dot is a
      <b><code>double</code></b>, so <code>float f = 0.1;</code> is first rounded as a
      <code>double</code> and then cut <b>once more</b> going into the <code>float</code>. A trailing
      <code>f</code> cuts it only once.
  trace:
    - ko: "{{site.line}}행의 {{pick.3|code}}{{pick.3|josa:은,는}} 적히는 순간 이미 가장 가까운 2진 분수다."
      en: "{{pick.3|code}} on line {{site.line}} is already the nearest binary fraction the moment it is written."
    - ko: "{{pick.2|code}}{{pick.2|josa:과,와}} 만나는 {{pick.1|code}}{{pick.1|josa:으로,로}} 셈하거나 넣으면 그 근사값끼리 만난다."
      en: "Combining it with {{pick.2|code}} through {{pick.1|code}} brings approximations together."
    - ko: "결과는 10진수로 딱 떨어지지 않고, 좁은 상자에 넣으면 한 번 더 잘린다."
      en: "The result does not land in base ten, and a narrower box cuts it once more."

rule:
  ko: "<b>실수는 근사값이다.</b> 같음 기호로 견주지 않고, 점이 있는 리터럴은 넓은 쪽임을 안다."
  en: "<b>Decimals are approximations.</b> Do not compare with equality; a dotted literal is the wide kind."
result:
  label:
    ko: "{{site.line}}행의 실수"
    en: "the decimal on line {{site.line}}"
  value: "{{pick.2}} {{pick.1}} {{pick.3}}"
  note:
    ko: "결과는 10진수로 안 떨어진다"
    en: "the result does not land in base ten"
ok:
  ko: >-
    {{pick.3|code}}{{pick.3|josa:은,는}} 근사값이었고, {{pick.2|code}}{{pick.2|josa:과,와}} 만나며 그 오차가
    남았습니다.
  en: >-
    {{pick.3|code}} was an approximation, and meeting {{pick.2|code}} kept that error.
payoff:
  ko: >-
    이걸 알면 「합계가 0.30000000000000004 로 찍힌다」와 「float 에 넣었더니 값이 또 달라졌다」가
    한 번에 풀립니다.
  en: >-
    This untangles both “the total prints as 0.30000000000000004” and “it changed again going into a
    float”.
bridge:
  ko: >-
    파이썬·자바도 같은 기계라 같은 값이 나옵니다. C 만 다른 것은 실수 리터럴이 넓은 타입이라
    좁은 상자에 넣을 때 두 번 잘린다는 점이에요.
  en: >-
    Python and Java run the same machine and print the same value. What only C adds is that a
    decimal literal is the wide type, so it is cut twice going into a narrow box.
misconceptions:
  # c.md §0.1 #6 · §0.2 — 규격에서 나온 사실이고 빈도 자료는 없다.
  - ko: "0.1 과 0.2 를 더하면 0.3 이다 — 어느 언어도 그 값을 안 냅니다. 사람의 산수에서만 맞아요."
    en: "0.1 plus 0.2 is 0.3 — no language gives that. It is right only in hand arithmetic."
  - ko: "float 상자에 0.1 을 넣으면 0.1 이 들어간다 — 점이 있는 리터럴은 <b>double</b> 이라 float 에 넣으며 한 번 더 잘립니다. <code>0.1f</code> 라고 적어야 한 번입니다."
    en: "Putting 0.1 into a float stores 0.1 — a dotted literal is a <b>double</b>, cut once more going into the float. Write <code>0.1f</code> to cut it only once."
  - ko: "자릿수를 늘리면 정확해진다 — 넓은 타입도 근사값입니다. 자릿수만 늘어나요."
    en: "More digits fixes it — the wider type is still an approximation, only with more digits."
no_hole_reason: >-
  구멍을 못 뚫는다. 이 개념의 정답은 코드에 적힌 글자가 아니라 **계산된 값**이고, 셈 기호를
  구멍으로 삼으면 한 글자라 빈칸형이 생성 단계에서 떨어진다(`MIN_HOLE`). 값을 묻는 판은
  기초 문항(`docs/program/fundamentals.md` §2 `value`)의 몫이다.

point:
  - q:
      ko: "{{site.line}}행에서 <b>근사값이 다른 값과 만나는 기호</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the symbol where the approximation meets another value</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 한쪽 <b>재료</b>입니다. 그 자체로 근사값일 수 있지만, 오차가 결과에 실리는 것은 가운데 기호에서예요."
          en: "{{pick.2|code}} is one <b>input</b>. It may itself be an approximation, but the error lands in the result at the symbol between."
        edge:
          h:
            ko: "가장 날카로운 자리 — 재료냐 만남이냐"
            en: "The sharpest spot — an input or the meeting"
          code:
            - "0.1;          /* 그 자체로 근사값 */"
            - "0.1 + 0.2;    /* 근사값 둘이 만난다 */"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 다른 쪽 <b>재료</b>입니다. 점이 있으니 이미 넓은 타입의 근사값이에요."
          en: "{{pick.3|code}} is the other <b>input</b>. With its dot it is already an approximation of the wide type."
        edge:
          h:
            ko: "가장 날카로운 자리 — 점이 있는 값은 넓다"
            en: "The sharpest spot — a dotted value is wide"
          code:
            - "0.2     /* double */"
            - "0.2f    /* float */"

meaning:
  - q:
      ko: "{{site.line}}행의 결과를 <b>같음 기호</b>로 0.3 과 견주면 어떻게 될까요?"
      en: "Compare the result on line {{site.line}} with 0.3 using <b>equality</b> — what happens?"
    hint:
      ko: "저장된 값이 사람이 적은 값과 마지막 자리에서 다를 수 있습니다."
      en: "The stored value may differ from what a person wrote in the last digit."
    options:
      - t:
          ko: "거짓이다 — 저장된 두 값이 마지막 자리에서 다르고, 같음 기호는 그 한 자리도 다르다고 본다"
          en: "False — the two stored values differ in the last digit, and equality counts that digit"
      - t:
          ko: "참이다 — 사람이 보기에 같으니까"
          en: "True — they look the same to a person"
        diag:
          t:
            ko: "같음 기호는 사람 눈이 아니라 <b>비트</b>를 봅니다. 찍을 때 반올림된 모양이 같아도 비트가 다르면 거짓이에요."
            en: "Equality looks at <b>bits</b>, not at a person's eye. Even if the printed, rounded shape matches, different bits give false."
          edge:
            h:
              ko: "가장 날카로운 자리 — 눈이냐 비트냐"
              en: "The sharpest spot — the eye or the bits"
            code:
              - "0.1 + 0.2 == 0.3   /* 0 */"
      - t:
          ko: "컴파일러가 막는다"
          en: "The compiler blocks it"
        diag:
          t:
            ko: "막지 않습니다. 컴파일도 되고 돌기도 해요 — 조건이 안 맞을 뿐이고, 좋은 컴파일러가 경고를 낼 수는 있습니다."
            en: "It is not blocked. It compiles and runs — the condition simply fails, though a good compiler may warn."
          edge:
            h:
              ko: "가장 날카로운 자리 — 막힘이냐 거짓이냐"
              en: "The sharpest spot — blocked or false"
            code:
              - "if (d == 0.3)   /* 컴파일 된다, 안 들어간다 */"
      - t:
          ko: "float 로 바꾸면 참이 된다"
          en: "Switching to float makes it true"
        diag:
          t:
            ko: "좁은 상자는 <b>더 많이</b> 잘립니다. 근사값끼리 우연히 같아질 수는 있어도 그것은 규칙이 아니에요."
            en: "A narrower box cuts <b>more</b>. Two approximations may happen to coincide, but that is not a rule."
          edge:
            h:
              ko: "가장 날카로운 자리 — 좁히면 더 잘린다"
              en: "The sharpest spot — narrower cuts more"
            code:
              - "float f = 0.1;   /* 두 번 잘린 값 */"

why_gate:
  q:
    ko: "{{site.line}}행처럼 계산한 소수를 왜 <b>같음 기호로 견주면 안 될까요</b>?"
    en: "Why should a computed decimal like the one on line {{site.line}} <b>not be compared with equality</b>?"
  choices:
    - t:
        ko: "저장된 값이 사람이 적은 값과 마지막 자리에서 다를 수 있고, 같음 기호는 그 한 자리도 다르다고 보기 때문"
        en: "Because the stored value can differ in the last digit from what a person wrote, and equality counts that digit"
      ok: true
      fb:
        ko: "그 방향입니다. 그럼 무엇으로 견줄지도 한 줄로 적어 보세요 — 차이의 크기입니다."
        en: "That is the direction. Add a line on what to compare with instead — the size of the gap."
    - t:
        ko: "실수 견주기가 느려서"
        en: "Because comparing decimals is slow"
      ok: false
      fb:
        ko: "속도 문제가 아닙니다. 값이 다르다는 것이 문제예요."
        en: "Speed is not it. The problem is that the values differ."
    - t:
        ko: "C 가 실수 견주기를 막아 놓아서"
        en: "Because C forbids comparing decimals"
      ok: false
      fb:
        ko: "막지 않습니다. 컴파일도 되고 돌기도 합니다 — 조건이 안 맞을 뿐이에요."
        en: "It is not forbidden. It compiles and runs — the condition simply does not hold."

queries:
  - { grammars: [c], file: ./float-type.scm }

examples:
  - code: "double s = 0.1 + 0.2;    /* s -> 0.30000000000000004 (double) */"
    expect: { sites: 1, form: floatop, picks: { 1: "+", 2: "0.1", 3: "0.2" } }
  - code: "double t = x * 1.5;      /* t -> x 의 1.5배에 가장 가까운 값 (double) */"
    expect: { sites: 1, form: floatop, picks: { 1: "*", 2: "x", 3: "1.5" } }
  - code: "float f = 0.1;           /* f -> 0.1 을 두 번 근사한 값 (float) */"
    expect: { sites: 1, form: narrowed, picks: { 1: "float", 2: "f", 3: "0.1" } }
  - code: "double d = 0.1;          /* d -> 0.1 에 가장 가까운 값 (double) */"
    expect: { sites: 1, form: floatlit, picks: { 1: "double", 2: "d", 3: "0.1" } }
  - code: "int same = (d == 0.3);   /* same -> 0 (int) */"
    expect: { sites: 1, form: floateq, picks: { 1: "==", 2: "d", 3: "0.3" } }
  - code: "int n = 1 + 2;           /* 정수 셈 — 다른 판이다 */"
    expect: none
  - code: "double d = 7 / 2;        /* 셈은 정수였다 — 다른 판이다 */"
    expect: none
