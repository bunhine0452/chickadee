schema: 1
id: c/string-literal
# 1부 「문과 흐름」 (`docs/curriculum/c.md` §3 #10 · §0.6). 보편형은 `common/text-literal`.
# C 라서 다른 것 — 문자열이 타입이 아니라 관습이다. `"hi"` 는 3칸이고 길이는 아무 데도 안 적혀 있다.
universal: common/text-literal
name: { ko: 글자들이 놓인 자리, en: String literal }
token: "\"hi\""
grammars: [c]
framework: null
essential: true
difficulty: 1
prereq: [c/char-literal, cs/text-encoding, cs/memory-layout]
confusions: []

dict:
  one_liner:
    ko: "큰따옴표 안의 글자들은 값이 아니라 칸이 이어진 자리다. 끝에 보이지 않는 0 한 칸이 붙는다."
    en: "Double-quoted characters are a run of slots with an unseen 0 slot at the end."
  why:
    ko: >-
      C 에는 문자열 타입이 <b>없습니다</b>. {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:은,는}} 글자 칸들이
      이어진 <b>자리</b>이고, 마지막에 보이지 않는 <b>0 한 칸</b>이 붙어 있어요 — <code>"hi"</code> 는
      2칸이 아니라 3칸입니다. 길이는 아무 데도 안 적혀 있어서 <code>strlen</code> 이 0 을 만날 때까지
      세고, 그 0 이 없으면 옆 기억을 계속 읽습니다. 그리고 {{pick.2|code}}{{pick.2|josa:이,가}} 어떤
      선언이냐로 <b>누구의 칸</b>인지 갈려요 — 배열이면 내 칸에 복사되어 고칠 수 있고, 포인터면 남의
      칸을 가리켜 고치면 답이 없습니다.
    en: >-
      C has <b>no</b> string type. {{pick.1|code}} on line {{site.line}} is a <b>place</b> of
      consecutive character slots, with an unseen <b>0 slot</b> at the end — <code>"hi"</code> is three
      slots, not two. The length is written nowhere, so <code>strlen</code> counts until it meets that 0,
      and without the 0 it keeps reading neighbouring memory. And how {{pick.2|code}} is declared decides
      <b>whose slots</b> they are — an array copies them into your own slots, which you may change; a
      pointer points at someone else's, and changing those has no answer.
  trace:
    - ko: "{{pick.1|code}}{{pick.1|josa:은,는}} 글자 수보다 한 칸 긴 자리로 놓인다 — 끝의 0 까지."
      en: "{{pick.1|code}} is laid out one slot longer than its characters — up to the final 0."
    - ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 그 자리를 복사받거나(배열) 가리킨다(포인터)."
      en: "{{pick.2|code}} either receives a copy of it (array) or points at it (pointer)."
    - ko: "{{site.line}}행 아래에서 길이를 아는 길은 0 을 만날 때까지 세는 것뿐이다."
      en: "Below line {{site.line}}, the only way to know the length is to count until the 0."

rule:
  ko: "<b>문자열은 0 으로 끝나는 칸들이다.</b> 길이는 안 적혀 있고, 배열은 내 칸이며 포인터는 남의 칸이다."
  en: "<b>A string is slots ending in 0.</b> No length is stored; an array owns its slots, a pointer borrows."
result:
  label:
    ko: "{{site.line}}행의 글자 자리"
    en: "the character place on line {{site.line}}"
  value: "{{pick.1}}"
  note:
    ko: "글자 수 + 1 칸"
    en: "characters plus one slot"
ok:
  ko: >-
    {{pick.1|code}}{{pick.1|josa:은,는}} 끝의 0 까지 놓였고 {{pick.2|code}}{{pick.2|josa:이,가}} 그 자리를 얻었습니다.
  en: >-
    {{pick.1|code}} was laid out up to its final 0, and {{pick.2|code}} got that place.
payoff:
  ko: >-
    이걸 알면 「버퍼가 한 칸 모자라 이상한 글자가 붙는다」가 풀립니다 — 끝의 0 칸을 안 센 거예요.
  en: >-
    This untangles “my buffer is one slot short and strange characters appear” — the final 0 slot was
    not counted.
bridge:
  ko: >-
    파이썬의 문자열은 길이를 아는 값이라 잇고 자르는 일이 안전합니다. C 는 길이가 없는 칸들이라
    그 일을 사람이 0 을 세며 해야 해요.
  en: >-
    A Python string is a value that knows its length, so joining and slicing are safe. C has slots
    without a length, so a person does that work by counting to the 0.
misconceptions:
  # c.md §9 #5 · #14 — 규격에서 나온 사실이고 빈도 자료는 없다.
  - ko: "<code>\"hi\"</code> 는 2칸이다 — <b>3칸</b>입니다. 끝의 0 이 문자열의 일부예요."
    en: "<code>\"hi\"</code> is two slots — it is <b>three</b>. The final 0 is part of the string."
  - ko: "문자열은 타입이다 — <code>char[]</code>(내 칸) · <code>char*</code>(남의 칸) · 리터럴(고치면 답 없음) <b>셋이 다릅니다</b>. 길이가 아니라 소유의 문제예요."
    en: "A string is a type — <code>char[]</code> (your slots), <code>char*</code> (someone else's) and the literal (no answer if changed) are <b>three different things</b>. It is about ownership, not length."
  - ko: "포인터로 받은 리터럴은 고칠 수 있다 — 리터럴의 칸을 고치면 <b>답이 없습니다</b>. 고치려면 배열로 복사해야 해요."
    en: "A literal held through a pointer can be changed — changing the literal's slots has <b>no answer</b>. Copy it into an array to change it."

point:
  - q:
      ko: "{{site.line}}행에서 <b>끝에 0 한 칸이 붙는 자리</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the place that gets a 0 slot at its end</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 그 자리를 <b>받는 이름</b>입니다. 이름 자체에는 칸이 안 붙어요 — 칸은 따옴표 안이 만듭니다."
          en: "{{pick.2|code}} is <b>the name that receives</b> the place. No slot attaches to the name itself — the quotes make the slots."
        edge:
          h:
            ko: "가장 날카로운 자리 — 이름이냐 칸이냐"
            en: "The sharpest spot — the name or the slots"
          code:
            - "char s[] = \"hi\";   /* \"hi\" 가 3칸, s 는 이름 */"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 칸 하나의 <b>타입</b>입니다. 글자 한 칸의 크기를 말할 뿐 몇 칸인지는 따옴표 안이 정해요."
          en: "{{pick.3|code}} is <b>the type of one slot</b>. It says how big one character slot is; how many there are is decided inside the quotes."
        edge:
          h:
            ko: "가장 날카로운 자리 — 한 칸이냐 여러 칸이냐"
            en: "The sharpest spot — one slot or many"
          code:
            - "char c = 'a';        /* 한 칸 */"
            - "char s[] = \"hi\";   /* 세 칸 */"

meaning:
  - q:
      ko: "{{site.line}}행의 {{pick.1|code}}{{pick.1|josa:을,를}} <code>sizeof</code> 로 재면 몇이 나올까요?"
      en: "Measure {{pick.1|code}} from line {{site.line}} with <code>sizeof</code> — what comes out?"
    hint:
      ko: "보이는 글자 수와 칸 수는 다릅니다."
      en: "The visible characters and the slots differ."
    options:
      - t:
          ko: "글자 수 + 1 — 끝의 0 칸까지"
          en: "The characters plus 1 — up to the final 0 slot"
      - t:
          ko: "글자 수 그대로"
          en: "Exactly the characters"
        diag:
          t:
            ko: "그것은 <code>strlen</code> 의 답입니다. <code>sizeof</code> 는 <b>칸 수</b>를 재고, 끝의 0 도 한 칸이에요."
            en: "That is <code>strlen</code>'s answer. <code>sizeof</code> measures <b>slots</b>, and the final 0 is a slot."
          edge:
            h:
              ko: "가장 날카로운 자리 — 세는 것이 다르다"
              en: "The sharpest spot — they count different things"
            code:
              - "strlen(\"hi\")   /* 2 */"
              - "sizeof(\"hi\")   /* 3 */"
      - t:
          ko: "포인터 크기 — 8"
          en: "The pointer size — 8"
        diag:
          t:
            ko: "리터럴 자체는 <b>배열</b>이라 칸 수가 나옵니다. 포인터 크기가 나오는 것은 <code>char *p</code> 를 잴 때예요."
            en: "The literal itself is an <b>array</b>, so the slot count comes out. The pointer size appears when you measure a <code>char *p</code>."
          edge:
            h:
              ko: "가장 날카로운 자리 — 배열이냐 포인터냐"
              en: "The sharpest spot — array or pointer"
            code:
              - "sizeof(\"hi\")   /* 3 */"
              - "sizeof(p)      /* 8 */"
      - t:
          ko: "컴파일 오류"
          en: "A compile error"
        diag:
          t:
            ko: "<code>sizeof</code> 는 어떤 값에도 됩니다. 리터럴에 재면 칸 수가 나와요."
            en: "<code>sizeof</code> works on any value. On a literal it yields the slot count."
          edge:
            h:
              ko: "가장 날카로운 자리 — 어떤 값이든 잰다"
              en: "The sharpest spot — anything can be measured"
            code:
              - "sizeof(\"\")   /* 1 — 0 한 칸 */"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 <b>글자들이 놓인 자리</b>를 만듭니다."
      en: "Choose what goes in the blank. Line {{site.line}} makes <b>a place where characters sit</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "\"hi\"", mono: true }
      - t: "'hi'"
        mono: true
        diag:
          t:
            ko: "작은따옴표 안에 <b>글자 둘</b>은 하나의 수로 접히고 그 수는 구현마다 다릅니다. 글자 자리가 아니에요."
            en: "<b>Two characters</b> in single quotes fold to one number that differs per implementation. It is not a character place."
          edge:
            h:
              ko: "가장 날카로운 자리 — 따옴표 종류"
              en: "The sharpest spot — which quotes"
            code:
              - "'hi'    /* 수 하나, 구현마다 다름 */"
              - "\"hi\"   /* 3칸 */"
      - t: "hi"
        mono: true
        diag:
          t:
            ko: "따옴표 없는 <code>hi</code> 는 <b>이름</b>입니다. 그런 이름이 없으면 컴파일러가 멈춰요."
            en: "Unquoted <code>hi</code> is a <b>name</b>. If no such name exists the compiler stops."
          edge:
            h:
              ko: "가장 날카로운 자리 — 따옴표가 자리를 만든다"
              en: "The sharpest spot — quotes make the place"
            code:
              - "char s[] = hi;   /* hi 를 찾는다 */"
      - t: "{'h','i'}"
        mono: true
        diag:
          t:
            ko: "글자 둘을 직접 나열하면 <b>끝의 0 이 없습니다</b>. 컴파일은 되지만 길이를 셀 때 옆 기억을 계속 읽어요."
            en: "Listing two characters by hand leaves <b>no final 0</b>. It compiles, but counting the length keeps reading neighbouring memory."
          edge:
            h:
              ko: "가장 날카로운 자리 — 0 한 칸"
              en: "The sharpest spot — the one 0 slot"
            code:
              - "char s[] = {'h','i'};      /* 2칸, 끝 없음 */"
              - "char s[] = {'h','i',0};    /* 3칸 */"

why_gate:
  q:
    ko: "C 는 왜 문자열의 길이를 적지 않고 <b>끝에 0 을 두는</b> 방식을 골랐을까요?"
    en: "Why did C choose <b>a 0 at the end</b> instead of storing the string's length?"
  choices:
    - t:
        ko: "글자 칸 앞에 길이 칸을 두면 그 칸의 폭을 정해야 하고 부분 문자열마다 새 길이가 필요한데, 끝 표시 하나면 어느 칸에서 시작하든 그대로 문자열이 되기 때문"
        en: "Because a length slot before the characters needs a fixed width and every substring needs a new length, whereas one end mark makes a string out of any starting slot"
      ok: true
      fb:
        ko: "그 방향입니다. 그 선택의 대가 — 길이를 알려면 매번 세야 한다 — 도 적어 보세요."
        en: "That is the direction. Add the cost of that choice — the length has to be counted every time."
    - t:
        ko: "길이를 저장할 공간이 없어서"
        en: "Because there was no room to store a length"
      ok: false
      fb:
        ko: "공간의 문제가 아닙니다. 어느 칸에서든 시작할 수 있게 한 설계예요."
        en: "It is not about room. The design lets a string start at any slot."
    - t:
        ko: "0 이 특별한 글자라서"
        en: "Because 0 is a special character"
      ok: false
      fb:
        ko: "0 이 특별해진 것은 결과입니다. 글자로 안 쓰이는 값이라 끝 표시로 고른 거예요."
        en: "0 became special as a result. It was chosen as the end mark because it is not used as a character."

queries:
  - { grammars: [c], file: ./string-literal.scm }

examples:
  - code: "char s[] = \"hi\";               /* s -> 3칸, 내 것 */"
    expect: { sites: 1, form: array, hole: "\"hi\"", picks: { 1: "\"hi\"", 2: "s", 3: "char" } }
  - code: "const char *msg = \"hello\";     /* msg -> 리터럴의 자리를 가리킨다 */"
    expect: { sites: 1, form: pointer, hole: "\"hello\"", picks: { 1: "\"hello\"", 2: "msg", 3: "char" } }
  - code: "puts(\"hi\");                    /* 인자 자리 */"
    expect: { sites: 1, form: argument, hole: "\"hi\"", picks: { 1: "\"hi\"", 2: "puts" } }
  - code: "char c = 'a';                   /* 글자 하나 — 다른 판이다 */"
    expect: none
