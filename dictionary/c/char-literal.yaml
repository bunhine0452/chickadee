schema: 1
id: c/char-literal
# 0부 축 C (`docs/curriculum/c.md` §0.1 #7 · §3 #11). `universal: null` — `'a'` 가 `int` 인 것은
# C 뿐이다(C++ 은 `char`, Rust 는 4바이트 유니코드 스칼라). 전이시키면 틀린 크기가 옮겨 간다.
universal: null
name: { ko: 글자 하나는 수다, en: Character literal }
token: "'a'"
grammars: [c]
framework: null
essential: true
difficulty: 2
prereq: [cs/text-encoding, cs/bit-and-byte, c/number-literal]
confusions: []

dict:
  one_liner:
    ko: "작은따옴표 안의 글자 하나는 그 글자의 번호다. 타입은 글자가 아니라 정수다."
    en: "One character in single quotes is its code number, typed as a whole number."
  why:
    ko: >-
      {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:은,는}} 글자가 아니라 <b>그 글자의 번호</b>입니다 —
      <code>'a'</code> 는 97, <code>'0'</code> 은 48 이에요. 그래서 {{pick.2|code}}{{pick.2|josa:과,와}}
      셈이 되고, <code>c - '0'</code> 이 글자 하나를 숫자로 바꾸는 관용구가 됩니다. 그리고 C 에서 이
      값의 타입은 <code>char</code> 가 아니라 <b><code>int</code></b> 예요 — <code>sizeof('a')</code> 가
      4 입니다. 같은 코드를 C++ 로 컴파일하면 1 이라, 두 언어에서 다른 값을 내는 몇 안 되는 자리입니다.
      큰따옴표 <code>"a"</code> 는 전혀 다른 것 — 글자 둘(<code>a</code> 와 끝 표시)이 놓인 <b>자리</b>예요.
    en: >-
      {{pick.1|code}} on line {{site.line}} is not a character but <b>that character's code</b> —
      <code>'a'</code> is 97, <code>'0'</code> is 48. That is why it takes part in arithmetic with
      {{pick.2|code}}, and why <code>c - '0'</code> is the idiom that turns a digit character into a
      number. And in C the type of this value is not <code>char</code> but <b><code>int</code></b> —
      <code>sizeof('a')</code> is 4. Compile the same code as C++ and it is 1, one of the few spots where
      the two languages give different values. Double-quoted <code>"a"</code> is something else
      entirely — a <b>place</b> holding two characters (<code>a</code> and the end mark).
  trace:
    - ko: "{{pick.1|code}}{{pick.1|josa:은,는}} 적히는 순간 정수 하나가 된다 — 글자의 번호다."
      en: "{{pick.1|code}} becomes one whole number the moment it is written — the character's code."
    - ko: "{{pick.3|code}}{{pick.3|josa:이,가}} 그 정수를 {{pick.2|code}}{{pick.2|josa:과,와}} 함께 쓴다."
      en: "{{pick.3|code}} uses that whole number together with {{pick.2|code}}."
    - ko: "{{site.line}}행의 결과는 글자가 아니라 수다 — 찍을 때 서식이 글자로 보일 뿐이다."
      en: "The result on line {{site.line}} is a number, not a character — only the print format shows it as one."

rule:
  ko: "<b>글자 하나는 정수다.</b> 셈이 되고, 타입은 글자가 아니라 int 이며, 큰따옴표와는 다른 것이다."
  en: "<b>One character is a whole number.</b> It computes, its type is int, and double quotes are another thing."
result:
  label:
    ko: "{{site.line}}행의 글자 값"
    en: "the character value on line {{site.line}}"
  value: "{{pick.1}}"
  note:
    ko: "글자의 번호, 타입은 int"
    en: "the character's code, typed int"
ok:
  ko: >-
    {{pick.1|code}}{{pick.1|josa:은,는}} 그 글자의 번호로 {{pick.2|code}} 곁에 섰습니다.
  en: >-
    {{pick.1|code}} stood next to {{pick.2|code}} as that character's code.
payoff:
  ko: >-
    이걸 알면 「글자에서 글자를 뺀다」가 마술이 아니게 됩니다 — 번호끼리의 뺄셈이에요.
  en: >-
    This makes “subtracting a character from a character” stop looking like magic — it is code minus
    code.
bridge:
  ko: >-
    파이썬은 글자 하나도 길이 1 인 문자열이라 셈이 안 되고 <code>ord</code> 를 거칩니다. C 는 처음부터
    수라 그 다리가 없어요.
  en: >-
    In Python a single character is a string of length 1, so it does not compute and needs
    <code>ord</code>. In C it is a number from the start, so there is no bridge to cross.
misconceptions:
  # c.md §0.1 #7 · §0.2 — 규격에서 나온 사실이고 빈도 자료는 없다.
  - ko: "작은따옴표 값은 글자 타입이다 — C 에서는 <b>int</b> 입니다. <code>sizeof('a')</code> 가 4 인 것이 증거예요."
    en: "A single-quoted value has a character type — in C it is an <b>int</b>. <code>sizeof('a')</code> being 4 is the proof."
  - ko: "작은따옴표와 큰따옴표는 같다 — 하나는 <b>수</b>, 다른 하나는 글자들이 놓인 <b>자리</b>입니다. 서로 바꾸면 컴파일러가 다른 타입을 봐요."
    en: "Single and double quotes are the same — one is a <b>number</b>, the other a <b>place</b> where characters sit. Swap them and the compiler sees a different type."
  - ko: "<code>'0'</code> 은 0 이다 — 48 입니다. 0 을 얻으려면 <code>'0'</code> 을 빼야 해요."
    en: "<code>'0'</code> is 0 — it is 48. To get 0 you subtract <code>'0'</code>."

point:
  - q:
      ko: "{{site.line}}행에서 <b>글자의 번호로 쓰인 값</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the value used as a character's code</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 글자 값과 <b>함께 쓰이는 쪽</b>입니다. 이름이거나 자리라 그 자체는 따옴표가 없어요."
          en: "{{pick.2|code}} is <b>the side used together with</b> the character value. It is a name or a place and carries no quotes itself."
        edge:
          h:
            ko: "가장 날카로운 자리 — 따옴표가 있는 쪽"
            en: "The sharpest spot — the quoted side"
          code:
            - "c - '0'    /* c 는 이름, '0' 은 값 */"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 글자 값을 <b>두고 하는 일</b>입니다 — 빼거나 넣거나 크기를 재거나. 값 자체는 따옴표 안이에요."
          en: "{{pick.3|code}} is <b>what is done with</b> the character value — subtracting, putting, measuring. The value itself is inside the quotes."
        edge:
          h:
            ko: "가장 날카로운 자리 — 값이냐 일이냐"
            en: "The sharpest spot — the value or the operation"
          code:
            - "sizeof('a')   /* sizeof 는 일, 'a' 는 값 */"

meaning:
  - q:
      ko: "{{site.line}}행의 {{pick.1|code}}{{pick.1|josa:을,를}} 그대로 두고 <code>sizeof</code> 로 재면 몇이 나올까요?"
      en: "Measure {{pick.1|code}} from line {{site.line}} with <code>sizeof</code> — what comes out?"
    hint:
      ko: "C 와 C++ 의 답이 다른 자리입니다."
      en: "This is a spot where C and C++ answer differently."
    options:
      - t:
          ko: "int 의 크기 — 이 기계에서 4"
          en: "The size of an int — 4 on this machine"
      - t:
          ko: "1 — 글자 하나니까"
          en: "1 — it is one character"
        diag:
          t:
            ko: "1 은 <b>C++ 의 답</b>입니다. C 에서 작은따옴표 값의 타입은 int 라 int 의 크기가 나와요."
            en: "1 is <b>the C++ answer</b>. In C a single-quoted value has type int, so the size of an int comes out."
          edge:
            h:
              ko: "가장 날카로운 자리 — 같은 코드, 두 언어"
              en: "The sharpest spot — same code, two languages"
            code:
              - "sizeof('a')   /* C: 4  C++: 1 */"
      - t:
          ko: "2 — 글자와 끝 표시"
          en: "2 — the character and the end mark"
        diag:
          t:
            ko: "끝 표시는 <b>큰따옴표</b>의 것입니다. 작은따옴표 값은 수 하나라 끝 표시가 없어요."
            en: "The end mark belongs to <b>double quotes</b>. A single-quoted value is one number and has no end mark."
          edge:
            h:
              ko: "가장 날카로운 자리 — 따옴표 종류"
              en: "The sharpest spot — which quotes"
            code:
              - "sizeof(\"a\")   /* 2 */"
              - "sizeof('a')   /* 4 */"
      - t:
          ko: "컴파일 오류"
          en: "A compile error"
        diag:
          t:
            ko: "<code>sizeof</code> 는 어떤 값에도 됩니다. 값의 타입 크기를 낼 뿐이에요."
            en: "<code>sizeof</code> works on any value. It just yields the size of the value's type."
          edge:
            h:
              ko: "가장 날카로운 자리 — 어떤 값이든 잰다"
              en: "The sharpest spot — anything can be measured"
            code:
              - "sizeof(1)   /* 4 */"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 <b>글자 하나를 수로</b> 씁니다."
      en: "Choose what goes in the blank. Line {{site.line}} uses <b>one character as a number</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "'a'", mono: true }
      - t: "\"a\""
        mono: true
        diag:
          t:
            ko: "큰따옴표는 <b>글자들이 놓인 자리</b>입니다. 수가 아니라 주소라 셈에 쓰면 엉뚱한 값이 나오고, 컴파일러가 경고해요."
            en: "Double quotes make <b>a place where characters sit</b>. It is an address, not a number, so arithmetic on it gives nonsense and the compiler warns."
          edge:
            h:
              ko: "가장 날카로운 자리 — 수냐 자리냐"
              en: "The sharpest spot — a number or a place"
            code:
              - "c - '0'    /* 수끼리 */"
              - "c - \"0\"    /* 주소를 뺀다 — 경고 */"
      - t: "a"
        mono: true
        diag:
          t:
            ko: "따옴표 없는 <code>a</code> 는 <b>이름</b>입니다. 그런 이름이 없으면 컴파일러가 모르는 이름이라고 멈춰요."
            en: "Unquoted <code>a</code> is a <b>name</b>. If no such name exists the compiler stops on an unknown name."
          edge:
            h:
              ko: "가장 날카로운 자리 — 따옴표 하나 차이"
              en: "The sharpest spot — one pair of quotes"
            code:
              - "'a'   /* 97 */"
              - "a     /* 이름 a 를 찾는다 */"
      - t: "'ab'"
        mono: true
        diag:
          t:
            ko: "작은따옴표 안에 <b>글자 둘</b>은 하나의 값이 아닙니다. 컴파일은 되지만 어떤 수가 되는지는 구현마다 달라요."
            en: "<b>Two characters</b> in single quotes are not one value. It compiles, but which number it becomes differs per implementation."
          edge:
            h:
              ko: "가장 날카로운 자리 — 하나만"
              en: "The sharpest spot — one only"
            code:
              - "'a'    /* 97 */"
              - "'ab'   /* 구현마다 다른 수 */"

why_gate:
  q:
    ko: "C 는 왜 글자 하나를 <b>글자 타입이 아니라 수</b>로 둘까요?"
    en: "Why does C treat one character as <b>a number rather than a character type</b>?"
  choices:
    - t:
        ko: "글자는 기계에서 바이트 하나이고, C 는 그 바이트를 감추지 않아 글자 셈(다음 글자 · 숫자로 바꾸기)이 그냥 정수 셈이 되기 때문"
        en: "Because a character is one byte on the machine, and C does not hide that byte, so character arithmetic (next letter, digit to number) is just whole-number arithmetic"
      ok: true
      fb:
        ko: "그 방향입니다. 그 대가로 잃는 것 — 한 글자가 한 바이트가 아닌 글자들 — 도 한 줄로 적어 보세요."
        en: "That is the direction. Add a line on what is lost — characters that are not one byte."
    - t:
        ko: "옛날에는 글자 타입을 만들 줄 몰라서"
        en: "Because nobody knew how to make a character type back then"
      ok: false
      fb:
        ko: "만들 줄 몰라서가 아니라 감추지 않기로 한 것입니다. 바이트가 보이는 것이 이 언어의 요점이에요."
        en: "Not inability but a choice not to hide it. Seeing the byte is the point of this language."
    - t:
        ko: "수가 글자보다 빨라서"
        en: "Because numbers are faster than characters"
      ok: false
      fb:
        ko: "속도가 아니라 모형의 문제입니다. 글자 타입을 따로 두면 셈마다 변환이 필요해요."
        en: "It is the model, not speed. A separate character type would need a conversion at every computation."

queries:
  - { grammars: [c], file: ./char-literal.scm }

examples:
  - code: "int digit = c - '0';        /* digit -> c 의 번호에서 48 을 뺀 값 (int) */"
    expect: { sites: 1, form: charop, hole: "'0'", picks: { 1: "'0'", 2: "c", 3: "-" } }
  - code: "char c = 'a';               /* c -> 97 (char) */"
    expect: { sites: 1, form: charinit, hole: "'a'", picks: { 1: "'a'", 2: "c" } }
  - code: "s[n] = '\\0';                /* 끝 표시를 넣는다 */"
    expect: { sites: 1, form: charset, hole: "'\\0'", picks: { 1: "'\\0'", 2: "s[n]", 3: "=" } }
  - code: "size_t k = sizeof('a');     /* k -> 4 (C), 1 (C++) */"
    expect: { sites: 1, form: charsize, hole: "'a'", picks: { 1: "'a'", 3: "sizeof" } }
  - code: "const char *s = \"a\";       /* 글자들이 놓인 자리 — 다른 판이다 */"
    expect: none
