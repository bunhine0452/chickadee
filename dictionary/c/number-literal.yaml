schema: 1
id: c/number-literal
# 0부 축 A (`docs/curriculum/c.md` §0.1 #3 · §3 #9). 보편형은 `common/integer-literal` 이다 —
# `common/number-literal` 은 쪼개졌고(D187 ④) 새 참조는 쪼개진 쪽을 건다. 이 판의 요점이
# 「적는 모양이 정수냐 실수냐를 정한다」라 정수 쪽에 건다. 실수 쪽은 `c/float-type` 이 받는다.
universal: common/integer-literal
name: { ko: 적는 모양이 타입을 정한다, en: Number literal }
token: "1u"
grammars: [c]
framework: null
essential: true
difficulty: 1
prereq: [cs/type, c/declaration]
confusions: []

dict:
  one_liner:
    ko: "수를 적는 모양 자체가 타입이다. 점이 있으면 실수, 끝의 글자가 폭과 부호를 정한다."
    en: "How a number is written is its type: a dot means decimal, suffixes set width."
  why:
    ko: >-
      {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:은,는}} 값이기 전에 <b>타입이 정해진 값</b>입니다.
      점이 없으면 정수이고 점이 있으면 실수예요. 끝에 <code>u</code> 가 붙으면 부호가 없고
      <code>L</code> 이 붙으면 넓고, <code>0x</code> 로 시작하면 16진수로 읽힙니다. 이 모양은 왼쪽의
      {{pick.3|code}}{{pick.3|josa:과,와}} 무관하게 먼저 정해지고, 다르면 넣을 때 조용히 바뀌어요. 그래서
      정수 둘을 나눈 값은 정수이고, 실수 이름에 넣어도 이미 잘린 뒤입니다.
    en: >-
      {{pick.1|code}} on line {{site.line}} is <b>a value with a type</b> before it is a value. No dot
      means a whole number; a dot means a decimal. A trailing <code>u</code> removes the sign,
      <code>L</code> widens it, and a leading <code>0x</code> reads it in base sixteen. That shape is
      fixed before and apart from {{pick.3|code}} on the left, and if the two differ the value changes
      quietly as it goes in. So dividing two whole numbers gives a whole number, and putting it into a
      decimal name comes after the cut.
  trace:
    - ko: "{{pick.1|code}}{{pick.1|josa:은,는}} 적힌 모양대로 타입이 먼저 정해진다."
      en: "{{pick.1|code}} gets its type first, from how it is written."
    - ko: "그 값이 {{pick.3|code}} 상자 {{pick.2|code}} 에 들어간다 — 타입이 다르면 여기서 바뀐다."
      en: "That value goes into the {{pick.3|code}} box {{pick.2|code}} — if the types differ, it changes here."
    - ko: "{{site.line}}행 아래에서 {{pick.2|code}}{{pick.2|josa:은,는}} 상자의 타입으로 읽힌다."
      en: "Below line {{site.line}}, {{pick.2|code}} is read as the box's type."

rule:
  ko: "<b>모양이 타입이다.</b> 점·끝글자·앞머리가 정수냐 실수냐, 부호와 폭을 정한다."
  en: "<b>The shape is the type.</b> Dot, suffix and prefix decide whole or decimal, sign and width."
result:
  label:
    ko: "{{site.line}}행의 값"
    en: "the value on line {{site.line}}"
  value: "{{pick.1}}"
  note:
    ko: "모양이 타입을 먼저 정한다"
    en: "the shape fixes the type first"
ok:
  ko: >-
    {{pick.1|code}}{{pick.1|josa:은,는}} 모양이 정한 타입으로 {{pick.2|code}} 에 들어갔습니다.
  en: >-
    {{pick.1|code}} went into {{pick.2|code}} with the type its shape decided.
payoff:
  ko: >-
    이걸 알면 「정수 둘을 나눴더니 소수가 사라졌다」가 풀립니다 — 점이 없는 두 값은 정수라서예요.
  en: >-
    This untangles “I divided two numbers and the fraction vanished” — two values without a dot are
    whole numbers.
bridge:
  ko: >-
    파이썬도 점의 유무로 정수와 실수를 가릅니다. C 는 거기에 끝글자로 부호와 폭까지 적어요 —
    파이썬에는 없는 축입니다.
  en: >-
    Python also splits whole and decimal by the dot. C adds sign and width through trailing letters —
    an axis Python does not have.
misconceptions:
  # c.md §0.1 #3 — 규격에서 나온 사실이고 빈도 자료는 없다.
  - ko: "1 과 1.0 과 1u 는 같은 값이다 — 같은 크기의 <b>다른 타입</b>입니다. 나누기와 넣기에서 다르게 행동해요."
    en: "1, 1.0 and 1u are the same value — they are <b>different types</b> of the same size, and they behave differently in division and in putting."
  - ko: "왼쪽 타입이 값의 타입을 정한다 — 값의 타입은 <b>모양</b>이 먼저 정하고, 왼쪽에 맞추는 것은 그다음입니다."
    en: "The type on the left decides the value's type — the value's type comes from its <b>shape</b> first, and matching the left comes after."
  - ko: "0x 는 다른 값이다 — 같은 수를 16진수로 적은 것뿐입니다. 0x1F 와 31 은 같은 정수예요."
    en: "0x makes a different value — it only writes the same number in base sixteen. 0x1F and 31 are the same whole number."

point:
  - q:
      ko: "{{site.line}}행에서 <b>모양이 타입을 정하는 값</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the value whose shape fixes its type</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 값을 <b>받는 이름</b>입니다. 이름에는 모양이 없어요 — 타입은 왼쪽 낱말과 오른쪽 값이 각각 갖습니다."
          en: "{{pick.2|code}} is <b>the name that receives</b>. A name has no shape — the type belongs to the word on the left and the value on the right."
        edge:
          h:
            ko: "가장 날카로운 자리 — 이름에는 모양이 없다"
            en: "The sharpest spot — a name has no shape"
          code:
            - "int n = 1;     /* 1 은 int */"
            - "int n = 1.0;   /* 1.0 은 double, 넣으며 1 이 된다 */"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>상자의 타입</b>입니다. 값의 타입은 그것과 따로, 값의 모양이 먼저 정해요."
          en: "{{pick.3|code}} is <b>the box's type</b>. The value's type is decided separately and first, by the value's shape."
        edge:
          h:
            ko: "가장 날카로운 자리 — 상자냐 값이냐"
            en: "The sharpest spot — the box or the value"
          code:
            - "double d = 7 / 2;    /* 7/2 는 int 셈이라 3, 넣으며 3.0 */"
            - "double d = 7 / 2.0;  /* 3.5 */"

meaning:
  - q:
      ko: "{{site.line}}행의 {{pick.1|code}} 끝에 <code>u</code> 를 붙이면 무엇이 달라질까요?"
      en: "Append <code>u</code> to {{pick.1|code}} on line {{site.line}} — what changes?"
    hint:
      ko: "끝글자는 값이 아니라 타입을 바꿉니다."
      en: "A suffix changes the type, not the value."
    options:
      - t:
          ko: "값은 같고 타입이 부호 없는 정수가 된다 — 음수와 견줄 때 결과가 뒤집힐 수 있다"
          en: "Same value, but the type becomes an unsigned whole number — comparing with a negative can flip"
      - t:
          ko: "값이 커진다"
          en: "The value grows"
        diag:
          t:
            ko: "값은 <b>그대로</b>입니다. 바뀌는 것은 그 비트를 읽는 방법이고, 그것이 견주기와 넘침에서 드러나요."
            en: "The value stays <b>the same</b>. What changes is how the bits are read, and that shows in comparison and overflow."
          edge:
            h:
              ko: "가장 날카로운 자리 — 값이냐 읽는 법이냐"
              en: "The sharpest spot — the value or the reading"
            code:
              - "1u == 1     /* 참 — 값은 같다 */"
              - "-1 < 1u     /* 거짓 — 읽는 법이 다르다 */"
      - t:
          ko: "컴파일 오류가 난다"
          en: "It is a compile error"
        diag:
          t:
            ko: "<code>u</code>·<code>l</code>·<code>f</code> 는 규격이 정한 <b>끝글자</b>입니다. 모양의 일부라 오류가 아니에요."
            en: "<code>u</code>, <code>l</code> and <code>f</code> are <b>suffixes</b> the standard defines. They are part of the shape, not an error."
          edge:
            h:
              ko: "가장 날카로운 자리 — 끝글자는 문법이다"
              en: "The sharpest spot — suffixes are grammar"
            code:
              - "unsigned u = 1u;"
              - "long big = 1L;"
      - t:
          ko: "실수가 된다"
          en: "It becomes a decimal"
        diag:
          t:
            ko: "실수를 만드는 것은 <b>점</b>이나 <code>e</code> 입니다. <code>u</code> 는 부호를 뗄 뿐 정수로 남아요."
            en: "What makes a decimal is a <b>dot</b> or an <code>e</code>. <code>u</code> only drops the sign and keeps it whole."
          edge:
            h:
              ko: "가장 날카로운 자리 — 점이냐 끝글자냐"
              en: "The sharpest spot — the dot or the suffix"
            code:
              - "1.0   /* double */"
              - "1u    /* unsigned int */"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 정수 이름에 <b>정수 모양의 값</b>을 넣습니다."
      en: "Choose what goes in the blank. Line {{site.line}} puts <b>a value written as a whole number</b> into a whole-number name."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "7", mono: true }
      - t: "7.0"
        mono: true
        diag:
          t:
            ko: "점이 있어 <b>실수</b> 모양입니다. 정수 상자에 넣으면 소수 부분이 잘려 들어가요 — 이 값에서는 안 보이지만 타입이 다릅니다."
            en: "The dot makes it a <b>decimal</b>. Into a whole-number box it goes with its fraction cut — invisible for this value, but the type differs."
          edge:
            h:
              ko: "가장 날카로운 자리 — 점 하나"
              en: "The sharpest spot — one dot"
            code:
              - "int n = 7 / 2;      /* 3 */"
              - "int n = 7.0 / 2;    /* 3.5 를 넣으며 3 */"
      - t: "'7'"
        mono: true
        diag:
          t:
            ko: "따옴표는 <b>글자 하나</b>의 모양입니다. C 에서 글자는 수라 컴파일은 되지만 들어가는 값은 7 이 아니라 그 글자의 번호예요."
            en: "Quotes are the shape of <b>one character</b>. In C a character is a number, so it compiles, but what goes in is the character's code, not 7."
          edge:
            h:
              ko: "가장 날카로운 자리 — 수냐 글자의 번호냐"
              en: "The sharpest spot — the number or the character's code"
            code:
              - "int n = 7;     /* 7 */"
              - "int n = '7';   /* 55 */"
      - t: "\"7\""
        mono: true
        diag:
          t:
            ko: "큰따옴표는 <b>글자 묶음</b>의 모양입니다. 값이 아니라 글자들이 놓인 자리라 정수 상자에는 못 들어가요."
            en: "Double quotes are the shape of <b>a run of characters</b>. It is a place where characters sit, not a value, and does not fit a whole-number box."
          edge:
            h:
              ko: "가장 날카로운 자리 — 값이냐 자리냐"
              en: "The sharpest spot — a value or a place"
            code:
              - "int n = \"7\";   /* 경고 또는 오류 */"
              - "int n = 7;"

why_gate:
  q:
    ko: "C 는 왜 값의 타입을 <b>왼쪽 상자가 아니라 모양</b>으로 정할까요?"
    en: "Why does C take a value's type from <b>its shape, not the box on the left</b>?"
  choices:
    - t:
        ko: "값은 상자 없이도 식 안에서 셈에 쓰이고, 그때 타입이 있어야 나누기·견주기의 규칙을 고를 수 있기 때문"
        en: "Because a value is used in arithmetic inside expressions without any box, and it needs a type there to pick the rule for division and comparison"
      ok: true
      fb:
        ko: "그 방향입니다. 상자가 없는 식의 예를 하나 적어 보세요."
        en: "That is the direction. Write one expression that has no box at all."
    - t:
        ko: "옛날 컴파일러가 그렇게 만들어져서"
        en: "Because old compilers were built that way"
      ok: false
      fb:
        ko: "역사가 아니라 필요입니다. <code>7 / 2</code> 는 상자에 닿기 전에 답을 내야 해요."
        en: "It is need, not history. <code>7 / 2</code> has to yield an answer before it reaches any box."
    - t:
        ko: "왼쪽 타입을 읽는 것이 느려서"
        en: "Because reading the left type is slow"
      ok: false
      fb:
        ko: "속도 문제가 아닙니다. 상자 없이 서는 식에는 읽을 왼쪽이 아예 없어요."
        en: "Speed is not it. An expression standing without a box has no left side to read."

queries:
  - { grammars: [c], file: ./number-literal.scm }

examples:
  - code: "int n = 7;              /* n -> 7 (int) */"
    expect: { sites: 1, form: whole, hole: "7", picks: { 1: "7", 2: "n", 3: "int" } }
  - code: "double d = 1.5;         /* d -> 1.5 (double) */"
    expect: { sites: 1, form: fraction, hole: "1.5", picks: { 1: "1.5", 2: "d", 3: "double" } }
  - code: "unsigned u = 1u;        /* u -> 1 (unsigned int) */"
    expect: { sites: 1, form: suffix, hole: "1u", picks: { 1: "1u", 2: "u", 3: "unsigned" } }
  - code: "int mask = 0x1F;        /* mask -> 31 (int) */"
    expect: { sites: 1, form: hex, hole: "0x1F", picks: { 1: "0x1F", 2: "mask", 3: "int" } }
  - code: "char c = 'a';           /* 글자 하나 — 다른 판이다 */"
    expect: none
  - code: "int n = 7 / 2;          /* 셈 — 다른 판이다 */"
    expect: none
