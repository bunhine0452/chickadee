schema: 1
id: ts/property-access
universal: common/member-access
name: { ko: 점 표기 속성 읽기, en: Property access }
token: "."
grammars: [typescript, tsx, javascript, vue]
framework: null
essential: true
difficulty: 1
prereq: [ts/const-declaration]
confusions: [ts/optional-chaining, ts/array-basics]

dict:
  # 이 한 줄은 0장에서 문제보다 **먼저** 읽힌다 (D138). 정답 기호를 글자로 적지 않는다 —
  # 적으면 「값 안으로 한 칸 들어가는 기호를 짚어라」가 읽기 확인 문제가 된다.
  one_liner:
    ko: "값 하나가 여러 정보를 품고 있을 때, 그 안에서 이름 하나를 골라 그 값을 읽는다."
    en: "Steps into a value that holds several pieces and reads the one you name."
  why:
    ko: >-
      값 하나에 여러 정보를 담아 두면 이름 하나로 들고 다닐 수 있습니다. 점은 그 안에서 한 칸
      들어가는 기호예요. {{pick.1|code}} 안에 {{pick.3|code}} 라는 이름이 없으면 값은
      <code>undefined</code> 이고, {{pick.1|code}} 자체가 없으면 {{site.line}}행은 멈춥니다.
    en: >-
      Hold several pieces of information in one value and you can carry them under one name. The dot
      is the symbol for stepping one level in. If there is no name {{pick.3|code}} inside
      {{pick.1|code}} the value is <code>undefined</code>, and if {{pick.1|code}} itself is absent,
      line {{site.line}} stops.
  trace:
    - ko: "{{pick.1|code}}{{pick.1|josa:을,를}} 먼저 읽는다."
      en: "{{pick.1|code}} is read first."
    - ko: "그 안에서 {{pick.3|code}} 라는 이름을 찾는다."
      en: "The name {{pick.3|code}} is looked for inside it."
    - ko: "찾으면 그 값이, 없으면 <code>undefined</code> 가 {{site.line}}행의 값이 된다."
      en: >-
        If found, that value becomes the value of line {{site.line}}; if not, <code>undefined</code>
        does.

rule:
  ko: "<b>점 왼쪽이 없으면 그 자리에서 멈추고, 오른쪽 이름이 없으면 <code>undefined</code> 다.</b>"
  en: >-
    <b>If the left of the dot is absent it stops right there; if the name on the right is absent it
    is <code>undefined</code>.</b>
result:
  label:
    ko: "{{pick.3}}{{pick.3|josa:이,가}} 없을 때"
    en: "When {{pick.3}} is absent"
  value: "undefined"
  note:
    ko: "왼쪽이 없으면 대신 멈춘다"
    en: "if the left is absent it stops instead"
ok:
  ko: >-
    <code>.</code> 는 {{pick.1|code}} 안으로 <b>한 칸</b> 들어가 {{pick.3|code}} 라는 이름의 값을
    꺼냅니다. 이름이 없으면 <code>undefined</code>, 왼쪽 값 자체가 없으면 TypeError 로 멈춰요.
  en: >-
    <code>.</code> steps <b>one level</b> into {{pick.1|code}} and takes out the value named
    {{pick.3|code}}. No such name gives <code>undefined</code>; no left-hand value at all stops with
    a TypeError.
payoff:
  ko: >-
    {{pick.1|code}} 하나만 들고 다니면 그 안의 {{pick.3|code}} 도 함께 옵니다. 점이 없으면
    값을 낱개로 쪼개서 따로따로 넘겨야 해요.
  en: >-
    Carry {{pick.1|code}} alone and the {{pick.3|code}} inside comes with it. Without the dot you
    would break the value into pieces and pass each one separately.
bridge:
  ko: >-
    {{pick.1|code}}{{pick.1|josa:이,가}} 없을 수도 있는 자리라면 점 대신 <code>?.</code> 를 씁니다 —
    터지는 대신 <code>undefined</code> 로 멈춥니다.
  en: >-
    Where {{pick.1|code}} might be absent, use <code>?.</code> instead of the dot — it stops at
    <code>undefined</code> rather than blowing up.
misconceptions:
  - ko: "점 오른쪽 이름도 계산된다 — 아니요. <code>a.b</code> 의 <code>b</code> 는 글자 그대로의 이름입니다. 계산한 이름으로 찾으려면 <code>a[key]</code> 를 씁니다."
    en: >-
      The name on the right of the dot is evaluated too — no. The <code>b</code> in <code>a.b</code>
      is the name exactly as written. To look up by a computed name, use <code>a[key]</code>.
  - ko: "<code>undefined</code> 가 나오면 그 줄이 멈춘 것이다 — 아니요. 값이 <code>undefined</code> 로 나온 것이고, 멈추는 것은 그 다음 점입니다."
    en: >-
      Getting <code>undefined</code> means the line stopped — no. The value came out as
      <code>undefined</code>; what stops is the next dot.

point:
  - q:
      ko: "{{site.line}}행에서 <b>안으로 한 칸 들어가는 기호</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the symbol that steps one level in</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.2
    diag:
      pick.1:
        t:
          ko: "{{pick.1|code}}{{pick.1|josa:은,는}} <b>들어갈 대상</b>입니다. 대상만으로는 안이 열리지 않고, 여는 일은 바로 뒤의 점이 합니다."
          en: >-
            {{pick.1|code}} is <b>what is being stepped into</b>. The target alone does not open it;
            opening it is the job of the dot right after.
        edge:
          h:
            ko: "가장 날카로운 자리 — 대상과 여는 기호"
            en: "The sharpest spot — the target and the opening symbol"
          code:
            - "user            // 값 전체"
            - "user.name       // 그 안에서 한 칸"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>찾을 이름</b>입니다. 이름은 어디로 들어갈지 정하지 않고, 들어가는 일은 앞의 점이 합니다."
          en: >-
            {{pick.3|code}} is <b>the name to look for</b>. A name does not settle where to step
            into; the stepping is done by the dot before it.
        edge:
          h:
            ko: "가장 날카로운 자리 — 이름은 이름일 뿐"
            en: "The sharpest spot — a name is only a name"
          code:
            - "user.name       // user 안의 name"
            - "name            // 따로 묶어 둔 이름"

meaning:
  - q:
      ko: "{{pick.1|code}} 안에 {{pick.3|code}} 라는 이름이 아예 없다면 {{site.line}}행의 값은 무엇일까요?"
      en: >-
        If there is no name {{pick.3|code}} inside {{pick.1|code}} at all, what is the value of line
        {{site.line}}?
    hint:
      ko: "이름이 없는 것과 대상이 없는 것은 다릅니다."
      en: "A missing name and a missing target are different."
    options:
      - t:
          ko: "<code>undefined</code> — 없는 이름을 읽어도 멈추지는 않는다"
          en: "<code>undefined</code> — reading a name that is not there does not stop it"
      - t:
          ko: "그 자리에서 멈춘다"
          en: "It stops right there"
        diag:
          t:
            ko: "{{pick.1|code}} <b>자체</b>가 <code>undefined</code> 였다면 그 말이 맞습니다. 대상은 있는데 안에 그 이름만 없는 경우에는 조용히 <code>undefined</code> 가 나와요."
            en: >-
              That would hold if {{pick.1|code}} <b>itself</b> were <code>undefined</code>. When the
              target is there and only the name inside is missing, <code>undefined</code> comes out
              quietly.
          edge:
            h:
              ko: "가장 날카로운 자리 — 대상이 없느냐 이름이 없느냐"
              en: "The sharpest spot — no target or no name"
            code:
              - "({}).name          // undefined"
              - "undefined.name     // TypeError"
      - t: "<code>null</code>"
        diag:
          t:
            ko: "<code>null</code> 은 누군가 <b>비워 두겠다고 적어 넣은</b> 값입니다. 찾지 못했을 때 저절로 나오는 값은 <code>undefined</code> 예요."
            en: >-
              <code>null</code> is a value someone <b>wrote in to mean empty</b>. What comes out by
              itself when nothing is found is <code>undefined</code>.
          edge:
            h:
              ko: "가장 날카로운 자리 — 적어 넣은 것과 못 찾은 것"
              en: "The sharpest spot — written in and not found"
            code:
              - "({ a: null }).a    // null"
              - "({ a: null }).b    // undefined"
      - t:
          ko: "빈 문자열 <code>''</code>"
          en: "An empty string <code>''</code>"
        diag:
          t:
            ko: "빈 값을 골라 채워 주는 자리는 없습니다. 기본값을 넣고 싶으면 <code>??</code> 로 직접 적어야 해요."
            en: >-
              Nothing picks an empty value and fills it in for you. If you want a default, you write
              it yourself with <code>??</code>.
          edge:
            h:
              ko: "가장 날카로운 자리 — 채우는 것은 따로 적는다"
              en: "The sharpest spot — filling in is written separately"
            code:
              - "({}).name          // undefined"
              - "({}).name ?? ''    // ''"

# 빈칸형을 못 내는 사유 (D145). 「아직 안 썼다」가 아니라 「이 문법에는 뚫을 구멍이 없다」다.
no_hole_reason: >-
  뚫을 자리가 점 하나뿐인데 한 글자 구멍은 지목형으로 보낸다(t0-blank 의 MIN_HOLE=2). 점을 지우면 남는 것도 다른 뜻의 코드가 아니라 문법 오류다.

why_gate:
  q:
    ko: "{{site.line}}행은 왜 값을 따로 받아 두지 않고 안으로 한 칸 들어가 읽을까요?"
    en: "Why does line {{site.line}} step one level in instead of taking the value out first?"
  choices:
    - t:
        ko: "필요한 것이 그 안의 한 조각뿐이고, 어디서 온 조각인지까지 한 줄에 남기려고"
        en: "Because only one piece inside is needed, and the line also records where that piece came from"
      ok: true
      fb:
        ko: "그 방향입니다. 같은 조각을 아래에서 여러 번 쓴다면 무엇이 달라질지도 적어 보세요."
        en: "That is the direction. Add what would change if the same piece were used several times below."
    - t:
        ko: "그렇게 읽어야 값이 최신이라서"
        en: "Because reading it this way keeps the value current"
      ok: false
      fb:
        ko: "읽는 시점이 다를 뿐 최신을 보장하지는 않습니다. 왼쪽이 바뀌면 다음에 읽을 때 달라집니다."
        en: "It only changes when the read happens; it guarantees nothing. Change the left and the next read differs."
    - t:
        ko: "속성은 밖으로 꺼낼 수 없어서"
        en: "Because a property cannot be taken out"
      ok: false
      fb:
        ko: "꺼내서 이름에 묶을 수 있습니다. 여러 번 쓸 값이면 그편이 낫습니다."
        en: "It can be taken out and bound to a name. For a value used more than once, that is the better call."

queries:
  - { grammars: [typescript, tsx, javascript, vue], file: ./property-access.scm }

examples:
  - code: "const nick = user.profile.nickname"
    expect: { sites: 2, form: member, picks: { 1: "user", 2: ".", 3: "profile" } }
  - code: "console.log(name)"
    expect: { sites: 1, picks: { 1: "console", 3: "log" } }
  - code: "const v = user?.name"
    expect: none
