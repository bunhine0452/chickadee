schema: 1
id: ts/property-access
universal: common/member-access
name: { ko: 점 표기 속성 읽기, en: Property access }
token: "."
grammars: [typescript, tsx, javascript]
framework: null
essential: true
difficulty: 1
prereq: [ts/const-declaration]
confusions: [ts/optional-chaining, ts/array-basics]

dict:
  one_liner: "<code>a.b</code> 는 <code>a</code> 안에서 <code>b</code> 라는 이름의 값을 꺼낸다."
  why: >-
    값 하나에 여러 정보를 담아 두면 이름 하나로 들고 다닐 수 있습니다. 점은 그 안에서 한 칸
    들어가는 기호예요. {{pick.1|code}} 안에 {{pick.3|code}} 라는 이름이 없으면 값은
    <code>undefined</code> 이고, {{pick.1|code}} 자체가 없으면 {{site.line}}행은 멈춥니다.
  trace:
    - "{{pick.1|code}}{{pick.1|josa:을,를}} 먼저 읽는다."
    - "그 안에서 {{pick.3|code}} 라는 이름을 찾는다."
    - "찾으면 그 값이, 없으면 <code>undefined</code> 가 {{site.line}}행의 값이 된다."

rule: "<b>점 왼쪽이 없으면 그 자리에서 멈추고, 오른쪽 이름이 없으면 <code>undefined</code> 다.</b>"
result:
  label: "{{pick.3}}{{pick.3|josa:이,가}} 없을 때"
  value: "undefined"
  note: "왼쪽이 없으면 대신 멈춘다"
ok: >-
  <code>.</code> 는 {{pick.1|code}} 안으로 <b>한 칸</b> 들어가 {{pick.3|code}} 라는 이름의 값을
  꺼냅니다. 이름이 없으면 <code>undefined</code>, 왼쪽 값 자체가 없으면 TypeError 로 멈춰요.
payoff: >-
  {{pick.1|code}} 하나만 들고 다니면 그 안의 {{pick.3|code}} 도 함께 옵니다. 점이 없으면
  값을 낱개로 쪼개서 따로따로 넘겨야 해요.
bridge: >-
  {{pick.1|code}}{{pick.1|josa:이,가}} 없을 수도 있는 자리라면 점 대신 <code>?.</code> 를 씁니다 —
  터지는 대신 <code>undefined</code> 로 멈춥니다.
misconceptions:
  - "점 오른쪽 이름도 계산된다 — 아니요. <code>a.b</code> 의 <code>b</code> 는 글자 그대로의 이름입니다. 계산한 이름으로 찾으려면 <code>a[key]</code> 를 씁니다."
  - "<code>undefined</code> 가 나오면 그 줄이 멈춘 것이다 — 아니요. 값이 <code>undefined</code> 로 나온 것이고, 멈추는 것은 그 다음 점입니다."

point:
  - q: "{{site.line}}행에서 <b>안으로 한 칸 들어가는 기호</b>를 짚어 보세요."
    hint: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
    answer: pick.2
    diag:
      pick.1:
        t: "{{pick.1|code}}{{pick.1|josa:은,는}} <b>들어갈 대상</b>입니다. 대상만으로는 안이 열리지 않고, 여는 일은 바로 뒤의 점이 합니다."
        edge:
          h: "가장 날카로운 자리 — 대상과 여는 기호"
          code:
            - "user            // 값 전체"
            - "user.name       // 그 안에서 한 칸"
      pick.3:
        t: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>찾을 이름</b>입니다. 이름은 어디로 들어갈지 정하지 않고, 들어가는 일은 앞의 점이 합니다."
        edge:
          h: "가장 날카로운 자리 — 이름은 이름일 뿐"
          code:
            - "user.name       // user 안의 name"
            - "name            // 따로 묶어 둔 이름"

meaning:
  - q: "{{pick.1|code}} 안에 {{pick.3|code}} 라는 이름이 아예 없다면 {{site.line}}행의 값은 무엇일까요?"
    hint: "이름이 없는 것과 대상이 없는 것은 다릅니다."
    options:
      - t: "<code>undefined</code> — 없는 이름을 읽어도 멈추지는 않는다"
      - t: "그 자리에서 멈춘다"
        diag:
          t: "{{pick.1|code}} <b>자체</b>가 <code>undefined</code> 였다면 그 말이 맞습니다. 대상은 있는데 안에 그 이름만 없는 경우에는 조용히 <code>undefined</code> 가 나와요."
          edge:
            h: "가장 날카로운 자리 — 대상이 없느냐 이름이 없느냐"
            code:
              - "({}).name          // undefined"
              - "undefined.name     // TypeError"
      - t: "<code>null</code>"
        diag:
          t: "<code>null</code> 은 누군가 <b>비워 두겠다고 적어 넣은</b> 값입니다. 찾지 못했을 때 저절로 나오는 값은 <code>undefined</code> 예요."
          edge:
            h: "가장 날카로운 자리 — 적어 넣은 것과 못 찾은 것"
            code:
              - "({ a: null }).a    // null"
              - "({ a: null }).b    // undefined"
      - t: "빈 문자열 <code>''</code>"
        diag:
          t: "빈 값을 골라 채워 주는 자리는 없습니다. 기본값을 넣고 싶으면 <code>??</code> 로 직접 적어야 해요."
          edge:
            h: "가장 날카로운 자리 — 채우는 것은 따로 적는다"
            code:
              - "({}).name          // undefined"
              - "({}).name ?? ''    // ''"

queries:
  - { grammars: [typescript, tsx, javascript], file: ./property-access.scm }

examples:
  - code: "const nick = user.profile.nickname"
    expect: { sites: 2, form: member, picks: { 1: "user", 2: ".", 3: "profile" } }
  - code: "console.log(name)"
    expect: { sites: 1, picks: { 1: "console", 3: "log" } }
  - code: "const v = user?.name"
    expect: none
