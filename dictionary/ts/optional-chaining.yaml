schema: 1
id: ts/optional-chaining
universal: common/optional-chaining
name: { ko: 옵셔널 체이닝, en: Optional chaining }
token: "?."
grammars: [typescript, tsx, javascript]
framework: null
essential: true
difficulty: 2
prereq: [ts/property-access, ts/undefined-null]
confusions: [ts/nullish-coalescing, ts/logical-and-guard]

dict:
  one_liner: "<code>a?.b</code> 는 <code>a</code> 가 있으면 <code>a.b</code>, 없으면 <code>undefined</code>."
  why: >-
    서버 응답은 늘 완전하지 않습니다. {{pick.1|code}}{{pick.1|josa:이,가}} 빠진 값일 때
    <code>.{{pick.3}}</code>{{pick.3|josa:을,를}} 읽으면 앱이 그 자리에서 멈춥니다(TypeError).
    예전엔 <code>{{pick.1}} && {{pick.1}}.{{pick.3}}</code> 처럼 하나씩 확인했는데,
    <code>?.</code> 가 그 확인을 두 글자에 담았어요.
  trace:
    - "{{pick.1|code}}{{pick.1|josa:을,를}} 읽는다. 없으면 {{site.line}}행은 여기서 끝 — 값은 <code>undefined</code>."
    - "있으면 <code>.{{pick.3}}</code>{{pick.3|josa:을,를}} 읽는다."
    - "{{#ctx.fallback}}결과가 <code>undefined</code> 나 <code>null</code> 이면 <code>??</code> 가 {{ctx.fallback|code}}{{ctx.fallback|josa:을,를}} 고른다.{{/ctx.fallback}}{{^ctx.fallback}}그 값이 {{site.line}}행의 결과다.{{/ctx.fallback}}"

rule: "<b><code>.</code> 은 없으면 터지고, <code>?.</code> 은 없으면 멈춘다.</b> 멈춘 자리의 값은 <code>undefined</code>."
result:
  label: "{{pick.1}}{{pick.1|josa:이,가}} 없을 때"
  value: "{{#ctx.fallback}}{{ctx.fallback}}{{/ctx.fallback}}{{^ctx.fallback}}undefined{{/ctx.fallback}}"
  note: "{{#ctx.fallback}}?. 가 멈추고 ?? 가 채움{{/ctx.fallback}}{{^ctx.fallback}}?. 가 멈춤{{/ctx.fallback}}"
ok: >-
  <code>?.</code> 는 <b>앞의 값이 없으면(<code>undefined</code>·<code>null</code>) 거기서 멈추고
  <code>undefined</code> 를 냅니다.</b> {{pick.1|code}}{{pick.1|josa:이,가}} 없어도
  <code>.{{pick.3}}</code>{{pick.3|josa:을,를}} 읽으려다 터지지 않아요.
payoff: >-
  {{pick.1|code}}{{pick.1|josa:이,가}} <code>undefined</code> 면 <code>.{{pick.3}}</code>{{pick.3|josa:을,를}}
  읽는 순간 터집니다. <code>?.</code> 는 바로 그 순간에 <b>「없으면 멈춤」</b>을 끼워 넣는 기호예요.
bridge: >-
  여기서 한 번 더 — {{pick.1|code}}{{pick.1|josa:이,가}} <code>undefined</code> 일 때
  <code>{{pick.1}}.{{pick.3}}</code> 쪽은 터지고, <code>{{pick.1}}?.{{pick.3}}</code> 쪽은
  <code>undefined</code> 로 멈춥니다.
misconceptions:
  - "<code>?.</code> 가 기본값을 넣어 준다 — 아니요, 멈추기만 합니다. 채우는 건 <code>??</code>."
  - "<code>?.</code> 뒤의 모든 것이 안전해진다 — 앞 한 칸만 지킵니다. 다음 칸도 없을 수 있으면 <code>?.</code> 를 또 씁니다."

point:
  - q: "{{site.line}}행에서 {{pick.1|code}}{{pick.1|josa:이,가}} 없을 때 <b>터지지 않고 그 자리에서 멈추게 해 주는 기호</b>를 짚어 보세요."
    hint: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
    answer: pick.2
    diag:
      pick.1:
        t: "{{pick.1|code}}{{pick.1|josa:은,는}} 값을 <b>꺼내는</b> 자리입니다. 없을 수 있는 건 이 값이고, 그걸 지키는 기호는 바로 뒤의 <code>?.</code> 입니다."
        edge:
          h: "가장 날카로운 자리 — ?. 가 지키는 건 앞이다"
          code:
            - "{{pick.1}}?.{{pick.3}}   // 없으면 undefined, 터지지 않음"
            - "{{pick.1}}.{{pick.3}}    // 없으면 TypeError"
      pick.3:
        t: "<code>{{pick.3}}</code>{{pick.3|josa:은,는}} 읽으려는 <b>이름</b>입니다. 멈추는 일은 그 앞의 <code>?.</code> 가 합니다."
        edge:
          h: "가장 날카로운 자리 — 이름은 지키지 않는다"
          code:
            - "{{pick.1}}?.{{pick.3}}     // ?. 가 앞을 확인"
            - "{{pick.1}}.{{pick.3}}?.x   // 여기 ?. 는 {{pick.3}} 을 확인"

meaning:
  - q: "{{pick.1|code}}{{pick.1|josa:이,가}} <code>undefined</code> 라면 {{site.line}}행의 값은 무엇일까요?"
    hint: "<code>?.</code> 는 멈추는 기호, <code>??</code> 는 채우는 기호."
    options:
      - t: "{{#ctx.fallback}}{{ctx.fallback|code}} — <code>?.</code> 가 <code>undefined</code> 로 멈추고 <code>??</code> 가 채운다{{/ctx.fallback}}{{^ctx.fallback}}<code>undefined</code> — <code>?.</code> 가 거기서 멈춘다{{/ctx.fallback}}"
      - t: "TypeError 로 멈춘다"
        diag:
          t: "<code>{{pick.1}}.{{pick.3}}</code> 처럼 <b>점(<code>.</code>)이었다면</b> 그 말이 맞습니다. <code>?.</code> 는 그 순간에 터지는 대신 <code>undefined</code> 를 냅니다."
          edge:
            h: "가장 날카로운 자리 — 점 하나 차이"
            code:
              - "{{pick.1}}.{{pick.3}}    // TypeError"
              - "{{pick.1}}?.{{pick.3}}   // undefined"
      - t: "<code>null</code>"
        diag:
          t: "<code>?.</code> 가 멈추며 내는 값은 앞이 <code>null</code> 이었어도 <b>항상 <code>undefined</code></b> 입니다."
          edge:
            h: "가장 날카로운 자리 — 멈춘 값은 하나"
            code:
              - "null?.x        // undefined"
              - "undefined?.x   // undefined"
      - t: "빈 문자열 <code>''</code>"
        diag:
          t: "<code>''</code> 은 <b>값이 있는 것</b>입니다. <code>?.</code> 는 <code>undefined</code>·<code>null</code> 에서만 멈춰요."
          edge:
            h: "가장 날카로운 자리 — 비어 보여도 값"
            code:
              - "''?.length     // 0  (멈추지 않음)"
              - "('' ?? 'x')    // ''"

queries:
  - { grammars: [typescript, tsx], file: ./optional-chaining.scm }
  - { grammars: [javascript], file: ./optional-chaining.js.scm }

examples:
  - code: "const nick = res.user?.profile?.nickname ?? '손님'"
    expect: { sites: 2, form: member, picks: { 1: "res.user", 2: "?.", 3: "profile" }, ctx: { fallback: "'손님'" } }
  - code: "const total = cart?.items.length ?? 0"
    expect: { sites: 1, picks: { 1: "cart" } }
  - code: "const a = obj.deep.value"
    expect: none
