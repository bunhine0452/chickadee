schema: 1
id: ts/undefined-null
universal: common/absent-value
name: { ko: undefined 와 null, en: undefined and null }
token: "undefined"
grammars: [typescript, tsx, javascript]
framework: null
essential: true
difficulty: 1
prereq: []
confusions: [ts/optional-chaining]

dict:
  one_liner: "<code>undefined</code> 는 아직 안 넣은 것, <code>null</code> 은 비우기로 한 것."
  why: >-
    「값이 없다」에는 두 가지가 있습니다. 아무도 넣지 않아서 없는 것과, 누군가 「여기는 비운다」고
    적어 넣은 것이에요. 앞의 것이 <code>undefined</code>, 뒤의 것이 <code>null</code> 입니다.
    {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:이,가}} 어느 쪽인지가 다음 줄의 분기를 정합니다.
  trace:
    - "{{site.line}}행은 {{pick.1|code}} 라는 「없음」을 값으로 둔다."
    - "이 값에 점을 찍어 무엇을 읽으려 하면 그 자리에서 멈춘다."
    - "<code>??</code> 나 <code>?.</code> 는 이 두 값에서만 반응한다."

rule: "<b><code>undefined</code> 와 <code>null</code> 은 <code>==</code> 로는 같고 <code>===</code> 로는 다르다.</b>"
result:
  label: "{{site.line}}행의 값"
  value: "{{pick.1}}"
  note: "값이 없다는 표시"
ok: >-
  {{pick.1|code}}{{pick.1|josa:은,는}} 「값이 없다」를 나타내는 값입니다. 없는 것도 값이라서 이름에 묶을 수는
  있지만, 여기에 점을 찍어 안을 읽으려 하면 그 자리에서 멈춥니다.
payoff: >-
  둘을 나눠 두면 「아직 안 받았다」와 「받았는데 비어 있다」를 코드에서 구분할 수 있습니다.
  로딩 중과 결과 없음을 가르는 자리가 대개 여기예요.
bridge: >-
  이 두 값에서만 <code>?.</code> 가 멈추고 <code>??</code> 가 채웁니다 — <code>0</code> 이나
  빈 문자열은 「있는 값」이라 반응하지 않아요.
misconceptions:
  - "<code>null</code> 이면 <code>undefined</code> 도 마찬가지다 — <code>==</code> 로 비교할 때만 같습니다. <code>===</code> 로는 서로 다른 값이에요."
  - "<code>0</code> 이나 빈 문자열도 「없음」이다 — 아니요. 있는 값입니다. <code>if</code> 안에서 거짓처럼 보일 뿐이에요."

meaning:
  - q: "{{site.line}}행 뒤에 <code>{{pick.1}} === null</code> 을 물으면 무엇이 나올까요?"
    hint: "<code>==</code> 와 <code>===</code> 는 이 두 값에서 답이 갈립니다."
    options:
      - t: "{{pick.1|code}}{{pick.1|josa:이,가}} <code>null</code> 일 때만 참 — <code>===</code> 는 종류까지 본다"
      - t: "<code>undefined</code> 여도 참이다"
        diag:
          t: "<code>==</code> 로 물었다면 그 말이 맞습니다. 등호 두 개는 이 두 값을 한 묶음으로 보고, 세 개는 서로 다른 값으로 봐요."
          edge:
            h: "가장 날카로운 자리 — 등호 두 개와 세 개"
            code:
              - "undefined == null    // true"
              - "undefined === null   // false"
      - t: "<code>0</code> 이어도 참이다"
        diag:
          t: "<code>0</code> 은 있는 값입니다. <code>if</code> 안에서 거짓처럼 굴 뿐이고, 「없음」과 견주면 다른 값이에요."
          edge:
            h: "가장 날카로운 자리 — 거짓 같음과 없음"
            code:
              - "0 == null      // false"
              - "if (0) {}      // 들어가지 않는다"
      - t: "언제나 참이다"
        diag:
          t: "값이 들어 있으면 거짓입니다. 항상 참이 되게 하려면 <code>==</code> 로 두 「없음」을 한꺼번에 물어야 해요."
          edge:
            h: "가장 날카로운 자리 — 값이 있을 때"
            code:
              - "const a = 1; a === null   // false"
              - "const b = null; b === null // true"

queries:
  - { grammars: [typescript, tsx, javascript], file: ./undefined-null.scm }

examples:
  - code: "const user = null"
    expect: { sites: 1, form: "null", picks: { 1: "null" } }
  - code: "let cursor = undefined"
    expect: { sites: 1, form: undefined, picks: { 1: "undefined" } }
  - code: "const empty = ''"
    expect: none
