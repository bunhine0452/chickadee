schema: 1
id: ts/generics
universal: common/generics
name: { ko: "제네릭", en: "Generics" }
token: "<T>"
grammars: [typescript, tsx]
framework: null
essential: true
difficulty: 4
prereq: [ts/call-expression, ts/array-basics, cs/static-vs-dynamic-typing]
confusions: [ts/array-map-immutable]

dict:
  one_liner:
    ko: "<code>&lt;T&gt;</code> 는 타입을 나중에 정하는 자리. 쓸 때 채우고 그대로 흐른다."
    en: "<code>&lt;T&gt;</code> is a type slot settled later. Fill it at the call and it flows on."
  why:
    ko: >-
      「무엇이든 담는 상자」를 만들면 꺼낼 때 무엇이 나오는지 알 수 없습니다. 타입 자리를 비워 두고
      <b>쓰는 쪽에서 채우게</b> 하면, 담은 것과 꺼낸 것이 같다는 사실이 그대로 남아요.
      {{site.line}}행은 {{pick.2|code}}{{pick.2|josa:으로,로}} 그 자리를 채우는 줄입니다.
    en: >-
      Build “a box that holds anything” and you cannot tell what comes out of it. Leave the type
      slot open and let <b>the caller fill it</b>, and the fact that what went in and what came out
      are the same survives. Line {{site.line}} is the line that fills that slot with
      {{pick.2|code}}.
  trace:
    - ko: "{{pick.1|code}}{{pick.1|josa:은,는}} 타입 자리를 비워 둔 채 쓰였다."
      en: "{{pick.1|code}} was written with its type slot left open."
    - ko: "{{site.line}}행에서 그 자리에 {{pick.2|code}}{{pick.2|josa:이,가}} 들어간다."
      en: "On line {{site.line}}, {{pick.2|code}} goes into that slot."
    - ko: "그 뒤로 나오는 값의 타입은 <b>비어 있지 않고</b> {{pick.2|code}}{{pick.2|josa:으로,로}} 굳는다."
      en: "From there on the type of what comes out is <b>not open</b>; it is fixed as {{pick.2|code}}."

rule:
  ko: "<b>타입 자리를 비우고 쓰는 쪽이 채운다.</b> 채우는 순간 그 뒤의 타입은 전부 따라 정해진다."
  en: >-
    <b>Leave the type slot open and the caller fills it.</b> The moment it is filled, every type
    after it is settled.
result:
  label:
    ko: "채워진 타입"
    en: "The filled type"
  value: "{{pick.2}}"
  note:
    ko: "이 자리에서만 정해진다"
    en: "it is settled only here"
ok:
  ko: >-
    제네릭은 <b>타입을 미루는 표기</b>입니다. 값 하나를 담고 꺼낼 때 「무엇이든」이 아니라 「넣은 그것」이
    나오도록 잇는 자리예요.
  en: >-
    Generics are <b>a notation for deferring the type</b>. They are what joins putting a value in to
    taking out “the thing you put in” rather than “anything”.
payoff:
  ko: "같은 함수를 타입마다 복사하지 않아도, 꺼낸 값의 타입이 흐릿해지지 않습니다."
  en: >-
    You avoid copying the same function once per type, and the type of what comes out does not go
    blurry.
bridge:
  ko: "타입 자리를 채우지 않고 두면 편집기가 대개 <b>넘긴 값을 보고 스스로</b> 채웁니다."
  en: >-
    Leave the type slot unfilled and the editor will usually fill it <b>by looking at the value you
    passed</b>.
misconceptions:
  - ko: "제네릭이 실행 중에도 타입을 검사한다 — 검사하지 않습니다. 컴파일 뒤에는 사라집니다."
    en: "Generics check the type while it runs — they do not. After compiling they are gone."
  - ko: "<code>any</code> 와 같다 — 반대입니다. <code>any</code> 는 잇는 것을 끊고 제네릭은 이어 줍니다."
    en: >-
      It is the same as <code>any</code> — it is the opposite. <code>any</code> cuts the join;
      generics keep it.

point:
  - q:
      ko: "{{site.line}}행에서 <b>비어 있던 타입 자리를 채우는 것</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>what fills the type slot that was left open</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.2
    diag:
      pick.1:
        t:
          ko: "{{pick.1|code}}{{pick.1|josa:은,는}} <b>타입 자리를 비워 둔 쪽</b>입니다. 그 자리에 무엇이 들어갈지는 이 줄에서 정해져요."
          en: >-
            {{pick.1|code}} is <b>the side that left the type slot open</b>. What goes into that
            slot is settled on this line.
        edge:
          h:
            ko: "가장 날카로운 자리 — 비워 둔 쪽과 채우는 쪽"
            en: "The sharpest spot — the side that leaves it open and the side that fills it"
          code:
            - "function wrap<T>(v: T) { ... }   // 비워 둔 쪽"
            - "wrap<User>(raw)                  // 채우는 쪽"

meaning:
  - q:
      ko: "{{site.line}}행의 타입 자리가 하는 일은 무엇일까요?"
      en: "What does the type slot on line {{site.line}} do?"
    hint:
      ko: "실행 중에는 남지 않습니다."
      en: "It does not survive into the run."
    options:
      - t:
          ko: "그 뒤에 나오는 값의 타입을 정해 준다"
          en: "It settles the type of what comes out after it"
      - t:
          ko: "실행 중에 값의 종류를 검사한다"
          en: "It checks the kind of the value while running"
        diag:
          t:
            ko: "타입은 <b>컴파일 뒤에 사라집니다</b>. 실행 중에 확인하려면 <code>typeof</code> 나 별도 검사 코드가 따로 있어야 해요."
            en: >-
              Types <b>disappear after compiling</b>. To check while running you need
              <code>typeof</code> or separate checking code.
          edge:
            h:
              ko: "가장 날카로운 자리 — 언제 남아 있나"
              en: "The sharpest spot — when it is still there"
            code:
              - "wrap<User>(raw)   // 남는 건 wrap(raw) 뿐"
              - "typeof raw        // 이건 실행 중에 확인한다"
      - t:
          ko: "값을 그 타입으로 바꿔 준다"
          en: "It converts the value to that type"
        diag:
          t:
            ko: "값은 그대로입니다. 바뀌는 것은 <b>편집기와 컴파일러가 그 값을 무엇으로 보는가</b>뿐이에요."
            en: >-
              The value is unchanged. What changes is only <b>what the editor and the compiler take
              that value to be</b>.
          edge:
            h:
              ko: "가장 날카로운 자리 — 값과 보는 눈"
              en: "The sharpest spot — the value and the eye on it"
            code:
              - "wrap<number>('1')   // 문자열은 여전히 문자열"
              - "Number('1')         // 이건 실제로 바꾼다"
      - t:
          ko: "무엇이든 받는다는 뜻이다"
          en: "It means it takes anything"
        diag:
          t:
            ko: "무엇이든 받되 <b>받은 그것이 무엇이었는지 기억합니다</b>. 기억을 버리는 쪽이 <code>any</code> 예요."
            en: >-
              It takes anything and <b>remembers what it took</b>. The one that throws that memory
              away is <code>any</code>.
          edge:
            h:
              ko: "가장 날카로운 자리 — 기억하나 버리나"
              en: "The sharpest spot — remembers or discards"
            code:
              - "function id<T>(v: T): T   // 넣은 타입이 그대로 나온다"
              - "function id(v: any): any  // 나오는 건 흐릿하다"

# 빈칸형을 못 내는 사유 (D145). 「아직 안 썼다」가 아니라 「이 문법에는 뚫을 구멍이 없다」다.
no_hole_reason: >-
  뚫을 자리는 꺾쇠 안의 타입 이름인데 그 이름은 리포마다 다르다. 꺾쇠만 뚫으면 한 글자짜리 보기가 되고, 타입 이름을 뚫으면 「어느 타입이 맞나」가 문법이 아니라 그 코드의 도메인 문제가 된다.

why_gate:
  q:
    ko: "{{site.line}}행은 왜 타입을 여기서 직접 적어 줬을까요?"
    en: "Why does line {{site.line}} spell the type out here?"
  choices:
    - t:
        ko: "돌려받는 값의 타입이 인자만 보고는 정해지지 않는 자리라"
        en: "Because the type of what comes back cannot be settled from the arguments alone"
      ok: true
      fb:
        ko: "그 방향입니다. 이 타입을 안 적었다면 다음 줄부터 무엇을 못 쓰게 되는지도 적어 보세요."
        en: "That is the direction. Add what the lines below could no longer use if the type were left out."
    - t:
        ko: "타입을 적으면 실행이 빨라져서"
        en: "Because writing the type speeds up the run"
      ok: false
      fb:
        ko: "타입은 실행에 남지 않습니다. 남는 것은 다음 줄부터 무엇을 쓸 수 있는지입니다."
        en: "Types are gone at run time. What stays is what the lines below are allowed to use."
    - t:
        ko: "제네릭 함수는 타입을 반드시 적어야 해서"
        en: "Because a generic function always needs the type spelled out"
      ok: false
      fb:
        ko: "인자에서 알아낼 수 있으면 안 적습니다. 적었다는 것은 알아낼 수 없었다는 뜻입니다."
        en: "When the arguments give it away you leave it out. Spelling it out means they did not."

queries:
  - { grammars: [typescript, tsx], file: ./generics.scm }

examples:
  - code: "const box = wrap<User>(raw)"
    expect: { sites: 1, form: call-type-args, picks: { 1: "wrap", 2: "User", 3: "(raw)" } }
  - code: "const seen = new Set<string>()"
    expect: { sites: 1, form: new-type-args, picks: { 2: "string", 3: "()" } }
  - code: "const n = total + 1"
    expect: none
