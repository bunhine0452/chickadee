schema: 1
id: ts/generics
universal: common/generics
name: { ko: "제네릭", en: "Generics" }
token: "<T>"
grammars: [typescript, tsx]
framework: null
essential: true
difficulty: 4
prereq: [ts/call-expression, ts/array-basics]
confusions: [ts/array-map-immutable]

dict:
  one_liner: "<code>&lt;T&gt;</code> 는 타입을 나중에 정하는 자리. 쓸 때 채우고 그대로 흐른다."
  why: >-
    「무엇이든 담는 상자」를 만들면 꺼낼 때 무엇이 나오는지 알 수 없습니다. 타입 자리를 비워 두고
    <b>쓰는 쪽에서 채우게</b> 하면, 담은 것과 꺼낸 것이 같다는 사실이 그대로 남아요.
    {{site.line}}행은 {{pick.2|code}}{{pick.2|josa:으로,로}} 그 자리를 채우는 줄입니다.
  trace:
    - "{{pick.1|code}}{{pick.1|josa:은,는}} 타입 자리를 비워 둔 채 쓰였다."
    - "{{site.line}}행에서 그 자리에 {{pick.2|code}}{{pick.2|josa:이,가}} 들어간다."
    - "그 뒤로 나오는 값의 타입은 <b>비어 있지 않고</b> {{pick.2|code}}{{pick.2|josa:으로,로}} 굳는다."

rule: "<b>타입 자리를 비우고 쓰는 쪽이 채운다.</b> 채우는 순간 그 뒤의 타입은 전부 따라 정해진다."
result:
  label: "채워진 타입"
  value: "{{pick.2}}"
  note: "이 자리에서만 정해진다"
ok: >-
  제네릭은 <b>타입을 미루는 표기</b>입니다. 값 하나를 담고 꺼낼 때 「무엇이든」이 아니라 「넣은 그것」이
  나오도록 잇는 자리예요.
payoff: "같은 함수를 타입마다 복사하지 않아도, 꺼낸 값의 타입이 흐릿해지지 않습니다."
bridge: "타입 자리를 채우지 않고 두면 편집기가 대개 <b>넘긴 값을 보고 스스로</b> 채웁니다."
misconceptions:
  - "제네릭이 실행 중에도 타입을 검사한다 — 검사하지 않습니다. 컴파일 뒤에는 사라집니다."
  - "<code>any</code> 와 같다 — 반대입니다. <code>any</code> 는 잇는 것을 끊고 제네릭은 이어 줍니다."

point:
  - q: "{{site.line}}행에서 <b>비어 있던 타입 자리를 채우는 것</b>을 짚어 보세요."
    hint: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
    answer: pick.2
    diag:
      pick.1:
        t: "{{pick.1|code}}{{pick.1|josa:은,는}} <b>타입 자리를 비워 둔 쪽</b>입니다. 그 자리에 무엇이 들어갈지는 이 줄에서 정해져요."
        edge:
          h: "가장 날카로운 자리 — 비워 둔 쪽과 채우는 쪽"
          code:
            - "function wrap<T>(v: T) { ... }   // 비워 둔 쪽"
            - "wrap<User>(raw)                  // 채우는 쪽"

meaning:
  - q: "{{site.line}}행의 타입 자리가 하는 일은 무엇일까요?"
    hint: "실행 중에는 남지 않습니다."
    options:
      - t: "그 뒤에 나오는 값의 타입을 정해 준다"
      - t: "실행 중에 값의 종류를 검사한다"
        diag:
          t: "타입은 <b>컴파일 뒤에 사라집니다</b>. 실행 중에 확인하려면 <code>typeof</code> 나 별도 검사 코드가 따로 있어야 해요."
          edge:
            h: "가장 날카로운 자리 — 언제 남아 있나"
            code:
              - "wrap<User>(raw)   // 남는 건 wrap(raw) 뿐"
              - "typeof raw        // 이건 실행 중에 확인한다"
      - t: "값을 그 타입으로 바꿔 준다"
        diag:
          t: "값은 그대로입니다. 바뀌는 것은 <b>편집기와 컴파일러가 그 값을 무엇으로 보는가</b>뿐이에요."
          edge:
            h: "가장 날카로운 자리 — 값과 보는 눈"
            code:
              - "wrap<number>('1')   // 문자열은 여전히 문자열"
              - "Number('1')         // 이건 실제로 바꾼다"
      - t: "무엇이든 받는다는 뜻이다"
        diag:
          t: "무엇이든 받되 <b>받은 그것이 무엇이었는지 기억합니다</b>. 기억을 버리는 쪽이 <code>any</code> 예요."
          edge:
            h: "가장 날카로운 자리 — 기억하나 버리나"
            code:
              - "function id<T>(v: T): T   // 넣은 타입이 그대로 나온다"
              - "function id(v: any): any  // 나오는 건 흐릿하다"

queries:
  - { grammars: [typescript, tsx], file: ./generics.scm }

examples:
  - code: "const box = wrap<User>(raw)"
    expect: { sites: 1, form: call-type-args, picks: { 1: "wrap", 2: "User" } }
  - code: "const seen = new Set<string>()"
    expect: { sites: 1, form: new-type-args, picks: { 2: "string" } }
  - code: "const n = total + 1"
    expect: none
