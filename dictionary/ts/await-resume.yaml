schema: 1
id: ts/await-resume
universal: null
name: { ko: "await 다음 줄은 언제 도나", en: When await resumes }
token: "await"
grammars: [typescript, tsx, javascript, vue]
framework: null
essential: false
difficulty: 4
prereq: [ts/async-await, ts/callback-argument, cs/blocking-and-async]
confusions: [ts/async-await, ts/promise-then]

dict:
  one_liner:
    ko: "그 함수만 접히고 나머지는 계속 돈다. 접힌 쪽은 <b>앞줄</b>에 서서 먼저 이어진다."
    en: "Only that function folds; the rest runs on, and it resumes in the fast lane."
  why:
    ko: >-
      {{site.line}}행에서 {{pick.1|code}}{{pick.1|josa:을,를}} 만나면 이 함수는 거기서 <b>접히고</b>
      제어가 부른 쪽으로 돌아갑니다. 나중에 이어질 때 줄이 둘인데, 접힌 쪽이 서는 줄이 <b>먼저</b>
      비워져요 — 그래서 타이머보다 앞섭니다.
    en: >-
      Meeting {{pick.1|code}} on line {{site.line}}, this function <b>folds</b> there and control
      returns to the caller. There are two queues for resuming, and the one the folded part joins is
      emptied <b>first</b> — so it comes ahead of a timer.
  trace:
    - ko: "{{site.line}}행에서 함수가 접히고 {{pick.2|code}} 의 결과를 기다린다."
      en: "On line {{site.line}} the function folds and waits on the result of {{pick.2|code}}."
    - ko: "그동안 바깥 줄들이 끝까지 돈다."
      en: "Meanwhile the outer lines run to the end."
    - ko: "바깥이 비면 앞줄부터 비운다 — 접힌 쪽이 거기 서 있다."
      en: "When the outside empties, the fast lane goes first — the folded part is standing there."

rule:
  ko: >-
    <b>앞줄이 다 빌 때까지 뒷줄은 하나도 안 꺼낸다.</b> 0밀리초 타이머라도 접힌 쪽 뒤에 온다.
  en: >-
    <b>Nothing is taken from the slow lane until the fast one is empty.</b> Even a zero-millisecond
    timer comes after the folded part.
result:
  label:
    ko: "{{site.line}}행 다음 줄이 도는 시점"
    en: "When the line after {{site.line}} runs"
  value: "{{pick.1}} → 앞줄"
  note:
    ko: "타이머보다 먼저"
    en: "ahead of a timer"
ok:
  ko: >-
    {{pick.1|code}}{{pick.1|josa:은,는}} 프로그램 전체를 안 멈춥니다. 멈추는 것처럼 보이는 것은 이
    함수 <b>안에서만</b>이에요.
  en: >-
    {{pick.1|code}} does not halt the whole program. What looks like halting happens <b>inside this
    function only</b>.
payoff:
  ko: >-
    「왜 로그가 이 순서로 찍히지」의 답이 이 하나입니다. 순서를 예측할 수 있으면 경쟁 상태를
    의심할 자리도 좁혀져요.
  en: >-
    This alone answers "why did the logs come out in that order". Predicting the order also narrows
    where to suspect a race.
bridge:
  ko: >-
    같은 순서가 <code>.then</code> 표기에서도 그대로 성립합니다 — 표기가 다를 뿐 서는 줄이 같아요.
  en: >-
    The same ordering holds for the <code>.then</code> notation — a different notation, the same lane.
misconceptions:
  - ko: "기다리는 동안 프로그램 전체가 멈춘다 — 그 함수만 접힙니다."
    en: "The whole program halts while waiting — only that function folds."
  - ko: "0밀리초 타이머가 먼저 돈다 — 접힌 쪽이 앞줄이라 먼저입니다."
    en: "A zero-millisecond timer goes first — the folded part is in the fast lane."

point:
  - q:
      ko: "{{site.line}}행에서 <b>함수를 접는 낱말</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the word that folds the function</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: >-
            {{pick.2|code}}{{pick.2|josa:은,는}} 기다려지는 <b>대상</b>입니다. 접는 낱말은 그 앞에
            있어요.
          en: >-
            {{pick.2|code}} is <b>what is waited on</b>. The folding word comes before it.
        edge:
          h:
            ko: "가장 날카로운 자리 — 접는 낱말과 기다리는 대상"
            en: "The sharpest spot — the folding word or what is awaited"
          code:
            - "await fetch(url)"
            - "//^접는다  ^기다리는 대상"
      pick.3:
        t:
          ko: >-
            {{pick.3|code}}{{pick.3|josa:은,는}} <b>뒷줄</b>에 서는 쪽입니다. 접는 낱말이 세우는
            줄은 그보다 앞이에요.
          en: >-
            {{pick.3|code}} joins the <b>slow lane</b>. The folding word's lane comes ahead of it.
        edge:
          h:
            ko: "가장 날카로운 자리 — 앞줄과 뒷줄"
            en: "The sharpest spot — the fast lane or the slow one"
          code:
            - "await p          // 앞줄"
            - "setTimeout(f, 0) // 뒷줄"

meaning:
  - q:
      ko: >-
        <code>setTimeout(() => log('t'), 0); await p; log('a')</code> 에서 무엇이 먼저 찍힐까요?
      en: >-
        In <code>setTimeout(() => log('t'), 0); await p; log('a')</code>, which prints first?
    hint:
      ko: "줄이 둘이고 비우는 순서가 정해져 있습니다."
      en: "There are two lanes and the emptying order is fixed."
    options:
      - t:
          ko: "<code>'a'</code> — 접힌 쪽이 앞줄이다"
          en: "<code>'a'</code> — the folded part is in the fast lane"
      - t:
          ko: "<code>'t'</code> — 먼저 등록했으니까"
          en: "<code>'t'</code> — it was registered first"
        diag:
          t:
            ko: >-
              등록 순서가 아니라 <b>어느 줄에 섰는가</b>가 정합니다. 두 줄 중 앞줄이 먼저 비워져요.
            en: >-
              Registration order does not decide; <b>which lane</b> does. The fast lane empties first.
          edge:
            h:
              ko: "가장 날카로운 자리 — 등록 순서와 줄"
              en: "The sharpest spot — registration order or lane"
            code:
              - "setTimeout(f, 0); await p"
              - "// await 쪽이 먼저 이어진다"
      - t:
          ko: "0밀리초라 동시에 돈다"
          en: "Zero milliseconds means they run together"
        diag:
          t:
            ko: >-
              돌아가는 줄기는 하나뿐이라 동시는 없습니다. 0은 「최소 0밀리초 뒤」라는 뜻이에요.
            en: >-
              There is one running strand, so nothing is simultaneous. Zero means "after at least
              zero milliseconds".
          edge:
            h:
              ko: "가장 날카로운 자리 — 줄기가 몇 개인가"
              en: "The sharpest spot — how many strands"
            code:
              - "// 줄기는 하나, 대기줄이 둘"
      - t:
          ko: "정해져 있지 않다"
          en: "It is not decided"
        diag:
          t:
            ko: >-
              이 자리는 정해져 있습니다 — 앞줄을 다 비운 뒤에야 뒷줄에서 하나를 꺼내요.
            en: >-
              This one is decided — only after the fast lane is empty is one taken from the slow lane.
          edge:
            h:
              ko: "가장 날카로운 자리 — 정해진 순서와 안 정해진 것"
              en: "The sharpest spot — fixed order or not"
            code:
              - "// 두 줄 사이의 순서는 정해져 있다"
              - "// 같은 줄 안의 타이머끼리는 시간이 정한다"

no_hole_reason: >-
  순서는 한 줄에 안 적혀 있다 — 두 줄이 어떻게 비워지는지가 답이라 지울 글자가 없다.
  그래서 자리와 뜻으로 묻는다.

queries:
  - { grammars: [typescript, tsx, javascript, vue], file: ./await-resume.scm }

examples:
  - code: "const res = await fetch(url)"
    expect: { sites: 1, form: micro, picks: { 1: "await fetch(url)", 2: "fetch(url)" } }
  - code: "setTimeout(() => log('t'), 0)"
    expect: { sites: 1, form: task, picks: { 1: "setTimeout", 3: "() => log('t')" } }
  - code: "const res = fetch(url)"
    expect: none
