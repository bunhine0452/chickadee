schema: 1
id: ts/nullish-coalescing
universal: common/nullish-default
name: { ko: 널 병합, en: Nullish coalescing }
token: "??"
grammars: [typescript, tsx, javascript]
framework: null
essential: true
difficulty: 2
prereq: [ts/undefined-null, ts/const-declaration]
confusions: [ts/logical-or-default, ts/logical-and-guard, ts/conditional-ternary]

dict:
  one_liner: "<code>a ?? b</code> 는 <code>a</code> 가 없을 때만 <code>b</code>."
  why: >-
    없을 때 쓸 값을 그 자리에서 정하는 기호입니다. <code>??</code> 가 「없음」으로 보는 것은
    <code>undefined</code> 와 <code>null</code> 둘뿐이라, {{pick.1|code}}{{pick.1|josa:이,가}}
    <code>0</code> 이거나 빈 문자열이어도 그 값이 그대로 남습니다. 예전에 쓰던 <code>||</code> 는
    그 둘까지 「없음」으로 쳐서, 수량 <code>0</code> 이 조용히
    {{pick.3|code}}{{pick.3|josa:으로,로}} 바뀌는 자리를 만들었어요.
  trace:
    - "{{pick.1|code}}{{pick.1|josa:을,를}} 먼저 읽는다."
    - "그 값이 <code>undefined</code> 나 <code>null</code> 이면 {{pick.3|code}}{{pick.3|josa:을,를}} 대신 쓴다."
    - "그 밖의 값이면 {{site.line}}행의 결과는 {{pick.1|code}} 그대로다."

rule: "<b><code>??</code> 는 <code>undefined</code>·<code>null</code> 에서만 오른쪽으로 넘어간다.</b> <code>0</code>·<code>''</code>·<code>false</code> 는 왼쪽 그대로."
result:
  label: "{{pick.1|code}}{{pick.1|josa:이,가}} <code>0</code> 일 때"
  value: "0"
  note: "<code>??</code> 는 넘어가지 않는다"
ok: >-
  <code>??</code> 는 왼쪽이 <code>undefined</code> 나 <code>null</code> <b>일 때만</b> 오른쪽을
  씁니다. {{pick.1|code}}{{pick.1|josa:이,가}} <code>0</code> 이나 빈 문자열이면 그 값이 그대로
  {{site.line}}행의 결과가 돼요.
payoff: >-
  기본값을 <code>||</code> 로 주면 <code>0</code> 과 빈 문자열이 함께 지워집니다.
  <code>??</code> 는 지우는 대상을 <b>「없음」 둘</b>로 좁혀서 그 자리를 없앤 기호예요.
bridge: >-
  <code>undefined</code> 와 <code>null</code> 만이 「없음」입니다. <code>0</code>·<code>''</code>·<code>false</code>
  는 <b>값이 있는 것</b>이라 <code>??</code> 가 건너뛰지 않아요.
misconceptions:
  - "<code>??</code> 가 falsy 를 다 걸러 준다 — 아니요. <code>0</code> 과 빈 문자열은 통과합니다."
  - "<code>??</code> 와 <code>||</code> 는 같다 — <code>0</code> 이 들어오는 순간 결과가 갈립니다."

point:
  - q: "{{site.line}}행에서 {{pick.1|code}}{{pick.1|josa:이,가}} <b>없을 때만</b> 오른쪽으로 넘어가게 하는 기호를 짚어 보세요."
    hint: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
    answer: pick.2
    diag:
      pick.1:
        t: "{{pick.1|code}}{{pick.1|josa:은,는}} <b>확인받는</b> 값입니다. 없는지 보고 넘어갈지 정하는 일은 바로 뒤의 <code>??</code> 가 해요."
        edge:
          h: "가장 날카로운 자리 — 확인받는 쪽과 확인하는 쪽"
          code:
            - "{{pick.1}} ?? {{pick.3}}   // 없으면 오른쪽"
            - "{{pick.1}}                 // 확인 없이 그대로"
      pick.3:
        t: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>대신 쓸 값</b>입니다. 언제 그 값으로 넘어갈지를 정하는 건 그 앞의 <code>??</code> 예요."
        edge:
          h: "가장 날카로운 자리 — 값이 아니라 조건"
          code:
            - "{{pick.1}} ?? {{pick.3}}   // undefined·null 에서만"
            - "{{pick.1}} || {{pick.3}}   // 0·'' 에서도"

meaning:
  - q: "{{site.line}}행에서 오른쪽 {{pick.3|code}}{{pick.3|josa:이,가}} 쓰이는 때는 언제일까요?"
    hint: "<code>??</code> 가 「없음」으로 보는 것이 무엇인지부터."
    options:
      - t: "{{pick.1|code}}{{pick.1|josa:이,가}} <code>undefined</code> 나 <code>null</code> 일 때"
      - t: "<code>0</code>·<code>''</code>·<code>false</code> 일 때도"
        diag:
          t: "<code>||</code> 였다면 그 말이 맞습니다 — <code>||</code> 는 falsy 를 전부 「없음」으로 봐요. <code>??</code> 가 넘어가는 것은 <code>undefined</code> 와 <code>null</code> 둘뿐입니다."
          edge:
            h: "가장 날카로운 자리 — 수량 0"
            code:
              - "0 ?? 10   // 0"
              - "0 || 10   // 10"
      - t: "<code>null</code> 일 때만 — <code>undefined</code> 는 그대로"
        diag:
          t: "「없음」 둘을 함께 봅니다. 없는 속성을 읽으면 <code>undefined</code> 가 나오는데, 그것까지 받지 못하면 기본값이 필요한 자리에서 대부분 쓸 수 없어요."
          edge:
            h: "가장 날카로운 자리 — 둘 다 없음"
            code:
              - "undefined ?? 'x'   // 'x'"
              - "null ?? 'x'        // 'x'"
      - t: "{{pick.1|code}}{{pick.1|josa:이,가}} 빈 배열 <code>[]</code> 일 때도"
        diag:
          t: "빈 배열은 <b>값이 있는 것</b>입니다. 길이가 <code>0</code> 인 것과 값이 없는 것은 다르고, <code>??</code> 는 값이 없는 쪽만 봅니다."
          edge:
            h: "가장 날카로운 자리 — 비어 보여도 값"
            code:
              - "[] ?? [1]   // []"
              - "[].length   // 0"

blank:
  - q: "빈칸에 들어갈 것을 고르세요. 이 줄은 {{pick.1|code}}{{pick.1|josa:이,가}} <b>없을 때만</b> {{pick.3|code}}{{pick.3|josa:을,를}} 씁니다."
    hint: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
    options:
      - { t: "??", mono: true }
      - t: "||"
        mono: true
        diag:
          t: "<code>||</code> 도 왼쪽이 없으면 오른쪽으로 갑니다. 다만 <code>0</code>·<code>''</code>·<code>false</code> 까지 「없음」으로 쳐요. 수량이나 검색어처럼 <code>0</code> 과 빈 문자열이 <b>정상 값</b>인 자리에서 갈립니다."
          edge:
            h: "가장 날카로운 자리 — 수량 0"
            code:
              - "0 ?? 10   // 0"
              - "0 || 10   // 10"
      - t: "&&"
        mono: true
        diag:
          t: "<code>&&</code> 는 왼쪽이 <b>있을 때</b> 오른쪽으로 갑니다 — 방향이 반대예요. 없을 때 채우려는 자리에 쓰면, 없을 때 오른쪽을 건너뜁니다."
          edge:
            h: "가장 날카로운 자리 — 방향이 반대"
            code:
              - "null ?? 'x'   // 'x'"
              - "null && 'x'   // null"
      - t: "? :"
        mono: true
        diag:
          t: "삼항으로도 같은 일을 쓸 수 있지만 「없음」의 경계를 손으로 적어야 합니다. 짧게 줄인 <code>a ? a : b</code> 는 <code>0</code> 과 빈 문자열까지 함께 지워요."
          edge:
            h: "가장 날카로운 자리 — 같은 뜻을 길게"
            code:
              - "a ?? b"
              - "a === undefined || a === null ? b : a"

queries:
  - { grammars: [typescript, tsx, javascript], file: ./nullish-coalescing.scm }

examples:
  - code: "const nick = name ?? '손님'"
    expect: { sites: 1, form: binary, hole: "??", picks: { 1: "name", 2: "??", 3: "'손님'" } }
  - code: "const count = total ?? 0"
    expect: { sites: 1, picks: { 1: "total", 3: "0" } }
  - code: "const nick = name || '손님'"
    expect: none
