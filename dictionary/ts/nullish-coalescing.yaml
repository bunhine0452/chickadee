schema: 1
id: ts/nullish-coalescing
universal: common/nullish-default
name: { ko: 널 병합, en: Nullish coalescing }
token: "??"
grammars: [typescript, tsx, javascript, vue]
framework: null
essential: true
difficulty: 2
prereq: [ts/undefined-null, ts/const-declaration]
confusions: [ts/logical-or-default, ts/logical-and-guard, ts/optional-chaining, ts/conditional-ternary]

dict:
  # 0장에서 문제보다 **먼저** 읽히는 줄이다 (D138) — 정답 기호를 글자로 적지 않는다.
  one_liner:
    ko: "왼쪽 값이 없을 때 쓸 값을 정한다. 「없음」은 <code>undefined</code> 와 <code>null</code> 둘뿐이다."
    en: "Fills in a value when the left one is missing — only <code>undefined</code> and <code>null</code>."
  why:
    ko: >-
      없을 때 쓸 값을 그 자리에서 정하는 기호입니다. <code>??</code> 가 「없음」으로 보는 것은
      <code>undefined</code> 와 <code>null</code> 둘뿐이라, {{pick.1|code}}{{pick.1|josa:이,가}}
      <code>0</code> 이거나 빈 문자열이어도 그 값이 그대로 남습니다. 예전에 쓰던 <code>||</code> 는
      그 둘까지 「없음」으로 쳐서, 수량 <code>0</code> 이 조용히
      {{pick.3|code}}{{pick.3|josa:으로,로}} 바뀌는 자리를 만들었어요.
    en: >-
      This is the symbol that settles, right there, what to use when a value is missing. What
      <code>??</code> counts as missing is only <code>undefined</code> and <code>null</code>, so if
      {{pick.1|code}} is <code>0</code> or an empty string that value survives. The older
      <code>||</code> counted those two as missing as well, which made spots where a quantity of
      <code>0</code> quietly turned into {{pick.3|code}}.
  trace:
    - ko: "{{pick.1|code}}{{pick.1|josa:을,를}} 먼저 읽는다."
      en: "{{pick.1|code}} is read first."
    - ko: "그 값이 <code>undefined</code> 나 <code>null</code> 이면 {{pick.3|code}}{{pick.3|josa:을,를}} 대신 쓴다."
      en: >-
        If that value is <code>undefined</code> or <code>null</code>, {{pick.3|code}} is used
        instead.
    - ko: "그 밖의 값이면 {{site.line}}행의 결과는 {{pick.1|code}} 그대로다."
      en: "For any other value the result of line {{site.line}} is {{pick.1|code}} as it is."

rule:
  ko: "<b><code>??</code> 는 <code>undefined</code>·<code>null</code> 에서만 오른쪽으로 넘어간다.</b> <code>0</code>·<code>''</code>·<code>false</code> 는 왼쪽 그대로."
  en: >-
    <b><code>??</code> moves right only for <code>undefined</code> and <code>null</code>.</b>
    <code>0</code>, <code>''</code> and <code>false</code> stay on the left.
result:
  label:
    ko: "{{pick.1|code}}{{pick.1|josa:이,가}} <code>0</code> 일 때"
    en: "When {{pick.1|code}} is <code>0</code>"
  value: "0"
  note:
    ko: "<code>??</code> 는 넘어가지 않는다"
    en: "<code>??</code> does not move on"
ok:
  ko: >-
    <code>??</code> 는 왼쪽이 <code>undefined</code> 나 <code>null</code> <b>일 때만</b> 오른쪽을
    씁니다. {{pick.1|code}}{{pick.1|josa:이,가}} <code>0</code> 이나 빈 문자열이면 그 값이 그대로
    {{site.line}}행의 결과가 돼요.
  en: >-
    <code>??</code> uses the right <b>only when</b> the left is <code>undefined</code> or
    <code>null</code>. If {{pick.1|code}} is <code>0</code> or an empty string, that value becomes
    the result of line {{site.line}} as it is.
payoff:
  ko: >-
    기본값을 <code>||</code> 로 주면 <code>0</code> 과 빈 문자열이 함께 지워집니다.
    <code>??</code> 는 지우는 대상을 <b>「없음」 둘</b>로 좁혀서 그 자리를 없앤 기호예요.
  en: >-
    Give a default with <code>||</code> and <code>0</code> and the empty string are wiped out along
    with it. <code>??</code> narrows what gets wiped to <b>the two kinds of missing</b>, which
    closes that gap.
bridge:
  ko: >-
    <code>undefined</code> 와 <code>null</code> 만이 「없음」입니다. <code>0</code>·<code>''</code>·<code>false</code>
    는 <b>값이 있는 것</b>이라 <code>??</code> 가 건너뛰지 않아요.
  en: >-
    Only <code>undefined</code> and <code>null</code> are “missing”. <code>0</code>, <code>''</code>
    and <code>false</code> are <b>values that are present</b>, so <code>??</code> does not step over
    them.
misconceptions:
  - ko: "<code>??</code> 가 falsy 를 다 걸러 준다 — 아니요. <code>0</code> 과 빈 문자열은 통과합니다."
    en: >-
      <code>??</code> filters out every falsy value — no. <code>0</code> and the empty string pass
      through.
  - ko: "<code>??</code> 와 <code>||</code> 는 같다 — <code>0</code> 이 들어오는 순간 결과가 갈립니다."
    en: >-
      <code>??</code> and <code>||</code> are the same — the moment a <code>0</code> arrives, the
      results part ways.

point:
  - q:
      ko: "{{site.line}}행에서 {{pick.1|code}}{{pick.1|josa:이,가}} <b>없을 때만</b> 오른쪽으로 넘어가게 하는 기호를 짚어 보세요."
      en: >-
        On line {{site.line}}, point at the symbol that moves right <b>only when</b> {{pick.1|code}}
        is missing.
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.2
    diag:
      pick.1:
        t:
          ko: "{{pick.1|code}}{{pick.1|josa:은,는}} <b>확인받는</b> 값입니다. 없는지 보고 넘어갈지 정하는 일은 바로 뒤의 <code>??</code> 가 해요."
          en: >-
            {{pick.1|code}} is the value <b>being checked</b>. Seeing whether it is missing and
            deciding to move on is the job of the <code>??</code> right after it.
        edge:
          h:
            ko: "가장 날카로운 자리 — 확인받는 쪽과 확인하는 쪽"
            en: "The sharpest spot — the checked side and the checking side"
          code:
            - "{{pick.1}} ?? {{pick.3}}   // 없으면 오른쪽"
            - "{{pick.1}}                 // 확인 없이 그대로"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>대신 쓸 값</b>입니다. 언제 그 값으로 넘어갈지를 정하는 건 그 앞의 <code>??</code> 예요."
          en: >-
            {{pick.3|code}} is <b>the value to use instead</b>. What settles when it is moved to is
            the <code>??</code> before it.
        edge:
          h:
            ko: "가장 날카로운 자리 — 값이 아니라 조건"
            en: "The sharpest spot — the condition, not the value"
          code:
            - "{{pick.1}} ?? {{pick.3}}   // undefined·null 에서만"
            - "{{pick.1}} || {{pick.3}}   // 0·'' 에서도"

meaning:
  - q:
      ko: "{{site.line}}행에서 오른쪽 {{pick.3|code}}{{pick.3|josa:이,가}} 쓰이는 때는 언제일까요?"
      en: "When is the {{pick.3|code}} on the right of line {{site.line}} used?"
    hint:
      ko: "<code>??</code> 가 「없음」으로 보는 것이 무엇인지부터."
      en: "Start from what <code>??</code> counts as missing."
    options:
      - t:
          ko: "{{pick.1|code}}{{pick.1|josa:이,가}} <code>undefined</code> 나 <code>null</code> 일 때"
          en: "When {{pick.1|code}} is <code>undefined</code> or <code>null</code>"
      - t:
          ko: "<code>0</code>·<code>''</code>·<code>false</code> 일 때도"
          en: "For <code>0</code>, <code>''</code> and <code>false</code> as well"
        diag:
          t:
            ko: "<code>||</code> 였다면 그 말이 맞습니다 — <code>||</code> 는 falsy 를 전부 「없음」으로 봐요. <code>??</code> 가 넘어가는 것은 <code>undefined</code> 와 <code>null</code> 둘뿐입니다."
            en: >-
              That would hold for <code>||</code> — <code>||</code> counts every falsy value as
              missing. What <code>??</code> moves on for is only <code>undefined</code> and
              <code>null</code>.
          edge:
            h:
              ko: "가장 날카로운 자리 — 수량 0"
              en: "The sharpest spot — a quantity of 0"
            code:
              - "0 ?? 10   // 0"
              - "0 || 10   // 10"
      - t:
          ko: "<code>null</code> 일 때만 — <code>undefined</code> 는 그대로"
          en: "Only when it is <code>null</code> — <code>undefined</code> stays"
        diag:
          t:
            ko: "「없음」 둘을 함께 봅니다. 없는 속성을 읽으면 <code>undefined</code> 가 나오는데, 그것까지 받지 못하면 기본값이 필요한 자리에서 대부분 쓸 수 없어요."
            en: >-
              It takes both kinds of missing together. Reading a property that is not there gives
              <code>undefined</code>, and if that were not caught too, the notation would be
              unusable in most places a default is needed.
          edge:
            h:
              ko: "가장 날카로운 자리 — 둘 다 없음"
              en: "The sharpest spot — both are missing"
            code:
              - "undefined ?? 'x'   // 'x'"
              - "null ?? 'x'        // 'x'"
      - t:
          ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 빈 배열 <code>[]</code> 일 때도"
          en: "When {{pick.1|code}} is an empty array <code>[]</code> as well"
        diag:
          t:
            ko: "빈 배열은 <b>값이 있는 것</b>입니다. 길이가 <code>0</code> 인 것과 값이 없는 것은 다르고, <code>??</code> 는 값이 없는 쪽만 봅니다."
            en: >-
              An empty array is <b>a value that is present</b>. Having length <code>0</code> is not
              the same as having no value, and <code>??</code> looks only at the no-value side.
          edge:
            h:
              ko: "가장 날카로운 자리 — 비어 보여도 값"
              en: "The sharpest spot — empty-looking but present"
            code:
              - "[] ?? [1]   // []"
              - "[].length   // 0"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. 이 줄은 {{pick.1|code}}{{pick.1|josa:이,가}} <b>없을 때만</b> {{pick.3|code}}{{pick.3|josa:을,를}} 씁니다."
      en: >-
        Choose what goes in the blank. This line uses {{pick.3|code}} <b>only when</b>
        {{pick.1|code}} is missing.
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "??", mono: true }
      - t: "||"
        mono: true
        diag:
          t:
            ko: "<code>||</code> 도 왼쪽이 없으면 오른쪽으로 갑니다. 다만 <code>0</code>·<code>''</code>·<code>false</code> 까지 「없음」으로 쳐요. 수량이나 검색어처럼 <code>0</code> 과 빈 문자열이 <b>정상 값</b>인 자리에서 갈립니다."
            en: >-
              <code>||</code> also goes right when the left is missing. It just counts
              <code>0</code>, <code>''</code> and <code>false</code> as missing too. It parts ways
              where <code>0</code> and the empty string are <b>real values</b>, like a quantity or a
              search term.
          edge:
            h:
              ko: "가장 날카로운 자리 — 수량 0"
              en: "The sharpest spot — a quantity of 0"
            code:
              - "0 ?? 10   // 0"
              - "0 || 10   // 10"
      - t: "&&"
        mono: true
        diag:
          t:
            ko: "<code>&&</code> 는 왼쪽이 <b>있을 때</b> 오른쪽으로 갑니다 — 방향이 반대예요. 없을 때 채우려는 자리에 쓰면, 없을 때 오른쪽을 건너뜁니다."
            en: >-
              <code>&&</code> goes right when the left <b>is</b> there — the direction is reversed.
              Used where you meant to fill in a missing value, it skips the right exactly when the
              value is missing.
          edge:
            h:
              ko: "가장 날카로운 자리 — 방향이 반대"
              en: "The sharpest spot — the direction is reversed"
            code:
              - "null ?? 'x'   // 'x'"
              - "null && 'x'   // null"
      # 삼항(`? :`)은 보기로 못 쓴다 — 토큰 둘짜리라 보기 넷의 종류가 갈리고
      # (`t0-blank.ts` 의 `sameKind`), 그러면 정답이 눈에 보인다. 그 자리에 같은 물음표로
      # 시작하는 `?.` 를 둔다: 초보가 `??` 와 가장 자주 바꿔 쓰는 것이 그것이다.
      - t: "?."
        mono: true
        diag:
          t:
            ko: "<code>?.</code> 는 왼쪽이 없으면 오른쪽을 <b>건너뛰고</b> 줄 전체를 <code>undefined</code> 로 끝냅니다. 없을 때 쓸 값을 <b>대신 넣는</b> 일은 하지 않아요 — 둘은 방향이 반대입니다."
            en: >-
              <code>?.</code> <b>skips</b> the right when the left is missing and ends the whole
              line as <code>undefined</code>. It never <b>puts a value in</b> for the missing one —
              the two run in opposite directions.
          edge:
            h:
              ko: "가장 날카로운 자리 — 건너뛰기와 채우기"
              en: "The sharpest spot — skipping and filling in"
            code:
              - "name ?? '손님'   // 없으면 '손님'"
              - "name?.length     // 없으면 undefined"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 기본값으로 넘어가는 기준을 「없음」 둘로 좁혔을까요?"
    en: "Why does line {{site.line}} narrow the trigger for the default to the two kinds of missing?"
  choices:
    - t:
        ko: "<code>0</code> 이나 빈 문자열이 정상 값인 자리라, 없을 때만 기본값으로 가야 해서"
        en: "Because <code>0</code> and the empty string are real values here, so only a missing one may fall through"
      ok: true
      fb:
        ko: "그 방향입니다. 이 자리에서 <code>0</code> 이 실제로 무엇을 뜻하는지도 적어 보세요."
        en: "That is the direction. Add what a <code>0</code> would actually mean in this spot."
    - t:
        ko: "이 기호가 더 새 문법이라"
        en: "Because this is the newer notation"
      ok: false
      fb:
        ko: "새것이라서 고르지는 않습니다. 고르는 이유는 <code>0</code> 과 빈 문자열을 지우지 않는다는 것 하나입니다."
        en: "Newness does not pick it. What picks it is one thing: it does not wipe out <code>0</code> and the empty string."
    - t:
        ko: "왼쪽이 늘 없어서"
        en: "Because the left is always missing"
      ok: false
      fb:
        ko: "늘 없다면 기본값을 그냥 쓰면 됩니다. 이 기호는 있을 때와 없을 때가 섞이는 자리에 씁니다."
        en: "If it were always missing you would just use the default. This notation is for where both happen."

queries:
  - { grammars: [typescript, tsx, javascript, vue], file: ./nullish-coalescing.scm }

examples:
  - code: "const nick = name ?? '손님'"
    expect: { sites: 1, form: binary, hole: "??", picks: { 1: "name", 2: "??", 3: "'손님'" } }
  - code: "const count = total ?? 0"
    expect: { sites: 1, picks: { 1: "total", 3: "0" } }
  - code: "const nick = name || '손님'"
    expect: none
