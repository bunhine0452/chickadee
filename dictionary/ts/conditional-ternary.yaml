schema: 1
id: ts/conditional-ternary
universal: common/conditional-expression
name: { ko: 삼항 조건식, en: Conditional (ternary) expression }
token: "? :"
grammars: [typescript, tsx, javascript]
framework: null
essential: true
difficulty: 3
prereq: [ts/const-declaration, ts/undefined-null]
confusions: [ts/logical-or-default, ts/nullish-coalescing]

dict:
  one_liner:
    ko: "<code>조건 ? 이것 : 저것</code> — 고른 쪽 하나가 그 자리의 값이 된다."
    en: "<code>condition ? this : that</code> — the chosen side becomes the value there."
  why:
    ko: >-
      <code>if</code> 는 흐름을 나누지만 값을 남기지 않습니다. 값이 필요한 자리 — 변수에 담을 때,
      인자로 넘길 때, 화면에 그릴 때 — 에는 <b>식</b>이 있어야 하고 그게 이 표기예요.
      {{site.line}}행은 {{pick.1|code}}{{pick.1|josa:을,를}} 한 번 보고
      {{pick.2|code}}{{pick.2|josa:과,와}} {{pick.3|code}} 중 하나만 값으로 남깁니다.
    en: >-
      <code>if</code> splits the flow but leaves no value behind. Where a value is needed — putting
      it in a variable, passing it as an argument, drawing it on screen — you need <b>an
      expression</b>, and this is that notation. Line {{site.line}} looks at {{pick.1|code}} once
      and leaves only one of {{pick.2|code}} and {{pick.3|code}} as the value.
  trace:
    - ko: "{{pick.1|code}}{{pick.1|josa:을,를}} 참·거짓으로 판단한다."
      en: "{{pick.1|code}} is judged true or false."
    - ko: "참이면 {{pick.2|code}}{{pick.2|josa:을,를}} 계산한다 — 이때 {{pick.3|code}} 쪽은 계산조차 하지 않는다."
      en: >-
        If true, {{pick.2|code}} is evaluated — and the {{pick.3|code}} side is not evaluated at
        all.
    - ko: "거짓이면 반대로 {{pick.3|code}}{{pick.3|josa:을,를}} 계산한다. 그 값이 {{site.line}}행의 결과다."
      en: >-
        If false, the other way round: {{pick.3|code}} is evaluated. That value is the result of
        line {{site.line}}.

rule:
  ko: "<b>조건 하나에 값 둘, 남는 것은 하나.</b> 고르지 않은 쪽은 계산하지 않는다."
  en: "<b>One condition, two values, one survivor.</b> The side not chosen is not evaluated."
result:
  label:
    ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 참일 때"
    en: "When {{pick.1|code}} is true"
  value: "{{pick.2}}"
  note:
    ko: "거짓이면 {{pick.3}}"
    en: "if false, {{pick.3}}"
ok:
  ko: >-
    <code>?</code> 앞이 조건, <code>:</code> 를 사이에 둔 둘이 후보입니다. 조건이 참이면
    {{pick.2|code}}{{pick.2|josa:이,가}}, 거짓이면 {{pick.3|code}}{{pick.3|josa:이,가}}
    {{site.line}}행의 값이 됩니다.
  en: >-
    Before the <code>?</code> is the condition; the two around the <code>:</code> are the
    candidates. If the condition is true {{pick.2|code}} becomes the value of line {{site.line}},
    and if it is false {{pick.3|code}} does.
payoff:
  ko: >-
    같은 일을 <code>if</code> 로 쓰면 변수를 먼저 비워 두고 두 가지에서 채워야 합니다.
    식으로 쓰면 <b>이름이 생기는 순간 값이 정해져</b> 중간 상태가 없어져요.
  en: >-
    Write the same thing with <code>if</code> and you have to leave the variable empty first and
    fill it from two places. As an expression, <b>the value is settled the moment the name
    appears</b>, so there is no in-between state.
bridge:
  ko: >-
    <code>?</code> 와 <code>:</code> 는 한 짝입니다. <code>:</code> 뒤가 빠지면 값이 하나만 남아
    이 표기가 성립하지 않아요.
  en: >-
    <code>?</code> and <code>:</code> are one pair. Drop what follows the <code>:</code> and only
    one value is left, and the notation does not hold.
misconceptions:
  - ko: "양쪽 다 계산된 뒤에 하나가 버려진다 — 고른 쪽만 계산합니다."
    en: "Both sides are evaluated and then one is thrown away — only the chosen side is evaluated."
  - ko: "<code>if</code> 로 언제나 바꿔 쓸 수 있다 — 값이 필요한 자리에서는 식이라야 담깁니다."
    en: "<code>if</code> can always stand in for it — where a value is needed, only an expression fits."

point:
  - q:
      ko: "{{site.line}}행에서 <b>조건이 거짓일 때</b> 남는 값을 짚어 보세요."
      en: "On line {{site.line}}, point at the value that survives <b>when the condition is false</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.3
    diag:
      pick.1:
        t:
          ko: "{{pick.1|code}}{{pick.1|josa:은,는}} <b>판단하는 쪽</b>입니다. 이 값 자체가 결과로 남지는 않고, 어느 쪽을 남길지만 정해요."
          en: >-
            {{pick.1|code}} is <b>the side that judges</b>. This value does not survive as the
            result; it only settles which side does.
        edge:
          h:
            ko: "가장 날카로운 자리 — 판단과 결과"
            en: "The sharpest spot — the judgement and the result"
          code:
            - "done ? 'A' : 'B'   // 남는 것은 'A' 나 'B'"
            - "done               // 남는 것은 done 자신"
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <code>?</code> 바로 뒤, 즉 <b>참일 때</b> 남는 쪽입니다. 거짓일 때 남는 것은 <code>:</code> 뒤예요."
          en: >-
            {{pick.2|code}} sits right after the <code>?</code>, so it is the side that survives
            <b>when true</b>. What survives when false is after the <code>:</code>.
        edge:
          h:
            ko: "가장 날카로운 자리 — 순서가 곧 조건"
            en: "The sharpest spot — the order is the condition"
          code:
            - "조건 ? 참일_때 : 거짓일_때"
            - "!조건 ? 거짓일_때 : 참일_때   // 뒤집으면 자리도 바뀐다"

meaning:
  - q:
      ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 참이면 {{pick.3|code}} 쪽은 어떻게 될까요?"
      en: "If {{pick.1|code}} is true, what happens to the {{pick.3|code}} side?"
    hint:
      ko: "고른 쪽만 계산한다."
      en: "Only the chosen side is evaluated."
    options:
      - t:
          ko: "계산되지 않는다 — 값이 필요 없으니 건드리지 않는다"
          en: "It is not evaluated — its value is not needed, so it is left alone"
      - t:
          ko: "먼저 계산해 두고 버린다"
          en: "It is evaluated first and then discarded"
        diag:
          t:
            ko: "함수의 인자였다면 그 말이 맞습니다 — 인자는 부르기 전에 모두 계산돼요. 이 표기는 고른 쪽만 계산해서, 무거운 계산이나 화면에 그리는 일을 거기 둬도 값이 필요할 때만 돕니다."
            en: >-
              That would hold for function arguments — arguments are all evaluated before the call.
              This notation evaluates only the chosen side, so you can put heavy work or drawing
              there and it runs only when the value is needed.
          edge:
            h:
              ko: "가장 날카로운 자리 — 인자와 다른 점"
              en: "The sharpest spot — how it differs from arguments"
            code:
              - "pick(heavy(), light())   // 둘 다 계산"
              - "ok ? heavy() : light()   // 한쪽만 계산"
      - t:
          ko: "<code>undefined</code> 가 된다"
          en: "It becomes <code>undefined</code>"
        diag:
          t:
            ko: "고르지 않은 쪽은 값이 되지 않을 뿐 <code>undefined</code> 로 바뀌는 것도 아닙니다. 그 자리의 식은 아예 실행되지 않아요."
            en: >-
              The side not chosen simply does not become the value; it does not turn into
              <code>undefined</code> either. The expression there never runs at all.
          edge:
            h:
              ko: "가장 날카로운 자리 — 안 한 것과 없는 것"
              en: "The sharpest spot — not done and not there"
            code:
              - "true ? 1 : log()   // log 는 호출되지 않는다"
              - "[1, undefined][1]  // undefined 는 값이다"
      - t:
          ko: "둘을 이어 붙인 값이 된다"
          en: "The two are joined into one value"
        diag:
          t:
            ko: "값 둘 중 <b>하나만</b> 남습니다. 둘을 함께 쓰고 싶으면 이 표기가 아니라 이어 붙이는 식을 따로 써야 해요."
            en: >-
              <b>Only one</b> of the two values survives. To use both you need a separate joining
              expression, not this notation.
          edge:
            h:
              ko: "가장 날카로운 자리 — 고르기와 잇기"
              en: "The sharpest spot — choosing and joining"
            code:
              - "ok ? 'a' : 'b'   // 'a' 또는 'b'"
              - "'a' + 'b'        // 'ab'"

queries:
  - { grammars: [typescript, tsx, javascript], file: ./conditional-ternary.scm }

examples:
  - code: "const label = done ? '완료' : '진행 중'"
    expect: { sites: 1, form: ternary, picks: { 1: "done", 2: "'완료'", 3: "'진행 중'" } }
  - code: "const cls = active ? 'on' : 'off'"
    expect: { sites: 1, picks: { 1: "active" } }
  - code: "if (done) { show() } else { hide() }"
    expect: none
