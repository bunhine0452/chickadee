schema: 1
id: ts/number-is-double
universal: null
name: { ko: 수가 한 종류다, en: One kind of number }
token: "BigInt"
grammars: [typescript, tsx, javascript, vue]
framework: null
essential: true
difficulty: 3
prereq: [ts/number-literal, cs/floating-point, cs/integer-overflow]
confusions: [ts/number-literal, ts/arithmetic]

dict:
  one_liner:
    ko: "정수만 담는 종류가 없다. 어느 자리를 넘으면 값이 조용히 어긋난다."
    en: "There is no kind that holds only whole values. Past a point, one quietly drifts."
  why:
    ko: >-
      다른 언어라면 정수와 소수가 따로 있고, 정수는 자릿수 안에서 정확합니다. 여기는
      한 종류뿐이라 큰 값이 어느 선을 넘으면 마지막 자리부터 어긋나요. {{site.line}}행의
      {{pick.1|code}}{{pick.1|josa:이,가}} 그 선을 코드에 적어 둔 자리입니다.
    en: >-
      In other languages whole numbers and decimals are separate kinds, and the whole ones are exact
      within their width. Here there is only one kind, so past a certain line the last digits drift.
      {{pick.1|code}} on line {{site.line}} is where that line is written down.
  trace:
    - ko: "{{site.line}}행이 {{pick.1|code}} 아래의 이름 하나를 읽는다."
      en: "Line {{site.line}} reads one name under {{pick.1|code}}."
    - ko: "그 이름이 뜻하는 것은 <b>여기까지는 정확하다</b>는 경계다."
      en: "That name stands for a boundary: <b>exact up to here</b>."
    - ko: "경계 밖은 가장 가까운 값으로 접힌다 — 오류가 아니라 다른 값이 된다."
      en: "Outside it, a value folds to the nearest one it can hold — not an error, just another value."

rule:
  ko: >-
    <b>정수 타입이 없다.</b> 2⁵³−1 을 넘는 값은 멈추지 않고 <b>가장 가까운 값</b>으로 바뀐다.
  en: >-
    <b>There is no integer type.</b> Past 2⁵³−1 a value does not stop; it becomes the
    <b>nearest one</b> that fits.
result:
  label:
    ko: "{{site.line}}행이 세워 둔 경계"
    en: "The boundary line {{site.line}} names"
  value: "{{pick.3}}"
  note:
    ko: "여기까지가 정확하다"
    en: "exact up to here"
ok:
  ko: >-
    {{pick.1|code}}{{pick.1|josa:은,는}} 수의 <b>한 종류</b>가 어디까지 정확한지를 코드에
    적어 둔 자리입니다. 그 밖은 조용히 접혀요.
  en: >-
    {{pick.1|code}} is where the code writes down how far the <b>one kind</b> of number stays exact.
    Beyond that it folds, quietly.
payoff:
  ko: >-
    서버가 준 아주 큰 아이디를 그대로 받아 두면 마지막 자리가 바뀝니다. 이 경계를 알면
    그런 값을 글자로 받는 판단을 할 수 있어요.
  en: >-
    Take a very large id from a server as it comes and its last digits change. Knowing this boundary
    is what lets you decide to receive such a value as text instead.
bridge:
  ko: >-
    소수가 안 떨어지는 것도 같은 뿌리입니다 — 종류가 하나라 정수와 소수가 같은 자리를
    나눠 쓰고 있어요.
  en: >-
    Decimals not landing on the mark has the same root: one kind means whole values and fractions
    share the same slots.
misconceptions:
  - ko: "정수는 언제나 정확하다 — 어느 선까지만 정확하고, 그 선은 자릿수가 열여섯쯤입니다."
    en: >-
      Whole values are always exact — they are exact only up to a line, and that line sits around
      sixteen digits.
  - ko: "값이 커지면 오류가 난다 — 오류는 안 납니다. 값만 조용히 달라져요."
    en: "A big value raises an error — nothing is raised. Only the value quietly differs."

point:
  - q:
      ko: "{{site.line}}행에서 <b>수가 어디까지 정확한지를 말하는 이름</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the name that says how far a number stays exact</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.3
    diag:
      pick.1:
        t:
          ko: "{{pick.1|code}}{{pick.1|josa:은,는}} 그 이름을 <b>담고 있는 자리</b>입니다. 경계를 말하는 것은 그 아래에 붙은 이름이에요."
          en: >-
            {{pick.1|code}} is the <b>holder</b> of that name. What states the boundary is the name
            attached under it.
        edge:
          h:
            ko: "가장 날카로운 자리 — 담는 것과 담기는 것"
            en: "The sharpest spot — the holder or the held"
          code:
            - "Number                    // 담는 자리"
            - "Number.MAX_SAFE_INTEGER   // 경계를 말하는 이름"
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 안쪽 이름을 꺼내는 <b>표시</b>입니다. 무엇을 꺼내는지는 그 오른쪽이 말해요."
          en: >-
            {{pick.2|code}} is the <b>mark</b> that reaches inside for a name. What is reached for is
            said on its right.
        edge:
          h:
            ko: "가장 날카로운 자리 — 꺼내는 표시와 꺼내지는 이름"
            en: "The sharpest spot — the reaching mark or the name reached"
          code:
            - "Number.MIN_SAFE_INTEGER"
            - "Number.MAX_SAFE_INTEGER"

meaning:
  - q:
      ko: "<code>9007199254740993</code> 를 그대로 적고 다시 찍으면 무엇이 나올까요?"
      en: "Write <code>9007199254740993</code> as it is and print it back — what comes out?"
    hint:
      ko: "정확한 정수의 경계가 <code>9007199254740991</code> 입니다."
      en: "The boundary for exact whole values is <code>9007199254740991</code>."
    options:
      - t:
          ko: "<code>9007199254740992</code> — 마지막 자리가 바뀐다"
          en: "<code>9007199254740992</code> — the last digit changes"
      - t:
          ko: "적은 그대로 나온다"
          en: "It comes back exactly as written"
        diag:
          t:
            ko: "경계 안쪽이라면 그 말이 맞습니다. 경계 밖에서는 담을 수 있는 값이 <b>띄엄띄엄</b>해서 가장 가까운 것으로 접혀요."
            en: >-
              Inside the boundary that holds. Outside it the values that can be held are
              <b>spaced apart</b>, so it folds to the nearest one.
          edge:
            h:
              ko: "가장 날카로운 자리 — 한 걸음 차이"
              en: "The sharpest spot — one step apart"
            code:
              - "9007199254740991   // 그대로"
              - "9007199254740993   // 992 로 접힌다"
      - t:
          ko: "숫자가 너무 커서 멈춘다"
          en: "The number is too large and it stops"
        diag:
          t:
            ko: "멈추는 언어도 있습니다. 여기서는 멈추지 않고 값만 달라지는데, 그래서 로그를 볼 때까지 아무도 모릅니다."
            en: >-
              Some languages do stop. Here nothing stops and only the value differs, which is why
              nobody notices until the log.
          edge:
            h:
              ko: "가장 날카로운 자리 — 멈추지 않는다"
              en: "The sharpest spot — nothing stops"
            code:
              - "9007199254740993        // 조용히 다른 값"
              - "9007199254740993n       // 다른 종류로 적으면 그대로"
      - t:
          ko: "<code>Infinity</code> 가 된다"
          en: "It becomes <code>Infinity</code>"
        diag:
          t:
            ko: "훨씬 더 큰 값에서는 그렇게 됩니다. 이 자리는 크기가 넘친 것이 아니라 <b>자릿수가 모자란</b> 것이에요."
            en: >-
              At far larger values that does happen. Here nothing overflowed in size — what ran out
              is <b>digits</b>.
          edge:
            h:
              ko: "가장 날카로운 자리 — 크기와 자릿수"
              en: "The sharpest spot — size or digits"
            code:
              - "1e309              // Infinity"
              - "9007199254740993   // 자릿수가 모자란다"

# 빈칸형을 못 내는 사유 (D145).
no_hole_reason: >-
  경계를 말하는 것은 이름 하나이고, 다른 이름을 넣으면 「어느 이름이 맞나」를 외우는 물음이 된다.
  이 개념이 재는 것은 이름이 아니라 「그 선 밖에서 무슨 일이 일어나나」다.

why_gate:
  q:
    ko: "{{site.line}}행은 왜 수의 경계를 코드에 적어 두었을까요?"
    en: "Why does line {{site.line}} write the number boundary into the code?"
  choices:
    - t:
        ko: "그 선을 넘는 값이 들어올 수 있고, 넘으면 아무 신호 없이 값이 달라져서"
        en: "Because a value past that line can arrive, and past it the value changes with no signal"
      ok: true
      fb:
        ko: "그 방향입니다. 그런 값이 어디서 들어오는지(서버·데이터베이스)도 함께 적어 보세요."
        en: "That is the direction. Add where such a value comes from — a server, a database."
    - t:
        ko: "그보다 큰 수를 쓰면 프로그램이 멈춰서"
        en: "Because a larger number makes the program stop"
      ok: false
      fb:
        ko: "멈추지 않습니다. 멈추면 오히려 쉬운데, 조용히 달라지는 것이 이 자리의 어려움입니다."
        en: >-
          Nothing stops. Stopping would be the easy case; the difficulty here is that it changes
          quietly.
    - t:
        ko: "메모리를 아끼려고"
        en: "To save memory"
      ok: false
      fb:
        ko: "수 하나의 크기는 언제나 같습니다. 갈리는 것은 크기가 아니라 정확도입니다."
        en: "One number is always the same size. What parts ways is exactness, not size."

queries:
  - { grammars: [typescript, tsx, javascript, vue], file: ./number-is-double.scm }

examples:
  - code: "const top = Number.MAX_SAFE_INTEGER"
    expect: { sites: 1, form: limit, picks: { 1: "Number", 2: ".", 3: "MAX_SAFE_INTEGER" } }
  - code: "if (Number.isSafeInteger(id)) { use(id) }"
    expect: { sites: 1, form: limit, picks: { 1: "Number", 2: ".", 3: "isSafeInteger" } }
  - code: "const big = BigInt(raw)"
    expect: { sites: 1, form: bigint, picks: { 1: "BigInt", 2: "raw" } }
  - code: "const n = Number(raw)"
    expect: none
  - code: "const name = user.id"
    expect: none
