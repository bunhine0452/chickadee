schema: 1
id: ts/async-await
universal: common/async-await
name: { ko: "async / await", en: "async and await" }
token: "await"
grammars: [typescript, tsx, javascript]
framework: null
essential: true
difficulty: 3
prereq: [ts/call-expression, ts/arrow-function]
confusions: [ts/promise-then, ts/try-catch]

dict:
  one_liner: "<code>await</code> 는 약속이 풀릴 때까지 그 줄에서 기다렸다가 값을 꺼낸다."
  why: >-
    네트워크·파일은 당장 값을 주지 못하고 <b>약속</b>을 줍니다. {{site.line}}행의
    {{pick.1|code}}{{pick.1|josa:은,는}} 그 약속이 풀릴 때까지 이 함수만 멈춰 세우고, 풀리면 <b>안에 든 값</b>을
    꺼내 이어 갑니다. 화면 전체가 멈추는 것이 아니라 이 함수만 기다립니다.
  trace:
    - "{{pick.2|code}}{{pick.2|josa:이,가}} 약속을 돌려준다."
    - "{{pick.1|code}}{{pick.1|josa:이,가}} 그 약속이 풀릴 때까지 {{site.line}}행에서 기다린다."
    - "풀리면 약속 <b>안의 값</b>이 {{site.line}}행의 값이 되고 다음 줄로 간다."

rule: "<b><code>await</code> 는 <code>async</code> 안에서만 쓴다.</b> 기다리면 값이 나오고, 안 기다리면 약속이 나온다."
result:
  label: "{{site.line}}행의 값"
  value: "약속 안에 들어 있던 값"
  note: "기다리지 않으면 약속 자체"
ok: >-
  <code>await</code> 는 약속이 풀릴 때까지 <b>그 함수만</b> 멈춰 세웁니다. 풀린 뒤에는 약속이 아니라
  안에 든 값이 나오고, 약속이 깨지면 그 자리에서 예외가 됩니다.
payoff: "콜백을 겹치지 않고도 「먼저 이것, 그다음 저것」을 위에서 아래로 씁니다."
bridge: "<code>async</code> 가 붙은 함수는 무엇을 돌려주든 <b>약속으로 감싸서</b> 돌려줍니다."
misconceptions:
  - "<code>await</code> 가 프로그램 전체를 멈춘다 — 그 함수만 멈춥니다. 다른 일은 계속 돕니다."
  - "<code>async</code> 만 붙이면 빨라진다 — 순서를 쓰는 표기일 뿐 속도와는 무관합니다."

point:
  - q: "{{site.line}}행에서 <b>값이 올 때까지 기다리게 하는 낱말</b>을 짚어 보세요."
    hint: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
    answer: pick.1
    diag:
      pick.2:
        t: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>약속을 만드는 쪽</b>입니다. 만들어진 약속을 풀어 값으로 바꾸는 일은 그 앞의 낱말이 해요."
        edge:
          h: "가장 날카로운 자리 — 만드는 쪽과 기다리는 쪽"
          code:
            - "const p = {{pick.2}}          // 약속"
            - "const v = await {{pick.2}}    // 값"

meaning:
  - q: "{{pick.1|code}}{{pick.1|josa:을,를}} 빼면 {{site.line}}행의 값은 무엇이 될까요?"
    hint: "약속과 약속 안의 값은 다릅니다."
    options:
      - t: "약속 객체 자체 — 안의 값이 아니다"
      - t: "같은 값이 나온다"
        diag:
          t: "기다리는 낱말이 없으면 <b>약속 그대로</b>가 나옵니다. 겉보기에 값처럼 보여도 <code>.name</code> 같은 것을 읽으면 <code>undefined</code> 예요."
          edge:
            h: "가장 날카로운 자리 — 약속인가 값인가"
            code:
              - "const a = getUser()         // Promise"
              - "const b = await getUser()   // { name: ... }"
      - t: "<code>undefined</code>"
        diag:
          t: "값을 안 꺼냈을 뿐 약속은 분명히 있습니다. <code>undefined</code> 가 나오는 건 함수가 아무것도 돌려주지 않을 때예요."
          edge:
            h: "가장 날카로운 자리 — 없는 것과 안 푼 것"
            code:
              - "function f() {}       // undefined"
              - "async function g() {} // Promise<undefined>"
      - t: "그 줄에서 예외가 난다"
        diag:
          t: "기다리지 않는 것 자체는 예외가 아닙니다. 다만 약속이 깨졌는데 아무도 받지 않으면 나중에 경고가 남아요."
          edge:
            h: "가장 날카로운 자리 — 언제 예외가 되나"
            code:
              - "const p = fail()         // 조용하다"
              - "const v = await fail()   // 여기서 예외"

queries:
  - { grammars: [typescript, tsx, javascript], file: ./async-await.scm }

examples:
  - code: "async function load() { const res = await fetch(url) }"
    expect: { sites: 2, form: async-fn, picks: { 1: "async", 2: "load" } }
  - code: "const save = async () => { await write(data) }"
    expect: { sites: 2, form: async-arrow }
  - code: "function load() { return fetch(url) }"
    expect: none
