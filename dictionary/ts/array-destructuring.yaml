schema: 1
id: ts/array-destructuring
universal: common/destructuring
name: { ko: 배열 구조분해, en: Array destructuring }
token: "[a, b] ="
grammars: [typescript, tsx, javascript]
framework: null
essential: true
difficulty: 2
prereq: [ts/const-declaration, ts/array-basics]
confusions: [ts/index-access-pair, ts/object-destructuring]

dict:
  one_liner: "<code>const [a, b] = xs</code> — <b>자리 순서</b>가 이름을 정한다."
  why: >-
    줄지어 있는 값에는 이름이 없고 자리만 있습니다. {{site.line}}행은 {{pick.3|code}} 의 첫째
    자리를 {{pick.1|code}}{{pick.1|josa:으로,로}} 부르기로 정하는 줄이에요. <code>useState</code> 처럼
    「값과 그 값을 바꾸는 함수」를 나란히 돌려주는 자리에서 이 표기가 기본이 된 이유는, 두 이름을
    <b>한 줄에서 함께</b> 볼 수 있기 때문입니다.
  trace:
    - "{{pick.3|code}}{{pick.3|josa:을,를}} 한 번 읽는다."
    - "첫째 자리의 값에 {{pick.1|code}} 라는 이름을 붙인다.{{#pick.2}} 둘째 자리에는 {{pick.2|code}} 라는 이름을 붙인다.{{/pick.2}}"
    - "{{site.line}}행이 끝나면 {{pick.3|code}}{{pick.3|josa:은,는}} 그대로 있고, 이름만 새로 생긴다."

rule: "<b>대괄호 안의 순서가 곧 꺼내는 자리다.</b> 이름은 마음대로 지어도 되고, 자리는 바꿀 수 없다."
result:
  label: "{{site.line}}행이 만드는 것"
  value: "이름 두 개"
  note: "{{pick.3|code}}{{pick.3|josa:은,는}} 그대로"
ok: >-
  왼쪽 대괄호는 배열을 만드는 것이 아니라 <b>자리를 읽는 틀</b>입니다. 첫째 자리가
  {{pick.1|code}}{{pick.1|josa:이,가}} 되고, 그다음 자리가 그다음 이름이 됩니다.
payoff: >-
  같은 일을 <code>{{pick.3}}[0]</code>·<code>{{pick.3}}[1]</code> 로 쓰면 자리 번호가 코드에 흩어집니다.
  한 줄로 모으면 <b>몇 개를 꺼내 쓰는지</b>가 그 줄에서 바로 보여요.
bridge: >-
  이름은 자리로 정해집니다 — 이름을 바꿔 적어도 꺼내 오는 자리는 그대로예요. 이름으로 꺼내는 것은
  중괄호를 쓰는 <code>{ }</code> 쪽 표기입니다.
misconceptions:
  - "왼쪽 대괄호가 새 배열을 만든다 — 아니요. 자리를 읽는 틀일 뿐입니다."
  - "이름이 배열의 내용과 맞아야 한다 — 이름은 자유고, 맞아야 하는 것은 자리 순서입니다."

point:
  - q: "{{site.line}}행에서 {{pick.3|code}} 의 <b>첫째 자리</b>를 받는 이름을 짚어 보세요."
    hint: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
    answer: pick.1
    diag:
      pick.2:
        t: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>둘째</b> 자리입니다. 대괄호 안의 순서가 그대로 꺼내는 자리라, 쉼표를 하나 건너뛴 만큼 자리도 하나 뒤예요."
        edge:
          h: "가장 날카로운 자리 — 쉼표 하나가 자리 하나"
          code:
            - "const [a, b] = xs   // a 는 xs[0], b 는 xs[1]"
            - "const [, b] = xs    // 앞자리를 건너뛰면 b 가 xs[1]"
      pick.3:
        t: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>꺼내지는 쪽</b>입니다. 이름이 생기는 곳은 등호 왼쪽이에요."
        edge:
          h: "가장 날카로운 자리 — 어느 쪽에 이름이 생기나"
          code:
            - "const [a] = xs   // 새 이름은 a"
            - "const xs = [a]   // 새 이름은 xs"

meaning:
  - q: "{{site.line}}행이 끝난 뒤 {{pick.3|code}}{{pick.3|josa:은,는}} 어떻게 될까요?"
    hint: "꺼내 읽는 것과 바꾸는 것은 다르다."
    options:
      - t: "그대로다 — 읽어서 이름을 붙였을 뿐이다"
      - t: "꺼낸 만큼 앞에서 줄어든다"
        diag:
          t: "<code>shift()</code> 였다면 그 말이 맞습니다 — 그건 앞에서 하나를 <b>꺼내 없앱니다</b>. 이 표기는 자리를 읽기만 해요."
          edge:
            h: "가장 날카로운 자리 — 읽기와 덜어내기"
            code:
              - "const [a] = xs    // xs 그대로"
              - "const a = xs.shift()   // xs 가 하나 줄어든다"
      - t: "새 배열로 바뀐다"
        diag:
          t: "새로 생기는 것은 <b>이름</b>이지 배열이 아닙니다. 등호 오른쪽 값은 그대로 있고 그 값을 가리키는 이름만 늘어나요."
          edge:
            h: "가장 날카로운 자리 — 값과 이름"
            code:
              - "const [a, b] = xs        // xs 는 그대로"
              - "const ys = [...xs]       // 이때만 새 배열"
      - t: "자리 수가 이름 수와 같아야 해서 길이가 맞춰진다"
        diag:
          t: "이름을 적은 만큼만 꺼내고 나머지는 그냥 둡니다. 이름이 더 많으면 남는 이름에 <code>undefined</code> 가 담겨요."
          edge:
            h: "가장 날카로운 자리 — 남거나 모자랄 때"
            code:
              - "const [a] = [1, 2]      // a 는 1, 2 는 그대로 남는다"
              - "const [a, b] = [1]      // b 는 undefined"

queries:
  - { grammars: [typescript, tsx, javascript], file: ./array-destructuring.scm }

examples:
  - code: "const [count, setCount] = useState(0)"
    expect:
      sites: 1
      form: declarator
      picks: { 1: "count", 2: "setCount", 3: "useState(0)" }
      ctx: { pattern: "[count, setCount]" }
  - code: "const [first] = parts"
    expect: { sites: 1, picks: { 1: "first", 3: "parts" } }
  - code: "[a, b] = [b, a]"
    expect: { sites: 1, form: assign, picks: { 1: "a", 2: "b" } }
  - code: "const { a } = o"
    expect: none
