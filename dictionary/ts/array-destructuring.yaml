schema: 1
id: ts/array-destructuring
universal: common/destructuring
name: { ko: 배열 구조분해, en: Array destructuring }
token: "[a, b] ="
grammars: [typescript, tsx, javascript]
framework: null
essential: true
difficulty: 2
prereq: [ts/const-declaration, ts/array-basics]
confusions: [ts/index-access-pair, ts/object-destructuring]

dict:
  one_liner:
    ko: "<code>const [a, b] = xs</code> — <b>자리 순서</b>가 이름을 정한다."
    en: "<code>const [a, b] = xs</code> — <b>the order of the slots</b> decides the names."
  why:
    ko: >-
      줄지어 있는 값에는 이름이 없고 자리만 있습니다. {{site.line}}행은 {{pick.3|code}} 의 첫째
      자리를 {{pick.1|code}}{{pick.1|josa:으로,로}} 부르기로 정하는 줄이에요. <code>useState</code> 처럼
      「값과 그 값을 바꾸는 함수」를 나란히 돌려주는 자리에서 이 표기가 기본이 된 이유는, 두 이름을
      <b>한 줄에서 함께</b> 볼 수 있기 때문입니다.
    en: >-
      Values in a row have no names, only positions. Line {{site.line}} is the line that decides to
      call the first slot of {{pick.3|code}} by the name {{pick.1|code}}. Where something returns “a
      value and the function that changes it” side by side, as <code>useState</code> does, this
      notation became the default because both names are visible <b>together on one line</b>.
  trace:
    - ko: "{{pick.3|code}}{{pick.3|josa:을,를}} 한 번 읽는다."
      en: "{{pick.3|code}} is read once."
    - ko: "첫째 자리의 값에 {{pick.1|code}} 라는 이름을 붙인다.{{#pick.2}} 둘째 자리에는 {{pick.2|code}} 라는 이름을 붙인다.{{/pick.2}}"
      en: >-
        The value in the first slot gets the name {{pick.1|code}}.{{#pick.2}} The second slot gets
        the name {{pick.2|code}}.{{/pick.2}}
    - ko: "{{site.line}}행이 끝나면 {{pick.3|code}}{{pick.3|josa:은,는}} 그대로 있고, 이름만 새로 생긴다."
      en: "When line {{site.line}} finishes, {{pick.3|code}} is unchanged; only the names are new."

rule:
  ko: "<b>대괄호 안의 순서가 곧 꺼내는 자리다.</b> 이름은 마음대로 지어도 되고, 자리는 바꿀 수 없다."
  en: >-
    <b>The order inside the brackets is the slot it takes from.</b> The names are yours to choose;
    the positions are not.
result:
  label:
    ko: "{{site.line}}행이 만드는 것"
    en: "What line {{site.line}} makes"
  value: "이름 두 개"
  note:
    ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 그대로"
    en: "{{pick.3|code}} is unchanged"
ok:
  ko: >-
    왼쪽 대괄호는 배열을 만드는 것이 아니라 <b>자리를 읽는 틀</b>입니다. 첫째 자리가
    {{pick.1|code}}{{pick.1|josa:이,가}} 되고, 그다음 자리가 그다음 이름이 됩니다.
  en: >-
    The brackets on the left do not make an array; they are <b>a frame for reading positions</b>.
    The first slot becomes {{pick.1|code}}, and the next slot becomes the next name.
payoff:
  ko: >-
    같은 일을 <code>{{pick.3}}[0]</code>·<code>{{pick.3}}[1]</code> 로 쓰면 자리 번호가 코드에 흩어집니다.
    한 줄로 모으면 <b>몇 개를 꺼내 쓰는지</b>가 그 줄에서 바로 보여요.
  en: >-
    Write the same thing as <code>{{pick.3}}[0]</code> and <code>{{pick.3}}[1]</code> and the slot
    numbers scatter through the code. Gather it into one line and <b>how many you take out</b> is
    visible on that line.
bridge:
  ko: >-
    이름은 자리로 정해집니다 — 이름을 바꿔 적어도 꺼내 오는 자리는 그대로예요. 이름으로 꺼내는 것은
    중괄호를 쓰는 <code>{ }</code> 쪽 표기입니다.
  en: >-
    The names are settled by position — rename them and the slot they come from stays the same.
    Taking by name is the <code>{ }</code> notation with braces.
misconceptions:
  - ko: "왼쪽 대괄호가 새 배열을 만든다 — 아니요. 자리를 읽는 틀일 뿐입니다."
    en: "The brackets on the left make a new array — no. They are only a frame for reading positions."
  - ko: "이름이 배열의 내용과 맞아야 한다 — 이름은 자유고, 맞아야 하는 것은 자리 순서입니다."
    en: >-
      The names have to match the array's contents — the names are free; what has to match is the
      order of the slots.

point:
  - q:
      ko: "{{site.line}}행에서 {{pick.3|code}} 의 <b>첫째 자리</b>를 받는 이름을 짚어 보세요."
      en: >-
        On line {{site.line}}, point at the name that receives <b>the first slot</b> of
        {{pick.3|code}}.
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>둘째</b> 자리입니다. 대괄호 안의 순서가 그대로 꺼내는 자리라, 쉼표를 하나 건너뛴 만큼 자리도 하나 뒤예요."
          en: >-
            {{pick.2|code}} is the <b>second</b> slot. The order inside the brackets is the slot it
            takes from, so one comma further along is one slot further along.
        edge:
          h:
            ko: "가장 날카로운 자리 — 쉼표 하나가 자리 하나"
            en: "The sharpest spot — one comma is one slot"
          code:
            - "const [a, b] = xs   // a 는 xs[0], b 는 xs[1]"
            - "const [, b] = xs    // 앞자리를 건너뛰면 b 가 xs[1]"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>꺼내지는 쪽</b>입니다. 이름이 생기는 곳은 등호 왼쪽이에요."
          en: >-
            {{pick.3|code}} is <b>the side being taken from</b>. Names appear on the left of the
            equals sign.
        edge:
          h:
            ko: "가장 날카로운 자리 — 어느 쪽에 이름이 생기나"
            en: "The sharpest spot — which side the names appear on"
          code:
            - "const [a] = xs   // 새 이름은 a"
            - "const xs = [a]   // 새 이름은 xs"

meaning:
  - q:
      ko: "{{site.line}}행이 끝난 뒤 {{pick.3|code}}{{pick.3|josa:은,는}} 어떻게 될까요?"
      en: "After line {{site.line}} finishes, what happens to {{pick.3|code}}?"
    hint:
      ko: "꺼내 읽는 것과 바꾸는 것은 다르다."
      en: "Reading something out and changing it are different."
    options:
      - t:
          ko: "그대로다 — 읽어서 이름을 붙였을 뿐이다"
          en: "Unchanged — it was read and named, nothing more"
      - t:
          ko: "꺼낸 만큼 앞에서 줄어든다"
          en: "It shrinks from the front by however many were taken"
        diag:
          t:
            ko: "<code>shift()</code> 였다면 그 말이 맞습니다 — 그건 앞에서 하나를 <b>꺼내 없앱니다</b>. 이 표기는 자리를 읽기만 해요."
            en: >-
              That would hold for <code>shift()</code> — it <b>takes one off</b> the front. This
              notation only reads the positions.
          edge:
            h:
              ko: "가장 날카로운 자리 — 읽기와 덜어내기"
              en: "The sharpest spot — reading and removing"
            code:
              - "const [a] = xs    // xs 그대로"
              - "const a = xs.shift()   // xs 가 하나 줄어든다"
      - t:
          ko: "새 배열로 바뀐다"
          en: "It becomes a new array"
        diag:
          t:
            ko: "새로 생기는 것은 <b>이름</b>이지 배열이 아닙니다. 등호 오른쪽 값은 그대로 있고 그 값을 가리키는 이름만 늘어나요."
            en: >-
              What is new is <b>a name</b>, not an array. The value on the right of the equals sign
              stays as it is; only the names pointing at it multiply.
          edge:
            h:
              ko: "가장 날카로운 자리 — 값과 이름"
              en: "The sharpest spot — the value and the name"
            code:
              - "const [a, b] = xs        // xs 는 그대로"
              - "const ys = [...xs]       // 이때만 새 배열"
      - t:
          ko: "자리 수가 이름 수와 같아야 해서 길이가 맞춰진다"
          en: "The slot count has to equal the name count, so the length is adjusted"
        diag:
          t:
            ko: "이름을 적은 만큼만 꺼내고 나머지는 그냥 둡니다. 이름이 더 많으면 남는 이름에 <code>undefined</code> 가 담겨요."
            en: >-
              It takes as many as you wrote names for and leaves the rest alone. If there are more
              names than values, the extra names hold <code>undefined</code>.
          edge:
            h:
              ko: "가장 날카로운 자리 — 남거나 모자랄 때"
              en: "The sharpest spot — too many or too few"
            code:
              - "const [a] = [1, 2]      // a 는 1, 2 는 그대로 남는다"
              - "const [a, b] = [1]      // b 는 undefined"

queries:
  - { grammars: [typescript, tsx, javascript], file: ./array-destructuring.scm }

examples:
  - code: "const [count, setCount] = useState(0)"
    expect:
      sites: 1
      form: declarator
      picks: { 1: "count", 2: "setCount", 3: "useState(0)" }
      ctx: { pattern: "[count, setCount]" }
  - code: "const [first] = parts"
    expect: { sites: 1, picks: { 1: "first", 3: "parts" } }
  - code: "[a, b] = [b, a]"
    expect: { sites: 1, form: assign, picks: { 1: "a", 2: "b" } }
  - code: "const { a } = o"
    expect: none
