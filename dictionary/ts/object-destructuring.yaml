schema: 1
id: ts/object-destructuring
universal: common/destructuring
name: { ko: 객체 구조분해, en: Object destructuring }
token: "{ a } ="
grammars: [typescript, tsx, javascript]
framework: null
essential: true
difficulty: 2
prereq: [ts/const-declaration, ts/property-access]
confusions: [ts/array-destructuring]

dict:
  one_liner:
    ko: "<code>const { a } = o</code> — <b>이름</b>이 꺼낼 것을 정한다."
    en: "<code>const { a } = o</code> — <b>the name</b> decides what is taken out."
  why:
    ko: >-
      {{pick.3|code}} 에서 쓸 것만 골라 꺼내는 줄입니다. 자리 순서는 상관이 없고 <b>이름이 열쇠</b>라,
      {{pick.1|code}} 라고 적으면 같은 이름의 속성을 찾아옵니다. 이 줄만 봐도 아래 코드가
      {{pick.3|code}} 의 무엇을 쓰는지 드러나는 것이 이 표기의 값어치예요.
    en: >-
      This line takes out only what you will use from {{pick.3|code}}. Position does not matter and
      <b>the name is the key</b>, so writing {{pick.1|code}} fetches the property of that name. What
      this notation buys you is that this line alone shows what the code below uses out of
      {{pick.3|code}}.
  trace:
    - ko: "{{pick.3|code}}{{pick.3|josa:을,를}} 한 번 읽는다."
      en: "{{pick.3|code}} is read once."
    - ko: "같은 이름의 속성을 찾아 {{pick.1|code}} 라는 이름에 담는다.{{#pick.2}} {{pick.2|code}} 도 같은 방식이다.{{/pick.2}}"
      en: >-
        The property of the same name is found and put in the name {{pick.1|code}}.{{#pick.2}}
        {{pick.2|code}} works the same way.{{/pick.2}}
    - ko: "없는 이름을 적었으면 <code>undefined</code> 가 담긴다 — {{site.line}}행은 그래도 멈추지 않는다."
      en: >-
        Write a name that is not there and it holds <code>undefined</code> — line {{site.line}}
        still does not stop.

rule:
  ko: "<b>중괄호 안의 이름이 곧 속성 이름이다.</b> 순서는 상관없고, 없으면 <code>undefined</code>."
  en: >-
    <b>The name inside the braces is the property name.</b> Order does not matter, and what is not
    there is <code>undefined</code>.
result:
  label:
    ko: "{{site.line}}행이 만드는 것"
    en: "What line {{site.line}} makes"
  value: "속성과 같은 이름"
  note:
    ko: "없는 이름이면 <code>undefined</code>"
    en: "a name that is not there gives <code>undefined</code>"
ok:
  ko: >-
    중괄호 왼쪽은 객체를 만드는 것이 아니라 <b>이름으로 꺼내는 틀</b>입니다.
    {{pick.1|code}} 라고 적으면 {{pick.3|code}} 의 같은 이름 속성을 찾아 담습니다.
  en: >-
    The braces on the left do not make an object; they are <b>a frame for taking things out by
    name</b>. Write {{pick.1|code}} and it finds the property of that name on {{pick.3|code}}.
payoff:
  ko: >-
    <code>{{pick.3}}.{{pick.1}}</code>{{pick.1|josa:을,를}} 여러 줄에서 되풀이하는 대신 한 줄에서 이름을 만들어 둡니다.
    <b>무엇을 쓰는지</b>가 파일 위쪽에 모여요.
  en: >-
    Instead of repeating <code>{{pick.3}}.{{pick.1}}</code> across several lines, you make the name
    once on one line. <b>What you use</b> gathers near the top of the file.
bridge:
  ko: >-
    이름을 바꾸고 싶으면 <code>{ 원래이름: 새이름 }</code> 처럼 콜론을 씁니다. 왼쪽이 속성 이름,
    오른쪽이 새로 생기는 이름이에요.
  en: >-
    To rename it, use a colon — <code>{ originalName: newName }</code>. The left is the property
    name, the right is the name being created.
misconceptions:
  - ko: "왼쪽 중괄호가 새 객체를 만든다 — 아니요. 이름으로 꺼내는 틀입니다."
    en: "The braces on the left make a new object — no. They are a frame for taking things out by name."
  - ko: "적은 이름이 없으면 그 자리에서 멈춘다 — <code>undefined</code> 가 담기고 계속 갑니다."
    en: >-
      If the name you wrote is not there it stops — <code>undefined</code> goes in and it carries
      on.

point:
  - q:
      ko: "{{site.line}}행에서 <b>꺼내지는 쪽</b>, 즉 속성을 내주는 값을 짚어 보세요."
      en: >-
        On line {{site.line}}, point at <b>the side being taken from</b>, the value supplying the
        properties.
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.3
    diag:
      pick.1:
        t:
          ko: "{{pick.1|code}}{{pick.1|josa:은,는}} <b>새로 생기는 이름</b>입니다. 같은 글자가 속성 이름이기도 해서 헷갈리지만, 값을 내주는 쪽은 등호 오른쪽이에요."
          en: >-
            {{pick.1|code}} is <b>the name being created</b>. The same letters are also the property
            name, which makes it easy to mix up, but the side supplying the value is on the right of
            the equals sign.
        edge:
          h:
            ko: "가장 날카로운 자리 — 같은 글자, 다른 역할"
            en: "The sharpest spot — same letters, different roles"
          code:
            - "const { a } = o   // o 가 내주고, a 가 생긴다"
            - "const o = { a }   // a 가 내주고, o 가 생긴다"
      pick.2:
        t:
          ko: "{{pick.2|code}} 또한 새로 생기는 이름 쪽입니다. 중괄호 안은 전부 받는 쪽이고, 내주는 쪽은 등호 하나 건너에 있어요."
          en: >-
            {{pick.2|code}} is on the created-name side too. Everything inside the braces is the
            receiving side, and the supplying side is one equals sign away.
        edge:
          h:
            ko: "가장 날카로운 자리 — 등호를 기준으로"
            en: "The sharpest spot — take the equals sign as the line"
          code:
            - "const { a, b } = o   // 받는 쪽: a, b"
            - "const { a, b } = o   // 내주는 쪽: o"

meaning:
  - q:
      ko: "{{pick.3|code}} 에 {{pick.1|code}} 라는 속성이 없다면 {{site.line}}행은 어떻게 될까요?"
      en: "If {{pick.3|code}} has no property called {{pick.1|code}}, what does line {{site.line}} do?"
    hint:
      ko: "없는 속성을 읽는 일과, 없는 값에서 읽는 일은 다르다."
      en: >-
        Reading a property that is not there is not the same as reading from a value that is not
        there.
    options:
      - t:
          ko: "{{pick.1|code}} 에 <code>undefined</code> 가 담기고 계속 간다"
          en: "{{pick.1|code}} holds <code>undefined</code> and it carries on"
      - t:
          ko: "TypeError 로 멈춘다"
          en: "It stops with a TypeError"
        diag:
          t:
            ko: "{{pick.3|code}} 자체가 <code>undefined</code> 나 <code>null</code> 이었다면 그 말이 맞습니다. 값은 있는데 그 안에 이름이 없는 경우라면 <code>undefined</code> 가 담길 뿐이에요."
            en: >-
              That would hold if {{pick.3|code}} itself were <code>undefined</code> or
              <code>null</code>. When the value is there but the name inside is not,
              <code>undefined</code> simply goes in.
          edge:
            h:
              ko: "가장 날카로운 자리 — 없는 속성과 없는 값"
              en: "The sharpest spot — a missing property and a missing value"
            code:
              - "const { a } = {}          // a 는 undefined"
              - "const { a } = undefined   // TypeError"
      - t:
          ko: "그 이름이 아예 만들어지지 않는다"
          en: "The name is never created at all"
        diag:
          t:
            ko: "이름은 <b>적은 대로 만들어집니다</b>. 속성이 없으면 담기는 값이 <code>undefined</code> 일 뿐, 그 이름은 그 아래에서 쓸 수 있어요."
            en: >-
              The name is created <b>exactly as written</b>. With no such property, the value that
              goes in is <code>undefined</code>, and the name is still usable below.
          edge:
            h:
              ko: "가장 날카로운 자리 — 이름은 생긴다"
              en: "The sharpest spot — the name does come into being"
            code:
              - "const { a } = {}   // a 라는 이름은 있다"
              - "a                  // undefined"
      - t:
          ko: "<code>null</code> 이 담긴다"
          en: "<code>null</code> goes in"
        diag:
          t:
            ko: "찾지 못했을 때 담기는 값은 <code>null</code> 이 아니라 <code>undefined</code> 입니다. <code>null</code> 은 누군가 <b>일부러 넣어 둔</b> 값이에요."
            en: >-
              What goes in when nothing is found is <code>undefined</code>, not <code>null</code>.
              <code>null</code> is a value someone <b>put there on purpose</b>.
          edge:
            h:
              ko: "가장 날카로운 자리 — 없음 둘의 차이"
              en: "The sharpest spot — the difference between the two absences"
            code:
              - "const { a } = {}           // undefined"
              - "const { a } = { a: null }  // null"

queries:
  - { grammars: [typescript, tsx, javascript], file: ./object-destructuring.scm }

examples:
  - code: "const { data, error } = useQuery()"
    expect:
      sites: 1
      form: declarator
      picks: { 1: "data", 2: "error", 3: "useQuery()" }
      ctx: { pattern: "{ data, error }" }
  - code: "const { id } = props"
    expect: { sites: 1, picks: { 1: "id", 3: "props" } }
  - code: "const [a] = xs"
    expect: none
