schema: 1
id: ts/object-destructuring
universal: common/destructuring
name: { ko: 객체 구조분해, en: Object destructuring }
token: "{ a } ="
grammars: [typescript, tsx, javascript]
framework: null
essential: true
difficulty: 2
prereq: [ts/const-declaration, ts/property-access]
confusions: [ts/array-destructuring]

dict:
  one_liner: "<code>const { a } = o</code> — <b>이름</b>이 꺼낼 것을 정한다."
  why: >-
    {{pick.3|code}} 에서 쓸 것만 골라 꺼내는 줄입니다. 자리 순서는 상관이 없고 <b>이름이 열쇠</b>라,
    {{pick.1|code}} 라고 적으면 같은 이름의 속성을 찾아옵니다. 이 줄만 봐도 아래 코드가
    {{pick.3|code}} 의 무엇을 쓰는지 드러나는 것이 이 표기의 값어치예요.
  trace:
    - "{{pick.3|code}}{{pick.3|josa:을,를}} 한 번 읽는다."
    - "같은 이름의 속성을 찾아 {{pick.1|code}} 라는 이름에 담는다.{{#pick.2}} {{pick.2|code}} 도 같은 방식이다.{{/pick.2}}"
    - "없는 이름을 적었으면 <code>undefined</code> 가 담긴다 — {{site.line}}행은 그래도 멈추지 않는다."

rule: "<b>중괄호 안의 이름이 곧 속성 이름이다.</b> 순서는 상관없고, 없으면 <code>undefined</code>."
result:
  label: "{{site.line}}행이 만드는 것"
  value: "속성과 같은 이름"
  note: "없는 이름이면 <code>undefined</code>"
ok: >-
  중괄호 왼쪽은 객체를 만드는 것이 아니라 <b>이름으로 꺼내는 틀</b>입니다.
  {{pick.1|code}} 라고 적으면 {{pick.3|code}} 의 같은 이름 속성을 찾아 담습니다.
payoff: >-
  <code>{{pick.3}}.{{pick.1}}</code>{{pick.1|josa:을,를}} 여러 줄에서 되풀이하는 대신 한 줄에서 이름을 만들어 둡니다.
  <b>무엇을 쓰는지</b>가 파일 위쪽에 모여요.
bridge: >-
  이름을 바꾸고 싶으면 <code>{ 원래이름: 새이름 }</code> 처럼 콜론을 씁니다. 왼쪽이 속성 이름,
  오른쪽이 새로 생기는 이름이에요.
misconceptions:
  - "왼쪽 중괄호가 새 객체를 만든다 — 아니요. 이름으로 꺼내는 틀입니다."
  - "적은 이름이 없으면 그 자리에서 멈춘다 — <code>undefined</code> 가 담기고 계속 갑니다."

point:
  - q: "{{site.line}}행에서 <b>꺼내지는 쪽</b>, 즉 속성을 내주는 값을 짚어 보세요."
    hint: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
    answer: pick.3
    diag:
      pick.1:
        t: "{{pick.1|code}}{{pick.1|josa:은,는}} <b>새로 생기는 이름</b>입니다. 같은 글자가 속성 이름이기도 해서 헷갈리지만, 값을 내주는 쪽은 등호 오른쪽이에요."
        edge:
          h: "가장 날카로운 자리 — 같은 글자, 다른 역할"
          code:
            - "const { a } = o   // o 가 내주고, a 가 생긴다"
            - "const o = { a }   // a 가 내주고, o 가 생긴다"
      pick.2:
        t: "{{pick.2|code}} 또한 새로 생기는 이름 쪽입니다. 중괄호 안은 전부 받는 쪽이고, 내주는 쪽은 등호 하나 건너에 있어요."
        edge:
          h: "가장 날카로운 자리 — 등호를 기준으로"
          code:
            - "const { a, b } = o   // 받는 쪽: a, b"
            - "const { a, b } = o   // 내주는 쪽: o"

meaning:
  - q: "{{pick.3|code}} 에 {{pick.1|code}} 라는 속성이 없다면 {{site.line}}행은 어떻게 될까요?"
    hint: "없는 속성을 읽는 일과, 없는 값에서 읽는 일은 다르다."
    options:
      - t: "{{pick.1|code}} 에 <code>undefined</code> 가 담기고 계속 간다"
      - t: "TypeError 로 멈춘다"
        diag:
          t: "{{pick.3|code}} 자체가 <code>undefined</code> 나 <code>null</code> 이었다면 그 말이 맞습니다. 값은 있는데 그 안에 이름이 없는 경우라면 <code>undefined</code> 가 담길 뿐이에요."
          edge:
            h: "가장 날카로운 자리 — 없는 속성과 없는 값"
            code:
              - "const { a } = {}          // a 는 undefined"
              - "const { a } = undefined   // TypeError"
      - t: "그 이름이 아예 만들어지지 않는다"
        diag:
          t: "이름은 <b>적은 대로 만들어집니다</b>. 속성이 없으면 담기는 값이 <code>undefined</code> 일 뿐, 그 이름은 그 아래에서 쓸 수 있어요."
          edge:
            h: "가장 날카로운 자리 — 이름은 생긴다"
            code:
              - "const { a } = {}   // a 라는 이름은 있다"
              - "a                  // undefined"
      - t: "<code>null</code> 이 담긴다"
        diag:
          t: "찾지 못했을 때 담기는 값은 <code>null</code> 이 아니라 <code>undefined</code> 입니다. <code>null</code> 은 누군가 <b>일부러 넣어 둔</b> 값이에요."
          edge:
            h: "가장 날카로운 자리 — 없음 둘의 차이"
            code:
              - "const { a } = {}           // undefined"
              - "const { a } = { a: null }  // null"

queries:
  - { grammars: [typescript, tsx, javascript], file: ./object-destructuring.scm }

examples:
  - code: "const { data, error } = useQuery()"
    expect:
      sites: 1
      form: declarator
      picks: { 1: "data", 2: "error", 3: "useQuery()" }
      ctx: { pattern: "{ data, error }" }
  - code: "const { id } = props"
    expect: { sites: 1, picks: { 1: "id", 3: "props" } }
  - code: "const [a] = xs"
    expect: none
