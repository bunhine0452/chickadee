schema: 1
id: ts/array-method-chain
universal: common/map-transform
name: { ko: "배열 메서드 체인", en: "Array method chain" }
token: ".map().filter()"
grammars: [typescript, tsx, javascript]
framework: null
essential: true
difficulty: 3
prereq: [ts/array-map-immutable, ts/array-filter, ts/property-access]
confusions: [ts/for-of, ts/array-foreach]

dict:
  one_liner: "앞 단계가 돌려준 배열에 다음 단계를 이어 붙이는 표기. 왼쪽부터 차례로 흐른다."
  why: >-
    한 줄에 여러 단계가 붙어 있으면 어디서부터 읽어야 할지 헷갈립니다. 규칙은 하나예요 —
    <b>왼쪽부터</b>입니다. {{site.line}}행은 {{pick.3|code}} 에서 시작해
    {{pick.1|code}}{{pick.1|josa:을,를}} 거친 결과에 {{pick.2|code}}{{pick.2|josa:이,가}} 다시 붙습니다.
  trace:
    - "{{pick.3|code}} 에 {{pick.1|code}}{{pick.1|josa:이,가}} 먼저 돌아 새 배열을 만든다."
    - "그 새 배열에 {{pick.2|code}}{{pick.2|josa:이,가}} 붙어 다시 새 배열을 만든다."
    - "{{site.line}}행의 값은 <b>마지막 단계</b>가 돌려준 것이다."

rule: "<b>체인은 왼쪽부터 흐른다.</b> 각 단계는 앞 단계의 결과만 보고, 원본은 어느 단계도 건드리지 않는다."
result:
  label: "{{site.line}}행의 값"
  value: "{{pick.2}}{{pick.2|josa:이,가}} 돌려준 것"
  note: "{{pick.3}}{{pick.3|josa:은,는}} 그대로"
ok: >-
  체인의 각 단계는 <b>앞 단계가 돌려준 값</b>에 붙습니다. 순서를 바꾸면 결과가 달라지는 이유가
  이것이고, 원본은 어느 단계에서도 바뀌지 않아요.
payoff: "「무엇을 고르고 무엇으로 바꾸는가」가 한 줄에 순서대로 남습니다 — 중간 변수를 만들지 않아도 읽힙니다."
bridge: "{{pick.1|code}}{{pick.1|josa:이,가}} 배열을 돌려주기 때문에 그 뒤에 {{pick.2|code}}{{pick.2|josa:을,를}} 붙일 수 있습니다."
misconceptions:
  - "오른쪽부터 읽는다 — 왼쪽부터입니다. 점은 「그 결과에 이어서」라는 뜻이에요."
  - "단계 순서를 바꿔도 결과가 같다 — 고른 뒤 바꾸는 것과 바꾼 뒤 고르는 것은 다릅니다."

point:
  - q: "{{site.line}}행에서 <b>가장 먼저 도는 단계</b>를 짚어 보세요."
    hint: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
    answer: pick.1
    diag:
      pick.2:
        t: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>마지막</b> 단계입니다. 이 단계가 보는 것은 원본이 아니라 앞 단계가 이미 돌려준 배열이에요."
        edge:
          h: "가장 날카로운 자리 — 무엇을 보고 도는가"
          code:
            - "{{pick.3}}.{{pick.1}}(f).{{pick.2}}(g)   // g 는 f 의 결과를 본다"
            - "{{pick.3}}.{{pick.2}}(g)                 // g 가 원본을 본다"
      pick.3:
        t: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>재료</b>입니다. 단계가 아니라 첫 단계가 받아 가는 값이에요."
        edge:
          h: "가장 날카로운 자리 — 재료와 단계"
          code:
            - "{{pick.3}}.{{pick.1}}(f)   // 여기서 첫 단계가 돈다"
            - "{{pick.3}}                 // 아직 아무 단계도 돌지 않았다"

meaning:
  - q: "{{pick.2|code}} 에 넘긴 함수가 보는 값은 무엇일까요?"
    hint: "체인은 왼쪽부터 흐릅니다."
    options:
      - t: "{{pick.1|code}}{{pick.1|josa:이,가}} 돌려준 배열의 항목"
      - t: "{{pick.3|code}} 의 항목 그대로"
        diag:
          t: "원본을 보는 것은 <b>첫 단계</b>뿐입니다. 뒤 단계는 앞 단계가 이미 고르고 바꾼 결과를 받아요."
          edge:
            h: "가장 날카로운 자리 — 몇 번째 단계인가"
            code:
              - "[1,2,3].filter((n) => n > 1).map((n) => n * 10)   // [20, 30]"
              - "[1,2,3].map((n) => n * 10)                        // [10, 20, 30]"
      - t: "두 단계가 동시에 본 값"
        diag:
          t: "두 단계가 한 번에 도는 것이 아니라 <b>앞 단계가 끝난 뒤</b> 뒤 단계가 돕니다. 중간 배열이 한 번 만들어져요."
          edge:
            h: "가장 날카로운 자리 — 순서대로 돈다"
            code:
              - "const mid = xs.filter(f)   // 먼저 여기까지"
              - "const out = mid.map(g)     // 그다음 여기"
      - t: "원본이 아니라 원본의 복사본"
        diag:
          t: "앞 단계가 <b>내용까지 같은 복사본</b>을 넘기는 건 아닙니다. 고르거나 바꾼 뒤의 배열이라 항목 수나 값이 달라져 있어요."
          edge:
            h: "가장 날카로운 자리 — 복사냐 결과냐"
            code:
              - "[1,2,3].filter((n) => n > 2)   // [3]  (복사본이 아니다)"
              - "[...[1,2,3]]                   // [1,2,3]  (복사본)"

queries:
  - { grammars: [typescript, tsx, javascript], file: ./array-method-chain.scm }

examples:
  - code: "const top = users.filter((u) => u.ok).map((u) => u.name)"
    expect: { sites: 1, form: chain, picks: { 1: "filter", 2: "map", 3: "users" } }
  - code: "const ids = rows.map(toId).filter(Boolean)"
    expect: { sites: 1, picks: { 3: "rows" } }
  - code: "const names = users.map((u) => u.name)"
    expect: none
