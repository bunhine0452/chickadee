schema: 1
id: ts/array-filter
universal: common/filter-select
name: { ko: "배열 골라내기(filter)", en: "Selecting items with filter" }
token: "filter"
grammars: [typescript, tsx, javascript]
framework: null
essential: true
difficulty: 2
prereq: [ts/arrow-function, ts/array-basics]
confusions: [ts/array-map-immutable, ts/array-foreach]

dict:
  one_liner: "<code>filter</code> 는 조건이 참인 항목만 남긴 새 배열을 만든다. 길이가 줄 수 있다."
  why: >-
    목록에서 「끝난 것만」 「내 것만」 을 보여 주려면 원본을 지우지 않고 <b>골라낸 새 배열</b>이
    필요합니다. {{site.line}}행의 {{pick.3|code}}{{pick.3|josa:이,가}} 각 항목에 대해 참·거짓을
    내고, 참인 것만 새 배열로 넘어갑니다.
  trace:
    - "{{pick.1|code}} 의 항목 하나를 {{pick.3|code}} 에 넣는다."
    - "돌려준 값이 참 같으면 새 배열에 담고, 거짓 같으면 버린다."
    - "{{site.line}}행의 값은 <b>남은 것만 든 새 배열</b>이고 {{pick.1|code}}{{pick.1|josa:은,는}} 그대로다."

rule: "<b>골라내면 filter, 값을 바꾸면 map.</b> 둘 다 새 배열을 만들고 원본은 건드리지 않는다."
result:
  label: "{{site.line}}행의 값"
  value: "조건이 참인 항목만 든 새 배열"
  note: "길이는 원본보다 짧거나 같다"
ok: >-
  <code>filter</code> 는 콜백이 <b>참을 돌려준 항목만</b> 모아 새 배열을 만듭니다. 항목의 값은
  그대로이고 개수만 줄어요.
payoff: "원본을 지우지 않고도 「이번에 보여 줄 것」을 만들 수 있습니다 — 되돌리기가 공짜입니다."
bridge: "콜백 {{pick.3|code}}{{pick.3|josa:이,가}} 돌려주는 건 <b>참·거짓</b>이지 새 값이 아닙니다."
misconceptions:
  - "<code>filter</code> 가 항목을 바꿔 준다 — 아니요. 남길지 말지만 고릅니다."
  - "조건이 <code>false</code> 여야 남는다 — 반대입니다. <b>참</b>인 것이 남습니다."

point:
  - q: "{{site.line}}행에서 <b>남길지 말지를 정하는 것</b>을 짚어 보세요."
    hint: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
    answer: pick.3
    diag:
      pick.1:
        t: "{{pick.1|code}}{{pick.1|josa:은,는}} <b>고를 대상</b>입니다. 무엇을 남길지는 그 뒤에 넘긴 조건 함수가 정해요."
        edge:
          h: "가장 날카로운 자리 — 대상과 조건"
          code:
            - "{{pick.1}}.filter((x) => x.done)   // 조건이 정한다"
            - "{{pick.1}}                         // 아직 아무것도 고르지 않은 원본"
      pick.2:
        t: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>하는 일의 이름</b>입니다. 어떤 항목이 남을지는 뒤에 넘긴 함수가 참을 돌려주느냐로 갈려요."
        edge:
          h: "가장 날카로운 자리 — 이름과 판단"
          code:
            - "{{pick.1}}.filter((x) => x.ok)    // ok 인 것만"
            - "{{pick.1}}.filter((x) => !x.ok)   // 반대로 고르기"

meaning:
  - q: "{{pick.3|code}}{{pick.3|josa:이,가}} 어느 항목에도 참을 돌려주지 않으면 {{site.line}}행의 값은 무엇일까요?"
    hint: "filter 는 항상 배열을 돌려줍니다."
    options:
      - t: "빈 배열 <code>[]</code>"
      - t: "<code>undefined</code>"
        diag:
          t: "찾은 게 없을 때 <code>undefined</code> 를 내는 건 <code>find</code> 입니다. <code>filter</code> 는 하나도 못 골라도 <b>배열</b>을 돌려줘요."
          edge:
            h: "가장 날카로운 자리 — find 와 filter"
            code:
              - "[1,2].find((n) => n > 9)     // undefined"
              - "[1,2].filter((n) => n > 9)   // []"
      - t: "<code>null</code>"
        diag:
          t: "<code>filter</code> 가 <code>null</code> 을 내는 경우는 없습니다. 결과는 언제나 배열이고, 아무것도 못 고르면 길이 0 입니다."
          edge:
            h: "가장 날카로운 자리 — 결과의 종류는 하나"
            code:
              - "[].filter(Boolean)          // []"
              - "[0, null].filter(Boolean)   // []"
      - t: "원본 배열 그대로"
        diag:
          t: "조건을 <b>모두</b> 통과했다면 길이가 같은 배열이 나옵니다. 하지만 그것도 <b>새 배열</b>이고, 하나도 통과하지 못하면 길이는 0 입니다."
          edge:
            h: "가장 날카로운 자리 — 같은 내용, 다른 배열"
            code:
              - "const a = [1,2]"
              - "a.filter(() => true) === a   // false"

queries:
  - { grammars: [typescript, tsx, javascript], file: ./array-filter.scm }

examples:
  - code: "const open = tasks.filter((t) => !t.done)"
    expect: { sites: 1, form: filter, picks: { 1: "tasks", 2: "filter" } }
  - code: "const mine = list.filter(x => x.owner === me)"
    expect: { sites: 1, picks: { 1: "list" } }
  - code: "const names = users.map((u) => u.name)"
    expect: none
