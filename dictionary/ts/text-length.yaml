schema: 1
id: ts/text-length
universal: null
name: { ko: 글자와 코드 단위, en: Characters and code units }
token: "charCodeAt"
grammars: [typescript, tsx, javascript, vue]
framework: null
essential: true
difficulty: 3
prereq: [ts/string-literal, cs/text-encoding, cs/bit-and-byte]
confusions: [ts/string-literal, ts/array-basics]

dict:
  one_liner:
    ko: "글 하나의 크기를 재는 방법이 셋이고, 셋이 서로 다른 수를 낸다."
    en: "A piece of text can be sized three ways, and the three give three numbers."
  why:
    ko: >-
      사람이 세는 글자 수, 기계가 세는 저장 칸 수, 파일에 들어가는 바이트 수가 다 다릅니다.
      {{site.line}}행의 {{pick.2|code}}{{pick.2|josa:은,는}} 그중 <b>저장 칸</b>을 세는 쪽이라
      이모지 하나가 둘로 세어져요.
    en: >-
      The count a person makes, the count of storage slots the machine makes, and the count of bytes
      in a file are three different numbers. {{pick.2|code}} on line {{site.line}} counts the
      <b>storage slots</b>, so one emoji counts as two.
  trace:
    - ko: "{{pick.1|code}} 의 글은 저장 칸 여러 개에 나뉘어 들어 있다."
      en: "The text in {{pick.1|code}} is spread across several storage slots."
    - ko: "{{site.line}}행의 {{pick.2|code}}{{pick.2|josa:은,는}} 사람이 보는 글자가 아니라 그 칸을 센다."
      en: "{{pick.2|code}} on line {{site.line}} counts those slots, not the characters a person sees."
    - ko: "한글은 칸 하나, 이모지는 칸 둘이라 눈에 보이는 수와 어긋난다."
      en: "A Hangul syllable takes one slot and an emoji takes two, so the number parts from what the eye counts."

rule:
  ko: >-
    <b>세는 단위가 사람의 글자가 아니다.</b> 저장 칸을 세므로 이모지 하나가 둘로 잡힌다.
  en: >-
    <b>The unit counted is not a person's character.</b> It counts storage slots, so one emoji
    counts as two.
result:
  label:
    ko: "{{site.line}}행이 세는 것"
    en: "What line {{site.line}} counts"
  value: "{{pick.1}}.{{pick.2}}"
  note:
    ko: "글자가 아니라 저장 칸"
    en: "storage slots, not characters"
ok:
  ko: >-
    {{pick.1|code}} 의 글을 <b>저장 칸 단위</b>로 다루는 자리입니다. 한글 한 자는 칸 하나,
    이모지 하나는 칸 둘이에요.
  en: >-
    This is where the text in {{pick.1|code}} is handled <b>by storage slot</b>. One Hangul syllable
    is one slot; one emoji is two.
payoff:
  ko: >-
    입력칸 글자 수 제한이 이 자리에서 갈립니다 — 이모지를 쓴 사람만 절반에서 막히는 버그가
    여기서 나와요.
  en: >-
    Input limits part ways here — the bug where only people who type an emoji get cut off halfway
    comes from this.
bridge:
  ko: >-
    파일에 저장될 때는 또 다른 수가 됩니다. 한글 한 자는 칸 하나지만 바이트로는 셋이에요.
  en: >-
    Saved to a file it becomes yet another number: one Hangul syllable is one slot but three bytes.
misconceptions:
  - ko: "세어진 수가 곧 글자 수다 — 이모지·결합 문자에서 어긋납니다."
    en: "The number counted is the number of characters — it parts on emoji and combining marks."
  - ko: "한글은 자리를 많이 먹는다 — 저장 칸으로는 하나입니다. 바이트로 셋일 뿐이에요."
    en: "Hangul takes many slots — it takes one storage slot. It is three bytes, which is another count."

point:
  - q:
      ko: "{{site.line}}행에서 <b>글을 저장 칸 단위로 다루는 이름</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the name that handles the text by storage slot</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.2
    diag:
      pick.1:
        t:
          ko: "{{pick.1|code}}{{pick.1|josa:은,는}} 세어지는 <b>글</b>입니다. 글은 스스로 세지 못하고, 세는 단위는 오른쪽 이름이 정해요."
          en: >-
            {{pick.1|code}} is the <b>text</b> being counted. Text cannot count itself; the unit is
            fixed by the name on the right.
        edge:
          h:
            ko: "가장 날카로운 자리 — 같은 글, 다른 수"
            en: "The sharpest spot — same text, different number"
          code:
            - "'👍'.length          // 2"
            - "[...'👍'].length     // 1"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 안쪽 이름을 꺼내는 <b>표시</b>입니다. 무엇을 어떻게 세는지는 그 오른쪽이 말해요."
          en: >-
            {{pick.3|code}} is the <b>mark</b> that reaches inside. What is counted, and how, is said
            on its right.
        edge:
          h:
            ko: "가장 날카로운 자리 — 꺼내는 표시와 세는 이름"
            en: "The sharpest spot — the reaching mark or the counting name"
          code:
            - "'가'.length"
            - "'가'.charCodeAt(0)"

meaning:
  - q:
      ko: "<code>'👍'</code> 와 <code>'가'</code> 를 각각 세면 어떤 수가 나올까요?"
      en: "Count <code>'👍'</code> and <code>'가'</code> each — what numbers come out?"
    hint:
      ko: "세는 단위는 사람이 보는 글자가 아니라 저장 칸입니다."
      en: "The unit is a storage slot, not the character a person sees."
    options:
      - t:
          ko: "<code>2</code> 와 <code>1</code> — 이모지만 칸 둘이다"
          en: "<code>2</code> and <code>1</code> — only the emoji takes two slots"
      - t:
          ko: "둘 다 <code>1</code>"
          en: "Both are <code>1</code>"
        diag:
          t:
            ko: "사람이 보는 글자로 세면 그 말이 맞습니다. 저장 칸으로 세면 이 이모지는 칸 둘을 차지해요."
            en: >-
              Counted as characters a person sees, that holds. Counted as storage slots this emoji
              takes two.
          edge:
            h:
              ko: "가장 날카로운 자리 — 무엇을 세는가"
              en: "The sharpest spot — what is being counted"
            code:
              - "'👍'.length        // 2"
              - "'가'.length        // 1"
      - t:
          ko: "<code>2</code> 와 <code>3</code> — 한글은 바이트가 셋이라"
          en: "<code>2</code> and <code>3</code> — Hangul is three bytes"
        diag:
          t:
            ko: "바이트로 세면 셋이 맞습니다. 여기서 세는 단위는 바이트가 아니라 저장 칸이고, 한글은 칸 하나예요."
            en: >-
              Counted in bytes it is three. The unit here is a storage slot, not a byte, and Hangul
              takes one slot.
          edge:
            h:
              ko: "가장 날카로운 자리 — 칸과 바이트"
              en: "The sharpest spot — slots or bytes"
            code:
              - "'가'.length                                 // 1"
              - "new TextEncoder().encode('가').length       // 3"
      - t:
          ko: "둘 다 <code>2</code>"
          en: "Both are <code>2</code>"
        diag:
          t:
            ko: "칸 둘을 먹는 것은 아주 큰 번호를 받은 글자뿐입니다. 한글은 그 범위 안이라 칸 하나예요."
            en: >-
              Two slots are taken only by characters with very high numbers. Hangul sits inside the
              lower range, so it is one slot.
          edge:
            h:
              ko: "가장 날카로운 자리 — 번호의 범위"
              en: "The sharpest spot — the range of the number"
            code:
              - "'가'.codePointAt(0)     // 44032"
              - "'👍'.codePointAt(0)     // 128077"

no_hole_reason: >-
  세는 일을 하는 것은 이름 하나이고, 지우면 표준 라이브러리 이름을 외웠는지 묻는 물음이 된다.
  이 개념이 재는 것은 이름이 아니라 「같은 글에서 세 수가 나온다」이고 그것은 값으로 물어야 한다.

why_gate:
  q:
    ko: "{{site.line}}행은 왜 글을 저장 칸 단위로 다룰까요?"
    en: "Why does line {{site.line}} handle the text by storage slot?"
  choices:
    - t:
        ko: "기계가 글을 그렇게 담고 있어서 — 사람이 보는 글자와는 단위가 다르다"
        en: "Because that is how the machine holds text — a different unit from the character a person sees"
      ok: true
      fb:
        ko: "그 방향입니다. 그 차이가 화면에 드러나는 경우(이모지·결합 문자)도 적어 보세요."
        en: "That is the direction. Add the cases where the gap shows on screen — emoji, combining marks."
    - t:
        ko: "그게 가장 빠른 방법이라서"
        en: "Because it is the fastest way"
      ok: false
      fb:
        ko: "속도로 고른 것이 아닙니다. 기계가 처음부터 그 단위로 담고 있어서 그 수가 나오는 것입니다."
        en: >-
          It was not chosen for speed. That number comes out because the machine holds text in that
          unit to begin with.
    - t:
        ko: "글자 수를 정확히 세려고"
        en: "To count characters exactly"
      ok: false
      fb:
        ko: "오히려 그 반대입니다 — 사람이 세는 글자 수와 어긋나는 자리가 바로 여기입니다."
        en: "It is the other way round — this is the very place the count parts from a person's."

queries:
  - { grammars: [typescript, tsx, javascript, vue], file: ./text-length.scm }

examples:
  - code: "const code = key.charCodeAt(0)"
    expect: { sites: 1, form: unit, picks: { 1: "key", 2: "charCodeAt", 3: "(0)" } }
  - code: "const same = a.localeCompare(b)"
    expect: { sites: 1, form: unit, picks: { 1: "a", 2: "localeCompare", 3: "(b)" } }
  - code: "const n = '가나다'.length"
    expect: { sites: 1, form: literal-length, picks: { 1: "'가나다'", 2: "length", 3: "." } }
  - code: "const n = items.length"
    expect: none
  - code: "const up = name.toUpperCase()"
    expect: none
