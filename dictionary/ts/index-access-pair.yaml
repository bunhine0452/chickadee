schema: 1
id: ts/index-access-pair
universal: null
name: { ko: 인덱스로 하나씩 꺼내기, en: "Reading by index" }
token: "[0]"
grammars: [typescript, tsx, javascript, vue]
framework: null
essential: false
difficulty: 2
prereq: [ts/array-basics, ts/const-declaration]
confusions: [ts/array-destructuring]

dict:
  one_liner:
    ko: "<code>xs[0]</code>·<code>xs[1]</code> 로 자리를 하나씩 꺼내 이름을 붙인다."
    en: "<code>xs[0]</code>, <code>xs[1]</code> — take one slot at a time and name it."
  why:
    ko: >-
      잘 도는 코드입니다. 다만 자리 번호가 줄마다 흩어져서, 이 배열에서 <b>몇 개를 쓰는지</b> 알려면
      아래를 계속 읽어야 해요. {{pick.2|code}}{{pick.2|josa:을,를}} 두 번 적는 것도 이 표기의 값입니다 —
      이름이 바뀌면 두 줄을 다 고쳐야 하죠.
    en: >-
      This code works. It is only that the slot numbers scatter line by line, so to know <b>how
      many</b> of this array are used you have to keep reading down. Writing {{pick.2|code}} twice
      is part of the price too — rename it and both lines have to change.
  trace:
    - ko: "{{pick.2|code}}{{pick.2|josa:을,를}} 읽고 {{pick.3|code}} 번 자리의 값을 꺼내 {{pick.1|code}} 라 부른다."
      en: >-
        {{pick.2|code}} is read and the value at slot {{pick.3|code}} is taken out and called
        {{pick.1|code}}.
    - ko: "다음 줄이 같은 배열을 다시 읽어 {{ctx.index|code}} 번 자리를 {{ctx.next|code}} 라 부른다."
      en: >-
        The next line reads the same array again and calls slot {{ctx.index|code}} by the name
        {{ctx.next|code}}.
    - ko: "{{site.line}}행부터 두 줄이 하는 일은 한 줄로도 쓸 수 있다 — <code>const [{{pick.1}}, {{ctx.next}}] = {{pick.2}}</code>."
      en: >-
        What those two lines from {{site.line}} do can be written as one — <code>const [{{pick.1}},
        {{ctx.next}}] = {{pick.2}}</code>.

rule:
  ko: "<b>자리 번호가 두 줄에 흩어지면 배열 구조분해가 한 줄로 모을 수 있다.</b>"
  en: "<b>When slot numbers scatter across two lines, array destructuring can gather them into one.</b>"
result:
  label:
    ko: "{{pick.2|code}}{{pick.2|josa:을,를}} 읽는 횟수"
    en: "How many times {{pick.2|code}} is read"
  value: "두 번"
  note:
    ko: "구조분해로 쓰면 한 번"
    en: "written as destructuring, once"
ok:
  ko: >-
    <code>[{{pick.3}}]</code> 은 자리 번호로 값을 꺼냅니다. 같은 배열에서 자리를 여럿 꺼낼 때는
    <code>const [{{pick.1}}, {{ctx.next}}] = {{pick.2}}</code> 처럼 모으면 배열을 한 번만 읽고
    이름도 한 줄에서 보여요.
  en: >-
    <code>[{{pick.3}}]</code> takes a value out by slot number. When you take several slots from the
    same array, gathering them as <code>const [{{pick.1}}, {{ctx.next}}] = {{pick.2}}</code> reads
    the array once and shows the names on one line.
payoff:
  ko: >-
    자리 번호를 세는 일이 한 줄로 모이면, 뒤에 <code>[2]</code> 가 더 붙었을 때도 그 줄만 보면 됩니다.
  en: >-
    Once the slot counting is gathered into one line, adding a <code>[2]</code> later means looking
    at that line only.
bridge:
  ko: >-
    대괄호는 두 곳에서 다르게 읽힙니다 — 등호 <b>오른쪽</b>이면 자리를 꺼내는 일이고,
    <b>왼쪽</b>이면 자리에 이름을 붙이는 틀이에요.
  en: >-
    Square brackets read differently in two places — on the <b>right</b> of the equals sign they
    take a slot out, on the <b>left</b> they are a frame for naming slots.
misconceptions:
  - ko: "구조분해는 배열 전체를 복사한다 — 아니요. 자리를 읽는 것은 똑같습니다."
    en: "Destructuring copies the whole array — no. It reads slots exactly the same way."
  - ko: "번호로 꺼내는 편이 더 빠르다 — 하는 일이 같아 차이는 재기 어렵습니다."
    en: "Taking by number is faster — they do the same work, so the difference is hard to measure."

point:
  - q:
      ko: "{{site.line}}행에서 <b>어느 자리를 꺼낼지</b> 정하는 부분을 짚어 보세요."
      en: "On line {{site.line}}, point at the part that decides <b>which slot is taken</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.3
    diag:
      pick.1:
        t:
          ko: "{{pick.1|code}}{{pick.1|josa:은,는}} <b>새로 생기는 이름</b>입니다. 마음대로 지어도 되는 쪽이라, 어느 자리를 꺼낼지에는 영향이 없어요."
          en: >-
            {{pick.1|code}} is <b>the name being created</b>. It is the side you are free to choose,
            so it has no bearing on which slot is taken.
        edge:
          h:
            ko: "가장 날카로운 자리 — 이름과 자리"
            en: "The sharpest spot — the name and the slot"
          code:
            - "const first = xs[0]   // 이름을 바꿔도 꺼내는 자리는 0"
            - "const head = xs[0]"
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>꺼내지는 묶음</b>입니다. 어느 자리인지는 그 뒤 대괄호 안의 숫자가 정합니다."
          en: >-
            {{pick.2|code}} is <b>the group being taken from</b>. Which slot it is comes from the
            number in the brackets after it.
        edge:
          h:
            ko: "가장 날카로운 자리 — 묶음과 자리"
            en: "The sharpest spot — the group and the slot"
          code:
            - "xs[0]   // 같은 xs, 다른 자리"
            - "xs[1]"

meaning:
  - q:
      ko: "{{site.line}}행과 다음 줄을 <code>const [{{pick.1}}, {{ctx.next}}] = {{pick.2}}</code> 처럼 한 줄로 바꾸면 무엇이 달라질까요?"
      en: >-
        If you turn line {{site.line}} and the next into one line, <code>const [{{pick.1}},
        {{ctx.next}}] = {{pick.2}}</code>, what changes?
    hint:
      ko: "하는 일과, 읽는 사람이 보는 것을 나눠 생각해 보세요."
      en: "Think about what it does and what the reader sees, separately."
    options:
      - t:
          ko: "결과는 같고, {{pick.2|code}} 에서 몇 개를 쓰는지가 한 줄에 모인다"
          en: >-
            The result is the same, and how many of {{pick.2|code}} are used is gathered onto one
            line
      - t:
          ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 두 조각으로 나뉜다"
          en: "{{pick.2|code}} is split into two pieces"
        diag:
          t:
            ko: "구조분해는 <b>읽기만</b> 합니다. 원본은 그대로 있고, 그 값을 가리키는 이름이 둘 생길 뿐이에요."
            en: >-
              Destructuring <b>only reads</b>. The original stays as it was; two names pointing at
              that value simply come into being.
          edge:
            h:
              ko: "가장 날카로운 자리 — 읽기와 나누기"
              en: "The sharpest spot — reading and splitting"
            code:
              - "const [a, b] = xs   // xs 그대로"
              - "xs.splice(0, 2)     // 이때는 xs 가 줄어든다"
      - t:
          ko: "이름이 배열의 내용과 같아야 한다"
          en: "The names have to match the array's contents"
        diag:
          t:
            ko: "대괄호 쪽 이름은 <b>자리</b>로 정해집니다. 무엇이라고 짓든 첫째 이름이 <code>[0]</code>, 둘째 이름이 <code>[1]</code> 이에요."
            en: >-
              The names in the brackets are settled by <b>position</b>. Whatever you call them, the
              first name is <code>[0]</code> and the second is <code>[1]</code>.
          edge:
            h:
              ko: "가장 날카로운 자리 — 이름은 자유"
              en: "The sharpest spot — the names are free"
            code:
              - "const [head, tail] = xs   // xs[0], xs[1]"
              - "const [x, y] = xs         // 같은 자리"
      - t:
          ko: "세 번째 자리부터는 꺼낼 수 없게 된다"
          en: "From the third slot on it can no longer take anything"
        diag:
          t:
            ko: "쉼표를 이어 얼마든지 늘릴 수 있고, 뒤에 <code>...나머지</code> 를 붙여 남은 것을 한꺼번에 받을 수도 있습니다."
            en: >-
              You can keep adding commas as far as you like, and put <code>...rest</code> at the end
              to take everything left in one go.
          edge:
            h:
              ko: "가장 날카로운 자리 — 늘리는 법"
              en: "The sharpest spot — how to extend it"
            code:
              - "const [a, b, c] = xs"
              - "const [a, ...rest] = xs"

queries:
  - { grammars: [typescript, tsx, javascript, vue], file: ./index-access-pair.scm }

examples:
  - code: "const first = parts[0]\nconst second = parts[1]"
    expect:
      sites: 1
      form: pair
      picks: { 1: "first", 2: "parts", 3: "0" }
      ctx: { same: "parts", next: "second", index: "1" }
  - code: "const [a, b] = xs\nconst x = m[0]\nconst y = m[1]"
    expect: { sites: 1, picks: { 2: "m" } }
  - code: "const only = xs[0]"
    expect: none
  - code: "const a = xs[0]\nconst b = ys[1]"
    expect: none
