schema: 1
id: ts/for-of
universal: common/iterate
name: { ko: "for…of 반복", en: "for…of loop" }
token: "for…of"
grammars: [typescript, tsx, javascript]
framework: null
essential: true
difficulty: 2
prereq: [ts/array-basics, ts/const-declaration]
confusions: [ts/array-foreach, ts/array-method-chain]

dict:
  one_liner: "<code>for…of</code> 는 배열의 값을 하나씩 꺼내 몸통을 반복한다."
  why: >-
    인덱스를 세지 않고 <b>값 자체</b>를 받습니다. 그리고 콜백이 아니라 그냥 블록이라
    <code>break</code>·<code>continue</code>·<code>await</code> 가 그대로 통해요.
    {{site.line}}행은 {{pick.2|code}} 에서 값을 꺼내 {{pick.1|code}} 라는 이름으로 씁니다.
  trace:
    - "{{pick.2|code}} 에서 값을 하나 꺼내 {{pick.1|code}} 에 담는다."
    - "{{pick.3|code}} 안을 한 번 실행한다."
    - "꺼낼 값이 없을 때까지 되풀이하고, {{site.line}}행은 값을 남기지 않는다."

rule: "<b><code>for…of</code> 는 값을, <code>for…in</code> 은 키를 준다.</b> 중간에 멈춰야 하면 콜백이 아니라 이쪽이다."
result:
  label: "{{site.line}}행이 하는 일"
  value: "{{pick.2}} 의 값마다 몸통을 한 번씩"
  note: "줄 자체는 값을 남기지 않는다"
ok: >-
  <code>for…of</code> 는 꺼낼 것이 없을 때까지 <b>값을 하나씩</b> 꺼내 몸통을 돌립니다.
  블록 안이라 <code>break</code> 로 멈추고 <code>await</code> 로 기다릴 수 있어요.
payoff: "인덱스 변수도, 콜백도 없이 「이 값들 각각에 대해」를 그대로 씁니다."
bridge: "{{pick.1|code}}{{pick.1|josa:은,는}} 반복마다 <b>새로 만들어지는 이름</b>입니다 — 그래서 <code>const</code> 로 받아도 됩니다."
misconceptions:
  - "<code>for…of</code> 가 인덱스를 준다 — 값을 줍니다. 인덱스가 필요하면 <code>entries()</code> 를 씁니다."
  - "객체에도 그대로 쓸 수 있다 — 일반 객체는 꺼낼 수 없습니다. <code>Object.entries</code> 를 거칩니다."

point:
  - q: "{{site.line}}행에서 <b>반복할 값을 내주는 쪽</b>을 짚어 보세요."
    hint: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
    answer: pick.2
    diag:
      pick.1:
        t: "{{pick.1|code}}{{pick.1|josa:은,는}} <b>꺼낸 값을 받는 이름</b>입니다. 값을 내주는 쪽은 <code>of</code> 뒤에 있어요."
        edge:
          h: "가장 날카로운 자리 — 받는 쪽과 주는 쪽"
          code:
            - "for (const {{pick.1}} of {{pick.2}})   // {{pick.2|josa:이,가}} 내주고 {{pick.1|josa:이,가}} 받는다"
            - "for (const x of xs)                    // 이름은 아무거나"
      pick.3:
        t: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>반복마다 실행되는 몸통</b>입니다. 몇 번 돌지는 <code>of</code> 뒤의 값이 정해요."
        edge:
          h: "가장 날카로운 자리 — 몇 번 도는가"
          code:
            - "for (const x of []) { f(x) }        // 0번"
            - "for (const x of [1,2]) { f(x) }     // 2번"

meaning:
  - q: "{{pick.2|code}}{{pick.2|josa:이,가}} 빈 배열이면 {{site.line}}행은 어떻게 될까요?"
    hint: "꺼낼 값이 없을 때."
    options:
      - t: "몸통을 한 번도 실행하지 않고 지나간다"
      - t: "한 번은 실행된다"
        diag:
          t: "적어도 한 번을 보장하는 건 <code>do…while</code> 입니다. <code>for…of</code> 는 꺼낼 값이 없으면 몸통에 들어가지 않아요."
          edge:
            h: "가장 날카로운 자리 — 먼저 꺼내는가"
            code:
              - "for (const x of []) { f() }   // f 는 안 불린다"
              - "do { f() } while (false)      // f 가 한 번 불린다"
      - t: "그 자리에서 멈춘다"
        diag:
          t: "빈 배열은 <b>꺼낼 것이 없는 정상 상태</b>입니다. 멈추는 것은 <code>null</code> 처럼 꺼낼 수 <b>없는</b> 값일 때예요."
          edge:
            h: "가장 날카로운 자리 — 비었나 없나"
            code:
              - "for (const x of []) {}      // 그냥 지나간다"
              - "for (const x of null) {}    // TypeError"
      - t: "<code>undefined</code> 를 한 번 꺼낸다"
        diag:
          t: "빈 배열에는 항목이 하나도 없습니다. <code>[undefined]</code> 라면 한 번 돌지만, <code>[]</code> 의 길이는 0 이에요."
          edge:
            h: "가장 날카로운 자리 — 길이 0 과 길이 1"
            code:
              - "[].length            // 0"
              - "[undefined].length   // 1"

queries:
  - { grammars: [typescript, tsx, javascript], file: ./for-of.scm }

examples:
  - code: "for (const row of rows) { send(row) }"
    expect: { sites: 1, form: for-of, picks: { 1: "row", 2: "rows" } }
  - code: "for (const [key, value] of Object.entries(map)) { use(key, value) }"
    expect: { sites: 1, picks: { 2: "Object.entries(map)" } }
  - code: "for (const key in obj) { f(key) }"
    expect: none
