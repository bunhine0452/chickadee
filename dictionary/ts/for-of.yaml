schema: 1
id: ts/for-of
universal: common/iterate
name: { ko: "for…of 반복", en: "for…of loop" }
token: "for…of"
grammars: [typescript, tsx, javascript, vue]
framework: null
essential: true
difficulty: 2
prereq: [ts/array-basics, ts/const-declaration]
confusions: [ts/array-foreach, ts/array-method-chain]

dict:
  one_liner:
    ko: "<code>for…of</code> 는 배열의 값을 하나씩 꺼내 몸통을 반복한다."
    en: "<code>for…of</code> takes the array's values one at a time and repeats the body."
  why:
    ko: >-
      인덱스를 세지 않고 <b>값 자체</b>를 받습니다. 그리고 콜백이 아니라 그냥 블록이라
      <code>break</code>·<code>continue</code>·<code>await</code> 가 그대로 통해요.
      {{site.line}}행은 {{pick.2|code}} 에서 값을 꺼내 {{pick.1|code}} 라는 이름으로 씁니다.
    en: >-
      You get <b>the value itself</b> without counting indexes. And because the body is a plain
      block rather than a callback, <code>break</code>, <code>continue</code> and <code>await</code>
      all work as they normally do. Line {{site.line}} takes a value out of {{pick.2|code}} and uses
      it under the name {{pick.1|code}}.
  trace:
    - ko: "{{pick.2|code}} 에서 값을 하나 꺼내 {{pick.1|code}} 에 담는다."
      en: "One value is taken from {{pick.2|code}} and put in {{pick.1|code}}."
    - ko: "{{pick.3|code}} 안을 한 번 실행한다."
      en: "The inside of {{pick.3|code}} runs once."
    - ko: "꺼낼 값이 없을 때까지 되풀이하고, {{site.line}}행은 값을 남기지 않는다."
      en: "This repeats until there is nothing left to take, and line {{site.line}} leaves no value."

rule:
  ko: "<b><code>for…of</code> 는 값을, <code>for…in</code> 은 키를 준다.</b> 중간에 멈춰야 하면 콜백이 아니라 이쪽이다."
  en: >-
    <b><code>for…of</code> gives values, <code>for…in</code> gives keys.</b> When you have to stop
    partway, this is the one, not a callback.
result:
  label:
    ko: "{{site.line}}행이 하는 일"
    en: "What line {{site.line}} does"
  value: "{{pick.2}} 의 값마다 몸통을 한 번씩"
  note:
    ko: "줄 자체는 값을 남기지 않는다"
    en: "the line itself leaves no value"
ok:
  ko: >-
    <code>for…of</code> 는 꺼낼 것이 없을 때까지 <b>값을 하나씩</b> 꺼내 몸통을 돌립니다.
    블록 안이라 <code>break</code> 로 멈추고 <code>await</code> 로 기다릴 수 있어요.
  en: >-
    <code>for…of</code> takes <b>one value at a time</b> until there is nothing left and runs the
    body. Being a block, you can stop with <code>break</code> and wait with <code>await</code>.
payoff:
  ko: "인덱스 변수도, 콜백도 없이 「이 값들 각각에 대해」를 그대로 씁니다."
  en: "You write “for each of these values” as it reads, with no index variable and no callback."
bridge:
  ko: "{{pick.1|code}}{{pick.1|josa:은,는}} 반복마다 <b>새로 만들어지는 이름</b>입니다 — 그래서 <code>const</code> 로 받아도 됩니다."
  en: >-
    {{pick.1|code}} is <b>a name made afresh</b> on each pass — which is why <code>const</code> can
    receive it.
misconceptions:
  - ko: "<code>for…of</code> 가 인덱스를 준다 — 값을 줍니다. 인덱스가 필요하면 <code>entries()</code> 를 씁니다."
    en: >-
      <code>for…of</code> gives the index — it gives the value. If you need the index, use
      <code>entries()</code>.
  - ko: "객체에도 그대로 쓸 수 있다 — 일반 객체는 꺼낼 수 없습니다. <code>Object.entries</code> 를 거칩니다."
    en: >-
      It works on objects as they are — a plain object has nothing to take. You go through
      <code>Object.entries</code>.

point:
  - q:
      ko: "{{site.line}}행에서 <b>반복할 값을 내주는 쪽</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the side that supplies the values to repeat over</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.2
    diag:
      pick.1:
        t:
          ko: "{{pick.1|code}}{{pick.1|josa:은,는}} <b>꺼낸 값을 받는 이름</b>입니다. 값을 내주는 쪽은 <code>of</code> 뒤에 있어요."
          en: >-
            {{pick.1|code}} is <b>the name that receives the value taken out</b>. The side supplying
            the values is after the <code>of</code>.
        edge:
          h:
            ko: "가장 날카로운 자리 — 받는 쪽과 주는 쪽"
            en: "The sharpest spot — the receiver and the supplier"
          code:
            - "for (const {{pick.1}} of {{pick.2}})   // {{pick.2}}{{pick.2|josa:이,가}} 내주고 {{pick.1}}{{pick.1|josa:이,가}} 받는다"
            - "for (const x of xs)                    // 이름은 아무거나"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>반복마다 실행되는 몸통</b>입니다. 몇 번 돌지는 <code>of</code> 뒤의 값이 정해요."
          en: >-
            {{pick.3|code}} is <b>the body that runs on each pass</b>. How many passes there are is
            settled by the value after the <code>of</code>.
        edge:
          h:
            ko: "가장 날카로운 자리 — 몇 번 도는가"
            en: "The sharpest spot — how many passes"
          code:
            - "for (const x of []) { f(x) }        // 0번"
            - "for (const x of [1,2]) { f(x) }     // 2번"

meaning:
  - q:
      ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 빈 배열이면 {{site.line}}행은 어떻게 될까요?"
      en: "If {{pick.2|code}} is an empty array, what does line {{site.line}} do?"
    hint:
      ko: "꺼낼 값이 없을 때."
      en: "When there is nothing left to take."
    options:
      - t:
          ko: "몸통을 한 번도 실행하지 않고 지나간다"
          en: "It passes over without running the body once"
      - t:
          ko: "한 번은 실행된다"
          en: "It runs once"
        diag:
          t:
            ko: "적어도 한 번을 보장하는 건 <code>do…while</code> 입니다. <code>for…of</code> 는 꺼낼 값이 없으면 몸통에 들어가지 않아요."
            en: >-
              Guaranteeing at least one pass is <code>do…while</code>. If <code>for…of</code> has
              nothing to take, it does not enter the body.
          edge:
            h:
              ko: "가장 날카로운 자리 — 먼저 꺼내는가"
              en: "The sharpest spot — does it take first"
            code:
              - "for (const x of []) { f() }   // f 는 안 불린다"
              - "do { f() } while (false)      // f 가 한 번 불린다"
      - t:
          ko: "그 자리에서 멈춘다"
          en: "It stops right there"
        diag:
          t:
            ko: "빈 배열은 <b>꺼낼 것이 없는 정상 상태</b>입니다. 멈추는 것은 <code>null</code> 처럼 꺼낼 수 <b>없는</b> 값일 때예요."
            en: >-
              An empty array is <b>a normal state with nothing to take</b>. What stops it is a value
              there is no way to take from, such as <code>null</code>.
          edge:
            h:
              ko: "가장 날카로운 자리 — 비었나 없나"
              en: "The sharpest spot — empty or absent"
            code:
              - "for (const x of []) {}      // 그냥 지나간다"
              - "for (const x of null) {}    // TypeError"
      - t:
          ko: "<code>undefined</code> 를 한 번 꺼낸다"
          en: "It takes <code>undefined</code> out once"
        diag:
          t:
            ko: "빈 배열에는 항목이 하나도 없습니다. <code>[undefined]</code> 라면 한 번 돌지만, <code>[]</code> 의 길이는 0 이에요."
            en: >-
              An empty array has no items at all. <code>[undefined]</code> would go round once, but
              the length of <code>[]</code> is 0.
          edge:
            h:
              ko: "가장 날카로운 자리 — 길이 0 과 길이 1"
              en: "The sharpest spot — length 0 and length 1"
            code:
              - "[].length            // 0"
              - "[undefined].length   // 1"

# 빈칸형을 못 내는 사유 (D145). 「아직 안 썼다」가 아니라 「이 문법에는 뚫을 구멍이 없다」다.
no_hole_reason: >-
  of 를 지운 자리에 넣을 낱말은 in 하나뿐이라 보기 넷이 안 나온다. in 은 개념으로 없어 진단을 붙일 자리도 없다.

why_gate:
  q:
    ko: "{{site.line}}행은 왜 자리 번호가 아니라 항목으로 돌까요?"
    en: "Why does line {{site.line}} go round by item instead of by index?"
  choices:
    - t:
        ko: "필요한 것이 항목 자체이고, 번호를 안 쓰면 잘못 셀 자리도 없어서"
        en: "Because the item itself is what is needed, and with no index there is nothing to miscount"
      ok: true
      fb:
        ko: "그 방향입니다. 번호가 정말 필요해지는 경우를 하나 떠올려 함께 적어 보세요."
        en: "That is the direction. Add one case where the index would genuinely be needed."
    - t:
        ko: "<code>for…of</code> 가 더 빨라서"
        en: "Because <code>for…of</code> is faster"
      ok: false
      fb:
        ko: "속도 차이는 이 자리에서 따질 만한 크기가 아닙니다. 갈리는 것은 번호를 손으로 다뤄야 하느냐입니다."
        en: "The speed gap is not worth weighing here. What parts ways is whether you handle the index by hand."
    - t:
        ko: "번호로는 배열을 못 돌아서"
        en: "Because an array cannot be walked by index"
      ok: false
      fb:
        ko: "번호로도 돕니다. 다만 시작·끝·증가를 손으로 적어야 해서 어긋날 자리가 셋 늘어납니다."
        en: "It can. You just write the start, the end and the step by hand — three more places to slip."

queries:
  - { grammars: [typescript, tsx, javascript, vue], file: ./for-of.scm }

examples:
  - code: "for (const row of rows) { send(row) }"
    expect: { sites: 1, form: for-of, picks: { 1: "row", 2: "rows" } }
  - code: "for (const [key, value] of Object.entries(map)) { use(key, value) }"
    expect: { sites: 1, picks: { 2: "Object.entries(map)" } }
  - code: "for (const key in obj) { f(key) }"
    expect: none
