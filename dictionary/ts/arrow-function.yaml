schema: 1
id: ts/arrow-function
universal: common/function-value
name: { ko: 화살표 함수, en: Arrow function }
token: "=>"
grammars: [typescript, tsx, javascript]
framework: null
essential: true
difficulty: 2
prereq: [ts/const-declaration, ts/call-expression]
confusions: [ts/call-expression]

dict:
  one_liner: "<code>=></code> 왼쪽은 받을 것, 오른쪽은 돌려줄 것. 함수를 값처럼 쓴다."
  why: >-
    함수를 값으로 쓸 수 있으면 「무엇을 할지」를 다른 함수에 넘길 수 있습니다.
    {{site.line}}행의 화살표 함수는 이름 없이 그 자리에서 만들어져, 부르는 쪽이 정한 때에
    {{pick.1|code}}{{pick.1|josa:을,를}} 받아 돌아갑니다.
  trace:
    - "{{site.line}}행에서는 함수를 <b>만들기만</b> 한다 — 아직 돌지 않는다."
    - "부르는 쪽이 값을 넘기면 그 값이 {{pick.1|code}} 에 들어간다."
    - "{{pick.3|code}}{{pick.3|josa:을,를}} 계산한 값이 그 호출의 결과가 된다."

rule: "<b>몸체가 중괄호면 <code>return</code> 을 써야 하고, 중괄호가 없으면 그 식이 곧 돌려줄 값이다.</b>"
result:
  label: "{{site.line}}행의 값"
  value: "아직 돌지 않은 함수"
  note: "부르는 쪽이 정한 때에 돈다"
ok: >-
  <code>=></code> 왼쪽 {{pick.1|code}}{{pick.1|josa:이,가}} 받을 것이고, 오른쪽 {{pick.3|code}}{{pick.3|josa:이,가}} 돌려줄 것입니다.
  {{site.line}}행은 그 함수를 <b>만들어 두는</b> 자리예요.
payoff: >-
  이 자리에서 함수를 만들 수 있으니 「무엇을 할지」를 인자로 넘길 수 있습니다.
  <code>map</code> 이나 <code>filter</code> 가 그 힘 위에 서 있어요.
bridge: >-
  화살표 함수는 괄호가 붙어야 돕니다 — {{site.line}}행에서 만든 것을 누가 언제 부르는지가
  다음 질문이에요.
misconceptions:
  - "중괄호 몸체에서도 마지막 줄이 저절로 돌아온다 — 아니요. <code>return</code> 을 적어야 합니다."
  - "화살표 함수는 짧게 쓰려고 있는 것이다 — 짧기도 하지만, 바깥 <code>this</code> 를 그대로 쓴다는 점이 더 큽니다."

point:
  - q: "{{site.line}}행에서 <b>받을 것과 돌려줄 것을 가르는 기호</b>를 짚어 보세요."
    hint: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
    answer: pick.2
    diag:
      pick.1:
        t: "{{pick.1|code}}{{pick.1|josa:은,는}} <b>받을 자리</b>입니다. 아직 값이 없는 빈 이름이고, 부르는 쪽이 넘겨줄 때 채워져요."
        edge:
          h: "가장 날카로운 자리 — 받을 자리와 가르는 기호"
          code:
            - "(n) => n * 2      // n 은 받을 자리"
            - "double(3)         // 그때 n 이 3 이 된다"
      pick.3:
        t: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>돌려줄 값</b>입니다. 이 식이 함수의 결과가 되지만, 받을 것과 돌려줄 것을 가르는 일은 앞의 <code>=></code> 가 합니다."
        edge:
          h: "가장 날카로운 자리 — 중괄호가 있느냐"
          code:
            - "(n) => n * 2            // 이 식이 결과"
            - "(n) => { return n * 2 } // 중괄호면 return 을 적는다"

meaning:
  - q: "{{site.line}}행이 실행되는 순간 {{pick.3|code}}{{pick.3|josa:은,는}} 계산될까요?"
    hint: "함수를 만드는 것과 함수를 돌리는 것은 다른 일입니다."
    options:
      - t: "계산되지 않는다 — 함수를 <b>만들어</b> 둘 뿐이고, 누가 부를 때 계산된다"
      - t: "곧바로 계산된다"
        diag:
          t: "<code>=></code> 없이 식만 적었다면 그 말이 맞습니다. 화살표가 붙는 순간 그 식은 「나중에 할 일」로 싸여요."
          edge:
            h: "가장 날카로운 자리 — 화살표가 있느냐"
            code:
              - "const a = n * 2         // 지금 계산"
              - "const b = () => n * 2   // 부를 때 계산"
      - t: "한 번만 계산되고 그 값이 기억된다"
        diag:
          t: "값을 기억해 두는 것은 별도의 장치가 있어야 합니다. 화살표 함수는 부를 때마다 몸체를 다시 계산해요."
          edge:
            h: "가장 날카로운 자리 — 부를 때마다 새로"
            code:
              - "const r = () => Math.random()"
              - "r() === r()   // 대개 false"
      - t: "<code>undefined</code> 가 된다"
        diag:
          t: "<code>undefined</code> 는 함수를 <b>돌린 뒤</b> 돌려줄 것이 없을 때 나옵니다. 만들기만 한 함수는 그 자체가 값이에요."
          edge:
            h: "가장 날카로운 자리 — 만든 것과 돌린 것"
            code:
              - "const f = () => {}   // 함수"
              - "const v = f()        // undefined"

queries:
  - { grammars: [typescript, tsx, javascript], file: ./arrow-function.scm }

examples:
  - code: "const double = (n) => n * 2"
    expect: { sites: 1, form: parens, picks: { 1: "(n)", 2: "=>", 3: "n * 2" } }
  - code: "const names = users.map(u => u.name)"
    expect: { sites: 1, form: bare, picks: { 1: "u", 3: "u.name" } }
  - code: "function double(n) { return n * 2 }"
    expect: none
