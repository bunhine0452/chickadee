schema: 1
id: ts/value-bits
universal: null
name: { ko: 값과 비트, en: Values and bits }
token: "<<"
grammars: [typescript, tsx, javascript, vue]
framework: null
essential: true
difficulty: 2
prereq: [ts/number-literal, cs/binary-representation, cs/bit-and-byte, cs/type]
# 빈칸 오답 셋이 이 셋의 토큰이다 (`&&` · `||` · `??`) — 전부 「두 값 사이에 놓이는 기호」다.
confusions: [ts/logical-and-guard, ts/logical-or-default, ts/nullish-coalescing]

dict:
  one_liner:
    ko: "모든 값은 켜짐·꺼짐의 묶음이다. 그 묶음을 직접 만지는 자리가 따로 있다."
    en: "Every value is a bundle of on and off, and one place touches those bits."
  why:
    ko: >-
      숫자든 글자든 기계 안에서는 켜짐·꺼짐의 줄입니다. 평소에는 그 줄을 안 봐도 되지만
      {{site.line}}행처럼 {{pick.1|code}}{{pick.1|josa:을,를}} 쓰면 그 줄을 <b>한 칸씩</b> 만지게 돼요 —
      그리고 자바스크립트는 이때만 수를 32비트로 잘라 씁니다.
    en: >-
      A number or a piece of text is a row of on-and-off inside the machine. Most of the time you
      need not look at that row, but on line {{site.line}} {{pick.1|code}} touches it one slot at a
      time — and this is the only place JavaScript cuts a number down to 32 bits.
  trace:
    - ko: "{{pick.2|code}}{{pick.2|josa:과,와}} {{pick.3|code}}{{pick.3|josa:을,를}} 각각 비트 줄로 편다."
      en: "{{pick.2|code}} and {{pick.3|code}} are each laid out as a row of bits."
    - ko: "{{site.line}}행의 {{pick.1|code}}{{pick.1|josa:이,가}} 그 줄을 자리마다 견주거나 밀어낸다."
      en: "{{pick.1|code}} on line {{site.line}} weighs or shifts that row slot by slot."
    - ko: "남은 줄을 다시 수로 읽는다 — 32비트를 넘어간 자리는 버려진다."
      en: "The row that is left is read back as a number — anything past 32 bits is dropped."

rule:
  ko: >-
    <b>비트 연산은 수를 32비트로 잘라서 한다.</b> 64비트로 잘 살던 값이 이 한 줄에서만
    폭이 바뀐다.
  en: >-
    <b>Bitwise work cuts the number down to 32 bits.</b> A value that lived fine in 64 bits changes
    width on this one line.
result:
  label:
    ko: "{{site.line}}행이 내놓는 것"
    en: "What line {{site.line}} yields"
  value: "{{pick.2}} {{pick.1}} {{pick.3}}"
  note:
    ko: "32비트로 읽은 수"
    en: "a number read as 32 bits"
ok:
  ko: >-
    {{pick.1|code}}{{pick.1|josa:은,는}} 두 값을 <b>비트 자리마다</b> 다룹니다. 결과도 수이고,
    양쪽 값은 그대로 남아요.
  en: >-
    {{pick.1|code}} works on the two values <b>one bit slot at a time</b>. The result is a number
    too, and both sides are left as they were.
payoff:
  ko: >-
    플래그를 한 수에 여러 개 담거나 2로 빠르게 나누는 코드가 이 자리에서 나옵니다.
    대신 폭이 32비트라 큰 수를 넣으면 조용히 어긋나요.
  en: >-
    Packing several flags into one number, or halving fast, comes from here. The price is the
    32-bit width — put a big number in and it quietly goes off.
bridge:
  ko: >-
    자바스크립트의 수는 원래 64비트 부동소수 하나뿐입니다. 그 한 종류가 여기서만
    다른 폭으로 읽히는 것이라 두 사실을 같이 알아야 해요.
  en: >-
    A JavaScript number is one thing: a 64-bit float. Only here is that single kind read at a
    different width, so the two facts have to be held together.
misconceptions:
  - ko: "논리 연산과 같은 기호다 — 기호를 하나 더 붙이면 참·거짓을 묶는 다른 일이 됩니다."
    en: >-
      It is the same symbol as the logical one — double the symbol and it becomes a different job
      that joins true-or-false.
  - ko: "수의 폭은 늘 같다 — 비트 연산 한 줄에서만 32비트로 내려앉습니다."
    en: "A number always has the same width — only a bitwise line drops it to 32 bits."

point:
  - q:
      ko: "{{site.line}}행에서 <b>두 값을 비트 자리마다 다루는 기호</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the symbol that works on the values bit by bit</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 다뤄지는 <b>값</b>입니다. 값은 스스로 비트를 밀지 못하고, 미는 일은 가운데 기호가 합니다."
          en: >-
            {{pick.2|code}} is one of the <b>values</b> being worked on. A value cannot shift its own
            bits; the symbol between them does that.
        edge:
          h:
            ko: "가장 날카로운 자리 — 값만으로는 아무 일도 안 난다"
            en: "The sharpest spot — a value alone does nothing"
          code:
            - "n          // 수 하나일 뿐이다"
            - "n << 1     // 비트가 한 칸 밀린다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>얼마나</b>를 정하는 쪽입니다. 자리를 몇 칸 미느냐를 말할 뿐 미는 일 자체는 아니에요."
          en: >-
            {{pick.3|code}} says <b>how much</b>. It names how many slots to move; it is not the
            moving itself.
        edge:
          h:
            ko: "가장 날카로운 자리 — 몇 칸이냐와 무엇을 하느냐"
            en: "The sharpest spot — how many slots, or what is done"
          code:
            - "n << 1     // 한 칸"
            - "n << 3     // 세 칸, 하는 일은 같다"

meaning:
  - q:
      ko: "<code>1 &lt;&lt; 31</code> 의 값은 어떻게 될까요?"
      en: "What does <code>1 &lt;&lt; 31</code> come out as?"
    hint:
      ko: "비트 연산은 수를 <b>32비트</b>로 잘라서 합니다."
      en: "Bitwise work cuts the number to <b>32 bits</b>."
    options:
      - t:
          ko: "음수가 된다 — 맨 앞자리가 부호 자리라서"
          en: "It goes negative — the top slot is the sign slot"
      - t:
          ko: "2의 31제곱, 양수 그대로"
          en: "Two to the thirty-first, still positive"
        diag:
          t:
            ko: "곱하기로 읽으면 그 값이 맞습니다. 비트 연산은 32비트 안에서만 도는데, 맨 앞자리는 크기가 아니라 <b>부호</b>를 뜻해요."
            en: >-
              Read as multiplication that value holds. Bitwise work stays inside 32 bits, and the top
              slot means <b>sign</b>, not size.
          edge:
            h:
              ko: "가장 날카로운 자리 — 한 칸 차이로 부호가 바뀐다"
              en: "The sharpest spot — one slot flips the sign"
            code:
              - "1 << 30   // 1073741824"
              - "1 << 31   // -2147483648"
      - t:
          ko: "너무 커서 <code>Infinity</code> 가 된다"
          en: "It is too big and becomes <code>Infinity</code>"
        diag:
          t:
            ko: "보통의 곱셈이라면 아주 큰 수에서 그 일이 일어납니다. 비트 연산은 넘치는 대신 <b>32비트 밖을 버려요</b>."
            en: >-
              With ordinary multiplication that happens for very large numbers. Bitwise work does not
              overflow that way — it <b>drops whatever is past 32 bits</b>.
          edge:
            h:
              ko: "가장 날카로운 자리 — 넘치는가 잘리는가"
              en: "The sharpest spot — overflow or truncation"
            code:
              - "2 ** 1024   // Infinity"
              - "1 << 31     // -2147483648"
      - t:
          ko: "읽지 못하고 멈춘다"
          en: "It cannot be read and stops"
        diag:
          t:
            ko: "멈추지 않습니다. 값이 조용히 다른 수가 되는 쪽이라, 로그를 볼 때까지 아무도 모르는 것이 이 자리의 어려움이에요."
            en: >-
              It does not stop. The value quietly becomes another number, and nobody notices until
              the log — that is what makes this spot hard.
          edge:
            h:
              ko: "가장 날카로운 자리 — 조용하다"
              en: "The sharpest spot — it is quiet"
            code:
              - "1 << 31          // 값만 바뀐다"
              - "1 * 2 ** 31      // 2147483648"

blank:
  - q:
      ko: >-
        빈칸에 들어갈 것을 고르세요. {{site.line}}행은 두 값을 <b>비트 자리마다</b> 다루고
        결과로 수를 냅니다.
      en: >-
        Choose what goes in the blank. Line {{site.line}} works on the two values <b>bit by
        bit</b> and yields a number.
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "<<", mono: true }
      - t: "&&"
        mono: true
        diag:
          t:
            ko: "이 기호는 <b>참·거짓 둘을 묶습니다.</b> 여기 쓰면 비트는 하나도 안 움직이고 왼쪽이 거짓 같으면 왼쪽 값이 그대로 나와요."
            en: >-
              That symbol <b>joins two true-or-false things</b>. Used here no bit moves, and if the
              left side is falsy the left value comes back as it is.
          edge:
            h:
              ko: "가장 날카로운 자리 — 자리를 미는가 값을 고르는가"
              en: "The sharpest spot — shifting slots or choosing a value"
            code:
              - "4 << 1    // 8"
              - "4 && 1    // 1"
      - t: "||"
        mono: true
        diag:
          t:
            ko: "이 기호도 <b>값을 고릅니다.</b> 왼쪽이 참 같으면 왼쪽을 그대로 내주므로 비트와는 상관이 없어요."
            en: >-
              That symbol also <b>chooses a value</b>. If the left side is truthy it hands the left
              side back, so bits never come into it.
          edge:
            h:
              ko: "가장 날카로운 자리 — 고르기와 셈하기"
              en: "The sharpest spot — choosing or computing"
            code:
              - "4 << 1    // 8"
              - "4 || 1    // 4"
      - t: "??"
        mono: true
        diag:
          t:
            ko: "이 기호는 <b>「없음」일 때만</b> 오른쪽을 씁니다. <code>4</code> 는 없음이 아니라서 왼쪽이 그대로 나오고, 역시 비트는 안 건드려요."
            en: >-
              That symbol reaches for the right side <b>only when the left is absent</b>. Since
              <code>4</code> is not absent the left comes back, and again no bit is touched.
          edge:
            h:
              ko: "가장 날카로운 자리 — 없음이냐 비트냐"
              en: "The sharpest spot — absence or bits"
            code:
              - "4 << 1    // 8"
              - "4 ?? 1    // 4"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 비트를 직접 만질까요?"
    en: "Why does line {{site.line}} touch the bits directly?"
  choices:
    - t:
        ko: "한 수 안에 여러 켜짐·꺼짐을 담아 두었고, 그중 한 자리를 봐야 해서"
        en: "Because several on-off flags live in one number and one of those slots is needed"
      ok: true
      fb:
        ko: "그 방향입니다. 그 자리를 이름 붙인 값 여러 개로 나눴다면 무엇이 달라질지도 적어 보세요."
        en: >-
          That is the direction. Add what would change if those slots were split into several named
          values instead.
    - t:
        ko: "그냥 곱하기·나누기보다 늘 빠르니까"
        en: "Because it is always faster than multiplying and dividing"
      ok: false
      fb:
        ko: "속도 차이는 오늘날 거의 없습니다. 갈리는 것은 값이 32비트로 잘린다는 사실입니다."
        en: >-
          The speed difference is next to nothing today. What parts ways is that the value is cut to
          32 bits.
    - t:
        ko: "자바스크립트에는 큰 수를 다루는 다른 방법이 없어서"
        en: "Because JavaScript has no other way to handle large numbers"
      ok: false
      fb:
        ko: "보통의 셈이 64비트로 훨씬 큰 수를 다룹니다. 비트 연산은 오히려 폭이 좁은 쪽입니다."
        en: >-
          Ordinary arithmetic handles far larger numbers in 64 bits. Bitwise work is the narrower
          side, not the wider one.

queries:
  - { grammars: [typescript, tsx, javascript, vue], file: ./value-bits.scm }

examples:
  - code: "const flag = 1 << 3"
    expect: { sites: 1, form: bitop, hole: "<<", picks: { 1: "<<", 2: "1", 3: "3" } }
  - code: "const half = n >> 1"
    expect: { sites: 1, form: bitop, hole: ">>", picks: { 1: ">>", 2: "n", 3: "1" } }
  - code: "const flags = READ | WRITE"
    expect: { sites: 1, form: bitop, hole: "|", picks: { 1: "|", 2: "READ", 3: "WRITE" } }
  - code: "const mask = 0b1010"
    expect: { sites: 1, form: radix, picks: { 1: "0b1010" } }
  - code: "const doubled = n * 2"
    expect: none
  - code: "const both = ready && open"
    expect: none
