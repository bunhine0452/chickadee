schema: 1
id: ts/function-declaration
universal: common/function-definition
name: { ko: 함수 정의, en: Function declaration }
token: "function"
grammars: [typescript, tsx, javascript, vue]
framework: null
essential: true
difficulty: 1
prereq: []
# 빈칸 오답(const·class·return)은 개념으로 존재하지 않는 낱말이라 혼동 쌍으로 묶을 수 없다.
# `ts/const-declaration`(오답 let·var·readonly)과 같은 자리다.
confusions: []

dict:
  one_liner:
    ko: "줄 몇 개에 이름을 붙여 두고, 필요할 때 그 이름으로 부른다."
    en: "Gives a name to a few lines so they can be called by that name later."
  why:
    ko: >-
      정의는 <b>실행이 아닙니다.</b> {{site.line}}행은 「이런 일을 {{pick.2|code}} 라고 부르기로
      한다」고 적어 둘 뿐이고, {{pick.4|code}} 안의 줄은 누가 {{pick.2|code}}{{pick.2|josa:을,를}} 부를 때까지
      한 번도 돌지 않아요.
    en: >-
      Defining is <b>not running.</b> Line {{site.line}} only writes down “work of this shape goes
      by the name {{pick.2|code}}”; not one line inside {{pick.4|code}} runs until something calls
      {{pick.2|code}}.
  trace:
    - ko: "{{pick.2|code}} 라는 이름이 만들어진다."
      en: "The name {{pick.2|code}} comes into being."
    - ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 부를 때 받을 값의 이름이다 — 아직 값이 없다."
      en: "{{pick.3|code}} names the values it will receive — none exist yet."
    - ko: "{{pick.4|code}} 안의 줄은 부를 때 비로소 돈다."
      en: "The lines in {{pick.4|code}} run only when it is called."

rule:
  ko: "<b>정의한 자리에서는 돌지 않는다. 부른 자리에서 돈다.</b>"
  en: "<b>It does not run where it is defined. It runs where it is called.</b>"
result:
  label:
    ko: "{{site.line}}행이 만든 이름"
    en: "the name made on line {{site.line}}"
  value: "{{pick.2}}"
  note:
    ko: "부를 때 돈다"
    en: "runs when called"
ok:
  ko: >-
    {{site.line}}행은 이름 {{pick.2|code}}{{pick.2|josa:을,를}} 만듭니다. {{pick.4|code}} 안의 줄은 여기서 돌지
    않고, {{pick.2|code}}{{pick.2|josa:을,를}} 부르는 자리에서 돕니다.
  en: >-
    Line {{site.line}} makes the name {{pick.2|code}}. The lines in {{pick.4|code}} do not run
    here; they run wherever {{pick.2|code}} is called.
payoff:
  ko: >-
    이걸 알면 파일을 위에서 아래로 읽어도 실행 순서가 그 순서가 아니라는 것이 풀립니다 —
    정의는 건너뛰고 부르는 자리를 따라가면 됩니다.
  en: >-
    This is what explains why reading a file top to bottom is not the order things run — you skip
    the definitions and follow the calls.
bridge:
  ko: >-
    {{pick.3|code}} 안의 이름은 <b>안에서만</b> 쓰는 이름이라 바깥의 이름과 달라도 됩니다 —
    부를 때 그 자리에 값이 들어옵니다.
  en: >-
    The names in {{pick.3|code}} are <b>inside-only</b>, so they need not match anything outside —
    values drop into those slots at the call.
misconceptions:
  - ko: "정의하면 그 자리에서 한 번 돈다 — 아니요. 부르기 전에는 돌지 않습니다."
    en: "Defining runs it once there — no. Nothing runs before a call."
  - ko: "받는 값의 이름은 바깥과 같아야 한다 — 안에서만 쓰는 이름이라 달라도 됩니다."
    en: "The names it takes must match the outside — they are inside-only, so they need not."

point:
  - q:
      ko: "{{site.line}}행에서 <b>줄 묶음에 이름을 붙이는 일을 맡은 낱말</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the word that puts a name on the block of lines</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>붙일 이름</b>입니다. 이름만 적어서는 묶음이 이름을 갖지 못해요."
          en: >-
            {{pick.2|code}} is <b>the name to attach</b>. A name written alone does not give the
            block a name.
        edge:
          h:
            ko: "가장 날카로운 자리 — 이름만으로는 아무 일도 안 난다"
            en: "The sharpest spot — a name alone does nothing"
          code:
            - "add                    // 그런 이름이 없다"
            - "function add() { }     // 이름이 생긴다"
      pick.4:
        t:
          ko: "{{pick.4|code}}{{pick.4|josa:은,는}} <b>부를 때 돌 줄들</b>입니다. 이 묶음은 자기 이름을 모르고, 이름을 붙이는 것은 앞의 낱말이에요."
          en: >-
            {{pick.4|code}} is <b>the lines that run when called</b>. The block does not know its
            own name; the word in front gives it one.
        edge:
          h:
            ko: "가장 날카로운 자리 — 묶음이냐 이름 붙이는 말이냐"
            en: "The sharpest spot — the block or the word that names it"
          code:
            - "{ send() }               // 그 자리에서 바로 돈다"
            - "function f() { send() }  // 부를 때 돈다"

meaning:
  - q:
      ko: "{{site.line}}행을 지날 때 {{pick.4|code}} 안의 줄은 몇 번 실행될까요?"
      en: "As line {{site.line}} is passed, how many times do the lines in {{pick.4|code}} run?"
    hint:
      ko: "정의는 <b>실행이 아닙니다</b>."
      en: "Defining is <b>not running</b>."
    options:
      - t:
          ko: "0번 — 이름만 만들어지고, 부를 때 비로소 돈다"
          en: "Zero — only the name is made; they run when it is called"
      - t:
          ko: "1번 — 정의하면서 한 번 돈다"
          en: "Once — defining runs them once"
        diag:
          t:
            ko: "그러면 파일을 읽는 것만으로 모든 일이 일어나 버립니다. 정의는 이름을 만들 뿐이고, 도는 것은 부르는 자리예요."
            en: >-
              Then merely loading the file would do everything. Defining just makes the name; the
              running happens at the call.
          edge:
            h:
              ko: "가장 날카로운 자리 — 정의와 부르기"
              en: "The sharpest spot — defining and calling"
            code:
              - "function f() { log() }   // log 는 아직 0번"
              - "f()                      // 여기서 1번"
      - t:
          ko: "부르는 횟수와 상관없이 언제나 1번"
          en: "Always once, no matter how often it is called"
        diag:
          t:
            ko: "부를 때마다 돕니다. 열 번 부르면 열 번 도는 것이 이 문법을 쓰는 이유예요."
            en: >-
              It runs on every call. Ten calls, ten runs — that is the point of writing it this way.
          edge:
            h:
              ko: "가장 날카로운 자리 — 부르는 만큼 돈다"
              en: "The sharpest spot — as many runs as calls"
            code:
              - "f(); f(); f()   // 안의 줄이 세 번 돈다"
      - t:
          ko: "{{pick.3|code}} 에 값이 있을 때만 1번"
          en: "Once, but only when {{pick.3|code}} has values"
        diag:
          t:
            ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 부를 때 값이 들어올 <b>자리</b>일 뿐이고, 정의하는 시점에는 어느 쪽이든 돌지 않습니다."
            en: >-
              {{pick.3|code}} is only the <b>slots</b> values arrive in at the call; at definition
              time nothing runs either way.
          edge:
            h:
              ko: "가장 날카로운 자리 — 자리와 값"
              en: "The sharpest spot — slots and values"
            code:
              - "function f(a) { }   // a 는 아직 자리일 뿐"
              - "f(1)                // 여기서 a 가 1 이 된다"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 줄 묶음에 <b>이름을 붙여 두기만</b> 합니다."
      en: >-
        Choose what goes in the blank. Line {{site.line}} only <b>puts a name on</b> a block of lines.
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "function", mono: true }
      - t: "const"
        mono: true
        diag:
          t:
            ko: "<code>const</code> 도 이름을 만들지만 <b>값 하나</b>에 붙입니다. 뒤에 이름과 괄호와 묶음이 이어지는 이 모양에는 오지 못해요."
            en: >-
              <code>const</code> also makes a name, but it binds <b>one value</b>. It cannot stand
              before a name, a parameter list and a block laid out like this.
          edge:
            h:
              ko: "가장 날카로운 자리 — 값에 붙나 묶음에 붙나"
              en: "The sharpest spot — bound to a value or to a block"
            code:
              - "const add = (a) => a   // 값에 이름을 붙인다"
              - "function add(a) { }    // 묶음에 이름을 붙인다"
      - t: "class"
        mono: true
        diag:
          t:
            ko: "<code>class</code> 는 <b>여러 함수와 값을 한 덩어리로</b> 묶는 자리라 안에 <code>{{pick.2}}(…) { }</code> 같은 것들이 들어갑니다. 줄 묶음 하나에 이름을 붙이는 자리가 아니에요."
            en: >-
              <code>class</code> groups <b>several functions and values</b>, so things like
              <code>{{pick.2}}(…) { }</code> live inside it. It is not for naming one block.
          edge:
            h:
              ko: "가장 날카로운 자리 — 하나냐 덩어리냐"
              en: "The sharpest spot — one block or a group"
            code:
              - "function add(a) { }        // 하나"
              - "class M { add(a) { } }     // 덩어리 안의 하나"
      - t: "return"
        mono: true
        diag:
          t:
            ko: "<code>return</code> 은 <b>묶음 안에서</b> 값을 건네고 끝내는 낱말이라 바깥에서 이름을 붙이는 자리에는 오지 않습니다."
            en: >-
              <code>return</code> works <b>inside</b> a block, handing a value back and ending. It
              does not stand outside where a name is given.
          edge:
            h:
              ko: "가장 날카로운 자리 — 밖에서 붙이나 안에서 끝내나"
              en: "The sharpest spot — naming outside or ending inside"
            code:
              - "function add(a) { return a }   // 밖에서 이름, 안에서 끝냄"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 이 줄들을 따로 떼어 이름을 붙였을까요?"
    en: "Why does line {{site.line}} pull these lines out and give them a name?"
  choices:
    - t:
        ko: "같은 일을 여러 자리에서 해야 해서 — 이름이 있으면 그 자리마다 다시 적지 않아도 된다"
        en: "Because the same work is needed in several places — a name saves rewriting it"
      ok: true
      fb:
        ko: "그 방향입니다. 이름이 하나 더 하는 일이 있는데, 읽는 사람에게 무엇을 알려 주는지도 적어 보세요."
        en: "That is the direction. The name does one more thing — say what it tells a reader."
    - t:
        ko: "코드를 빠르게 하려고"
        en: "To make the code faster"
      ok: false
      fb:
        ko: "부르는 일에는 오히려 약간의 비용이 듭니다. 얻는 것은 속도가 아니라 반복을 없애는 것과 이름입니다."
        en: "Calling costs a little, if anything. What you gain is not speed but reuse and a name."
    - t:
        ko: "파일을 짧게 하려고"
        en: "To make the file shorter"
      ok: false
      fb:
        ko: "한 번만 쓰는 일이라면 오히려 길어집니다. 이유는 여러 자리에서 쓰는 데 있습니다."
        en: "Used once, it makes things longer. The reason lies in being used in several places."

queries:
  - { grammars: [typescript, tsx, javascript, vue], file: ./function-declaration.scm }

examples:
  - code: "function add(a, b) { return a + b }"
    expect:
      sites: 1
      form: function
      hole: "function"
      picks: { 1: "function", 2: "add", 3: "(a, b)", 4: "{ return a + b }" }
  - code: "const add = (a, b) => a + b"
    expect: none
