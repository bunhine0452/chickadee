schema: 1
id: ts/boolean-literal
universal: common/boolean-value
name: { ko: 참·거짓 값, en: Boolean literal }
token: "true"
grammars: [typescript, tsx, javascript]
framework: null
essential: true
difficulty: 1
prereq: []
confusions: [ts/undefined-null]

dict:
  # 0장에서 문제보다 먼저 읽힌다 (D138) — 낱말 자체를 적지 않고 하는 일로 쓴다.
  one_liner:
    ko: "값이 둘뿐인 종류. 「그렇다」와 「아니다」를 그대로 적은 낱말이다."
    en: "A kind with two values only — the words for “it holds” and “it does not”."
  why:
    ko: >-
      숫자는 값이 무한히 많지만 이 종류는 <b>둘뿐</b>입니다. 그래서 갈림길이 이 값을 답으로
      씁니다 — {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:은,는}} 견주기를 거치지 않고
      이미 답인 값이에요.
    en: >-
      Numbers have endless values; this kind has <b>two</b>. That is why a fork takes this as its
      answer — {{pick.1|code}} on line {{site.line}} is already an answer, with nothing to weigh.
  trace:
    - ko: "{{pick.1|code}}{{pick.1|josa:은,는}} 견줄 것이 없는 값이다."
      en: "{{pick.1|code}} is a value with nothing left to weigh."
    - ko: "따옴표가 없으니 글자가 아니다."
      en: "There are no quotes, so it is not text."
    - ko: "조건 자리에 그대로 설 수 있다."
      en: "It can stand in a condition just as it is."

rule:
  ko: "<b>따옴표를 씌우면 글자가 되어 종류가 달라진다.</b> 값이 둘뿐인 것은 따옴표 없는 쪽이다."
  en: >-
    <b>Put quotes round it and it becomes text, a different kind.</b> The kind with two values is
    the one without quotes.
result:
  label:
    ko: "{{site.line}}행의 판단"
    en: "the judgement on line {{site.line}}"
  value: "{{pick.1}}"
  note:
    ko: "값이 둘뿐이다"
    en: "only two values exist"
ok:
  ko: >-
    {{pick.1|code}}{{pick.1|josa:은,는}} 참·거짓 두 값 중 하나입니다. 조건 자리에 오면 견주기
    없이 그대로 갈림을 정합니다.
  en: >-
    {{pick.1|code}} is one of the two values. Standing in a condition, it decides the fork with
    nothing weighed.
payoff:
  ko: >-
    이 종류를 알고 나면 조건 자리에 무엇이 오는지가 풀립니다 — 무엇이 오든 결국 이 둘 중
    하나로 좁혀진 것이니까요.
  en: >-
    Once you know this kind, what belongs in a condition stops being a puzzle — whatever goes
    there has narrowed to one of these two.
bridge:
  ko: >-
    {{pick.1|code}}{{pick.1|josa:은,는}} 견주기가 내놓는 것과 같은 종류의 값입니다 — 한쪽은
    적어 둔 것이고 한쪽은 셈해서 얻은 것뿐이에요.
  en: >-
    {{pick.1|code}} is the same kind of value a comparison yields — one is written down, the other
    is worked out.
misconceptions:
  - ko: "따옴표를 씌운 것도 같다 — 아니요. 글자가 되어 조건 자리에서 늘 참이 됩니다."
    en: "Quoting it is the same — no. It becomes text, which is always taken as holding."
  - ko: "0 과 1 로 적어도 같다 — 셈에는 쓰이지만 종류가 다릅니다."
    en: "Writing 0 and 1 is the same — those compute, but they are a different kind."

meaning:
  - q:
      ko: "{{site.line}}행의 {{pick.1|code}}{{pick.1|josa:을,를}} <code>\"{{pick.1}}\"</code> 처럼 따옴표로 감싸면 무엇이 달라질까요?"
      en: "On line {{site.line}}, what changes if {{pick.1|code}} is wrapped in quotes?"
    hint:
      ko: "따옴표가 바꾸는 것은 값이 아니라 <b>종류</b>입니다."
      en: "Quotes change not the value but its <b>kind</b>."
    options:
      - t:
          ko: "글자가 되어, 조건 자리에서는 내용과 상관없이 늘 참으로 읽힌다"
          en: "It becomes text, and in a condition non-empty text is always taken as holding"
      - t:
          ko: "아무것도 달라지지 않는다"
          en: "Nothing changes"
        diag:
          t:
            ko: "겉보기는 같지만 종류가 달라집니다. 견주기에 넣어 보면 갈립니다 — 글자와 참·거짓은 같은 값이 아니에요."
            en: >-
              They look alike but the kind differs. Put them through a comparison and they part —
              text and a boolean are not the same value.
          edge:
            h:
              ko: "가장 날카로운 자리 — 따옴표 하나"
              en: "The sharpest spot — one pair of quotes"
            code:
              - "true === \"true\"   // 같지 않다"
              - "typeof \"true\"     // \"string\""
      - t:
          ko: "오류로 멈춘다"
          en: "It stops with an error"
        diag:
          t:
            ko: "따옴표를 씌우는 것은 올바른 글자 값입니다. 멈추지 않고 조용히 다르게 동작하는 쪽이라 더 찾기 어렵습니다."
            en: >-
              Quoting it makes a perfectly valid text value. Nothing stops; it quietly behaves
              differently, which is harder to find."
          edge:
            h:
              ko: "가장 날카로운 자리 — 멈추지 않는다"
              en: "The sharpest spot — nothing stops"
            code:
              - "if (\"false\") { a() }  // a 가 실행된다"
              - "if (false) { a() }    // 실행되지 않는다"
      - t:
          ko: "숫자로 바뀐다"
          en: "It turns into a number"
        diag:
          t:
            ko: "숫자로 바꾸는 것은 따옴표가 아니라 셈에 넣을 때 일어나는 다른 일입니다. 따옴표는 글자로 만듭니다."
            en: >-
              Turning into a number is a different thing that happens in arithmetic, not from
              quotes. Quotes make text.
          edge:
            h:
              ko: "가장 날카로운 자리 — 글자냐 숫자냐"
              en: "The sharpest spot — text or number"
            code:
              - "\"true\" + \"\"   // \"true\" — 글자로 이어 붙는다"
              - "true + 0       // 1 — 셈에서만 숫자가 된다"

no_hole_reason: >-
  참·거짓은 값 자체라 다른 쪽을 넣어도 어느 것이 맞는지 코드에 근거가 없다. 「참이냐 거짓이냐」는 문법 문제가 아니다.

why_gate:
  q:
    ko: "{{site.line}}행은 왜 이 값을 이름 없이 그대로 적었을까요?"
    en: "Why does line {{site.line}} write this value out with no name?"
  choices:
    - t:
        ko: "이 자리에서 답이 이미 정해져 있어서 — 견줄 것이 없다"
        en: "Because the answer is already settled here — there is nothing to weigh"
      ok: true
      fb:
        ko: "그 방향입니다. 답이 정해지지 않은 자리라면 무엇이 대신 왔을지도 적어 보세요."
        en: "That is the direction. Say also what would stand here if the answer were not settled."
    - t:
        ko: "이 종류에는 이름을 붙일 수 없어서"
        en: "Because this kind cannot be given a name"
      ok: false
      fb:
        ko: "이름은 붙일 수 있습니다. 붙이지 않은 것은 그 자리에서 한 번 쓰고 끝나기 때문입니다."
        en: "It can be named. It was not, because it is used once here and done."
    - t:
        ko: "이름을 붙이면 값이 바뀔 수 있어서"
        en: "Because naming it could change the value"
      ok: false
      fb:
        ko: "이름은 값을 바꾸지 않습니다. 가리킬 뿐이에요."
        en: "A name does not change a value. It only points at one."

queries:
  - { grammars: [typescript, tsx, javascript], file: ./boolean-literal.scm }

examples:
  - code: "const done = true"
    expect: { sites: 1, form: "true", picks: { 1: "true" } }
  - code: "const off = false"
    expect: { sites: 1, form: "false", picks: { 1: "false" } }
  - code: "const s = \"true\""
    expect: none
