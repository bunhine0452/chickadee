schema: 1
id: ts/implicit-conversion
universal: null
name: { ko: 저절로 바뀌는 타입, en: Conversion that happens on its own }
token: "1 + '1'"
grammars: [typescript, tsx, javascript, vue]
framework: null
essential: true
difficulty: 3
prereq: [ts/arithmetic, ts/string-literal, cs/type-conversion, cs/static-vs-dynamic-typing]
confusions: [ts/arithmetic, ts/string-literal]

dict:
  one_liner:
    ko: "종류가 다른 값이 만나면 언어가 한쪽을 조용히 바꿔서 계산한다."
    en: "When two kinds meet, the language quietly changes one side and computes."
  why:
    ko: >-
      다른 언어라면 여기서 멈춥니다. 여기서는 안 멈추고 한쪽을 바꿔서 계속해요.
      {{site.line}}행의 {{pick.2|code}}{{pick.2|josa:은,는}} 글자인데 옆의 값은 수라서,
      {{pick.1|code}}{{pick.1|josa:이,가}} 어느 쪽으로 맞출지를 혼자 정합니다.
    en: >-
      Another language would stop here. This one does not — it changes a side and carries on.
      {{pick.2|code}} on line {{site.line}} is text while the value beside it is a number, so
      {{pick.1|code}} decides on its own which way to line them up.
  trace:
    - ko: "{{site.line}}행의 {{pick.1|code}}{{pick.1|josa:이,가}} 양쪽 종류를 본다."
      en: "{{pick.1|code}} on line {{site.line}} looks at the kind on each side."
    - ko: "한쪽이 글자면 규칙에 따라 한쪽을 바꾼다 — 기호마다 방향이 다르다."
      en: "If one side is text it changes one of them by rule — and the direction differs per symbol."
    - ko: "{{pick.3|code}}{{pick.3|josa:과,와}} 맞춘 뒤 계산이 이어진다. 멈추는 자리는 없다."
      en: "Once lined up with {{pick.3|code}} the work continues. Nothing stops anywhere."

rule:
  ko: >-
    <b>기호마다 바꾸는 방향이 다르다.</b> 더하기만 글자 쪽으로 기울고, 나머지 셈은 전부
    수 쪽으로 당긴다.
  en: >-
    <b>Each symbol converts in its own direction.</b> Only the adding symbol leans toward text;
    every other arithmetic symbol pulls toward numbers.
result:
  label:
    ko: "{{site.line}}행이 내놓는 것"
    en: "What line {{site.line}} yields"
  value: "{{pick.2}} {{pick.1}} {{pick.3}}"
  note:
    ko: "한쪽이 바뀐 뒤의 값"
    en: "the value after one side was changed"
ok:
  ko: >-
    {{pick.1|code}} 양쪽의 종류가 달라서 언어가 <b>한쪽을 바꿉니다.</b> 어느 쪽을 바꿀지는
    이 기호가 정하고, 사람이 적은 곳은 어디에도 없어요.
  en: >-
    The kinds on the two sides of {{pick.1|code}} differ, so the language <b>changes one of
    them</b>. Which one is decided by this symbol, and nobody wrote that down anywhere.
payoff:
  ko: >-
    입력칸에서 온 값은 거의 늘 글자입니다. 이 규칙을 알면 합계가 이어 붙어 버리는 버그를
    코드만 보고 찾을 수 있어요.
  en: >-
    A value from an input box is nearly always text. Knowing this rule lets you find the bug where a
    total runs together just by reading the code.
bridge:
  ko: >-
    바꾸는 일을 사람이 적어 두는 방법도 있습니다 — 그쪽은 어느 쪽으로 바꿀지가 이름에
    적혀 있어요.
  en: >-
    There is also a way to write the conversion down by hand — there the direction is spelled out in
    the name.
misconceptions:
  - ko: "종류가 다르면 멈춘다 — 파이썬의 규칙입니다. 여기서는 조용히 바꿔서 계속해요."
    en: "Different kinds make it stop — that is Python's rule. Here it quietly converts and carries on."
  - ko: "글자에 수를 곱하면 반복된다 — 파이썬에서는 그렇고, 여기서는 글자를 수로 읽습니다."
    en: >-
      Multiplying text by a number repeats it — that is Python; here the text is read as a number
      instead.

point:
  - q:
      ko: "{{site.line}}행에서 <b>어느 쪽을 바꿀지 정하는 기호</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the symbol that decides which side is converted</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>글자로 적힌 쪽</b>입니다. 종류가 다르다는 사실은 여기서 보이지만, 어느 쪽으로 맞출지는 가운데 기호가 정해요."
          en: >-
            {{pick.2|code}} is the <b>side written as text</b>. It shows that the kinds differ, but
            which way they line up is decided by the symbol between them.
        edge:
          h:
            ko: "가장 날카로운 자리 — 같은 글자, 다른 답"
            en: "The sharpest spot — same text, different answer"
          code:
            - "'3' - 1     // 2"
            - "'3' + 1     // '31'"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 견주어지는 <b>다른 쪽</b>입니다. 이 값은 대개 그대로 남고, 바뀌는 쪽은 반대편이에요."
          en: >-
            {{pick.3|code}} is the <b>other side</b>. This value is usually left as it is; the side
            that changes is the opposite one.
        edge:
          h:
            ko: "가장 날카로운 자리 — 바뀌는 쪽은 하나다"
            en: "The sharpest spot — only one side changes"
          code:
            - "'5' * 2     // 10, 왼쪽이 수가 된다"
            - "5 + '2'     // '52', 왼쪽이 글자가 된다"

meaning:
  - q:
      ko: "<code>'5' * 2</code> 와 <code>'5' + 2</code> 는 각각 무엇이 될까요?"
      en: "What do <code>'5' * 2</code> and <code>'5' + 2</code> each become?"
    hint:
      ko: "기호마다 바꾸는 방향이 다릅니다."
      en: "Each symbol converts in its own direction."
    options:
      - t:
          ko: "<code>10</code> 과 <code>'52'</code> — 기호가 방향을 정한다"
          en: "<code>10</code> and <code>'52'</code> — the symbol sets the direction"
      - t:
          ko: "둘 다 멈춘다 — 종류가 달라서"
          en: "Both stop — the kinds differ"
        diag:
          t:
            ko: "파이썬이라면 앞쪽이 멈춥니다. 여기서는 멈추는 자리가 없고, 대신 값이 조용히 달라져요."
            en: >-
              In Python the first one stops. Here nothing stops, and instead the value quietly
              differs.
          edge:
            h:
              ko: "가장 날카로운 자리 — 멈추는가 바뀌는가"
              en: "The sharpest spot — stopping or converting"
            code:
              - "'5' * 2     // 10"
              - "'5' + 2     // '52'"
      - t:
          ko: "<code>'55'</code> 와 <code>'52'</code> — 글자에 수를 곱하면 반복된다"
          en: "<code>'55'</code> and <code>'52'</code> — text times a number repeats it"
        diag:
          t:
            ko: "파이썬에는 그런 규칙이 있습니다. 여기에는 없어서 곱셈은 글자를 <b>수로 읽어</b> 계산해요."
            en: >-
              Python does have that rule. This language does not, so multiplication <b>reads the text
              as a number</b> instead.
          edge:
            h:
              ko: "가장 날카로운 자리 — 반복인가 셈인가"
              en: "The sharpest spot — repeating or computing"
            code:
              - "'5' * 2         // 10"
              - "'5'.repeat(2)   // '55'"
      - t:
          ko: "둘 다 <code>10</code> 과 <code>7</code> — 글자는 늘 수로 읽힌다"
          en: "<code>10</code> and <code>7</code> — text is always read as a number"
        diag:
          t:
            ko: "곱셈 쪽은 그 말이 맞습니다. 더하기 하나만 글자 쪽으로 기울어서 이어 붙어요."
            en: >-
              For multiplication that holds. The adding symbol alone leans toward text, so it runs
              together instead.
          edge:
            h:
              ko: "가장 날카로운 자리 — 더하기만 다르다"
              en: "The sharpest spot — only adding differs"
            code:
              - "'5' - 2     // 3"
              - "'5' + 2     // '52'"

no_hole_reason: >-
  구멍에 들어갈 것이 기호 한 글자라 지우면 짚기와 같은 물음이 되고, 그마저도 답을 정하는 것은
  기호가 아니라 양쪽 종류다. 이 개념은 「무엇이 나오나」를 값으로 물어야 재어진다.

why_gate:
  q:
    ko: "{{site.line}}행에는 왜 글자와 수가 한 식에 같이 놓여 있을까요?"
    en: "Why do text and a number sit in one expression on line {{site.line}}?"
  choices:
    - t:
        ko: "값이 글자로 들어오는 자리라서 — 언어가 안 막으니 그대로 계산에 들어갔다"
        en: "Because the value arrives as text, and the language does not block it from the arithmetic"
      ok: true
      fb:
        ko: "그 방향입니다. 그 값이 어디서 왔는지(입력칸·주소·저장소)도 함께 적어 보세요."
        en: "That is the direction. Add where the value came from — an input box, a URL, storage."
    - t:
        ko: "글자와 수를 섞는 것이 더 빨라서"
        en: "Because mixing text and numbers is faster"
      ok: false
      fb:
        ko: "바꾸는 일이 한 단계 더 붙으므로 빠를 이유가 없습니다. 갈리는 것은 속도가 아니라 답입니다."
        en: >-
          Converting adds a step, so there is no speed to gain. What parts ways is the answer, not
          the speed.
    - t:
        ko: "타입 검사기가 이 자리를 허용해서"
        en: "Because the type checker allows it here"
      ok: false
      fb:
        ko: "타입 검사기는 대개 이런 자리를 막습니다. 막지 못하는 것은 값이 <b>돌 때</b> 정해지는 경우입니다."
        en: >-
          A type checker usually blocks a spot like this. What it cannot block is the case where the
          value is settled <b>while running</b>.

queries:
  - { grammars: [typescript, tsx, javascript, vue], file: ./implicit-conversion.scm }

examples:
  - code: "const n = '5' * 2"
    expect: { sites: 1, form: text-left, picks: { 1: "*", 2: "'5'", 3: "2" } }
  - code: "const s = 1 + '1'"
    expect: { sites: 1, form: plus-text-right, picks: { 1: "+", 2: "'1'", 3: "1" } }
  - code: "const d = '3' - 1"
    expect: { sites: 1, form: text-left, picks: { 1: "-", 2: "'3'", 3: "1" } }
  - code: "const total = price + fee"
    expect: none
  - code: "const label = 'a' + 'b'"
    expect: none
