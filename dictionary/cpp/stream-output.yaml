schema: 1
id: cpp/stream-output
# 2부 §3 #21. `universal: null` — §6 이 적은 그대로다. 다른 언어에서는 함수 호출
# (`print`·`console.log`)이라 표면이 완전히 다르고, `common/function-call` 로 전이하면
# 이 기호를 못 배운다 (D4).
universal: null
name: { ko: 밖으로 흘려보내기, en: Stream output }
token: "<<"
grammars: [cpp]
framework: null
essential: true
difficulty: 2
prereq: [cpp/namespace-qualification, cpp/operator-precedence]
confusions: []
dict:
  one_liner:
    ko: "비트를 옮기던 기호가 여기서는 밖으로 내보내는 일을 한다."
    en: "The symbol that shifted bits is here doing the sending-out instead."
  why:
    ko: >-
      {{site.line}}행의 기호는 원래 <b>비트를 옆으로 미는</b> 셈이었습니다. C++ 은 그 기호에
      다른 뜻을 붙일 수 있게 했고, 표준 라이브러리가 그것을 <b>내보내기</b>로 썼어요.
      이어 붙일 수 있는 이유는 한 번 내보낸 결과가 <b>다시 그 흐름</b>이기 때문입니다 —
      그래서 왼쪽부터 차례로 붙습니다. 여기서 함정이 하나 나옵니다: <b>뜻은 바뀌었는데
      세기는 원래 것 그대로</b>라, 비트 연산을 섞으면 묶임이 예상과 달라집니다.
      그래서 셈이 섞이면 괄호를 적는 것이 규약이에요.
    en: >-
      The symbol on line {{site.line}} originally <b>pushed bits sideways</b>. C++ lets a symbol
      be given another meaning, and the standard library used this one for <b>sending out</b>.
      Chaining works because each send hands back <b>the stream again</b>, so they attach left to
      right. One trap follows: <b>the meaning changed but the strength did not</b>, so mixing in
      a bit operation groups differently than expected. Which is why brackets are the convention
      whenever arithmetic joins in.
  trace:
    - ko: "{{site.line}}행의 {{pick.2|code}} 쪽이 받는 흐름이다."
      en: "On line {{site.line}}, {{pick.2|code}} is the stream that receives."
    - ko: "{{pick.1|code}}{{pick.1|josa:이,가}} {{pick.3|code}}{{pick.3|josa:을,를}} 그 흐름에 넣는다."
      en: "{{pick.1|code}} puts {{pick.3|code}} into that stream."
    - ko: "그 결과가 다시 같은 흐름이라 뒤에 또 붙일 수 있다."
      en: "The result is that same stream again, so another can attach after it."
rule:
  ko: "<b>뜻은 바꿔도 세기는 그대로다.</b> 내보낸 결과가 다시 흐름이라 이어 붙는다."
  en: "<b>Meaning changed, strength did not.</b> Each send returns the stream, so they chain."
result:
  label: { ko: "{{site.line}}행이 내보낸 것", en: "what line {{site.line}} sent out" }
  value: "{{pick.2}} {{pick.1}} {{pick.3}}"
  note: { ko: "결과는 다시 그 흐름이다", en: "the result is the stream again" }
ok:
  ko: "{{pick.3|code}}{{pick.3|josa:이,가}} 그 흐름으로 나갔고 결과는 다시 같은 흐름입니다."
  en: "{{pick.3|code}} went out through the stream, and the result is that stream again."
payoff:
  ko: >-
    이걸 알면 「출력에 셈을 섞었더니 이상한 수가 찍힌다」가 풀립니다 — 묶임이 달랐어요.
  en: >-
    This untangles “mixing arithmetic into output printed a strange number” — the grouping differed.
bridge:
  ko: >-
    파이썬·JS 는 <b>함수를 부릅니다</b>. 기호로 하는 것은 이 언어의 선택이고, 그 덕에
    타입마다 내보내는 법을 자기가 적을 수 있어요.
  en: >-
    Python and JS <b>call a function</b>. Doing it with a symbol is this language's choice, and it
    lets each type write its own way of going out.
misconceptions:
  - ko: "이 기호는 출력 전용이다 — 원래 비트를 미는 셈이고, 정수끼리 쓰면 그 뜻입니다."
    en: "The symbol is output-only — it is a bit shift, and between whole numbers it means that."
  - ko: "이어 붙인 것들이 왼쪽부터 계산된다 — 붙는 순서는 왼쪽부터지만 인자가 계산되는 순서는 다른 문제입니다."
    en: "Chained parts are evaluated left to right — they attach left to right; when the arguments are computed is another matter."
  - ko: "줄바꿈이 저절로 붙는다 — 안 붙습니다. 직접 적어야 해요."
    en: "A newline is added for you — it is not; it has to be written."
point:
  - q:
      ko: "{{site.line}}행에서 <b>흐름으로 내보내는 기호</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the symbol that sends into the stream</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>받는 흐름</b>입니다. 넣는 일은 그 뒤의 기호가 해요."
          en: "{{pick.2|code}} is the <b>receiving stream</b>. The putting is the symbol's job."
        edge:
          h: { ko: "가장 날카로운 자리 — 흐름이냐 넣는 기호냐", en: "The sharpest spot — the stream or the sender" }
          code:
            - "std::cout;         // 아무것도 안 나간다"
            - "std::cout << x;    // x 가 나간다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>나가는 값</b>입니다. 값 자체는 어디로 갈지 모르고, 정하는 것이 앞의 기호예요."
          en: "{{pick.3|code}} is the <b>value going out</b>. It does not know where to go; the symbol decides."
        edge:
          h: { ko: "가장 날카로운 자리 — 값이냐 내보내기냐", en: "The sharpest spot — the value or the sending" }
          code:
            - "x;                 // 계산되고 사라진다"
            - "std::cout << x;    // 화면에 남는다"
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 값을 흐름으로 <b>내보냅니다</b>."
      en: "Choose what goes in the blank. Line {{site.line}} <b>sends</b> a value into the stream."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "<<", mono: true }
      - t: ">>"
        mono: true
        diag:
          t:
            ko: "이건 방향이 반대라 <b>흐름에서 값을 꺼내</b> 옵니다. 화면으로 내보내는 흐름에는 안 붙어요."
            en: "That points the other way and <b>pulls a value out of a stream</b>. It does not attach to the outgoing one."
          edge:
            h: { ko: "가장 날카로운 자리 — 나가느냐 들어오느냐", en: "The sharpest spot — out or in" }
            code:
              - "std::cout << x;   // 내보낸다"
              - "std::cin >> x;    // 받아 온다"
      - t: "+"
        mono: true
        diag:
          t:
            ko: "이건 <b>더하기</b>입니다. 흐름과 값을 더할 수는 없어서 그 자리에서 멈춰요."
            en: "That <b>adds</b>. A stream and a value cannot be added, so it stops there."
          edge:
            h: { ko: "가장 날카로운 자리 — 더하기냐 내보내기냐", en: "The sharpest spot — adding or sending" }
            code:
              - "a + b;            // 수를 더한다"
              - "std::cout << x;   // 값을 내보낸다"
      - t: "<"
        mono: true
        diag:
          t:
            ko: "기호 하나짜리는 <b>작은지 묻습니다</b>. 참·거짓 하나가 나오고 화면에는 아무것도 안 남아요."
            en: "The single symbol <b>asks whether it is smaller</b>. One truth value comes out and nothing reaches the screen."
          edge:
            h: { ko: "가장 날카로운 자리 — 묻느냐 내보내느냐", en: "The sharpest spot — asking or sending" }
            code:
              - "a < b;            // 참·거짓"
              - "std::cout << a;   // 화면"
why_gate:
  q:
    ko: "왜 <b>함수를 부르지 않고 기호</b>로 내보낼까요?"
    en: "Why send it out with <b>a symbol instead of a function call</b>?"
  choices:
    - t:
        ko: "타입마다 내보내는 법을 자기가 적을 수 있게 하려고 — 새 타입을 만들면 같은 기호가 그대로 붙는다"
        en: "So each type can write its own way of going out — a new type attaches to the same symbol"
      ok: true
      fb:
        ko: "그 방향입니다. 그 대가로 생기는 함정 하나도 적어 보세요."
        en: "That is the direction. Add one trap that comes with it."
    - t:
        ko: "함수 호출보다 빨라서"
        en: "Because it is faster than a function call"
      ok: false
      fb:
        ko: "같은 함수 호출로 번역됩니다. 다른 것은 <b>쓰는 모양</b>이에요."
        en: "It compiles into the same function call. What differs is <b>how it is written</b>."
    - t:
        ko: "C 의 출력 함수를 못 쓰게 하려고"
        en: "To stop people using C's output function"
      ok: false
      fb:
        ko: "그대로 씁니다. 얻은 것은 <b>타입 안전</b>과 확장이에요."
        en: "It still works. What was gained is <b>type safety</b> and extensibility."
queries:
  - { grammars: [cpp], file: ./stream-output.scm }
examples:
  - code: "void f() { std::cout << x; }              // x 가 화면으로 나간다"
    expect: { sites: 1, form: cout, hole: "<<", picks: { 1: "<<", 2: "std::cout", 3: "x" } }
  - code: "void f() { std::cerr << a << b; }         // 왼쪽부터 차례로 붙는다"
    expect: { sites: 2 }
  - code: "void f() { int n = a >> 2; }              // 반대 방향은 다른 판이다"
    expect: none
