schema: 1
id: cpp/conversion
# 0부 §0.1 #11, 축 6. 축 6 의 보편형 자리(`common/type-cast`)는 **아직 비어 있다**
# (`docs/curriculum/README.md` §9 끝). 여섯 언어에서 성립하는 자리라 후보로 보고했고,
# 서면 그때 건다. 지금 걸 것이 없으므로 `null` 이다.
universal: null
name: { ko: 타입 바꾸기, en: Conversion }
token: "static_cast"
grammars: [cpp]
framework: null
essential: true
difficulty: 3
prereq: [cpp/integer-type, cs/type-conversion]
confusions: []
dict:
  one_liner:
    ko: "타입이 다른 둘이 만나면 대개 조용히 맞춰지고, 줄어들 때는 값이 잘린다."
    en: "Meet two types and one is quietly adjusted; going narrower cuts the value."
  why:
    ko: >-
      C++ 은 타입이 다른 둘이 만나면 <b>조용히 맞춥니다</b>. 넓은 쪽으로 가는 것은 값이
      안 상하지만, 좁은 쪽으로 갈 때는 잘려요 — 그것도 반올림이 아니라 버림입니다.
      {{site.line}}행처럼 <b>사람이 적은 변환</b>은 그 사실을 코드에 남깁니다.
      그리고 C 와 갈리는 자리가 하나 있어요 — <b>중괄호로 채우면 줄어드는 변환이
      컴파일 오류</b>가 됩니다. <code>int x = 3.5;</code> 는 통과해서 3 이 되고
      <code>int x{3.5};</code> 는 멈추죠. 부호가 섞이는 자리도 조심해야 합니다 —
      <code>-1 &lt; 1u</code> 는 참이 아니라 <b>거짓</b>입니다.
    en: >-
      When two types meet, C++ <b>adjusts one quietly</b>. Going wider costs nothing; going
      narrower cuts — and cuts, not rounds. A <b>conversion a person wrote</b>, like the one on
      line {{site.line}}, leaves that fact in the code. There is one place where C++ parts from
      C: <b>filling with braces makes a narrowing conversion a compile error</b>.
      <code>int x = 3.5;</code> passes and gives 3; <code>int x{3.5};</code> stops. Mixed signs
      need care too — <code>-1 &lt; 1u</code> is <b>false</b>, not true.
  trace:
    - ko: "{{site.line}}행은 {{pick.3|code}} 의 값을 다른 타입으로 옮긴다."
      en: "Line {{site.line}} moves the value of {{pick.3|code}} into another type."
    - ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 도착할 타입이다."
      en: "{{pick.2|code}} is the type it lands in."
    - ko: "도착 자리가 더 좁으면 넘치는 부분이 버려진다."
      en: "If the landing room is narrower, what does not fit is dropped."
rule:
  ko: "<b>넓어질 때는 조용하고 좁아질 때는 잘린다.</b> 중괄호로 채운 자리에서만 그 잘림이 오류가 된다."
  en: "<b>Widening is quiet, narrowing cuts.</b> Only a brace-filled slot turns that cut into an error."
result:
  label: { ko: "{{site.line}}행이 만든 값", en: "the value made on line {{site.line}}" }
  value: "{{pick.1}}<{{pick.2}}>({{pick.3}})"
  note: { ko: "좁아지면 말없이 잘린다", en: "narrowing cuts without a word" }
ok:
  ko: "{{pick.3|code}} 의 값이 {{pick.2|code}} 자리에 맞춰 들어갑니다."
  en: "The value of {{pick.3|code}} is fitted into the room of {{pick.2|code}}."
payoff:
  ko: >-
    이걸 알면 「큰 수를 넣었더니 엉뚱한 값이 됐다」가 풀립니다 — 도착 자리가 좁았습니다.
  en: >-
    This untangles “a big number turned into something odd” — the landing room was narrower.
bridge:
  ko: >-
    러스트는 <b>조용한 변환이 하나도 없습니다</b> — 타입이 다르면 그 자리에서 멈춰요.
    C++ 은 반대로 사용자가 만든 변환까지 조용히 돕니다.
  en: >-
    Rust has <b>no quiet conversions at all</b> — different types stop right there. C++ goes the
    other way and even runs user-written conversions quietly.
misconceptions:
  # `cpp.md` §0.1 #11 · §0.2.
  - ko: "좁은 자리에 넣으면 반올림된다 — 버려집니다. <code>3.9</code> 는 4 가 아니라 3 이에요."
    en: "Going narrower rounds — it drops. <code>3.9</code> becomes 3, not 4."
  - ko: "<code>-1 &lt; 1u</code> 는 참이다 — 거짓입니다. 부호가 섞이면 왼쪽이 큰 양수로 읽혀요."
    en: "<code>-1 &lt; 1u</code> is true — it is false; mixed signs read the left as a large positive."
  - ko: "중괄호는 등호와 같다 — 줄어드는 변환에서 갈립니다. 하나는 통과하고 하나는 멈춰요."
    en: "Braces equal the equals sign — they part on narrowing: one passes, one stops."
point:
  - q:
      ko: "{{site.line}}행에서 <b>사람이 변환을 적었다는 표시</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the mark that a person wrote the conversion</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>도착할 타입</b>입니다. 어떤 종류의 변환인지는 그 앞의 이름이 정해요."
          en: "{{pick.2|code}} is the <b>landing type</b>. What kind of conversion it is comes from the name before it."
        edge:
          h: { ko: "가장 날카로운 자리 — 도착 타입이냐 변환 종류냐", en: "The sharpest spot — the target or the kind" }
          code:
            - "static_cast<int>(d)       // 값을 옮긴다"
            - "reinterpret_cast<int*>(p) // 비트를 다시 읽는다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>바뀌는 값</b>입니다. 값 자체는 아무 데도 안 가고 새 값이 하나 만들어져요."
          en: "{{pick.3|code}} is the <b>value being converted</b>. It goes nowhere; a new value is made."
        edge:
          h: { ko: "가장 날카로운 자리 — 원본이냐 새 값이냐", en: "The sharpest spot — the source or the new value" }
          code:
            - "d;                    // 그대로 있다"
            - "static_cast<int>(d);  // 새 값이 나온다"
meaning:
  - q:
      ko: "<code>int x = 3.5;</code> 는 통과하는데 <code>int x{3.5};</code> 는 왜 멈출까요?"
      en: "Why does <code>int x = 3.5;</code> pass while <code>int x{3.5};</code> stops?"
    hint:
      ko: "중괄호로 채우는 자리에만 붙는 규칙이 하나 있습니다."
      en: "One rule applies only where braces do the filling."
    options:
      - t:
          ko: "중괄호로 채우는 자리에서는 값이 줄어드는 변환을 금지해서 — 잘림을 조용히 넘기지 않겠다는 규칙이다"
          en: "Because a brace-filled slot forbids narrowing — the rule refuses to let a cut pass quietly"
      - t:
          ko: "중괄호는 소수를 아예 못 담아서"
          en: "Because braces cannot hold a fraction at all"
        diag:
          t:
            ko: "담습니다 — <code>double d{3.5};</code> 는 통과해요. 막히는 것은 소수가 아니라 <b>줄어드는 변환</b>입니다."
            en: "They can — <code>double d{3.5};</code> passes. What is blocked is not fractions but <b>narrowing</b>."
          edge:
            h: { ko: "가장 날카로운 자리 — 소수냐 줄어듦이냐", en: "The sharpest spot — fractions or narrowing" }
            code:
              - "double d{3.5};   // 통과"
              - "int x{3.5};      // 멈춘다"
      - t:
          ko: "중괄호가 목록을 만드는 문법이라 값 하나를 못 받아서"
          en: "Because braces make a list and cannot take a single value"
        diag:
          t:
            ko: "값 하나도 받습니다. <code>int x{3};</code> 는 그대로 통과해요 — 3 은 줄어드는 변환이 아니니까요."
            en: "A single value is fine: <code>int x{3};</code> passes, because 3 is not a narrowing."
          edge:
            h: { ko: "가장 날카로운 자리 — 개수냐 줄어듦이냐", en: "The sharpest spot — the count or the narrowing" }
            code:
              - "int x{3};        // 통과"
              - "int x{3.5};      // 멈춘다"
      - t:
          ko: "등호 쪽이 옛날 문법이라 검사를 덜 해서"
          en: "Because the equals form is older and checked less"
        diag:
          t:
            ko: "검사를 덜 하는 것이 아니라 <b>규칙이 다릅니다</b>. 등호 쪽에서는 줄어드는 변환이 허용된 동작이에요."
            en: "It is not checked less; the <b>rule is different</b>. On the equals side narrowing is allowed behaviour."
          edge:
            h: { ko: "가장 날카로운 자리 — 검사냐 규칙이냐", en: "The sharpest spot — a check or a rule" }
            code:
              - "int x = 3.5;     // 허용된 잘림"
              - "int x{3.5};      // 금지된 잘림"
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 값을 <b>다른 타입으로 옮깁니다</b>."
      en: "Choose what goes in the blank. Line {{site.line}} <b>moves a value into another type</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "static_cast", mono: true }
      - t: "reinterpret_cast"
        mono: true
        diag:
          t:
            ko: "이건 값을 옮기는 것이 아니라 <b>같은 비트를 다른 타입으로 읽으라</b>는 것입니다. 값이 안 옮겨져서 결과가 뜻 없는 수가 될 수 있어요."
            en: "That does not move a value; it says <b>read the same bits as another type</b>. Nothing is converted, so the result can be meaningless."
          edge:
            h: { ko: "가장 날카로운 자리 — 값이냐 비트냐", en: "The sharpest spot — the value or the bits" }
            code:
              - "static_cast<int>(3.9);      // 3"
              - "reinterpret_cast<int&>(d);  // 비트를 그대로 읽는다"
      - t: "const_cast"
        mono: true
        diag:
          t:
            ko: "이건 <b>못 만진다는 약속만</b> 떼어 냅니다. 타입은 그대로라 수를 다른 수로 바꾸지 않아요."
            en: "That removes only the <b>promise not to touch</b>. The type stays, so it turns no number into another."
          edge:
            h: { ko: "가장 날카로운 자리 — 값이냐 약속이냐", en: "The sharpest spot — the value or the promise" }
            code:
              - "static_cast<int>(d);   // 값을 옮긴다"
              - "const_cast<int&>(cr);  // 약속을 뗀다"
      - t: "dynamic_cast"
        mono: true
        diag:
          t:
            ko: "이건 <b>실제로 그 타입이 맞는지</b> 실행할 때 확인합니다. 상속 관계에서만 서고, 수를 옮기는 자리에는 안 와요."
            en: "That checks <b>at run time whether the type really is</b> what you claim. It stands only inside an inheritance tree, not where numbers move."
          edge:
            h: { ko: "가장 날카로운 자리 — 수냐 상속이냐", en: "The sharpest spot — numbers or inheritance" }
            code:
              - "static_cast<int>(d);        // 수를 옮긴다"
              - "dynamic_cast<Derived*>(p);  // 맞는지 확인한다"
why_gate:
  q:
    ko: "왜 <b>이름이 긴 변환</b>을 두고 괄호 하나짜리를 안 쓸까요?"
    en: "Why use <b>the long-named conversions</b> instead of the one with just brackets?"
  choices:
    - t:
        ko: "무엇을 하려는 변환인지가 이름에 적혀서 — 값을 옮기는 것과 비트를 다시 읽는 것을 읽는 사람이 가를 수 있으니까"
        en: "Because the name says which conversion it is, so a reader can tell moving a value from re-reading bits"
      ok: true
      fb:
        ko: "그 방향입니다. 찾기 쉬워지는 것도 이득인데 그것도 한 줄로 적어 보세요."
        en: "That is the direction. Being easy to search for is another gain — add that too."
    - t:
        ko: "괄호 하나짜리가 더 느려서"
        en: "Because the bracket form is slower"
      ok: false
      fb:
        ko: "속도는 같습니다. 같은 기계 코드가 나오고 다른 것은 <b>사람이 읽는 것</b>뿐이에요."
        en: "The speed is the same. The machine code matches; only <b>what a person reads</b> differs."
    - t:
        ko: "괄호 하나짜리는 C++ 에서 못 써서"
        en: "Because the bracket form does not work in C++"
      ok: false
      fb:
        ko: "됩니다. 되는데도 안 쓰는 이유가 이 판의 요점이에요."
        en: "It works. Why it is avoided even though it works is the point of this plate."
queries:
  - { grammars: [cpp], file: ./conversion.scm }
examples:
  - code: "void f() { int n = static_cast<int>(3.9); }   // n -> 3 (int, 버려진다)"
    expect: { sites: 1, form: named-cast, hole: "static_cast", picks: { 1: "static_cast", 2: "int", 3: "3.9" } }
  - code: "void f() { int x{3}; }                        // x -> 3 (int, 줄어들면 멈춘다)"
    expect: { sites: 1, form: braced, picks: { 1: "x", 2: "int", 3: "3" } }
  - code: "void f() { int n = 3; }                       // 바꿀 타입이 없다"
    expect: none
