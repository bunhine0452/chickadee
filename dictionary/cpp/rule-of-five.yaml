schema: 1
id: cpp/rule-of-five
# §4 심화 #29. `universal: null` — 다섯이라는 셈 자체가 이 언어의 값 의미론에서만 나온다.
# 다른 언어에는 복사 생성자도 이동 대입도 없어 걸 곳이 없다 (D4).
universal: null
name: { ko: 다섯을 함께 정하기, en: Rule of five }
token: "default"
grammars: [cpp]
framework: null
essential: true
difficulty: 4
prereq: [cpp/destructor, cpp/move, cpp/constructor]
confusions: []
dict:
  one_liner:
    ko: "하나를 적으면 나머지 넷도 적어야 한다. 안 적으면 컴파일러가 얕게 복사한다."
    en: "Write one and the other four follow; otherwise the compiler copies shallowly."
  why:
    ko: >-
      타입 하나에는 <b>다섯 자리</b>가 딸려 있습니다 — 끝날 때 도는 함수, 복사로 만들기,
      복사로 넣기, 가져와서 만들기, 가져와서 넣기. 안 적으면 컴파일러가 <b>대신 만들어
      줍니다</b>. 그런데 컴파일러가 만드는 복사는 <b>멤버를 그대로 옮기는 얕은 복사</b>라,
      멤버 중에 손으로 잡은 자리를 가리키는 것이 있으면 <b>두 객체가 같은 자리를 가리키고
      둘 다 놓아 줍니다.</b> 대개는 아무 일도 안 일어나다가 어느 날 터져요.
      그래서 다섯 중 하나를 적었다면 나머지도 함께 정해야 합니다 — {{site.line}}행처럼
      「기본 그대로」나 「막는다」를 못 박는 것도 정하는 방법입니다.
    en: >-
      Every type carries <b>five slots</b>: the end-of-life function, making by copy, putting by
      copy, making by taking, putting by taking. Write none and the compiler <b>makes them for
      you</b>. But the copy it makes is a <b>shallow member-by-member copy</b>, so if one member
      points at hand-taken room, <b>two objects point at one place and both release it</b>. Most
      runs show nothing, and then one day it breaks. So once one of the five is written, the rest
      have to be settled too — and pinning “as the default” or “forbidden”, as on line
      {{site.line}}, counts as settling.
  trace:
    - ko: "{{site.line}}행은 다섯 중 하나를 못 박는다."
      en: "Line {{site.line}} pins one of the five."
    - ko: "{{pick.1|code}}{{pick.1|josa:은,는}} 컴파일러가 만든 것을 그대로 쓸지 막을지 정한다."
      en: "{{pick.1|code}} says whether the compiler-made one is kept or forbidden."
    - ko: "적지 않은 나머지는 여전히 컴파일러가 만든다."
      en: "Whatever is not written is still made by the compiler."
rule:
  ko: "<b>하나를 적으면 다섯을 다 정한다.</b> 안 적힌 것은 얕은 복사로 만들어진다."
  en: "<b>Write one and settle all five.</b> What is unwritten is made as a shallow copy."
result:
  label: { ko: "{{site.line}}행이 정한 자리", en: "the slot settled on line {{site.line}}" }
  value: "{{pick.2}}{{pick.3}} = {{pick.1}}"
  note: { ko: "다섯 중 하나다", en: "one of the five" }
ok:
  ko: "{{pick.2|code}} 자리가 {{pick.1|code}}{{pick.1|josa:으로,로}} 못 박혔습니다."
  en: "The {{pick.2|code}} slot is pinned as {{pick.1|code}}."
payoff:
  ko: >-
    이걸 알면 「같은 자리를 두 번 놓아서 터진다」가 풀립니다 — 복사가 얕았어요.
  en: >-
    This untangles “it crashed releasing one room twice” — the copy was shallow.
bridge:
  ko: >-
    자바·파이썬에는 이 다섯이 <b>없습니다</b> — 대입이 참조 복사라 나눌 것이 없어요.
    러스트는 기본이 이동이라 이 표가 다른 모양으로 섭니다.
  en: >-
    Java and Python have <b>none of these five</b> — assignment copies a reference, so there is
    nothing to split. Rust makes moving the default, so the same table takes another shape.
misconceptions:
  # `cpp.md` §9 #5.
  - ko: "안 적으면 아무 일도 안 난다 — 컴파일러가 얕은 복사본을 대신 만듭니다."
    en: "Writing none means nothing happens — the compiler makes a shallow copy for you."
  - ko: "끝날 때 도는 함수만 적으면 된다 — 그것을 적는 순간 나머지 넷도 정해야 합니다."
    en: "Only the end-of-life function is needed — writing it forces the other four."
  - ko: "돌려 봐서 안 터지면 괜찮다 — 얕은 복사는 대부분의 실행에서 조용합니다."
    en: "If a run does not crash it is fine — a shallow copy is quiet on most runs."
point:
  - q:
      ko: "{{site.line}}행에서 <b>컴파일러가 만든 것을 그대로 쓰라는 낱말</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the word that keeps the compiler-made one</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>어느 자리인지</b>를 말합니다. 그 자리를 어떻게 할지는 뒤의 낱말이 정해요."
          en: "{{pick.2|code}} says <b>which slot</b> it is. What happens to it is the word after."
        edge:
          h: { ko: "가장 날카로운 자리 — 어느 자리냐 어떻게 하느냐", en: "The sharpest spot — which slot or what to do" }
          code:
            - "W(const W&) = default;   // 그대로 쓴다"
            - "W(const W&) = delete;    // 막는다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>받는 것</b>입니다. 무엇을 받느냐가 다섯 중 어느 자리인지를 가르지만, 처리는 뒤의 낱말이 정해요."
          en: "{{pick.3|code}} is <b>what it takes</b>. That tells which of the five it is, but the handling comes from the word after."
        edge:
          h: { ko: "가장 날카로운 자리 — 받는 것이냐 처리냐", en: "The sharpest spot — the input or the handling" }
          code:
            - "W(const W&)   // 복사로 만들기"
            - "W(W&&)        // 가져와서 만들기"
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 컴파일러가 만든 것을 <b>그대로 쓴다</b>고 못 박습니다."
      en: "Choose what goes in the blank. Line {{site.line}} pins that the compiler-made one is <b>kept</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "default", mono: true }
      - t: "delete"
        mono: true
        diag:
          t:
            ko: "이건 그 자리를 <b>막습니다</b>. 그 방식으로 만들거나 넣으려 하면 컴파일이 멈춰요 — 혼자 갖는 소유 타입이 복사를 막는 방법이 이것입니다."
            en: "That <b>forbids</b> the slot: making or putting that way stops compiling. It is how the single-owner type blocks copying."
          edge:
            h: { ko: "가장 날카로운 자리 — 쓰느냐 막느냐", en: "The sharpest spot — keep or forbid" }
            code:
              - "W(const W&) = default;   // 복사된다"
              - "W(const W&) = delete;    // 멈춘다"
      - t: "0"
        mono: true
        diag:
          t:
            ko: "이 자리에 0 을 적는 것은 <b>몸통이 없다</b>는 표시라, 하위 타입이 반드시 적게 만드는 자리에 씁니다. 다섯을 정하는 자리와 달라요."
            en: "Writing 0 here means <b>there is no body</b> and forces subtypes to write one. That is a different job from settling the five."
          edge:
            h: { ko: "가장 날카로운 자리 — 정하기냐 미루기냐", en: "The sharpest spot — settling or deferring" }
            code:
              - "W(const W&) = default;"
              - "virtual void draw() = 0;"
      - t: "override"
        mono: true
        diag:
          t:
            ko: "이건 <b>재정의임을 확인시키는</b> 표시라 등호 뒤에 안 옵니다. 다섯 자리와도 상관이 없어요."
            en: "That mark <b>confirms a re-definition</b> and never follows an equals sign. It has nothing to do with the five."
          edge:
            h: { ko: "가장 날카로운 자리 — 다섯이냐 재정의냐", en: "The sharpest spot — the five or re-definition" }
            code:
              - "W(const W&) = default;"
              - "void draw() override;"
why_gate:
  q:
    ko: "하나를 적으면 왜 <b>나머지도 정해야</b> 할까요?"
    en: "Why does writing one force <b>settling the rest</b>?"
  choices:
    - t:
        ko: "하나를 적었다는 것은 이 타입이 무언가를 스스로 관리한다는 뜻이기 때문 — 그러면 복사와 이동도 그 관리에 맞춰야 한다"
        en: "Because writing one means the type manages something itself, and copying and moving must match that management"
      ok: true
      fb:
        ko: "그 방향입니다. 관리를 아예 다른 타입에 맡기면 이 표가 어떻게 되는지도 적어 보세요."
        en: "That is the direction. Add what happens to this table when the management is delegated to another type."
    - t:
        ko: "규격이 다섯을 함께 적으라고 정해서"
        en: "Because the standard says to write all five"
      ok: false
      fb:
        ko: "규격이 아니라 <b>얕은 복사가 부르는 사고</b>에서 나온 규약입니다."
        en: "It is not the standard but a convention that came from <b>the accident shallow copying causes</b>."
    - t:
        ko: "컴파일러가 나머지를 안 만들어 줘서"
        en: "Because the compiler will not make the rest"
      ok: false
      fb:
        ko: "만들어 줍니다. 문제는 만들어 준 것이 <b>이 타입에 안 맞는다</b>는 거예요."
        en: "It does make them. The problem is that what it makes <b>does not fit this type</b>."
queries:
  - { grammars: [cpp], file: ./rule-of-five.scm }
examples:
  - code: "struct W { W(const W& o) = default; };    // 컴파일러가 만든 복사를 그대로 쓴다"
    expect: { sites: 1, form: defaulted, hole: "default", picks: { 1: "default", 2: "W", 3: "(const W& o)" } }
  - code: "struct W { W(const W& o) = delete; };     // 복사를 막는다"
    expect: { sites: 1, form: deleted, hole: "delete", picks: { 1: "delete", 2: "W" } }
  - code: "struct W { void set(int x); };            // 다섯 중 어느 자리도 아니다"
    expect: none
