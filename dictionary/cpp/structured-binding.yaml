schema: 1
id: cpp/structured-binding
# §4 심화 #30. `common/destructuring` 이 보편형이다 — 「한 번에 꺼내 이름을 붙인다」까지
# 전이되고, 「기본이 복사다」는 C++ 쪽 어긋남이라 판에만 있다.
universal: common/destructuring
name: { ko: 한 번에 꺼내 이름 붙이기, en: Structured binding }
token: "auto ["
grammars: [cpp]
framework: null
essential: true
difficulty: 3
prereq: [cpp/auto, cpp/std-vector, cpp/range-for]
confusions: []
dict:
  one_liner:
    ko: "묶음을 한 줄에서 조각내 이름을 붙인다. 기본은 복사라 원본이 안 바뀐다."
    en: "Splits a bundle into names on one line; by default it copies."
  why:
    ko: >-
      쌍으로 된 값을 <code>first</code>·<code>second</code> 로 꺼내면 읽는 사람이 무엇이
      들었는지 알 수 없습니다. {{site.line}}행은 그 자리에 <b>이름을 붙입니다</b> —
      조각마다 뜻이 있는 이름이 붙어 다음 줄부터 읽기가 쉬워져요.
      여기에 C++ 의 기본값이 그대로 붙습니다: <b>참조를 안 적으면 복사</b>입니다.
      맵을 훑으면서 값을 고치려면 <code>auto&amp;</code> 라고 적어야 하고, 안 그러면
      복사본을 고치게 돼요. 그리고 이름 자리에 <b>타입을 못 적습니다</b> — 조각마다
      타입이 다를 수 있어서 언어가 그 자리를 안 열어 놨어요.
    en: >-
      Pulling a pair apart as <code>first</code> and <code>second</code> tells a reader nothing
      about what is inside. Line {{site.line}} <b>gives the pieces names</b>, and every line after
      it reads better. C++'s default applies here too: <b>without a reference it copies</b>. To
      edit values while walking a map you write <code>auto&amp;</code>; otherwise a copy is
      edited. And <b>no type may be written</b> in that slot — the pieces can have different
      types, so the language never opened that place.
  trace:
    - ko: "{{site.line}}행은 {{pick.3|code}}{{pick.3|josa:을,를}} 조각낸다."
      en: "Line {{site.line}} splits {{pick.3|code}} apart."
    - ko: "{{pick.2|code}} 안의 이름들이 조각마다 하나씩 붙는다."
      en: "The names inside {{pick.2|code}} attach one per piece."
    - ko: "{{pick.1|code}} 에 참조가 없으면 조각은 복사본이다."
      en: "With no reference on {{pick.1|code}} the pieces are copies."
rule:
  ko: "<b>조각마다 이름이 붙고 기본은 복사다.</b> 원본을 고치려면 참조를 적는다."
  en: "<b>Each piece gets a name and copies by default.</b> A reference is needed to edit."
result:
  label: { ko: "{{site.line}}행이 붙인 이름들", en: "the names attached on line {{site.line}}" }
  value: "{{pick.1}} {{pick.2}}"
  note: { ko: "참조가 없으면 복사본이다", en: "with no reference they are copies" }
ok:
  ko: "{{pick.2|code}} 의 이름들이 조각마다 하나씩 붙었습니다."
  en: "The names in {{pick.2|code}} are attached one per piece."
payoff:
  ko: >-
    이걸 알면 「맵을 훑으며 고쳤는데 그대로다」가 풀립니다 — 조각이 복사본이었어요.
  en: >-
    This untangles “I edited while walking the map and nothing changed” — the pieces were copies.
bridge:
  ko: >-
    JS·파이썬에도 같은 모양이 있지만 <b>복사냐 아니냐를 고를 일이 없습니다</b>.
    C++ 은 여기서도 한 글자가 그것을 정해요.
  en: >-
    JS and Python have the same shape but <b>no copy-or-not to choose</b>. In C++ one symbol
    decides it here as well.
misconceptions:
  - ko: "조각이 원본을 가리킨다 — 참조를 안 적으면 복사본입니다."
    en: "The pieces name the original — without a reference they are copies."
  - ko: "이름 자리에 타입을 적을 수 있다 — 못 적습니다. 조각마다 타입이 다를 수 있어서예요."
    en: "A type may be written in the name slot — it may not; the pieces can differ in type."
  - ko: "이름 개수가 달라도 된다 — 조각 수와 정확히 같아야 합니다."
    en: "The name count may differ — it must match the piece count exactly."
point:
  - q:
      ko: "{{site.line}}행에서 <b>조각마다 붙는 이름들</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the names attached to the pieces</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.2
    diag:
      pick.1:
        t:
          ko: "{{pick.1|code}}{{pick.1|josa:은,는}} <b>타입을 오른쪽에서 정하라</b>는 표시입니다. 이 자리에는 다른 것이 못 오고, 이름은 그 뒤 대괄호 안이에요."
          en: "{{pick.1|code}} says <b>settle the type from the right</b>. Nothing else stands here, and the names are inside the brackets after it."
        edge:
          h: { ko: "가장 날카로운 자리 — 표시냐 이름들이냐", en: "The sharpest spot — the mark or the names" }
          code:
            - "auto [k, v] = p;      // 선다"
            - "int [k, v] = p;       // 멈춘다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>조각날 묶음</b>입니다. 이름이 붙는 것은 그 왼쪽이에요."
          en: "{{pick.3|code}} is the <b>bundle being split</b>. The names attach on its left."
        edge:
          h: { ko: "가장 날카로운 자리 — 묶음이냐 이름들이냐", en: "The sharpest spot — the bundle or the names" }
          code:
            - "p;                    // 묶음 그대로"
            - "auto [k, v] = p;      // 조각마다 이름"
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 묶음을 조각내 <b>이름을 붙입니다</b>."
      en: "Choose what goes in the blank. Line {{site.line}} splits a bundle and <b>names the pieces</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "auto", mono: true }
      - t: "int"
        mono: true
        diag:
          t:
            ko: "이 자리에는 타입을 <b>못 적습니다</b>. 조각마다 타입이 다를 수 있어서 언어가 그 자리를 안 열어 놨어요."
            en: "A type <b>may not be written</b> here. The pieces can differ in type, so the language never opened that place."
          edge:
            h: { ko: "가장 날카로운 자리 — 타입을 적을 수 있느냐", en: "The sharpest spot — may a type be written" }
            code:
              - "auto [k, v] = p;   // 선다"
              - "int [k, v] = p;    // 멈춘다"
      - t: "const"
        mono: true
        diag:
          t:
            ko: "이건 <b>못 만진다는 약속</b>이지 타입 자리를 채우는 것이 아닙니다. 함께 적을 수는 있지만 혼자서는 못 서요."
            en: "That is a <b>promise not to touch</b>, not a filler for the type slot. It can join, but it cannot stand alone."
          edge:
            h: { ko: "가장 날카로운 자리 — 약속이냐 타입 자리냐", en: "The sharpest spot — the promise or the type slot" }
            code:
              - "const auto [k, v] = p;  // 선다"
              - "const [k, v] = p;       // 멈춘다"
      - t: "let"
        mono: true
        diag:
          t:
            ko: "이 낱말은 C++ 에 없습니다. JS·러스트·Swift 의 표기이고, 여기서는 그런 타입 이름을 찾다가 멈춰요."
            en: "That word does not exist in C++. It is JS, Rust and Swift notation; here it stops looking for a type of that name."
          edge:
            h: { ko: "가장 날카로운 자리 — 어느 언어의 표기냐", en: "The sharpest spot — whose notation" }
            code:
              - "// JS: const [k, v] = p;"
              - "// C++: auto [k, v] = p;"
why_gate:
  q:
    ko: "이름 자리에 왜 <b>타입을 못 적게</b> 했을까요?"
    en: "Why can <b>no type be written</b> in the name slot?"
  choices:
    - t:
        ko: "조각마다 타입이 다를 수 있기 때문 — 하나만 적게 하면 서로 다른 조각을 덮을 수 없다"
        en: "Because the pieces can differ in type — one written type could not cover them all"
      ok: true
      fb:
        ko: "그 방향입니다. 그럼 복사냐 아니냐는 어떻게 적는지도 한 줄로 적어 보세요."
        en: "That is the direction. Add a line on how copy-or-not is written instead."
    - t:
        ko: "타입을 적으면 느려져서"
        en: "Because writing a type would be slower"
      ok: false
      fb:
        ko: "속도와 상관없습니다. 적을 <b>타입이 하나가 아니라서</b> 못 적는 거예요."
        en: "Speed is unrelated. It cannot be written because <b>there is not one type to write</b>."
    - t:
        ko: "문법이 아직 안 들어와서"
        en: "Because the syntax has not arrived"
      ok: false
      fb:
        ko: "안 만든 것이 아니라 <b>적을 것이 하나가 아니라서</b> 안 여는 자리입니다."
        en: "It was not omitted; the place stays shut because <b>there is not a single thing to write</b>."
queries:
  - { grammars: [cpp], file: ./structured-binding.scm }
examples:
  - code: "void f() { auto [k, v] = p; }             // k, v -> p 의 조각들의 복사본"
    expect: { sites: 1, form: bind, hole: "auto", picks: { 1: "auto", 2: "[k, v]", 3: "p" } }
  - code: "void f() { for (auto [k, v] : m) { } }    // 매 바퀴 조각이 복사된다"
    expect: { sites: 1, form: bind-loop, hole: "auto", picks: { 1: "auto", 2: "[k, v]", 3: "m" } }
  - code: "void f() { auto x = p; }                  // 조각내지 않는다"
    expect: none
