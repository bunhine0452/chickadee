schema: 1
id: cpp/auto
# 0부 §0.4 가 §3 중심 18 에서 올려 온 개념이다. `common/type-inference` 는 **아직 없다** —
# Go `x := 1` · Rust `let x = 1` · Swift `let x = 1` 넷에서 성립하는 후보로 보고했고,
# 서면 그때 건다.
universal: null
name: { ko: 타입 말 안 하기, en: auto }
token: "auto"
grammars: [cpp]
framework: null
essential: true
difficulty: 2
prereq: [cpp/variable-declaration, cs/type, cs/static-vs-dynamic-typing]
confusions: []
dict:
  one_liner:
    ko: "타입이 없는 게 아니라 안 적는 것이다. 컴파일러가 오른쪽을 보고 한 번 정한다."
    en: "The type is not missing, only unwritten — the compiler reads the right side."
  why:
    ko: >-
      {{site.line}}행에도 타입은 <b>있습니다</b>. 컴파일러가 오른쪽을 보고 정할 뿐이고,
      한 번 정해지면 그 이름의 타입은 안 바뀌어요 — 실행 중에 달라지는 파이썬과는 다릅니다.
      그런데 정하는 규칙에 함정이 하나 있습니다: <b>참조와 「못 만진다」는 약속을 떼어 냅니다.</b>
      그래서 <code>auto x = v[0];</code> 은 목록의 그 자리를 가리키는 것이 아니라
      <b>복사</b>예요. 원본을 고치려면 <code>auto&amp;</code> 라고 적어야 합니다 —
      한 글자가 줄을 하나 그릴지 둘 그릴지 정합니다.
    en: >-
      Line {{site.line}} <b>has</b> a type. The compiler simply reads the right side and settles
      it, and once settled that name's type never changes — unlike Python, where it can differ
      as the program runs. But the settling rule has a trap: <b>it strips references and the
      promise not to touch</b>. So <code>auto x = v[0];</code> does not name the slot in the
      list; it is a <b>copy</b>. To edit the original you write <code>auto&amp;</code> — one
      symbol decides whether one row is drawn or two.
  trace:
    - ko: "{{site.line}}행의 컴파일러는 {{pick.3|code}} 의 타입을 먼저 읽는다."
      en: "On line {{site.line}} the compiler first reads the type of {{pick.3|code}}."
    - ko: "거기서 참조와 못 만진다는 약속을 떼어 낸다."
      en: "From it, references and the promise not to touch are stripped."
    - ko: "남은 것이 {{pick.2|code}} 의 타입으로 못 박힌다."
      en: "What is left is pinned as the type of {{pick.2|code}}."
rule:
  ko: "<b>오른쪽을 보고 한 번 정한다.</b> 정할 때 참조와 못 만진다는 약속이 떨어진다."
  en: "<b>Settled once from the right.</b> References and the not-to-touch promise fall off."
result:
  label: { ko: "{{site.line}}행이 정한 타입", en: "the type settled on line {{site.line}}" }
  value: "{{pick.2}} = {{pick.3}}"
  note: { ko: "참조가 떨어져 복사가 된다", en: "the reference falls off and it copies" }
ok:
  ko: "{{pick.2|code}} 의 타입이 {{pick.3|code}} 에서 한 번 정해졌습니다."
  en: "The type of {{pick.2|code}} was settled once, from {{pick.3|code}}."
payoff:
  ko: >-
    이걸 알면 「반복 안에서 고쳤는데 원본이 그대로다」가 풀립니다 — 복사본을 고쳤어요.
  en: >-
    This untangles “I edited it in the loop and the original is unchanged” — a copy was edited.
bridge:
  ko: >-
    파이썬은 실행 중에 타입이 달라질 수 있습니다. 여기서는 컴파일할 때 한 번 정해지고
    끝이라, <b>안 적었다</b>와 <b>없다</b>가 다릅니다.
  en: >-
    In Python a type can differ as the program runs. Here it is settled once at compile time, so
    <b>unwritten</b> and <b>absent</b> are different things.
misconceptions:
  # `cpp.md` §9 #12.
  - ko: "타입이 없다 — 있습니다. 안 적었을 뿐이고 실행 중에 안 바뀝니다."
    en: "There is no type — there is; it is unwritten and never changes at run time."
  - ko: "동적 타입이다 — 컴파일할 때 정해집니다. 파이썬과 반대예요."
    en: "It is dynamic typing — it is settled at compile time, the opposite of Python."
  - ko: "<code>auto x = v[0];</code> 은 목록의 그 자리다 — 복사입니다. 참조를 도로 붙여야 그 자리예요."
    en: "<code>auto x = v[0];</code> names the slot — it copies; add the reference back to name it."
point:
  - q:
      ko: "{{site.line}}행에서 <b>타입을 오른쪽에서 정하라는 표시</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the mark that says settle the type from the right</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>이름</b>입니다. 타입을 정하는 일은 앞의 표시가 하고, 이름은 그 결과를 받을 뿐이에요."
          en: "{{pick.2|code}} is the <b>name</b>. Settling the type is the mark's job; the name only receives the result."
        edge:
          h: { ko: "가장 날카로운 자리 — 이름이냐 표시냐", en: "The sharpest spot — the name or the mark" }
          code:
            - "auto x = v[0];    // 복사"
            - "auto& x = v[0];   // 그 자리"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>읽히는 쪽</b>입니다. 여기서 참조와 약속이 떨어져 나간 뒤에 타입이 정해져요."
          en: "{{pick.3|code}} is <b>what gets read</b>. The type is settled after references and promises are stripped from it."
        edge:
          h: { ko: "가장 날카로운 자리 — 읽히는 값이냐 정하는 표시냐", en: "The sharpest spot — the read value or the mark" }
          code:
            - "const int& r = n;"
            - "auto y = r;       // const 도 & 도 떨어진다"
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 타입을 <b>오른쪽에서 정하게</b> 둡니다."
      en: "Choose what goes in the blank. Line {{site.line}} lets the type be <b>settled from the right</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "auto", mono: true }
      - t: "var"
        mono: true
        diag:
          t:
            ko: "이 낱말은 C++ 에 없습니다. 자바스크립트·C# 의 표기이고, 여기서는 그런 타입 이름을 찾다가 멈춰요."
            en: "That word does not exist in C++. It is JavaScript and C# notation; here it stops while looking for a type of that name."
          edge:
            h: { ko: "가장 날카로운 자리 — 어느 언어의 표기냐", en: "The sharpest spot — whose notation" }
            code:
              - "// JS: var x = 3;"
              - "// C++: auto x = 3;"
      - t: "int"
        mono: true
        diag:
          t:
            ko: "이건 타입을 <b>사람이 못 박는</b> 쪽입니다. 오른쪽이 다른 타입이면 그 자리에서 변환이 일어나고, 줄어들면 값이 잘려요."
            en: "That <b>pins the type by hand</b>. If the right side is another type a conversion happens right there, and narrowing cuts the value."
          edge:
            h: { ko: "가장 날카로운 자리 — 정하느냐 못 박느냐", en: "The sharpest spot — settling or pinning" }
            code:
              - "auto x = 3.9;   // 3.9"
              - "int x = 3.9;    // 3"
      - t: "const"
        mono: true
        diag:
          t:
            ko: "이건 <b>못 만진다는 약속</b>이지 타입이 아닙니다. 타입 자리가 비면 무엇을 담을지 알 수 없어 멈춰요."
            en: "That is a <b>promise not to touch</b>, not a type. With the type slot empty there is nothing to hold, and it stops."
          edge:
            h: { ko: "가장 날카로운 자리 — 타입이냐 약속이냐", en: "The sharpest spot — a type or a promise" }
            code:
              - "const auto x = 3;   // 약속 + 타입"
              - "const x = 3;        // 타입이 없다"
why_gate:
  q:
    ko: "타입을 정할 때 왜 <b>참조를 떼어 낼까요</b>?"
    en: "Why are <b>references stripped</b> when the type is settled?"
  choices:
    - t:
        ko: "이름 하나가 곧 값이라는 기본 규칙을 지키려고 — 참조를 원하면 그 자리에 한 글자를 적게 한 것이다"
        en: "To keep the default that a name is a value — wanting a reference means writing one symbol for it"
      ok: true
      fb:
        ko: "그 방향입니다. 그 기본값이 비싸지는 자리도 하나 적어 보세요."
        en: "That is the direction. Add one place where that default gets expensive."
    - t:
        ko: "참조를 담을 수 있는 타입이 없어서"
        en: "Because no type can hold a reference"
      ok: false
      fb:
        ko: "담을 수 있습니다. <code>auto&amp;</code> 라고 적으면 그대로 참조예요."
        en: "It can. Write <code>auto&amp;</code> and it stays a reference."
    - t:
        ko: "복사가 참조보다 빨라서"
        en: "Because copying is faster than referring"
      ok: false
      fb:
        ko: "원소가 많으면 훨씬 느립니다. 고른 것은 속도가 아니라 <b>기본값</b>이에요."
        en: "With many elements it is far slower. What was chosen is a <b>default</b>, not speed."
queries:
  - { grammars: [cpp], file: ./auto.scm }
examples:
  - code: "void f() { auto x = v[0]; }               // x -> v[0] 의 복사본"
    expect: { sites: 1, form: auto, hole: "auto", picks: { 1: "auto", 2: "x", 3: "v[0]" } }
  - code: "void f() { auto& y = v[0]; }              // y -> v[0] 그 자리"
    expect: { sites: 1, form: autoref, hole: "auto", picks: { 1: "auto", 2: "y", 3: "v[0]" } }
  - code: "void f() { int x = 3; }                   // 타입을 사람이 적었다"
    expect: none
