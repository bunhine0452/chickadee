schema: 1
id: cpp/arithmetic
# 0부 §0.1 #8, 축 5. 보편형 `common/arithmetic` 은 「식이 값을 낸다」까지고, 「정수 둘의
# 나누기가 정수다」는 언어마다 갈리는 자리라 판에만 있다.
universal: common/arithmetic
name: { ko: 셈하기, en: Arithmetic }
token: "/"
grammars: [cpp]
framework: null
essential: true
difficulty: 1
prereq: [cpp/integer-type, cs/integer-overflow]
confusions: []
dict:
  one_liner:
    ko: "양쪽이 정수면 나눈 결과도 정수다. 소수점 아래는 반올림이 아니라 버려진다."
    en: "Two whole numbers divide to a whole number; the tail is dropped, not rounded."
  why:
    ko: >-
      {{site.line}}행에서 결과의 타입을 정하는 것은 <b>양쪽 값의 타입</b>입니다. 둘 다
      정수면 결과도 정수라 <code>7 / 2</code> 는 3 이에요 — 3.5 가 나왔다가 잘리는 것이
      아니라 처음부터 정수 나누기입니다. 그리고 잘리는 방향은 <b>0 쪽</b>이라
      <code>-7 / 2</code> 는 −4 가 아니라 −3 입니다. 소수를 원하면 한쪽을 소수로 적어야
      해요 — <code>7 / 2.0</code> 이면 왼쪽이 소수로 끌어올려져 3.5 가 됩니다.
    en: >-
      What fixes the type of the result on line {{site.line}} is <b>the types of the two sides</b>.
      Both whole means the result is whole, so <code>7 / 2</code> is 3 — not 3.5 cut short, but
      whole-number division from the start. And the cut goes <b>toward zero</b>, so
      <code>-7 / 2</code> is −3, not −4. To get a fraction one side has to be written as one:
      <code>7 / 2.0</code> pulls the left side up and gives 3.5.
  trace:
    - ko: "{{pick.2|code}}{{pick.2|josa:과,와}} {{pick.3|code}} 의 타입이 먼저 결과의 타입을 정한다."
      en: "The types of {{pick.2|code}} and {{pick.3|code}} fix the type of the result first."
    - ko: "둘 다 정수면 {{site.line}}행은 정수 나누기가 된다."
      en: "With both whole, line {{site.line}} becomes whole-number division."
    - ko: "소수점 아래는 0 쪽으로 잘린다."
      en: "Anything past the point is cut toward zero."
rule:
  ko: "<b>결과의 타입은 양쪽이 정한다.</b> 둘 다 정수면 나누기도 정수 나누기다."
  en: "<b>The two sides fix the result's type.</b> Both whole means whole-number division."
result:
  label: { ko: "{{site.line}}행의 셈", en: "the arithmetic on line {{site.line}}" }
  value: "{{pick.2}} {{pick.1}} {{pick.3}}"
  note: { ko: "양쪽 타입이 결과를 정한다", en: "the two types fix the result" }
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:과,와}} {{pick.3|code}}{{pick.3|josa:이,가}} 둘 다 정수면 결과도 정수입니다."
  en: "With {{pick.2|code}} and {{pick.3|code}} both whole, the result is whole."
payoff:
  ko: >-
    이걸 알면 「평균이 자꾸 0 이 나온다」가 풀립니다 — 나누기 전에 이미 정수였습니다.
  en: >-
    This untangles “the average keeps coming out zero” — it was whole before the division.
bridge:
  ko: >-
    파이썬은 같은 줄에서 3.5 를 냅니다. 정수 나누기를 하려면 기호를 둘 적어야 하죠.
    C++ 은 반대라 <b>기본이 정수 나누기</b>입니다.
  en: >-
    Python gives 3.5 on the same line and needs a doubled symbol for whole-number division.
    C++ is the other way round: <b>whole-number division is the default</b>.
misconceptions:
  # `cpp.md` §9 #8.
  - ko: "<code>7 / 2</code> 는 3.5 다 — 양쪽이 정수면 3 입니다."
    en: "<code>7 / 2</code> is 3.5 — with both sides whole it is 3."
  - ko: "3.5 가 나왔다가 반올림된다 — 처음부터 정수 나누기라 4 가 아니라 3 이에요."
    en: "It makes 3.5 and rounds — it is whole-number division from the start, so 3 not 4."
  - ko: "음수는 더 작은 쪽으로 잘린다 — 0 쪽으로 잘려 <code>-7 / 2</code> 는 −3 입니다."
    en: "Negatives cut downward — they cut toward zero, so <code>-7 / 2</code> is −3."
point:
  - q:
      ko: "{{site.line}}행에서 <b>결과의 타입이 걸리는 기호</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the symbol where the result's type is decided</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>왼쪽 재료</b>입니다. 재료의 타입이 결과를 정하긴 하지만, 자르는 일은 가운데 기호가 해요."
          en: "{{pick.2|code}} is the <b>left input</b>. Its type helps fix the result, but the cutting is done by the symbol between."
        edge:
          h: { ko: "가장 날카로운 자리 — 재료냐 셈이냐", en: "The sharpest spot — an input or the arithmetic" }
          code:
            - "7;          // 그냥 값"
            - "7 / 2;      // 잘린 값 3"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>오른쪽 재료</b>입니다. 여기를 <code>2.0</code> 으로 적으면 결과가 소수가 돼요."
          en: "{{pick.3|code}} is the <b>right input</b>. Write it as <code>2.0</code> and the result becomes fractional."
        edge:
          h: { ko: "가장 날카로운 자리 — 정수냐 소수냐", en: "The sharpest spot — whole or fractional" }
          code:
            - "7 / 2;      // 3"
            - "7 / 2.0;    // 3.5"
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 왼쪽을 오른쪽으로 <b>나눕니다</b>."
      en: "Choose what goes in the blank. Line {{site.line}} <b>divides</b> the left by the right."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "/", mono: true }
      - t: "%"
        mono: true
        diag:
          t:
            ko: "이건 나눈 <b>나머지</b>를 냅니다. 몫이 아니라 남는 것이라 <code>7</code> 과 <code>2</code> 로는 1 이 나와요."
            en: "That gives the <b>remainder</b>, not the quotient — with <code>7</code> and <code>2</code> it is 1."
          edge:
            h: { ko: "가장 날카로운 자리 — 몫이냐 나머지냐", en: "The sharpest spot — quotient or remainder" }
            code:
              - "7 / 2;      // 3"
              - "7 % 2;      // 1"
      - t: "*"
        mono: true
        diag:
          t:
            ko: "이건 <b>곱하기</b>라 값이 커집니다. 나누기와 달리 결과가 잘릴 일이 없어요."
            en: "That <b>multiplies</b>, so the value grows. Unlike division nothing gets cut."
          edge:
            h: { ko: "가장 날카로운 자리 — 나누느냐 곱하느냐", en: "The sharpest spot — divide or multiply" }
            code:
              - "7 / 2;      // 3"
              - "7 * 2;      // 14"
      - t: "//"
        mono: true
        diag:
          t:
            ko: "기호 둘짜리는 <b>파이썬</b>의 정수 나누기입니다. C++ 에서는 그 자리부터 주석이라 뒤가 통째로 사라져요."
            en: "The doubled form is <b>Python's</b> whole-number division. In C++ it starts a comment and the rest of the line vanishes."
          edge:
            h: { ko: "가장 날카로운 자리 — 셈이냐 주석이냐", en: "The sharpest spot — arithmetic or a comment" }
            code:
              - "# Python: 7 // 2 는 3"
              - "// C++: 여기부터 주석"
why_gate:
  q:
    ko: "이 언어는 왜 정수 둘의 나누기를 <b>정수로</b> 둘까요?"
    en: "Why does this language keep the division of two whole numbers <b>whole</b>?"
  choices:
    - t:
        ko: "결과의 타입을 재료의 타입에서 정하기로 했기 때문 — 그래야 컴파일할 때 타입이 정해지니까"
        en: "Because the result's type is decided from the inputs' types, so it is settled at compile time"
      ok: true
      fb:
        ko: "그 방향입니다. 결과 타입이 실행할 때 정해지면 무엇이 곤란한지도 적어 보세요."
        en: "That is the direction. Add what breaks if the result's type is settled at run time."
    - t:
        ko: "소수 나누기가 느려서"
        en: "Because fractional division is slow"
      ok: false
      fb:
        ko: "속도 문제가 아닙니다. 한쪽을 소수로 적으면 그 자리에서 소수 나누기가 돼요."
        en: "Speed is not it. Write one side as a fraction and it becomes fractional right there."
    - t:
        ko: "정수만 담을 수 있어서"
        en: "Because only whole numbers can be held"
      ok: false
      fb:
        ko: "소수 타입이 따로 있습니다. 문제는 <b>이 식의 결과 타입</b>이 무엇이냐예요."
        en: "There is a fractional type. The question is what <b>this expression's</b> result type is."
queries:
  - { grammars: [cpp], file: ./arithmetic.scm }
examples:
  - code: "void f() { int n = 7 / 2; }               // n -> 3 (int)"
    expect: { sites: 1, form: divide, hole: "/", picks: { 1: "/", 2: "7", 3: "2" } }
  - code: "void f() { int r = 7 % 2; }               // r -> 1 (int)"
    expect: { sites: 1, form: divide, hole: "%", picks: { 1: "%", 2: "7", 3: "2" } }
  - code: "void f() { int n = 7 + 2; }               // 더하기는 언어마다 같다"
    expect: none
