schema: 1
id: cpp/comparison
# 0부 §0.1 #9, 축 8. 보편형 `common/comparison` 은 「같은지 묻는다」까지고, 「조건 안의
# 넣기를 안 막는다」는 C++ 쪽 어긋남이라 판에만 있다.
universal: common/comparison
name: { ko: 견주기, en: Comparison }
token: "=="
grammars: [cpp]
framework: null
essential: true
difficulty: 1
prereq: [cpp/boolean-literal, cs/identity-vs-equality]
confusions: []
dict:
  one_liner:
    ko: "묻는 기호와 넣는 기호가 한 글자 차이인데, 조건 자리에서 둘 다 컴파일된다."
    en: "Asking and putting differ by one symbol, and a condition slot accepts both."
  why:
    ko: >-
      {{site.line}}행은 <b>묻기만</b> 합니다 — 두 값을 견주어 참·거짓 하나를 내놓고 아무것도
      안 바꿔요. 여기서 기호를 하나 빠뜨리면 <b>넣기</b>가 되는데, C++ 은 그것을 막지
      않습니다. 넣기도 값을 하나 돌려주고 그 값이 참·거짓으로 읽히기 때문에
      <code>if (x = 5)</code> 가 컴파일되고 조건이 <b>늘 참</b>이 되죠. 파이썬은 문법으로
      이 자리를 막았고 C++ 은 경고 한 줄로 흘려보냅니다 — 그래서 이 판이 0부에 있습니다.
    en: >-
      Line {{site.line}} only <b>asks</b>: it weighs two values, produces one truth value, and
      changes nothing. Drop one symbol and it becomes <b>putting</b>, which C++ does not forbid.
      Putting also hands back a value, and that value reads as a truth value, so
      <code>if (x = 5)</code> compiles and the condition is <b>always true</b>. Python blocks
      this spot in its grammar; C++ lets it past with a warning — which is why this plate is
      in part zero.
  trace:
    - ko: "{{pick.2|code}}{{pick.2|josa:과,와}} {{pick.3|code}}{{pick.3|josa:이,가}} 먼저 각각 값이 된다."
      en: "{{pick.2|code}} and {{pick.3|code}} each become a value first."
    - ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 둘을 견주어 참·거짓 하나를 낸다."
      en: "{{pick.1|code}} weighs them and produces one truth value."
    - ko: "{{site.line}}행이 끝나도 두 값은 그대로다."
      en: "After line {{site.line}} both values are unchanged."
rule:
  ko: "<b>견주기는 아무것도 안 바꾼다.</b> 한 글자 줄이면 넣기가 되고, 그것도 컴파일된다."
  en: "<b>Weighing changes nothing.</b> One symbol fewer makes it putting, and that compiles too."
result:
  label: { ko: "{{site.line}}행의 물음", en: "the question on line {{site.line}}" }
  value: "{{pick.2}} {{pick.1}} {{pick.3}}"
  note: { ko: "참·거짓 하나가 나온다", en: "one truth value comes out" }
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:과,와}} {{pick.3|code}}{{pick.3|josa:은,는}} 그대로 있고 참·거짓 하나가 나옵니다."
  en: "{{pick.2|code}} and {{pick.3|code}} stay as they were and one truth value comes out."
payoff:
  ko: >-
    이걸 알면 「조건이 언제나 참이다」가 풀립니다 — 묻는 자리에 넣기가 들어간 겁니다.
  en: >-
    This untangles “the condition is always true” — a putting slipped into an asking slot.
bridge:
  ko: >-
    파이썬은 조건 안의 넣기를 <b>문법으로 막습니다</b>. 러스트는 넣기의 결과가 참·거짓이
    아니라 안 맞고요. C++ 은 셋 중 유일하게 통과시킵니다.
  en: >-
    Python <b>blocks</b> putting inside a condition in its grammar. Rust rejects it because the
    result is not a truth value. C++ is the one of the three that lets it through.
misconceptions:
  # `cpp.md` §9 #9.
  - ko: "<code>if (x = 5)</code> 는 견주기다 — 넣기이고, 결과 5 가 참으로 읽혀 늘 참이 됩니다."
    en: "<code>if (x = 5)</code> weighs — it puts, and the resulting 5 reads as true."
  - ko: "컴파일러가 막아 준다 — 경고만 냅니다. 경고를 오류로 올리는 것은 사람이 켜는 설정이에요."
    en: "The compiler blocks it — it only warns. Turning warnings into errors is a switch a person flips."
  - ko: "견주기가 값을 바꾼다 — 안 바꿉니다. 참·거짓 하나만 새로 만들어져요."
    en: "Weighing changes a value — it does not; only one new truth value appears."
point:
  - q:
      ko: "{{site.line}}행에서 <b>묻기만 하고 아무것도 안 바꾸는 기호</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the symbol that only asks and changes nothing</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>견주어지는 쪽</b>입니다. 이 이름이 바뀔지 아닐지를 정하는 것은 가운데 기호예요."
          en: "{{pick.2|code}} is <b>one of the weighed sides</b>. Whether it changes is decided by the symbol between."
        edge:
          h: { ko: "가장 날카로운 자리 — 묻느냐 넣느냐", en: "The sharpest spot — asking or putting" }
          code:
            - "x == 5;    // x 는 그대로"
            - "x = 5;     // x 가 5 가 된다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>견주는 대상</b>입니다. 값 자체는 아무 일도 안 해요."
          en: "{{pick.3|code}} is <b>what it is weighed against</b>. The value itself does nothing."
        edge:
          h: { ko: "가장 날카로운 자리 — 값이냐 견주기냐", en: "The sharpest spot — the value or the weighing" }
          code:
            - "5;          // 계산되고 사라진다"
            - "x == 5;     // 참·거짓이 남는다"
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 두 값이 <b>같은지 묻습니다</b>."
      en: "Choose what goes in the blank. Line {{site.line}} <b>asks whether</b> two values match."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "==", mono: true }
      - t: "="
        mono: true
        diag:
          t:
            ko: "기호 하나짜리는 <b>넣기</b>입니다. 컴파일은 통과하고, 조건 자리라면 넣은 값이 참으로 읽혀 늘 참이 돼요."
            en: "The single symbol <b>puts</b>. It compiles, and in a condition slot the value put in reads as true, so the test always holds."
          edge:
            h: { ko: "가장 날카로운 자리 — 묻느냐 넣느냐", en: "The sharpest spot — asking or putting" }
            code:
              - "if (x == 5)   // 물어본다"
              - "if (x = 5)    // 늘 참이다"
      - t: "!="
        mono: true
        diag:
          t:
            ko: "이건 <b>다른지</b> 묻습니다. 참·거짓이 정확히 뒤집혀서 조건 안의 두 갈래가 서로 바뀌어요."
            en: "That asks whether they <b>differ</b>. The truth value flips exactly, so the two branches swap."
          edge:
            h: { ko: "가장 날카로운 자리 — 같으냐 다르냐", en: "The sharpest spot — same or different" }
            code:
              - "x == 5;    // 같으면 참"
              - "x != 5;    // 다르면 참"
      - t: "<="
        mono: true
        diag:
          t:
            ko: "이건 <b>작거나 같은지</b> 묻습니다. 같을 때도 참이라 「같다」보다 넓은 조건이에요."
            en: "That asks whether it is <b>less than or equal</b>. It is true when equal too, so it is a wider test."
          edge:
            h: { ko: "가장 날카로운 자리 — 같음이냐 범위냐", en: "The sharpest spot — equality or a range" }
            code:
              - "x == 5;    // 5 일 때만"
              - "x <= 5;    // 5 이하 전부"
why_gate:
  q:
    ko: "C++ 은 왜 <b>조건 안의 넣기를 막지 않을까요</b>?"
    en: "Why does C++ <b>not block putting inside a condition</b>?"
  choices:
    - t:
        ko: "넣기도 값을 돌려주는 식이라서 — 값이 나오는 곳이면 어디든 조건 자리에 놓을 수 있으니까"
        en: "Because putting is an expression that hands back a value, and any value may sit in a condition"
      ok: true
      fb:
        ko: "그 방향입니다. 그 규칙이 유용한 자리도 하나 적어 보세요."
        en: "That is the direction. Add one place where the rule is useful."
    - t:
        ko: "컴파일러가 두 기호를 구별 못 해서"
        en: "Because the compiler cannot tell the two symbols apart"
      ok: false
      fb:
        ko: "구별합니다. 경고까지 내고, 다만 오류로는 안 올려요."
        en: "It can, and it even warns — it simply does not raise it to an error."
    - t:
        ko: "옛날 컴파일러와의 호환 때문에"
        en: "For compatibility with old compilers"
      ok: false
      fb:
        ko: "호환이 아니라 <b>식과 문의 구분</b>에서 나온 결과입니다."
        en: "It is not compatibility but a consequence of <b>how expressions and statements are split</b>."
queries:
  - { grammars: [cpp], file: ./comparison.scm }
examples:
  - code: "void f() { bool same = (x == 5); }        // same -> x 가 5 인지 (bool)"
    expect: { sites: 1, form: compare, hole: "==", picks: { 1: "==", 2: "x", 3: "5" } }
  - code: "void f() { bool ok = (n != 0); }          // ok -> n 이 0 이 아닌지 (bool)"
    expect: { sites: 1, form: compare, hole: "!=", picks: { 1: "!=", 2: "n", 3: "0" } }
  - code: "void f() { x = 5; }                       // 넣기는 견주기가 아니다"
    expect: none
