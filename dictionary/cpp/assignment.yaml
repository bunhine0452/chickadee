schema: 1
id: cpp/assignment
# 0부 §0.1 #2. 「이름에 값을 다시 넣는다」는 보편형이 그대로 성립한다.
universal: common/reassignment
name: { ko: 이름에 값 다시 넣기, en: Assignment }
token: "="
grammars: [cpp]
framework: null
essential: true
difficulty: 1
prereq: [cpp/variable-declaration, cs/state, cs/value-vs-reference]
confusions: []
dict:
  one_liner:
    ko: "이미 있는 이름에 값을 다시 넣는다. 그 넣기는 언제나 통째 복사다."
    en: "Puts a value into a name that exists. The putting copies the whole thing."
  why:
    ko: >-
      {{site.line}}행이 하는 일은 <b>복사</b>입니다. 오른쪽이 목록이든 글자 묶음이든
      원소가 전부 새 자리에 다시 놓이고, 그 뒤로 왼쪽을 고쳐도 오른쪽은 그대로예요.
      파이썬을 먼저 배운 사람이 여기서 반대로 읽습니다 — 파이썬에서 같은 모양은
      <b>같은 것을 두 이름이 가리키게</b> 하지만 C++ 에서는 두 벌이 생깁니다.
      그리고 이 줄은 값을 하나 돌려주기도 해서, 조건 자리에 그대로 놓이면 조건이 됩니다.
    en: >-
      What line {{site.line}} does is <b>copy</b>. Whether the right side is a list or a run of
      characters, every element is laid out again in new room, and editing the left afterwards
      leaves the right untouched. Anyone who learned Python first reads this backwards — there
      the same shape makes <b>two names point at one thing</b>; in C++ two copies exist.
      This line also hands back a value, so dropped into a condition slot it becomes the test.
  trace:
    - ko: "{{pick.3|code}}{{pick.3|josa:이,가}} 먼저 값이 된다."
      en: "{{pick.3|code}} becomes a value first."
    - ko: "그 값이 통째로 {{pick.2|code}} 자리에 복사된다."
      en: "That value is copied whole into the room called {{pick.2|code}}."
    - ko: "{{site.line}}행 아래로 두 이름은 서로 다른 벌이다."
      en: "Below line {{site.line}} the two names are separate copies."
rule:
  ko: "<b>넣기는 복사다.</b> 넣은 뒤에 한쪽을 고쳐도 다른 쪽은 안 따라간다."
  en: "<b>Putting is copying.</b> Edit one side afterwards and the other does not follow."
result:
  label: { ko: "{{site.line}}행 아래의 {{pick.2}}", en: "{{pick.2}} below line {{site.line}}" }
  value: "{{pick.3}}"
  note: { ko: "오른쪽과 다른 벌이다", en: "a separate copy from the right" }
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 이제 {{pick.3|code}}{{pick.3|josa:과,와}} 같은 값을 가진 <b>다른 벌</b>입니다."
  en: "{{pick.2|code}} now holds the same value as {{pick.3|code}} but as a <b>separate copy</b>."
payoff:
  ko: >-
    이걸 알면 「목록 하나를 넘겼는데 왜 안 바뀌지」가 풀립니다 — 넘긴 것이 복사본이었어요.
  en: >-
    This untangles “I handed a list over and nothing changed” — what was handed over was a copy.
bridge:
  ko: >-
    파이썬에서 같은 모양은 이름 둘이 <b>같은 것</b>을 가리키게 합니다. C++ 은 벌을 하나 더
    만들고, 그 차이가 이 언어의 성능 사고의 절반입니다.
  en: >-
    In Python the same shape makes two names point at <b>one thing</b>. C++ makes another copy,
    and that difference is half of how this language thinks about cost.
misconceptions:
  # `cpp.md` §9 #11 · #2.
  - ko: "넣은 뒤 왼쪽을 고치면 오른쪽도 바뀐다 — 벌이 둘이라 오른쪽은 그대로입니다."
    en: "Editing the left afterwards changes the right — there are two copies; the right stays."
  - ko: "큰 값은 주소만 넘어간다 — 참조라고 적지 않으면 원소가 전부 다시 놓입니다."
    en: "Big values move by address — unless a reference is written, every element is laid out again."
  - ko: "이 줄은 값을 안 돌려준다 — 돌려줍니다. 그래서 조건 자리에 그대로 놓일 수 있어요."
    en: "This line hands nothing back — it does, which is why it can sit in a condition slot."
point:
  - q:
      ko: "{{site.line}}행에서 <b>복사를 일으키는 기호</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the symbol that causes the copy</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>받는 쪽 이름</b>입니다. 이름은 스스로 복사를 못 하고, 복사를 시키는 것은 가운데 기호예요."
          en: "{{pick.2|code}} is the <b>receiving name</b>. A name copies nothing by itself; the symbol between orders it."
        edge:
          h: { ko: "가장 날카로운 자리 — 이름이냐 넣는 일이냐", en: "The sharpest spot — the name or the putting" }
          code:
            - "v2;          // 아무 일도 안 난다"
            - "v2 = v1;     // 원소가 전부 복사된다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>복사되는 쪽</b>입니다. 이 줄이 끝나도 여기는 그대로 남아요."
          en: "{{pick.3|code}} is the <b>side being copied</b>. It is left exactly as it was."
        edge:
          h: { ko: "가장 날카로운 자리 — 복사되는 쪽이냐 시키는 기호냐", en: "The sharpest spot — the copied side or the order" }
          code:
            - "v1;          // 그대로 있다"
            - "v2 = v1;     // v1 은 여전히 그대로"
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 이름에 값을 <b>다시 넣습니다</b>."
      en: "Choose what goes in the blank. Line {{site.line}} <b>puts another value</b> into a name."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "=", mono: true }
      - t: "=="
        mono: true
        diag:
          t:
            ko: "기호 둘짜리는 <b>견주기</b>라 묻기만 하고 넣지 않습니다. 이 줄은 참·거짓을 하나 만들어 놓고 아무 데도 안 담은 채 끝나요."
            en: "The two-symbol form <b>weighs</b>: it asks and does not put. The line would make one truth value and end without keeping it."
          edge:
            h: { ko: "가장 날카로운 자리 — 넣는가 묻는가", en: "The sharpest spot — putting or asking" }
            code:
              - "n = 0;      // n 이 0 이 된다"
              - "n == 0;     // n 은 그대로"
      - t: "+="
        mono: true
        diag:
          t:
            ko: "이 모양은 <b>지금 값에 더한</b> 결과를 도로 넣습니다. 옛 값을 재료로 쓰므로 「덮어쓴다」와 결과가 달라요."
            en: "That form puts back the result of <b>adding to what is there</b>. It uses the old value, so the outcome differs from overwriting."
          edge:
            h: { ko: "가장 날카로운 자리 — 덮느냐 더하느냐", en: "The sharpest spot — overwrite or add" }
            code:
              - "n = 1;      // 무조건 1"
              - "n += 1;     // 옛 값에 더한다"
      - t: "&="
        mono: true
        diag:
          t:
            ko: "이 모양은 비트를 <b>둘 다 켜진 자리만</b> 남깁니다. 값을 넣는 것이 아니라 지금 값을 깎는 자리예요."
            en: "That form keeps only the bits that are <b>on in both</b>. It does not put a value in; it whittles the one already there."
          edge:
            h: { ko: "가장 날카로운 자리 — 넣느냐 깎느냐", en: "The sharpest spot — put or whittle" }
            code:
              - "flags = 6;   // 110"
              - "flags &= 3;  // 010 만 남는다"
why_gate:
  q:
    ko: "{{site.line}}행은 왜 원소를 <b>전부 다시 놓는</b> 쪽을 골랐을까요?"
    en: "Why does line {{site.line}} choose to <b>lay every element out again</b>?"
  choices:
    - t:
        ko: "두 이름이 서로를 안 건드리게 하려고 — 한쪽을 고쳐도 다른 쪽이 안 따라가야 하니까"
        en: "So the two names cannot disturb each other — editing one must not follow to the other"
      ok: true
      fb:
        ko: "그 방향입니다. 그 대가가 무엇인지도 한 줄로 적어 보세요."
        en: "That is the direction. Add a line on what that costs."
    - t:
        ko: "복사가 주소를 넘기는 것보다 빨라서"
        en: "Because copying is faster than passing an address"
      ok: false
      fb:
        ko: "빠르지 않습니다. 원소가 많을수록 비싸고, 그래서 참조라는 표기가 따로 있어요."
        en: "It is not faster. The more elements the dearer it gets, which is why a reference notation exists."
    - t:
        ko: "C++ 이 주소를 못 다뤄서"
        en: "Because C++ cannot deal with addresses"
      ok: false
      fb:
        ko: "다룹니다. 복사냐 아니냐를 <b>줄마다 고르게</b> 한 것이 이 언어의 선택이에요."
        en: "It can. Letting you choose copy-or-not <b>line by line</b> is this language's choice."
queries:
  - { grammars: [cpp], file: ./assignment.scm }
examples:
  - code: "void f() { count = 0; }                  // count -> 0 (int)"
    expect: { sites: 1, form: assign, hole: "=", picks: { 1: "=", 2: "count", 3: "0" } }
  - code: "void f() { v2 = v1; }                    // v2 -> v1 의 복사본, v1 은 그대로"
    expect: { sites: 1, form: assign, hole: "=", picks: { 1: "=", 2: "v2", 3: "v1" } }
  - code: "void f() { obj.field = 1; }              // 멤버에 넣는 다른 판이다"
    expect: none
