lang: cpp
version: 0.1.0
grammars: [cpp]
# tree-sitter-cpp 0.23.4 의 `parser.c` 가 14 다 (`cpp.md` §8 — master 는 15 이고 릴리스 태그가
# 14 다). 대조는 시험이 한다 (`declared_grammar_abi_matches_the_linked_grammar`).
grammar_abi: { cpp: 14 }

# 확장자 → 문법. 인제스트가 이 표로 파일을 고른다 (03 §2.1).
#
# **`.h` 는 없다.** `cpp.md` §8 이 「리포에 `.cpp` 류가 하나라도 있으면 `cpp`, 아니면 `c`」를
# 제안했는데 그 판정은 사전이 아니라 인제스트의 몫이고, 지금 확장자 표는 **파일마다 문법
# 하나**를 고정으로 준다. `c/_lang.yaml` 과 `cpp/_lang.yaml` 이 둘 다 `.h` 를 걸면 표를
# 합치는 쪽이 마지막 것으로 조용히 이긴다 — 그래서 `.h` 는 C 쪽에 두고 여기서는 안 건다.
# `.c++`·`.h++` 도 없다 — 확장자 정규식(`^\.[a-z0-9.]+$`)이 `+` 를 안 받는다.
extensions:
  cpp: [.cpp, .cc, .cxx, .hpp, .hh, .hxx]

# 「필수 문법」 — 구멍 지도가 세는 대상이자 위상 정렬 동률 시의 순서다 (03 §6).
#
# **순서는 0부 → 1부 → 2부다** (`docs/curriculum/cpp.md` §0.1 · §2 · §3 · §4).
# 0부 열셋 중 **일곱이 신규**(`integer-type`·`overflow`·`float-type`·`char-and-byte`·
# `operator-precedence`·`conversion`·`reference-binding`)이고 여섯은 §2·§3 에서 올려 온 것이라
# (§0.4), README §12 규약 8 의 「0부 신규 essential 열둘」 상한 안이다.
#
# **얇은 판 규칙(py·ts 의 것)은 이 언어에서 안 돈다.** 그 규칙은 「사용처 100곳 미만인 판을
# 셋 이상 잇대지 않는다」인데, C++ 은 사용자 리포에 파일이 **0장**이라(§0.7) 전 과정이
# 합성이다. 잇대지 않을 두꺼운 판이 없으므로 순서는 문서의 축 순서를 그대로 쓴다.
# 공개 리포 둘(fmtlib/fmt · nlohmann/json, 527파일)의 실측은 `cpp.md` §12 에 있다.
essential:
  # ── 0부 「이 언어의 값과 식」 열셋 (cpp.md §0.1) ─────────────────────────────
  - cpp/variable-declaration   # 축 7 대입·이름 (§0.1 #1)
  - cpp/assignment             # 축 7
  - cpp/integer-type           # 축 1 정수 · 신규
  - cpp/overflow               # 축 1 · 신규 · 정적으로 못 보는 판 (아래 주석)
  - cpp/float-type             # 축 2 실수 · 신규
  - cpp/char-and-byte          # 축 3 문자 · 신규
  - cpp/boolean-literal        # 축 4 참거짓
  - cpp/arithmetic             # 축 5 연산자
  - cpp/comparison             # 축 8 비교
  - cpp/operator-precedence    # 축 5 · 신규
  - cpp/conversion             # 축 6 형 변환 · 신규
  - cpp/auto                   # §3 중심 18 에서 올려 옴 (§0.4)
  - cpp/reference-binding      # 신규 — 이 판이 2부의 셋을 먼저 연다
  # ── 1부 「문」 — §2 기초 여덟 중 0부가 안 가져간 셋 (cpp.md §2 머리) ─────────
  - cpp/if-statement
  - cpp/function-definition
  - cpp/return-statement
  # ── 2부 「객체와 소유」 — §3 중심 14 (§0.4 가 `auto` 를 뺐다) ────────────────
  - cpp/namespace-qualification
  - cpp/std-string
  - cpp/std-vector
  - cpp/range-for
  - cpp/reference-parameter
  - cpp/const-qualifier
  - cpp/class-definition
  - cpp/constructor
  - cpp/destructor
  - cpp/smart-pointer
  - cpp/move
  - cpp/stream-output
  - cpp/exception-handling
  - cpp/enum-class
  # ── 2부 뒤 — §4 심화 여덟 ───────────────────────────────────────────────────
  - cpp/lambda
  - cpp/template-function
  - cpp/operator-overload
  - cpp/virtual-override
  - cpp/new-delete
  - cpp/rule-of-five
  - cpp/structured-binding
  - cpp/std-optional

# 「AI 가 대신 쓴 것」 — 구멍 개념 ↔ 같은 일을 하는 다른 표기.
#
# `cpp.md` §3 이 일곱 쌍을 적었는데 **여섯은 present 쪽이 `c/`** 라 이 사전에 없다.
# 린트(`alternatives-exists`)가 없는 id 를 잡으므로 여기는 양쪽이 다 `cpp/` 인 하나만 든다.
# 나머지 여섯은 `c/` 사전이 서면 그때 행을 올린다 — 목록은 `cpp.md` §3 끝의 표다.
alternatives:
  - gap: cpp/smart-pointer
    present: cpp/new-delete
    note:
      ko: "소유를 타입에 안 적고 손으로 잡고 놓는 쪽으로 썼습니다."
      en: "Ownership is not written in the type; it is taken and released by hand."

thin_threshold: { min_files: 2, min_sites: 3, small_repo_files: 20 }

# 「네 코드엔 없다」 — 이 언어는 **전부**가 그것이다 (`cpp.md` §0.7).
# 사용자 리포 열에서 `.cpp`·`.cc`·`.cxx`·`.hpp`·`.hh` 가 0장이다. 그래서 개념마다
# `absent` 를 따로 다는 것이 아니라 코스 시작에 한 번 「이 언어는 네 리포에 없어서 전 과정이
# 합성 예제다」를 말한다 — 그 화면은 이 사전의 소유가 아니다.
#
# 공개 리포 둘로 잰 사용처는 `cpp.md` §12 에 있다. 거기서 **0곳**인 개념 다섯이
# `packages/cards/src/t0-synthetic.ts` 의 `ABSENCE` 표에 들어갈 후보이고, 그 파일도
# 이 사전의 소유가 아니라 오케스트레이터가 넣는다.

diag_default:
  point:
    ko: "«{{pick}}»{{pick|josa:은,는}} {{role}} 자리입니다. {{concept}}{{concept|josa:은,는}} «{{answer}}» 입니다. {{rule}}"
    en: "«{{pick}}» is the {{role}} slot. The {{concept}} is «{{answer}}». {{rule}}"
  blank:
    ko: "«{{pick}}»{{pick|josa:은,는}} 이 자리에 오지 않습니다. {{rule}}"
    en: "«{{pick}}» does not go in this slot. {{rule}}"
