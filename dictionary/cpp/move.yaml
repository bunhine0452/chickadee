schema: 1
id: cpp/move
# 2부 §3 #20. `universal: null` — §6 이 적은 그대로다. 이동이 표기로 있는 언어가 C++·Rust
# 둘뿐이고, Rust 는 **이동이 기본**이라 같은 이름을 걸면 기본값이 뒤집힌 채 전이된다 (D4).
universal: null
name: { ko: 옮겨도 된다고 표시하기, en: std::move }
token: "std::move"
grammars: [cpp]
framework: null
essential: true
difficulty: 4
prereq: [cpp/smart-pointer, cpp/reference-parameter]
confusions: []
dict:
  one_liner:
    ko: "이 이름은 아무것도 옮기지 않는다. 「가져가도 된다」는 표를 붙일 뿐이다."
    en: "This name moves nothing. It only attaches a note saying “you may take it”."
  why:
    ko: >-
      이름이 가장 크게 오해를 부르는 자리입니다. {{site.line}}행은 <b>아무것도 안 옮깁니다.</b>
      하는 일은 「이 값은 곧 안 쓸 거니 속을 가져가도 된다」는 <b>표를 붙이는 것</b>뿐이고,
      실제로 가져가는 일은 그 표를 받는 쪽 — 생성자나 대입 — 이 합니다. 받는 쪽이 그 표를
      쓸 줄 모르면 <b>그냥 복사가 일어나고</b> 원본도 그대로예요. 받는 쪽이 가져갔다면
      원본은 「살아 있지만 값은 정해지지 않은」 상태가 됩니다 — 지워도 되고 새 값을 넣어도
      되지만, 그 안을 읽으면 안 됩니다.
    en: >-
      This is where the name misleads most. Line {{site.line}} <b>moves nothing</b>. All it does
      is <b>attach a note</b> saying “this value will not be used again, so its insides may be
      taken”, and the taking is done by whoever receives the note — a constructor or an
      assignment. If the receiver does not know how to use the note, a <b>plain copy happens</b>
      and the original is untouched. If it did take, the original is left “alive but with an
      unspecified value”: it may be released or given a new value, but its insides must not be read.
  trace:
    - ko: "{{site.line}}행은 {{pick.3|code}} 에 표를 붙인다."
      en: "Line {{site.line}} attaches a note to {{pick.3|code}}."
    - ko: "{{pick.1|code}} 자체는 값을 하나도 안 옮긴다."
      en: "{{pick.1|code}} itself moves no value at all."
    - ko: "표를 받는 쪽이 속을 가져갈지 말지를 정한다."
      en: "Whoever receives the note decides whether to take the insides."
rule:
  ko: "<b>표만 붙인다.</b> 실제로 가져가는 것은 받는 쪽이고, 안 가져가면 복사가 일어난다."
  en: "<b>It only attaches a note.</b> The receiver does the taking; otherwise it copies."
result:
  label: { ko: "{{site.line}}행이 붙인 표", en: "the note attached on line {{site.line}}" }
  value: "{{pick.2}}::{{pick.1}}({{pick.3}})"
  note: { ko: "여기서는 아무것도 안 옮긴다", en: "nothing moves here" }
ok:
  ko: "{{pick.3|code}} 에 「가져가도 된다」는 표가 붙었습니다."
  en: "A note saying “you may take it” is now attached to {{pick.3|code}}."
payoff:
  ko: >-
    이걸 알면 「표를 붙였는데 여전히 느리다」가 풀립니다 — 받는 쪽이 안 가져갔어요.
  en: >-
    This untangles “I attached the note and it is still slow” — the receiver did not take.
bridge:
  ko: >-
    러스트는 <b>이동이 기본</b>이라 표를 붙일 일이 없고 복사를 적어야 합니다. C++ 은
    반대로 복사가 기본이고 이동을 적어야 해요.
  en: >-
    In Rust <b>moving is the default</b>, so no note is needed and copying is what gets written.
    C++ is the reverse: copying is the default and moving is written.
misconceptions:
  # `cpp.md` §9 #1.
  - ko: "이 이름이 값을 옮긴다 — 표만 붙입니다. 아무 데도 안 주면 원본은 그대로예요."
    en: "This name moves the value — it only attaches a note; hand it nowhere and nothing changes."
  - ko: "표를 붙이면 언제나 빨라진다 — 받는 쪽이 그 표를 쓸 줄 알아야 합니다."
    en: "The note always speeds things up — only if the receiver knows how to use it."
  - ko: "가져간 원본은 못 쓴다 — 지우거나 새 값을 넣을 수는 있습니다. 안을 읽는 것만 안 돼요."
    en: "A taken-from original is unusable — it may be released or reassigned; only reading its insides is out."
point:
  - q:
      ko: "{{site.line}}행에서 <b>「가져가도 된다」는 표를 붙이는 이름</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the name that attaches the “you may take it” note</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 그 이름이 사는 <b>통</b>입니다. 표를 붙이는 일은 뒤의 이름이 해요."
          en: "{{pick.2|code}} is the <b>box</b> the name lives in. Attaching the note is the name's job."
        edge:
          h: { ko: "가장 날카로운 자리 — 통이냐 이름이냐", en: "The sharpest spot — the box or the name" }
          code:
            - "std::move(v)     // 표를 붙인다"
            - "std::swap(a, b)  // 서로 바꾼다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>표가 붙는 값</b>입니다. 이 값 자체는 이 줄에서 아무 일도 안 해요."
          en: "{{pick.3|code}} is <b>the value the note goes on</b>. It does nothing on this line."
        edge:
          h: { ko: "가장 날카로운 자리 — 값이냐 표 붙이기냐", en: "The sharpest spot — the value or the noting" }
          code:
            - "v;               // 아무 일도 안 난다"
            - "std::move(v);    // 표만 붙는다"
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 「이 값의 속을 <b>가져가도 된다</b>」고 알립니다."
      en: "Choose what goes in the blank. Line {{site.line}} says the value's insides <b>may be taken</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "move", mono: true }
      - t: "forward"
        mono: true
        diag:
          t:
            ko: "이건 <b>받은 그대로 다시 넘기는</b> 자리에 씁니다. 템플릿 안에서만 뜻이 있고, 보통 코드에서는 표를 붙이는 일을 안 해요."
            en: "That is for <b>passing on exactly as received</b>. It only means something inside a template; in ordinary code it attaches no note."
          edge:
            h: { ko: "가장 날카로운 자리 — 표를 붙이느냐 그대로 넘기느냐", en: "The sharpest spot — noting or passing on" }
            code:
              - "std::move(v)              // 언제나 표를 붙인다"
              - "std::forward<T>(v)        // 받은 대로 넘긴다"
      - t: "copy"
        mono: true
        diag:
          t:
            ko: "그런 이름은 없습니다. 복사는 <b>아무것도 안 적었을 때</b> 일어나는 기본 동작이에요."
            en: "There is no such name. Copying is the <b>default when nothing is written</b>."
          edge:
            h: { ko: "가장 날카로운 자리 — 기본이냐 적는 것이냐", en: "The sharpest spot — the default or the written" }
            code:
              - "b = a;              // 복사"
              - "b = std::move(a);   // 가져가도 된다"
      - t: "swap"
        mono: true
        diag:
          t:
            ko: "이건 <b>둘의 속을 서로 바꿉니다</b>. 값이 사라지지 않고 자리만 맞바뀌어서, 한쪽만 넘길 때와 결과가 달라요."
            en: "That <b>swaps the insides of two</b>. Nothing vanishes; the two trade places, so the outcome differs from handing one over."
          edge:
            h: { ko: "가장 날카로운 자리 — 하나냐 둘이냐", en: "The sharpest spot — one or two" }
            code:
              - "std::move(a);      // a 만 다룬다"
              - "std::swap(a, b);   // 둘을 바꾼다"
why_gate:
  q:
    ko: "이 이름은 왜 <b>스스로 옮기지 않고</b> 표만 붙일까요?"
    en: "Why does this name <b>not move anything itself</b> and only attach a note?"
  choices:
    - t:
        ko: "속을 어떻게 가져갈지는 타입마다 다르기 때문 — 그 방법은 타입이 적고, 이 이름은 그럴 자격만 준다"
        en: "Because how the insides are taken differs per type — the type writes that, and this name only grants the right"
      ok: true
      fb:
        ko: "그 방향입니다. 타입이 그 방법을 안 적었을 때 무슨 일이 나는지도 적어 보세요."
        en: "That is the direction. Add what happens when the type never wrote that method."
    - t:
        ko: "옮기는 것이 위험해서 표만 붙이고 끝내려고"
        en: "Because moving is dangerous, so it stops at a note"
      ok: false
      fb:
        ko: "위험해서가 아니라 <b>옮기는 방법을 여기서 알 수 없어서</b>입니다."
        en: "Not danger — <b>the way to move cannot be known here</b>."
    - t:
        ko: "컴파일러가 알아서 옮겨 주니까"
        en: "Because the compiler moves it for you"
      ok: false
      fb:
        ko: "컴파일러가 알아서 하는 자리도 있지만, 이 이름이 필요한 자리는 <b>그러지 않는</b> 자리예요."
        en: "It does in some places, but this name is needed exactly where it <b>does not</b>."
queries:
  - { grammars: [cpp], file: ./move.scm }
examples:
  - code: "void f() { b = std::move(a); }            // a -> 살아 있지만 값은 정해지지 않음"
    expect: { sites: 1, form: move, hole: "move", picks: { 1: "move", 2: "std", 3: "a" } }
  - code: "void f() { v.push_back(std::move(s)); }   // s 의 속을 목록이 가져가도 된다"
    expect: { sites: 1, form: move, hole: "move", picks: { 1: "move", 2: "std", 3: "s" } }
  - code: "void f() { b = a; }                       // 표가 없으면 복사다"
    expect: none
