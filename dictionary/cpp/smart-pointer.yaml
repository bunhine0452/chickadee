schema: 1
id: cpp/smart-pointer
# 2부 §3 #19. `universal: null` — §6 이 적은 그대로다. 소유를 타입에 적는 언어가 C++·Rust
# 둘뿐이라 보편형을 걸 곳이 없다 (Rust 사전이 들어오면 승격 재검토).
universal: null
name: { ko: 소유를 타입에 적기, en: Smart pointer }
token: "std::unique_ptr"
grammars: [cpp]
framework: null
essential: true
difficulty: 4
prereq: [cpp/destructor, cpp/namespace-qualification, cs/stack-and-heap]
confusions: []
dict:
  one_liner:
    ko: "누가 그 자리를 놓아 줄지를 타입에 적는다. 이름이 사라질 때 자리도 함께 간다."
    en: "Who releases the room is written in the type; the room goes when the name does."
  why:
    ko: >-
      손으로 잡은 자리는 <b>누가 놓아 줄지가 코드에 안 적혀 있습니다.</b> 주석으로 적으면
      지켜지지 않고, 나가는 길이 여럿이면 한 갈래는 반드시 빠져요. {{site.line}}행의 타입은
      그 답을 <b>타입 자체에</b> 적습니다 — 이 이름이 사라지면 자리도 함께 갑니다.
      혼자만 갖는 쪽은 복사하려 하면 <b>컴파일이 멈춰요</b>. 그것이 이 타입의 값입니다:
      「둘이 같은 것을 지운다」가 문법으로 막힙니다. 여럿이 나눠 갖는 쪽은 숫자를 하나
      들고 있다가 마지막 하나가 사라질 때 놓습니다.
    en: >-
      Room taken by hand <b>does not say in the code who releases it</b>. A comment saying so is
      not enforced, and with several ways out one branch always misses it. The type on line
      {{site.line}} writes the answer <b>into the type itself</b>: when this name goes, the room
      goes with it. The single-owner kind <b>stops compiling</b> if you try to copy it — that is
      its worth: “two of them releasing one thing” becomes a syntax error. The shared kind keeps
      a count and releases when the last one goes.
  trace:
    - ko: "{{site.line}}행은 {{pick.3|code}} 하나를 가질 자리를 세운다."
      en: "Line {{site.line}} sets up room to own one {{pick.3|code}}."
    - ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 누가 놓아 줄지를 정한다."
      en: "{{pick.1|code}} fixes who releases it."
    - ko: "이 이름이 사라질 때 그 자리도 함께 간다."
      en: "When this name goes away, so does the room."
rule:
  ko: "<b>소유가 타입에 적힌다.</b> 이름이 사라지는 자리에서 자리도 함께 놓인다."
  en: "<b>Ownership is written in the type.</b> The room is released where the name goes."
result:
  label: { ko: "{{site.line}}행의 소유", en: "the ownership on line {{site.line}}" }
  value: "{{pick.2}}::{{pick.1}}{{pick.3}}"
  note: { ko: "이름이 사라지면 자리도 간다", en: "the name goes, the room goes" }
ok:
  ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 그 자리를 놓아 줄 책임을 집니다."
  en: "{{pick.1|code}} takes the responsibility of releasing that room."
payoff:
  ko: >-
    이걸 알면 「어디서 놓아 주는지 못 찾겠다」가 풀립니다 — 타입에 적혀 있어요.
  en: >-
    This untangles “I cannot find where it is released” — it is written in the type.
bridge:
  ko: >-
    러스트는 <b>모든 값</b>에 이 규칙을 겁니다. C++ 은 고를 수 있게 두었고, 그래서 같은
    파일에 손으로 잡은 자리와 이 타입이 섞여 있습니다.
  en: >-
    Rust applies this rule to <b>every value</b>. C++ leaves it a choice, which is why one file
    holds both hand-taken room and this type.
misconceptions:
  # `cpp.md` §9 #1 · §3 #19.
  - ko: "이 타입도 포인터라 복사할 수 있다 — 혼자 갖는 쪽은 복사에서 컴파일이 멈춥니다."
    en: "It is a pointer, so it copies — the single-owner kind stops compiling on a copy."
  - ko: "여럿이 나눠 갖는 쪽이 언제나 안전하다 — 서로를 가리키면 숫자가 0 이 안 돼 영영 안 놓입니다."
    en: "The shared kind is always safe — two pointing at each other never reach zero."
  - ko: "이걸 쓰면 손으로 잡는 낱말이 필요 없다 — 만드는 함수 안에서는 여전히 그것이 돕니다."
    en: "With this the hand-taking word is unnecessary — the making function still uses it inside."
point:
  - q:
      ko: "{{site.line}}행에서 <b>누가 놓아 줄지를 정하는 타입 이름</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the type name that fixes who releases it</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 그 이름이 사는 <b>통</b>입니다. 소유 규칙과는 상관이 없어요."
          en: "{{pick.2|code}} is the <b>box</b> the name lives in. It says nothing about ownership."
        edge:
          h: { ko: "가장 날카로운 자리 — 통이냐 소유냐", en: "The sharpest spot — the box or the ownership" }
          code:
            - "std::unique_ptr<W>   // 혼자 갖는다"
            - "std::shared_ptr<W>   // 나눠 갖는다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>무엇을 가질지</b>입니다. 누가 놓는지는 그 앞의 타입 이름이 정해요."
          en: "{{pick.3|code}} is <b>what is owned</b>. Who releases it is fixed by the type name before it."
        edge:
          h: { ko: "가장 날카로운 자리 — 가지는 것이냐 갖는 방식이냐", en: "The sharpest spot — the owned or the owning" }
          code:
            - "std::unique_ptr<W>   // 같은 W"
            - "std::shared_ptr<W>   // 다른 규칙"
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 그 자리를 <b>혼자만 갖습니다</b>."
      en: "Choose what goes in the blank. Line {{site.line}} owns the room <b>alone</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "unique_ptr", mono: true }
      - t: "shared_ptr"
        mono: true
        diag:
          t:
            ko: "이건 <b>여럿이 나눠 갖습니다</b>. 복사가 되고 숫자가 하나 늘어나는데, 그 숫자를 세는 값이 따로 있어 조금 더 비싸요."
            en: "That one is <b>shared by many</b>. Copying works and a count goes up — and that count is a separate value, so it costs a little more."
          edge:
            h: { ko: "가장 날카로운 자리 — 혼자냐 여럿이냐", en: "The sharpest spot — alone or shared" }
            code:
              - "unique_ptr<W> a = std::move(b);  // 옮긴다"
              - "shared_ptr<W> a = b;             // 복사된다"
      - t: "weak_ptr"
        mono: true
        diag:
          t:
            ko: "이건 <b>갖지 않고 들여다보기만</b> 합니다. 자리를 놓아 주지 않고, 쓰려면 먼저 살아 있는지 물어봐야 해요."
            en: "That one <b>looks without owning</b>. It releases nothing, and using it means first asking whether the thing is still there."
          edge:
            h: { ko: "가장 날카로운 자리 — 갖느냐 보느냐", en: "The sharpest spot — owning or looking" }
            code:
              - "unique_ptr<W> p;   // 갖는다"
              - "weak_ptr<W> w;     // 안 갖는다"
      - t: "auto_ptr"
        mono: true
        diag:
          t:
            ko: "이건 <b>옛 이름</b>이라 지금은 없어졌습니다. 복사할 때 원본이 조용히 비워지는 성질 때문에 걷어냈어요."
            en: "That is the <b>old name</b> and is gone. It was removed because copying quietly emptied the original."
          edge:
            h: { ko: "가장 날카로운 자리 — 지금 있느냐", en: "The sharpest spot — does it still exist" }
            code:
              - "// C++17 에서 없어졌다"
              - "std::unique_ptr<W> p;"
why_gate:
  q:
    ko: "혼자 갖는 쪽은 왜 <b>복사를 아예 막을까요</b>?"
    en: "Why does the single-owner kind <b>forbid copying outright</b>?"
  choices:
    - t:
        ko: "복사가 되면 둘이 같은 자리를 놓아 주게 되기 때문 — 그 사고를 실행할 때가 아니라 컴파일할 때 잡으려고"
        en: "Because a copy would leave two releasing one room — and that is caught at compile time, not at run time"
      ok: true
      fb:
        ko: "그 방향입니다. 그럼 소유를 옮기고 싶을 때 무엇을 적는지도 적어 보세요."
        en: "That is the direction. Add what is written when ownership should move."
    - t:
        ko: "복사가 느려서"
        en: "Because copying is slow"
      ok: false
      fb:
        ko: "느림이 아니라 <b>같은 자리를 두 번 놓는 사고</b>가 문제였습니다."
        en: "Not slowness but the accident of <b>releasing one room twice</b>."
    - t:
        ko: "이 타입이 값이 아니라서"
        en: "Because this type is not a value"
      ok: false
      fb:
        ko: "값입니다. 값인데 <b>복사만</b> 막고 옮기기는 열어 둔 것이 요점이에요."
        en: "It is a value. The point is that only <b>copying</b> is blocked while moving stays open."
queries:
  - { grammars: [cpp], file: ./smart-pointer.scm }
examples:
  - code: "void f() { std::unique_ptr<W> p; }        // p -> W 를 혼자 갖는 자리"
    expect: { sites: 1, form: smartdecl, hole: "unique_ptr", picks: { 1: "unique_ptr", 2: "std", 3: "<W>" } }
  - code: "void f() { auto p = std::make_unique<W>(1); }  // p -> 새 W 하나를 혼자 갖는다"
    expect: { sites: 1, form: make, hole: "make_unique", picks: { 1: "make_unique", 2: "std", 3: "<W>" } }
  - code: "void f() { std::vector<W> v; }            // 소유를 적는 타입이 아니다"
    expect: none
