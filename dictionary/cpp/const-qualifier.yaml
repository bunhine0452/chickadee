schema: 1
id: cpp/const-qualifier
# 2부 §3 #14. `universal: null` — §6 이 적은 그대로다. TS 의 같은 낱말은 **이름을 다시 못
# 묶는다**라 이미 `common/variable-binding` 에 붙어 있고, C++ 의 이것은 **이 이름으로는
# 대상을 못 만진다**로 다른 기계다 (D4).
universal: null
name: { ko: 못 바꾼다는 약속, en: const }
token: "const"
grammars: [cpp]
framework: null
essential: true
difficulty: 3
prereq: [cpp/variable-declaration, cpp/reference-binding, cs/immutability]
confusions: []
dict:
  one_liner:
    ko: "「상수」가 아니라 「이 이름으로는 못 만진다」다. 남이 바꾸는 것은 못 막는다."
    en: "Not “a constant” but “not through this name”. It cannot stop anyone else."
  why:
    ko: >-
      이 낱말을 「값이 안 바뀐다」로 읽으면 두 번 틀립니다. 첫째, 값은 <b>실행 중에</b>
      정해져도 됩니다 — 사용자가 입력한 값에도 붙일 수 있어요. 둘째, 막는 것은
      <b>이 이름을 지나는 길 하나</b>뿐입니다. 같은 대상에 다른 이름이 붙어 있으면
      그쪽으로는 그대로 바뀝니다. 그래서 이 낱말의 값은 「안전」이 아니라 <b>읽는 사람과의
      약속</b>이에요 — {{site.line}}행을 보면 이 함수가 그 값을 안 건드린다는 것을
      정의부를 안 열고도 압니다.
    en: >-
      Reading this word as “the value never changes” goes astray twice. First, the value may be
      settled <b>while the program runs</b> — it can attach to something a user typed. Second,
      what is blocked is only <b>the path through this name</b>. If the same thing has another
      name attached, it still changes through that one. So the worth of this word is not safety
      but a <b>promise to the reader</b>: line {{site.line}} says this function leaves the value
      alone, without opening the definition.
  trace:
    - ko: "{{site.line}}행의 {{pick.1|code}}{{pick.1|josa:은,는}} 길 하나를 막는다."
      en: "On line {{site.line}}, {{pick.1|code}} blocks one path."
    - ko: "{{pick.2|code}}{{pick.2|josa:을,를}} 지나서는 대상을 못 고친다."
      en: "Through {{pick.2|code}} the thing cannot be edited."
    - ko: "다른 이름이 붙어 있으면 그쪽으로는 바뀐다."
      en: "If another name is attached, it still changes through that one."
rule:
  ko: "<b>막는 것은 이 이름을 지나는 길 하나다.</b> 값이 실행 중에 정해져도 붙을 수 있다."
  en: "<b>Only the path through this name is blocked.</b> The value may be settled at run time."
result:
  label: { ko: "{{site.line}}행의 약속", en: "the promise on line {{site.line}}" }
  value: "{{pick.1}} {{pick.3}} {{pick.2}}"
  note: { ko: "이 이름으로는 못 만진다", en: "not editable through this name" }
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:을,를}} 지나서는 그 대상을 못 고칩니다."
  en: "Through {{pick.2|code}} the thing cannot be edited."
payoff:
  ko: >-
    이걸 알면 「안 바뀐다고 적었는데 값이 바뀌었다」가 풀립니다 — 다른 이름이 있었어요.
  en: >-
    This untangles “I marked it unchangeable and it changed” — another name existed.
bridge:
  ko: >-
    TS 의 같은 낱말은 <b>이름을 다시 못 묶는다</b>는 뜻이라 안의 값은 그대로 바뀝니다.
    글자는 같은데 막는 것이 달라요.
  en: >-
    The same word in TS means <b>the name cannot be rebound</b>, so the contents still change.
    Same letters, different thing blocked.
misconceptions:
  - ko: "값이 컴파일할 때 정해져야 한다 — 실행 중에 정해져도 붙습니다."
    en: "The value must be known at compile time — it may be settled at run time."
  - ko: "붙이면 아무도 못 바꾼다 — 이 이름을 지나는 길만 막습니다."
    en: "Nothing can change it once marked — only the path through this name is blocked."
  - ko: "붙이면 복사가 안 된다 — 복사 여부와 상관없습니다. 참조와 함께 써야 복사가 없어요."
    en: "Marking it stops the copy — it is unrelated; only a reference alongside removes the copy."
point:
  - q:
      ko: "{{site.line}}행에서 <b>이 이름으로는 못 만진다는 약속</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the promise not to touch through this name</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>약속이 걸린 이름</b>입니다. 약속 자체는 그 앞의 낱말이에요."
          en: "{{pick.2|code}} is <b>the name the promise is attached to</b>. The promise itself is the word in front."
        edge:
          h: { ko: "가장 날카로운 자리 — 이름이냐 약속이냐", en: "The sharpest spot — the name or the promise" }
          code:
            - "std::string& s        // 고칠 수 있다"
            - "const std::string& s  // 못 고친다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>타입</b>입니다. 타입은 무엇을 담을지 정하고, 만질 수 있는지는 앞의 낱말이 정해요."
          en: "{{pick.3|code}} is the <b>type</b>. A type fixes what is held; whether it can be touched is the word in front."
        edge:
          h: { ko: "가장 날카로운 자리 — 타입이냐 약속이냐", en: "The sharpest spot — the type or the promise" }
          code:
            - "int n = 1; n = 2;         // 된다"
            - "const int n = 1; n = 2;   // 멈춘다"
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 그 값을 <b>안 건드리겠다고</b> 약속합니다."
      en: "Choose what goes in the blank. Line {{site.line}} promises <b>not to touch</b> the value."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "const", mono: true }
      - t: "static"
        mono: true
        diag:
          t:
            ko: "이건 <b>어디에 사느냐</b>를 정합니다. 값은 여전히 바꿀 수 있고, 대신 프로그램이 끝날 때까지 살아 있어요."
            en: "That fixes <b>where it lives</b>. The value can still change; it simply lives until the program ends."
          edge:
            h: { ko: "가장 날카로운 자리 — 못 만짐이냐 수명이냐", en: "The sharpest spot — untouchable or long-lived" }
            code:
              - "const int n = 1;    // 못 고친다"
              - "static int n = 1;   // 고칠 수 있다"
      - t: "constexpr"
        mono: true
        diag:
          t:
            ko: "이건 <b>컴파일할 때 값이 정해진다</b>는 더 센 약속입니다. 실행 중에 정해지는 값에는 못 붙어요."
            en: "That is the stronger promise that <b>the value is known at compile time</b>. It cannot attach to a run-time value."
          edge:
            h: { ko: "가장 날카로운 자리 — 언제 정해지느냐", en: "The sharpest spot — when is it settled" }
            code:
              - "const int n = read();      // 된다"
              - "constexpr int n = read();  // 멈춘다"
      - t: "final"
        mono: true
        diag:
          t:
            ko: "이 낱말은 C++ 에도 있지만 <b>상속을 막는</b> 자리에 씁니다. 값이나 이름에는 안 붙어요."
            en: "That word exists in C++ but marks <b>no further inheritance</b>. It does not attach to values or names."
          edge:
            h: { ko: "가장 날카로운 자리 — 값이냐 상속이냐", en: "The sharpest spot — a value or inheritance" }
            code:
              - "const int n = 1;"
              - "class A final { };"
why_gate:
  q:
    ko: "아무도 못 막는데 왜 <b>이 낱말을 붙일까요</b>?"
    en: "It stops no one else — so why <b>attach this word</b>?"
  choices:
    - t:
        ko: "함수를 안 열고도 그 값이 안 바뀐다는 것을 읽는 사람이 알 수 있기 때문 — 그리고 어기면 컴파일이 멈춘다"
        en: "Because a reader learns the value stays put without opening the function — and breaking it stops the compile"
      ok: true
      fb:
        ko: "그 방향입니다. 참조와 함께 쓸 때 무엇이 더 얻어지는지도 적어 보세요."
        en: "That is the direction. Add what is gained when it is used together with a reference."
    - t:
        ko: "붙이면 더 빨라서"
        en: "Because it makes things faster"
      ok: false
      fb:
        ko: "빨라지는 경우가 있긴 하지만 근거로는 약합니다. 얻는 것은 <b>읽는 사람의 확신</b>이에요."
        en: "It sometimes helps, but that is thin ground. What is gained is <b>the reader's certainty</b>."
    - t:
        ko: "값을 메모리에 안 두려고"
        en: "To keep the value out of memory"
      ok: false
      fb:
        ko: "메모리 자리와는 상관없습니다. 막는 것은 <b>고치는 길</b> 하나예요."
        en: "It has nothing to do with where it sits. What is blocked is <b>one editing path</b>."
queries:
  - { grammars: [cpp], file: ./const-qualifier.scm }
examples:
  - code: "void g(const std::string& s) { }          // s -> 원본, 이 이름으로는 못 고친다"
    expect: { sites: 1, form: constparam, hole: "const", picks: { 1: "const", 2: "& s", 3: "std::string" } }
  - code: "void f() { const int n = read(); }        // n -> 실행 중에 정해지고 못 고친다"
    expect: { sites: 1, form: constvar, hole: "const", picks: { 1: "const", 2: "n", 3: "int" } }
  - code: "void g(std::string& s) { }                // 약속이 없다"
    expect: none
