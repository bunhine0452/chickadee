schema: 1
id: cpp/variable-declaration
# 0부 §0.1 #1. 이름이 값에 붙는다는 것 자체는 어느 언어에나 있으므로 보편형을 건다.
# 「값을 안 적으면 정해지지 않은 값」은 C++ 쪽 어긋남이라 판에만 있고 보편형에는 안 간다.
universal: common/variable-binding
name: { ko: 자리 만들며 이름 붙이기, en: Variable declaration }
token: null
grammars: [cpp]
framework: null
essential: true
difficulty: 1
prereq: [cs/type, cs/undefined-behavior]
confusions: []
dict:
  one_liner:
    ko: "무엇을 담을지 먼저 적고 이름을 붙인다. 값을 안 적으면 그 자리는 쓰레기로 시작한다."
    en: "The type comes first, the name after. With no value the room starts as rubbish."
  why:
    ko: >-
      {{site.line}}행은 <b>자리를 잡는 줄</b>입니다. 앞에 적은 낱말이 그 자리를 몇 칸으로
      잡을지 정하고, 컴파일러는 그 줄에서 칸 수를 알아야 합니다 — 그래서 이름보다 타입이
      먼저예요. 그리고 값을 안 적으면 그 칸은 <b>0 이 되지 않습니다</b>. 앞에 있던 무엇이
      그대로 남아 있고, 그것을 읽는 것은 규격이 답을 안 정한 자리입니다. 0 을 원하면
      중괄호를 비워 적어야 해요 — <code>{}</code> 가 그 자리를 0 으로 채웁니다.
    en: >-
      Line {{site.line}} <b>claims room</b>. The word in front fixes how many slots that room
      gets, and the compiler has to know the count on that very line — which is why the type
      comes before the name. And with no value written, the slots are <b>not zero</b>. Whatever
      was there stays, and reading it is a place where the standard fixes no answer. To get
      zero you write empty braces — <code>{}</code> fills the room with zero.
  trace:
    - ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 그 자리를 몇 칸으로 잡을지 정한다."
      en: "{{pick.1|code}} fixes how many slots the room gets."
    - ko: "{{pick.2|code}} 라는 이름이 그 자리를 부르는 말이 된다."
      en: "The name {{pick.2|code}} becomes the way to call that room."
    - ko: "{{site.line}}행 아래로 그 이름은 그 자리를 뜻한다."
      en: "Below line {{site.line}} the name means that room."
rule:
  ko: "<b>타입이 먼저 서고 이름이 그 뒤다.</b> 값을 안 적으면 0 이 아니라 정해지지 않은 값이다."
  en: "<b>The type stands first, the name after.</b> With no value it is not zero but undefined."
result:
  label: { ko: "{{site.line}}행이 잡은 자리", en: "the room claimed on line {{site.line}}" }
  value: "{{pick.1}} {{pick.2}}"
  note: { ko: "칸 수는 여기서 정해진다", en: "the slot count is fixed here" }
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 이제 정해진 칸 수를 가진 자리의 이름입니다."
  en: "{{pick.2|code}} is now the name of a room with a fixed slot count."
payoff:
  ko: >-
    이걸 알면 「돌릴 때마다 값이 다르다」가 풀립니다 — 안 채운 자리를 읽고 있는 겁니다.
  en: >-
    This untangles “the value differs every run” — an unfilled room is being read.
bridge:
  ko: >-
    파이썬은 이름부터 적고 무엇을 담을지 안 적습니다. C++ 은 반대라 <b>줄의 첫 낱말이
    이미 결정</b>입니다.
  en: >-
    Python writes the name first and never says what it holds. C++ is the other way round, so
    <b>the first word of the line is already a decision</b>.
misconceptions:
  # `cpp.md` §9 #10.
  - ko: "값을 안 적으면 0 이다 — 지역 자리는 아무 값이나 들고 있습니다. 0 이 되는 것은 중괄호를 비워 적었을 때뿐이에요."
    en: "No value means zero — a local room holds anything. Zero happens only with empty braces."
  - ko: "이름을 길게 지으면 자리를 더 쓴다 — 칸 수는 앞에 적은 타입만 정합니다."
    en: "A longer name uses more room — only the type in front fixes the slot count."
  - ko: "타입은 나중에 바꿀 수 있다 — 이 줄에서 정해지면 그 이름으로는 안 바뀝니다."
    en: "The type can change later — once fixed on this line, it does not change for that name."
point:
  - q:
      ko: "{{site.line}}행에서 <b>자리를 몇 칸으로 잡을지 정하는 낱말</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the word that fixes how many slots the room gets</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>이름</b>입니다. 이름은 자리를 못 만들고, 그 자리가 몇 칸인지도 안 정해요."
          en: "{{pick.2|code}} is the <b>name</b>. A name makes no room and settles no slot count."
        edge:
          h: { ko: "가장 날카로운 자리 — 이름이냐 타입이냐", en: "The sharpest spot — the name or the type" }
          code:
            - "short n;      // 16칸"
            - "long n;       // 같은 이름, 64칸"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 처음 들어가는 <b>값</b>입니다. 값이 작아도 자리는 타입이 정한 만큼 잡혀요."
          en: "{{pick.3|code}} is the starting <b>value</b>. Small values still take all the slots the type asks for."
        edge:
          h: { ko: "가장 날카로운 자리 — 값이냐 자리냐", en: "The sharpest spot — the value or the room" }
          code:
            - "char c = 0;   // 8칸"
            - "double d = 0; // 64칸"
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 <b>정수 하나를 담을 자리</b>를 잡습니다."
      en: "Choose what goes in the blank. Line {{site.line}} claims <b>room for one whole number</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "int", mono: true }
      - t: "auto"
        mono: true
        diag:
          t:
            ko: "이건 <b>오른쪽을 보고 정하라</b>는 표시라 오른쪽에 값이 있어야만 섭니다. 값 없는 줄에 쓰면 컴파일러가 정할 근거가 없어 멈춰요."
            en: "That says <b>look right and decide</b>, so it needs a value on the right. On a line with none the compiler has nothing to read and stops."
          edge:
            h: { ko: "가장 날카로운 자리 — 값이 있느냐", en: "The sharpest spot — is there a value" }
            code:
              - "auto n = 3;   // 선다"
              - "auto n;       // 멈춘다"
      - t: "void"
        mono: true
        diag:
          t:
            ko: "이건 <b>담을 것이 없다</b>는 뜻이라 자리를 잡지 않습니다. 함수가 아무것도 안 돌려준다고 적을 때 쓰는 낱말이에요."
            en: "That means <b>there is nothing to hold</b>, so it claims no room. It is the word for a function that hands nothing back."
          edge:
            h: { ko: "가장 날카로운 자리 — 담느냐 안 담느냐", en: "The sharpest spot — holding or not" }
            code:
              - "int n;        // 자리가 생긴다"
              - "void f();     // 돌려줄 것이 없다"
      - t: "class"
        mono: true
        diag:
          t:
            ko: "이건 <b>새 타입을 만드는</b> 낱말입니다. 자리를 잡는 줄이 아니라 무엇을 담을 수 있는지를 정의하는 줄을 엽니다."
            en: "That word <b>makes a new type</b>. It opens a line that defines what can be held, not one that claims room."
          edge:
            h: { ko: "가장 날카로운 자리 — 만들기냐 담기냐", en: "The sharpest spot — defining or holding" }
            code:
              - "class Box { };  // 타입을 만든다"
              - "int n;          // 자리를 만든다"
why_gate:
  q:
    ko: "{{site.line}}행은 왜 <b>이름보다 타입을 먼저</b> 적을까요?"
    en: "Why does line {{site.line}} write <b>the type before the name</b>?"
  choices:
    - t:
        ko: "컴파일러가 이 이름에 자리를 얼마나 잡을지 그 줄에서 정해야 하기 때문"
        en: "Because the compiler has to settle how much room this name gets, right on that line"
      ok: true
      fb:
        ko: "그 방향입니다. 자리를 나중에 정하면 못 하는 일이 무엇인지도 한 줄로 적어 보세요."
        en: "That is the direction. Add a line on what could not be done if the room were settled later."
    - t:
        ko: "읽기 좋으라고 정한 순서라서"
        en: "Because the order was picked to read nicely"
      ok: false
      fb:
        ko: "읽기 문제가 아닙니다. 값이 놓이기 전에 자리가 정해져야 해서 생긴 순서예요."
        en: "Reading is not it. The order exists because the room is settled before any value lands."
    - t:
        ko: "값을 보면 칸 수를 알 수 있어서"
        en: "Because the value tells you the slot count"
      ok: false
      fb:
        ko: "값으로는 못 압니다. <code>0</code> 하나만 봐도 8칸일 수도 64칸일 수도 있어요."
        en: "The value cannot tell you. A bare <code>0</code> may sit in 8 slots or in 64."
queries:
  - { grammars: [cpp], file: ./variable-declaration.scm }
examples:
  # 값을 든 예 — 식 · 값 · 타입 (`docs/program/fundamentals.md` §8 이 카탈로그로 걷어 간다).
  - code: "void f() { int count = 0; }              // count -> 0 (int)"
    expect: { sites: 1, form: init, hole: "int", picks: { 1: "int", 2: "count", 3: "0" } }
  - code: "void f() { int n; }                      // n -> 정해지지 않은 값 (int)"
    expect: { sites: 1, form: bare, hole: "int", picks: { 1: "int", 2: "n" } }
  - code: "void f() { auto n = 3; }                 // n -> 3 (int, 오른쪽에서 정해짐)"
    expect: none
