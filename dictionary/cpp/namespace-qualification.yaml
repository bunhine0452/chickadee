schema: 1
id: cpp/namespace-qualification
# 2부 §3 #9. `common/member-access` 가 보편형이다 — 「이름 안을 연다」는 축은 같고,
# 「값 안과 이름 안이 다른 기호다」가 C++ 쪽 어긋남이라 판에만 있다.
universal: common/member-access
name: { ko: 이름공간 안의 이름, en: Namespace qualification }
token: "::"
grammars: [cpp]
framework: null
essential: true
difficulty: 2
prereq: [cpp/variable-declaration]
confusions: []
dict:
  one_liner:
    ko: "점은 값 안을 열고, 이 기호는 이름 안을 연다. 둘은 서로 못 바꾼다."
    en: "A dot opens a value; this symbol opens a name. The two never swap."
  why:
    ko: >-
      C++ 에는 이름을 <b>묶어 두는 통</b>이 있습니다. 표준 라이브러리의 이름들은 전부
      그 통 하나 안에 있어서, 밖에서 부르려면 통 이름을 먼저 적어야 해요.
      {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:이,가}} 그 여는 기호입니다.
      점과 헷갈리기 쉬운데 여는 것이 달라요 — 점은 <b>값 안</b>(어떤 값이 가진 것)을 열고,
      이 기호는 <b>이름 안</b>(어느 통에 적힌 이름)을 엽니다. 값이 없어도 되고, 그래서
      클래스에 딸린 이름도 이 기호로 엽니다.
    en: >-
      C++ has <b>boxes that hold names</b>. Every name in the standard library sits in one such
      box, so calling one from outside means writing the box's name first. On line
      {{site.line}}, {{pick.1|code}} is the symbol that opens it. It is easy to confuse with a
      dot, but they open different things: a dot opens <b>inside a value</b> — what some value
      has — while this opens <b>inside a name</b> — what is written in a box. No value is needed,
      which is why names attached to a class open the same way.
  trace:
    - ko: "{{site.line}}행의 {{pick.2|code}}{{pick.2|josa:은,는}} 이름들이 담긴 통이다."
      en: "On line {{site.line}}, {{pick.2|code}} is the box the names sit in."
    - ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 그 통을 연다."
      en: "{{pick.1|code}} opens that box."
    - ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 통 안에 적힌 이름이다."
      en: "{{pick.3|code}} is the name written inside the box."
rule:
  ko: "<b>점은 값 안, 이 기호는 이름 안.</b> 값이 없어도 이 기호는 열린다."
  en: "<b>A dot opens a value, this opens a name.</b> It opens with no value at all."
result:
  label: { ko: "{{site.line}}행이 연 이름", en: "the name opened on line {{site.line}}" }
  value: "{{pick.2}}{{pick.1}}{{pick.3}}"
  note: { ko: "값이 아니라 통을 열었다", en: "a box was opened, not a value" }
ok:
  ko: "{{pick.3|code}}{{pick.3|josa:은,는}} {{pick.2|code}} 라는 통 안의 이름입니다."
  en: "{{pick.3|code}} is a name inside the box called {{pick.2|code}}."
payoff:
  ko: >-
    이걸 알면 표준 라이브러리 줄이 통째로 읽힙니다 — 앞은 통, 뒤는 이름입니다.
  en: >-
    This makes standard-library lines readable at a glance — box in front, name behind.
bridge:
  ko: >-
    파이썬·자바는 <b>점 하나</b>로 둘 다 합니다. C++ 이 기호를 나눈 덕에 값이 필요한
    자리와 아닌 자리가 글자로 갈립니다.
  en: >-
    Python and Java do both with <b>one dot</b>. Splitting the symbols lets C++ show, in the
    text itself, where a value is needed and where it is not.
misconceptions:
  - ko: "점으로 바꿔 써도 된다 — 안 됩니다. 여는 것이 값이냐 이름이냐로 갈려요."
    en: "A dot can be swapped in — it cannot; one opens a value, the other a name."
  - ko: "통 이름을 안 적으면 못 쓴다 — 통을 통째로 여는 줄을 적으면 안 적어도 됩니다."
    en: "Without the box name it cannot be used — one line that opens the whole box removes the need."
  - ko: "통을 통째로 여는 것이 언제나 편하다 — 같은 이름이 둘 이상 열리면 어느 쪽인지 모호해집니다."
    en: "Opening the whole box is always handy — with two names alike it becomes ambiguous."
point:
  - q:
      ko: "{{site.line}}행에서 <b>이름이 담긴 통을 여는 기호</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the symbol that opens the box of names</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>통 이름</b>입니다. 통을 여는 일은 그 뒤의 기호가 해요."
          en: "{{pick.2|code}} is the <b>box's name</b>. Opening it is the symbol's job."
        edge:
          h: { ko: "가장 날카로운 자리 — 통이냐 여는 기호냐", en: "The sharpest spot — the box or the opener" }
          code:
            - "std                // 통 이름만"
            - "std::string        // 통을 열었다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>통 안의 이름</b>입니다. 그 이름에 닿으려면 앞의 기호를 지나야 해요."
          en: "{{pick.3|code}} is the <b>name inside the box</b>. Reaching it means passing the symbol first."
        edge:
          h: { ko: "가장 날카로운 자리 — 안의 이름이냐 여는 기호냐", en: "The sharpest spot — the inner name or the opener" }
          code:
            - "string             // 통 밖에서는 못 찾는다"
            - "std::string        // 찾는다"
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 <b>통 안의 이름</b>을 부릅니다."
      en: "Choose what goes in the blank. Line {{site.line}} calls <b>a name inside a box</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "::", mono: true }
      - t: "."
        mono: true
        diag:
          t:
            ko: "점은 <b>값 안</b>을 엽니다. 왼쪽에 값이 있어야 하는데 통 이름은 값이 아니라 컴파일이 멈춰요."
            en: "A dot opens <b>inside a value</b>. It needs a value on the left, and a box name is not one, so it stops."
          edge:
            h: { ko: "가장 날카로운 자리 — 값이냐 통이냐", en: "The sharpest spot — a value or a box" }
            code:
              - "s.size()      // s 는 값이다"
              - "std::string   // std 는 통이다"
      - t: "->"
        mono: true
        diag:
          t:
            ko: "이건 <b>주소를 따라간 뒤</b> 값 안을 엽니다. 왼쪽에 주소가 있어야 하고, 통 이름에는 안 붙어요."
            en: "That <b>follows an address</b> and then opens the value. It needs an address on the left and never attaches to a box."
          edge:
            h: { ko: "가장 날카로운 자리 — 주소냐 통이냐", en: "The sharpest spot — an address or a box" }
            code:
              - "p->size()     // p 는 주소다"
              - "std::string   // std 는 통이다"
      - t: ":"
        mono: true
        diag:
          t:
            ko: "기호 하나짜리는 다른 자리에서 씁니다 — 훑기의 가운데, 접근 표시 뒤, 생성자의 초기화 앞이에요."
            en: "The single symbol belongs elsewhere — in the middle of a range walk, after an access mark, before a constructor's initialisers."
          edge:
            h: { ko: "가장 날카로운 자리 — 하나냐 둘이냐", en: "The sharpest spot — one or two" }
            code:
              - "for (auto x : v)    // 훑기"
              - "std::string s;      // 통 열기"
why_gate:
  q:
    ko: "이 언어는 왜 <b>기호를 둘로</b> 나눴을까요?"
    en: "Why did this language <b>split the symbol in two</b>?"
  choices:
    - t:
        ko: "왼쪽에 값이 있어야 하는지 아닌지가 글자로 보이게 하려고 — 컴파일러도 읽는 사람도 그 자리에서 갈린다"
        en: "So the text shows whether a value is needed on the left — both compiler and reader split there"
      ok: true
      fb:
        ko: "그 방향입니다. 그 덕에 같은 이름이 겹쳐도 되는 이유도 적어 보세요."
        en: "That is the direction. Add why this also lets the same name repeat in different boxes."
    - t:
        ko: "점이 이미 다른 뜻으로 쓰여서 자리가 없었으니까"
        en: "Because the dot was already taken and there was no room"
      ok: false
      fb:
        ko: "자리 문제가 아닙니다. 두 기호가 <b>다른 것을 연다</b>는 것이 요점이에요."
        en: "It is not about room. The point is that the two symbols <b>open different things</b>."
    - t:
        ko: "C 와 구별하려고"
        en: "To tell it apart from C"
      ok: false
      fb:
        ko: "구별이 목적이 아닙니다. 이름을 묶는 통이 생기면서 여는 기호가 필요해진 거예요."
        en: "Distinction was not the goal. Boxes for names arrived, and an opener was needed."
queries:
  - { grammars: [cpp], file: ./namespace-qualification.scm }
examples:
  - code: "void f() { std::string s; }               // s -> 빈 글자 묶음 (std::string)"
    expect: { sites: 1, form: qualified, hole: "::", picks: { 1: "::", 2: "std", 3: "string" } }
  - code: "void f() { auto n = std::max(a, b); }     // n -> 둘 중 큰 값"
    expect: { sites: 1, form: qualified, hole: "::", picks: { 1: "::", 2: "std", 3: "max" } }
  - code: "void f() { auto n = s.size(); }           // 점은 값 안을 연다"
    expect: none
