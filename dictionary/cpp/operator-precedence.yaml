schema: 1
id: cpp/operator-precedence
# 0부 §0.1 #10, 축 5. `common/` 에 대응이 없다 — 우선순위 표는 언어마다 다르고,
# 특히 C++ 은 `<<` 에 다른 뜻을 붙이고도 **원래 자리의 세기**를 그대로 쓴다. 전이하면
# 「어느 것이 센가」가 거짓으로 옮겨 간다 (D4).
universal: null
name: { ko: 어느 것이 먼저 묶이나, en: Operator precedence }
token: "&&"
grammars: [cpp]
framework: null
essential: true
difficulty: 3
prereq: [cpp/arithmetic, cs/operator-precedence]
confusions: []
dict:
  one_liner:
    ko: "괄호가 없으면 세기가 묶는 순서를 정하고, 그 세기는 뜻을 바꿔도 안 따라온다."
    en: "Without brackets, strength fixes the grouping, and a new meaning brings none."
  why:
    ko: >-
      {{site.line}}행의 식은 적힌 순서대로 안 읽힙니다. 기호마다 <b>세기</b>가 있어서 센 것이
      먼저 묶여요. C++ 에서 이 규칙이 특히 무는 자리가 하나 있습니다 — 이 언어는 기호에
      <b>다른 뜻을 붙일 수 있는데</b>, 세기는 원래 자리의 것을 그대로 씁니다. 그래서
      <code>std::cout &lt;&lt; a &amp; b</code> 는 <code>a &amp; b</code> 를 흘려보내는 것이
      아니라 <code>(std::cout &lt;&lt; a) &amp; b</code> 예요. 뜻은 바꿔도 세기는 못 바꾼다는
      것이 <b>연산자에 뜻 붙이기</b>로 가는 첫 노출입니다.
    en: >-
      The expression on line {{site.line}} is not read in written order. Every symbol has a
      <b>strength</b>, and the stronger one groups first. There is one spot where the rule bites
      hardest in C++: the language lets you <b>give a symbol another meaning</b>, but the
      strength stays that of its original place. So <code>std::cout &lt;&lt; a &amp; b</code>
      does not send <code>a &amp; b</code> anywhere; it is <code>(std::cout &lt;&lt; a) &amp; b</code>.
      Meaning is yours, strength is not — the first hint of what operator overloading costs.
  trace:
    - ko: "{{site.line}}행에서 센 기호가 먼저 자기 양쪽을 묶는다."
      en: "On line {{site.line}} the stronger symbol grabs its two sides first."
    - ko: "{{pick.1|code}}{{pick.1|josa:은,는}} 그 묶음이 끝난 뒤에 일한다."
      en: "{{pick.1|code}} works only after that grouping is done."
    - ko: "괄호를 적으면 그 순서를 사람이 못 박는다."
      en: "Writing brackets pins that order by hand."
rule:
  ko: "<b>센 기호가 먼저 묶는다.</b> 뜻을 새로 붙여도 세기는 원래 자리 그대로다."
  en: "<b>The stronger symbol groups first.</b> A new meaning does not bring a new strength."
result:
  label: { ko: "{{site.line}}행이 먼저 묶는 것", en: "what line {{site.line}} groups first" }
  value: "{{pick.3}}"
  note: { ko: "적힌 순서가 아니라 세기 순서", en: "strength order, not written order" }
ok:
  ko: "{{pick.3|code}}{{pick.3|josa:이,가}} 먼저 하나로 묶이고 나서 {{pick.1|code}} 차례입니다."
  en: "{{pick.3|code}} is grouped into one first, and only then comes {{pick.1|code}}."
payoff:
  ko: >-
    이걸 알면 「괄호를 넣었더니 값이 달라졌다」가 풀립니다 — 원래 묶임이 달랐던 겁니다.
  en: >-
    This untangles “adding brackets changed the value” — the grouping was different all along.
bridge:
  ko: >-
    러스트는 <code>as</code> 가 가장 세서 다른 자리에서 뭅니다. 파이썬은 비교를 이어 쓸 수
    있어 또 다르고요. <b>표는 언어마다 따로</b> 외워야 합니다.
  en: >-
    In Rust <code>as</code> is the strongest and bites elsewhere. Python chains comparisons and
    differs again. <b>The table is per language</b>.
misconceptions:
  # `cpp.md` §0.1 #10.
  - ko: "적힌 순서대로 왼쪽부터 읽힌다 — 세기가 먼저입니다. 같은 세기일 때만 방향이 정해요."
    en: "It reads left to right as written — strength comes first; direction settles ties only."
  - ko: "뜻을 새로 붙이면 세기도 정할 수 있다 — 못 정합니다. 세기는 원래 자리 그대로예요."
    en: "A new meaning lets you set the strength — it does not; the original strength stays."
  - ko: "괄호는 읽기 좋으라고 넣는 것이다 — <b>묶임을 바꿉니다</b>. 값이 달라져요."
    en: "Brackets are for readability — they <b>change the grouping</b> and so the value."
point:
  - q:
      ko: "{{site.line}}행에서 <b>나중에 일하는 기호</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the symbol that works last</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>왼쪽 조각</b>입니다. 조각은 순서를 안 정하고, 순서를 정하는 것은 기호의 세기예요."
          en: "{{pick.2|code}} is the <b>left piece</b>. Pieces settle no order; the symbols' strength does."
        edge:
          h: { ko: "가장 날카로운 자리 — 조각이냐 세기냐", en: "The sharpest spot — a piece or a strength" }
          code:
            - "1 + 2 * 3;      // 7"
            - "(1 + 2) * 3;    // 9"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>먼저 묶이는 조각</b>입니다. 먼저 묶인다는 것과 나중에 일한다는 것은 반대예요."
          en: "{{pick.3|code}} is the <b>piece grouped first</b>. Grouped first is the opposite of working last."
        edge:
          h: { ko: "가장 날카로운 자리 — 먼저 묶이냐 나중에 일하느냐", en: "The sharpest spot — grouped first or working last" }
          code:
            - "2 * 3;          // 먼저 묶인다"
            - "1 + (2 * 3);    // 더하기는 나중이다"
blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 <b>둘 다 참일 때만</b> 참입니다."
      en: "Choose what goes in the blank. Line {{site.line}} holds <b>only when both hold</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "&&", mono: true }
      - t: "||"
        mono: true
        diag:
          t:
            ko: "이건 <b>하나만 참이어도</b> 참입니다. 그리고 세기가 더 약해서 둘이 섞이면 이쪽이 나중에 묶여요."
            en: "That holds when <b>either</b> does, and it is the weaker of the two, so it groups last when both appear."
          edge:
            h: { ko: "가장 날카로운 자리 — 둘 다냐 하나라도냐", en: "The sharpest spot — both or either" }
            code:
              - "a && b || c;    // (a && b) || c"
              - "a || b && c;    // a || (b && c)"
      - t: "&"
        mono: true
        diag:
          t:
            ko: "기호 하나짜리는 <b>비트를 맞대는</b> 셈이라 오른쪽을 언제나 계산합니다. 둘짜리는 왼쪽이 거짓이면 오른쪽을 아예 안 봐요."
            en: "The single symbol lines up <b>bits</b> and always computes the right side. The doubled one never even looks right when the left is false."
          edge:
            h: { ko: "가장 날카로운 자리 — 오른쪽을 보느냐", en: "The sharpest spot — is the right side looked at" }
            code:
              - "p && p->ok();   // p 가 없으면 안 부른다"
              - "p & p->ok();    // 언제나 부른다"
      - t: "and"
        mono: true
        diag:
          t:
            ko: "이 낱말도 C++ 에서 <b>같은 뜻</b>으로 섭니다. 다만 실코드에서 거의 안 쓰여서, 읽는 사람이 기호 쪽을 먼저 찾아요."
            en: "That word does stand in C++ with the <b>same meaning</b>. It is just so rare in real code that a reader looks for the symbol first."
          edge:
            h: { ko: "가장 날카로운 자리 — 되느냐 읽히느냐", en: "The sharpest spot — valid or readable" }
            code:
              - "if (a && b)     // 흔한 표기"
              - "if (a and b)    // 같은 뜻, 드물다"
why_gate:
  q:
    ko: "뜻을 새로 붙일 수 있는 언어가 왜 <b>세기는 못 바꾸게</b> 했을까요?"
    en: "Why does a language that lets you give symbols new meanings <b>not let you change strength</b>?"
  choices:
    - t:
        ko: "세기가 바뀌면 같은 코드가 타입에 따라 다르게 묶여서 — 읽는 사람이 타입을 알기 전에는 식을 못 읽으니까"
        en: "Because strength that varies by type would group the same code differently — no one could read an expression before knowing the types"
      ok: true
      fb:
        ko: "그 방향입니다. 그럼 뜻을 붙일 때 무엇을 조심해야 하는지도 적어 보세요."
        en: "That is the direction. Add what to watch for when giving a symbol a new meaning."
    - t:
        ko: "세기를 바꾸는 문법이 아직 안 나와서"
        en: "Because the syntax for changing strength has not arrived yet"
      ok: false
      fb:
        ko: "안 만든 것이 아니라 <b>안 만들기로 한</b> 것입니다. 표가 하나여야 식을 읽을 수 있어요."
        en: "It was not left out; it was <b>left out on purpose</b>. One table is what makes expressions readable."
    - t:
        ko: "컴파일러가 느려져서"
        en: "Because the compiler would slow down"
      ok: false
      fb:
        ko: "속도 문제가 아닙니다. 사람이 못 읽게 되는 것이 문제예요."
        en: "Speed is not it. The problem is that people could no longer read the code."
queries:
  - { grammars: [cpp], file: ./operator-precedence.scm }
examples:
  - code: "void f() { bool ok = a && b || c; }       // ok -> (a && b) || c"
    expect: { sites: 1, form: shortcircuit, hole: "||", picks: { 1: "||", 2: "a && b", 3: "c" } }
  - code: "void f() { int n = 1 + 2 * 3; }           // n -> 7 (int, 곱하기가 먼저 묶인다)"
    expect: { sites: 1, form: mixed, picks: { 1: "+", 2: "1", 3: "2 * 3" } }
  - code: "void f() { int n = 1 + 2; }               // 섞인 세기가 없다"
    expect: none
