schema: 1
id: react/functional-state-update
universal: null
name: { ko: "함수형 상태 갱신", en: "Functional state update" }
token: "setX(prev =>"
grammars: [typescript, tsx, javascript]
framework: react
essential: false
difficulty: 3
prereq: [ts/arrow-function, ts/object-spread]
confusions: [ts/array-map-immutable, ts/array-push-mutate]

dict:
  one_liner: "이전 값을 <b>인자로 받아</b> 새 값을 돌려주면, 밀린 갱신도 순서대로 쌓인다."
  why: >-
    상태를 바꾸는 요청은 곧바로 반영되지 않고 모였다가 처리됩니다. 바깥에서 읽은 값으로 계산하면
    그 사이에 다른 갱신이 끼어들어도 알아채지 못해요. {{site.line}}행처럼 이전 값을 받아 쓰면
    {{ctx.setter|code}}{{ctx.setter|josa:이,가}} 항상 <b>바로 앞의 결과</b>를 넘겨 줍니다.
  trace:
    - "{{ctx.setter|code}}{{ctx.setter|josa:이,가}} 갱신 요청을 줄에 세운다."
    - "차례가 오면 바로 앞 결과를 {{pick.1|code}} 에 넣어 부른다."
    - "{{pick.2|code}}{{pick.2|josa:이,가}} 돌려준 것이 {{site.line}}행 갱신의 새 상태가 된다."

rule: "<b>이전 값이 필요하면 인자로 받는다.</b> 바깥에서 읽은 값은 그 사이에 낡을 수 있다."
result:
  label: "새 상태"
  value: "{{pick.2}}"
  note: "직전 결과를 받아 계산한다"
ok: >-
  이전 값을 <b>인자로 받으면</b> 요청이 몇 개 밀려 있어도 각자 바로 앞 결과 위에 쌓입니다. 바깥
  변수를 읽어 계산하면 여러 요청이 같은 값을 보고 겹쳐 써요.
payoff: "빠르게 두 번 누르면 하나가 사라지는 종류의 문제가 이 표기에서는 생기지 않습니다."
bridge: "{{pick.1|code}}{{pick.1|josa:은,는}} <b>읽기 전용</b>입니다 — 직접 고치지 말고 새 값을 돌려주세요."
misconceptions:
  - "갱신을 부르면 그 줄 다음에 바로 새 값을 읽을 수 있다 — 다음 그리기 때 반영됩니다."
  - "값을 하나씩 두 번 부르면 두 번 오른다 — 바깥 값을 읽어 썼다면 한 번만 오릅니다."

point:
  - q: "{{site.line}}행에서 <b>직전 상태가 담겨 들어오는 이름</b>을 짚어 보세요."
    hint: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
    answer: pick.1
    diag:
      pick.2:
        t: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>돌려주는 새 값</b>입니다. 계산의 재료로 들어오는 직전 상태는 그 앞에 있는 이름이에요."
        edge:
          h: "가장 날카로운 자리 — 들어오는 것과 나가는 것"
          code:
            - "setN((prev) => prev + 1)   // prev 가 들어오고 prev + 1 이 나간다"
            - "setN(n + 1)                // 바깥의 n 을 읽는다"

meaning:
  - q: "{{site.line}}행 같은 갱신을 한 번에 두 번 부르면 결과는 어떻게 될까요?"
    hint: "각 요청이 무엇을 보고 계산하는지."
    options:
      - t: "두 번 모두 반영된다 — 각자 바로 앞 결과 위에 쌓인다"
      - t: "한 번만 반영된다"
        diag:
          t: "바깥 값을 읽어 계산했다면 그렇게 됩니다. 이전 값을 <b>인자로 받으면</b> 각 요청이 서로 다른 값을 보므로 둘 다 남아요."
          edge:
            h: "가장 날카로운 자리 — 무엇을 보고 계산하나"
            code:
              - "setN(n + 1); setN(n + 1)                    // 1 만 오른다"
              - "setN((p) => p + 1); setN((p) => p + 1)      // 2 오른다"
      - t: "마지막 것만 남고 앞의 것은 사라진다"
        diag:
          t: "덮어쓰는 건 <b>고정된 값</b>을 넘길 때입니다. 함수를 넘기면 차례로 불려서 앞의 결과가 뒤의 재료가 돼요."
          edge:
            h: "가장 날카로운 자리 — 값이냐 함수냐"
            code:
              - "setN(5); setN(5)                 // 5"
              - "setN((p) => p + 5); setN((p) => p + 5)   // 10 만큼 오른다"
      - t: "그 줄에서 바로 두 번 다시 그린다"
        diag:
          t: "요청은 모였다가 한 번에 처리되는 것이 보통입니다. 갱신 횟수와 다시 그리는 횟수는 같지 않아요."
          edge:
            h: "가장 날카로운 자리 — 요청 수와 그리기 수"
            code:
              - "setA(1); setB(2)   // 요청 둘"
              - "// 다시 그리기는 한 번으로 묶일 수 있다"

queries:
  - { grammars: [typescript, tsx], file: ./functional-state-update.scm }
  - { grammars: [javascript], file: ./functional-state-update.js.scm }

examples:
  - code: "setCount((prev) => prev + 1)"
    expect: { sites: 1, form: paren, picks: { 1: "prev", 2: "prev + 1" }, ctx: { setter: "setCount" } }
  - code: "setItems(next => [...next, item])"
    expect: { sites: 1, form: bare, picks: { 1: "next" } }
  - code: "setCount(count + 1)"
    expect: none
