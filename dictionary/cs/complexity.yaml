dict:
  one_liner:
    ko: "열 개에서 멀쩡하던 것이 만 개에서 멈추는 이유."
    en: "Why something fine at ten items stops at ten thousand."
  why:
    ko: >-
      코드가 얼마나 빠른지는 초로 재는 것이 아니라 <b>입력이 두 배가 되면 일이 몇 배가 되는지</b>로 봅니다.
      항목마다 한 번씩 보면 두 배가 될 때 일도 두 배예요. 항목마다 <b>전체를 다시 훑으면</b>
      두 배일 때 일은 네 배가 됩니다. 이 차이는 열 개에서는 안 보이고 만 개에서 갑자기 보입니다.
      그래서 「내 컴퓨터에서는 빨랐는데」가 나와요. 재는 것은 기계의 속도가 아니라
      <b>일이 늘어나는 모양</b>이고, 그 모양은 코드를 보면 알 수 있습니다.
    en: >-
      Speed is judged not in seconds but by <b>how much work doubles when the input doubles</b>.
      Touch each item once and doubling doubles the work. Touch each item and <b>rescan everything
      inside</b>, and doubling quadruples it. At ten items this is invisible; at ten thousand it
      is sudden. Hence “it was fast on my machine”. What you measure is not machine speed but
      <b>the shape of the growth</b>, and the shape is readable from the code.
  trace: []
rule:
  ko: "<b>초를 재지 말고 배수를 재라.</b> 두 배 넣었을 때 몇 배가 되는가."
  en: "<b>Measure the multiple, not the seconds.</b> Double the input and see the factor."
ok:
  ko: >-
    한 번 훑는 것으로 끝나면 항목 수에 비례합니다. 훑는 안에서 또 훑으면 곱해집니다.
    코드를 보고 훑기가 몇 겹인지 세면 됩니다.
  en: >-
    One pass scales with the item count. A pass inside a pass multiplies. Count how many passes
    are nested and you have it.
misconceptions:
  - ko: "빠른 컴퓨터를 쓰면 해결된다 — 모양이 나쁘면 배수가 더 빨리 따라잡습니다."
    en: "A faster machine fixes it — a bad shape outruns hardware."
  - ko: "지금 빠르니 괜찮다 — 지금의 크기에서만 참인 말입니다."
    en: "It is fast now, so it is fine — true only at today's size."
  - ko: "훑기가 없으면 빠르다 — 안 보이는 훑기가 이름 뒤에 숨어 있을 수 있습니다."
    en: "No visible loop means fast — a loop can hide behind a name."
meaning:
  - q:
      ko: "항목이 10개일 때 즉시 끝나던 코드가 10,000개에서 멈춥니다. <b>무엇을 봐야 하나요?</b>"
      en: "Instant at 10 items, stuck at 10,000. <b>What should you look at?</b>"
    hint:
      ko: "느려진 배수가 항목이 늘어난 배수보다 훨씬 큽니다."
      en: "It slowed far more than the input grew."
    options:
      - t: { ko: "항목이 두 배가 될 때 일이 몇 배가 되는지", en: "How much the work multiplies when items double" }
      - t: { ko: "한 항목을 처리하는 데 걸리는 시간", en: "How long one item takes" }
        diag:
          t:
            ko: "한 항목의 시간은 <b>10개일 때도 같습니다</b>. 그때 즉시 끝났다면 그 값은 작아요 — 늘어나는 모양이 문제입니다."
            en: "The per-item time is <b>the same at 10</b>. If that was instant, the value is small — the growth shape is the problem."
          edge:
            h: { ko: "가장 날카로운 자리 — 한 번의 값이냐 늘어나는 모양이냐", en: "The sharpest spot — per-item or growth" }
            code:
              - "한 항목: 크기와 무관"
              - "모양: 크기에 따라 곱해진다"
      - t: { ko: "기계의 메모리가 모자란지", en: "Whether the machine ran out of memory" }
        diag:
          t:
            ko: "메모리도 같은 방식으로 늘어날 수 있어 <b>가까운 자리</b>입니다. 다만 먼저 물을 것은 일의 배수예요."
            en: "Memory grows the same way, so this is <b>close</b>. But the first question is the work multiple."
          edge:
            h: { ko: "가장 날카로운 자리 — 시간이냐 공간이냐", en: "The sharpest spot — time or space" }
            code:
              - "둘 다 모양이 있다"
              - "먼저 재는 것은 일의 배수"
      - t: { ko: "코드에 오류가 있어 무한히 도는지", en: "Whether a defect makes it loop forever" }
        diag:
          t:
            ko: "무한히 돈다면 <b>10개에서도</b> 안 끝났을 것입니다. 크기에 따라 갈리는 것이 모양의 표시예요."
            en: "Looping forever would hang <b>at 10 too</b>. Depending on size is the signature of shape."
          edge:
            h: { ko: "가장 날카로운 자리 — 크기와 관계있나", en: "The sharpest spot — does size matter" }
            code:
              - "무한 반복: 크기와 무관하게 안 끝난다"
              - "모양: 작을 때는 끝난다"
