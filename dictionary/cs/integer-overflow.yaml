schema: 1
id: cs/integer-overflow
universal: null
name: { ko: "자리가 모자라면 도로 돈다", en: "Integer overflow" }
token: null
grammars: []
framework: null
# 짚을 노드가 없다 — 창은 이 개념을 `prereq` 로 가리키는 언어 개념에서 빌린다 (D157).
track_default: t0
essential: false
difficulty: 2
prereq: [cs/bit-and-byte]
confusions: []
queries: []
dict:
  one_liner:
    ko: "자릿수가 정해져 있어, 가장 큰 값 다음이 가장 작은 값이다."
    en: "The digits are fixed, so past the largest comes the smallest."
  why:
    ko: >-
      자릿수가 정해진 시계에서 12 다음이 1인 것처럼, 자리가 정해진 정수는 끝에서 <b>처음으로 돌아옵니다</b>.
      더했는데 값이 <b>작아지는</b> 일이 여기서 나와요. 무서운 것은 대개 <b>조용하다</b>는 점입니다 —
      멈추지도 않고 메시지도 없이 이상한 값이 계속 흘러갑니다.
      정수가 무한히 커지는 언어에서는 이 일이 안 일어나고, 도는 대신 멈추는 언어도 있습니다.
      「내 언어는 어느 쪽인가」를 아는 것이 이 개념의 실용적인 부분입니다.
    en: >-
      Like a clock where 1 follows 12, a fixed-width integer <b>wraps to the beginning</b> at the
      end. This is how adding can make a value <b>smaller</b>. The dangerous part is that it is
      usually <b>quiet</b> — no stop, no message, just a strange value flowing on. Languages with
      unbounded integers never do this; some stop instead of wrapping. Knowing which yours does is
      the practical half of this idea.
  trace: []
rule:
  ko: "<b>끝에 닿으면 처음으로 돌아온다.</b> 대개 아무 말 없이 그렇게 된다."
  en: "<b>Reach the end and it returns to the start.</b> Usually without a word."
ok:
  ko: >-
    범위 안에서는 정수 계산이 언제나 정확합니다. 범위를 벗어날 수 있는 자리만 미리 세어 두면 됩니다.
  en: >-
    Inside the range, integer arithmetic is always exact. You only need to spot the places that
    can leave the range.
misconceptions:
  - ko: "넘치면 오류가 난다 — 조용히 도는 언어가 많습니다."
    en: "Overflow raises an error — many languages wrap silently."
  - ko: "큰 수를 안 쓰면 안 일어난다 — 작은 수끼리 곱해도 넘칠 수 있습니다."
    en: "Avoiding big numbers avoids it — multiplying small numbers overflows too."
  - ko: "모든 언어가 같다 — 정수가 무한히 커지는 언어도 있습니다."
    en: "All languages behave alike — some grow integers without limit."
meaning:
  - q:
      ko: "두 수를 더했는데 결과가 두 수보다 작았습니다. <b>무슨 일이 있었나요?</b>"
      en: "Adding two numbers gave a result smaller than both. <b>What happened?</b>"
    hint:
      ko: "담을 자리가 정해져 있으면 그 끝에서 무슨 일이 날까요."
      en: "What happens at the end of a fixed number of slots?"
    options:
      - t: { ko: "담을 자리를 넘겨 값이 처음으로 돌아갔다", en: "It passed the last slot and returned to the start" }
      - t: { ko: "덧셈이 뺄셈으로 잘못 번역됐다", en: "The addition was translated as a subtraction" }
        diag:
          t:
            ko: "번역은 덧셈 그대로였습니다. 작아진 것은 <b>담을 자리의 끝</b>을 지나서예요."
            en: "The translation was addition. The value fell because it passed <b>the last slot</b>."
          edge:
            h: { ko: "가장 날카로운 자리 — 연산이냐 담는 자리냐", en: "The sharpest spot — the operation or the slots" }
            code:
              - "연산: 그대로 더했다"
              - "자리: 끝을 지나 돌아왔다"
      - t: { ko: "소수 계산이라 오차가 났다", en: "It was decimal arithmetic, so it drifted" }
        diag:
          t:
            ko: "소수의 오차는 <b>조금씩</b> 어긋나는 것이고, 이건 부호가 뒤집힐 만큼 <b>크게</b> 달라진 경우예요."
            en: "Decimal drift is a <b>small</b> deviation; this is large enough to flip the sign."
          edge:
            h: { ko: "가장 날카로운 자리 — 조금이냐 통째로냐", en: "The sharpest spot — a little or wholesale" }
            code:
              - "소수: 0.1 + 0.2 가 살짝 어긋난다"
              - "정수: 가장 큰 값 다음이 가장 작은 값"
      - t: { ko: "한 수가 사실 음수였다", en: "One of them was negative all along" }
        diag:
          t:
            ko: "그랬다면 <b>둘 중 하나보다는</b> 컸을 것입니다. 둘 다보다 작아진 것이 돌아왔다는 표시예요."
            en: "Then the result would still beat <b>one of them</b>. Smaller than both is the sign of a wrap."
          edge:
            h: { ko: "가장 날카로운 자리 — 어느 쪽보다 작나", en: "The sharpest spot — smaller than which" }
            code:
              - "음수 하나: 한쪽보다는 크다"
              - "돌아옴: 둘 다보다 작다"
