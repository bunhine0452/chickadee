schema: 1
id: cs/closure-capture
universal: null
name: { ko: "함수가 바깥 값을 데려간다", en: "Closure capture" }
token: null
grammars: []
framework: null
# 짚을 노드가 없다 — 창은 이 개념을 `prereq` 로 가리키는 언어 개념에서 빌린다 (D157).
track_default: t0
essential: false
difficulty: 3
prereq: [cs/scope-and-lifetime, cs/value-vs-reference]
confusions: []
queries: []
dict:
  one_liner:
    ko: "데려가는 것이 값이냐 자리냐로 언어가 갈린다."
    en: "Languages split on whether the value or the place is carried."
  why:
    ko: >-
      함수 안에서 함수를 만들면, 안쪽 함수는 바깥의 이름을 씁니다.
      바깥이 끝난 뒤에 안쪽이 돌 수도 있으니 <b>무언가를 데려가야</b> 해요.
      그 무언가가 <b>그때의 값</b>이면 나중에 바깥이 바뀌어도 안쪽은 옛 값을 봅니다.
      <b>그 값이 놓인 자리</b>면 나중에 바뀐 값을 봐요. 반복문 안에서 함수를 만들었더니
      전부 마지막 값을 보는 유명한 상황이 <b>자리를 데려간</b> 경우이고,
      언어마다 이 결정이 다릅니다.
    en: >-
      A function made inside a function uses outer names. The inner may run after the outer has
      ended, so it must <b>carry something</b>. If that something is <b>the value at the time</b>,
      later changes outside are invisible to it. If it is <b>the place the value sits</b>, it sees
      the change. The famous case of functions made in a loop all seeing the last value is
      <b>carrying the place</b>, and languages decide this differently.
  trace: []
rule:
  ko: "<b>데려간 것이 자리면 나중 값을 본다.</b> 값이면 그때 값을 본다."
  en: "<b>Carry the place and it sees later values.</b> Carry the value and it sees that moment."
ok:
  ko: >-
    안쪽 함수는 바깥 이름을 그대로 씁니다. 언제 도는지와 무엇을 데려갔는지를 알면
    무엇을 볼지도 알 수 있어요.
  en: >-
    The inner function uses the outer names as written. Know when it runs and what it carried, and
    you know what it will see.
misconceptions:
  - ko: "함수를 만든 순간의 값이 언제나 남는다 — 자리를 데려가면 나중 값이 보입니다."
    en: "The value at creation is what remains — carrying the place shows later values."
  - ko: "바깥이 끝나면 안쪽이 못 돈다 — 데려간 것이 있으면 돕니다."
    en: "The inner cannot run after the outer ends — it can, with what it carried."
  - ko: "이건 언어의 결함이다 — 두 방식 다 쓸모가 있어 언어가 <b>고른</b> 것입니다."
    en: "This is a language defect — both behaviours are useful; the language <b>chose</b>."
meaning:
  - q:
      ko: "반복문 안에서 만든 함수들이 전부 마지막 값을 봅니다. <b>무엇을 데려간 건가요?</b>"
      en: "Functions made in a loop all see the last value. <b>What did they carry?</b>"
    hint:
      ko: "각자 다른 값을 봤다면 데려간 것이 달랐을 것입니다."
      en: "Seeing different values would mean carrying something else."
    options:
      - t: { ko: "값이 놓인 자리 — 그 자리를 반복이 계속 고쳤다", en: "The place — and the loop kept overwriting it" }
      - t: { ko: "마지막 값 하나를 미리 계산해서", en: "The last value, computed in advance" }
        diag:
          t:
            ko: "만들 때는 <b>마지막 값을 알 수 없습니다</b>. 마지막에 보이는 이유는 나중에 그 자리를 읽어서예요."
            en: "At creation the <b>last value is not known yet</b>. It shows up because the place is read later."
          edge:
            h: { ko: "가장 날카로운 자리 — 언제 읽나", en: "The sharpest spot — when it reads" }
            code:
              - "만들 때 읽음: 각자 다른 값"
              - "돌 때 읽음: 전부 마지막 값"
      - t: { ko: "함수를 하나만 만들어서 같은 함수가 여러 번 쓰였다", en: "Only one function was made and reused" }
        diag:
          t:
            ko: "함수는 <b>반복 횟수만큼</b> 만들어졌습니다. 만들어진 함수들이 같은 자리를 보고 있을 뿐이에요."
            en: "The functions were made <b>once per iteration</b>. They merely look at the same place."
          edge:
            h: { ko: "가장 날카로운 자리 — 개수냐 보는 곳이냐", en: "The sharpest spot — how many or where they look" }
            code:
              - "개수: 반복만큼 있다"
              - "보는 곳: 하나를 같이 본다"
      - t: { ko: "반복문이 끝나면 값이 초기화돼서", en: "The loop reset the value when it finished" }
        diag:
          t:
            ko: "초기화가 아니라 <b>마지막에 넣은 값이 남은</b> 것입니다. 그 값을 나중에 읽은 것이 전부예요."
            en: "Nothing was reset — the <b>last assigned value remains</b>, and it is read afterwards."
          edge:
            h: { ko: "가장 날카로운 자리 — 지워졌나 남았나", en: "The sharpest spot — cleared or kept" }
            code:
              - "초기화: 값이 없어야 한다"
              - "남음: 마지막 값이 그대로"
