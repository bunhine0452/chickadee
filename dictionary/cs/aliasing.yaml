schema: 1
id: cs/aliasing
universal: null
name: { ko: "이름 둘이 한 값을 가리키면", en: "Aliasing" }
token: null
grammars: []
framework: null
# 짚을 노드가 없다 — 창은 이 개념을 `prereq` 로 가리키는 언어 개념에서 빌린다 (D157).
track_default: t0
essential: false
difficulty: 3
prereq: [cs/value-vs-reference]
confusions: []
queries: []
dict:
  one_liner:
    ko: "한쪽에서 고치면 다른 쪽이 바뀐다. 버그의 가장 큰 갈래다."
    en: "Change it here and it changes there. The largest family of bugs."
  why:
    ko: >-
      이름 둘이 같은 값을 가리키면, 어느 이름으로 고쳐도 <b>둘 다</b> 바뀝니다.
      이것이 문제인 이유는 고치는 자리와 놀라는 자리가 <b>멀리 떨어져 있어서</b>예요.
      A 함수에서 목록을 고쳤는데 화면은 B 컴포넌트가 그립니다. B 를 백 번 읽어도 원인이 없어요.
      그래서 「어디를 고쳤나」가 아니라 <b>「이 값을 누가 또 들고 있나」</b>를 세는 것이 답입니다.
      이름이 둘 이상인 값이 몇 개인지가 그 코드에서 놀랄 일의 개수입니다.
    en: >-
      When two names point at one value, changing through either changes <b>both</b>. The trouble
      is that the place of the change and the place of the surprise are <b>far apart</b>. Function
      A edits a list; component B draws the screen. Reading B a hundred times finds nothing. The
      question is not “what did I change” but <b>“who else holds this value”</b>. The number of
      values with more than one name is the number of surprises in that code.
  trace: []
rule:
  ko: "<b>이름을 세지 말고 값을 세라.</b> 한 값을 여럿이 들고 있으면 고치는 자리가 여럿이다."
  en: "<b>Count values, not names.</b> One value in many hands means many places that change it."
ok:
  ko: >-
    같은 값을 여럿이 보는 것 자체는 필요한 일입니다. 문제는 보는 쪽 중 하나가 고칠 때이고,
    고치는 쪽을 하나로 줄이면 놀랄 일도 하나로 줄어듭니다.
  en: >-
    Many readers of one value is often what you want. The trouble starts when one of them writes.
    Reduce the writers to one and the surprises reduce with them.
misconceptions:
  - ko: "이름이 다르면 값도 다르다 — 이름은 값의 개수를 안 알려 줍니다."
    en: "Different names mean different values — names do not count values."
  - ko: "복사하면 안전하다 — 겉만 복사하면 안쪽은 여전히 같은 값입니다."
    en: "Copying is safe — a shallow copy still shares what is inside."
  - ko: "읽기만 하면 상관없다 — 맞습니다. 문제는 <b>한 쪽이라도 고칠 때</b>입니다."
    en: "Reading is fine — true. The problem starts when <b>any one</b> writes."
meaning:
  - q:
      ko: "A 에서 목록을 고쳤더니 손대지 않은 B 의 화면이 바뀌었습니다. <b>무엇을 세야 하나요?</b>"
      en: "Editing a list in A changed B's screen, which you never touched. <b>What should you count?</b>"
    hint:
      ko: "A 와 B 가 각자 다른 목록을 들고 있었다면 이런 일이 없었을 것입니다."
      en: "If A and B held different lists this could not happen."
    options:
      - t: { ko: "그 목록을 지금 몇 곳이 들고 있는지", en: "How many places currently hold that list" }
      - t: { ko: "A 가 목록을 몇 번 고쳤는지", en: "How many times A edited the list" }
        diag:
          t:
            ko: "한 번만 고쳐도 같은 일이 납니다. 횟수는 <b>얼마나 자주</b>를 알려 줄 뿐 왜인지를 안 알려 줘요."
            en: "One edit does it too. The count says <b>how often</b>, never why."
          edge:
            h: { ko: "가장 날카로운 자리 — 횟수냐 공유냐", en: "The sharpest spot — count or sharing" }
            code:
              - "한 번 고쳐도 바뀐다"
              - "공유가 없으면 백 번 고쳐도 안 바뀐다"
      - t: { ko: "B 가 화면을 몇 번 다시 그리는지", en: "How many times B redraws" }
        diag:
          t:
            ko: "다시 그리는 것은 <b>바뀐 값을 보여 주는</b> 단계입니다. 값이 왜 바뀌었는지는 그 앞에 있어요."
            en: "Redrawing is the step that <b>shows</b> a changed value. Why it changed is upstream."
          edge:
            h: { ko: "가장 날카로운 자리 — 보이는 곳이냐 바뀐 곳이냐", en: "The sharpest spot — shown or changed" }
            code:
              - "B: 바뀐 것을 보여 준다"
              - "A: 바꿨다 — 같은 값이라서"
      - t: { ko: "A 와 B 가 같은 파일에 있는지", en: "Whether A and B are in the same file" }
        diag:
          t:
            ko: "파일이 달라도, 아주 멀어도 같은 값이면 같은 일이 납니다. 오히려 <b>멀수록</b> 찾기 어려워요."
            en: "Different files, far apart — same value, same effect. Distance makes it <b>harder</b>, not different."
          edge:
            h: { ko: "가장 날카로운 자리 — 거리냐 같은 값이냐", en: "The sharpest spot — distance or identity" }
            code:
              - "거리: 찾기의 난이도"
              - "같은 값: 일어나느냐 마느냐"
