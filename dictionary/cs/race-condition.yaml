schema: 1
id: cs/race-condition
universal: null
name: { ko: "순서가 안 정해져 있으면", en: "Race condition" }
token: null
grammars: []
framework: null
# 짚을 노드가 없다 — 창은 이 개념을 `prereq` 로 가리키는 언어 개념에서 빌린다 (D157).
track_default: t0
essential: false
difficulty: 4
prereq: [cs/aliasing, cs/concurrency-vs-parallelism]
confusions: []
queries: []
dict:
  one_liner:
    ko: "같은 코드가 대개 맞고 가끔 어긋나는 자리."
    en: "Where the same code is mostly right and occasionally not."
  why:
    ko: >-
      둘 이상이 <b>같은 값</b>을 만지는데 그 사이 순서가 정해져 있지 않으면, 결과가 순서에 따라 달라집니다.
      「읽고 → 더하고 → 쓰기」 사이에 다른 쪽이 끼어들면 한 번의 더하기가 통째로 사라져요.
      무서운 것은 <b>대개는 맞다</b>는 점입니다. 백 번에 아흔아홉 번 맞으면 테스트가 초록이고,
      기계가 빨라지거나 부하가 늘면 갑자기 자주 어긋납니다.
      재료가 둘입니다 — <b>공유</b>와 <b>고치기</b>. 둘 중 하나를 없애면 이 문제도 없어집니다.
    en: >-
      When two or more touch <b>the same value</b> with no fixed order between them, the result
      depends on the order. Slip another party between “read → add → write” and one whole addition
      vanishes. The dangerous part is that it is <b>mostly right</b>. Ninety-nine times in a
      hundred means a green test, and a faster machine or heavier load suddenly makes it frequent.
      Two ingredients: <b>sharing</b> and <b>writing</b>. Remove either and the problem goes.
  trace: []
rule:
  ko: "<b>공유와 고치기가 함께 있어야 일어난다.</b> 하나만 없애면 된다."
  en: "<b>It needs sharing and writing together.</b> Removing either is enough."
ok:
  ko: >-
    한 번에 하나만 만지도록 묶어 두거나, 아예 안 나누거나, 안 고치면 됩니다.
    세 방법 다 재료 중 하나를 없애는 것입니다.
  en: >-
    Let one touch it at a time, do not share it, or do not write it. All three remove one of the
    ingredients.
misconceptions:
  - ko: "테스트가 통과하면 없는 문제다 — 대개 맞는 것이 이 문제의 성질입니다."
    en: "A passing test means no problem — being mostly right is this problem's nature."
  - ko: "한 줄로 적으면 안 끼어든다 — 한 줄도 여러 걸음으로 나뉩니다."
    en: "One line cannot be interrupted — one line is several steps."
  - ko: "읽기만 하면 위험하다 — 아무도 안 고치면 여럿이 읽어도 안전합니다."
    en: "Reading is risky too — with no writer, many readers are safe."
meaning:
  - q:
      ko: "두 곳에서 같은 값을 하나씩 늘렸는데 결과가 하나만 늘었습니다. <b>무엇이 사라졌나요?</b>"
      en: "Two places each added one to the same value and it grew by one. <b>What vanished?</b>"
    hint:
      ko: "늘리기는 읽고·더하고·쓰기 세 걸음입니다."
      en: "Incrementing is three steps: read, add, write."
    options:
      - t: { ko: "한쪽이 읽은 뒤 쓰기 전에 다른 쪽이 끼어들어 그 더하기가 덮였다", en: "One read, another slipped in before its write, and that addition was overwritten" }
      - t: { ko: "더하기 자체가 한 번 건너뛰었다", en: "One addition was skipped" }
        diag:
          t:
            ko: "두 더하기는 <b>둘 다 돌았습니다</b>. 사라진 것은 계산이 아니라 <b>쓴 결과</b>예요."
            en: "Both additions <b>ran</b>. What vanished is not a computation but <b>a written result</b>."
          edge:
            h: { ko: "가장 날카로운 자리 — 안 돌았나 덮였나", en: "The sharpest spot — skipped or overwritten" }
            code:
              - "안 돌았다: 코드가 안 불렸다"
              - "덮였다: 돌았는데 결과가 지워졌다"
      - t: { ko: "값이 담을 자리를 넘겨 돌아왔다", en: "The value wrapped past its slots" }
        diag:
          t:
            ko: "그 경우라면 값이 <b>크게</b> 달라집니다. 하나만 모자란 것은 순서 문제의 모양이에요."
            en: "Wrapping changes the value <b>drastically</b>. Being short by exactly one is the shape of an ordering problem."
          edge:
            h: { ko: "가장 날카로운 자리 — 얼마나 어긋났나", en: "The sharpest spot — by how much" }
            code:
              - "돌아옴: 부호까지 뒤집힌다"
              - "덮임: 딱 그만큼 모자라다"
      - t: { ko: "두 곳이 사실 서로 다른 값을 만졌다", en: "The two touched different values after all" }
        diag:
          t:
            ko: "다른 값이었다면 <b>각자 하나씩</b> 늘었을 것입니다. 합쳐서 하나인 것이 같은 값을 만졌다는 표시예요."
            en: "Different values would each be up by one. A combined total of one is the tell that they shared."
          edge:
            h: { ko: "가장 날카로운 자리 — 공유했나 안 했나", en: "The sharpest spot — shared or not" }
            code:
              - "따로: 각각 +1"
              - "공유: 합쳐서 +1"
