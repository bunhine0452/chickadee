# 짚을 노드가 없다 — 창은 이 개념을 `prereq` 로 가리키는 언어 개념에서 빌린다 (D157).
track_default: t0
essential: false
difficulty: 3
prereq: [cs/memory-address, cs/call-stack]
confusions: []
queries: []
dict:
  one_liner:
    ko: "함수가 끝나면 사라지는 자리와, 치우라고 해야 사라지는 자리."
    en: "Space that goes when the function ends, and space that goes when told."
  why:
    ko: >-
      함수가 도는 동안 쓰는 자리는 <b>함수가 끝나면 통째로</b> 걷힙니다 — 빠르고 셈이 간단하지만
      함수보다 오래 살아야 하는 값은 못 둡니다. 그래서 다른 자리가 있어요.
      거기에 둔 값은 함수가 끝나도 남고, 대신 <b>언제 치울지</b>를 누군가 정해야 합니다.
      사람이 정하는 언어가 있고 규칙이 정하는 언어가 있고 청소부가 정하는 언어가 있습니다.
      「왜 이 값을 돌려주면 안 되나」·「왜 이건 직접 해제해야 하나」가 다 이 갈림에서 나옵니다.
    en: >-
      Space used while a function runs is reclaimed <b>whole, when it ends</b> — fast and simple,
      but nothing that must outlive the function can go there. So there is other space. Values put
      there survive the function, and in exchange someone must decide <b>when to reclaim</b> them.
      In some languages a person decides, in others a rule, in others a collector. “Why can I not
      return this value” and “why must I free this one” both come from this split.
  trace: []
rule:
  ko: "<b>오래 살아야 하면 저절로 걷히는 자리에 못 둔다.</b> 대신 치울 사람이 필요하다."
  en: "<b>What must outlive the call cannot sit in the space that is reclaimed.</b> Someone must reclaim instead."
ok:
  ko: >-
    잠깐 쓰는 값은 저절로 걷히는 자리에 두고, 오래 살아야 하는 값은 다른 자리에 둡니다.
    어느 쪽인지를 언어가 정해 주기도 하고 사람이 적기도 합니다.
  en: >-
    Short-lived values go in the space that clears itself; long-lived values go elsewhere. Some
    languages decide for you; in others you write it down.
misconceptions:
  - ko: "저절로 걷히는 자리가 더 좋다 — 크기와 수명이 정해진 값에만 좋습니다."
    en: "The self-clearing space is better — only for values of known size and lifetime."
  - ko: "청소부가 있으면 메모리를 신경 안 써도 된다 — 안 놓아 준 값은 청소부도 못 치웁니다."
    en: "A collector means never thinking about memory — it cannot reclaim what you still hold."
  - ko: "둘은 물리적으로 다른 장치다 — 같은 메모리이고 <b>치우는 규칙</b>이 다릅니다."
    en: "They are different hardware — same memory, different reclaiming rules."
meaning:
  - q:
      ko: "함수 안에서 만든 값을 돌려줬더니 밖에서 쓸 때 이상해졌습니다. <b>어디에 뒀던 값인가요?</b>"
      en: "A value made inside a function went odd after being returned. <b>Where had it been put?</b>"
    hint:
      ko: "함수가 끝날 때 통째로 걷히는 자리가 있습니다."
      en: "One space is reclaimed whole when the function ends."
    options:
      - t: { ko: "함수가 끝나면 걷히는 자리 — 걷힌 뒤를 본 것이다", en: "The space reclaimed at return — you looked after it was taken" }
      - t: { ko: "치우라고 해야 걷히는 자리인데 아직 안 치웠다", en: "The space that waits to be told, and it was not told yet" }
        diag:
          t:
            ko: "안 치웠으면 값은 <b>멀쩡히 있습니다</b>. 이상해질 이유가 없어요 — 오히려 안 치운 채 잊는 것이 다른 문제입니다."
            en: "If it was not reclaimed the value is <b>still fine</b>. Nothing would go odd — forgetting to reclaim is a different problem."
          edge:
            h: { ko: "가장 날카로운 자리 — 걷혔나 남았나", en: "The sharpest spot — reclaimed or left" }
            code:
              - "걷혔다: 그 자리를 읽으면 이상하다"
              - "남았다: 값은 그대로, 자리만 낭비"
      - t: { ko: "값이 커서 옮기다 깨졌다", en: "It was large and broke while being moved" }
        diag:
          t:
            ko: "크기는 <b>어느 자리에 둘지</b>를 정할 때 보는 것이고, 돌려준 뒤 이상해지는 것은 수명 문제예요."
            en: "Size informs <b>which space to use</b>; going odd after return is a lifetime problem."
          edge:
            h: { ko: "가장 날카로운 자리 — 크기냐 수명이냐", en: "The sharpest spot — size or lifetime" }
            code:
              - "크기: 어디에 둘까"
              - "수명: 언제까지 살까"
      - t: { ko: "함수가 값을 돌려주는 것 자체가 금지돼 있다", en: "Returning a value is itself forbidden" }
        diag:
          t:
            ko: "돌려주는 것은 늘 하는 일입니다. 조심할 것은 <b>걷힐 자리를 가리켜</b> 돌려주는 경우예요."
            en: "Returning is ordinary. The care is for returning something that <b>points at reclaimed space</b>."
          edge:
            h: { ko: "가장 날카로운 자리 — 무엇을 돌려주나", en: "The sharpest spot — what is returned" }
            code:
              - "값: 복사돼 나간다"
              - "걷힐 자리: 나간 뒤 비어 있다"
