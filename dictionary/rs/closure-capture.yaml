schema: 1
id: rs/closure-capture
# 2부 (`rs.md` §4 · §0.6 이 2부에 둔다). 보편형은 `common/function-value`. Rust 에서 다시 배울 것은
# 캡처를 `&`·`&mut`·값 중 무엇으로 할지 **컴파일러가 정한다**는 것 — `move` 가 그 결정을 값 쪽으로
# 강제한다. 기계는 `cs/closure-capture`.
universal: common/function-value
name: { ko: 클로저가 무엇을 데려가나, en: What a closure takes along }
token: "|x|"
grammars: [rust]
framework: null
essential: true
difficulty: 3
prereq: [rs/borrow-shared, rs/function-item, cs/closure-capture]
confusions: []

dict:
  one_liner:
    ko: "세로줄 사이에 인자를 적은 이름 없는 함수. 바깥 이름을 쓰면 빌릴지 가져갈지를 컴파일러가 정한다."
    en: "A nameless function between bars; the compiler decides how it takes outer names."
  why:
    ko: >-
      {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:으로,로}} 시작하는 것은 이름 없는 함수이고, 몸통 {{pick.2|code}}{{pick.2|josa:이,가}} 바깥의 이름을
      쓰면 그 이름을 <b>데려갑니다</b>. 어떻게 데려가느냐가 이 언어의 요점이에요 — 읽기만 하면 `&` 로
      빌리고, 고치면 `&mut` 로 빌리고, 값이 필요하면 가져가는데, 그 셋 중 무엇인지를 <b>컴파일러가
      몸통을 보고 정합니다</b>. 그래서 클로저가 사는 동안 그 이름은 빌린 상태이고, 클로저가 원본보다
      오래 살면(스레드·반환) E0373 이 나요. 앞에 `move` 를 적으면 결정이 「가져간다」로 고정되고,
      스레드에 넘길 때 그것이 필요한 이유입니다.
    en: >-
      What starts at {{pick.1|code}} on line {{site.line}} is a nameless function, and when its body
      {{pick.2|code}} uses an outer name it <b>takes that name along</b>. How it does so is the point —
      read-only use borrows with `&`, changing borrows with `&mut`, and needing the value takes it,
      and <b>the compiler decides which by reading the body</b>. So while the closure lives that name
      is borrowed, and a closure that outlives its source (a thread, a return value) is E0373. Writing
      `move` in front pins the decision to “take,” which is why it is needed when handing one to a thread.
  trace:
    - ko: "{{site.line}}행의 {{pick.1|code}}{{pick.1|josa:이,가}} 이름 없는 함수를 연다."
      en: "{{pick.1|code}} on line {{site.line}} opens a nameless function."
    - ko: "몸통 {{pick.2|code}}{{pick.2|josa:이,가}} 쓰는 바깥 이름마다 컴파일러가 빌림·고침·가져감 중 하나를 고른다."
      en: "For each outer name the body {{pick.2|code}} uses, the compiler picks borrow, change, or take."
    - ko: "클로저가 사는 동안 그 이름들은 그 상태로 묶여 있다."
      en: "While the closure lives those names stay in that state."

rule:
  ko: "<b>캡처 방식은 몸통이 정한다.</b> 읽으면 빌리고, 고치면 &mut, 가져가려면 move 를 적는다."
  en: "<b>The body decides the capture.</b> Reading borrows, changing borrows mutably, and move forces taking."
result:
  label:
    ko: "{{site.line}}행의 클로저"
    en: "the closure on line {{site.line}}"
  value: "{{pick.1}} {{pick.2}}"
  note:
    ko: "바깥 이름을 어떻게 데려가나"
    en: "how outer names come along"
ok:
  ko: "{{pick.1|code}} {{pick.2|code}}{{pick.2|josa:은,는}} 값이 된 함수입니다. 바깥 이름이 있다면 그것을 어떻게 데려갈지는 이미 정해졌어요."
  en: "{{pick.1|code}} {{pick.2|code}} is a function turned into a value. If it uses outer names, how they come along is already decided."
payoff:
  ko: "이걸 알면 「스레드에 넘길 때 왜 `move` 를 붙여야 하나」(E0373)가 풀립니다 — 빌림이 원본보다 오래 살 수 없어서요."
  en: "This untangles “why must I write `move` when handing a closure to a thread” (E0373) — a borrow cannot outlive its source."
bridge:
  ko: "JS 의 화살표 함수는 바깥 변수를 그냥 봅니다. Rust 는 <b>어떻게</b> 보는지를 정하고, 그 결정이 컴파일 오류로 드러납니다."
  en: "A JS arrow function just sees outer variables. Rust decides <b>how</b> it sees them, and that decision shows up as compile errors."
misconceptions:
  - ko: "클로저는 바깥 값을 복사한다 — 기본은 <b>빌림</b>입니다. 가져가는 것은 `move` 거나 값이 필요할 때뿐이에요."
    en: "A closure copies outer values — the default is a <b>borrow</b>. Taking happens only with `move` or when the value itself is needed."
  - ko: "`move` 는 값을 옮겨 오는 낱말이라 원본을 늘 못 쓴다 — Copy 타입이면 복사돼서 원본이 남습니다."
    en: "`move` always disables the original — for Copy types it copies, and the original stays usable."
  - ko: "클로저 타입은 하나다 — 캡처 방식에 따라 `Fn`·`FnMut`·`FnOnce` 셋으로 갈립니다."
    en: "There is one closure type — capture style splits them into `Fn`, `FnMut` and `FnOnce`."

point:
  - q:
      ko: "{{site.line}}행에서 <b>클로저의 인자 자리</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the closure's parameter slot</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 클로저의 <b>몸통</b>입니다. 인자는 그 앞 세로줄 사이에 있어요."
          en: "{{pick.2|code}} is the closure's <b>body</b>. The parameters sit between the bars before it."
        edge:
          h: { ko: "가장 날카로운 자리 — 인자냐 몸통이냐", en: "The sharpest spot — parameters or body" }
          code:
            - "|x| x * 2"
            - "//^인자 ^몸통"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 클로저를 <b>받는 쪽</b>이거나 묶는 낱말입니다. 클로저 자체는 세로줄부터예요."
          en: "{{pick.3|code}} is the <b>receiver</b> of the closure or the binding word. The closure itself starts at the bars."
        edge:
          h: { ko: "가장 날카로운 자리 — 받는 쪽이냐 클로저냐", en: "The sharpest spot — the receiver or the closure" }
          code:
            - "items.iter().map(|x| x * 2)"
            - "//           ^받는 쪽 ^클로저"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행의 클로저는 바깥 값을 <b>가져갑니다</b> — 다른 스레드로 넘어가요."
      en: "Choose what goes in the blank. The closure on line {{site.line}} <b>takes</b> its outer values — it goes to another thread."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "move", mono: true }
      - t: "ref"
        mono: true
        diag:
          t:
            ko: "이건 <b>패턴</b>에서 빌려 묶으라는 표시입니다. 클로저 앞에는 못 와요."
            en: "That tells a <b>pattern</b> to bind by borrowing. It cannot go in front of a closure."
          edge:
            h: { ko: "가장 날카로운 자리 — 어디에 오나", en: "The sharpest spot — where it goes" }
            code:
              - "let ref r = x;       // 패턴"
              - "move || work(data)   // 클로저"
      - t: "mut"
        mono: true
        diag:
          t:
            ko: "이건 <b>이름</b>에 붙는 표시입니다. 클로저를 저장한 이름에는 붙어도(`let mut f`) 클로저 앞에는 못 와요."
            en: "That goes on a <b>name</b>. It may mark the name holding a closure (`let mut f`), but not the closure itself."
          edge:
            h: { ko: "가장 날카로운 자리 — 이름이냐 클로저냐", en: "The sharpest spot — the name or the closure" }
            code:
              - "let mut f = || n += 1;   // 이름에"
              - "move || work(data)       // 클로저에"
      - t: "async"
        mono: true
        diag:
          t:
            ko: "이건 <b>미래</b>를 만드는 낱말입니다. 값을 가져가는 것과는 다른 축이라, 둘 다 필요하면 `async move` 예요."
            en: "That makes a <b>future</b>. It is a different axis from taking values; when both are needed it is `async move`."
          edge:
            h: { ko: "가장 날카로운 자리 — 다른 축", en: "The sharpest spot — a different axis" }
            code:
              - "async { … }        // 미래"
              - "async move { … }   // 미래 + 가져감"

why_gate:
  q:
    ko: "Rust 는 왜 캡처 방식을 <b>사람이 아니라 컴파일러가</b> 정하게 했을까요?"
    en: "Why does Rust let <b>the compiler, not the writer</b>, decide the capture?"
  choices:
    - t:
        ko: "몸통이 이름을 어떻게 쓰는지에 답이 이미 있어서 — 사람이 적으면 몸통과 어긋날 수 있다"
        en: "Because the body already says how each name is used — a written choice could disagree with the body"
      ok: true
      fb:
        ko: "그 방향입니다. 이 클로저가 데려가는 바깥 이름이 무엇이고 어떻게 쓰이는지 적어 보세요."
        en: "That is the direction. Name the outer names this closure takes and how each is used."
    - t:
        ko: "클로저를 짧게 적으려고"
        en: "To keep closures short"
      ok: false
      fb:
        ko: "짧아지긴 하지만 이유는 아닙니다. 몸통과 어긋나지 않게 하는 것이 이유예요."
        en: "Shorter, yes, but that is not the reason. Never disagreeing with the body is."
    - t:
        ko: "사람이 정할 수 없어서"
        en: "Because the writer cannot decide"
      ok: false
      fb:
        ko: "정할 수 있습니다 — `move` 가 그거예요. 다만 한 방향으로만요."
        en: "The writer can — that is `move`. Only in one direction, though."

queries:
  - { grammars: [rust], file: ./closure-capture.scm }

examples:
  - code: "fn f() { let doubled = items.iter().map(|x| x * 2); }   // 어댑터에 넘긴 클로저"
    expect: { sites: 1, form: closure-arg, picks: { 1: "|x|", 2: "x * 2", 3: "map" } }
  - code: "fn f() { let add = |a: i32| a + base; }            // base 를 빌려 데려간다"
    expect: { sites: 1, form: closure-let, picks: { 1: "|a: i32|", 2: "a + base", 3: "let" } }
  - code: "fn f() { spawn(move || work(data)); }              // data 를 가져간다"
    expect: { sites: 1, form: move-closure, hole: "move", picks: { 1: "move", 2: "||", 3: "work(data)" } }
  - code: "fn f() { let n = add(1, 2); }                       // 이름 있는 함수 호출"
    expect: none
