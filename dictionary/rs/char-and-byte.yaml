schema: 1
id: rs/char-and-byte
# 0부 축 C (`rs.md` §0.1 #6). 보편형은 걸지 않는다 — `common/text-literal` 은 `rs/string-literal` 이
# 받고, 이 개념은 「한 글자가 한 바이트가 아니다」라는 인코딩 층이다. 자바의 `text-length` 와 같은
# 자리이고 그쪽도 보편형이 없다.
universal: null
name: { ko: 문자와 바이트, en: Characters and bytes }
token: "char"
grammars: [rust]
framework: null
essential: true
difficulty: 2
prereq: [cs/text-encoding, cs/bit-and-byte]
confusions: []

dict:
  one_liner:
    ko: "글자 수와 바이트 수는 다르다. 길이 메서드는 바이트를 세고, 글자는 따로 걸어야 센다."
    en: "Character count and byte count differ; the length method counts bytes."
  why:
    ko: >-
      Rust 의 글자 값은 UTF-8 로 담깁니다. 영문 한 글자는 1바이트지만 한글 한 글자는 3바이트라
      <code>"가".len()</code> 은 <b>3</b> 이에요. {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:은,는}} 그 차이가
      코드에 드러나는 자리입니다. 그리고 <code>s[0]</code> 은 아예 컴파일이 안 됩니다 — 바이트 색인이
      글자를 반으로 자를 수 있어서요. 셋을 갈라야 합니다: <code>char</code>(유니코드 글자 하나, 4바이트) ·
      <code>b'a'</code>(바이트 하나, u8) · <code>.chars()</code> 대 <code>.bytes()</code>(무엇으로 걷나).
    en: >-
      Rust stores text as UTF-8. A Latin letter is one byte, a Korean syllable is three, so
      <code>"가".len()</code> is <b>3</b>. {{pick.1|code}} on line {{site.line}} is where that difference
      surfaces in code. And <code>s[0]</code> does not compile at all — a byte index could cut a
      character in half. Three things to keep apart: <code>char</code> (one Unicode scalar, four bytes),
      <code>b'a'</code> (one byte, u8), and <code>.chars()</code> versus <code>.bytes()</code> (what you
      walk by).
  trace:
    - ko: "{{pick.2|code}}{{pick.2|josa:은,는}} UTF-8 바이트의 줄이다."
      en: "{{pick.2|code}} is a run of UTF-8 bytes."
    - ko: "{{site.line}}행의 {{pick.1|code}}{{pick.1|josa:이,가}} 그 줄을 무엇으로 셀지 정한다 — 바이트냐 글자냐."
      en: "{{pick.1|code}} on line {{site.line}} decides what to count that run by — bytes or characters."
    - ko: "한글·이모지가 섞이면 두 수가 갈린다."
      en: "Mix in Korean or emoji and the two counts part ways."

rule:
  ko: "<b>길이는 바이트다.</b> 글자를 세려면 글자로 걷고, 바이트로는 색인하지 않는다."
  en: "<b>Length is bytes.</b> To count characters, walk by characters; never index by byte."
result:
  label:
    ko: "{{site.line}}행의 셈"
    en: "the count on line {{site.line}}"
  value: "{{pick.2}}.{{pick.1}}{{pick.3}}"
  note:
    ko: "무엇을 세는지가 이름에 있다"
    en: "the name says what is counted"
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:을,를}} {{pick.1|code}}{{pick.1|josa:으로,로}} 셌습니다 — 그것이 바이트인지 글자인지가 답입니다."
  en: "{{pick.2|code}} was counted through {{pick.1|code}} — whether that is bytes or characters is the answer."
payoff:
  ko: "이걸 알면 「한글 이름이 왜 세 배로 세지나」와 「왜 `s[0]` 이 안 되나」가 함께 풀립니다."
  en: "This untangles both “why does a Korean name count triple” and “why is `s[0]` refused.”"
bridge:
  ko: "파이썬 `len(\"가\")` 은 1 입니다 — 글자를 셉니다. Rust 는 바이트를 세고, 글자는 따로 걷게 합니다."
  en: "Python's `len(\"가\")` is 1 — it counts characters. Rust counts bytes and makes you walk characters separately."
misconceptions:
  - ko: "`.len()` 은 글자 수다 — <b>바이트 수</b>입니다. 한글 한 글자에 3 이 더해져요."
    en: "`.len()` is the character count — it is the <b>byte count</b>. Each Korean syllable adds 3."
  - ko: "`s[0]` 으로 첫 글자를 꺼낸다 — 컴파일이 멈춥니다. 첫 글자는 `s.chars().next()` 예요."
    en: "`s[0]` gets the first character — the build stops. The first character is `s.chars().next()`."
  - ko: "`char` 는 1바이트다 — 4바이트입니다. 1바이트가 필요하면 `b'a'` 라는 다른 값이 있어요."
    en: "`char` is one byte — it is four. For one byte there is a different value, `b'a'`."

point:
  - q:
      ko: "{{site.line}}행에서 <b>바이트로 셀지 글자로 셀지를 정하는 이름</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the name that decides bytes or characters</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 세어지는 <b>글자 값</b>입니다. 값은 자기가 몇으로 세일지 모르고, 세는 법은 뒤의 이름이 정해요."
          en: "{{pick.2|code}} is the <b>text being counted</b>. The value does not know its own count; the name after it decides how."
        edge:
          h: { ko: "가장 날카로운 자리 — 값이냐 세는 법이냐", en: "The sharpest spot — the value or the way of counting" }
          code:
            - "\"가\".len()             // 3"
            - "\"가\".chars().count()   // 1"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 호출의 <b>괄호</b>입니다. 무엇을 셀지는 그 앞의 이름에 있어요."
          en: "{{pick.3|code}} is the call's <b>parentheses</b>. What gets counted is in the name before them."
        edge:
          h: { ko: "가장 날카로운 자리 — 괄호냐 이름이냐", en: "The sharpest spot — the parentheses or the name" }
          code:
            - "s.len()     // 바이트"
            - "s.chars()   // 글자로 걷기"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 글자 값의 <b>바이트 수</b>를 셉니다."
      en: "Choose what goes in the blank. Line {{site.line}} counts the <b>bytes</b> of a text value."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "len", mono: true }
      - t: "chars"
        mono: true
        diag:
          t:
            ko: "이건 <b>글자로 걷는</b> 이름입니다. 수가 아니라 걸음이 나와서, 세려면 뒤에 `count()` 를 붙여야 해요."
            en: "That <b>walks by characters</b>. It yields steps, not a number — add `count()` to count them."
          edge:
            h: { ko: "가장 날카로운 자리 — 수냐 걸음이냐", en: "The sharpest spot — a number or a walk" }
            code:
              - "\"가\".len()             // 3"
              - "\"가\".chars().count()   // 1"
      - t: "count"
        mono: true
        diag:
          t:
            ko: "글자 값에는 이 이름이 <b>없습니다</b>. 걸음(`chars()`) 뒤에만 붙어요."
            en: "Text values <b>do not have</b> this name. It attaches only after a walk (`chars()`)."
          edge:
            h: { ko: "가장 날카로운 자리 — 누구의 메서드인가", en: "The sharpest spot — whose method it is" }
            code:
              - "s.count()           // E0599"
              - "s.chars().count()   // 된다"
      - t: "size"
        mono: true
        diag:
          t:
            ko: "글자 값에는 이 이름이 <b>없습니다</b>. 바이트 수를 주는 것은 `len` 하나예요."
            en: "Text values <b>do not have</b> this name. The one that gives bytes is `len`."
          edge:
            h: { ko: "가장 날카로운 자리 — 없는 이름", en: "The sharpest spot — a name that is not there" }
            code:
              - "s.size()   // E0599"
              - "s.len()    // 바이트 수"

why_gate:
  q:
    ko: "Rust 는 왜 <code>s[0]</code> 을 <b>컴파일 단계에서 막을까요</b>?"
    en: "Why does Rust <b>refuse <code>s[0]</code> at compile time</b>?"
  choices:
    - t:
        ko: "바이트 하나가 글자의 절반일 수 있어, 그 자리를 돌려주면 깨진 글자가 나오기 때문"
        en: "Because one byte may be half a character, and handing it back would produce a broken one"
      ok: true
      fb:
        ko: "그 방향입니다. 그럼 첫 글자는 어떻게 꺼내는지도 적어 보세요."
        en: "That is the direction. Add how the first character is fetched instead."
    - t:
        ko: "색인이 느려서"
        en: "Because indexing is slow"
      ok: false
      fb:
        ko: "속도 문제가 아닙니다. 바이트 색인은 빠르지만 뜻이 없어서 막는 거예요."
        en: "Not speed. A byte index is fast but meaningless, so it is refused."
    - t:
        ko: "글자 값은 색인을 아예 못 해서"
        en: "Because text cannot be indexed at all"
      ok: false
      fb:
        ko: "범위 색인 `&s[0..3]` 은 됩니다 — 글자 경계에 맞으면요. 막는 것은 바이트 하나예요."
        en: "Range indexing `&s[0..3]` works when it lands on a character boundary. What is refused is a single byte."

queries:
  - { grammars: [rust], file: ./char-and-byte.scm }

examples:
  - code: "fn f() { let n = \"가\".len(); }               // n -> 3 (usize) — 바이트"
    expect: { sites: 1, form: text-of-literal, hole: "len", picks: { 1: "len", 2: "\"가\"", 3: "()" } }
  - code: "fn f() { for ch in name.chars() { } }         // 글자로 걷는다"
    expect: { sites: 1, form: text-walk, picks: { 1: "chars", 2: "name", 3: "()" } }
  - code: "fn f() { let c = 'a'; }                       // c -> 'a' (char, 4바이트)"
    expect: { sites: 1, form: char-let, picks: { 1: "let", 2: "c", 3: "'a'" } }
  - code: "fn f() { let n = items.len(); }               // 목록의 길이일 수 있다 — 안 잡는다"
    expect: none
