schema: 1
id: rs/option
# 2부 (`rs.md` §3). 보편형은 `common/absent-value`. Rust 에서 다시 배울 것은 `null` 이 **없다**는 것 —
# 「없을 수 있음」이 타입에 적혀 있고 꺼내려면 반드시 갈라야 한다. `cs/null-reference` 를 타입으로
# 없앤 쪽의 예다(rust-axis §2.2).
universal: common/absent-value
name: { ko: 없을 수 있는 값, en: A value that may be absent }
token: "Option"
grammars: [rust]
framework: null
essential: true
difficulty: 2
prereq: [rs/enum-item, cs/null-reference]
confusions: []

dict:
  one_liner:
    ko: "없을 수 있음이 타입에 적힌다. 안의 값은 있는지 갈라 본 뒤에만 꺼낼 수 있다."
    en: "Possible absence is written into the type; the inner value needs a check first."
  why:
    ko: >-
      다른 언어의 `null` 은 어느 참조에나 숨어 있어 「여기 없을 수 있나」를 코드가 말해 주지 않습니다.
      Rust 에는 `null` 이 없어요. 대신 {{site.line}}행의 {{pick.1|code}} 처럼 <b>타입에 적습니다</b> — 이 값은
      {{pick.2|code}} 이거나 없음입니다. 그래서 그냥 쓰면 컴파일이 멈추고(E0308), `if let Some(v) = x`
      나 `match` 로 <b>갈라서</b> 꺼내야 해요. 없는 자리를 잊는 실수가 실행 시 `NullPointerException`
      대신 컴파일 오류가 되는 것이 이 타입의 값이고, 그 정체는 갈래 둘짜리 평범한 `enum` 입니다.
      `.unwrap()` 은 「없으면 터져라」라 갈라 보기를 건너뛰는 지름길이에요.
    en: >-
      A `null` elsewhere can hide in any reference, so the code never says “this may be absent.”
      Rust has no `null`. Instead it is <b>written into the type</b>, like {{pick.1|code}} on line
      {{site.line}} — this value is a {{pick.2|code}} or nothing. Using it directly stops the build
      (E0308); you <b>take it apart</b> with `if let Some(v) = x` or `match`. A forgotten absent case
      becomes a compile error instead of a run-time `NullPointerException` — that is what this type
      buys, and it is nothing more than an ordinary two-variant enum. `.unwrap()` means “blow up if
      absent,” a shortcut past the check.
  trace:
    - ko: "{{site.line}}행의 {{pick.1|code}}{{pick.1|josa:이,가}} 「{{pick.2|code}} 이거나 없음」이라고 적는다."
      en: "{{pick.1|code}} on line {{site.line}} says “a {{pick.2|code}} or nothing.”"
    - ko: "그 값은 그대로 못 쓴다 — 갈래를 갈라야 안의 값이 나온다."
      en: "The value cannot be used as is — the inner value appears only after the variant is checked."
    - ko: "없음 갈래를 안 다루면 컴파일러가 멈춘다."
      en: "Skip the absent arm and the compiler stops."

rule:
  ko: "<b>null 은 없고 없을 수 있음은 타입에 있다.</b> 갈라야 꺼내고, 없음을 안 다루면 컴파일 오류다."
  en: "<b>There is no null; possible absence is a type.</b> Take it apart to extract, and an unhandled absence is a compile error."
result:
  label:
    ko: "{{site.line}}행의 값"
    en: "the value on line {{site.line}}"
  value: "{{pick.1}}<{{pick.2}}>"
  note:
    ko: "있거나 없거나"
    en: "present or absent"
ok:
  ko: "{{pick.1|code}}<{{pick.2}}> 는 {{pick.2|code}}{{pick.2|josa:이,가}} 있을 수도 없을 수도 있다는 뜻입니다. 갈라 봐야 압니다."
  en: "{{pick.1|code}}<{{pick.2}}> means a {{pick.2|code}} may or may not be there. You find out by taking it apart."
payoff:
  ko: "이걸 알면 「왜 값을 바로 못 쓰고 `if let` 을 적나」가 풀립니다 — 없을 수 있음이 타입이라서요."
  en: "This untangles “why can I not use the value directly, why `if let`” — because absence is a type."
bridge:
  ko: "자바의 `null` 은 어느 참조에나 숨습니다. Rust 는 없을 수 있는 자리만 <b>이 타입</b>으로 표시해 나머지는 늘 있다고 보증합니다."
  en: "Java's `null` hides in any reference. Rust marks only the maybe-absent spots with <b>this type</b> and guarantees the rest are always there."
misconceptions:
  - ko: "`None` 은 `null` 과 같다 — `None` 은 갈래 하나이고 타입에 드러납니다. 다른 타입의 값에는 숨을 수 없어요."
    en: "`None` is the same as `null` — `None` is one variant, visible in the type. It cannot hide in a value of another type."
  - ko: "없음도 조건이 된다 — `if x` 는 E0308 입니다. `if let Some(v) = x` 로 갈라요."
    en: "Absence works as a condition — `if x` is E0308. Take it apart with `if let Some(v) = x`."
  - ko: "`.unwrap()` 은 값을 꺼내는 정상 방법이다 — 없으면 <b>패닉</b>합니다. 갈라 보기를 건너뛴 지름길이에요."
    en: "`.unwrap()` is the normal way to extract — it <b>panics</b> when absent. It is a shortcut past the check."

point:
  - q:
      ko: "{{site.line}}행에서 <b>없을 수 있음을 적은 타입</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the type that writes down possible absence</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>있을 때의 타입</b>입니다. 없을 수 있다는 것은 그것을 감싼 바깥 타입이 말해요."
          en: "{{pick.2|code}} is <b>the type when present</b>. That it may be absent is said by the outer type wrapping it."
        edge:
          h: { ko: "가장 날카로운 자리 — 안이냐 바깥이냐", en: "The sharpest spot — inside or outside" }
          code:
            - "String           // 늘 있다"
            - "Option<String>   // 없을 수도"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 안의 타입을 여는 <b>꺾쇠</b>입니다. 없을 수 있음을 말하는 것은 그 앞의 이름이에요."
          en: "{{pick.3|code}} is the <b>angle bracket</b> opening the inner type. The name before it says absence is possible."
        edge:
          h: { ko: "가장 날카로운 자리 — 이름이냐 괄호냐", en: "The sharpest spot — the name or the bracket" }
          code:
            - "Option<u32>"
            - "// ^이름 ^꺾쇠"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행의 값은 <b>없을 수도</b> 있습니다."
      en: "Choose what goes in the blank. The value on line {{site.line}} <b>may be absent</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "Option", mono: true }
      - t: "Result"
        mono: true
        diag:
          t:
            ko: "이건 <b>됐거나 오류거나</b>입니다. 없음이 아니라 <b>왜 안 됐는지</b>를 함께 들어요."
            en: "That is <b>fine or an error</b>. Instead of plain absence it carries <b>why</b> it did not work out."
          edge:
            h: { ko: "가장 날카로운 자리 — 없음이냐 이유냐", en: "The sharpest spot — absence or a reason" }
            code:
              - "Option<u32>          // 값 또는 없음"
              - "Result<u32, Error>   // 값 또는 이유"
      - t: "Vec"
        mono: true
        diag:
          t:
            ko: "이건 <b>0개 이상</b>의 목록입니다. 「하나 또는 없음」은 목록이 아니에요."
            en: "That is a list of <b>zero or more</b>. “One or none” is not a list."
          edge:
            h: { ko: "가장 날카로운 자리 — 하나냐 여럿이냐", en: "The sharpest spot — one or many" }
            code:
              - "Option<u32>   // 0개 또는 1개"
              - "Vec<u32>      // 0개 이상"
      - t: "Box"
        mono: true
        diag:
          t:
            ko: "이건 값 하나를 <b>힙에</b> 두는 상자이고 늘 있습니다. 없을 수 있음과 무관해요."
            en: "That puts one value <b>on the heap</b>, and it is always there. Nothing to do with absence."
          edge:
            h: { ko: "가장 날카로운 자리 — 어디에 있나 vs 있나", en: "The sharpest spot — where it is vs whether it is" }
            code:
              - "Box<u32>      // 힙에, 늘 있다"
              - "Option<u32>   // 있을 수도"

why_gate:
  q:
    ko: "Rust 는 왜 `null` 대신 <b>타입으로</b> 없음을 적게 했을까요?"
    en: "Why does Rust write absence <b>as a type</b> instead of having `null`?"
  choices:
    - t:
        ko: "없을 수 있는 자리와 늘 있는 자리를 컴파일러가 갈라서, 없음을 안 다룬 코드를 실행 전에 잡으려고"
        en: "So the compiler can tell maybe-absent spots from always-present ones and catch unhandled absence before running"
      ok: true
      fb:
        ko: "그 방향입니다. 이 값이 없을 때 이 함수가 무엇을 하는지도 찾아보세요."
        en: "That is the direction. Find what this function does when the value is absent."
    - t:
        ko: "`null` 이 느려서"
        en: "Because `null` is slow"
      ok: false
      fb:
        ko: "속도가 아닙니다. 이 타입은 메모리에서 `null` 포인터와 같은 크기예요."
        en: "Not speed. In memory this type is the same size as a null pointer."
    - t:
        ko: "Rust 에 참조가 없어서"
        en: "Because Rust has no references"
      ok: false
      fb:
        ko: "있습니다. 다만 참조는 <b>늘 유효</b>하고 없음은 이 타입이 따로 들어요."
        en: "It has them. References are <b>always valid</b>; absence lives in this type instead."

queries:
  - { grammars: [rust], file: ./option.scm }

examples:
  - code: "fn find(id: u32) -> Option<String> { None }      // 있을 수도 없을 수도"
    expect: { sites: 1, form: option-type, hole: "Option", picks: { 1: "Option", 2: "String", 3: "<" } }
  - code: "fn f() { if let Some(v) = maybe { use_it(v); } }  // 있을 때만 꺼낸다"
    expect: { sites: 1, form: if-let-some, picks: { 1: "Some", 2: "v", 3: "maybe" } }
  - code: "fn f() { let x = Some(3); }                     // 있는 쪽 갈래"
    expect: { sites: 1, form: some, picks: { 1: "Some", 2: "3", 3: "(" } }
  - code: "fn f() { let x: i32 = 3; }                      // 늘 있다"
    expect: none
