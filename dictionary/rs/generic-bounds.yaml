schema: 1
id: rs/generic-bounds
# 2부 끝 (`rs.md` §4). 보편형은 `common/generics`. Rust 에서 다시 배울 것은 「아무 타입」이 아니라
# 「이 일을 할 줄 아는 타입」이라고 **조건을 적는다**는 것. 네 리포 합쳐 68곳 — 합성이 정본이다
# (rust-axis §2.1). `impl Trait` 대 `dyn Trait` 의 갈림은 `cs/dynamic-dispatch`.
universal: common/generics
name: { ko: 타입 자리 비우고 조건 걸기, en: "Leaving a type open, with conditions" }
token: "<T: …>"
grammars: [rust]
framework: null
essential: true
difficulty: 4
prereq: [rs/trait-item, cs/dynamic-dispatch]
confusions: []

dict:
  one_liner:
    ko: "타입 자리를 비워 두되 그 자리에 올 타입이 무엇을 할 줄 알아야 하는지를 적는다. 조건 없는 빈 자리로는 아무것도 못 한다."
    en: "Leaves a type slot open but states what its filler must be able to do."
  why:
    ko: >-
      {{site.line}}행의 {{pick.2|code}}{{pick.2|josa:은,는}} <b>비워 둔 타입 자리</b>이고, {{pick.1|code}}{{pick.1|josa:이,가}} 그 자리에 올 타입의 <b>조건</b>입니다.
      다른 언어의 제네릭과 다른 점 — 조건이 없으면 그 타입으로 <b>아무것도 못 합니다</b>. 찍지도 견주지도
      복사하지도 못해요. 무엇을 하려면 그 일을 약속하는 트레이트를 조건으로 적어야 하고, 그래서 서명만
      보면 이 함수가 타입에 무엇을 요구하는지가 다 보입니다. 채우는 방식이 둘이에요: 조건으로 적으면
      컴파일 때 타입마다 코드가 <b>복제</b>되고(단형화), `dyn Trait` 로 적으면 실행 시 표를 봅니다. 조건을
      서명 뒤 `where` 로 빼도 같은 뜻입니다.
    en: >-
      {{pick.2|code}} on line {{site.line}} is an <b>open type slot</b>, and {{pick.1|code}} is the
      <b>condition</b> on whatever fills it. Unlike generics elsewhere, without a condition you can do
      <b>nothing</b> with that type — not print it, compare it, or copy it. To do anything you name the
      trait that promises it, so the signature alone shows everything the function demands of a type.
      There are two ways to satisfy it: as a condition, the code is <b>duplicated</b> per type at compile
      time (monomorphization); as `dyn Trait`, a table is consulted at run time. Moving the condition
      after the signature with `where` means the same thing.
  trace:
    - ko: "{{site.line}}행의 {{pick.2|code}}{{pick.2|josa:이,가}} 타입 자리를 비운다."
      en: "{{pick.2|code}} on line {{site.line}} leaves a type slot open."
    - ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 그 자리에 올 타입의 조건이다 — 이것 없이는 그 값으로 아무것도 못 한다."
      en: "{{pick.1|code}} is the condition on what fills it — without it nothing can be done with the value."
    - ko: "부르는 자리마다 실제 타입이 정해지고, 컴파일러가 그 타입용 코드를 만든다."
      en: "At each call the actual type is fixed, and the compiler emits code for that type."

rule:
  ko: "<b>빈 타입 자리에는 조건이 있어야 쓸 수 있다.</b> 조건은 트레이트이고, 컴파일 때 타입마다 코드가 복제된다."
  en: "<b>An open type slot is usable only with a condition.</b> The condition is a trait, and code is duplicated per type at compile time."
result:
  label:
    ko: "{{site.line}}행의 타입 자리"
    en: "the type slot on line {{site.line}}"
  value: "{{pick.2}}: {{pick.1}}"
  note:
    ko: "조건을 채우는 타입은 누구든"
    en: "any type meeting the condition"
ok:
  ko: "{{pick.2|code}} 자리에는 {{pick.1|code}}{{pick.1|josa:을,를}} 할 줄 아는 타입이면 무엇이든 옵니다. 그 이상은 요구하지 않아요."
  en: "Any type that can do {{pick.1|code}} may fill {{pick.2|code}}. Nothing more is demanded."
payoff:
  ko: "이걸 알면 「제네릭 함수 안에서 왜 `==` 가 안 되나」(E0369)가 풀립니다 — 조건에 `PartialEq` 가 없어서요."
  en: "This untangles “why is `==` refused inside a generic function” (E0369) — `PartialEq` is not in the condition."
bridge:
  ko: "TS 의 `&lt;T&gt;` 는 조건 없이도 무엇이든 합니다(`any` 처럼). Rust 의 `&lt;T&gt;` 는 조건에 적은 것 <b>만</b> 합니다."
  en: "TS's `&lt;T&gt;` does anything even with no condition (like `any`). Rust's `&lt;T&gt;` does <b>only</b> what the condition lists."
misconceptions:
  - ko: "`&lt;T&gt;` 만 적으면 아무 타입이나 다 쓸 수 있다 — 받을 수는 있지만 그 값으로 <b>아무것도 못 합니다</b>. 조건이 능력이에요."
    en: "`&lt;T&gt;` alone lets you use any type — you can receive it, but you can do <b>nothing</b> with it. The condition is the capability."
  - ko: "제네릭은 실행 시에 타입을 본다 — 컴파일 때 타입마다 코드를 <b>복제</b>합니다. 실행 시에 보는 것은 `dyn` 이에요."
    en: "Generics inspect the type at run time — code is <b>duplicated</b> per type at compile time. Run-time lookup is `dyn`."
  - ko: "`where` 는 다른 기능이다 — 같은 조건을 서명 뒤로 옮겨 적은 것뿐입니다."
    en: "`where` is a different feature — it is the same condition written after the signature."

point:
  - q:
      ko: "{{site.line}}행에서 <b>빈 타입 자리에 건 조건</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the condition placed on the open type slot</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>비워 둔 자리의 이름</b>입니다. 그 자리에 무엇이 와도 되는지는 뒤의 조건이 말해요."
          en: "{{pick.2|code}} is the <b>name of the open slot</b>. What may fill it is said by the condition after."
        edge:
          h: { ko: "가장 날카로운 자리 — 자리냐 조건이냐", en: "The sharpest spot — the slot or the condition" }
          code:
            - "fn show<T>(x: T)            // 아무것도 못 한다"
            - "fn show<T: Display>(x: T)   // 찍을 수 있다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 자리와 조건을 <b>잇는 기호</b>이거나 여는 꺾쇠입니다. 조건 자체는 그 뒤의 이름이에요."
          en: "{{pick.3|code}} is the <b>symbol joining</b> slot and condition, or the opening bracket. The condition itself is the name after."
        edge:
          h: { ko: "가장 날카로운 자리 — 기호냐 이름이냐", en: "The sharpest spot — the symbol or the name" }
          code:
            - "<T: Display>"
            - "// ^기호 ^조건"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 이름 없는 타입 자리에 <b>조건만</b> 적습니다."
      en: "Choose what goes in the blank. Line {{site.line}} writes <b>only a condition</b> on a nameless type slot."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "impl", mono: true }
      - t: "dyn"
        mono: true
        diag:
          t:
            ko: "이건 <b>실행 시 표</b>를 보는 자리입니다. 크기를 모르는 타입이라 `&dyn` 이나 `Box&lt;dyn&gt;` 으로만 와요."
            en: "That consults a <b>run-time table</b>. Its size is unknown, so it comes only as `&dyn` or `Box&lt;dyn&gt;`."
          edge:
            h: { ko: "가장 날카로운 자리 — 컴파일 시냐 실행 시냐", en: "The sharpest spot — compile time or run time" }
            code:
              - "fn f(x: impl Display)    // 복제"
              - "fn f(x: &dyn Display)    // 표"
      - t: "where"
        mono: true
        diag:
          t:
            ko: "이건 조건을 <b>서명 뒤로</b> 빼는 낱말입니다. 인자 타입 자리에 바로 오지 않아요."
            en: "That moves the condition <b>after the signature</b>. It does not sit in a parameter's type slot."
          edge:
            h: { ko: "가장 날카로운 자리 — 어디에 적나", en: "The sharpest spot — where it is written" }
            code:
              - "fn f(x: impl Display)"
              - "fn f<T>(x: T) where T: Display"
      - t: "for"
        mono: true
        diag:
          t:
            ko: "이건 <b>되풀이</b>나 `impl X for Y` 의 낱말입니다. 조건 자리에는 안 와요."
            en: "That is the word for <b>loops</b> or `impl X for Y`. It does not go in a condition slot."
          edge:
            h: { ko: "가장 날카로운 자리 — 다른 자리의 낱말", en: "The sharpest spot — a word from another slot" }
            code:
              - "for x in v { }"
              - "fn f(x: impl Display)"

why_gate:
  q:
    ko: "Rust 는 왜 빈 타입 자리에 <b>조건이 없으면 아무것도 못 하게</b> 했을까요?"
    en: "Why does Rust let an open type slot <b>do nothing without a condition</b>?"
  choices:
    - t:
        ko: "함수가 타입에 요구하는 것을 서명에 다 적게 해서, 부르는 쪽이 몸통을 안 읽고도 어느 타입이 되는지 알게 하려고"
        en: "So everything a function demands of a type is in the signature, and callers know which types fit without reading the body"
      ok: true
      fb:
        ko: "그 방향입니다. 이 함수가 타입에 요구하는 조건을 전부 적어 보세요."
        en: "That is the direction. List every condition this function places on the type."
    - t:
        ko: "제네릭을 느리게 하려고"
        en: "To make generics slower"
      ok: false
      fb:
        ko: "반대입니다. 컴파일 때 복제되어 손으로 쓴 것과 같은 속도예요."
        en: "The other way round. Duplicated at compile time, it runs as fast as hand-written code."
    - t:
        ko: "타입을 못 알아내서"
        en: "Because it cannot figure out the type"
      ok: false
      fb:
        ko: "알아냅니다. 몸통에서 무엇을 하느냐가 아니라 서명이 무엇을 약속하느냐로 정한 거예요."
        en: "It can. The choice is to go by what the signature promises, not by what the body does."

queries:
  - { grammars: [rust], file: ./generic-bounds.scm }

examples:
  - code: "fn show<T: Display>(x: T) { }                  // T 는 Display 를 할 줄 알아야 한다"
    expect: { sites: 2, form: generic-fn, picks: { 1: "T", 2: "show", 3: "<" } }
  - code: "fn total<T>(xs: &[T]) -> usize where T: Clone { 0 }   // 조건을 뒤로 뺐다"
    expect: { sites: 2, form: generic-fn, picks: { 1: "T", 2: "total" } }
  - code: "fn print_it(x: impl Display) { }                 // 이름 없는 자리에 조건만"
    expect: { sites: 1, form: impl-trait, hole: "impl", picks: { 1: "impl", 2: "Display" } }
  - code: "fn show(x: i32) { }                             // 타입이 정해져 있다"
    expect: none
