schema: 1
id: rs/lifetime-annotation
# 2부 끝 (`rs.md` §4). 보편형은 없다. 수명은 값의 생존을 **설명**할 뿐 늘리지 않는다 — 두 연구가
# 독립적으로 「가장 큰 벽」으로 쟀다(Crichton 외 2023: 수명 문항 10~38% · Zhu 외 2022: 「항상 이해」
# 10.0%). 권한 모형(rs-learning §11.1)이 **덮지 못하는** 자리라 이 판의 `why` 는 그 한계를 적는다.
universal: null
name: { ko: 얼마나 오래 빌리나, en: How long a borrow lasts }
token: "'a"
grammars: [rust]
framework: null
essential: true
difficulty: 4
prereq: [rs/borrow-shared, rs/generic-bounds, cs/scope-and-lifetime]
confusions: []

dict:
  one_liner:
    ko: "빌린 것이 어디까지 유효한지를 이름 붙인 표시로 잇는다. 표시는 생존을 설명할 뿐 한 순간도 늘리지 않는다."
    en: "A named mark ties borrows to how long they stay valid; it never extends them."
  why:
    ko: >-
      {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:은,는}} 빌림 {{pick.2|code}}{{pick.2|josa:이,가}} <b>얼마나 오래 유효한지</b>에 붙인 이름입니다.
      같은 이름이 붙은 빌림들은 「같은 기간 안에 산다」고 묶이고, 돌려주는 빌림에 같은 이름을 적으면
      「받은 것보다 오래 못 산다」가 서명에 적혀요. 여기서 가장 자주 틀리는 것 — 이 표시는 값을 <b>더
      오래 살게 하지 않습니다</b>. 컴파일러에게 관계를 설명할 뿐이고, 설명이 실제 생존과 어긋나면
      E0597 이에요. 그래서 `'static` 을 붙여 오류를 지우는 것은 대개 잘못입니다. 함수 안의 대부분은
      생략 규칙이 채워 주고, 이 리포에서 명시한 자리 615곳 중 절반 넘게가 `&'static str` 입니다.
      정직하게 적자면 — 이 판이 다루는 자리는 소유권 모형이 가장 덜 설명하는 자리이고, 두 연구가
      그렇게 쟀습니다.
    en: >-
      {{pick.1|code}} on line {{site.line}} is a name given to <b>how long the borrow {{pick.2|code}} stays
      valid</b>. Borrows sharing a name are grouped as “alive within the same span,” and putting that
      name on a returned borrow writes “lives no longer than what came in” into the signature. The most
      frequent mistake here — this mark <b>does not make anything live longer</b>. It only explains a
      relationship to the compiler, and when the explanation disagrees with real survival it is E0597.
      So silencing an error with `'static` is usually a mistake. Inside functions the elision rules fill
      most of them in; of the 615 explicit marks in this repo, more than half are `&'static str`.
      Honestly: this plate covers the spot the ownership model explains least, and two studies measured
      exactly that.
  trace:
    - ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 빌림이다 — 어딘가의 값을 가리킨다."
      en: "{{pick.2|code}} is a borrow — it points at a value living somewhere."
    - ko: "{{site.line}}행의 {{pick.1|code}}{{pick.1|josa:이,가}} 그 유효 기간에 이름을 붙여 다른 빌림·반환값과 묶는다."
      en: "{{pick.1|code}} on line {{site.line}} names that span and ties it to other borrows and the return value."
    - ko: "컴파일러가 부르는 자리마다 그 관계가 실제 생존과 맞는지 확인한다 — 안 맞으면 E0597."
      en: "At every call the compiler checks the relationship against real survival — mismatch is E0597."

rule:
  ko: "<b>수명 표시는 설명이지 연장이 아니다.</b> 같은 이름은 같은 기간, 반환은 받은 것보다 짧고, 'static 으로 지우지 않는다."
  en: "<b>A lifetime mark explains; it does not extend.</b> Same name, same span; a return lives no longer than its input; never erase an error with 'static."
result:
  label:
    ko: "{{site.line}}행의 빌림"
    en: "the borrow on line {{site.line}}"
  value: "{{pick.3}}{{pick.1}} {{pick.2}}"
  note:
    ko: "'{{pick.1}}' 기간만큼 유효"
    en: "valid for the span named {{pick.1}}"
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:은,는}} {{pick.1|code}} 기간 동안 유효한 빌림입니다. 같은 이름의 다른 빌림과 한 기간에 묶여 있어요."
  en: "{{pick.2|code}} is a borrow valid for the span {{pick.1|code}}. It is tied to the other borrows sharing that name."
payoff:
  ko: "이걸 알면 「`'a` 를 적었는데 왜 E0597 인가」가 풀립니다 — 설명이 실제 생존과 어긋난 것이지 표시가 모자란 게 아닙니다."
  en: "This untangles “I wrote `'a`, why E0597” — the explanation disagreed with real survival; no mark was missing."
bridge:
  ko: "GC 언어에는 이 표시가 없습니다 — 세는 쪽이 대신 알아요. C 에는 표시도 검사도 없어 매달린 포인터가 실행 시에 터집니다."
  en: "GC languages have no such mark — the counter knows instead. C has neither mark nor check, so a dangling pointer explodes at run time."
misconceptions:
  - ko: "`'a` 를 적으면 값이 더 오래 산다 — 생존을 <b>설명</b>할 뿐 늘리지 않습니다. 어긋나면 E0597 이에요."
    en: "Writing `'a` makes the value live longer — it <b>explains</b> survival, never extends it. A mismatch is E0597."
  - ko: "`'static` 을 붙이면 오류가 풀린다 — 「프로그램 내내 산다」는 거짓 설명이라 다른 자리에서 막힙니다."
    en: "Adding `'static` clears the error — it claims “lives for the whole program,” a false explanation that gets blocked elsewhere."
  - ko: "모든 빌림에 수명을 적어야 한다 — 함수 안과 단순 서명은 생략 규칙이 채웁니다. 적는 자리는 반환 빌림이 어느 인자에서 왔는지 애매할 때예요."
    en: "Every borrow needs a lifetime — elision fills in bodies and simple signatures. You write one when it is unclear which input a returned borrow comes from."

point:
  - q:
      ko: "{{site.line}}행에서 <b>빌림의 유효 기간에 붙인 이름</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the name given to the borrow's span</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 빌려지는 <b>타입</b>이거나 함수 이름입니다. 얼마나 오래인지는 따옴표 붙은 이름이 말해요."
          en: "{{pick.2|code}} is the <b>type</b> being borrowed, or the function's name. How long is said by the quoted name."
        edge:
          h: { ko: "가장 날카로운 자리 — 무엇이냐 얼마나냐", en: "The sharpest spot — what or how long" }
          code:
            - "&'a str"
            - "// ^얼마나 ^무엇"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>빌림 기호</b>이거나 여는 꺾쇠입니다. 기간의 이름은 그 뒤에 따옴표로 시작해요."
          en: "{{pick.3|code}} is the <b>borrow symbol</b> or the opening bracket. The span's name follows, starting with a quote."
        edge:
          h: { ko: "가장 날카로운 자리 — 기호냐 이름이냐", en: "The sharpest spot — the symbol or the name" }
          code:
            - "&'a str"
            - "//^기호"

meaning:
  - q:
      ko: "{{site.line}}행의 {{pick.1|code}}{{pick.1|josa:을,를}} <code>'static</code> 으로 바꾸면 어떻게 될까요?"
      en: "What happens if {{pick.1|code}} on line {{site.line}} is changed to <code>'static</code>?"
    hint:
      ko: "표시는 설명입니다. 설명이 참인지 컴파일러가 확인해요."
      en: "The mark is an explanation, and the compiler checks whether it is true."
    options:
      - t:
          ko: "「프로그램 내내 산다」는 설명이 되어, 그렇지 않은 값을 넘기는 자리마다 막힌다 (E0597 등)"
          en: "It now claims “lives for the whole program,” so every call passing a shorter-lived value is blocked (E0597 and kin)"
      - t:
          ko: "값이 프로그램 내내 살게 된다"
          en: "The value now lives for the whole program"
        diag:
          t:
            ko: "표시는 값을 <b>못 바꿉니다</b>. 실제 생존은 값이 어디에 만들어졌느냐가 정해요."
            en: "The mark <b>cannot change the value</b>. Real survival is decided by where the value was made."
          edge:
            h: { ko: "가장 날카로운 자리 — 설명이냐 연장이냐", en: "The sharpest spot — explanation or extension" }
            code:
              - "let s = String::new();"
              - "let r: &'static str = &s;   // E0597 — s 는 블록 끝까지"
      - t:
          ko: "아무 것도 안 바뀐다 — 이름만 다르다"
          en: "Nothing changes — only the name differs"
        diag:
          t:
            ko: "`'static` 은 이름이 아니라 <b>가장 긴 기간</b>을 뜻하는 예약어입니다. 설명이 달라져요."
            en: "`'static` is not a name but the reserved word for <b>the longest span</b>. The explanation changes."
          edge:
            h: { ko: "가장 날카로운 자리 — 이름이냐 예약어냐", en: "The sharpest spot — a name or a reserved word" }
            code:
              - "'a        // 부르는 쪽이 정하는 기간"
              - "'static   // 프로그램 전체"
      - t:
          ko: "실행 중에 오류가 난다"
          en: "It fails at run time"
        diag:
          t:
            ko: "실행까지 안 갑니다. 수명 검사는 <b>컴파일러</b>가 해요."
            en: "It never runs. Lifetimes are checked by the <b>compiler</b>."
          edge:
            h: { ko: "가장 날카로운 자리 — 언제 막히나", en: "The sharpest spot — when it is blocked" }
            code:
              - "컴파일: E0597"
              - "실행:   시작도 안 한다"

no_hole_reason: >-
  구멍을 못 뚫는다. `'a` 는 따옴표와 이름 두 토큰이라 보기 넷이 한 종류로 안 서고(`sameKind`),
  자리마다 이름이 달라 첫 보기를 고정할 수도 없다. 「이 표시를 지우면 무엇이 깨지나」는 3단
  `cut` 유형이 받는다(rs-learning §11.3 ③).

why_gate:
  q:
    ko: "{{site.line}}행은 왜 수명을 <b>직접 적었을까요</b>? (대개는 생략 규칙이 채웁니다)"
    en: "Why does line {{site.line}} <b>write the lifetime out</b>? (Elision usually fills it in.)"
  choices:
    - t:
        ko: "돌려주는 빌림이 어느 입력에서 왔는지 규칙만으로는 정해지지 않아서 — 그 관계를 사람이 적어야 한다"
        en: "Because the rules alone cannot tell which input the returned borrow comes from — the relationship must be written"
      ok: true
      fb:
        ko: "그 방향입니다. 이 표시를 지우면 컴파일러가 무슨 말을 할지도 적어 보세요."
        en: "That is the direction. Say what the compiler would report if this mark were removed."
    - t:
        ko: "적으면 값이 더 오래 살아서"
        en: "Because writing it makes the value live longer"
      ok: false
      fb:
        ko: "그것이 이 판이 고치려는 오개념입니다. 표시는 설명이에요."
        en: "That is the misconception this plate targets. The mark explains."
    - t:
        ko: "Rust 가 모든 빌림에 요구해서"
        en: "Because Rust demands it on every borrow"
      ok: false
      fb:
        ko: "요구하지 않습니다. 이 리포 빌림 9,474곳 중 명시는 615곳뿐이에요."
        en: "It does not. Of 9,474 borrows in this repo, only 615 are explicit."

queries:
  - { grammars: [rust], file: ./lifetime-annotation.scm }

examples:
  - code: "fn longest<'a>(a: &'a str, b: &'a str) -> &'a str { a }   // 돌려주는 것은 받은 것보다 오래 못 산다"
    expect: { sites: 4, form: fn-lifetime, picks: { 1: "'a", 2: "longest", 3: "<" } }
  - code: "struct Holder<'a> { name: &'a str }             // 빌림을 든 타입은 그 기간을 적는다"
    expect: { sites: 2, form: struct-lifetime, picks: { 1: "'a", 2: "Holder", 3: "<" } }
  - code: "fn first(a: &str) -> &str { a }                 // 생략 규칙이 채운다"
    expect: none
