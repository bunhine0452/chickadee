schema: 1
id: rs/let-binding
# 0부 축 G (`docs/curriculum/rs.md` §0.1 #1). 보편형은 `common/variable-binding` — 「이름에 값을
# 묶는다」는 어느 언어에나 있고, Rust 에서 다시 배울 것은 **기본이 못 바뀐다**는 것과 섀도잉이다.
universal: common/variable-binding
name: { ko: 이름에 값 묶기, en: Binding a name }
token: "let"
grammars: [rust]
framework: null
essential: true
difficulty: 1
prereq: [cs/immutability, cs/state]
confusions: []

dict:
  one_liner:
    ko: "이름 하나를 값에 묶는다. 한 번 묶으면 기본으로 다시 못 넣는다."
    en: "Ties one name to a value. Once tied, it cannot be re-assigned by default."
  why:
    ko: >-
      다른 언어에서 이름은 「담는 상자」이고 언제든 다시 담을 수 있습니다. Rust 의 {{site.line}}행은
      {{pick.2|code}}{{pick.2|josa:을,를}} {{pick.3|code}}{{pick.3|josa:에,에}} <b>묶고 그것으로 끝</b>입니다 —
      아래에서 {{pick.2|code}} 에 다시 넣으면 컴파일러가 멈춥니다(E0384). 바꿀 생각이면 그 사실을
      선언 쪽에 적어야 하고, 그것이 다음 판입니다. 같은 이름을 <b>다시 묶을</b> 수는 있습니다 —
      그건 값을 바꾼 것이 아니라 이름이 하나 더 생긴 것이고, 앞의 것은 그대로 살아 있습니다.
    en: >-
      Elsewhere a name is a box you can refill at will. Line {{site.line}} ties {{pick.2|code}} to
      {{pick.3|code}} <b>and that is the end of it</b> — assign to {{pick.2|code}} again below and
      the compiler stops (E0384). To change it you say so at the declaration, which is the next
      plate. You may <b>tie the same name again</b>; that does not change the value, it makes a
      second name, and the first one is still alive.
  trace:
    - ko: "{{pick.3|code}}{{pick.3|josa:을,를}} 먼저 값으로 만든다."
      en: "{{pick.3|code}} becomes a value first."
    - ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 그 값에 묶인다."
      en: "{{pick.2|code}} is tied to it."
    - ko: "{{site.line}}행 아래로 {{pick.2|code}}{{pick.2|josa:은,는}} 그 값이고, 다시 넣으면 E0384 다."
      en: "Below line {{site.line}}, {{pick.2|code}} is that value; assigning again is E0384."

rule:
  ko: "<b>묶기는 한 번이다.</b> 다시 넣으려면 선언에 적고, 다시 묶으면 이름이 하나 더 생긴다."
  en: "<b>Tying happens once.</b> To re-assign, say so at the declaration; tying again makes a new name."
result:
  label:
    ko: "{{site.line}}행 아래의 {{pick.2}}"
    en: "{{pick.2}} below line {{site.line}}"
  value: "{{pick.3}}"
  note:
    ko: "다시 넣을 수 없다"
    en: "cannot be re-assigned"
ok:
  ko: >-
    {{pick.2|code}}{{pick.2|josa:이,가}} 이제 {{pick.3|code}}{{pick.3|josa:을,를}} 가리키고, 이 이름으로는
    그 값만 봅니다.
  en: >-
    {{pick.2|code}} now names {{pick.3|code}}, and through this name you see only that value.
payoff:
  ko: >-
    이걸 알면 「왜 다시 넣었더니 컴파일이 안 되나」(E0384)가 풀립니다 — 이 줄이 바꿀 수 없다고 정한
    겁니다.
  en: >-
    This untangles “why does assigning again refuse to compile” (E0384) — this line made it fixed.
bridge:
  ko: >-
    파이썬·JS 는 다시 넣어도 아무 말이 없습니다. Rust 는 바꿀 수 있음을 <b>따로 적게</b> 해서,
    읽는 사람이 어느 이름이 움직이는지 선언만 보고 압니다.
  en: >-
    Python and JS say nothing on re-assignment. Rust makes you <b>write down</b> that a name may
    move, so a reader knows from the declaration alone which names change.
misconceptions:
  - ko: "같은 이름을 다시 묶으면 값이 바뀐 것이다 — 이름이 <b>하나 더</b> 생긴 겁니다. 앞의 것은 그대로고 타입이 달라도 됩니다."
    en: "Tying the same name again changes the value — it makes <b>one more</b> name. The first stays, and the type may differ."
  - ko: "선언한 적 없는 이름에 넣으면 그 줄이 만든다 — Rust 는 멈춥니다(E0425). 만드는 낱말이 따로 있어요."
    en: "Assigning to an undeclared name makes it — Rust stops (E0425). There is a separate word for making."
  - ko: "값을 안 넣고 이름만 만들면 0 이다 — 읽기 전에 반드시 넣어야 하고, 안 넣고 읽으면 E0381 로 멈춥니다."
    en: "A name made without a value is 0 — it must be given a value before it is read, or E0381 stops you."

point:
  - q:
      ko: "{{site.line}}행에서 <b>이름을 만들어 값에 묶는 낱말</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the word that makes the name and ties it</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>이름</b>입니다. 이름은 스스로 생기지 못하고, 만드는 일은 앞의 낱말이 합니다."
          en: "{{pick.2|code}} is <b>the name</b>. A name cannot bring itself into being; the word in front does that."
        edge:
          h:
            ko: "가장 날카로운 자리 — 이름만으로는 아무 일도 안 난다"
            en: "The sharpest spot — a name alone does nothing"
          code:
            - "count = 0;       // E0425: 없는 이름"
            - "let count = 0;   // 이 줄이 이름을 만든다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 묶일 <b>값</b>입니다. 값은 어느 이름에 갈지 모르고, 그것을 정하는 것이 앞의 낱말이에요."
          en: "{{pick.3|code}} is <b>the value</b> to be tied. A value does not know its name; the word in front decides."
        edge:
          h:
            ko: "가장 날카로운 자리 — 값이냐 묶는 일이냐"
            en: "The sharpest spot — the value or the tying"
          code:
            - "0;               // 계산되고 사라진다"
            - "let count = 0;   // 이름이 남는다"

meaning:
  - q:
      ko: "{{site.line}}행 아래에서 <code>{{pick.2}} = 1;</code> 을 적으면 어떻게 될까요?"
      en: "What happens when <code>{{pick.2}} = 1;</code> is written below line {{site.line}}?"
    hint:
      ko: "이 줄에 「바꿀 수 있다」는 표시가 있는지 보세요."
      en: "Check whether this line carries a “may change” mark."
    options:
      - t:
          ko: "컴파일이 멈춘다 — 이 이름은 다시 넣을 수 없다고 선언됐다 (E0384)"
          en: "Compiling stops — this name was declared as not re-assignable (E0384)"
      - t:
          ko: "값이 1 로 바뀐다"
          en: "The value becomes 1"
        diag:
          t:
            ko: "다른 언어라면 그렇습니다. Rust 는 선언에 <b>바꿀 수 있다는 표시</b>가 없으면 다시 넣는 줄에서 멈춰요."
            en: "Elsewhere, yes. In Rust, without a <b>may-change mark</b> on the declaration, the re-assigning line stops the build."
          edge:
            h: { ko: "가장 날카로운 자리 — 표시가 있나", en: "The sharpest spot — is the mark there" }
            code:
              - "let n = 0; n = 1;       // E0384"
              - "let mut n = 0; n = 1;   // 된다"
      - t:
          ko: "새 이름이 하나 더 생긴다"
          en: "A second name is made"
        diag:
          t:
            ko: "새 이름은 <b>만드는 낱말</b>이 있을 때만 생깁니다. 낱말 없이 넣는 줄은 있는 이름에 다시 넣으려는 줄이에요."
            en: "A new name appears only with <b>the making word</b>. A bare assignment tries to refill an existing name."
          edge:
            h: { ko: "가장 날카로운 자리 — 낱말이 있나", en: "The sharpest spot — is the word there" }
            code:
              - "let n = 1;   // 이름이 하나 더"
              - "n = 1;       // 다시 넣기"
      - t:
          ko: "실행 중에 오류가 난다"
          en: "It fails at run time"
        diag:
          t:
            ko: "실행까지 가지 않습니다. 이 규칙은 <b>컴파일러</b>가 지키고, 프로그램은 만들어지지도 않아요."
            en: "It never reaches run time. The <b>compiler</b> enforces this rule; the program is not even built."
          edge:
            h: { ko: "가장 날카로운 자리 — 언제 막히나", en: "The sharpest spot — when it is blocked" }
            code:
              - "컴파일: E0384 로 멈춤"
              - "실행:   시작도 안 한다"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 이름 하나를 값에 <b>묶습니다</b>."
      en: "Choose what goes in the blank. Line {{site.line}} <b>ties</b> one name to a value."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "let", mono: true }
      - t: "var"
        mono: true
        diag:
          t:
            ko: "Rust 에는 이 낱말이 <b>없습니다</b>. 바꿀 수 있는 이름도 같은 낱말로 만들고 뒤에 표시를 하나 붙여요."
            en: "Rust <b>has no</b> such word. A changeable name uses the same word plus one mark after it."
          edge:
            h: { ko: "가장 날카로운 자리 — 낱말은 하나", en: "The sharpest spot — one word" }
            code:
              - "let n = 0;       // 못 바꾼다"
              - "let mut n = 0;   // 바꿀 수 있다"
      - t: "const"
        mono: true
        diag:
          t:
            ko: "이건 <b>컴파일 시에 정해지는 상수</b>라 타입을 반드시 적고 계산된 값은 못 넣습니다. 함수 안에서 값을 묶는 자리가 아니에요."
            en: "That is a <b>compile-time constant</b>: the type is required and a computed value cannot go in. It is not the slot for tying a value inside a function."
          edge:
            h: { ko: "가장 날카로운 자리 — 언제 정해지나", en: "The sharpest spot — when it is fixed" }
            code:
              - "const MAX: u32 = 10;   // 컴파일 시"
              - "let n = f();           // 실행 시"
      - t: "static"
        mono: true
        diag:
          t:
            ko: "이건 <b>프로그램 전체가 쓰는 한 자리</b>를 만듭니다. 함수 안의 이름과는 사는 시간이 달라요."
            en: "That makes <b>one place the whole program shares</b>. Its lifetime is nothing like a name inside a function."
          edge:
            h: { ko: "가장 날카로운 자리 — 얼마나 사나", en: "The sharpest spot — how long it lives" }
            code:
              - "static COUNT: u32 = 0;   // 끝까지"
              - "let n = 0;               // 블록 끝까지"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 다시 넣을 수 있다고 <b>안 적었을까요</b>?"
    en: "Why does line {{site.line}} <b>not</b> say the name may be re-assigned?"
  choices:
    - t:
        ko: "이 값이 아래에서 안 바뀌기 때문에 — 읽는 사람이 선언만 보고 그 사실을 알게 하려고"
        en: "Because the value does not change below — so a reader knows that from the declaration alone"
      ok: true
      fb:
        ko: "그 방향입니다. 바뀌는 이름이 몇 개인지 이 함수에서 세어 보세요."
        en: "That is the direction. Count how many names in this function do change."
    - t:
        ko: "Rust 가 바꿀 수 있는 이름을 못 만들어서"
        en: "Because Rust cannot make a changeable name"
      ok: false
      fb:
        ko: "만들 수 있습니다. 표시 하나를 더 붙이면 돼요 — 안 붙인 것은 선택입니다."
        en: "It can. One extra mark does it — leaving it off is a choice."
    - t:
        ko: "표시를 붙이면 느려져서"
        en: "Because the mark makes it slower"
      ok: false
      fb:
        ko: "속도는 같습니다. 달라지는 것은 컴파일러가 무엇을 막아 주느냐예요."
        en: "The speed is the same. What differs is what the compiler guards."

queries:
  - { grammars: [rust], file: ./let-binding.scm }

examples:
  - code: "fn f() { let n = 7 / 2; }                  // n -> 3 (i32)"
    expect: { sites: 1, form: let, hole: "let", picks: { 1: "let", 2: "n", 3: "7 / 2" } }
  - code: "fn f() { let x = 1; let x = x + 1; }       // 둘째 x -> 2 · 첫 x 는 그대로 산다"
    expect: { sites: 2, form: let, picks: { 1: "let", 2: "x", 3: "1" } }
  - code: "fn f() { let mut count = 0; }              // rs/mut-binding 의 자리"
    expect: none
  - code: "fn f() { let (a, b) = pair; }              // 묶음 패턴은 이 개념이 아니다"
    expect: none
