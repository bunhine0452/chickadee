schema: 1
id: rs/cast-as
# 0부 축 F (`rs.md` §0.1 #11). 보편형은 없다 — README §8 이 축 6 에 `common/type-cast` 를 신규 후보로
# 적었고 아직 없다(§9 「아직 비어 있는 것 하나」). 기계는 `cs/type-conversion` 이 댄다.
# Rust 에서 다시 배울 것은 **자동으로 도는 화살표가 하나도 없고** 사람이 셋 중 하나를 고른다는 것.
universal: null
name: { ko: 변환은 셋 중 하나다, en: Conversion is one of three }
token: "as"
grammars: [rust]
framework: null
essential: true
difficulty: 2
prereq: [rs/integer-type, cs/type-conversion, cs/integer-overflow]
confusions: []

dict:
  one_liner:
    ko: "타입을 바꾸는 길은 셋이고 자동은 없다. 잘라도 조용한 것, 안 잃는 것, 실패를 값으로 주는 것."
    en: "Three roads change a type, none automatic: cut, keep, or hand back failure."
  why:
    ko: >-
      C 는 `int` 를 `char` 에 넣으면 조용히 자르고, 자바는 넓히기를 조용히 해 줍니다. Rust 는 <b>둘 다
      안 합니다</b> — 타입이 다르면 사람이 적어야 하고, 적는 법이 셋입니다. {{site.line}}행의
      {{pick.1|code}}{{pick.1|josa:은,는}} 그중 첫째, <b>잃어도 조용한</b> 변환이에요. `300u32 as u8` 은 44 가
      되고 아무 말이 없습니다. 둘째 `From`/`Into` 는 <b>안 잃는 것만</b> 됩니다 — `u8` 에서 `u32` 로는
      되고 반대는 컴파일이 안 돼요. 셋째 `TryFrom`/`try_into` 는 <b>실패를 `Result` 로</b> 줍니다. 이
      리포에서 첫째가 둘째·셋째보다 47배 많이 쓰였습니다(`as` 563곳 대 `try_into` 12곳).
    en: >-
      C cuts quietly when an `int` goes into a `char`; Java widens quietly. Rust does <b>neither</b> — when
      types differ you write it, and there are three ways. {{pick.1|code}} on line {{site.line}} is the
      first: a conversion that is <b>quiet even when it loses</b>. `300u32 as u8` becomes 44 without a
      word. The second, `From`/`Into`, works <b>only where nothing is lost</b> — `u8` to `u32` yes, the
      reverse does not compile. The third, `TryFrom`/`try_into`, hands <b>the failure back as a `Result`</b>.
      In this repo the first was used 47 times more than the other two (`as` 563 sites vs `try_into` 12).
  trace:
    - ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 원래 타입의 값이다."
      en: "{{pick.2|code}} is a value of the original type."
    - ko: "{{site.line}}행의 {{pick.1|code}}{{pick.1|josa:이,가}} 그것을 {{pick.3|code}}{{pick.3|josa:으로,로}} 바꾼다 — 안 들어가는 부분은 버린다."
      en: "{{pick.1|code}} on line {{site.line}} turns it into {{pick.3|code}} — what does not fit is dropped."
    - ko: "버렸는지는 아무도 말하지 않는다. 그것이 첫째 길의 값이자 위험이다."
      en: "Nobody says whether anything was dropped. That is the first road's price and its convenience."

rule:
  ko: "<b>자동 변환은 없다.</b> as 는 잘라도 조용하고, From 은 안 잃는 것만, TryFrom 은 실패를 값으로 준다."
  en: "<b>Nothing converts on its own.</b> as is quiet even when it cuts, From only where nothing is lost, TryFrom returns the failure."
result:
  label:
    ko: "{{site.line}}행의 변환"
    en: "the conversion on line {{site.line}}"
  value: "{{pick.2}} {{pick.1}} {{pick.3}}"
  note:
    ko: "안 들어가면 잘린다"
    en: "what does not fit is cut"
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:이,가}} {{pick.3|code}}{{pick.3|josa:이,가}} 됐습니다. 칸이 모자랐다면 앞자리가 조용히 사라졌어요."
  en: "{{pick.2|code}} became {{pick.3|code}}. If the slots were too few, the leading bits vanished quietly."
payoff:
  ko: "이걸 알면 「300 을 넣었는데 44 가 나온다」가 풀립니다 — 오류가 아니라 첫째 길이 한 일입니다."
  en: "This untangles “I put in 300 and got 44” — not a bug, but what the first road does."
bridge:
  ko: "C 는 이 변환이 <b>자동으로</b> 돕니다. Rust 는 같은 일을 하되 낱말 하나를 적게 해서, 잘리는 자리가 코드에 남습니다."
  en: "In C this conversion runs <b>on its own</b>. Rust does the same but makes you write one word, so the cutting spot stays visible."
misconceptions:
  - ko: "`as` 는 타입을 맞춰 주는 안전한 낱말이다 — <b>말없이 자릅니다</b>. `300u32 as u8` 은 44 예요."
    en: "`as` is a safe word that makes types match — it <b>cuts quietly</b>. `300u32 as u8` is 44."
  - ko: "정수는 넓은 타입으로 자동으로 넓혀진다 — 안 됩니다(E0308). `u32::from(x)` 나 `x.into()` 를 적어야 해요."
    en: "Integers widen automatically — they do not (E0308). Write `u32::from(x)` or `x.into()`."
  - ko: "`try_into()` 는 느린 `as` 다 — 실패를 <b>값으로</b> 줍니다. 300 을 `u8` 로 보내면 `Err` 이 나와요."
    en: "`try_into()` is a slow `as` — it hands the failure back <b>as a value</b>. 300 into `u8` gives `Err`."

point:
  - q:
      ko: "{{site.line}}행에서 <b>타입을 바꾸는 낱말</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the word that changes the type</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 바뀌는 <b>값</b>입니다. 값은 스스로 타입을 못 바꾸고, 바꾸는 일은 그 뒤의 낱말이 해요."
          en: "{{pick.2|code}} is the <b>value</b> being changed. A value cannot change its own type; the word after it does."
        edge:
          h: { ko: "가장 날카로운 자리 — 값이냐 변환이냐", en: "The sharpest spot — the value or the conversion" }
          code:
            - "300u32          // u32 그대로"
            - "300u32 as u8    // 44 (u8)"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} <b>목표 타입</b>입니다. 어디로 갈지를 적었을 뿐, 가게 하는 것은 앞의 낱말이에요."
          en: "{{pick.3|code}} is the <b>target type</b>. It names the destination; the word before it does the moving."
        edge:
          h: { ko: "가장 날카로운 자리 — 목적지냐 길이냐", en: "The sharpest spot — the destination or the road" }
          code:
            - "x as u8          // 잘라서 간다"
            - "u8::try_from(x)  // 실패면 Err"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 <b>잃어도 조용한</b> 변환입니다."
      en: "Choose what goes in the blank. Line {{site.line}} converts <b>quietly even when it loses</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "as", mono: true }
      - t: "into"
        mono: true
        diag:
          t:
            ko: "이건 <b>안 잃는 변환</b>만 됩니다. 좁은 타입으로는 컴파일이 멈춰요(E0277) — 조용히 자르는 길이 아닙니다."
            en: "That works <b>only where nothing is lost</b>. Toward a narrower type it stops the build (E0277) — not the quiet-cutting road."
          edge:
            h: { ko: "가장 날카로운 자리 — 잃느냐 안 잃느냐", en: "The sharpest spot — loss or no loss" }
            code:
              - "let w: u32 = n.into();   // u8 → u32 된다"
              - "let n: u8 = w.into();    // E0277"
      - t: "try_into"
        mono: true
        diag:
          t:
            ko: "이건 <b>실패를 값으로</b> 줍니다. 결과가 `Result` 라 그대로 이름에 못 넣고 갈라야 해요."
            en: "That <b>returns the failure as a value</b>. The result is a `Result`, so it cannot go straight into a name."
          edge:
            h: { ko: "가장 날카로운 자리 — 값이냐 Result 냐", en: "The sharpest spot — a value or a Result" }
            code:
              - "let n = w as u8;              // 44"
              - "let n = w.try_into();         // Err(…)"
      - t: "from"
        mono: true
        diag:
          t:
            ko: "이건 `u8::from(x)` 처럼 <b>타입 쪽에서</b> 부르는 안 잃는 변환입니다. 값 뒤에 낱말로 붙는 자리가 아니에요."
            en: "That is the no-loss conversion called <b>from the type side</b>, `u8::from(x)`. It is not a word placed after a value."
          edge:
            h: { ko: "가장 날카로운 자리 — 어느 쪽에서 부르나", en: "The sharpest spot — which side calls" }
            code:
              - "x as u8          // 값 뒤"
              - "u32::from(x)     // 타입 앞"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 <b>안 잃는 길</b>이 아니라 이 낱말을 썼을까요?"
    en: "Why does line {{site.line}} use this word instead of <b>the no-loss road</b>?"
  choices:
    - t:
        ko: "값이 좁은 타입에 들어간다고 사람이 이미 알거나, 잘려도 된다고 정했기 때문에 — 그 판단이 코드에 안 적힌 것이 대가다"
        en: "Because the writer already knows the value fits, or decided cutting is fine — the price is that the judgement is not written down"
      ok: true
      fb:
        ko: "그 방향입니다. 이 자리의 값이 실제로 목표 타입에 드는지도 확인해 보세요."
        en: "That is the direction. Check whether the value here actually fits the target type."
    - t:
        ko: "안 잃는 길은 정수에 안 되어서"
        en: "Because the no-loss road does not work on integers"
      ok: false
      fb:
        ko: "됩니다 — 넓히는 방향이면요. 좁히는 방향이라 안 됐다면 그것이 바로 이 낱말을 고른 이유예요."
        en: "It does, in the widening direction. If it refused, that narrowing is exactly why this word was chosen."
    - t:
        ko: "이 낱말이 더 빨라서"
        en: "Because this word is faster"
      ok: false
      fb:
        ko: "넓히기는 속도가 같습니다. 다른 것은 잘렸을 때 누가 아느냐예요."
        en: "Widening costs the same. What differs is who knows when something was cut."

queries:
  - { grammars: [rust], file: ./cast-as.scm }

examples:
  - code: "fn f() { let small = 300u32 as u8; }          // small -> 44 (u8) — 조용히 잘렸다"
    expect: { sites: 1, form: as, hole: "as", picks: { 1: "as", 2: "300u32", 3: "u8" } }
  - code: "fn f() { let n = u8::try_from(x); }           // n -> Ok(값) 또는 Err"
    expect: { sites: 1, form: from, picks: { 1: "try_from", 2: "u8", 3: "(x)" } }
  - code: "fn f() { let wide: u64 = m.into(); }          // 안 잃는 방향만 된다"
    expect: { sites: 1, form: into, picks: { 1: "into", 2: "m", 3: "()" } }
  - code: "fn f() { let n = x + 1; }                     // 변환이 없다 — 같은 타입"
    expect: none
