schema: 1
id: rs/impl-trait-for
# 2부 끝 (`rs.md` §4). 보편형은 없다. `#[derive(Debug, Clone)]` 한 줄이 구현을 **생성한다** —
# 표본 리포에서 `derive` 615 대 손으로 쓴 `impl … for` 48 (rust-axis §2.1). 트리에서 `derive` 는
# `attribute_item` 이지 `impl_item` 이 아니다(rs.md §8 ②).
universal: null
name: { ko: 트레이트를 붙이기, en: Attaching a trait }
token: "derive"
grammars: [rust]
framework: null
essential: true
difficulty: 4
prereq: [rs/trait-item]
confusions: []

dict:
  one_liner:
    ko: "약속을 타입에 채우는 두 길 — 손으로 쓰거나 생성 표시 한 줄로 만든다. 열에 아홉이 후자다."
    en: "Two ways to fill a promise for a type: by hand, or generated by one attribute."
  why:
    ko: >-
      {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:은,는}} 약속을 타입에 <b>붙입니다</b>. 두 길이 있어요. `impl Shape for
      Circle { … }` 은 서명을 손으로 채우는 길이고, `#[derive(Debug, Clone)]` 은 <b>컴파일러가 구현을
      생성하는</b> 길입니다 — 필드마다 같은 일을 되풀이하는 흔한 약속(`Debug`·`Clone`·`PartialEq`)은
      후자로 충분해요. 표본 리포에서 615 대 48 로 후자가 아홉 할입니다. 트리에서는 둘이 다른 노드라
      「이 타입이 `Clone` 을 구현한다」를 `impl` 로만 세면 9할을 놓칩니다. 그리고 남의 타입에 남의
      약속은 못 붙여요(고아 규칙, E0117) — 내 것이 하나는 있어야 합니다.
    en: >-
      {{pick.1|code}} on line {{site.line}} <b>attaches</b> a promise to a type. There are two ways.
      `impl Shape for Circle { … }` fills the signatures by hand; `#[derive(Debug, Clone)]` lets
      <b>the compiler generate the implementation</b> — for common promises that repeat the same work
      per field (`Debug`, `Clone`, `PartialEq`) the latter is enough. The sample repos use it 615 times
      against 48 by hand, nine in ten. In the tree the two are different nodes, so counting only `impl`
      to find “this type implements `Clone`” misses 90%. And you cannot attach a foreign promise to a
      foreign type (the orphan rule, E0117) — one of the two must be yours.
  trace:
    - ko: "{{site.line}}행의 {{pick.1|code}}{{pick.1|josa:이,가}} {{pick.2|code}} 에 약속을 붙인다."
      en: "{{pick.1|code}} on line {{site.line}} attaches a promise to {{pick.2|code}}."
    - ko: "손으로 썼으면 몸통이 서명을 채우고, derive 면 컴파일러가 필드를 보고 만든다."
      en: "By hand, the body fills the signatures; with derive, the compiler builds it from the fields."
    - ko: "그 뒤로 이 타입은 그 약속을 받는 자리 어디에나 설 수 있다."
      en: "From then on the type may stand anywhere that promise is accepted."

rule:
  ko: "<b>붙이는 길은 둘.</b> 손으로 impl … for, 흔한 것은 derive 로 생성. 둘 중 하나는 내 것이어야 한다."
  en: "<b>Two ways to attach.</b> impl … for by hand, derive for the common ones. One of the two sides must be yours."
result:
  label:
    ko: "{{site.line}}행의 붙임"
    en: "the attachment on line {{site.line}}"
  value: "{{pick.1}}{{pick.2}}"
  note:
    ko: "이 타입이 그 약속을 갖는다"
    en: "this type now holds that promise"
ok:
  ko: "{{pick.2|code}} 에 약속이 붙었습니다. 손으로 썼든 생성됐든 그 약속을 받는 자리에 설 수 있어요."
  en: "A promise is attached to {{pick.2|code}}. Hand-written or generated, it may now stand where that promise is accepted."
payoff:
  ko: "이걸 알면 「`{:?}` 로 찍으려면 왜 `#[derive(Debug)]` 가 필요한가」(E0277)가 풀립니다 — 약속이 안 붙어 있던 겁니다."
  en: "This untangles “why does printing with `{:?}` need `#[derive(Debug)]`” (E0277) — the promise was not attached."
bridge:
  ko: "자바는 클래스가 `implements` 로 인터페이스를 고릅니다. Rust 는 <b>바깥에서</b> 붙이고, 흔한 것은 한 줄로 생성합니다."
  en: "In Java a class picks its interfaces with `implements`. Rust attaches <b>from outside</b>, and generates the common ones in one line."
misconceptions:
  - ko: "`derive` 는 마법이다 — 필드마다 같은 구현을 <b>생성</b>할 뿐입니다. 손으로 쓴 것과 같은 코드가 나와요."
    en: "`derive` is magic — it merely <b>generates</b> the per-field implementation. The same code as hand-written comes out."
  - ko: "타입 안에서 `implements` 처럼 적는다 — 타입 <b>밖</b>에서 붙입니다. 남의 타입에도 내 약속은 붙어요."
    en: "It is written inside the type like `implements` — it is attached <b>outside</b>. Even a foreign type takes my promise."
  - ko: "아무 타입에 아무 약속이든 붙는다 — 둘 다 남의 것이면 E0117 입니다(고아 규칙)."
    en: "Any promise attaches to any type — when both are foreign it is E0117 (the orphan rule)."

point:
  - q:
      ko: "{{site.line}}행에서 <b>약속을 붙이는 낱말</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the word that attaches the promise</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 붙는 <b>대상</b>입니다 — 타입이거나 붙일 약속 목록이에요. 붙이는 낱말은 그 앞입니다."
          en: "{{pick.2|code}} is the <b>target</b> — the type, or the list of promises to attach. The attaching word comes before."
        edge:
          h: { ko: "가장 날카로운 자리 — 낱말이냐 대상이냐", en: "The sharpest spot — the word or the target" }
          code:
            - "#[derive(Debug, Clone)]"
            - "//  ^낱말  ^목록"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 표시를 여는 <b>기호</b>이거나 impl 낱말입니다. 무엇을 붙이는지는 그 안의 이름이 말해요."
          en: "{{pick.3|code}} is the <b>symbol</b> opening the attribute, or the impl word. What gets attached is said by the name inside."
        edge:
          h: { ko: "가장 날카로운 자리 — 기호냐 이름이냐", en: "The sharpest spot — the symbol or the name" }
          code:
            - "#[derive(Debug)]"
            - "//^기호 ^이름"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 약속의 구현을 <b>생성</b>합니다."
      en: "Choose what goes in the blank. Line {{site.line}} <b>generates</b> a promise's implementation."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "derive", mono: true }
      - t: "cfg"
        mono: true
        diag:
          t:
            ko: "이건 <b>조건부 컴파일</b> 표시입니다. 어느 플랫폼·프로필에서 이 항목을 넣을지 정해요."
            en: "That is <b>conditional compilation</b>. It decides on which platform or profile the item is included."
          edge:
            h: { ko: "가장 날카로운 자리 — 생성이냐 조건이냐", en: "The sharpest spot — generating or gating" }
            code:
              - "#[derive(Debug)]       // 구현을 만든다"
              - "#[cfg(test)]           // 시험에서만"
      - t: "allow"
        mono: true
        diag:
          t:
            ko: "이건 <b>린트를 끄는</b> 표시입니다. 구현을 만들지 않아요."
            en: "That <b>silences a lint</b>. It generates nothing."
          edge:
            h: { ko: "가장 날카로운 자리 — 만들기냐 끄기냐", en: "The sharpest spot — making or silencing" }
            code:
              - "#[derive(Clone)]"
              - "#[allow(dead_code)]"
      - t: "test"
        mono: true
        diag:
          t:
            ko: "이건 함수를 <b>시험</b>으로 표시합니다. 타입에는 안 붙어요."
            en: "That marks a function as a <b>test</b>. It does not go on a type."
          edge:
            h: { ko: "가장 날카로운 자리 — 타입이냐 함수냐", en: "The sharpest spot — a type or a function" }
            code:
              - "#[derive(Debug)] struct P;"
              - "#[test] fn it_works() { }"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 손으로 쓰지 않고 <b>생성</b>했을까요?"
    en: "Why does line {{site.line}} <b>generate</b> instead of writing by hand?"
  choices:
    - t:
        ko: "필드마다 같은 일을 하는 약속이라 손으로 쓰면 필드가 늘 때마다 고쳐야 해서 — 생성은 필드를 따라간다"
        en: "Because the promise repeats the same work per field, and a hand-written one must change whenever a field is added — generation follows the fields"
      ok: true
      fb:
        ko: "그 방향입니다. 이 타입에 붙은 약속 중 손으로 써야만 하는 것이 있는지도 보세요."
        en: "That is the direction. Check whether any promise on this type had to be written by hand."
    - t:
        ko: "손으로는 못 써서"
        en: "Because it cannot be written by hand"
      ok: false
      fb:
        ko: "쓸 수 있습니다. 생성되는 것과 같은 코드를 적으면 돼요."
        en: "It can. You would write the same code that gets generated."
    - t:
        ko: "생성된 것이 더 빨라서"
        en: "Because the generated one is faster"
      ok: false
      fb:
        ko: "같은 코드라 속도도 같습니다."
        en: "Same code, same speed."

queries:
  - { grammars: [rust], file: ./impl-trait-for.scm }

examples:
  - code: "#[derive(Debug, Clone)] struct P;              // 구현 둘을 생성한다"
    expect: { sites: 1, form: derive, hole: "derive", picks: { 1: "derive", 2: "(Debug, Clone)", 3: "#" } }
  - code: "impl Display for Point { }                      // 손으로 채우는 길"
    expect: { sites: 1, form: impl-for, picks: { 1: "Display", 2: "Point", 3: "impl", 4: "for" } }
  - code: "impl Point { }                                  // 약속 없음 — rs/impl-method"
    expect: none
