schema: 1
id: rs/async-await
# 2부 끝 (`docs/plan/rust-axis.md` §2.3 ① — `rs.md` §6 이 「tokio 리포를 만나면」으로 유보했던 것을
# 실측이 열었다: ai-pm `await` 2,571 · `async fn` 1,109, `?` 다음으로 흔하다). 보편형은
# `common/async-await`. Rust 에서 다시 배울 것은 `.await` 가 없으면 `async fn` 이 **아무것도 안 한다**는
# 것 — 미래(Future)를 만들어 돌려줄 뿐이고 실행기가 굴린다. 기계는 `cs/blocking-and-async`.
universal: common/async-await
name: { ko: 기다리되 멈추지 않기, en: Waiting without blocking }
token: ".await"
grammars: [rust]
framework: null
essential: true
difficulty: 3
prereq: [rs/function-item, rs/result, cs/blocking-and-async]
confusions: []

dict:
  one_liner:
    ko: "비동기 함수는 부르면 미래를 돌려줄 뿐 돌지 않는다. 기다리는 표시가 붙은 자리에서 실행기가 굴린다."
    en: "Calling it only hands back a future; the runtime drives it at the waiting mark."
  why:
    ko: >-
      {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:은,는}} {{pick.2|code}}{{pick.2|josa:이,가}} 끝날 때까지 <b>기다리되 스레드를 안
      막습니다</b> — 기다리는 동안 실행기(tokio)가 다른 일을 돌려요. JS 와 다른 것 하나가 이 언어의
      함정입니다: `async fn` 을 <b>부르기만 하면 아무 일도 안 납니다</b>. 미래(Future)라는 값을 돌려줄
      뿐이고, `.await` 나 `spawn` 이 붙어야 처음으로 한 걸음 돕니다. 그래서 `.await` 를 빼먹은 줄은 경고를
      받고(`unused must_use`), `.await` 는 `async` 안에서만 쓸 수 있어요(E0728). 이 리포에서 `?` 다음으로
      흔한 것이 이 표시(2,571곳)이고, `?` 와 함께 `x.await?` 로 붙는 일이 많습니다.
    en: >-
      {{pick.1|code}} on line {{site.line}} <b>waits for {{pick.2|code}} without blocking the thread</b> — while
      it waits, the runtime (tokio) drives other work. One difference from JS is the trap of this
      language: <b>calling an `async fn` does nothing</b>. It hands back a value called a future, and only
      `.await` or `spawn` makes it take its first step. So a line missing `.await` draws a warning
      (`unused must_use`), and `.await` is allowed only inside `async` (E0728). In this repo this mark is
      the most common thing after `?` (2,571 sites), and the two often pair up as `x.await?`.
  trace:
    - ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 미래를 돌려준다 — 아직 아무것도 안 돌았다."
      en: "{{pick.2|code}} hands back a future — nothing has run yet."
    - ko: "{{site.line}}행의 {{pick.1|code}} 에서 실행기가 그 미래를 굴리기 시작하고, 이 함수는 여기서 양보한다."
      en: "At {{pick.1|code}} on line {{site.line}} the runtime starts driving it, and this function yields here."
    - ko: "끝나면 값이 이 자리에 서고 아래 줄이 이어진다."
      en: "When it finishes the value stands here and the lines below continue."

rule:
  ko: "<b>부르기만 하면 안 돈다.</b> .await 가 굴리고, 그동안 스레드는 다른 일을 하며, .await 는 async 안에서만."
  en: "<b>A call alone runs nothing.</b> .await drives it, the thread does other work meanwhile, and .await lives only inside async."
result:
  label:
    ko: "{{site.line}}행의 기다림"
    en: "the wait on line {{site.line}}"
  value: "{{pick.2}}.{{pick.1}}"
  note:
    ko: "여기서 양보하고, 끝나면 값"
    en: "yields here; the value when done"
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 끝날 때까지 이 함수는 양보하고, 끝나면 그 값이 여기 섭니다."
  en: "This function yields until {{pick.2|code}} finishes, and then its value stands here."
payoff:
  ko: "이걸 알면 「`async fn` 을 불렀는데 왜 안 돌았나」와 「왜 `.await` 가 여기선 안 되나」(E0728)가 함께 풀립니다."
  en: "This untangles both “I called the `async fn`, why did nothing run” and “why is `.await` refused here” (E0728)."
bridge:
  ko: "JS 의 `async` 함수는 부르는 순간 돌기 시작합니다. Rust 의 것은 <b>`.await` 가 올 때까지</b> 한 걸음도 안 갑니다."
  en: "A JS `async` function starts running the moment it is called. Rust's takes <b>not one step until `.await`</b>."
misconceptions:
  - ko: "`async fn` 을 부르면 돌기 시작한다 — 미래를 돌려줄 뿐 <b>안 돕니다</b>. `.await` 가 첫 걸음이에요."
    en: "Calling an `async fn` starts it — it only hands back a future and <b>does not run</b>. `.await` is the first step."
  - ko: "`.await` 는 스레드를 멈춘다 — 이 함수만 양보합니다. 스레드는 다른 미래를 돌려요."
    en: "`.await` blocks the thread — only this function yields. The thread drives other futures."
  - ko: "`.await` 는 어디서나 쓸 수 있다 — `async` 안에서만입니다(E0728). `main` 에는 `#[tokio::main]` 이 필요해요."
    en: "`.await` works anywhere — only inside `async` (E0728). `main` needs `#[tokio::main]`."

point:
  - q:
      ko: "{{site.line}}행에서 <b>기다리되 멈추지 않는 표시</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the mark that waits without blocking</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 미래를 <b>돌려주는 호출</b>입니다. 그것만으로는 안 돌고, 굴리는 것은 뒤의 표시예요."
          en: "{{pick.2|code}} is the <b>call that hands back a future</b>. By itself it runs nothing; the mark after drives it."
        edge:
          h: { ko: "가장 날카로운 자리 — 미래냐 실행이냐", en: "The sharpest spot — the future or the run" }
          code:
            - "fetch()          // 미래 — 안 돈다"
            - "fetch().await    // 돈다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 인자 목록이거나 점입니다. 기다리는 뜻은 그 뒤의 낱말에 있어요."
          en: "{{pick.3|code}} is the parameter list or the dot. The waiting is in the word after it."
        edge:
          h: { ko: "가장 날카로운 자리 — 점이냐 낱말이냐", en: "The sharpest spot — the dot or the word" }
          code:
            - "fetch().await"
            - "//     ^점 ^낱말"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 미래가 끝날 때까지 <b>양보하며 기다립니다</b>."
      en: "Choose what goes in the blank. Line {{site.line}} <b>yields and waits</b> for a future to finish."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "await", mono: true }
      - t: "async"
        mono: true
        diag:
          t:
            ko: "이건 미래를 <b>만드는</b> 낱말이고 함수·블록 앞에 옵니다. 값 뒤에 점으로 붙지 않아요."
            en: "That <b>makes</b> a future and goes before a function or block. It does not attach after a value with a dot."
          edge:
            h: { ko: "가장 날카로운 자리 — 만들기냐 기다리기냐", en: "The sharpest spot — making or waiting" }
            code:
              - "async fn load()   // 만든다"
              - "load().await      // 기다린다"
      - t: "unwrap"
        mono: true
        diag:
          t:
            ko: "이건 <b>Result·Option 을 여는</b> 이름입니다. 미래는 못 열어요 — 먼저 기다려야 값이 됩니다."
            en: "That <b>opens a Result or Option</b>. It cannot open a future — wait first, then it is a value."
          edge:
            h: { ko: "가장 날카로운 자리 — 순서", en: "The sharpest spot — the order" }
            code:
              - "load().await?      // 기다린 뒤 연다"
              - "load().unwrap()    // E0599"
      - t: "spawn"
        mono: true
        diag:
          t:
            ko: "이건 미래를 <b>따로 띄우는</b> 함수라 `tokio::spawn(미래)` 처럼 부릅니다. 값 뒤에 점으로 안 붙어요."
            en: "That <b>launches</b> a future separately, called as `tokio::spawn(future)`. It does not attach after a value with a dot."
          edge:
            h: { ko: "가장 날카로운 자리 — 여기서 기다리나 따로 띄우나", en: "The sharpest spot — wait here or launch apart" }
            code:
              - "load().await           // 여기서"
              - "tokio::spawn(load())   // 따로"

why_gate:
  q:
    ko: "Rust 는 왜 `async fn` 을 <b>부르기만 해서는 안 돌게</b> 했을까요?"
    en: "Why does Rust make an `async fn` <b>do nothing when merely called</b>?"
  choices:
    - t:
        ko: "언제 어느 스레드에서 굴릴지를 실행기가 정하게 하려고 — 미래는 값이라 넘기고 모으고 나중에 굴릴 수 있다"
        en: "So the runtime decides when and on which thread to drive it — a future is a value that can be passed, gathered and driven later"
      ok: true
      fb:
        ko: "그 방향입니다. 이 미래를 굴리는 실행기가 어디서 시작되는지도 찾아보세요."
        en: "That is the direction. Find where the runtime driving this future is started."
    - t:
        ko: "바로 돌리면 컴파일이 안 되어서"
        en: "Because running at once would not compile"
      ok: false
      fb:
        ko: "컴파일 문제가 아니라 설계 선택입니다. JS 는 반대로 정했어요."
        en: "Not a compile issue — a design choice. JS chose the opposite."
    - t:
        ko: "미래가 무거워서"
        en: "Because futures are heavy"
      ok: false
      fb:
        ko: "반대입니다. 미래는 상태 기계 하나라 가볍고, 그래서 값으로 다룰 수 있어요."
        en: "The other way round. A future is one state machine, light enough to be a value."

queries:
  - { grammars: [rust], file: ./async-await.scm }

examples:
  - code: "fn f() { let data = fetch().await; }             // 여기서 양보한다"
    expect: { sites: 1, form: await, hole: "await", picks: { 1: "await", 2: "fetch()", 3: "." } }
  - code: "async fn load() -> u32 { fetch().await }          // 미래를 돌려주는 함수"
    expect: { sites: 2, form: async-fn, picks: { 1: "async", 2: "load", 3: "()" } }
  - code: "fn f() { let job = async { work() }; }            // 미래 하나 — 아직 안 돈다"
    expect: { sites: 1, form: async-block, picks: { 1: "async", 2: "{ work() }", 3: "{" } }
  - code: "fn load() -> u32 { fetch() }                      // 동기 — 부르면 돈다"
    expect: none
