schema: 1
id: rs/mut-binding
# 0부 축 G (`rs.md` §0.1 #2). 보편형은 `common/reassignment` — 다시 넣는 일은 어느 언어에나 있고,
# Rust 에서 다시 배울 것은 그 허락을 **선언 쪽에 적는다**는 것 하나다.
universal: common/reassignment
name: { ko: 바꿀 수 있다고 적기, en: Marking a name changeable }
token: "mut"
grammars: [rust]
framework: null
essential: true
difficulty: 1
prereq: [rs/let-binding, cs/state]
confusions: []

dict:
  one_liner:
    ko: "다시 넣을 이름에는 선언에서 표시를 붙인다. 표시는 값이 아니라 이름에 붙는다."
    en: "A name to be refilled gets a mark at its declaration; the mark is on the name."
  why:
    ko: >-
      {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:은,는}} 「{{pick.2|code}}{{pick.2|josa:을,를}} 나중에 다시 넣겠다」는
      <b>약속</b>입니다. 약속이 없는 이름에 다시 넣으면 E0384 로 멈추고, 그래서 이 한 글자를 보면 함수
      안에서 <b>어느 이름이 움직이는지</b>가 선언만으로 보입니다. 값이 아니라 이름에 붙는다는 것이
      요점이에요 — {{pick.2|code}}{{pick.2|josa:을,를}} 통째로 다른 값으로 갈아 끼우는 것도, 그 안의 원소를 고치는 것도
      같은 한 글자가 엽니다.
    en: >-
      {{pick.1|code}} on line {{site.line}} is a <b>promise</b>: “{{pick.2|code}} will be refilled later.”
      Refill a name without the promise and E0384 stops you, so this one word shows, from the
      declaration alone, <b>which names in a function move</b>. It is on the name, not the value —
      swapping {{pick.2|code}} for a whole new value and editing an element inside are opened by the
      same word.
  trace:
    - ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 값에 묶인다."
      en: "{{pick.2|code}} is tied to a value."
    - ko: "{{pick.1|code}} 덕에 아래에서 {{pick.2|code}} 에 다시 넣는 줄이 통과한다."
      en: "Thanks to {{pick.1|code}}, a line below that refills {{pick.2|code}} passes."
    - ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 없었다면 그 줄이 E0384 다."
      en: "Without {{pick.1|code}}, that line would be E0384."

rule:
  ko: "<b>바꿀 수 있음은 이름에 붙는다.</b> 선언에 없으면 다시 넣는 줄이 막힌다."
  en: "<b>Changeability belongs to the name.</b> Not on the declaration means the refilling line is blocked."
result:
  label:
    ko: "{{site.line}}행의 {{pick.2}}"
    en: "{{pick.2}} on line {{site.line}}"
  value: "{{pick.1}} {{pick.2}}"
  note:
    ko: "다시 넣어도 된다"
    en: "may be refilled"
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 이제 아래에서 다시 넣어도 되는 이름입니다."
  en: "{{pick.2|code}} is now a name that may be refilled below."
payoff:
  ko: "이걸 알면 「빌려 온 값을 왜 못 고치나」(E0596)의 절반이 풀립니다 — 고칠 권한은 이름에 적힌 것이라서요."
  en: "This solves half of “why can I not edit a borrowed value” (E0596) — the right to edit is written on the name."
bridge:
  ko: "파이썬·JS 는 모든 이름이 이 표시를 단 것과 같습니다. Rust 는 반대로 <b>없는 것이 기본</b>입니다."
  en: "In Python and JS every name carries this mark. Rust flips the default — <b>no mark</b> is the norm."
misconceptions:
  - ko: "이 표시는 「값이 변한다」는 뜻이다 — <b>이름</b>에 붙습니다. 표시 없는 이름으로 넘긴 값은 받은 쪽에서 못 고치고, 어떤 상자는 표시 없이도 안이 바뀝니다."
    en: "The mark means “this value changes” — it is on <b>the name</b>. A value passed under an unmarked name cannot be edited there, and some boxes change inside without any mark."
  - ko: "표시가 있으면 타입도 바꿀 수 있다 — 값만 바꿉니다. 타입이 다른 값을 넣으면 E0308 이에요."
    en: "The mark lets the type change too — only the value changes. A value of another type is E0308."

point:
  - q:
      ko: "{{site.line}}행에서 <b>다시 넣어도 된다는 표시</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the mark that allows refilling</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>이름</b>입니다. 이름 자체는 바꿀 수 있는지 말하지 못하고, 그 앞의 한 글자가 말해요."
          en: "{{pick.2|code}} is <b>the name</b>. A name cannot say whether it may change; the word before it does."
        edge:
          h: { ko: "가장 날카로운 자리 — 이름이냐 표시냐", en: "The sharpest spot — the name or the mark" }
          code:
            - "let n = 0;       // n 은 고정"
            - "let mut n = 0;   // 같은 이름, 움직인다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 이름을 <b>만드는</b> 낱말입니다. 만들기만 하고 바꿀 수 있는지는 정하지 않아요."
          en: "{{pick.3|code}} is the word that <b>makes</b> the name. It makes it and says nothing about changing it."
        edge:
          h: { ko: "가장 날카로운 자리 — 만들기냐 허락이냐", en: "The sharpest spot — making or allowing" }
          code:
            - "let n = 0;       // 만들기만"
            - "let mut n = 0;   // 만들기 + 허락"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행의 이름은 아래에서 <b>다시 넣어야</b> 합니다."
      en: "Choose what goes in the blank. The name on line {{site.line}} <b>gets refilled</b> below."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "mut", mono: true }
      - t: "ref"
        mono: true
        diag:
          t:
            ko: "이건 패턴 안에서 <b>빌려서 묶으라</b>는 표시입니다. 다시 넣을 수 있게 하는 것이 아니에요."
            en: "That tells a pattern to <b>bind by borrowing</b>. It does not allow refilling."
          edge:
            h: { ko: "가장 날카로운 자리 — 빌림이냐 허락이냐", en: "The sharpest spot — borrowing or allowing" }
            code:
              - "let ref r = x;   // x 를 빌려 r 에"
              - "let mut n = 0;   // n 을 다시 넣어도 된다"
      - t: "pub"
        mono: true
        diag:
          t:
            ko: "이건 <b>밖에서 보이게</b> 하는 표시라 항목(함수·구조체)에 붙습니다. 함수 안의 이름에는 못 붙어요."
            en: "That makes an item <b>visible outside</b> and goes on functions and structs. It cannot go on a local name."
          edge:
            h: { ko: "가장 날카로운 자리 — 보임이냐 바뀜이냐", en: "The sharpest spot — visibility or change" }
            code:
              - "pub fn run() {}   // 밖에서 부른다"
              - "let mut n = 0;    // 다시 넣는다"
      - t: "const"
        mono: true
        diag:
          t:
            ko: "이건 <b>절대 안 바뀌는</b> 값을 컴파일 시에 정하는 낱말이라 정반대입니다."
            en: "That fixes a value <b>that never changes</b> at compile time — the exact opposite."
          edge:
            h: { ko: "가장 날카로운 자리 — 반대 방향", en: "The sharpest spot — the opposite direction" }
            code:
              - "const MAX: u32 = 10;   // 못 바꾼다"
              - "let mut n = 0;         // 바꾼다"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 {{pick.2|code}} 에 이 표시를 <b>붙였을까요</b>?"
    en: "Why does line {{site.line}} <b>put</b> this mark on {{pick.2|code}}?"
  choices:
    - t:
        ko: "아래 어딘가에서 이 이름에 다른 값을 넣기 때문에 — 그 줄을 찾으면 이 표시의 이유가 보인다"
        en: "Because somewhere below a different value goes into this name — find that line and the mark explains itself"
      ok: true
      fb:
        ko: "그 방향입니다. 그 줄이 몇 행인지도 적어 보세요."
        en: "That is the direction. Note which line it is."
    - t:
        ko: "Rust 는 모든 이름에 붙여야 해서"
        en: "Because Rust requires it on every name"
      ok: false
      fb:
        ko: "반대입니다. 안 붙인 것이 기본이고, 붙인 곳이 예외예요."
        en: "The other way round. Unmarked is the default; marked is the exception."
    - t:
        ko: "이름을 밖에서도 쓰려고"
        en: "So the name is usable outside"
      ok: false
      fb:
        ko: "보이는 범위와는 무관합니다. 다시 넣을 수 있느냐만 정해요."
        en: "It has nothing to do with scope. It only decides whether refilling is allowed."

queries:
  - { grammars: [rust], file: ./mut-binding.scm }

examples:
  - code: "fn f() { let mut count = 0; count += 1; }     // count -> 1 (i32)"
    expect: { sites: 1, form: let-mut, hole: "mut", picks: { 1: "mut", 2: "count", 3: "let" } }
  - code: "fn push_all(mut v: Vec<i32>) { v.push(1); }   // 받은 v 를 안에서 고친다"
    expect: { sites: 1, form: mut-param, hole: "mut", picks: { 1: "mut", 2: "v", 3: "Vec<i32>" } }
  - code: "fn f() { let count = 0; }                     // 표시 없음 — rs/let-binding"
    expect: none
  - code: "fn f() { let m = &mut count; }                // 빌림의 mut — rs/borrow-mut"
    expect: none
