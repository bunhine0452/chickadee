schema: 1
id: rs/smart-pointer
# 2부 끝 (`rs.md` §4). 보편형은 없다. `RefCell` 은 빌림 규칙을 **없애는 게 아니라** 어길 때 패닉으로
# 바꾼다. 네 리포 합쳐 26곳(`Box` 대부분) — **합성이 정본**이다(rust-axis §2.1). 선행에서
# `shared-thread-state` 로 가는 간선은 끊었다(rust-axis §2.3 ②: `Box`/`Rc` 26 대 `Arc`/`Mutex` 300).
universal: null
name: { ko: 규칙을 실행 시로 옮기기, en: Moving the rules to run time }
token: "Box"
grammars: [rust]
framework: null
essential: true
difficulty: 4
prereq: [rs/borrow-mut, rs/generic-bounds, cs/stack-and-heap, cs/pointer-indirection]
confusions: []

dict:
  one_liner:
    ko: "값을 힙에 두는 상자들. 주인을 여럿으로 세거나 빌림을 실행 시에 세게 할 수 있지만, 규칙이 사라지지는 않는다."
    en: "Wrappers that put a value on the heap; the rules move to run time, never vanish."
  why:
    ko: >-
      {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:은,는}} {{pick.2|code}}{{pick.2|josa:을,를}} <b>힙에</b> 두고 그 자리를 가리키는 상자입니다.
      제일 단순한 것이 `Box` — 크기를 모르는 값(`dyn Trait`·재귀 구조)을 담을 때 씁니다. `Rc` 는 주인을
      <b>세어서</b> 여럿이 갖게 하고, 마지막 주인이 사라질 때 값을 치워요. `RefCell` 은 빌림 검사를
      <b>실행 시로</b> 옮깁니다 — `&mut` 이 없어도 안을 고칠 수 있지만, 고치는 빌림이 둘이 되는 순간
      컴파일 오류 대신 <b>패닉</b>이에요. 규칙에서 벗어난 것이 아니라 어기는 시점이 바뀐 겁니다. 표본
      리포에는 26곳뿐이라 이 판은 합성으로 배우고, 실제로 만나는 것은 다음 판의 `Arc&lt;Mutex&gt;` 일 가능성이
      높습니다.
    en: >-
      {{pick.1|code}} on line {{site.line}} is a wrapper that puts {{pick.2|code}} <b>on the heap</b> and
      points at it. The simplest is `Box` — for values of unknown size (`dyn Trait`, recursive
      structures). `Rc` <b>counts</b> owners so several may hold a value, freeing it when the last one
      goes. `RefCell` moves the borrow check <b>to run time</b> — you can change the inside without
      `&mut`, but the moment two changing borrows exist it is a <b>panic</b> instead of a compile error.
      The rules did not go away; the moment of breaking them moved. The sample repos have only 26 sites,
      so this plate is learned from synthetic examples, and what you will actually meet is more likely
      the next plate's `Arc&lt;Mutex&gt;`.
  trace:
    - ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 힙에 놓이고 {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:이,가}} 그 자리를 가리킨다."
      en: "{{pick.2|code}} sits on the heap and {{pick.1|code}} on line {{site.line}} points at it."
    - ko: "상자가 사라질 때 안의 값이 치워진다 — Rc 는 마지막 주인이 사라질 때."
      en: "When the wrapper goes, the value is freed — with Rc, when the last owner goes."
    - ko: "RefCell 이면 빌림 규칙이 실행 시에 세어지고, 어기면 패닉이다."
      en: "With RefCell the borrow rules are counted at run time, and breaking them panics."

rule:
  ko: "<b>상자는 규칙을 옮길 뿐 없애지 않는다.</b> Box 는 힙, Rc 는 주인 세기, RefCell 은 실행 시 빌림 검사."
  en: "<b>A wrapper moves the rules; it never removes them.</b> Box for the heap, Rc counts owners, RefCell checks borrows at run time."
result:
  label:
    ko: "{{site.line}}행의 상자"
    en: "the wrapper on line {{site.line}}"
  value: "{{pick.1}}<{{pick.2}}>"
  note:
    ko: "힙의 값을 가리킨다"
    en: "points at a value on the heap"
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 이제 힙에 있고 {{pick.1|code}}{{pick.1|josa:이,가}} 그것을 가리킵니다. 상자의 종류가 규칙이 언제 세어지는지를 정해요."
  en: "{{pick.2|code}} is now on the heap and {{pick.1|code}} points at it. The kind of wrapper decides when the rules are counted."
payoff:
  ko: "이걸 알면 「`RefCell` 을 썼는데 왜 실행 중에 터지나」(already borrowed)가 풀립니다 — 규칙이 실행 시로 옮겨 간 겁니다."
  en: "This untangles “I used `RefCell`, why does it panic at run time” (already borrowed) — the rules moved to run time."
bridge:
  ko: "GC 언어의 모든 객체가 사실상 `Rc` 입니다. Rust 는 그것을 <b>필요한 자리에만</b> 상자로 적게 합니다."
  en: "Every object in a GC language is effectively an `Rc`. Rust makes you write that wrapper <b>only where needed</b>."
misconceptions:
  - ko: "`Rc&lt;RefCell&lt;T&gt;&gt;` 를 쓰면 빌림 규칙에서 벗어난다 — 규칙이 <b>실행 시로</b> 옮겨간 것뿐이라 어기면 패닉합니다."
    en: "`Rc&lt;RefCell&lt;T&gt;&gt;` escapes the borrow rules — they merely moved <b>to run time</b>, and breaking them panics."
  - ko: "`Box` 는 느린 참조다 — 힙의 값을 <b>소유</b>하는 상자입니다. 참조가 아니라 주인이에요."
    en: "`Box` is a slow reference — it is a wrapper that <b>owns</b> a heap value. An owner, not a reference."
  - ko: "`Rc` 는 스레드 사이에서도 된다 — 안 됩니다(E0277). 스레드에는 `Arc` 예요."
    en: "`Rc` works across threads — it does not (E0277). Across threads it is `Arc`."

point:
  - q:
      ko: "{{site.line}}행에서 <b>값을 힙에 두는 상자의 이름</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the name of the wrapper that puts the value on the heap</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 상자 <b>안의 것</b>입니다. 힙에 두는 일은 그것을 감싼 이름이 해요."
          en: "{{pick.2|code}} is <b>what is inside</b> the wrapper. Putting it on the heap is done by the name around it."
        edge:
          h: { ko: "가장 날카로운 자리 — 안이냐 상자냐", en: "The sharpest spot — the inside or the wrapper" }
          code:
            - "dyn Error         // 크기를 모른다"
            - "Box<dyn Error>    // 힙에 두고 가리킨다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 안의 타입을 여는 <b>꺾쇠</b>이거나 인자 목록입니다. 상자의 종류는 그 앞의 이름이에요."
          en: "{{pick.3|code}} is the <b>angle bracket</b> opening the inner type, or the argument list. The wrapper's kind is the name before."
        edge:
          h: { ko: "가장 날카로운 자리 — 이름이냐 괄호냐", en: "The sharpest spot — the name or the bracket" }
          code:
            - "Rc<RefCell<i32>>"
            - "// ^상자 ^또 상자"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 크기를 모르는 값을 <b>힙에 두고 소유</b>합니다."
      en: "Choose what goes in the blank. Line {{site.line}} <b>owns a value of unknown size on the heap</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "Box", mono: true }
      - t: "Rc"
        mono: true
        diag:
          t:
            ko: "이건 주인을 <b>세는</b> 상자입니다. 주인이 하나뿐인 자리에는 세는 비용만 들어요."
            en: "That <b>counts</b> owners. Where there is one owner it only adds counting cost."
          edge:
            h: { ko: "가장 날카로운 자리 — 주인이 몇인가", en: "The sharpest spot — how many owners" }
            code:
              - "Box<dyn Error>   // 주인 하나"
              - "Rc<Node>         // 주인 여럿"
      - t: "RefCell"
        mono: true
        diag:
          t:
            ko: "이건 <b>빌림을 실행 시에 세는</b> 상자이고 힙에 두지 않습니다. 크기를 모르는 값은 못 담아요."
            en: "That <b>checks borrows at run time</b> and does not use the heap. It cannot hold a value of unknown size."
          edge:
            h: { ko: "가장 날카로운 자리 — 힙이냐 검사냐", en: "The sharpest spot — the heap or the check" }
            code:
              - "Box<dyn Error>    // 힙"
              - "RefCell<i32>      // 실행 시 검사"
      - t: "Arc"
        mono: true
        diag:
          t:
            ko: "이건 <b>스레드 사이에서</b> 주인을 세는 상자입니다. 한 스레드라면 세는 비용이 낭비예요."
            en: "That counts owners <b>across threads</b>. On one thread its atomic counting is wasted."
          edge:
            h: { ko: "가장 날카로운 자리 — 스레드가 몇인가", en: "The sharpest spot — how many threads" }
            code:
              - "Box<T>   // 한 주인"
              - "Arc<T>   // 여러 스레드가 주인"

why_gate:
  q:
    ko: "Rust 는 왜 빌림 검사를 <b>실행 시로 옮기는 길</b>을 남겨 두었을까요?"
    en: "Why does Rust leave a way to <b>move the borrow check to run time</b>?"
  choices:
    - t:
        ko: "그래프처럼 컴파일러가 증명 못 하는 모양이 있어서 — 규칙을 지키되 검사 시점만 바꾼다"
        en: "Because some shapes, like graphs, cannot be proved safe by the compiler — the rules stay, only the check moves"
      ok: true
      fb:
        ko: "그 방향입니다. 이 자리가 정말 컴파일 시 검사로는 안 되는 모양인지도 판단해 보세요."
        en: "That is the direction. Judge whether this spot truly cannot pass the compile-time check."
    - t:
        ko: "빌림 규칙이 틀려서"
        en: "Because the borrow rules are mistaken"
      ok: false
      fb:
        ko: "규칙은 그대로입니다. 어길 때 패닉하는 것이 그 증거예요."
        en: "The rules stand. The panic on breaking them is the proof."
    - t:
        ko: "더 빠르게 하려고"
        en: "To go faster"
      ok: false
      fb:
        ko: "반대입니다. 실행 시 검사가 비용을 더 듭니다."
        en: "The other way round. A run-time check costs more."

queries:
  - { grammars: [rust], file: ./smart-pointer.scm }

examples:
  - code: "fn f() { let b: Box<dyn Error> = Box::new(e); }   // 크기 모르는 값을 힙에"
    expect: { sites: 2, form: pointer-type, hole: "Box", picks: { 1: "Box", 2: "dyn Error", 3: "<" } }
  - code: "fn f() { let v = cell.borrow_mut(); }            // 실행 시에 세는 빌림"
    expect: { sites: 1, form: runtime-borrow, picks: { 1: "borrow_mut", 2: "cell", 3: "()" } }
  - code: "fn f() { let v: Vec<i32> = Vec::new(); }          // 목록 — rs/vec"
    expect: none
