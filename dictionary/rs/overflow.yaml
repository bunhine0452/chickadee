schema: 1
id: rs/overflow
# 0부 축 A (`rs.md` §0.1 #4). 보편형은 없다 — 「디버그면 패닉, 릴리스면 감싼다」는 Rust 가 고른
# 규칙이고 C 는 UB, 자바는 늘 감싼다. 같은 기계 위에서 답이 셋으로 갈리면 전이가 거짓을 나른다.
universal: null
name: { ko: 자리가 모자라면, en: When the slots run out }
token: "checked_"
grammars: [rust]
framework: null
essential: true
difficulty: 2
prereq: [rs/integer-type, cs/integer-overflow]
confusions: []

dict:
  one_liner:
    ko: "칸을 넘치면 디버그 빌드는 멈추고 릴리스 빌드는 감싼다. 뜻을 적으려면 메서드 이름으로 적는다."
    en: "Past the last slot, debug panics and release wraps; a method name says which."
  why:
    ko: >-
      「Rust 는 안전하니 넘침도 막힌다」는 반쯤만 맞습니다. 디버그 빌드는 넘치는 순간 <b>패닉</b>하고
      릴리스 빌드는 <b>감쌉니다</b> — 같은 코드가 빌드 프로필에 따라 다르게 돌아요. 둘 다 정의된
      동작이라 C 의 UB 와는 다르지만, 어느 쪽인지를 코드가 말하지 않는 것이 문제입니다. 그래서
      {{site.line}}행처럼 {{pick.1|code}}{{pick.1|josa:을,를}} 부릅니다 — 넘치면 어떻게 할지를 <b>이름으로</b> 적는 거예요.
      넷이 있습니다: 감싼다(wrapping) · 없음을 돌려준다(checked) · 끝에 붙는다(saturating) · 값과
      넘쳤는지를 함께 준다(overflowing).
    en: >-
      “Rust is safe, so overflow is blocked” is half true. A debug build <b>panics</b> the moment a value
      overflows; a release build <b>wraps</b> — the same code behaves differently per build profile.
      Both are defined, unlike C's UB, but the code does not say which you meant. So line
      {{site.line}} calls {{pick.1|code}} — it <b>names</b> what to do on overflow. There are four:
      wrap (wrapping), hand back nothing (checked), stick to the edge (saturating), give the value plus
      a flag (overflowing).
  trace:
    - ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 어떤 폭의 정수다 — 칸 수가 정해져 있다."
      en: "{{pick.2|code}} is an integer of some width — its slot count is fixed."
    - ko: "{{site.line}}행이 {{pick.1|code}}{{pick.1|josa:으로,로}} 셈한다 — 넘치면 어떻게 할지가 이름에 적혀 있다."
      en: "Line {{site.line}} computes with {{pick.1|code}} — what happens on overflow is in the name."
    - ko: "이름 없이 `+` 로 셈했다면 디버그는 패닉, 릴리스는 감싸기다."
      en: "With a bare `+` instead, debug would panic and release would wrap."

rule:
  ko: "<b>넘침은 정의돼 있되 프로필이 정한다.</b> 뜻을 코드에 남기려면 넷 중 하나를 이름으로 부른다."
  en: "<b>Overflow is defined, but the profile decides.</b> To leave your meaning in the code, call one of the four by name."
result:
  label:
    ko: "{{site.line}}행의 셈"
    en: "the operation on line {{site.line}}"
  value: "{{pick.2}}.{{pick.1}}{{pick.3}}"
  note:
    ko: "넘치면 어떻게 할지가 이름에 있다"
    en: "the name says what happens on overflow"
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 넘쳐도 {{pick.1|code}}{{pick.1|josa:이,가}} 정한 대로 됩니다 — 프로필과 무관하게요."
  en: "Even when {{pick.2|code}} overflows, {{pick.1|code}} decides the outcome — regardless of profile."
payoff:
  ko: "이걸 알면 「테스트에선 터지고 배포본에선 이상한 값이 나온다」가 풀립니다 — 같은 넘침을 두 프로필이 다르게 다룬 겁니다."
  en: "This untangles “it panics in tests but prints a strange number in production” — two profiles handling the same overflow."
bridge:
  ko: "자바는 늘 감싸고 C 는 부호 있는 넘침이 UB 입니다. Rust 는 둘 다 정의하되 <b>어느 쪽인지 적게</b> 합니다."
  en: "Java always wraps; in C signed overflow is UB. Rust defines both and makes you <b>write which</b>."
misconceptions:
  - ko: "Rust 는 넘침을 막는다 — 디버그에서만 패닉으로 잡습니다. 릴리스는 조용히 감싸요."
    en: "Rust blocks overflow — only a debug build catches it with a panic. Release wraps silently."
  - ko: "감싸기는 오류다 — 정의된 동작입니다. 해시·암호 코드는 일부러 씁니다(`wrapping_`)."
    en: "Wrapping is a bug — it is defined behavior. Hashing and crypto use it on purpose (`wrapping_`)."
  - ko: "타입을 넓히면 안 넘친다 — 칸이 늘어날 뿐 끝은 있습니다. 128칸도 넘칩니다."
    en: "A wider type never overflows — it only has more slots. Even 128 of them have an end."

point:
  - q:
      ko: "{{site.line}}행에서 <b>넘치면 어떻게 할지를 적은 이름</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the name that says what happens on overflow</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 셈의 <b>재료</b>입니다. 재료는 넘칠 수 있을 뿐 넘치면 어떻게 할지는 못 정해요."
          en: "{{pick.2|code}} is an <b>input</b>. An input can overflow; it cannot decide what happens then."
        edge:
          h: { ko: "가장 날카로운 자리 — 재료냐 규칙이냐", en: "The sharpest spot — the input or the rule" }
          code:
            - "a + b               // 프로필이 정한다"
            - "a.checked_add(b)    // 이름이 정한다"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 다른 쪽 <b>재료</b>입니다. 규칙은 그 앞의 이름에 있어요."
          en: "{{pick.3|code}} is the other <b>input</b>. The rule is in the name before it."
        edge:
          h: { ko: "가장 날카로운 자리 — 인자냐 이름이냐", en: "The sharpest spot — the argument or the name" }
          code:
            - "a.checked_add(b)    // (b) 는 재료"
            - "a.wrapping_add(b)   // 같은 재료, 다른 규칙"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 넘치면 <b>없음을 돌려주는</b> 셈입니다."
      en: "Choose what goes in the blank. Line {{site.line}} computes and <b>hands back nothing</b> on overflow."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "checked_add", mono: true }
      - t: "wrapping_add"
        mono: true
        diag:
          t:
            ko: "이건 넘치면 <b>감쌉니다</b> — 255 다음이 0. 값은 늘 나오지만 넘쳤다는 사실은 사라져요."
            en: "That <b>wraps</b> on overflow — after 255 comes 0. You always get a value, and the fact of overflow is gone."
          edge:
            h: { ko: "가장 날카로운 자리 — 감싸기냐 없음이냐", en: "The sharpest spot — wrap or nothing" }
            code:
              - "255u8.wrapping_add(1)   // 0"
              - "255u8.checked_add(1)    // None"
      - t: "saturating_add"
        mono: true
        diag:
          t:
            ko: "이건 넘치면 <b>끝에 붙습니다</b> — 255 에서 멈춤. 없음 대신 최댓값이 나와요."
            en: "That <b>sticks to the edge</b> on overflow — it stays at 255. You get the maximum instead of nothing."
          edge:
            h: { ko: "가장 날카로운 자리 — 끝이냐 없음이냐", en: "The sharpest spot — the edge or nothing" }
            code:
              - "255u8.saturating_add(1)   // 255"
              - "255u8.checked_add(1)      // None"
      - t: "overflowing_add"
        mono: true
        diag:
          t:
            ko: "이건 <b>값과 넘쳤는지</b>를 짝으로 줍니다 — (0, true). 없음을 돌려주지는 않아요."
            en: "That returns <b>the value and a flag</b> as a pair — (0, true). It never hands back nothing."
          edge:
            h: { ko: "가장 날카로운 자리 — 짝이냐 없음이냐", en: "The sharpest spot — a pair or nothing" }
            code:
              - "255u8.overflowing_add(1)   // (0, true)"
              - "255u8.checked_add(1)       // None"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 `+` 대신 <b>이름 붙은 셈</b>을 썼을까요?"
    en: "Why does line {{site.line}} use <b>a named operation</b> instead of `+`?"
  choices:
    - t:
        ko: "넘칠 수 있는 자리라 어느 프로필에서든 같은 일이 나게 하려고 — 그리고 그 뜻을 읽는 사람에게 남기려고"
        en: "Because this can overflow, and the same thing must happen under any profile — and the reader should see that intent"
      ok: true
      fb:
        ko: "그 방향입니다. 넷 중 이것을 고른 이유도 한 줄로 적어 보세요."
        en: "That is the direction. Add a line on why this one of the four."
    - t:
        ko: "`+` 가 정수에는 안 되어서"
        en: "Because `+` does not work on integers"
      ok: false
      fb:
        ko: "됩니다. 다만 넘쳤을 때 무엇이 될지를 프로필에 맡기게 돼요."
        en: "It works. It just leaves the overflow outcome to the profile."
    - t:
        ko: "더 빠르게 돌게 하려고"
        en: "To make it faster"
      ok: false
      fb:
        ko: "속도 문제가 아닙니다. 오히려 검사가 하나 더 들어요."
        en: "It is not about speed. If anything, there is one more check."

queries:
  - { grammars: [rust], file: ./overflow.scm }

examples:
  - code: "fn f() { let sum = a.checked_add(b); }        // sum -> Some(값) 또는 None"
    expect: { sites: 1, form: overflow-method, hole: "checked_add", picks: { 1: "checked_add", 2: "a", 3: "(b)" } }
  - code: "fn f() { let top = u8::MAX; }                 // top -> 255 (u8)"
    expect: { sites: 1, form: limit, picks: { 1: "MAX", 2: "u8", 3: "::" } }
  - code: "fn f() { let s = a + b; }                     // 넘침은 트리에 안 남는다 — rs/arithmetic"
    expect: none
