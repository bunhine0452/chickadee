schema: 1
id: rs/operator-precedence
# 0부 축 E (`rs.md` §0.1 #10). 보편형은 없다 — 「괄호를 안 쓰면 무엇이 먼저 묶이나」의 기계는
# `cs/operator-precedence` 이고, Rust 에서 다시 배울 자리는 셋이다: `as` 가 이항 연산자보다 세다 ·
# `&` 가 빌림과 비트AND 두 뜻 · `..` 가 가장 약하다. The Book 3장에는 없다(rs-learning §11.2).
universal: null
name: { ko: 어느 것이 먼저 묶이나, en: What binds first }
token: "as"
grammars: [rust]
framework: null
essential: true
difficulty: 2
prereq: [rs/arithmetic, rs/comparison, cs/operator-precedence]
confusions: []

dict:
  one_liner:
    ko: "괄호가 없으면 세기 순서로 묶인다. 변환이 셈보다 세고, 범위 표시가 가장 약하다."
    en: "Without parentheses, strength decides: conversion first, the range mark last."
  why:
    ko: >-
      {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:은,는}} {{pick.2|code}}{{pick.2|josa:과,와}} {{pick.3|code}}{{pick.3|josa:을,를}}
      묶는데, 어느 쪽이 <b>먼저</b> 묶이는지는 괄호가 아니라 세기가 정합니다. Rust 에서 초보가 실제로
      틀리는 자리가 셋이에요. <code>x as u8 + 1</code> 은 「x 를 u8+1 로」가 아니라 <b><code>(x as u8) + 1</code></b>
      입니다 — 변환이 셈보다 셉니다. <code>&amp;v[0]</code> 은 <code>&amp;(v[0])</code> 이지 <code>(&amp;v)[0]</code> 이
      아니에요. 그리고 <code>0..n + 1</code> 은 <code>0..(n + 1)</code> 입니다 — 범위 표시가 가장 약합니다.
      또 하나, `&&` 와 `||` 는 왼쪽만으로 답이 정해지면 <b>오른쪽을 아예 안 봅니다</b>.
    en: >-
      {{pick.1|code}} on line {{site.line}} joins {{pick.2|code}} and {{pick.3|code}}, and which part binds
      <b>first</b> is decided by strength, not parentheses. Three spots trip beginners in Rust.
      <code>x as u8 + 1</code> is not “x into u8+1” but <b><code>(x as u8) + 1</code></b> — conversion binds
      tighter than arithmetic. <code>&amp;v[0]</code> is <code>&amp;(v[0])</code>, not
      <code>(&amp;v)[0]</code>. And <code>0..n + 1</code> is <code>0..(n + 1)</code> — the range mark is the
      weakest. One more: with `&&` and `||`, when the left side settles the answer, <b>the right side
      never runs</b>.
  trace:
    - ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 먼저 접힌다 — 더 세게 묶인 쪽이다."
      en: "{{pick.2|code}} folds first — it is the more tightly bound side."
    - ko: "그다음 {{pick.1|code}}{{pick.1|josa:이,가}} {{pick.3|code}}{{pick.3|josa:과,와}} 묶는다."
      en: "Then {{pick.1|code}} joins it with {{pick.3|code}}."
    - ko: "괄호를 치면 순서가 눈에 보인다 — 뜻이 갈리는 자리에는 치는 것이 맞다."
      en: "Parentheses make the order visible — where meanings could split, add them."

rule:
  ko: "<b>변환 > 곱셈 > 덧셈 > 견주기 > &&·|| > 범위.</b> 뜻이 갈리는 자리에는 괄호를 친다."
  en: "<b>Conversion, then multiplication, addition, comparison, && and ||, then range.</b> Where meanings could split, add parentheses."
result:
  label:
    ko: "{{site.line}}행의 식"
    en: "the expression on line {{site.line}}"
  value: "{{pick.2}} {{pick.1}} {{pick.3}}"
  note:
    ko: "먼저 접히는 쪽이 정해져 있다"
    en: "which side folds first is fixed"
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:이,가}} 먼저 접히고 그다음 {{pick.1|code}}{{pick.1|josa:으로,로}} {{pick.3|code}}{{pick.3|josa:과,와}} 묶입니다."
  en: "{{pick.2|code}} folds first, and then {{pick.1|code}} joins it with {{pick.3|code}}."
payoff:
  ko: "이걸 알면 「`x as u8 + 1` 이 왜 이 값인가」와 「`0..n+1` 이 왜 n 까지 도나」가 함께 풀립니다."
  en: "This untangles both “why does `x as u8 + 1` give this value” and “why does `0..n+1` reach n.”"
bridge:
  ko: "덧셈·곱셈의 순서는 어느 언어나 같습니다. Rust 만의 자리는 `as` 와 `&` 와 `..` 셋이에요."
  en: "Addition and multiplication order is the same everywhere. Rust's own spots are `as`, `&` and `..`."
misconceptions:
  - ko: "`x as u8 + 1` 은 x 를 `u8 + 1` 로 바꾼다 — `(x as u8) + 1` 입니다. 변환이 먼저예요."
    en: "`x as u8 + 1` converts x to `u8 + 1` — it is `(x as u8) + 1`. Conversion comes first."
  - ko: "`&v[0]` 은 v 를 빌린 뒤 색인한다 — `&(v[0])` 입니다. 색인이 먼저 접히고 그 원소를 빌려요."
    en: "`&v[0]` borrows v and then indexes — it is `&(v[0])`. Indexing folds first, then that element is borrowed."
  - ko: "`a && b` 는 둘 다 계산한다 — a 가 거짓이면 b 는 <b>안 돕니다</b>. b 에 부수 효과가 있으면 안 나요."
    en: "`a && b` evaluates both — when a is false, b <b>never runs</b>. A side effect in b will not happen."

point:
  - q:
      ko: "{{site.line}}행에서 <b>나중에 묶이는 기호</b>를 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the symbol that binds later</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>먼저 접히는 쪽</b>입니다. 이미 한 덩어리라, 나중에 묶는 기호는 그 바깥에 있어요."
          en: "{{pick.2|code}} is the <b>side that folds first</b>. It is already one piece; the later symbol sits outside it."
        edge:
          h: { ko: "가장 날카로운 자리 — 안쪽이냐 바깥이냐", en: "The sharpest spot — inside or outside" }
          code:
            - "(x as u8) + 1   // 안쪽이 먼저"
            - "x as u8 + 1     // 같은 뜻"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 나중에 묶이는 <b>오른쪽 재료</b>입니다. 묶는 일은 그 앞의 기호가 해요."
          en: "{{pick.3|code}} is the <b>right-hand input</b> joined later. The joining is done by the symbol before it."
        edge:
          h: { ko: "가장 날카로운 자리 — 재료냐 기호냐", en: "The sharpest spot — the input or the symbol" }
          code:
            - "1 + 2 * 3   // 2 * 3 이 먼저"
            - "//    ^ 나중에 묶는 기호"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 왼쪽이 거짓이면 <b>오른쪽을 안 보고</b> 거짓입니다."
      en: "Choose what goes in the blank. On line {{site.line}}, a false left side <b>skips the right side</b> and yields false."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "&&", mono: true }
      - t: "||"
        mono: true
        diag:
          t:
            ko: "이건 왼쪽이 <b>참</b>이면 오른쪽을 안 봅니다. 방향이 반대예요."
            en: "That skips the right side when the left is <b>true</b>. The other way round."
          edge:
            h: { ko: "가장 날카로운 자리 — 어느 쪽에서 멈추나", en: "The sharpest spot — which value stops it" }
            code:
              - "a && b   // a 가 거짓이면 멈춤"
              - "a || b   // a 가 참이면 멈춤"
      - t: "&"
        mono: true
        diag:
          t:
            ko: "기호 하나는 <b>비트 AND</b> 라 양쪽을 다 계산합니다. 그리고 견주기보다 세서 `a & b == c` 는 `a & (b == c)` 예요."
            en: "One symbol is <b>bitwise AND</b> and evaluates both sides. It also binds tighter than comparison: `a & b == c` is `a & (b == c)`."
          edge:
            h: { ko: "가장 날카로운 자리 — 하나냐 둘이냐", en: "The sharpest spot — one or two" }
            code:
              - "a && b     // 단락 평가"
              - "a & b      // 둘 다 계산 · 비트"
      - t: "=="
        mono: true
        diag:
          t:
            ko: "이건 <b>같은지</b> 묻는 기호입니다. 양쪽을 다 보고 참·거짓 둘을 견줘요."
            en: "That asks whether two things are <b>equal</b>. It looks at both and compares two truth values."
          edge:
            h: { ko: "가장 날카로운 자리 — 묶기냐 견주기냐", en: "The sharpest spot — joining or comparing" }
            code:
              - "a && b   // 둘 다 참인가"
              - "a == b   // 둘이 같은가"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 <b>괄호 없이</b> 적었을까요?"
    en: "Why is line {{site.line}} written <b>without parentheses</b>?"
  choices:
    - t:
        ko: "세기 순서가 이미 이 뜻을 내기 때문에 — 다만 읽는 사람이 그 순서를 알아야 한다"
        en: "Because the strength order already yields this meaning — provided the reader knows the order"
      ok: true
      fb:
        ko: "그 방향입니다. 괄호를 쳤다면 어디에 쳤을지도 적어 보세요."
        en: "That is the direction. Say where the parentheses would go."
    - t:
        ko: "Rust 는 괄호를 못 쓰게 해서"
        en: "Because Rust forbids parentheses"
      ok: false
      fb:
        ko: "쓸 수 있습니다. 안 친 것은 선택이에요."
        en: "It allows them. Leaving them off is a choice."
    - t:
        ko: "괄호가 있으면 느려져서"
        en: "Because parentheses make it slower"
      ok: false
      fb:
        ko: "속도는 같습니다. 괄호는 읽는 사람을 위한 거예요."
        en: "The speed is the same. Parentheses are for the reader."

queries:
  - { grammars: [rust], file: ./operator-precedence.scm }

examples:
  - code: "fn f() { let n = x as u8 + 1; }               // (x as u8) + 1 — 변환이 먼저"
    expect: { sites: 1, form: cast-first, picks: { 1: "+", 2: "x as u8", 3: "1" } }
  - code: "fn f() { if a > 0 && b { } }                  // a > 0 이 거짓이면 b 는 안 본다"
    expect: { sites: 1, form: shortcircuit, hole: "&&", picks: { 1: "&&", 2: "a > 0", 3: "b" } }
  - code: "fn f() { for i in 0..n + 1 { } }              // 0..(n + 1) — 범위가 가장 약하다"
    expect: { sites: 1, form: range-last, picks: { 1: "..", 2: "0", 3: "n + 1" } }
  - code: "fn f() { let first = &v[0]; }                 // &(v[0])"
    expect: { sites: 1, form: ref-index, picks: { 1: "&", 2: "v", 3: "0" } }
  - code: "fn f() { let n = (1 + 2) * 3; }               // 괄호가 순서를 정했다"
    expect: none
