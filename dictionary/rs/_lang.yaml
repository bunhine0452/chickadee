lang: rs
version: 0.1.0
grammars: [rust]
# tree-sitter-rust 0.23.3 — `Language::abi_version()` 이 14 다 (`docs/plan/rust-axis.md` §1.4).
# 대조는 시험이 한다 (`declared_grammar_abi_matches_the_linked_grammar`).
grammar_abi: { rust: 14 }

# 확장자 → 문법. 인제스트가 이 표로 파일을 고른다 (03 §2.1). Rust 는 `.rs` 하나다.
extensions:
  rust: [.rs]

# 「필수 문법」 — 구멍 지도가 세는 대상이자 위상 정렬 동률 시의 순서다 (03 §6).
#
# **순서는 0부 → 1부 → 2부다** (`docs/curriculum/rs.md` §0.6). 0·1·2부를 이으면 이 목록 전량이고
# `packages/course/src/parts/rs.ts` 가 같은 순서를 든다 — 시험이 둘을 대조한다.
#
# 얇은 판 배열 규칙은 `py/_lang.yaml` 의 것과 같다 — **사용처가 얇은 판을 셋 이상 잇대지 않는다.**
# 얇음의 선은 파이썬과 다르게 잡았다: 주 표본 `ai-pm`(rs 280장) **하나에서 100곳 미만**. 둘째 표본
# `file_converter` 는 45장이라 「한쪽에서라도 100곳 미만」으로 재면 서른 중 스물여덟이 얇아 규칙이
# 아무것도 안 가른다. 수치는 2026-09-06 tree-sitter 실측(`rs.md` §12, ai-pm / file_converter 사용처):
# 얇은 것 — overflow 52/4 · float-type 48/2 · generic-bounds 75/53 · smart-pointer 45/5 ·
# trait-item 34/64 · unsafe-block 6/0. 두꺼운 것 중 작은 축 — char-and-byte 252/13 ·
# operator-precedence 777/58 · borrow-mut 324/40 · enum-item 278/85 · lifetime 204/24.
# 아래에서 얇은 여섯은 두꺼운 판 사이에 **하나씩** 놓인다 — 둘이 붙는 자리도 없다.
essential:
  # ── 0부 「이 언어의 값과 식」 열하나 (rs.md §0.1) ─────────────────────────────
  # Rust 의 0부는 감춰진 것을 드러내는 일이 아니라 **이미 드러나 있는 것을 읽는 법**이다 —
  # 폭이 타입 이름에 적혀 있고 변환이 `as` 라는 낱말로 남는다. 축 이름은 README §8.
  - rs/let-binding            # 축 G — 이름에 값 묶기. 기본이 못 바뀐다
  - rs/integer-type           # 축 A — 폭·부호가 이름에 적혀 있다 (2,885곳)
  - rs/mut-binding            # 축 G — 바꿀 수 있음을 선언 쪽에 적는다
  - rs/arithmetic             # 축 E — 정수 나눗셈은 0 쪽으로 자른다
  - rs/overflow               # 축 A · 얇다 (52/4) — 디버그 패닉 · 릴리스 감싸기
  - rs/boolean-literal        # 축 D — 조건 자리에 bool 만 온다
  - rs/float-type             # 축 B · 얇다 (48/2) — f64 는 Ord 가 아니다
  - rs/comparison             # 축 H — 타입이 같아야 견준다 (E0308)
  - rs/char-and-byte          # 축 C (252/13) — "가".len() 은 3
  - rs/cast-as                # 축 F — as 는 말없이 자른다 (457 대 12)
  - rs/operator-precedence    # 축 E (777/58) — as 가 이항 연산자보다 세다
  # ── 1부 「문과 흐름」 일곱 (rs.md §0.6) ─────────────────────────────────────
  - rs/function-item
  - rs/if-expression
  - rs/tail-expression
  - rs/string-literal
  - rs/vec
  - rs/for-in
  - rs/format-macro
  # ── 2부 「소유권과 타입」 + 심화 (rs.md §0.6 의 2부 열넷 + 3부 아홉) ────────────
  # 첫 판은 `rs/move` 이고 그 선행에 `cs/undefined-behavior` 가 걸려 있다 — 「거부 안 하면
  # 무슨 일이 나나」가 「왜 거부되나」보다 먼저다 (rs.md §0.3 · Brown 4.1 · D187 ⑰).
  # rs.md §0.6 이 3부로 적은 아홉은 여기 2부 끝에 잇는다 — 등록부의 3부는 프레임워크 사전
  # (`spring/` 같은 별도 네임스페이스)의 자리이고 Rust 에는 아직 그것이 없다 (D190 ②).
  - rs/move
  - rs/borrow-shared
  - rs/clone
  - rs/borrow-mut             # (324/40) — 읽기 빌림의 3.4%
  - rs/string-vs-str
  - rs/struct-item
  - rs/impl-method
  - rs/enum-item
  - rs/match
  - rs/option
  - rs/result
  - rs/question-mark
  - rs/module-visibility
  - rs/closure-capture
  - rs/iterator-adapters
  - rs/async-await
  - rs/trait-item             # 얇다 (34/64 · trait 선언은 3/6) — 합성이 정본
  - rs/impl-trait-for
  - rs/generic-bounds         # 얇다 (75/53) — 합성이 정본
  - rs/lifetime-annotation
  - rs/smart-pointer          # 얇다 (45/5) — 합성이 정본
  - rs/shared-thread-state
  - rs/unsafe-block           # 얇다 (6/0) — 합성이 정본

# 「AI 가 대신 쓴 것」 — 구멍 개념 ↔ 같은 일을 하는 다른 표기.
#
# `.clone()` 이 첫째다 — ai-pm 1,150곳(rust-axis §2.1). 빌림 오류를 지우는 가장 흔한 한 줄이고,
# 왜 통하는지(값이 둘이 된다) 모르면 왜 두 값이 갈라졌는지도 모른다. `return` 은 개념이 아니라
# 이 짝으로만 산다(rs.md §2) — 함수 51% 가 꼬리식으로 값을 낸다.
alternatives:
  - { gap: rs/borrow-shared, present: rs/clone, note: { ko: "빌리는 대신 복제했습니다 — 값이 둘이 됩니다", en: "Copied instead of borrowing — now there are two values" } }
  - { gap: rs/tail-expression, present: rs/return-statement, note: { ko: "마지막 식 대신 return 을 썼습니다 — 같은 값입니다", en: "return where the last expression would do — same value" } }

thin_threshold: { min_files: 2, min_sites: 3, small_repo_files: 20 }

# 「네 코드엔 없다」 — 표본에서 0곳인 판.
#
# `rs/move` 는 구문 노드가 없다(rs.md §5). 쿼리는 「이름 하나를 다른 이름에」(`let t = s;`)와
# 「이름 하나를 그대로 넘김」(`f(s)`)을 잡는데, 그 자리가 이동인지 복사인지는 타입이 정하므로
# 카드는 정답을 사용처에서 뽑지 않고 규칙으로 낸다. `rs/smart-pointer`·`rs/trait-item`·
# `rs/unsafe-block` 은 표본에 18·11·4곳 — `thin_threshold` 를 겨우 넘거나 못 넘는다. 사유는
# `packages/cards/src/t0-synthetic.ts` 의 `ABSENCE` 표에 오케스트레이터가 넣는다(rs.md §12).

diag_default:
  point:
    ko: "«{{pick}}»{{pick|josa:은,는}} {{role}} 자리입니다. {{concept}}{{concept|josa:은,는}} «{{answer}}» 입니다. {{rule}}"
    en: "«{{pick}}» is the {{role}} slot. The {{concept}} is «{{answer}}». {{rule}}"
  blank:
    ko: "«{{pick}}»{{pick|josa:은,는}} 이 자리에 오지 않습니다. {{rule}}"
    en: "«{{pick}}» does not go in this slot. {{rule}}"
