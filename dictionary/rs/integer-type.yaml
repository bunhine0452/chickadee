schema: 1
id: rs/integer-type
# 0부 축 A (`rs.md` §0.1 #3). 보편형은 README §8 의 축 1 그대로 `common/integer-literal` — 「자릿수가
# 정해져 있다」는 어느 언어의 정수에나 있는 기계이고, Rust 에서 다시 배울 것은 그 폭이 **이름에
# 적혀 있다**는 것이다. id 조각은 README §8 의 `integer-literal` 이 아니라 `rs.md` §0.1 이 못박은
# `integer-type` 을 따랐다(브리프: 문서가 다른 id 를 못박았으면 문서를 따른다).
universal: common/integer-literal
name: { ko: 정수의 폭과 부호, en: Integer width and sign }
token: "u8"
grammars: [rust]
framework: null
essential: true
difficulty: 1
prereq: [cs/bit-and-byte, cs/binary-representation]
confusions: []

dict:
  one_liner:
    ko: "정수 타입 이름에 칸 수와 부호가 적혀 있다. 폭이 다르면 같은 정수도 다른 타입이다."
    en: "A whole-number type names its slot count and sign; other widths are other types."
  why:
    ko: >-
      C 에서 `int` 의 폭은 컴퓨터마다 달라 `sizeof` 로 물어야 하고, 파이썬에는 폭이 없습니다. Rust 는
      {{site.line}}행의 {{pick.1|code}} 처럼 <b>이름에 적어 둡니다</b> — 앞 글자가 부호(있음·없음), 뒤
      숫자가 칸 수예요. 둘 중 하나만 달라도 <b>다른 타입</b>이라 셈이 안 됩니다(E0308). 그중 숫자가 안
      붙은 둘이 길이·색인 자리의 타입이고, 그 폭은 이 컴퓨터의 주소 폭입니다. 그래서
      <code>v.len()</code> 과 <code>i32</code> 를 그냥 더하면 막혀요.
    en: >-
      In C the width of `int` depends on the machine and you ask `sizeof`; Python has no width at all.
      Rust <b>writes it into the name</b>, like {{pick.1|code}} on line {{site.line}} — the first letter
      is the sign (with or without), the number is the slot count. Change either and it is a
      <b>different type</b>, so arithmetic refuses (E0308). The two names with no number are the types of
      lengths and indexes, as wide as this machine's addresses — which is why adding <code>v.len()</code>
      to an <code>i32</code> is blocked.
  trace:
    - ko: "{{site.line}}행이 {{pick.2|code}}{{pick.2|josa:을,를}} 세운다."
      en: "Line {{site.line}} sets up {{pick.2|code}}."
    - ko: "{{pick.1|code}}{{pick.1|josa:이,가}} 칸 수와 부호를 정한다 — 기계가 아니라 이름이."
      en: "{{pick.1|code}} fixes the slot count and the sign — the name does, not the machine."
    - ko: "폭이 다른 정수와 만나면 셈이 막힌다(E0308)."
      en: "Meet an integer of another width and the arithmetic is blocked (E0308)."

rule:
  ko: "<b>폭과 부호는 이름에 있다.</b> 이름이 다르면 타입이 다르고, 다른 타입끼리는 셈하지 않는다."
  en: "<b>Width and sign live in the name.</b> Different names are different types, and different types do not mix."
result:
  label:
    ko: "{{site.line}}행의 {{pick.2}}"
    en: "{{pick.2}} on line {{site.line}}"
  value: "{{pick.1}}"
  note:
    ko: "칸 수와 부호가 여기 적혀 있다"
    en: "slot count and sign are written here"
ok:
  ko: "{{pick.2|code}}{{pick.2|josa:은,는}} {{pick.1|code}} 만큼의 칸을 가진 정수입니다."
  en: "{{pick.2|code}} is a whole number with as many slots as {{pick.1|code}} says."
payoff:
  ko: "이걸 알면 「길이와 카운터를 더했는데 왜 막히나」(E0308)가 풀립니다 — 둘의 이름이 다른 겁니다."
  en: "This untangles “why is adding a length to a counter blocked” (E0308) — the two names differ."
bridge:
  ko: "자바는 `int` 하나가 늘 32칸이고 파이썬은 칸이 없습니다. Rust 는 열둘 중 하나를 고르게 합니다."
  en: "Java's `int` is always 32 slots and Python has none. Rust makes you pick one of twelve."
misconceptions:
  - ko: "길이 타입은 「그냥 정수」다 — 포인터 폭이고 길이·색인 자리에만 쓰입니다. `i32` 와 못 더해요."
    en: "The length type is “just an integer” — it is pointer-wide and used for lengths and indexes only. It does not add to an `i32`."
  - ko: "부호 없는 타입에 음수를 넣으면 0 이 된다 — 컴파일이 멈춥니다(E0600). 실행 중에 0 아래로 내려가면 넘침이에요."
    en: "A negative into an unsigned type becomes 0 — compiling stops (E0600). Going below 0 at run time is overflow."
  - ko: "타입을 안 적으면 폭이 없다 — 추론으로 정해질 뿐이고, 못 정하면 `i32` 로 잡습니다."
    en: "No annotation means no width — inference picks one, and `i32` when nothing decides."

point:
  - q:
      ko: "{{site.line}}행에서 <b>칸 수와 부호를 정하는 이름</b>을 짚어 보세요."
      en: "On line {{site.line}}, point at <b>the name that fixes the slot count and the sign</b>."
    hint:
      ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다."
      en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose."
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: "{{pick.2|code}}{{pick.2|josa:은,는}} <b>이름</b>입니다. 이름은 칸 수를 안 바꿔요 — 폭은 그 옆의 타입이 정합니다."
          en: "{{pick.2|code}} is <b>the name</b>. A name does not change the slot count — the type beside it does."
        edge:
          h: { ko: "가장 날카로운 자리 — 이름이냐 타입이냐", en: "The sharpest spot — the name or the type" }
          code:
            - "let n: u8 = 1;    // 8칸"
            - "let n: u64 = 1;   // 같은 이름, 64칸"
      pick.3:
        t:
          ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 처음 들어가는 <b>값</b>입니다. 값이 작아도 칸은 타입이 정한 만큼 잡혀요."
          en: "{{pick.3|code}} is the starting <b>value</b>. A small value still gets every slot the type asks for."
        edge:
          h: { ko: "가장 날카로운 자리 — 값이냐 칸이냐", en: "The sharpest spot — the value or the slots" }
          code:
            - "let n: u8 = 1;    // 8칸을 쓴다"
            - "let n: u64 = 1;   // 64칸을 쓴다"

blank:
  - q:
      ko: "빈칸에 들어갈 것을 고르세요. {{site.line}}행은 <b>길이·색인에 쓰는 정수</b> 이름을 세웁니다."
      en: "Choose what goes in the blank. Line {{site.line}} sets up a whole number <b>used for lengths and indexes</b>."
    hint:
      ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다."
      en: "Your choice is written into the code at once. Submit to have it marked."
    options:
      - { t: "usize", mono: true }
      - t: "i32"
        mono: true
        diag:
          t:
            ko: "이건 <b>부호 있는 32칸</b>입니다. 길이는 음수가 될 수 없고 폭도 주소 폭이라, 이 타입으로는 `len()` 과 못 견줍니다."
            en: "That is <b>signed, 32 slots</b>. A length is never negative and is address-wide, so this type cannot be compared with `len()`."
          edge:
            h: { ko: "가장 날카로운 자리 — 길이의 타입", en: "The sharpest spot — the type of a length" }
            code:
              - "let n: usize = v.len();   // 된다"
              - "let n: i32 = v.len();     // E0308"
      - t: "u8"
        mono: true
        diag:
          t:
            ko: "이건 <b>8칸</b>이라 255 까지만 담습니다. 길이가 256 을 넘는 순간 넘칩니다."
            en: "That is <b>8 slots</b>, so it holds up to 255. A length past 256 overflows."
          edge:
            h: { ko: "가장 날카로운 자리 — 칸이 모자란다", en: "The sharpest spot — too few slots" }
            code:
              - "let n: u8 = 255;    // 끝"
              - "let n: usize = 256; // 넉넉하다"
      - t: "f64"
        mono: true
        diag:
          t:
            ko: "이건 <b>실수</b>입니다. 소수를 담고 근사값이라 색인으로 못 씁니다."
            en: "That is a <b>decimal</b>. It holds fractions and approximations, so it cannot index."
          edge:
            h: { ko: "가장 날카로운 자리 — 정수냐 실수냐", en: "The sharpest spot — whole or decimal" }
            code:
              - "v[0]      // 색인은 정수"
              - "v[0.0]    // E0277"

why_gate:
  q:
    ko: "{{site.line}}행은 왜 폭을 <b>이름에</b> 적을까요?"
    en: "Why does line {{site.line}} write the width <b>into the name</b>?"
  choices:
    - t:
        ko: "칸이 모자라는 셈을 컴파일러가 이름만 보고 막게 하려고 — 기계를 몰라도 폭이 보인다"
        en: "So the compiler can block a too-narrow operation from the name alone — the width shows without knowing the machine"
      ok: true
      fb:
        ko: "그 방향입니다. 이 함수에서 폭이 다른 정수가 만나는 줄이 있는지 찾아보세요."
        en: "That is the direction. Look for a line in this function where two widths meet."
    - t:
        ko: "짧게 적으려고"
        en: "To keep it short"
      ok: false
      fb:
        ko: "길이 문제가 아닙니다. 이름이 곧 칸 수라는 것이 요점이에요."
        en: "It is not about length. The point is that the name is the slot count."
    - t:
        ko: "Rust 에 `int` 가 없어서"
        en: "Because Rust has no `int`"
      ok: false
      fb:
        ko: "없는 것은 결과입니다. 폭을 이름에 적기로 했기 때문에 `int` 하나로는 부족해진 거예요."
        en: "That absence is the consequence. Because widths go into names, one `int` could not do."

queries:
  - { grammars: [rust], file: ./integer-type.scm }

examples:
  - code: "fn f() { let total: usize = 0; }              // total -> 0 (usize, 주소 폭)"
    expect: { sites: 1, form: int-let, hole: "usize", picks: { 1: "usize", 2: "total", 3: "0" } }
  - code: "fn count(n: u8) -> usize { n as usize }       // n 은 8칸, 돌려주는 것은 주소 폭"
    expect: { sites: 2, form: int-return, picks: { 1: "usize", 2: "count", 3: "(n: u8)" } }
  - code: "struct Pos { line: u32 }                     // line -> 32칸, 부호 없음"
    expect: { sites: 1, form: int-field, picks: { 1: "u32", 2: "line" } }
  - code: "fn f() { let b = 300u32; }                    // 리터럴에 폭을 적은 자리"
    expect: { sites: 1, form: int-suffix, picks: { 1: "300u32" } }
  - code: "fn f() { let x: f64 = 1.0; }                  // 실수 — rs/float-type"
    expect: none
