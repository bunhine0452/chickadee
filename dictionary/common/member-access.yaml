schema: 1
id: common/member-access
universal: null
name: { ko: 안의 이름 꺼내기, en: Member access }
token: null
grammars: []
essential: false
difficulty: 1
prereq: []
confusions: []
dict:
  one_liner: "값 하나에 담긴 여러 정보 중 이름을 하나 골라 꺼낸다."
  why: >-
    관련된 값을 묶어 두면 이름 하나로 들고 다닐 수 있습니다. 꺼낼 때 쓰는 기호는 거의 모든
    언어에서 점이고, 갈리는 지점은 둘입니다 — <b>없는 이름을 꺼내면 무엇이 나오는가</b>,
    그리고 <b>담긴 값 자체가 없을 때 어떻게 되는가</b>.
  trace: []
rule: "왼쪽이 없으면 대개 그 자리에서 멈추고, 오른쪽 이름이 없으면 「없음」이 나온다."
ok: "점은 값 안으로 한 칸 들어가 이름 하나를 골라 꺼냅니다."
misconceptions:
  - "「없음」이 나온 것과 그 줄이 멈춘 것은 같다 — 다릅니다. 멈추는 것은 대개 그다음 점이에요."
