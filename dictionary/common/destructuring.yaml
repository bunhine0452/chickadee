queries: []
dict:
  one_liner:
    ko: "묶음에서 필요한 것만 꺼내 그 자리에서 이름을 붙이는 표기."
    en: "Takes only what you need out of a group and names it on the spot."
  why:
    ko: >-
      꺼내는 열쇠가 <b>자리</b>냐 <b>이름</b>이냐로 갈립니다. 줄지어 있는 값은 자리로 꺼내고,
      이름표가 붙은 값은 이름으로 꺼냅니다. 한 줄에 이름이 몇 개 생기는지가 그대로 보이는 것이
      이 표기의 값어치예요.
    en: >-
      What splits the two forms is whether the key is a <b>position</b> or a <b>name</b>. Values in
      a row come out by position; values with labels come out by name. What this notation buys you
      is that one line shows exactly how many names it creates.
  trace: []
rule:
  ko: "줄지어 있으면 자리로, 이름표가 있으면 이름으로 꺼낸다."
  en: "In a row, take it by position. Labelled, take it by name."
ok:
  ko: "묶음을 한 번만 읽고, 꺼낸 값마다 그 자리에서 이름이 생깁니다."
  en: "The group is read once, and every value taken out gets a name right there."
misconceptions:
  - ko: "원본이 나뉜다 — 아니요. 읽어서 이름을 붙일 뿐 원본은 그대로입니다."
    en: "The original is taken apart — no. It is read and named; the original stays as it was."
  - ko: "없는 자리를 꺼내면 곧바로 멈춘다 — 대개 「없음」이 담기고 계속 갑니다."
    en: >-
      Taking a position that is not there stops it at once — usually the name just holds absent and
      it carries on.
