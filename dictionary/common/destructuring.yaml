universal: null
name: { ko: 한 번에 꺼내 이름 붙이기, en: Destructuring }
token: null
grammars: []
essential: false
difficulty: 2
prereq: []
confusions: []
queries: []
dict:
  one_liner: "묶음에서 필요한 것만 꺼내 그 자리에서 이름을 붙이는 표기."
  why: >-
    꺼내는 열쇠가 <b>자리</b>냐 <b>이름</b>이냐로 갈립니다. 줄지어 있는 값은 자리로 꺼내고,
    이름표가 붙은 값은 이름으로 꺼냅니다. 한 줄에 이름이 몇 개 생기는지가 그대로 보이는 것이
    이 표기의 값어치예요.
  trace: []
rule: "줄지어 있으면 자리로, 이름표가 있으면 이름으로 꺼낸다."
ok: "묶음을 한 번만 읽고, 꺼낸 값마다 그 자리에서 이름이 생깁니다."
misconceptions:
  - "원본이 나뉜다 — 아니요. 읽어서 이름을 붙일 뿐 원본은 그대로입니다."
  - "없는 자리를 꺼내면 곧바로 멈춘다 — 대개 「없음」이 담기고 계속 갑니다."
