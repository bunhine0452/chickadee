schema: 1
id: common/filter-select
universal: null
name: { ko: "조건으로 골라내기", en: "Filter / select" }
token: null
grammars: []
essential: false
difficulty: 2
prereq: []
confusions: []
dict:
  one_liner:
    ko: "조건이 참인 항목만 남긴 <b>새 묶음</b>을 만드는 표기. 개수가 줄 수 있다."
    en: "Builds a <b>new group</b> of only the items the condition keeps. The count can shrink."
  why:
    ko: >-
      「끝난 것만」 「내 것만」 은 어느 언어에나 있습니다. 원본을 지우는 대신 골라낸 새 묶음을 만들면
      되돌리기가 공짜예요. 언어마다 이름만 다릅니다.
    en: >-
      “Only the finished ones”, “only mine” — every language has this. Build a new group out of what
      you picked instead of deleting from the original, and undo costs nothing. Only the name
      differs by language.
  trace: []
rule:
  ko: "값은 그대로, 개수만 준다. 참인 것이 남는다."
  en: "Values stay as they are; only the count drops. What is true remains."
ok:
  ko: "조건을 통과한 항목만 모아 새 묶음을 냅니다. 하나도 통과하지 못하면 빈 묶음입니다."
  en: >-
    It gathers the items that passed the condition into a new group. If none pass, the group is
    empty.
misconceptions:
  - ko: "골라내면서 값도 바꿔 준다 — 남길지 말지만 고릅니다."
    en: "It changes the values while selecting — it only chooses whether to keep them."
