schema: 1
id: common/function-definition
universal: null
name: { ko: 함수 정의하기, en: Defining a function }
token: null
grammars: []
essential: false
difficulty: 1
prereq: []
confusions: []
queries: []
dict:
  one_liner:
    ko: "줄 몇 개에 이름을 붙여 두고, 필요할 때마다 그 이름으로 부른다."
    en: "Gives a name to a few lines so they can be called by that name later."
  why:
    ko: >-
      정의는 <b>실행이 아닙니다.</b> 여기서는 「이런 일을 하는 것을 이렇게 부르기로 한다」고
      적어 두기만 하고, 안의 줄은 누가 부를 때까지 한 번도 돌지 않습니다.
    en: >-
      Defining is <b>not running.</b> Here you only write down “work of this shape goes by this
      name”; not one line inside runs until something calls it.
  trace: []
rule:
  ko: "정의한 자리에서는 돌지 않는다. 부른 자리에서 돈다."
  en: "It does not run where it is defined. It runs where it is called."
ok:
  ko: "이 줄은 이름만 만들어 둡니다. 안의 줄은 부를 때 돕니다."
  en: "This line only makes the name. The lines inside run when it is called."
misconceptions:
  - ko: "정의하면 그 자리에서 한 번 돈다 — 아니요. 부르기 전에는 돌지 않습니다."
    en: "Defining runs it once there — no. Nothing runs before a call."
  - ko: "받는 값의 이름은 바깥과 같아야 한다 — 안에서만 쓰는 이름이라 달라도 됩니다."
    en: "The names it takes must match the outside — they are inside-only, so they need not."
