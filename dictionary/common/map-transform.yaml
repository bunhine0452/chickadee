id: common/map-transform
universal: null
name: { ko: "항목마다 바꿔 새로 만들기", en: "Map / transform" }
token: null
grammars: []
essential: false
difficulty: 2
prereq: []
confusions: []
dict:
  one_liner: "항목마다 같은 규칙을 적용해 <b>같은 개수의 새 묶음</b>을 만드는 표기."
  why: >-
    이름은 언어마다 다릅니다 — <code>map</code>, 컴프리헨션, <code>Select</code>. 하는 일은 하나예요:
    원본을 두고 항목마다 바꾼 값을 모아 새 묶음을 냅니다. 이걸 아는 사람은 새 언어에서 <b>표기만</b>
    배우면 됩니다.
  trace: []
rule: "개수는 그대로, 값만 바뀐다. 원본은 건드리지 않는다."
ok: "항목마다 규칙을 적용한 결과를 모아 같은 길이의 새 묶음을 냅니다."
misconceptions:
  - "원본이 함께 바뀐다 — 아니요. 새 묶음이 따로 생깁니다."
