dict:
  one_liner: "터질 수 있는 구간을 표시해 두고, 터지면 <b>옆으로 빠져</b> 흐름을 잇는 표기."
  why: >-
    예외는 그 자리에서 남은 줄을 건너뛰게 만듭니다. 받는 곳이 있으면 거기서 멈추고, 없으면 계속
    위로 올라가 결국 프로그램을 세워요. 이 규칙은 언어를 가리지 않습니다.
  trace: []
rule: "터진 자리에서 남은 줄은 건너뛴다. 받는 곳이 없으면 위로 올라간다."
ok: "표시한 구간에서 예외가 나면 남은 줄을 건너뛰고 받는 곳으로 갑니다."
misconceptions:
  - "받고 나면 건너뛴 줄로 되돌아온다 — 되돌아오지 않습니다."
