schema: 1
id: common/text-literal
universal: null
name: { ko: 글자 값, en: "Text value" }
token: null
grammars: []
essential: false
difficulty: 1
prereq: []
confusions: []
dict:
  one_liner:
    ko: "따옴표 안은 계산하지 않는다. 적힌 글자가 곧 값이다."
    en: "Nothing inside the quotes is evaluated. The characters written are the value."
  why:
    ko: >-
      프로그램은 적힌 낱말을 기본적으로 <b>이름</b>으로 읽습니다. 따옴표는 「여기서부터 여기까지는
      이름이 아니라 글자」라고 표시하는 울타리예요. 어느 언어에서나 이 울타리가 있고, 다른 것은
      울타리로 무엇을 쓰는지와 안에서 값을 끼워 넣을 수 있는지뿐입니다.
    en: >-
      A program reads a written word as <b>a name</b> by default. Quotes are the fence that says
      “from here to here this is text, not a name”. Every language has this fence; what differs is
      what it uses for the fence and whether values can be slipped in inside it.
  trace: []
rule:
  ko: "따옴표 안은 글자, 밖은 이름이다."
  en: "Inside the quotes is text; outside is a name."
ok:
  ko: "따옴표로 감싼 것은 프로그램이 찾아 나서지 않고 적힌 그대로 값이 됩니다."
  en: "What the quotes wrap is not looked up; it becomes the value exactly as written."
misconceptions:
  - ko: "따옴표 안에 이름을 적으면 그 값이 들어간다 — 그러려면 언어마다 정해진 끼워 넣기 표기가 따로 있습니다."
    en: >-
      Write a name inside the quotes and its value goes in — for that, each language has its own
      interpolation notation.
