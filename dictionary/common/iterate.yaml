schema: 1
id: common/iterate
universal: null
name: { ko: "하나씩 훑기", en: "Iterate" }
token: null
grammars: []
essential: false
difficulty: 2
prereq: []
confusions: []
dict:
  one_liner:
    ko: "묶음의 항목을 앞에서부터 하나씩 꺼내 같은 일을 되풀이하는 표기."
    en: "Takes items from the front of a group one at a time and repeats the same work."
  why:
    ko: >-
      결과를 모으지 않고 <b>시키기만</b> 하는 반복입니다. 반복문으로 쓰든 콜백으로 쓰든 뜻은 같고,
      갈리는 것은 중간에 멈출 수 있는지와 기다릴 수 있는지예요.
    en: >-
      A repetition that <b>only does</b>, without collecting a result. Written as a loop or as a
      callback it means the same; what differs is whether you can stop partway and whether you can
      wait.
  trace: []
rule:
  ko: "값을 모으지 않는 반복이다. 결과가 필요하면 다른 표기를 쓴다."
  en: "A repetition that collects no value. If you need a result, use another notation."
ok:
  ko: "항목마다 같은 일을 한 번씩 하고, 줄 자체는 값을 남기지 않습니다."
  en: "It does the same work once per item, and the line itself leaves no value."
misconceptions:
  - ko: "훑기만 해도 새 묶음이 생긴다 — 생기지 않습니다."
    en: "Just walking it produces a new group — it does not."
