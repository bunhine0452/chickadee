schema: 1
id: common/function-value
universal: null
name: { ko: 값으로서의 함수, en: Function as a value }
token: null
grammars: []
essential: false
difficulty: 2
prereq: []
confusions: []
dict:
  one_liner: "함수를 값처럼 넘기고, 받은 쪽이 원하는 때에 부른다."
  why: >-
    함수를 값으로 다룰 수 있으면 「무엇을 할지」 자체를 인자로 넘길 수 있습니다. 목록을 훑는
    도구, 버튼을 누를 때 할 일, 응답이 온 뒤에 할 일 — 전부 이 하나 위에 서 있어요. 표기는
    언어마다 다르지만(화살표, 람다, 블록), 「만드는 시점과 도는 시점이 다르다」는 점은 같습니다.
  trace: []
rule: "함수를 만드는 줄에서는 몸체가 계산되지 않는다. 부를 때 계산된다."
ok: "함수를 값으로 두면 부르는 때를 다른 코드가 정할 수 있습니다."
misconceptions:
  - "만든 자리에서 곧바로 한 번 돈다 — 아니요. 만들기만 합니다."
