# 참·거짓 값 자체와 「참으로 쳐지는 것」은 다른 축이다 — 섞이면 `if []` 가 왜 안 들어가는지가 안 풀린다.
confusions: [common/boolean-value]
queries: []
dict:
  one_liner:
    ko: "갈림길에 참·거짓이 아닌 값이 오면 언어가 대신 판정한다."
    en: "When a fork gets a value that is not true or false, the language judges for you."
  why:
    ko: >-
      갈림길은 참·거짓 하나를 원하는데, 대부분의 언어는 <b>아무 값이나</b> 받고 그 자리에서
      한쪽으로 접습니다. 그 접는 규칙이 <b>언어마다 다릅니다</b> —
      파이썬은 <code>if []</code> 에서 안 들어가고(빈 목록이 거짓),
      자바스크립트는 <code>if ("")</code> 에서 안 들어가지만 <code>if ([])</code> 에서는
      <b>들어갑니다</b>(빈 배열이 참). 자바는 아예 안 받고 <b>컴파일이 멈춥니다</b> —
      「<code>int</code> 를 <code>boolean</code> 으로 바꿀 수 없다」.
      이것은 기계의 성질이 아니라 <b>언어가 고른 규칙</b>이에요. 그래서 같은 코드가 언어를
      옮기면 조용히 반대로 돕니다.
    en: >-
      A fork wants one true-or-false, but most languages accept <b>any value</b> and fold it to one
      side on the spot. <b>The folding rule differs by language.</b> Python does not enter
      <code>if []</code> — an empty list is false — while JavaScript does not enter
      <code>if ("")</code> yet <b>does</b> enter <code>if ([])</code>, because an empty array is
      truthy. Java refuses the value outright and <b>stops at compile time</b>: "int cannot be
      converted to boolean." This is not a property of the machine but <b>a rule the language
      chose</b>, which is why the same code can quietly reverse when it moves languages.
  trace: []
rule:
  ko: "<b>「비어 있으면 거짓」은 언어가 정한 규칙이지 기계의 성질이 아니다.</b>"
  en: "<b>“Empty means false” is a rule the language chose, not a property of the machine.</b>"
ok:
  ko: >-
    갈림길에 값을 그냥 놓으면 그 언어의 접는 규칙이 걸립니다. 옮겨 갈 언어를 모르면 무엇과
    견주는지를 적어 두는 편이 안전해요.
  en: >-
    Putting a bare value in a fork invokes that language's folding rule. When the target language is
    uncertain, writing what you compare against is the safer choice.
misconceptions:
  - ko: "빈 것은 어디서나 거짓이다 — 자바스크립트에서 빈 배열과 빈 객체는 참입니다."
    en: "Empty is false everywhere — in JavaScript an empty array and an empty object are truthy."
  - ko: "0 은 어디서나 거짓이다 — 루비·스위프트에서는 0 도 참이거나 아예 못 놓습니다."
    en: "Zero is false everywhere — in Ruby it is truthy, and Swift will not take it at all."
  - ko: >-
      그래서 <code>x == True</code> 로 적어야 안전하다 — 오히려 반대입니다. 사용자 파이썬 리포
      셋에서 그 표기는 0곳이고 <code>if x:</code> 가 785곳입니다.
    en: >-
      So writing <code>x == True</code> is safer — the opposite holds. Across three sample Python
      repositories that spelling appears 0 times and <code>if x:</code> appears 785 times.
meaning:
  - q:
      ko: "파이썬에서 <code>if []:</code> 는 안 들어가는데 자바스크립트에서 <code>if ([])</code> 는 들어갑니다. <b>왜 갈릴까요?</b>"
      en: "Python skips <code>if []:</code> but JavaScript enters <code>if ([])</code>. <b>Why do they split?</b>"
    hint:
      ko: "빈 목록이 무엇으로 접히는지를 누가 정하나요."
      en: "Who decides what an empty list folds into?"
    options:
      - t:
          ko: "빈 값을 어느 쪽으로 접을지를 언어가 각자 정해 두었다"
          en: "Each language decided for itself which way an empty value folds"
      - t:
          ko: "빈 목록이 메모리에서 다르게 담겨서"
          en: "An empty list is stored differently in memory"
        diag:
          t:
            ko: "담기는 모양은 둘 다 <b>비어 있는 목록</b>입니다. 갈리는 것은 그 뒤의 판정 규칙이에요."
            en: "Both hold <b>an empty list</b>. What splits is the judging rule applied afterwards."
          edge:
            h: { ko: "가장 날카로운 자리 — 담긴 값이냐 판정이냐", en: "The sharpest spot — the value or the judgement" }
            code:
              - "파이썬:      len([]) == 0"
              - "자바스크립트: [].length === 0   — 값은 같다"
      - t:
          ko: "자바스크립트에는 참·거짓 종류가 없어서"
          en: "JavaScript has no true-or-false kind"
        diag:
          t:
            ko: "<code>true</code> 와 <code>false</code> 가 있습니다. 없는 것은 종류가 아니라 <b>빈 것을 거짓으로 치는 규칙</b>이에요."
            en: >-
              It has <code>true</code> and <code>false</code>. What it lacks is not the kind but
              <b>the rule that empty counts as false</b>.
          edge:
            h: { ko: "가장 날카로운 자리 — 종류냐 규칙이냐", en: "The sharpest spot — the kind or the rule" }
            code:
              - "typeof true  → 'boolean'"
              - "Boolean([])  → true"
      - t:
          ko: "파이썬이 목록의 길이를 대신 봐 주는 것이고 원래는 둘 다 참이다"
          en: "Python peeks at the length; really both are true"
        diag:
          t:
            ko: >-
              파이썬은 길이를 <b>규칙으로</b> 씁니다 — 「비면 거짓」이 그 언어의 정의예요.
              「원래」가 따로 있는 것이 아니라 언어마다 정의가 다릅니다.
            en: >-
              Python uses length <b>as the rule</b> — "empty is false" is that language's definition.
              There is no underlying "really"; the definition differs per language.
          edge:
            h: { ko: "가장 날카로운 자리 — 원래냐 정의냐", en: "The sharpest spot — an underlying truth or a definition" }
            code:
              - "파이썬:  bool([])  → False"
              - "자바:    if (list) → 컴파일이 멈춘다"
