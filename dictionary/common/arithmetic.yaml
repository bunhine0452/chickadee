dict:
  one_liner:
    ko: "값 둘로 새 값 하나를 셈해서 만든다. 넣어 준 값은 그대로다."
    en: "Two values compute one new value. The values you fed in are untouched."
  why:
    ko: >-
      셈은 값을 <b>고치는</b> 것이 아니라 <b>새로 만드는</b> 것입니다. 그래서 결과를 어딘가에
      담지 않으면 그 자리에서 사라져요.
    en: >-
      Computing does not <b>change</b> a value, it <b>makes a new one</b>. So unless the result is
      put somewhere, it is gone the moment it appears.
  trace: []
rule:
  ko: "양쪽을 먼저 값으로 만들고, 그 둘로 새 값 하나를 만든다."
  en: "Both sides become values first, then those two make one new value."
ok:
  ko: "결과는 새 값이고, 넣어 준 값 둘은 그대로 남습니다."
  en: "The result is a new value; the two you fed in are left as they were."
misconceptions:
  - ko: "왼쪽 값이 결과로 바뀐다 — 아니요. 새 값이 따로 생깁니다."
    en: "The left value turns into the result — no. A separate new value appears."
  - ko: "글자에도 같은 뜻이다 — 글자끼리는 이어 붙는 쪽이 됩니다."
    en: "It means the same for text — with text, joining happens instead."
