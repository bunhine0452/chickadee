schema: 1
id: common/number-literal
universal: null
name: { ko: 숫자 값, en: "Number value" }
token: null
grammars: []
essential: false
difficulty: 1
prereq: []
confusions: []
dict:
  one_liner:
    ko: "따옴표 없이 적은 값. 곧바로 셈에 쓸 수 있다."
    en: "A value written without quotes. It can go straight into arithmetic."
  why:
    ko: >-
      화면에 보이는 <code>42</code> 와 셈에 쓰는 <code>42</code> 는 프로그램 안에서 다른 값입니다.
      따옴표가 그 둘을 가르고, 어느 쪽인지에 따라 <code>+</code> 가 더하기가 되기도 이어 붙이기가
      되기도 해요. 입력칸이나 파일에서 온 값은 대개 글자라서, 셈하기 전에 숫자로 바꿔야 합니다.
    en: >-
      The <code>42</code> shown on screen and the <code>42</code> used in arithmetic are different
      values inside the program. The quotes are what separate them, and which one it is decides
      whether <code>+</code> adds or joins. A value that came from an input box or a file is usually
      text, so it has to be turned into a number before you count with it.
  trace: []
rule:
  ko: "셈이 이상하면 먼저 양쪽이 정말 숫자인지 본다."
  en: "When arithmetic looks odd, first check that both sides really are numbers."
ok:
  ko: "따옴표 없이 적힌 숫자는 다른 숫자와 곧바로 셈할 수 있는 값입니다."
  en: "A number written without quotes is a value you can compute with directly."
misconceptions:
  - ko: "화면에 숫자로 보이면 숫자다 — 입력칸에서 온 값은 대개 글자입니다."
    en: >-
      If it looks like a number on screen it is a number — a value from an input box is usually
      text.
