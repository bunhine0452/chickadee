schema: 1
id: go/for-loop
# 1부 (`go.md` §2 ⑥). 반복 낱말이 **하나뿐**이다.
#
# 쿼리는 세 칸짜리와 조건만 있는 것을 잡고, 몸통만 있는 `for {}` 는 안 잡는다 —
# 셋이 같은 노드라 앵커로 못 가르고, 잡으면 앞의 둘과 사이트가 겹친다.
# 실측 42곳/27파일 — **얇다**. 자리를 `go/range-loop`(702곳/196파일)가 가져갔고,
# 그 어긋남이 `_lang.yaml` 의 `alternatives` 한 줄이다.
universal: common/loop-while
name: { ko: "되풀이하기", en: "Looping" }
token: "for"
grammars: [go]
framework: null
essential: true
difficulty: 2
prereq: [go/short-var-decl, go/equality]
confusions: []

dict:
  one_liner:
    ko: >-
      되풀이 낱말이 하나뿐이다. 세 칸을 다 적을 수도, 조건만 적을 수도 있다.
    en: >-
      There is one looping word: write all three slots, or write only the test.
  why:
    ko: >-
      다른 언어들은 되풀이 낱말이 둘 이상입니다. Go 에는 <b>하나</b>뿐이고, 뒤에 무엇을 적느냐로 모양이 갈려요. 세 칸(<code>시작; 계속할 조건; 한 바퀴 끝에
      할 일</code>)을 다 적으면 세 칸짜리 되풀이가 되고, 조건만 적으면 다른 언어의 <code>while</code> 이 되고, 아무것도 안 적으면 무한 되풀이가
      됩니다. {{site.line}}행에서 {{pick.2|code}}{{pick.2|josa:은,는}} 딱 한 번 돌고,
      {{pick.3|code}}{{pick.3|josa:을,를}} 볼 때마다 참이면 {{pick.5|code}} 한 바퀴가 돌고, 한 바퀴가 끝날 때마다
      {{pick.4|code}}{{pick.4|josa:이,가}} 돕니다. <b>조건은 매 바퀴 시작에 봅니다</b> — 처음부터 거짓이면 몸통은 한 번도 안 돌아요.
    en: >-
      Other languages have two or more looping words. Go has <b>one</b>, and what follows it decides
      the shape. Write all three slots (<code>start; test to keep going; step at the end of a
      lap</code>) and it counts; write only the test and it is what other languages call
      <code>while</code>; write nothing and it never stops. On line {{site.line}}, {{pick.2|code}}
      runs exactly once, {{pick.3|code}} is read before each lap and while it holds {{pick.5|code}}
      runs, and {{pick.4|code}} runs at the end of every lap. <b>The test is read at the start of each
      lap</b> — false from the outset and the body never runs.
  trace:
    - ko: >-
        {{site.line}}행의 {{pick.2|code}}{{pick.2|josa:이,가}} 딱 한 번 돈다.
      en: >-
        The {{pick.2|code}} on line {{site.line}} runs exactly once.
    - ko: >-
        {{pick.3|code}}{{pick.3|josa:을,를}} 보고 참이면 {{pick.5|code}} 한 바퀴가 돈다.
      en: >-
        {{pick.3|code}} is read, and while it holds {{pick.5|code}} runs a lap.
    - ko: >-
        한 바퀴가 끝날 때마다 {{pick.4|code}}{{pick.4|josa:이,가}} 돌고 다시 조건으로 간다.
      en: >-
        At the end of each lap {{pick.4|code}} runs and it goes back to the test.

rule:
  ko: >-
    <b>조건은 매 바퀴 시작에 본다.</b> 처음부터 거짓이면 몸통은 한 번도 안 돈다.
  en: >-
    <b>The test is read at the start of every lap.</b> False from the outset means the body never
    runs.
result:
  label: { ko: "{{site.line}}행의 되풀이", en: "the loop on line {{site.line}}" }
  value: "{{pick.3}}"
  note: { ko: "이 조건이 참인 동안 돈다", en: "it runs while this test holds" }
ok:
  ko: >-
    {{pick.2|code}}{{pick.2|josa:이,가}} 한 번, 그다음부터는 {{pick.3|code}}{{pick.3|josa:이,가}} 참인 동안
    {{pick.5|code}}{{pick.5|josa:과,와}} {{pick.4|code}}{{pick.4|josa:이,가}} 번갈아 돕니다.
  en: >-
    {{pick.2|code}} once, then while {{pick.3|code}} holds, {{pick.5|code}} and {{pick.4|code}} take
    turns.
payoff:
  ko: >-
    이걸 알면 「무한 반복」이 어디서 나는지가 보입니다 — 매 바퀴 달라지는 것이 조건과 안 맞물리면 끝나지 않아요.
  en: >-
    This shows where an endless loop comes from — when what changes each lap never meets the test,
    it does not end.
bridge:
  ko: >-
    파이썬·자바스크립트는 되풀이 낱말이 둘 이상이라 어느 것을 쓸지부터 고릅니다. Go 는 고를 것이 없고 뒤에 무엇을 적을지만 정해요.
  en: >-
    Python and JavaScript have two or more looping words, so the first choice is which one. Go has
    nothing to choose — only what to write after it.
misconceptions:
  - ko: >-
      가운데 칸이 「몇 번 돌지」다 — <b>계속할 조건</b>입니다. 참인 동안 도는 것이지 횟수가 아니에요.
    en: >-
      The middle slot is "how many times" — it is <b>the test to keep going</b>, not a count.
  - ko: >-
      마지막 칸은 몸통보다 먼저 돈다 — 한 바퀴가 <b>끝난 뒤</b>에 돕니다.
    en: >-
      The last slot runs before the body — it runs <b>after</b> a lap.
  - ko: >-
      몸통은 적어도 한 번은 돈다 — 조건이 처음부터 거짓이면 <b>한 번도</b> 안 돕니다.
    en: >-
      The body runs at least once — false from the outset means it runs <b>never</b>.
  - ko: >-
      조건만 적는 모양은 다른 낱말이다 — 같은 낱말입니다. 칸을 몇 개 적었느냐로만 갈려요.
    en: >-
      The test-only shape is a different word — it is the same word. Only the number of slots differs.

point:
  - q:
      ko: >-
        {{site.line}}행에서 <b>매 바퀴 끝에 도는 칸</b>을 짚어 보세요.
      en: >-
        On line {{site.line}}, point at <b>the slot that runs at the end of each lap</b>.
    hint: { ko: "괄호 없이 세미콜론으로 나뉜 세 칸 중 <b>마지막</b>입니다.", en: "It is the <b>last</b> of the three slots the semicolons divide." }
    answer: pick.4
    diag:
      pick.2:
        t:
          ko: >-
            {{pick.2|code}}{{pick.2|josa:은,는}} <b>첫 칸</b>이라 딱 한 번만 돕니다. 매 바퀴 도는 것이 아니에요.
          en: >-
            {{pick.2|code}} is the <b>first slot</b> and runs exactly once, not on every lap.
        edge:
          h: { ko: "가장 날카로운 자리 — 한 번이냐 매 바퀴냐", en: "The sharpest spot — once or every lap" }
          code:
            - "i := 0        // 한 번"
            - "i++           // 매 바퀴"
      pick.3:
        t:
          ko: >-
            {{pick.3|code}}{{pick.3|josa:은,는}} <b>가운데 칸</b>이라 매 바퀴 <b>시작</b>에 읽힙니다. 끝에 도는 것은 그다음 칸이에요.
          en: >-
            {{pick.3|code}} is the <b>middle slot</b>, read at the <b>start</b> of each lap. What runs at
            the end is the slot after it.
        edge:
          h: { ko: "가장 날카로운 자리 — 시작이냐 끝이냐", en: "The sharpest spot — the start or the end" }
          code:
            - "i < 3         // 바퀴 시작에 읽는다"
            - "i++           // 바퀴 끝에 돈다"
      pick.5:
        t:
          ko: >-
            {{pick.5|code}}{{pick.5|josa:은,는}} <b>몸통</b>입니다. 몸통이 끝난 뒤에 도는 칸이 따로 있어요.
          en: >-
            {{pick.5|code}} is the <b>body</b>. A separate slot runs after the body finishes.
        edge:
          h: { ko: "가장 날카로운 자리 — 몸통이냐 그 뒤냐", en: "The sharpest spot — the body or what follows it" }
          code:
            - "{ sum += i }   // 몸통"
            - "i++            // 몸통 뒤"

blank:
  - q:
      ko: >-
        빈칸에 들어갈 것을 고르세요. {{site.line}}행은 조건이 참인 동안 <b>되풀이</b>합니다.
      en: >-
        Choose what goes in the blank. Line {{site.line}} <b>repeats</b> while the test holds.
    hint: { ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다.", en: "Your choice is written into the code at once. Submit to have it marked." }
    options:
      - { t: "for", mono: true }
      - t: "while"
        mono: true
        diag:
          t:
            ko: >-
              Go 에 이 낱말은 <b>없습니다</b>. 같은 일을 하는 모양은 조건만 적은 되풀이예요.
            en: >-
              Go <b>does not have</b> this word. The shape that does the same job is the loop with only a
              test.
          edge:
            h: { ko: "가장 날카로운 자리 — 낱말이 있나 없나", en: "The sharpest spot — does the word exist" }
            code:
              - "for n < 3 { }     // 이것이 그 자리다"
              - "while n < 3 { }   // 멈춘다"
      - t: "if"
        mono: true
        diag:
          t:
            ko: >-
              이 낱말은 <b>한 번만</b> 봅니다. 되풀이가 필요한 자리에 쓰면 한 바퀴로 끝나요.
            en: >-
              That word looks <b>once</b>. Where repetition is wanted it ends after one pass.
          edge:
            h: { ko: "가장 날카로운 자리 — 한 번이냐 되풀이냐", en: "The sharpest spot — once or repeatedly" }
            code:
              - "if n < 3 { n++ }      // 한 번"
              - "for n < 3 { n++ }     // 3 이 될 때까지"
      - t: "range"
        mono: true
        diag:
          t:
            ko: >-
              이 낱말은 <b>혼자 못 섭니다</b>. 되풀이 낱말 뒤에 붙어 묶음을 하나씩 훑을 때만 쓰여요.
            en: >-
              That word <b>cannot stand alone</b>. It follows the looping word to walk a collection item by
              item.
          edge:
            h: { ko: "가장 날카로운 자리 — 혼자 서나 붙나", en: "The sharpest spot — standing alone or attaching" }
            code:
              - "for i := 0; i < 3; i++ { }"
              - "for _, v := range xs { }"

why_gate:
  q:
    ko: >-
      Go 는 왜 되풀이 낱말을 <b>하나</b>만 두었을까요?
    en: >-
      Why does Go have only <b>one</b> looping word?
  choices:
    - t:
        ko: >-
          세 모양이 하나의 문법에서 칸을 빼는 것으로 나와서, 읽는 사람이 낱말이 아니라 칸을 세면 되기 때문
        en: >-
          Because all three shapes come from one form by dropping slots, so the reader counts slots
          instead of learning words
      ok: true
      fb:
        ko: >-
          그 방향입니다. 그럼 낱말이 여럿인 언어에서 무엇을 더 외워야 하는지도 적어 보세요.
        en: >-
          That is the direction. Add what extra there is to memorise in a language with several words.
    - t:
        ko: >-
          되풀이를 적게 쓰게 하려고
        en: >-
          To discourage loops
      ok: false
      fb:
        ko: >-
          적게 쓰라는 뜻은 없습니다. 실제로 Go 코드에는 되풀이가 많아요.
        en: >-
          There is no such discouragement. Go code is full of loops.
    - t:
        ko: >-
          컴파일러가 하나만 처리하면 돼서
        en: >-
          So the compiler handles only one form
      ok: false
      fb:
        ko: >-
          컴파일러는 세 모양을 다 처리합니다. 하나로 보이는 것은 문법 쪽 이야기예요.
        en: >-
          The compiler handles all three shapes. Looking like one is a matter of grammar.

queries:
  - { grammars: [go], file: ./for-loop.scm }

examples:
  - code: "func f() { sum := 0; for i := 0; i < 3; i++ { sum += i } }"
    expect: { sites: 1, form: clause, hole: "for", picks: { 1: "for", 2: "i := 0", 3: "i < 3", 4: "i++" } }
  - code: "func f(n int) { for n < 3 { n++ } }"
    expect: { sites: 1, form: while, hole: "for", picks: { 1: "for", 3: "n < 3" } }
  - code: "func f(xs []int) { for _, v := range xs { println(v) } }"
    expect: none
