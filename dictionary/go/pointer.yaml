schema: 1
id: go/pointer
# 2부 (`go.md` §3 ㉑). 보편형이 없다 — 포인터를 값으로 다루는 언어가 열 중 셋뿐이라
# `common/` 에 대응이 없다. 실측 3,616곳/378파일.
universal: null
name: { ko: "값 있는 자리 가리키기", en: "Pointer" }
token: "*"
grammars: [go]
framework: null
essential: true
difficulty: 2
prereq: [go/assignment, cs/memory-address, cs/pointer-indirection]
confusions: []

dict:
  one_liner:
    ko: >-
      값 대신 값이 있는 자리를 넘긴다. 셈은 못 하고 가리키기만 한다.
    en: >-
      Hands over where a value lives, not the value; no arithmetic, only pointing.
  why:
    ko: >-
      Go 는 인자를 언제나 복사하므로, 부른 함수가 <b>부른 쪽의 값을 고치게</b> 하려면 값이 아니라 <b>값이 있는 자리</b>를 넘겨야 합니다.
      {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:이,가}} 그 자리를 뜻하는 기호예요. 큰 묶음을 안 베끼려고 쓰기도 합니다. Go 의
      포인터가 C 와 다른 자리는 둘입니다 — <b>셈을 못 합니다</b>(자리에 1 을 더해 옆 칸으로 가는 일이 없어요), 그리고 <b>가리킨 것이 살아 있는 동안은 안
      사라집니다</b>(함수 안에서 만든 값의 자리를 돌려줘도 됩니다. 가비지 컬렉터가 지켜 줘요).
    en: >-
      Because Go always copies arguments, letting a callee <b>change the caller's value</b> means
      handing over <b>where the value lives</b> rather than the value. The {{pick.1|code}} on line
      {{site.line}} is the symbol for that place. It is also used to avoid copying something large.
      Two things set Go's pointers apart from C's — <b>no arithmetic</b> (adding one to a place to
      step to the next slot does not exist), and <b>what is pointed at does not vanish while it is
      still reachable</b>: a place made inside a function may be given back, and the garbage collector
      keeps it.
  trace:
    - ko: >-
        {{site.line}}행의 {{pick.1|code}}{{pick.1|josa:이,가}} 자리를 뜻한다.
      en: >-
        The {{pick.1|code}} on line {{site.line}} means a place.
    - ko: >-
        {{pick.2|code}}{{pick.2|josa:은,는}} 값이 아니라 그 자리를 든다.
      en: >-
        {{pick.2|code}} holds that place, not the value.
    - ko: >-
        그 자리를 통해 고치면 원본이 바뀐다.
      en: >-
        Changing through that place changes the original.

rule:
  ko: >-
    <b>자리를 넘겨야 원본이 바뀐다.</b> 자리에 셈은 못 한다.
  en: >-
    <b>Only handing over the place changes the original.</b> No arithmetic is done on a place.
result:
  label: { ko: "{{site.line}}행이 든 것", en: "what line {{site.line}} holds" }
  value: "{{pick.1}}{{pick.3}}"
  note: { ko: "값이 아니라 자리다", en: "a place, not a value" }
ok: { ko: "{{pick.2|code}}{{pick.2|josa:은,는}} 값이 아니라 값이 있는 자리를 듭니다.", en: "{{pick.2|code}} holds where a value lives, not the value." }
payoff:
  ko: >-
    이걸 알면 「넘겨서 고쳤는데 왜 안 바뀌나」가 풀립니다 — 값을 넘겼습니다.
  en: >-
    This untangles "I handed it over and changed it and nothing changed" — the value was handed
    over.
bridge:
  ko: >-
    C 의 포인터는 셈이 되고 가리킨 것이 사라질 수 있습니다. Go 는 셈을 막고 사라지지 않게 지켜요.
  en: >-
    A C pointer supports arithmetic and what it points at can vanish. Go forbids the arithmetic and
    keeps the target alive.
misconceptions:
  - ko: >-
      자리에 1 을 더하면 옆 칸으로 간다 — Go 에서는 <b>셈 자체가 안 됩니다</b>.
    en: >-
      Adding one to a place steps to the next slot — in Go <b>the arithmetic does not exist</b>.
  - ko: >-
      함수 안에서 만든 값의 자리를 돌려주면 위험하다 — Go 에서는 안전합니다. 가리키는 동안 사라지지 않아요.
    en: >-
      Giving back the place of a value made inside a function is unsafe — in Go it is safe; it does
      not vanish while pointed at.

point:
  - q:
      ko: >-
        {{site.line}}행에서 <b>값이 아니라 자리임을 뜻하는 기호</b>를 짚어 보세요.
      en: >-
        On line {{site.line}}, point at <b>the symbol that means a place rather than a value</b>.
    hint: { ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다.", en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose." }
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: >-
            {{pick.2|code}}{{pick.2|josa:은,는}} <b>이름</b>입니다. 자리를 뜻하는 것은 그 옆의 기호예요.
          en: >-
            {{pick.2|code}} is the <b>name</b>. What means a place is the symbol beside it.
        edge:
          h: { ko: "가장 날카로운 자리 — 이름이냐 기호냐", en: "The sharpest spot — the name or the symbol" }
          code:
            - "opts Options       // 값"
            - "opts *Options      // 자리"
      pick.3:
        t:
          ko: >-
            {{pick.3|code}}{{pick.3|josa:은,는}} 가리켜지는 <b>종류</b>입니다. 종류만으로는 값인지 자리인지 안 갈려요.
          en: >-
            {{pick.3|code}} is the <b>kind</b> pointed at. The kind alone does not say value or place.
        edge:
          h: { ko: "가장 날카로운 자리 — 종류냐 자리 표시냐", en: "The sharpest spot — the kind or the place marker" }
          code:
            - "Options            // 종류"
            - "*Options           // 자리"

blank:
  - q:
      ko: >-
        빈칸에 들어갈 것을 고르세요. {{site.line}}행은 값이 아니라 <b>값이 있는 자리</b>를 받습니다.
      en: >-
        Choose what goes in the blank. Line {{site.line}} takes <b>where a value lives</b>, not the
        value.
    hint: { ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다.", en: "Your choice is written into the code at once. Submit to have it marked." }
    options:
      - { t: "*", mono: true }
      - t: "&"
        mono: true
        diag:
          t:
            ko: >-
              이 기호는 <b>자리를 만드는</b> 쪽입니다. 타입 자리가 아니라 값 앞에 붙어요.
            en: >-
              That symbol <b>takes</b> a place. It stands before a value, not in a type.
          edge:
            h: { ko: "가장 날카로운 자리 — 타입이냐 값이냐", en: "The sharpest spot — a type or a value" }
            code:
              - "func f(o *Options)     // 타입"
              - "f(&opts)               // 값 앞"
      - t: "[]"
        mono: true
        diag:
          t:
            ko: >-
              이 기호는 <b>여럿을 보는 창</b>을 뜻합니다. 값 하나의 자리가 아니에요.
            en: >-
              That symbol means a <b>window over many</b>, not the place of one value.
          edge:
            h: { ko: "가장 날카로운 자리 — 하나냐 여럿이냐", en: "The sharpest spot — one or many" }
            code:
              - "*Options               // 하나의 자리"
              - "[]Options              // 여럿"
      - t: "&&"
        mono: true
        diag:
          t:
            ko: >-
              이 기호는 <b>참·거짓 둘을 잇습니다</b>. 타입 자리에 놓으면 그 줄에서 멈춰요.
            en: >-
              That symbol <b>joins two truth values</b>. In a type slot it stops on that line.
          edge:
            h: { ko: "가장 날카로운 자리 — 타입이냐 조건이냐", en: "The sharpest spot — a type or a condition" }
            code:
              - "o *Options"
              - "ok && ready"

why_gate:
  q:
    ko: >-
      Go 는 왜 포인터에 <b>셈을 막았을까요</b>?
    en: >-
      Why does Go <b>forbid arithmetic</b> on a pointer?
  choices:
    - t:
        ko: >-
          자리에 셈을 허용하면 어느 값의 자리인지가 실행 때까지 안 정해져, 가비지 컬렉터도 경계 검사도 설 수 없기 때문
        en: >-
          Because arithmetic leaves which value a place belongs to undecided until run time, and neither
          the collector nor bounds checking can stand on that
      ok: true
      fb:
        ko: >-
          그 방향입니다. 그럼 C 에서 그 자유가 무엇을 사는지도 한 줄 적어 보세요.
        en: >-
          That is the direction. Add a line on what that freedom buys in C.
    - t:
        ko: >-
          셈이 느려서
        en: >-
          Because the arithmetic is slow
      ok: false
      fb:
        ko: >-
          빠릅니다. 막은 이유는 속도가 아니라 안전이에요.
        en: >-
          It is fast. The reason is safety, not speed.
    - t:
        ko: >-
          포인터를 잘 안 써서
        en: >-
          Because pointers are rarely used
      ok: false
      fb:
        ko: >-
          많이 씁니다. 표본 리포에서 포인터 리시버가 값 리시버의 다섯 배예요.
        en: >-
          They are used constantly. In the sample repository pointer receivers outnumber value receivers
          five to one.

queries:
  - { grammars: [go], file: ./pointer.scm }

examples:
  - code: "func f(o *Options) { }"
    expect: { sites: 1, form: param, hole: "*", picks: { 1: "*", 2: "o", 3: "Options" } }
  - code: "type C struct { conn *Conn }"
    expect: { sites: 1, form: field, hole: "*", picks: { 1: "*", 2: "conn", 3: "Conn" } }
  - code: "func f(opts Options) { g(&opts) }"
    expect: { sites: 1, form: addr, hole: "&", picks: { 1: "&", 2: "opts" } }
  - code: "func f(o Options) { }"
    expect: none
