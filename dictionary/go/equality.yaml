schema: 1
id: go/equality
# 0부 축 8 (`go.md` §0.1 0-8). 보편형은 `common/comparison` 이다.
#
# **쿼리가 좁다.** 양쪽 어디에도 `nil` 이 없는 견주기만 잡는다 — 안 좁히면
# `cli/cli` 의 `if` 7,669개 중 2,284개(30%)가 `if err != nil` 이라 이 개념과
# `go/if-statement`·`go/nil`·`go/error-check` 넷의 첫 노출이 같은 세 줄이 된다
# (`README.md` §7 ②). 좁힌 뒤 실측은 2,278곳/308파일이다.
universal: common/comparison
name: { ko: "같은 값인가, 견줄 수는 있나", en: "Equality and what may be compared" }
token: "=="
grammars: [go]
framework: null
essential: true
difficulty: 2
prereq: [cs/identity-vs-equality, cs/value-vs-reference]
confusions: []

dict:
  one_liner:
    ko: >-
      두 값이 같은지 묻는다. 견줄 수 있는 타입이 정해져 있다.
    en: >-
      It asks whether two values are the same. Only some types may be compared.
  why:
    ko: >-
      {{site.line}}행은 {{pick.2|code}}{{pick.2|josa:과,와}} {{pick.3|code}} 두 값이 같은지 묻습니다. Go 에서 이 물음이
      <b>값 비교</b>인 것은 견줄 수 있는 타입에서만이에요 — 수·글자 묶음·참·거짓·포인터·채널, 그리고 그런 것들로만 이루어진 구조체·배열입니다. 슬라이스·맵·함수는
      <b>견주는 것 자체가 안 됩니다</b>: 런타임 오류가 아니라 그 줄에서 <b>컴파일이 멈춰요</b>. 그 셋에 대해 허용되는 것은 <code>nil</code> 과
      견주는 것 하나뿐이고, 내용을 견주려면 <code>reflect.DeepEqual</code> 같은 함수를 부릅니다.
    en: >-
      Line {{site.line}} asks whether {{pick.2|code}} and {{pick.3|code}} are the same. In Go this is
      a <b>value comparison</b> only for types that may be compared — numbers, text, truth values,
      pointers, channels, and structs and arrays built only from those. Slices, maps and functions
      <b>may not be compared at all</b>: not a run-time error, but the <b>compiler stopping</b> on
      that line. The one thing allowed for those three is a comparison against <code>nil</code>;
      comparing contents means calling something like <code>reflect.DeepEqual</code>.
  trace:
    - ko: >-
        {{site.line}}행은 {{pick.2|code}}{{pick.2|josa:을,를}} 한 값으로 접는다.
      en: >-
        Line {{site.line}} folds {{pick.2|code}} into one value.
    - ko: >-
        {{pick.3|code}}{{pick.3}} 한 값으로 접는다.
      en: >-
        {{pick.3|code}} folds into one value too.
    - ko: >-
        {{pick.1|code}}{{pick.1|josa:이,가}} 그 둘을 견주어 참·거짓을 낸다.
      en: >-
        {{pick.1|code}} weighs the two and gives a truth value.

rule:
  ko: >-
    <b>견줄 수 있는 타입이 정해져 있다.</b> 묶음을 견주면 오류가 아니라 컴파일이 멈춘다.
  en: >-
    <b>Only some types may be compared.</b> Comparing a collection stops the compiler, not the
    program.
result:
  label: { ko: "{{site.line}}행의 견주기", en: "the comparison on line {{site.line}}" }
  value: "{{pick.2}} {{pick.1}} {{pick.3}}"
  note: { ko: "결과는 참·거짓이다", en: "the result is a truth value" }
ok:
  ko: >-
    {{pick.2|code}}{{pick.2|josa:과,와}} {{pick.3|code}} 둘 다 견줄 수 있는 타입입니다.
  en: >-
    Both {{pick.2|code}} and {{pick.3|code}} are of a comparable type.
payoff:
  ko: >-
    이걸 알면 「슬라이스 둘을 견줬더니 빌드가 안 나온다」가 풀립니다 — 값이 다른 게 아니라 물음 자체가 안 됩니다.
  en: >-
    This untangles "comparing two slices gave no build" — the values did not differ; the question is
    not askable.
bridge:
  ko: >-
    파이썬은 목록 둘을 내용으로 견주고 자바는 주소로 견줍니다. Go 는 셋째 답을 골랐어요 — 물음을 막습니다.
  en: >-
    Python compares two lists by contents and Java by identity. Go picked a third answer: it forbids
    the question.
misconceptions:
  - ko: >-
      묶음을 견주면 내용이 견주어진다 — Go 에서는 그 줄에서 컴파일이 멈춥니다.
    en: >-
      Comparing collections compares contents — in Go the compiler stops on that line.
  - ko: >-
      견주기가 안 되면 실행 때 오류가 난다 — 실행 전에 멈춰요. 빌드 자체가 안 나옵니다.
    en: >-
      A forbidden comparison fails at run time — it stops before that. No build comes out.
  - ko: >-
      구조체는 못 견준다 — 견줄 수 있는 칸으로만 이루어져 있으면 견줄 수 있습니다.
    en: >-
      Structs cannot be compared — they can, when every field is itself comparable.

point:
  - q:
      ko: >-
        {{site.line}}행에서 <b>두 값을 견주는 기호</b>를 짚어 보세요.
      en: >-
        On line {{site.line}}, point at <b>the symbol that weighs the two values</b>.
    hint: { ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다.", en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose." }
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: >-
            {{pick.2|code}}{{pick.2|josa:은,는}} 견주어지는 <b>한쪽</b>입니다. 값 혼자서는 견주지 않아요.
          en: >-
            {{pick.2|code}} is <b>one side</b> being weighed. A value alone weighs nothing.
        edge:
          h: { ko: "가장 날카로운 자리 — 재료냐 견주기냐", en: "The sharpest spot — an input or the weighing" }
          code:
            - "host              // 값 하나"
            - "host == \"\"         // 참·거짓이 난다"
      pick.3:
        t:
          ko: >-
            {{pick.3|code}}{{pick.3|josa:은,는}} 견주어지는 <b>다른 쪽</b>입니다. 둘을 잇는 것이 가운데 기호예요.
          en: >-
            {{pick.3|code}} is the <b>other side</b>. The symbol between joins them.
        edge:
          h: { ko: "가장 날카로운 자리 — 재료냐 견주기냐", en: "The sharpest spot — an input or the weighing" }
          code:
            - "\"\"                // 값 하나"
            - "host == \"\"         // 참·거짓이 난다"

meaning:
  - q:
      ko: >-
        슬라이스 둘을 <code>xs == ys</code> 로 견주면 어떻게 될까요?
      en: >-
        What happens when two slices are compared with <code>xs == ys</code>?
    options:
      - t:
          ko: >-
            컴파일이 멈춘다 — 슬라이스는 견줄 수 있는 타입이 아니다
          en: >-
            The compiler stops — a slice is not a comparable type
      - t:
          ko: >-
            길이와 값이 같으면 참이 난다
          en: >-
            It gives true when the lengths and the values match
        diag:
          t:
            ko: >-
              그건 파이썬의 규칙입니다. Go 에서 내용 견주기는 <code>reflect.DeepEqual</code> 같은 함수의 일이에요.
            en: >-
              That is Python's rule. In Go, comparing contents is the job of a function like
              <code>reflect.DeepEqual</code>.
      - t:
          ko: >-
            뒷배열의 주소가 같으면 참이 난다
          en: >-
            It gives true when the backing arrays share an address
        diag:
          t:
            ko: >-
              주소로 견주는 것도 안 됩니다. 슬라이스는 <code>nil</code> 과만 견줄 수 있어요.
            en: >-
              Comparing by address is not allowed either. A slice may only be weighed against
              <code>nil</code>.
      - t:
          ko: >-
            돌다가 그 줄에서 죽는다
          en: >-
            It runs and dies on that line
        diag:
          t:
            ko: >-
              돌지 않습니다. 타입 검사에서 걸려 빌드가 안 나와요.
            en: >-
              It never runs. The type check catches it and no build comes out.

blank:
  - q:
      ko: >-
        빈칸에 들어갈 것을 고르세요. {{site.line}}행은 두 값이 <b>같은지</b> 묻습니다.
      en: >-
        Choose what goes in the blank. Line {{site.line}} asks whether two values are <b>the same</b>.
    hint: { ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다.", en: "Your choice is written into the code at once. Submit to have it marked." }
    options:
      - { t: "==", mono: true }
      - t: "="
        mono: true
        diag:
          t:
            ko: >-
              기호 하나짜리는 <b>넣는</b> 것이라 묻지 않습니다. 조건 자리에 놓으면 참·거짓이 안 나와 그 줄에서 멈춰요.
            en: >-
              The single-symbol form <b>puts</b> rather than asks. In a condition it yields no truth value and
              stops on that line.
          edge:
            h: { ko: "가장 날카로운 자리 — 넣나 묻나", en: "The sharpest spot — putting or asking" }
            code:
              - "host = \"\"        // 값이 바뀐다"
              - "host == \"\"       // 참·거짓이 난다"
      - t: ":="
        mono: true
        diag:
          t:
            ko: >-
              이 모양은 <b>이름을 만들며 값을 넣습니다</b>. 견주는 자리가 아니라 만드는 자리예요.
            en: >-
              That form <b>makes a name and puts a value in</b>. It is where a name is made, not where values
              are weighed.
          edge:
            h: { ko: "가장 날카로운 자리 — 만드나 견주나", en: "The sharpest spot — making or weighing" }
            code:
              - "host := \"\"       // 이름이 생긴다"
              - "host == \"\"       // 참·거짓이 난다"
      - t: ">="
        mono: true
        diag:
          t:
            ko: >-
              이건 <b>크기</b>를 묻습니다. 같은지만 묻는 자리에 쓰면 큰 쪽도 참이 되어 답이 넓어져요.
            en: >-
              That asks about <b>order</b>. Where only sameness is asked, it also says true for the greater
              side and widens the answer.
          edge:
            h: { ko: "가장 날카로운 자리 — 같은가 큰가", en: "The sharpest spot — same or greater" }
            code:
              - "n == 3      // 3 일 때만"
              - "n >= 3      // 3 이상 전부"

why_gate:
  q:
    ko: >-
      Go 는 왜 슬라이스·맵을 <b>견주지 못하게</b> 막았을까요?
    en: >-
      Why does Go <b>forbid comparing</b> slices and maps?
  choices:
    - t:
        ko: >-
          내용으로 견줄지 자리로 견줄지 답이 하나로 안 정해지고, 어느 쪽이든 값이 커질수록 비용이 달라지기 때문
        en: >-
          Because there is no single answer to comparing by contents or by place, and either way the cost
          grows with the value
      ok: true
      fb:
        ko: >-
          그 방향입니다. 그럼 내용을 견주고 싶을 때 무엇을 부르는지도 적어 보세요.
        en: >-
          That is the direction. Add what you call when contents are what you want compared.
    - t:
        ko: >-
          슬라이스가 값이 아니라서
        en: >-
          Because a slice is not a value
      ok: false
      fb:
        ko: >-
          값 맞습니다. 대입하면 복사되기까지 해요 — 막힌 이유는 값이냐 아니냐가 아닙니다.
        en: >-
          It is a value, and assigning even copies it. Being a value or not is not the reason.
    - t:
        ko: >-
          견주기가 느려서
        en: >-
          Because comparing is slow
      ok: false
      fb:
        ko: >-
          느린 것이 이유라면 긴 글자 묶음도 막아야 합니다. 안 막았어요 — 답이 하나로 안 정해지는 것이 이유입니다.
        en: >-
          If slowness were the reason, long text would be forbidden too. It is not — the reason is that no
          single answer settles.

queries:
  - { grammars: [go], file: ./equality.scm }

examples:
  - code: "func f(host string) { ok := host == \"\" }"
    expect: { sites: 1, form: eq, hole: "==", picks: { 1: "==", 2: "host", 3: "\"\"" } }
  - code: "func f(code int) { bad := code != 200 }"
    expect: { sites: 1, form: eq, hole: "!=", picks: { 1: "!=", 2: "code", 3: "200" } }
  - code: "func f(err error) { bad := err != nil }"
    expect: none
