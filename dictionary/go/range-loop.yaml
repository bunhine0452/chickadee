schema: 1
id: go/range-loop
# 2부 (`go.md` §3 ⑲). 실측 702곳/196파일 — 세 칸짜리 되풀이(42곳)의 **17배**다.
# `_lang.yaml` 의 `alternatives` 한 줄이 그 어긋남을 적는다.
universal: common/iterate
name: { ko: "하나씩 훑기", en: "Range loop" }
token: "range"
grammars: [go]
framework: null
essential: true
difficulty: 2
prereq: [go/for-loop, go/slice]
confusions: []

dict:
  one_liner:
    ko: >-
      묶음을 하나씩 훑는다. 값 자리에 담기는 것은 복사본이다.
    en: >-
      It walks a collection one item at a time, and the value slot holds a copy.
  why:
    ko: >-
      {{site.line}}행은 {{pick.5|code}} 안의 것들을 하나씩 꺼냅니다. 꺼내지는 것이 <b>둘</b>이라는 것이 첫 요점이에요 — 창이면
      {{pick.2|code}}{{pick.2|josa:이,가}} 자리 번호이고 {{pick.3|code}}{{pick.3|josa:이,가}} 그 칸의 값, 묶음이면
      {{pick.2|code}} 쪽이 열쇠입니다. 둘째 요점은 {{pick.3|code}} 쪽이 <b>복사본</b>이라는 것입니다: 그것을 고쳐도 원본은 그대로예요. 원본을
      고치려면 자리 번호로 다시 짚어야 합니다. 셋째, <b>열쇠로 찾는 묶음을 훑으면 차례가 매번 다를 수 있습니다</b> — 명세가 순서를 정해 두지 않았고 런타임이 일부러
      흔듭니다.
    en: >-
      Line {{site.line}} takes the items of {{pick.5|code}} one at a time. That <b>two</b> things come
      out is the first point — for a window {{pick.2|code}} is the position and {{pick.3|code}} the
      value in that slot; for a keyed bundle {{pick.2|code}} is the key. The second point is that
      {{pick.3|code}} is a <b>copy</b>: changing it leaves the original alone, and changing the
      original means reaching back by position. Third, <b>walking a keyed bundle can give a different
      order every time</b> — the specification fixes none and the runtime shuffles on purpose.
  trace:
    - ko: >-
        {{site.line}}행은 {{pick.5|code}} 에서 하나를 꺼낸다.
      en: >-
        Line {{site.line}} takes one item out of {{pick.5|code}}.
    - ko: >-
        {{pick.2|code}}{{pick.2|josa:은,는}} 자리나 열쇠, {{pick.3|code}}{{pick.3|josa:은,는}} 그 값의 복사본이다.
      en: >-
        {{pick.2|code}} is the position or key and {{pick.3|code}} is a copy of the value.
    - ko: >-
        한 바퀴가 끝나면 다음 것으로 넘어간다.
      en: >-
        At the end of a lap it moves to the next one.

rule:
  ko: >-
    <b>값 자리는 복사본이다.</b> 원본을 고치려면 자리 번호로 다시 짚는다.
  en: >-
    <b>The value slot is a copy.</b> Changing the original means reaching back by position.
result:
  label: { ko: "{{site.line}}행의 한 바퀴", en: "one lap of line {{site.line}}" }
  value: "{{pick.2}}, {{pick.3}}"
  note: { ko: "값 자리는 복사본이다", en: "the value slot is a copy" }
ok: { ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 이번 바퀴에서 꺼낸 값의 복사본입니다.", en: "{{pick.3|code}} is a copy of the value taken on this lap." }
payoff:
  ko: >-
    이걸 알면 「훑으면서 값을 고쳤는데 원본이 그대로다」가 풀립니다 — 복사본을 고쳤습니다.
  en: >-
    This untangles "I changed the value while walking and the original stayed" — the copy was
    changed.
bridge:
  ko: >-
    파이썬의 훑기는 값 하나만 냅니다. Go 는 <b>자리와 값 둘</b>을 내고, 자리를 안 쓰면 밑줄로 버려요.
  en: >-
    Walking in Python yields one item. Go yields <b>two — a position and a value</b>, and an unused
    position is thrown away with an underscore.
misconceptions:
  - ko: >-
      값 자리를 고치면 원본이 바뀐다 — <b>복사본</b>이라 안 바뀝니다.
    en: >-
      Changing the value slot changes the original — it is a <b>copy</b> and does not.
  - ko: >-
      열쇠로 찾는 묶음도 넣은 순서로 나온다 — 차례가 정해져 있지 않고 순회마다 달라질 수 있습니다.
    en: >-
      A keyed bundle also comes out in insertion order — no order is fixed and it can differ between
      walks.
  - ko: >-
      바퀴마다 같은 이름을 계속 고쳐 쓴다 — <b>1.22 부터 바퀴마다 새로 만듭니다</b>. 같은 코드가 <code>go.mod</code> 의 버전에 따라 다르게 돌아요.
    en: >-
      The same name is reused and overwritten each lap — <b>since 1.22 each lap gets its own</b>, so
      the same code runs differently by the version in <code>go.mod</code>.

point:
  - q:
      ko: >-
        {{site.line}}행에서 <b>복사본이 담기는 자리</b>를 짚어 보세요.
      en: >-
        On line {{site.line}}, point at <b>the slot that holds a copy</b>.
    hint: { ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다.", en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose." }
    answer: pick.3
    diag:
      pick.2:
        t:
          ko: >-
            {{pick.2|code}}{{pick.2|josa:은,는}} <b>자리 번호나 열쇠</b>입니다. 값이 아니라 어디인지를 말해요.
          en: >-
            {{pick.2|code}} is the <b>position or key</b>. It says where, not what.
        edge:
          h: { ko: "가장 날카로운 자리 — 어디냐 무엇이냐", en: "The sharpest spot — where or what" }
          code:
            - "for i, v := range xs      // i 는 어디"
            - "xs[i] = 9                 // v 는 무엇"
      pick.5:
        t:
          ko: >-
            {{pick.5|code}}{{pick.5|josa:은,는}} 훑는 <b>대상</b>입니다. 한 바퀴에 꺼내지는 것은 그 안의 하나예요.
          en: >-
            {{pick.5|code}} is <b>what is walked</b>. What a lap takes out is one item inside it.
        edge:
          h: { ko: "가장 날카로운 자리 — 전체냐 하나냐", en: "The sharpest spot — the whole or one item" }
          code:
            - "xs                        // 전체"
            - "v                         // 한 바퀴의 하나"

blank:
  - q:
      ko: >-
        빈칸에 들어갈 것을 고르세요. {{site.line}}행은 묶음을 <b>하나씩</b> 훑습니다.
      en: >-
        Choose what goes in the blank. Line {{site.line}} walks the collection <b>one item at a
        time</b>.
    hint: { ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다.", en: "Your choice is written into the code at once. Submit to have it marked." }
    options:
      - { t: "range", mono: true }
      - t: "in"
        mono: true
        diag:
          t:
            ko: >-
              이 낱말은 Go 에 <b>없습니다</b>. 파이썬의 훑기에서 오는 손이 여기서 멈춰요.
            en: >-
              Go <b>does not have</b> this word. A hand trained on Python's walking stops here.
          edge:
            h: { ko: "가장 날카로운 자리 — 낱말이 있나 없나", en: "The sharpest spot — does the word exist" }
            code:
              - "for _, v := range xs { }"
              - "for v in xs { }          // 멈춘다"
      - t: "len"
        mono: true
        diag:
          t:
            ko: >-
              이 함수는 <b>개수</b>를 낼 뿐 훑지 않습니다. 개수로 도는 되풀이는 세 칸짜리 모양이에요.
            en: >-
              That function reports <b>how many</b> and walks nothing. Looping by count is the three-slot
              shape.
          edge:
            h: { ko: "가장 날카로운 자리 — 세나 훑나", en: "The sharpest spot — counting or walking" }
            code:
              - "for _, v := range xs { }"
              - "for i := 0; i < len(xs); i++ { }"
      - t: "append"
        mono: true
        diag:
          t:
            ko: >-
              이 함수는 <b>뒤에 붙입니다</b>. 훑는 자리가 아니라 늘리는 자리예요.
            en: >-
              That function <b>adds to the end</b>. It grows rather than walks.
          edge:
            h: { ko: "가장 날카로운 자리 — 훑나 늘리나", en: "The sharpest spot — walking or growing" }
            code:
              - "for _, v := range xs { }"
              - "xs = append(xs, 3)"

why_gate:
  q:
    ko: >-
      이 훑기는 왜 값 자리에 <b>복사본</b>을 담을까요?
    en: >-
      Why does this walk put a <b>copy</b> in the value slot?
  choices:
    - t:
        ko: >-
          인자가 언제나 복사인 것과 같은 규칙이고, 그래야 한 바퀴 안에서 무엇이 원본을 만지는지가 코드에 보이기 때문
        en: >-
          Because it is the same rule as arguments always being copies, so what touches the original
          inside a lap stays visible
      ok: true
      fb:
        ko: >-
          그 방향입니다. 그럼 원본을 고쳐야 할 때 무엇을 쓰는지도 적어 보세요.
        en: >-
          That is the direction. Add what to use when the original must change.
    - t:
        ko: >-
          복사가 더 빨라서
        en: >-
          Because copying is faster
      ok: false
      fb:
        ko: >-
          큰 값이면 오히려 느립니다. 규칙의 일관성이 이유예요.
        en: >-
          For a large value it is slower. The reason is consistency of the rule.
    - t:
        ko: >-
          원본을 고칠 방법이 없어서
        en: >-
          Because there is no way to change the original
      ok: false
      fb:
        ko: >-
          있습니다. 자리 번호로 다시 짚으면 돼요.
        en: >-
          There is. Reaching back by position does it.

queries:
  - { grammars: [go], file: ./range-loop.scm }

examples:
  - code: "func f(xs []int) { for i, v := range xs { println(i, v) } }"
    expect: { sites: 1, form: kv, hole: "range", picks: { 1: "for", 2: "i", 3: "v", 4: "range", 5: "xs" } }
  - code: "func f(m map[string]int) { for k := range m { println(k) } }"
    expect: { sites: 1, form: one, hole: "range", picks: { 1: "for", 2: "k", 4: "range", 5: "m" } }
  - code: "func f() { for i := 0; i < 3; i++ { println(i) } }"
    expect: none
