schema: 1
id: go/type-conversion
# 0부 축 6 (`go.md` §0.1 0-6). 보편형 자리가 **비어 있다** — README §9 가 `common/type-cast`
# 를 후보로만 적어 두었고 아직 없다. 만들지 않고 `null` 로 둔다 (README §12 규약 4).
#
# 다른 언어 편의 `implicit-conversion` 이 **사용처 0곳**이던 것의 정확한 반대다:
# Go 는 암묵 변환이 없어 변환이 언제나 코드에 적혀 있고, 그래서 전부 정적으로 보인다
# (`cli/cli` 429파일에서 280곳/118파일).
universal: null
name: { ko: "타입은 손으로만 바꾼다", en: "Type conversion is always written" }
token: "T()"
grammars: [go]
framework: null
essential: true
difficulty: 2
prereq: [cs/type-conversion, cs/static-vs-dynamic-typing, go/integer-literal]
confusions: []

dict:
  one_liner: { ko: "타입이 다른 값을 섞으려면 바꾸는 식을 손으로 적어야 한다.", en: "Mixing two types means writing the conversion by hand." }
  why:
    ko: >-
      Go 에는 <b>저절로 넓혀 주는 자리가 없습니다</b>. 자릿수를 잃지 않는 변환조차 안 해 줘요 — <code>var a int32; var b int64; a +
      b</code> 는 그 줄에서 멈춥니다. 그래서 {{site.line}}행처럼 바꾸는 식을 손으로 적습니다: 바꿀 타입의 이름을 적고 괄호 안에 값을 넣으면
      {{pick.3|code}}{{pick.3|josa:이,가}} 그 타입의 값이 됩니다. 헷갈리는 자리는 하나예요 — <code>var f float64 = 1</code>
      은 되는데 <code>var n int = 1; var f float64 = n</code> 은 안 됩니다. 앞의 <code>1</code> 은 아직 타입이 없는 상수이고
      뒤의 <code>n</code> 은 이미 타입이 있어서입니다.
    en: >-
      Go has <b>no place where widening happens on its own</b>. Even a conversion that loses nothing
      is not done for you — <code>var a int32; var b int64; a + b</code> stops on that line. So the
      conversion is written by hand, as on line {{site.line}}: name the type and put the value in
      parentheses, and {{pick.3|code}} becomes a value of that type. One spot confuses everyone —
      <code>var f float64 = 1</code> works while <code>var n int = 1; var f float64 = n</code> does
      not. The bare <code>1</code> is an untyped constant and <code>n</code> already has a type.
  trace:
    - ko: >-
        {{site.line}}행은 {{pick.3|code}}{{pick.3|josa:을,를}} 재료로 삼는다.
      en: >-
        Line {{site.line}} takes {{pick.3|code}} as its input.
    - ko: >-
        {{pick.1|code}}{{pick.1|josa:이,가}} 바꿀 타입의 이름이다.
      en: >-
        {{pick.1|code}} names the type to become.
    - ko: >-
        결과는 그 타입의 <b>새 값</b>이고 재료는 그대로다.
      en: >-
        The result is a <b>new value</b> of that type; the input is untouched.

rule:
  ko: >-
    <b>넓히는 변환도 손으로 적는다.</b> 적지 않으면 넓혀 주는 것이 아니라 멈춘다.
  en: >-
    <b>Even widening is written by hand.</b> Leave it out and nothing widens — it stops.
result:
  label: { ko: "{{site.line}}행의 변환", en: "the conversion on line {{site.line}}" }
  value: "{{pick.1}}({{pick.3}})"
  note: { ko: "재료는 안 바뀐다", en: "the input itself is unchanged" }
ok:
  ko: >-
    {{pick.3|code}}{{pick.3|josa:은,는}} 이제 {{pick.1|code}} 타입의 값입니다.
  en: >-
    {{pick.3|code}} is now a value of type {{pick.1|code}}.
payoff:
  ko: >-
    이걸 알면 「타입이 같아 보이는데 왜 안 더해지나」가 풀립니다 — 크기가 같아도 다른 타입입니다.
  en: >-
    This untangles "they look alike, why won't they add" — same size, different type.
bridge:
  ko: >-
    C#·자바는 좁아지지 않는 변환을 자동으로 해 줍니다. Go 는 그것도 안 해서 코드에 전부 적혀 있어요.
  en: >-
    C# and Java widen for you when nothing is lost. Go does not, so every conversion is written
    down.
misconceptions:
  - ko: >-
      크기가 같으면 섞인다 — 64비트 기계에서 <code>int</code> 와 <code>int64</code> 는 크기가 같아도 못 섞습니다.
    en: >-
      Same size means they mix — on a 64-bit build <code>int</code> and <code>int64</code> have the
      same size and still do not mix.
  - ko: >-
      변환이 원래 값을 바꾼다 — <b>새 값</b>을 만듭니다. 재료는 그대로예요.
    en: >-
      A conversion changes the original — it makes a <b>new value</b> and leaves the input alone.
  - ko: >-
      좁히는 변환은 막힌다 — 안 막힙니다. 조용히 잘려요 — 그래서 손으로 적게 한 겁니다.
    en: >-
      Narrowing is blocked — it is not. It silently truncates, which is why it must be written by
      hand.

point:
  - q:
      ko: >-
        {{site.line}}행에서 <b>바꿀 타입의 이름</b>을 짚어 보세요.
      en: >-
        On line {{site.line}}, point at <b>the name of the type being converted to</b>.
    hint: { ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다.", en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose." }
    answer: pick.1
    diag:
      pick.3:
        t:
          ko: >-
            {{pick.3|code}}{{pick.3|josa:은,는}} 바꿀 <b>재료</b>입니다. 재료는 무엇이 될지를 안 정하고, 정하는 것은 괄호 앞의 이름이에요.
          en: >-
            {{pick.3|code}} is the <b>input</b> being converted. An input does not choose what it becomes;
            the name before the parentheses does.
        edge:
          h: { ko: "가장 날카로운 자리 — 재료냐 목적지냐", en: "The sharpest spot — the input or the destination" }
          code:
            - "n            // 재료"
            - "int64(n)     // 목적지가 적혔다"
      pick.2:
        t:
          ko: >-
            {{pick.2|code}}{{pick.2|josa:은,는}} 결과를 받는 <b>이름</b>입니다. 받는 이름이 변환을 시키는 것은 아니에요.
          en: >-
            {{pick.2|code}} is the <b>name</b> that takes the result. Taking it does not perform the
            conversion.
        edge:
          h: { ko: "가장 날카로운 자리 — 받는 쪽이냐 바꾸는 쪽이냐", en: "The sharpest spot — the taker or the converter" }
          code:
            - "var f float64 = n        // 멈춘다"
            - "f := float64(n)          // 돈다"

meaning:
  - q:
      ko: >-
        <code>var n int = 1</code> 뒤에 <code>var f float64 = n</code> 이라고 적으면 어떻게 될까요?
      en: >-
        After <code>var n int = 1</code>, what happens if you write <code>var f float64 = n</code>?
    options:
      - t:
          ko: >-
            멈춘다 — 이름이 든 값은 타입이 이미 정해져 있어 저절로 넓어지지 않는다
          en: >-
            It stops — a value held in a name already has a type and does not widen on its own
      - t:
          ko: >-
            돈다 — 자릿수를 안 잃는 변환이라 자동으로 넓어진다
          en: >-
            It works — nothing is lost, so it widens automatically
        diag:
          t:
            ko: >-
              C#·자바의 규칙입니다. Go 에는 「안 잃으면 넓혀 준다」는 규칙이 아예 없어요.
            en: >-
              That is the C# and Java rule. Go has no notion of widening when nothing is lost.
      - t:
          ko: >-
            돈다 — <code>1</code> 이 원래 실수로도 쓰이는 값이라서
          en: >-
            It works — <code>1</code> is a value that also serves as a fraction
        diag:
          t:
            ko: >-
              그건 <code>var f float64 = 1</code> 일 때의 이야기입니다. 이름을 거치면 이미 타입이 붙어 있어요.
            en: >-
              That story belongs to <code>var f float64 = 1</code>. Once it passes through a name, the type is
              already attached.
      - t:
          ko: >-
            돌지만 소수점 아래가 잘린다
          en: >-
            It works but drops the fractional part
        diag:
          t:
            ko: >-
              잘릴 것이 없습니다. 넓히는 쪽이라 잃을 자릿수가 없는데도 멈춰요 — 그게 이 판의 요점입니다.
            en: >-
              There is nothing to drop. This is the widening direction with no digits at risk, and it still
              stops — that is the plate.

blank:
  - q:
      ko: >-
        빈칸에 들어갈 것을 고르세요. {{site.line}}행은 값을 <b>64칸짜리 정수</b>로 바꿉니다.
      en: >-
        Choose what goes in the blank. Line {{site.line}} turns a value into a <b>64-bit whole
        number</b>.
    hint: { ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다.", en: "Your choice is written into the code at once. Submit to have it marked." }
    options:
      - { t: "int64", mono: true }
      - t: "float64"
        mono: true
        diag:
          t:
            ko: >-
              이건 <b>실수</b>로 바꿉니다. 정수만 오가는 자리에 쓰면 뒤의 셈이 전부 실수가 되고, 나눗셈의 답이 달라져요.
            en: >-
              That converts to a <b>fraction</b>. In a whole-number chain it turns the rest of the arithmetic
              into fractions and division answers differently.
          edge:
            h: { ko: "가장 날카로운 자리 — 정수냐 실수냐", en: "The sharpest spot — whole or fractional" }
            code:
              - "int64(7) / 2      // 3"
              - "float64(7) / 2    // 3.5"
      - t: "string"
        mono: true
        diag:
          t:
            ko: >-
              이건 <b>글자 묶음</b>으로 바꿉니다. 수에 이 변환을 쓰면 자릿수가 글자로 안 바뀌고 그 수를 <b>글자 코드</b>로 읽어요.
            en: >-
              That converts to <b>text</b>. Applied to a number it does not spell the digits; it reads the
              number as a <b>character code</b>.
          edge:
            h: { ko: "가장 날카로운 자리 — 자릿수냐 글자 코드냐", en: "The sharpest spot — the digits or the character code" }
            code:
              - "string(65)                  // \"A\""
              - "strconv.Itoa(65)            // \"65\""
      - t: "bool"
        mono: true
        diag:
          t:
            ko: >-
              이건 <b>참·거짓</b>으로 바꾸려는 것인데, Go 에는 수와 참·거짓 사이의 변환이 아예 없습니다.
            en: >-
              That aims at a <b>truth value</b>, and Go has no conversion between numbers and truth values at
              all.
          edge:
            h: { ko: "가장 날카로운 자리 — 변환이 있나 없나", en: "The sharpest spot — does the conversion exist" }
            code:
              - "int64(n)      // 있다"
              - "bool(n)       // 없다"

why_gate:
  q:
    ko: >-
      Go 는 왜 <b>넓히는 변환까지</b> 손으로 적게 할까요?
    en: >-
      Why does Go make you write <b>even a widening conversion</b> by hand?
  choices:
    - t:
        ko: >-
          어디서 타입이 바뀌는지가 코드에 남아, 읽는 사람이 언어의 변환 규칙을 외우지 않아도 되기 때문
        en: >-
          Because every place a type changes stays visible, so the reader memorises no conversion rules
      ok: true
      fb:
        ko: >-
          그 방향입니다. 규칙이 있는 언어에서 무엇이 조용히 일어나는지도 한 줄 적어 보세요.
        en: >-
          That is the direction. Add a line on what happens silently in a language that has those rules.
    - t:
        ko: >-
          변환이 느려서 자주 못 하게 하려고
        en: >-
          Because conversion is slow and should be discouraged
      ok: false
      fb:
        ko: >-
          속도 문제가 아닙니다. 넓히는 변환은 값이 없거나 아주 싸요 — 문제는 눈에 보이나 안 보이나입니다.
        en: >-
          Speed is not it. Widening is free or nearly so — the issue is whether it is visible.
    - t:
        ko: >-
          컴파일러가 타입을 못 알아내서
        en: >-
          Because the compiler cannot work out the types
      ok: false
      fb:
        ko: >-
          알아냅니다. 알아내고도 안 해 주는 것이 결정이에요.
        en: >-
          It can. Knowing and still not doing it is the decision.

queries:
  - { grammars: [go], file: ./type-conversion.scm }

examples:
  - code: "func f(n int) { total := int64(n) }"
    expect: { sites: 1, form: convdecl, hole: "int64", picks: { 1: "int64", 2: "total", 3: "n" } }
  - code: "func f(n int) { g(float64(n)) }"
    expect: { sites: 1, form: conv, hole: "float64", picks: { 1: "float64", 3: "n" } }
  - code: "func f(s string) { b := []byte(s) }"
    expect: { sites: 1, form: convtype, hole: "[]byte", picks: { 1: "[]byte", 3: "s" } }
  - code: "func f() { g(1) }"
    expect: none
