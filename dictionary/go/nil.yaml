schema: 1
id: go/nil
# 2부 (`go.md` §3 ⑳).
#
# **쿼리가 견주기를 뺀다.** `x != nil` 은 `go/error-check` 의 자리이고, 값 둘을
# 돌려주는 `return v, nil` 은 `go/return-multi` 의 자리다 — 셋의 첫 노출이 같은 줄이
# 되는 것을 그렇게 피했다 (`README.md` §7 ②). 남은 실측 862곳/276파일.
universal: common/absent-value
name: { ko: "값이 없음", en: "The absent value" }
token: "nil"
grammars: [go]
framework: null
essential: true
difficulty: 2
prereq: [go/assignment, go/pointer]
confusions: []

dict:
  one_liner:
    ko: >-
      「여기엔 아무것도 없다」를 뜻하는 값 하나가 여섯 종류에서 다르게 군다.
    en: >-
      One value stands for "nothing here", and it behaves differently in six kinds.
  why:
    ko: >-
      {{site.line}}행이 놓는 값은 <b>여섯 종류의 제로 값</b>입니다 — 포인터·창·열쇠 묶음·채널·함수·인터페이스. 하나의 낱말인데 종류마다 할 수 있는 일이
      달라요. 창은 이 값이어도 <b>붙이기가 됩니다</b>(길이 0 인 창과 거의 같이 굴어요). 열쇠 묶음은 <b>읽기는 되고 쓰기는 그 자리에서 죽습니다</b>. 채널은
      <b>주고받으면 영원히 멈춥니다</b>. 인터페이스는 가장 까다로워요 — 안에 타입이 남아 있으면 이 값과 견주었을 때 <b>같지 않다</b>고 나옵니다. 「하나의 없음」이
      아니라 <b>종류마다 다른 없음</b>이라는 것이 이 판입니다.
    en: >-
      The value line {{site.line}} puts down is the <b>zero value of six kinds</b> — pointers,
      windows, keyed bundles, channels, functions and interfaces. One word, and what it can do differs
      by kind. A window in this state <b>still accepts appends</b> and behaves nearly like an empty
      one. A keyed bundle <b>reads fine and dies on a write</b>. A channel <b>blocks forever</b> on a
      send or a receive. An interface is the trickiest — with a type still inside, weighing it against
      this value says <b>not the same</b>. Not one absence but <b>a different absence per kind</b> is
      the plate.
  trace:
    - ko: >-
        {{site.line}}행은 「아무것도 없다」는 값을 놓는다.
      en: >-
        Line {{site.line}} puts down the value meaning "nothing here".
    - ko: >-
        무엇이 되는지는 <b>받는 자리의 종류</b>가 정한다.
      en: >-
        What it becomes is settled by <b>the kind of the receiving slot</b>.
    - ko: >-
        종류마다 그다음에 할 수 있는 일이 다르다.
      en: >-
        What may be done next differs by that kind.

rule:
  ko: >-
    <b>하나의 없음이 아니다.</b> 여섯 종류에서 할 수 있는 일이 서로 다르다.
  en: >-
    <b>It is not one absence.</b> What it permits differs across six kinds.
result:
  label: { ko: "{{site.line}}행이 놓은 값", en: "the value put down on line {{site.line}}" }
  value: "{{pick.1}}"
  note: { ko: "무엇이 되는지는 받는 자리가 정한다", en: "the receiving slot settles what it becomes" }
ok:
  ko: >-
    받는 자리의 종류가 이 값이 무엇이 될지를 정합니다.
  en: >-
    The kind of the receiving slot settles what this value becomes.
payoff:
  ko: >-
    이걸 알면 「같은 값인데 왜 어떤 데선 되고 어떤 데선 죽나」가 풀립니다 — 종류가 다릅니다.
  en: >-
    This untangles "the same value works here and dies there" — the kinds differ.
bridge:
  ko: >-
    자바의 <code>null</code> 은 참조에만 붙습니다. Go 의 이 값은 <b>여섯 종류</b>에 붙고 종류마다 규칙이 달라요.
  en: >-
    Java's <code>null</code> attaches to references only. This value attaches to <b>six kinds</b>,
    each with its own rules.
misconceptions:
  - ko: >-
      이 값이면 아무것도 못 한다 — 창은 붙이기가 되고 열쇠 묶음은 읽기가 됩니다.
    en: >-
      Nothing can be done with it — a window still appends and a keyed bundle still reads.
  - ko: >-
      어디서든 같은 뜻이다 — 종류마다 다릅니다. 채널이면 주고받기가 영원히 멈춰요.
    en: >-
      It means the same everywhere — it differs by kind. On a channel a send or receive blocks
      forever.

point:
  - q:
      ko: >-
        {{site.line}}행에서 <b>「아무것도 없다」를 뜻하는 값</b>을 짚어 보세요.
      en: >-
        On line {{site.line}}, point at <b>the value meaning "nothing here"</b>.
    hint: { ko: "점선이 그어진 곳을 클릭하거나 <kbd>←</kbd> <kbd>→</kbd> 로 옮겨 가며 고릅니다.", en: "Click a dotted spot, or move between them with <kbd>←</kbd> <kbd>→</kbd> and choose." }
    answer: pick.1
    diag:
      pick.2:
        t:
          ko: >-
            {{pick.2|code}}{{pick.2|josa:은,는}} 값을 <b>받는 쪽</b>입니다. 받는 쪽의 종류가 뜻을 정하기는 하지만 그 자체가 그 값은 아니에요.
          en: >-
            {{pick.2|code}} is the <b>receiving side</b>. Its kind settles the meaning, but it is not the
            value itself.
        edge:
          h: { ko: "가장 날카로운 자리 — 받는 쪽이냐 놓이는 값이냐", en: "The sharpest spot — the receiver or the value" }
          code:
            - "conn = nil        // conn 이 받는다"
            - "nil               // 놓이는 값"
      pick.3:
        t: { ko: "{{pick.3|code}}{{pick.3|josa:은,는}} 맥락일 뿐 놓이는 값이 아닙니다.", en: "{{pick.3|code}} is context, not the value being put down." }
        edge:
          h: { ko: "가장 날카로운 자리 — 맥락이냐 값이냐", en: "The sharpest spot — context or value" }
          code:
            - "=                 // 맥락"
            - "nil               // 값"

blank:
  - q:
      ko: >-
        빈칸에 들어갈 것을 고르세요. {{site.line}}행은 <b>아무것도 없음</b>을 놓습니다.
      en: >-
        Choose what goes in the blank. Line {{site.line}} puts down <b>nothing here</b>.
    hint: { ko: "고르는 즉시 코드에 써집니다. 제출하면 채점합니다.", en: "Your choice is written into the code at once. Submit to have it marked." }
    options:
      - { t: "nil", mono: true }
      - t: "null"
        mono: true
        diag:
          t:
            ko: >-
              이 낱말은 Go 에 <b>없습니다</b>. 자바·자바스크립트에서 오는 손이 여기서 멈춰요.
            en: >-
              Go <b>does not have</b> this word. A hand trained on Java or JavaScript stops here.
          edge:
            h: { ko: "가장 날카로운 자리 — 낱말이 있나 없나", en: "The sharpest spot — does the word exist" }
            code:
              - "return nil"
              - "return null      // 멈춘다"
      - t: "0"
        mono: true
        diag:
          t:
            ko: >-
              이건 <b>수</b>입니다. 수를 받는 자리에는 맞지만 창·묶음·채널 자리에는 못 들어가요.
            en: >-
              That is a <b>number</b>. It fits a number slot and not a window, a bundle or a channel.
          edge:
            h: { ko: "가장 날카로운 자리 — 수냐 없음이냐", en: "The sharpest spot — a number or an absence" }
            code:
              - "var n int = 0"
              - "var xs []int = nil"
      - t: "\"\""
        mono: true
        diag:
          t:
            ko: >-
              이건 <b>빈 글자 묶음</b>이라 글자 자리에만 맞습니다. 없음과는 다른 값이에요.
            en: >-
              That is <b>empty text</b> and fits only a text slot. It is a different value from absence.
          edge:
            h: { ko: "가장 날카로운 자리 — 빈 값이냐 없음이냐", en: "The sharpest spot — an empty value or an absence" }
            code:
              - "var s string = \"\""
              - "var xs []int = nil"

why_gate:
  q:
    ko: >-
      Go 는 왜 <b>여섯 종류</b>에 같은 낱말을 쓸까요?
    en: >-
      Why does Go use the same word for <b>six kinds</b>?
  choices:
    - t:
        ko: >-
          여섯 다 「가리킬 곳이 아직 없다」는 같은 상태이고, 종류마다 낱말을 나누면 제로 값이 무엇인지를 종류마다 외워야 하기 때문
        en: >-
          Because all six are the same state of "nothing to point at yet", and separate words would mean
          memorising a zero value per kind
      ok: true
      fb:
        ko: >-
          그 방향입니다. 그럼 같은 낱말이라서 생기는 함정도 하나 적어 보세요.
        en: >-
          That is the direction. Add one trap that comes of the shared word.
    - t:
        ko: >-
          여섯이 전부 포인터라서
        en: >-
          Because all six are pointers
      ok: false
      fb:
        ko: >-
          전부는 아닙니다. 창은 포인터·길이·용량 셋이고 인터페이스는 타입과 값 둘이에요.
        en: >-
          Not all. A window is a pointer, a length and a capacity; an interface is a type and a value.
    - t:
        ko: >-
          낱말을 아끼려고
        en: >-
          To save on words
      ok: false
      fb:
        ko: >-
          낱말 수가 이유는 아닙니다. 같은 상태를 하나로 부르는 것이 이유예요.
        en: >-
          Word count is not the reason. Naming one state once is.

queries:
  - { grammars: [go], file: ./nil.scm }

examples:
  - code: "func f() error { return nil }"
    expect: { sites: 1, form: ret, hole: "nil", picks: { 1: "nil" } }
  - code: "func f(c Conn) { c.conn = nil }"
    expect: { sites: 1, form: assign, hole: "nil", picks: { 1: "nil", 2: "c.conn", 3: "=" } }
  - code: "func f(h Handler) { h.Serve(nil) }"
    expect: { sites: 1, form: arg, hole: "nil", picks: { 1: "nil", 2: "Serve", 3: "h" } }
  - code: "func f(err error) { if err != nil { println(1) } }"
    expect: none
